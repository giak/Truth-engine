<text x="1200" y="278" class="sub" text-anchor="middle" style="font-size:29px">De la définition internationale au titre de presse, 5 étages,</text>
<text x="1200" y="316" class="sub" text-anchor="middle" style="font-size:29px">et un seul disparaît sans trace.</text>
<desc>Insee IR n° 192 du 7 août 2026 et sa légende ; Mediapart, fil du 7 août 2026 ; Le Figaro, 7 août 2026 ; franceinfo, 7 août 2026 ; audit de médiation du 22 septembre 2026.</desc>

<line x1="100" y1="460" x2="440" y2="460" stroke="#555555" stroke-width="1.7"/>
<text x="270.0" y="525.5" class="head" text-anchor="middle" style="font-size:35px">Chômeur</text>

<text x="270.0" y="595.5" class="body" text-anchor="middle" style="font-size:26px">sans emploi</text>

<text x="270.0" y="711.5" class="small" text-anchor="middle" style="font-size:22px">interrogées par trimestre</text>
<text x="270.0" y="742" class="note" text-anchor="middle" style="font-size:24px">4 définitions concurrentes</text>
<rect x="525" y="390" width="400" height="380" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>

<text x="725.0" y="742" class="note" text-anchor="middle" style="font-size:24px">la marge est produite</text>

<text x="1180.0" y="682.0" class="small" text-anchor="middle" style="font-size:22px">la publication suivante</text>
<text x="1180.0" y="713.0" class="small" text-anchor="middle" style="font-size:22px">est annoncée à 07h30</text>
<text x="1180.0" y="742" class="note" text-anchor="middle" style="font-size:24px">l'heure est un rituel</text>
<rect x="1435" y="390" width="400" height="380" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>

<text x="1635.0" y="595.5" class="body" text-anchor="middle" style="font-size:26px">dépêche horodatée 08h00</text>
<text x="1635.0" y="628.5" class="body" text-anchor="middle" style="font-size:26px">« sixième trimestre</text>

<text x="1635.0" y="686.5" class="small" text-anchor="middle" style="font-size:22px">contrefactuel ministériel :</text>
<text x="1635.0" y="711.5" class="small" text-anchor="middle" style="font-size:22px">7,9 %</text>

<text x="2090.0" y="681.0" class="small" text-anchor="middle" style="font-size:22px">la marche d'un trimestre</text>
<text x="2090.0" y="713.0" class="small" text-anchor="middle" style="font-size:22px">tient dans la marge</text>

<text x="1200" y="903.0" class="synth" text-anchor="middle" style="font-size:34px">Le chiffre naît avec sa marge.</text>
<text x="1200" y="949.0" class="synth" text-anchor="middle" style="font-size:34px">Il la perd avant le petit déjeuner.</text>
<text x="1200" y="1104" class="concl" text-anchor="middle" style="font-size:48px">Presque tout est publié. Presque rien n'en est dit.</text>
<line x1="90" y1="1410" x2="2310" y2="1410" stroke="#111111" stroke-width="2.4"/>
<text x="90" y="1460" class="small" style="font-size:21px">Sources : Insee, IR n° 192 et légende du tableau ; franceinfo, 7 août 2026 ; Le Figaro, 7 août 2026 ; audit de médiation du 22/09/2026.</text>

<text x="90" y="78" class="kicker">FIG. 02  ·  LES DÉFINITIONS DU CHÔMAGE</text>
<text x="2310" y="78" class="kicker" text-anchor="end">DOSSIER INSEE</text>
<line x1="90" y1="112" x2="2310" y2="112" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="214" class="title" text-anchor="middle" style="font-size:60px">4 nombres officiels pour un seul mot</text>
<text x="1200" y="278" class="sub" text-anchor="middle" style="font-size:29px">France hors Mayotte, 2022. Les 4 ensembles se recoupent</text>
<text x="1200" y="316" class="sub" text-anchor="middle" style="font-size:29px">partiellement : ils ne s'emboîtent pas.</text>
<desc>Insee Flash Pays de la Loire n° 140, 31 août 2023 ; Insee, page définitions du chômage.</desc>

<text x="334" y="415.0" class="tag" style="font-size:24px">MESURE 1</text>
<text x="334" y="449.0" class="tag" style="font-size:24px">BIT</text>
<text x="590" y="415.0" class="body" style="font-size:26px">sans emploi, disponible, en recherche active</text>
<text x="590" y="453.0" class="note" style="font-size:23px">mesuré auprès de 110 000 personnes par trimestre</text>
<text x="2066" y="433.0" class="verdict" text-anchor="end" style="font-size:28px">2,23 M</text>
<rect x="310" y="500" width="1780" height="126" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>

<text x="334" y="589.0" class="tag" style="font-size:24px">HALO</text>
<text x="590" y="555.0" class="body" style="font-size:26px">souhaite travailler sans remplir tous les critères</text>
<text x="590" y="593.0" class="note" style="font-size:23px">inférieur au BIT : les ensembles se recoupent sans s'emboîter</text>
<text x="2066" y="573.0" class="verdict" text-anchor="end" style="font-size:28px">1,86 M</text>
<rect x="310" y="640" width="1780" height="126" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>

<text x="334" y="729.0" class="tag" style="font-size:24px">CATÉGORIE A</text>
<text x="590" y="695.0" class="body" style="font-size:26px">inscrits sur les listes de Pôle emploi, devenu France Travail</text>
<text x="590" y="733.0" class="note" style="font-size:23px">mesure administrative, et la plus haute des deux mesures du chômage</text>
<text x="2066" y="713.0" class="verdict" text-anchor="end" style="font-size:28px">3,14 M</text>
<rect x="310" y="780" width="1780" height="126" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<rect x="310" y="780" width="250" height="126" fill="#f3f3f3"/>
<line x1="560" y1="780" x2="560" y2="906" stroke="#111111" stroke-width="2.4"/>
<text x="334" y="835.0" class="tag" style="font-size:24px">MESURE 4</text>
<text x="334" y="869.0" class="tag" style="font-size:24px">RECENSEMENT</text>
<text x="590" y="835.0" class="body" style="font-size:26px">auto-déclaration de 14 à 70 ans</text>
<text x="590" y="873.0" class="note" style="font-size:23px">réservée aux comparaisons de structure : non comparable en niveau</text>
<text x="2066" y="853.0" class="verdict" text-anchor="end" style="font-size:28px">plus élevé</text>
<rect x="310" y="926" width="1780" height="150" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="340" y="970" class="tag" style="font-size:24px">2010-2022 : LES DEUX MESURES DIVERGENT</text>
<line x1="340" y1="988" x2="2060" y2="988" stroke="#555555" stroke-width="1.7"/>
<text x="340" y="1032" class="head" style="font-size:33px">BIT : moins 2 points</text>
<text x="2060" y="1032" class="head" text-anchor="end" style="font-size:33px">catégorie A : plus 5 %</text>
<text x="340" y="1062" class="note" style="font-size:23px">Écart attribué par le producteur à des réformes intervenant « indépendamment de la situation réelle ».</text>
<rect x="90" y="1090" width="2220" height="150" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="1153.0" class="synth" text-anchor="middle" style="font-size:34px">4 chiffres officiels, la même année, la même maison.</text>
<text x="1200" y="1199.0" class="synth" text-anchor="middle" style="font-size:34px">Aucun n'est faux. Aucun n'est le même.</text>

<text x="590" y="464.0" class="note" style="font-size:23px">Base indexée : environ 500 Md€ de prestations sociales</text>

<line x1="1428.0" y1="510" x2="1428.0" y2="558" stroke="#111111" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="1883.0" y1="510" x2="1883.0" y2="558" stroke="#111111" stroke-width="3.0" marker-end="url(#arrow)"/>

<text x="348" y="616" class="tag" style="font-size:24px">VANNE 1 · 2005</text>
<line x1="348" y1="640" x2="688" y2="640" stroke="#555555" stroke-width="1.7"/>
<text x="518.0" y="710.0" class="head" text-anchor="middle" style="font-size:35px">Loyers</text>
<text x="518.0" y="758.0" class="body" text-anchor="middle" style="font-size:26px">hors tabac, hors loyers</text>
<text x="518.0" y="798.0" class="body" text-anchor="middle" style="font-size:24px">remplace l'indice du coût</text>
<text x="518.0" y="838.0" class="body" text-anchor="middle" style="font-size:24px">de la construction en 2006</text>
<text x="518.0" y="878.0" class="body" text-anchor="middle" style="font-size:21px">plafonné à 3,5 % en 2022-2024</text>
<text x="518.0" y="912.0" class="small" text-anchor="middle" style="font-size:22px">environ 1,5 à 2 Md€ par an</text>
<text x="518.0" y="944.0" class="small" text-anchor="middle" style="font-size:22px">vers les locataires</text>
<text x="518.0" y="972" class="note" text-anchor="middle" style="font-size:18px">7 millions de ménages du parc privé</text>
<rect x="773" y="570" width="400" height="430" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="803" y="616" class="tag" style="font-size:24px">VANNE 2 · 2026</text>
<line x1="803" y1="640" x2="1143" y2="640" stroke="#555555" stroke-width="1.7"/>
<text x="973.0" y="732.0" class="head" text-anchor="middle" style="font-size:35px">Impôt</text>
<text x="973.0" y="798.0" class="body" text-anchor="middle" style="font-size:26px">dérive : 8 années sur 13</text>
<text x="973.0" y="838.0" class="body" text-anchor="middle" style="font-size:26px">gel voté pour 2026</text>
<text x="973.0" y="890.0" class="small" text-anchor="middle" style="font-size:22px">environ 2 Md€ pour l'État</text>
<text x="973.0" y="922.0" class="small" text-anchor="middle" style="font-size:22px">200 000 foyers imposables</text>
<text x="973.0" y="972" class="note" text-anchor="middle" style="font-size:18px">cumul défavorable : moins 4,1 points</text>
<rect x="1228" y="570" width="400" height="430" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text x="1258" y="616" class="tag" style="font-size:24px">VANNE 3 · 1987</text>
<line x1="1258" y1="640" x2="1598" y2="640" stroke="#555555" stroke-width="1.7"/>
<text x="1428.0" y="732.0" class="head" text-anchor="middle" style="font-size:35px">Retraites</text>
<text x="1428.0" y="798.0" class="body" text-anchor="middle" style="font-size:26px">des salaires aux prix</text>
<text x="1428.0" y="838.0" class="body" text-anchor="middle" style="font-size:26px">basculées en 1987</text>
<text x="1428.0" y="890.0" class="small" text-anchor="middle" style="font-size:22px">environ 4 Md€ par an</text>
<text x="1428.0" y="922.0" class="small" text-anchor="middle" style="font-size:19px">des retraités vers les cotisants</text>
<text x="1428.0" y="972" class="note" text-anchor="middle" style="font-size:20px">bascule de la règle d'indexation</text>
<rect x="1683" y="570" width="400" height="430" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="1713" y="616" class="tag" style="font-size:24px">VANNE 4 · 2026</text>
<line x1="1713" y1="640" x2="2053" y2="640" stroke="#555555" stroke-width="1.7"/>
<text x="1883.0" y="732.0" class="head" text-anchor="middle" style="font-size:35px">Salaire minimum</text>
<text x="1883.0" y="798.0" class="body" text-anchor="middle" style="font-size:26px">indexé sur l'indice</text>
<text x="1883.0" y="838.0" class="body" text-anchor="middle" style="font-size:26px">des prix, au 1er juin</text>
<text x="1883.0" y="890.0" class="small" text-anchor="middle" style="font-size:22px">12,31 € l'heure</text>
<text x="1883.0" y="922.0" class="small" text-anchor="middle" style="font-size:22px">depuis le 1er juin 2026</text>
<text x="1883.0" y="972" class="note" text-anchor="middle" style="font-size:24px">arrêté du 22 mai 2026</text>
<rect x="90" y="1040" width="2220" height="200" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="1105.0" class="synth" text-anchor="middle" style="font-size:34px">Aucune de ces vannes n'est tournée par l'institut. L'IRL est défini par la loi,</text>
<text x="1200" y="1151.0" class="synth" text-anchor="middle" style="font-size:34px">le plafond voté par le Parlement, le barème fixé en loi de finances,</text>
<text x="1200" y="1197.0" class="synth" text-anchor="middle" style="font-size:34px">les retraites décidées par décret.</text>
<text x="1200" y="1330" class="concl" text-anchor="middle" style="font-size:48px">5 décisions, aucun tourneur commun : la manivelle est dans le droit.</text>
<line x1="90" y1="1410" x2="2310" y2="1410" stroke="#111111" stroke-width="2.4"/>
<text x="90" y="1460" class="small" style="font-size:16px">Sources : Trésor-Info du 05/07/2022 (verbatim « près de 5 Md€ ») ; FIPECO ; loi 2005-841 art. 35 ; loi 2022-1158 art. 12 ; loi de finances pour 2026 ; arrêté SMIC du 22/05/2026.</text>
<text x="2310" y="1460" class="small" text-anchor="end" style="font-size:22px">Dossier Insee · 23 septembre 2026</text>

<title>Deux régimes d'erreur qu'il ne faut pas confondre</title>
<defs>

<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#c8c8c8" stroke-width="4"/></pattern>
<style><![CDATA[
  .rm{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","Times New Roman",serif;fill:#111111;}
  .sf{font-family:"Latin Modern Sans","LM Sans 10","TeX Gyre Heros",Arial,sans-serif;fill:#111111;}

<rect x="0" y="0" width="2400" height="1500" fill="#ffffff"/>
<text x="90" y="78" class="kicker">FIG. 04  ·  RÉVISIONS DES COMPTES</text>
<text x="2310" y="78" class="kicker" text-anchor="end">DOSSIER INSEE</text>
<line x1="90" y1="112" x2="2310" y2="112" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="214" class="title" text-anchor="middle" style="font-size:60px">Deux régimes d'erreur qu'il ne faut pas confondre</text>
<text x="1200" y="278" class="sub" text-anchor="middle" style="font-size:29px">La révision pousse à la hausse ; l'erreur de recettes, elle, va dans les deux sens.</text>
<text x="1200" y="316" class="sub" text-anchor="middle" style="font-size:29px">Plus forte révision depuis 2003, pour une année dont tout le monde avait conclu.</text>
<desc>Comptes de la Nation 2023 et 2024 ; Insee Première n° 2105 et son erratum du 29 mai 2026 ; note de révisions du 3 juin 2026 ; Cour des comptes, 22 avril 2026 ; Trésor-Éco n° 356 ; Rexecode.</desc>
<rect x="170" y="390" width="980" height="620" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="200" y="436" class="tag" style="font-size:24px">RÉGIME 1  RÉVISIONS DE CROISSANCE</text>
<line x1="200" y1="460" x2="1120" y2="460" stroke="#555555" stroke-width="1.7"/>
<text x="660.0" y="631.0" class="head" text-anchor="middle" style="font-size:35px">Un biais orienté</text>
<text x="660.0" y="697.0" class="body" text-anchor="middle" style="font-size:26px">+ 0,34 point en moyenne</text>
<text x="660.0" y="737.0" class="body" text-anchor="middle" style="font-size:26px">sur 20 ans, à la hausse</text>
<text x="660.0" y="789.0" class="small" text-anchor="middle" style="font-size:22px">le premier chiffre n'est pas faux :</text>
<text x="660.0" y="821.0" class="small" text-anchor="middle" style="font-size:22px">il est provisoire, ses corrections</text>
<text x="660.0" y="853.0" class="small" text-anchor="middle" style="font-size:22px">vont dans un seul sens</text>
<text x="660.0" y="982" class="note" text-anchor="middle" style="font-size:24px">Rexecode, institut de conjoncture privé</text>
<rect x="1250" y="390" width="980" height="620" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text x="1280" y="436" class="tag" style="font-size:24px">RÉGIME 2  SURPRISES DE RECETTES</text>
<line x1="1280" y1="460" x2="2200" y2="460" stroke="#555555" stroke-width="1.7"/>
<text x="1740.0" y="627.0" class="head" text-anchor="middle" style="font-size:35px">Des erreurs dans les deux sens</text>
<text x="1740.0" y="693.0" class="body" text-anchor="middle" style="font-size:26px">2025 : 5,4 % prévu, 5,1 % réalisé</text>
<text x="1740.0" y="733.0" class="body" text-anchor="middle" style="font-size:26px">déficit : 161 puis 152,5 Md€</text>
<text x="1740.0" y="773.0" class="body" text-anchor="middle" style="font-size:26px">30,7 Md€ de recettes, dont 13,0 spontanées</text>
<text x="1740.0" y="825.0" class="small" text-anchor="middle" style="font-size:22px">2023-2024 : recettes déçues,</text>
<text x="1740.0" y="857.0" class="small" text-anchor="middle" style="font-size:22px">2,6 % contre 6,3 % de PIB nominal</text>
<text x="1740.0" y="982" class="note" text-anchor="middle" style="font-size:24px">elles ne s'additionnent pas, elles s'annulent</text>
<rect x="90" y="1050" width="2220" height="170" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="1123.0" class="synth" text-anchor="middle" style="font-size:34px">Ce que laissent ces deux régimes d'erreur, ce n'est pas</text>
<text x="1200" y="1169.0" class="synth" text-anchor="middle" style="font-size:34px">un programme, mais un problème de transmission.</text>
<text x="1200" y="1324" class="concl" text-anchor="middle" style="font-size:48px">Le chiffre du matin a eu tout le pays.</text>
<line x1="90" y1="1410" x2="2310" y2="1410" stroke="#111111" stroke-width="2.4"/>
<text x="90" y="1460" class="small" style="font-size:17px">Sources : comptes 2023 et 2024 ; Insee Première n° 2105 et erratum du 29/05/2026 ; note de révisions du 03/06/2026 ; Cour des comptes du 22/04/2026 ; Rexecode.</text>
<text x="2310" y="1460" class="small" text-anchor="end" style="font-size:22px">Dossier Insee · 23 septembre 2026</text>
</svg>
<figcaption><strong>FIG. 04 · Deux régimes d'erreur qu'il ne faut pas confondre : les révisions de croissance penchent à la hausse, les surprises de recettes vont dans les deux sens</strong><div class="meta">fichier fig04_revisions.svg</div></figcaption></figure>

<title>6 accusations, 2 survivantes de forme faible</title>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#c8c8c8" stroke-width="4"/></pattern>
<style><![CDATA[
  .rm{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","Times New Roman",serif;fill:#111111;}

  .kicker{font-size:27px;letter-spacing:2.6px;font-weight:700;}
  .title{font-size:60px;font-weight:500;}
  .sub{font-size:29px;fill:#3d3d3d;}
  .tag{font-size:24px;font-weight:700;letter-spacing:1.3px;}
  .head{font-size:35px;font-weight:500;}

  .small{font-size:22px;fill:#444444;}

]]></style>

<rect x="0" y="0" width="2400" height="1500" fill="#ffffff"/>
<text x="90" y="78" class="kicker">FIG. 05  ·  CONTRE-ÉPREUVE</text>
<text x="2310" y="78" class="kicker" text-anchor="end">DOSSIER INSEE</text>
<line x1="90" y1="112" x2="2310" y2="112" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="214" class="title" text-anchor="middle" style="font-size:60px">6 accusations, 2 survivantes de forme faible</text>
<text x="1200" y="278" class="sub" text-anchor="middle" style="font-size:29px">Ce que nous espérions, ce que nous avons trouvé, ce qu'il en reste :</text>
<text x="1200" y="316" class="sub" text-anchor="middle" style="font-size:29px">H2, avec un gagnant par convention ; H3, l'opacité d'expertise.</text>
<desc>Contre-épreuve conduite du 20 au 23 septembre 2026 ; pièces citées : Eurostat (revue par les pairs, 2021), Autorité de la statistique publique (2024), Cour des comptes.</desc>
<rect x="310" y="360" width="1780" height="156" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<rect x="310" y="360" width="300" height="156" fill="#f3f3f3"/>
<line x1="610" y1="360" x2="610" y2="516" stroke="#111111" stroke-width="2.4"/>
<text x="334" y="430.0" class="tag" style="font-size:24px">H1</text>
<text x="334" y="464.0" class="tag" style="font-size:24px">MENSONGE</text>
<text x="640" y="415.0" class="body" style="font-size:26px">espéré : le scandale</text>
<text x="640" y="453.0" class="note" style="font-size:22px">trouvé : méthodologies complètes, erratum le jour même, indices alternatifs publiés,</text>
<text x="640" y="483.0" class="note" style="font-size:23px">pression ministérielle de 2021 résistée</text>
<text x="2066" y="436.0" class="verdict" text-anchor="end" style="font-size:28px">morte</text>
<text x="2066" y="472.0" class="small" text-anchor="end" style="font-size:15px">absence de contre-preuve, non preuve d'intégrité</text>
<rect x="310" y="532" width="1780" height="126" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<rect x="310" y="532" width="300" height="126" fill="#f3f3f3"/>
<line x1="610" y1="532" x2="610" y2="658" stroke="#111111" stroke-width="2.4"/>
<text x="334" y="587.0" class="tag" style="font-size:24px">H2</text>
<text x="334" y="621.0" class="tag" style="font-size:21px">BÉNÉFICIAIRE UNIQUE</text>
<text x="640" y="587.0" class="body" style="font-size:26px">espéré : le siphon</text>
<text x="640" y="625.0" class="note" style="font-size:23px">trouvé : chaque groupe gagne et perd selon la convention et l'année</text>
<text x="2066" y="593.0" class="verdict" text-anchor="end" style="font-size:28px">morte</text>
<text x="2066" y="629.0" class="small" text-anchor="end" style="font-size:15px">survit en version faible : chaque convention a un gagnant</text>
<rect x="310" y="674" width="1780" height="156" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<rect x="310" y="674" width="300" height="156" fill="#f3f3f3"/>
<line x1="610" y1="674" x2="610" y2="830" stroke="#111111" stroke-width="2.4"/>
<text x="334" y="744.0" class="tag" style="font-size:24px">H3</text>
<text x="334" y="778.0" class="tag" style="font-size:24px">OPACITÉ</text>
<text x="640" y="729.0" class="body" style="font-size:26px">espéré : des documents cachés</text>
<text x="640" y="767.0" class="note" style="font-size:22px">trouvé : opacité d'expertise, intervalle absent de 19 articles, rapports Eurostat non</text>
<text x="640" y="797.0" class="note" style="font-size:23px">publiés, labellisation suspendue</text>
<text x="2066" y="750.0" class="verdict" text-anchor="end" style="font-size:28px">reformulée</text>
<text x="2066" y="786.0" class="small" text-anchor="end" style="font-size:18px">accès différencié, non dissimulation</text>
<rect x="310" y="846" width="1780" height="126" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<rect x="310" y="846" width="300" height="126" fill="#f3f3f3"/>
<line x1="610" y1="846" x2="610" y2="972" stroke="#111111" stroke-width="2.4"/>
<text x="334" y="901.0" class="tag" style="font-size:24px">H4</text>
<text x="334" y="935.0" class="tag" style="font-size:24px">PIB MAQUILLÉ</text>
<text x="640" y="901.0" class="body" style="font-size:26px">espéré : le maquillage</text>
<text x="640" y="939.0" class="note" style="font-size:23px">trouvé : PIB 2025 non révisé, surprise venue des recettes</text>
<text x="2066" y="907.0" class="verdict" text-anchor="end" style="font-size:28px">réfutée</text>
<text x="2066" y="943.0" class="small" text-anchor="end" style="font-size:17px">95 % de numérateur, aucun dénominateur</text>
<rect x="310" y="988" width="1780" height="126" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<rect x="310" y="988" width="300" height="126" fill="#f3f3f3"/>
<line x1="610" y1="988" x2="610" y2="1114" stroke="#111111" stroke-width="2.4"/>
<text x="334" y="1043.0" class="tag" style="font-size:24px">H5</text>
<text x="334" y="1077.0" class="tag" style="font-size:24px">PÉRIMÈTRE</text>
<text x="640" y="1043.0" class="body" style="font-size:26px">espéré : des dettes dissimulées</text>
<text x="640" y="1081.0" class="note" style="font-size:23px">trouvé : cessions de titres, aucune sortie d'entité documentée de 2010 à 2025</text>
<rect x="1680" y="994" width="400" height="114" fill="url(#hatch)"/>
<text x="2066" y="1049.0" class="verdict" text-anchor="end" style="font-size:28px">close</text>
<text x="2066" y="1085.0" class="small" text-anchor="end" style="font-size:15px">grief déplacé : aucun raccord public de série, plus de 100 Md€ de marches</text>
<rect x="310" y="1130" width="1780" height="126" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<rect x="310" y="1130" width="300" height="126" fill="#f3f3f3"/>
<line x1="610" y1="1130" x2="610" y2="1256" stroke="#111111" stroke-width="2.4"/>
<text x="334" y="1185.0" class="tag" style="font-size:24px">H6</text>
<text x="334" y="1219.0" class="tag" style="font-size:24px">LOYERS IMPUTÉS</text>
<text x="640" y="1185.0" class="body" style="font-size:26px">espéré : l'inflation cachée</text>
<text x="640" y="1223.0" class="note" style="font-size:23px">trouvé : Focus n° 152, avec les loyers l'indice est plus bas : 1,6 % contre 1,8 %</text>
<rect x="1680" y="1136" width="400" height="114" fill="url(#hatch)"/>
<text x="2066" y="1191.0" class="verdict" text-anchor="end" style="font-size:28px">tuée</text>
<text x="2066" y="1227.0" class="small" text-anchor="end" style="font-size:19px">tuée par la publication de l'accusé</text>
<text x="1200" y="1330" class="concl" text-anchor="middle" style="font-size:48px">6 accusations. 2 survivantes, de forme faible.</text>
<line x1="90" y1="1410" x2="2310" y2="1410" stroke="#111111" stroke-width="2.4"/>
<text x="90" y="1460" class="small" style="font-size:16px">Sources : Insee Focus n° 152 (18/04/2019) ; revue par les pairs d'Eurostat (2021) ; Autorité de la statistique publique (rapport annuel 2024) ; Cour des comptes du 22/04/2026.</text>

<figure><svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
<title>4 questions pour lire un chiffre, 4 conditions pour nous révoquer</title>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#c8c8c8" stroke-width="4"/></pattern>
<style><![CDATA[
  .rm{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","Times New Roman",serif;fill:#111111;}
  .sf{font-family:"Latin Modern Sans","LM Sans 10","TeX Gyre Heros",Arial,sans-serif;fill:#111111;}

<rect x="0" y="0" width="2400" height="1500" fill="#ffffff"/>
<text x="90" y="78" class="kicker">FIG. 06  ·  GRILLE DE LECTURE ET RÉVOCATION</text>
<text x="2310" y="78" class="kicker" text-anchor="end">DOSSIER INSEE</text>
<line x1="90" y1="112" x2="2310" y2="112" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="214" class="title" text-anchor="middle" style="font-size:60px">4 questions pour lire un chiffre, 4 conditions pour nous révoquer</text>
<text x="1200" y="278" class="sub" text-anchor="middle" style="font-size:29px">Applicables à n'importe quel chiffre officiel, y compris aux nôtres ;</text>
<text x="1200" y="316" class="sub" text-anchor="middle" style="font-size:29px">publiées avec leur date, pour qu'on puisse nous tenir au mot.</text>
<desc>Insee (Flash n° 140, IR n° 192 et sa légende, fiche de précision du recensement) ; ERFS 2024 ; Cour des comptes ; notes de révision des comptes ; protocole d'audit adversarial du dépôt, version 1, et verdict consolidé du 22 septembre 2026.</desc>
<rect x="318" y="380" width="400" height="430" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text x="348" y="426" class="tag" style="font-size:24px">1  LA DÉFINITION</text>
<line x1="348" y1="450" x2="688" y2="450" stroke="#555555" stroke-width="1.7"/>
<text x="518.0" y="518.0" class="head" text-anchor="middle" style="font-size:35px">Quel chiffre</text>
<text x="518.0" y="557.0" class="head" text-anchor="middle" style="font-size:35px">pour ce mot ?</text>
<text x="518.0" y="592.0" class="body" text-anchor="middle" style="font-size:26px">« le chômage baisse » :</text>
<text x="518.0" y="627.0" class="body" text-anchor="middle" style="font-size:20px">BIT, catégorie A, recensement ?</text>
<text x="518.0" y="662.0" class="body" text-anchor="middle" style="font-size:24px">« la pauvreté augmente » :</text>
<text x="518.0" y="697.0" class="body" text-anchor="middle" style="font-size:21px">seuil de 40, 50, 60 ou 70 % ?</text>
<text x="518.0" y="724.0" class="small" text-anchor="middle" style="font-size:22px">2,23 / 1,86 / 3,14 M</text>
<text x="518.0" y="751.0" class="small" text-anchor="middle" style="font-size:22px">2,8 à 14,6 M</text>
<text x="518.0" y="782" class="note" text-anchor="middle" style="font-size:16px">un titre qui ne précise pas ne dit rien</text>
<rect x="773" y="380" width="400" height="430" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="803" y="426" class="tag" style="font-size:24px">2  LA MARGE</text>
<line x1="803" y1="450" x2="1143" y2="450" stroke="#555555" stroke-width="1.7"/>
<text x="973.0" y="520.0" class="head" text-anchor="middle" style="font-size:35px">Quel intervalle</text>
<text x="973.0" y="564.0" class="head" text-anchor="middle" style="font-size:27px">accompagne le chiffre ?</text>
<text x="973.0" y="630.0" class="body" text-anchor="middle" style="font-size:19px">8,3 % ± 0,3 point, marge publiée</text>
<text x="973.0" y="670.0" class="body" text-anchor="middle" style="font-size:20px">sous la marge, pas d'événement</text>
<text x="973.0" y="722.0" class="small" text-anchor="middle" style="font-size:18px">recensement : ± 17 500 personnes,</text>
<text x="973.0" y="754.0" class="small" text-anchor="middle" style="font-size:20px">dénominateur absent du document</text>
<text x="973.0" y="782" class="note" text-anchor="middle" style="font-size:19px">un chiffre sans marge est un titre</text>
<rect x="1228" y="380" width="400" height="430" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text x="1258" y="426" class="tag" style="font-size:24px">3  SEUIL ET PÉRIMÈTRE</text>
<line x1="1258" y1="450" x2="1598" y2="450" stroke="#555555" stroke-width="1.7"/>
<text x="1428.0" y="520.0" class="head" text-anchor="middle" style="font-size:35px">Quel seuil,</text>
<text x="1428.0" y="564.0" class="head" text-anchor="middle" style="font-size:35px">quel périmètre ?</text>
<text x="1428.0" y="630.0" class="body" text-anchor="middle" style="font-size:26px">610 Md€ et 356,4 Md€ :</text>
<text x="1428.0" y="670.0" class="body" text-anchor="middle" style="font-size:17px">deux périmètres, aucun des deux faux</text>
<text x="1428.0" y="722.0" class="small" text-anchor="middle" style="font-size:16px">le plus grand n'est pas le plus vrai :</text>
<text x="1428.0" y="754.0" class="small" text-anchor="middle" style="font-size:22px">il est le plus large</text>
<text x="1428.0" y="782" class="note" text-anchor="middle" style="font-size:15px">un chiffre sans périmètre est un malentendu</text>
<rect x="1683" y="380" width="400" height="430" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="1713" y="426" class="tag" style="font-size:24px">4  L'HISTORIQUE</text>
<line x1="1713" y1="450" x2="2053" y2="450" stroke="#555555" stroke-width="1.7"/>
<text x="1883.0" y="520.0" class="head" text-anchor="middle" style="font-size:35px">Que sont devenues</text>
<text x="1883.0" y="564.0" class="head" text-anchor="middle" style="font-size:24px">les versions précédentes ?</text>
<text x="1883.0" y="610.0" class="body" text-anchor="middle" style="font-size:23px">0,9 puis 1,4 puis 1,6 / 1,9</text>
<text x="1883.0" y="650.0" class="body" text-anchor="middle" style="font-size:18px">une refonte qui baisse la pauvreté</text>
<text x="1883.0" y="690.0" class="body" text-anchor="middle" style="font-size:16px">de 0,3 point n'est pas une amélioration</text>
<text x="1883.0" y="722.0" class="small" text-anchor="middle" style="font-size:22px">révisions de croissance :</text>
<text x="1883.0" y="754.0" class="small" text-anchor="middle" style="font-size:22px">+ 0,34 point en moyenne</text>
<text x="1883.0" y="782" class="note" text-anchor="middle" style="font-size:24px">un chiffre a une histoire</text>
<rect x="90" y="850" width="2220" height="270" fill="url(#hatch)" stroke="#111111" stroke-width="2.4"/>
<text x="120" y="898" class="tag" style="font-size:24px">ET POUR NOUS : LES 4 CONDITIONS DE RÉVOCATION</text>
<line x1="120" y1="914" x2="2280" y2="914" stroke="#555555" stroke-width="1.7"/>
<text x="120" y="981" class="tag" style="font-size:22px">EUROSTAT</text>
<text x="430" y="981" class="body" style="font-size:24px">une réservation publiée sur les comptes français</text>
<text x="120" y="1021" class="tag" style="font-size:22px">RÉPLICATION</text>
<text x="430" y="1021" class="body" style="font-size:24px">un échec de réplication du taux de chômage au sens du BIT, par un chercheur indépendant accédant aux microdonnées</text>
<text x="120" y="1061" class="tag" style="font-size:22px">RÉSIDU</text>
<text x="430" y="1061" class="body" style="font-size:24px">un résidu supérieur à 0,3 % du PIB non tracé dans l'identité comptable de la dette</text>
<text x="120" y="1101" class="tag" style="font-size:22px">ASYMÉTRIE</text>
<text x="430" y="1101" class="body" style="font-size:24px">une asymétrie établie dans l'historique des révisions, corrections allant toujours dans le même sens</text>
<rect x="90" y="1140" width="2220" height="130" fill="#f3f3f3" stroke="#111111" stroke-width="2.4"/>
<text x="1200" y="1193.0" class="synth" text-anchor="middle" style="font-size:34px">Lire, puis répondre : les 4 questions d'un côté, nos 4 conditions de l'autre.</text>
<text x="1200" y="1239.0" class="synth" text-anchor="middle" style="font-size:34px">Un institut honnête n'a rien à craindre de lecteurs qui savent lire.</text>
<text x="1200" y="1330" class="concl" text-anchor="middle" style="font-size:48px">Un chiffre a une biographie ; son acte de naissance ne suffit jamais.</text>
<line x1="90" y1="1410" x2="2310" y2="1410" stroke="#111111" stroke-width="2.4"/>
<text x="90" y="1460" class="small" style="font-size:15px">Sources : Insee (IR n° 192 et légende, Flash n° 140, fiche de précision du recensement) ; ERFS 2024 ; Cour des comptes ; note de révisions du 03/06/2026 ; protocole d'audit du dépôt et verdict du 22/09/2026.</text>
<text x="2310" y="1460" class="small" text-anchor="end" style="font-size:22px">Dossier Insee · 23 septembre 2026</text>
</svg>
