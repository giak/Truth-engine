these_centrale: Les 16+ civilisations precolombiennes (Caral, Olmèque, Maya, Teotihuacan,
  Toltèque, Zapotèque, Mixtèque, Inca, Chimú, Moche, Nazca, Tiwanaku, Wari, Aztèque,
  Mississippienne, Pueblo, Hohokam) constituent le REFUTATEUR EN CHEF de l'article
  "3 civilisations". AUCUNE ne pratique la dette monetaire à l'occidentale, AUCUNE
  ne fonctionne sur le modele d'integration dettes/droit/morale europeen. Le Shadow
  Factor 6.4x (16 candidates / 3 selectionnees × 1,2 coefficient eurocentrisme) est
  le plus eleve de toutes les enquetes, ce qui demontre que l'article est victime
  d'un biais de selection ARCHITECTURAL, pas accidentel.
theses_implicites:
- L'isolement geographique des Amériques (1492) a permis des systemes alternatifs
  SANS dette
- 'Le concept de ''civilisation'' est eurocentre (implicite : seules les civilisations
  avec ecriture alphabetique et dette documentee ''comptent'')'
- 'La capture peut s''exercer SANS dette : monopole d''information (quipu), monopole
  foncier (Sapa Inca proprietaire), tribut en nature (azteque)'
