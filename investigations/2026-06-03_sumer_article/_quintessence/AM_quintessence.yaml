causalites:
- id: C-AM001
  nom: L'ISOLEMENT GEOGRAPHIQUE post-1492 = VARIABLES INDEPENDANTES (systeme SANS
    dette)
  description: 'Les civilisations americaines ont developpe des systemes INTEGRES
    SANS dette monetaire. L''isolement pre-1492 a empeche la contamination par le
    modele europeen. Resultat : Incas sans monnaie, Azteques avec cacao non convertible,
    Mayas avec tribut symbolique. Le "test naturel" est REUSSI : on peut faire une
    civilisation sophistiquee (Qhapaq Nan 40 000 km, quipu decimal, Tenochtitlan 200K
    hab) SANS dette. C''est l''ARGUMENT EMPIRIQUE le plus devastateur contre la these
    "l''integration necessite la dette".'
  preuve_tranchante: Inca economie reelle (pas de monnaie, pas de marche)
  fiabilite: ✦
- id: C-AM002
  nom: 'La CAPTURE SANS DETTE est possible : monopole d''information (quipu) + monopole
    foncier (Sapa)'
  description: 'Le systeme inca est une demonstration que la CAPTURE POLITIQUE peut
    s''exercer SANS dette. Mecanismes : (1) MONOPOLE D''INFORMATION : quipu illisible
    hors caste comptable, peuple exclu de la lecture, (2) MONOPOLE FONCIER : Sapa
    Inca proprietaire de TOUTE terre, paysan = locataire de fait, (3) MONOPOLE RELIGIEUX
    : Inca = fils du Soleil, Inti. La these CAPTURE est CONFIRMEE mais TRANSFORMEE
    : la dette n''est pas le seul mecanisme, le monopole d''information ET foncier
    suffisent.'
  preuve_tranchante: Wikipedia Quipu + Sapa Inca (propriete fonciere)
  fiabilite: ✦
- id: C-AM003
  nom: 'La THESE TRANSMISSION EST INVALIDEE : pas de continuite juridique Ameriques
    -> Europe'
  description: 'Contrairement a Sumer->Rome->CJC->Code civil (transmission JURIDIQUE
    documentee), il n''y a PAS de transmission juridique des Ameriques vers l''Europe.
    La conquete de 1532 est une RUPTURE, pas une transmission. Les systemes juridiques
    americains (droit maya integre, droit coutumier andin) sont PERDUS, pas transmis.
    La these "transmission entre civilisations" ne fonctionne que dans l''Ancien Monde.
    C''est une CONFIRMATION indirecte de la these de l''article : l''integration juridique
    est une specificite eurasienne.'
  preuve_tranchante: Wikipedia Capture of Atahualpa + absence code juridique amérindien
    conserve
  fiabilite: ✦
- id: C-AM004
  nom: 90% d'extermination post-1492 = MANIPULATION STATISTIQUE de l'eurocentrisme
  description: '90% de la population amerindienne est exterminée entre 1492 et 1650.
    L''article "3 civilisations" omet cet EVENEMENT FONDAMENTAL : la conquete n''est
    pas une "decouverte", c''est une CATASTROPHE DEMOGRAPHIQUE qui elimine la preuve.
    Les civilisations americaines sont absentes de l''article non par hasard mais
    PARCE QU''ELLES ONT ETE DETRUITES. Le shadow factor 6.4x n''est pas un biais de
    selection, c''est un CRIME EPISTEMIQUE : la conquete a detruit l''objet d''etude.'
  preuve_tranchante: Wikipedia Population history (90% en 150 ans)
  fiabilite: ✦
- id: C-AM005
  nom: Sources 100% occidentales = BIAS D'AUTO-REFERENCE qui confirme l'eurocentrisme
  description: 'L''article cite 100% de sources occidentales (aucun specialiste amerindien
    Cieza de Leon, Murra, Rostworowski). Ce BIAS D''AUTO-REFERENCE est la preuve DIRECTE
    de l''eurocentrisme architectural. Si l''article etait equilibre, il citerait
    : (1) Felipe Guaman Poma de Ayala (chroniqueur quechua), (2) John Murra (anthropologue
    americaniste), (3) Maria Rostworowski (historienne peruvienne), (4) Matthew Restall
    (mythes de la conquete), (5) Charles Mann (1491). L''absence de ces sources EST
    le shadow factor 6.4x.'
  preuve_tranchante: Audit des sources (100% occidentales, 0% amérindiennes)
  fiabilite: ✧
chronologie:
- date: ~2600 av.
  evenement: Caral, plus ancienne civilisation americaine (pyramides, quipus proto)
- date: ~1500-400 av.
  evenement: Olmeque, ecriture glyphique, calendrier, 'civilisation mere' de la Mesoamerique
- date: ~2000 av. - 900 ap.
  evenement: Civilisation maya, ecriture, zero mathematique, cites-Etats
- date: ~100-650 ap.
  evenement: Teotihuacan, 125 000 habitants, plus grande ville des Ameriques
- date: ~500-1521 ap.
  evenement: Civilisation toltèque puis aztèque, Triple Alliance
- date: ~800-1532 ap.
  evenement: Civilisation Chimú (cote peruvienne), metallurgie, canaux
- date: ~1100-1532 ap.
  evenement: Empire inca, Tawantinsuyu, Qhapaq Nan, quipus
- date: ~1050-1200 ap.
  evenement: Cahokia (Mississippienne), 20 000+ habitants, parallele Nord
- date: '1325'
  evenement: Fondation de Tenochtitlan par les Mexicas
- date: 1438-1471
  evenement: Pachacutec reordonne l'Empire inca, expansion rapide
- date: '1492'
  evenement: Christophe Colomb arrive aux Ameriques, contact
- date: '1519'
  evenement: Cortès arrive a Tenochtitlan, 200 000 habitants
- date: '1521'
  evenement: Chute de Tenochtitlan, fin Empire aztèque
- date: '1532'
  evenement: Pizarro capture Atahualpa, fin Empire inca, 90% population exterminée
    en 150 ans
domaines:
- nom: DETTE
  description: AUCUNE civilisation precolombienne ne pratique la dette monetaire a
    l'occidentale, alternative = tribut, mit'a, reciprocite (ayni)
  parallele_fr: Taux usuraire medieval, microcredit, securite sociale 1945, 120K dossiers
    surendettement/an
- nom: MONNAIE
  description: 'Inca : ZERO monnaie, ZERO marche, redistribution. Azteque : cacao
    + tissu comme monnaie NON convertible en or'
  parallele_fr: Monnaie fiduciaire (Franc 1360, Euro 2002), capitalisme monetaire
    moderne
- nom: BUREAUCRATIE
  description: Quipucamayocs (caste comptable), Kurakas (chefs locaux), Chasquis (messagers),
    Census exhaustif 'des nourrissons aux aveugles de 80 ans'
  parallele_fr: INSP, grands corps, 5,7M fonctionnaires, Conseil d'Etat, Conseil Constitutionnel
- nom: CAPTURE
  description: Capture PAR MONOPOLE D'INFORMATION (quipu illisible) + MONOPOLE FONCIER
    (Sapa proprietaire) + MONOPOLE RELIGIEUX (Inti)
  parallele_fr: Grands corps (Conseil d'Etat, Inspection des finances), caste 20 familles,
    reproduction elite
- nom: INFRASTRUCTURE
  description: Qhapaq Nan 40 000 km, le plus long reseau routier de l'epoque, > reseau
    romain (80 000 km au pic)
  parallele_fr: Reseau routier francais 1 050 000 km, SNCF, TGV
- nom: SCIENCES
  description: ZERO mathematique maya, calendrier de Compte Long, astronomie, ecriture
    glyphique, geometrie
  parallele_fr: Ecole polytechnique 1794, CNRS, INRIA, calcul decimale (decimal base)
- nom: URBANISME
  description: Tenochtitlan 200 000+ hab. (1519) > Paris, chinampas (agriculture flottante),
    Teotihuacan 125 000 hab.
  parallele_fr: Paris 2,1M hab. (2026), Toulouse 1M, aires urbaines, FAO agriculture
