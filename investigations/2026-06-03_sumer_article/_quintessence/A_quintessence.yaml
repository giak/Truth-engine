these_centrale: 'L''andurarum (amargi sum., "retour à l''etat d''origine") est le
  MAILLON FAIBLE de la these centrale de l''article. L''autopsie identifie 5 divergences
  critiques : (1) SEMANTIQUE (Hudson "liberation" vs Charpin "restauration"), (2)
  PORTEE (dettes agricoles SEULES annulees, commerciales EXCLUES), (3) FREQUENCE (30
  edits en 1000 ans = 1/33 ans, pas regulier), (4) FONCTION (Charpin "legitimation
  royale" vs Hudson "stabilisateur macroeconomique"), (5) DISPARITION post-1400 BCE
  (silence de 600 ans sans transmission). Le shadow revise est de 5,8x, ce qui signifie
  que l''interpretation Graeber/Hudson de l''andurarum est SYSTEMIQUEMENT BIAISEE
  par une lecture gauchisante d''un phenomene qui est D''ABORD un rituel de legitimation
  politique.'
theses_implicites:
- L'interpretation de l'andurarum comme 'justice sociale' moderne est anachronique
  (Charpin)
- La these Hudson/Graeber repose sur des TRADUCTIONS (Kraus 1984), pas sur la lecture
  directe des tablettes
- Le consensus assyriologique penche vers Charpin (legitimation), pas vers Hudson
  (stabilisation macro)
- La recuperation politique d'amargi (libertariens, Hayek Society, Liberty Fund, Reagan)
  prouve le caractere 'Rorschach' du terme
- La these d'integration par la dette repose sur l'andurarum ; si l'andurarum est
  un rituel politique, la these s'effondre
