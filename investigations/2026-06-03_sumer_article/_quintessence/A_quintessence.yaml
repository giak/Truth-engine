causalites:
- id: C-A001
  nom: 'DIVERGENCE SEMANTIQUE : ''liberation'' (Hudson) vs ''retour a l''origine''
    (Charpin)'
  description: 'L''andurarum est traduit par Hudson (suivi de Graeber) comme ''liberation'',
    ''justice sociale'', ''clean slate''. Charpin, le plus grand assyriologue francais,
    traduit par ''retour a la situation d''origine'' (College de France 2022). Cette
    divergence SEMANTIQUE n''est PAS mentionnee par l''article qui adopte l''interpretation
    Hudson. Implication : si Charpin a raison, l''andurarum n''est PAS une mesure
    de progres social mais un rituel de RESTAURATION conservatrice. La these d''integration
    par la dette repose sur Hudson ; si Hudson traduit mal, la these s''effondre.'
  preuve_tranchante: Charpin College de France 2022 + citations directes
  fiabilite: ✦
- id: C-A002
  nom: 'DETTES COMMERCIALES EXCLUES : tamkarum preserve, systeme dette subsiste'
  description: 'L''edit d''Ammisaduqa (1646 av.), le texte le plus complet qui nous
    soit parvenu, stipule explicitement que les tablettes des commercants (tamkarum)
    doivent etre preservees. Les dettes de subsistance (grain avant recolte, ~33%)
    et les arrieres d''impots etaient annules, mais les prets commerciaux etaient
    EXCLUS. Implication : le systeme ne tuait pas la dette, il la CANALISAIT. Le marchand
    s''enrichissait pendant que le paysan etait protege. L''article presente l''andurarum
    comme ''remise generale'' ce qui est FAUX.'
  preuve_tranchante: Ammisaduqa 1646 av. + Wikipedia History of debt relief
  fiabilite: ✦
- id: C-A003
  nom: FREQUENCE 30/1000 ANS = 1/33 ANS, pas regulier, pas structurel
  description: 'Environ 30 edits identifies en 1000 ans, soit 1 tous les 33 ans en
    moyenne. Mais la distribution est TRES IRREGULIERE : pic de 6 edits en 166 ans
    sous Hammurabi (1/28 ans), longs intervalles sans edit, AUCUN edit apres 1400
    av. Si l''andurarum etait STRUCTUREL, on s''attendrait a une frequence reguliere
    liee aux cycles agricoles (Jubile biblique tous les 49/50 ans). L''andurarum est
    lie a l''ACCESSION AU TRONE, pas aux cycles agricoles : c''est un calendrier POLITIQUE,
    pas economique.'
  preuve_tranchante: Kraus 1984 + Charpin 2022 distribution irreguliere
  fiabilite: ✦
- id: C-A004
  nom: 'FONCTION : legitimation royale (Charpin) vs stabilisation macro (Hudson)'
  description: 'Charpin defend que l''andurarum est d''abord un ACTE DE LEGITIMATION
    ROYALE : le roi restaure l''ordre cosmique (me), il n''est pas ingenieur social.
    Hudson defend que c''est un STABILISATEUR MACROECONOMIQUE : l''annulation periodique
    empeche la concentration fonciere. Les deux lectures ne sont pas incompatibles,
    mais l''article adopte EXCLUSIVEMENT Hudson. La these de l''integration par la
    dette repose sur la lecture economique ; si Charpin a raison (lecture politique),
    l''andurarum n''est PAS un mecanisme economique.'
  preuve_tranchante: Charpin 2022 vs Hudson 1993, 2024
  fiabilite: ✦
- id: C-A005
  nom: 'DISPARITION POST-1400 AV. : 600 ans de silence, pas de transmission'
  description: 'Aucun edit d''annulation connu apres 1400 av. La pratique disparait
    avec l''effondrement de l''age du bronze. Si l''andurarum etait un mecanisme CENTRAL
    de la civilisation mesopotamienne, il aurait du persister ou se reinventer. Sa
    disparition suggere qu''il etait lie a une CONFIGURATION POLITIQUE PARTICULIERE
    (systeme royal paleo-babylonien), pas a la dette comme mecanisme universel d''integration.
    Implication : la these d''integration par la dette repose sur 1000 ans de pratique
    discontinue, pas sur une continuite de 3000 ans.'
  preuve_tranchante: Charpin 2022 + Wikipedia Amorites fin 1400
  fiabilite: ✦
