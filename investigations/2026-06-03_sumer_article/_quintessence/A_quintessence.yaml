iceberg:
- angle: L'andurarum est d'abord un RITUEL POLITIQUE, pas un mecanisme economique
    (Charpin)
  convergence: 0.95
  description: 'Charpin (College de France) demontre que l''andurarum est d''abord
    un ACTE DE LEGITIMATION ROYALE. Le roi restaure l''ordre cosmique (me), il n''est
    pas ingenieur social. L''interpretation economique de Hudson est un CALQUE ANACHRONIQUE
    de concepts modernes. Si l''andurarum est un rituel politique, la these d''integration
    par la dette s''effondre : la dette est INSTRUMENTALISEE pour la legitimation,
    pas l''inverse.'
  source_section: §4.2 / §4.4 / §6.1
- angle: Les dettes COMMERCIALES sont EXCLUES (Ammisaduqa), le systeme dette subsiste
  convergence: 0.9
  description: 'L''edit d''Ammisaduqa stipule explicitement que les tablettes des
    tamkarum (commercants) doivent etre preservees. Les dettes annulees sont UNIQUEMENT
    agricoles (subsistance, arrieres d''impots). Le systeme ne tue pas la dette, il
    la CANALISE : paysan-soldat protege, marchand s''enrichit. L''article presente
    l''andurarum comme ''remise generale'', c''est FAUX. C''est un mecanisme de protection
    du contribuable-soldat, pas un mecanisme d''integration universelle.'
  source_section: §2.2 / §2.4 / F-A004
- angle: 30 edits en 1000 ans = 1/33 ans, PAS une frequence reguliere ni structurelle
  convergence: 0.85
  description: 'La distribution est TRES IRREGULIERE : pic de 6 edits en 166 ans sous
    Hammurabi (1/28 ans), longs intervalles sans edit, AUCUN edit apres 1400 av. Si
    l''andurarum etait STRUCTUREL, on s''attendrait a un cycle regulier lie aux recoltes.
    L''andurarum est lie a l''ACCESSION AU TRONE, pas aux cycles agricoles. C''est
    un calendrier POLITIQUE. La these d''un ''mecanisme central de la civilisation''
    est FRAGILISEE par cette distribution.'
  source_section: §3.1 / §3.4 / §4.5
- angle: Hudson n'est PAS assyriologue, il s'appuie sur les TRADUCTIONS de Kraus 1984
  convergence: 0.8
  description: Michael Hudson est ECONOMISTE HETERODOXE, pas assyriologue. Il ne lit
    pas les tablettes, il s'appuie sur les traductions de Kraus (1984) et Westbrook
    (1995). Cette dependance aux traductions est la source de sa lecture gauchisante.
    Le consensus assyriologique (Charpin, Villard, Finkelstein) penche vers 'restauration',
    pas vers 'stabilisation macro'. L'article ne mentionne pas cette cascade de traductions.
  source_section: §5.1 / §5.2 / F-A008
- angle: 'RECUPERATIONS POLITIQUES opposees : libertariens ET gauchistes (Rorschach)'
  convergence: 0.75
  description: 'Le terme amargi a ete recupere par des camps ideologiquement opposes
    : libertariens americains (Hayek Society LSE, Liberty Fund, Cato Institute, Reagan
    1981) comme ''liberte individuelle'', ET gauchistes anti-dette (CADTM, Graeber)
    comme ''justice sociale''. Hudson reconnait ce ''test de Rorschach'' mais n''applique
    pas cette critique a sa propre lecture. Le terme est un PROJECTEUR IDEOLOGIQUE,
    pas un concept defini.'
  source_section: §5.3 / F-A010 / F-A011
shadow_factor: 5.8
