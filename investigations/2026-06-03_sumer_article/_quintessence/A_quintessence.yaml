- ~30 edits en 1000 ans = 1/33 ans, distribution irreguliere (F-A005)
- Aucun edit apres 1400 av., pratique disparait (F-A006)
- Hudson n'est pas assyriologue, depend des traductions Kraus 1984 (F-A008)
