  evenement: Charpin, cours College de France, these 'restauration' explicitee
domaines:
- nom: DETTE
  description: Dettes de subsistance annulees, dettes commerciales (tamkarum) EXCLUES,
    systeme dette canalise, pas tue
  parallele_fr: Surendettement 120K dossiers/an, loi Lagarde 2010, Commission surendettement,
    4% PIB dette privee
- nom: SEMANTIQUE
  description: '5 traductions d''amargi : liberation (Hudson), restauration (Charpin),
    reduction impots (Kramer), liberte individuelle (libertariens), annulation (Thureau-Dangin)'
  parallele_fr: 5 traductions de 'dette' en francais (devoir, creance, obligation,
    engagement, fatalite)
- nom: ROYALTE
  description: Roi gardien de l'ordre cosmique (me), andurarum = restauration ordre,
    pas reforme, ideologie de la restitution
  parallele_fr: Monarque de droit divin (Ancien Regime), Restauration 1814-1830, ordre
    naturel Catholicisme
- nom: DEBAT ACADEMIQUE
  description: Hudson (economiste heterodoxe) vs Charpin (assyriologue), Finkelstein,
    Kraus, Westbrook, Villard (consensus Charpin)
  parallele_fr: Debats academiques (Annales vs EHESS), economistes heterodoxes (Chavagneux,
    Todd)
- nom: RECUPERATION POLITIQUE
  description: Libertariens (Hayek Society LSE, Liberty Fund, Cato), Reagan 1981 (Kramer),
    gauchistes anti-dette (CADTM, Graeber), recuperations opposees
  parallele_fr: Recuperations politiques opposees du Jubile (PMAE credit, Jubilee
    2000)
- nom: TRANSMISSION
  description: Andurarum → dror hebreu (Levitique 25, Jubile), plausibilite linguistique
    mais non prouvee, saut de 600 ans
  parallele_fr: Transmission juridique Code civil France, coutumier, tradition orale
- nom: DISPARITION
  description: Aucun edit apres 1400 av., effondrement age du bronze, pas de renaissance,
    pratique dependante du contexte politique
  parallele_fr: Disparition de pratiques (servage 1789, corporation 1791, monarchie
    1848)
