- date: ~1800 av.
  evenement: Samsu-iluna, pere d'Hammurabi, edit connu
- date: 1792-1750 av.
  evenement: Hammurabi roi de Babylone, periode d'apogee de l'andurarum
- date: 1646 av.
  evenement: Ammisaduqa, edit le + complet qui nous soit parvenu (tamkarum explicite)
- date: ~1400 av.
