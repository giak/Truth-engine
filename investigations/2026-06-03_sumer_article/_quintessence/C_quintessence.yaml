iceberg:
  - angle: "Orientalisme epistemique (toutes sources en anglais/francais, zero chinois)"
    convergence: 0.85
    description: >-
      Toutes les 27 sources de l'enquete sont en anglais ou francais.
      Aucune source en chinois n'a ete consultee. La Chine imperiale n'est
      accessible qu'a travers des filtres occidentaux (jesuites, sinologues
      anglo-saxons, donnees chinoises officielles tordues par la propagande).
      Une enquete avec sources primaires chinoises aurait probablement un
      facteur 3-5x de faits supplementaires.
    source_section: "§18 ICEBERG"
  - angle: "Complexite bureaucratique sous-estimee (ratio x570 mais administration fantome)"
    convergence: 0.75
    description: >-
      La Chine imperiale gerait 60-400M d'habitants avec ~20 000
      fonctionnaires (ratio 1/10-15K) contre 5,7M pour 68M en France
      (1/12). Cela signifie que la Chine avait un ratio
      administration/population x570 plus faible. OU BIEN les Chinois
      pre-modernes etaient extremement efficaces, OU BIEN la majeure
      partie de l'administration se faisait hors des structures
      officielles (elites locales, clans, guildes). Cette "administration
      fantome" est le plus grand angle mort de l'enquete.
    source_section: "§18 / §14"
  - angle: "Invention simultanee (convergence independante, pas filiation)"
    convergence: 0.80
    description: >-
      La majorite des paralleles degages sont des inventions
      independantes, pas des filiations. La Chine et la France ont
      resolu separement des problemes similaires (recruter des
      fonctionnaires, stabiliser la monnaie, prevenir les famines). Le
      fait que les solutions chinoises precedent les francaises de 700 a
      2300 ans suggere que la Chine a commence plus tot a se poser ces
      questions, pas qu'elle etait en avance au sens teleologique.
    source_section: "§18 / §12"
  - angle: "France perd les contrepouvoirs qu'elle avait ajoutes"
    convergence: 0.65
    description: >-
      La France se croit unique avec ses concours INSP et ses grands
      corps. En realite, elle a redevouvre (via Voltaire/Quesnay) des
      mecanismes que la Chine experimentait depuis le VIIe s. La
      specificite francaise n'est pas le concours, c'est d'y avoir ajoute
      les contrepouvoirs democratiques. Mais la France PERD ces
      piliers (privatisation rampante de la justice, affaiblissement
      des contre-pouvoirs) au moment meme ou la Chine les ignore
      deliberement. La convergence se fait par le bas.
    source_section: "§18 / §6 Perspective C"
  - angle: "GLF : limite extreme de la bureaucratie sans contrepouvoir"
    convergence: 0.70
    description: >-
      Le Grand Bond en Avant (20-30M morts) est le crime le plus massif
      de l'histoire humaine en temps de paix. Aucune comparaison
      francaise n'approche. C'est un rappel que la puissance de l'Etat
      bureaucratique n'a pas de garde-fou sans contrepouvoir. Lecon
      structurelle : une bureaucratie qui punit les mauvaises nouvelles
      produit des catastrophes inaudibles.
    source_section: "§18 / §8.6 / §4 L6"
shadow_factor: 3.2
ce_qui_tient:
  - "Keju precede INSP de 1350 ans (filiation intellectuelle via Voltaire)"
  - "Jiaozi precede BdF de 780 ans (parallele structurel, pas causal)"
  - "Tang Code precede Code civil de 1180 ans (mais pas un code civil)"
  - "Monopole sel/fer precede nationalisations de ~2000 ans"
  - "Ever-normal granaries precedent PAC de 2350 ans"
  - "Ratio fonctionnaires x570 plus faible en Chine imperiale"
ce_qui_tombe:
  - "Keju pas une 'meritocratie universelle' (limite aux lettres)"
  - "Jiaozi-BdF pas une filiation directe (convergence independante)"
  - "Ever-normal n'ont pas empeche les grandes famines (GLF)"
  - "Tang Code pas un code civil (penal hierarchique)"
  - "SCS moins omnipotent que la legende mediatique (mais potentiel reel)"

limites:
  - "Orientalisme : zero source en chinois sur 27"
  - "Selection teleologique : choix des faits guides par la these (5/7 themes positifs)"
  - "Presentisme : categories francaises (dette, bureaucratie, Etat de droit) appliquees a la Chine"
  - "Donnees economiques chinoises avant 1912 : estimations revisees (Maddison/Broadberry)"
  - "Donnees chinoises modernes (dette, Gini) officielles et potentiellement manipulees"
  - "20 000 fonctionnaires imperiaux : estimation savante, pas un recensement"
  - "Population historique chinoise debattue (Ming : 60-200M selon sources)"
  - "Aucune source documentaire directe pour la filiation Marco Polo -> Law"
  - "Le chiffre GLF (20-30M) varie selon les sources (15-45M dans la litterature)"

perspectives_dialectiques:
  - scenario: "A - La Chine a montre la voie (continuisme)"
    these: >-
      Sur 7 themes, la Chine precede la France de 700 a 2300 ans pour 5
      d'entre eux : monnaie (780), concours (1350), greniers (2350),
      code (1180), monopole (1950). La France n'a invente que la forme,
      l'idee etait chinoise. Filiation intellectuelle documentee pour
      le keju (Voltaire, Quesnay).
    cui_bono: "Sinologues, historiens des idees politiques, lecteurs d'Elman"
    score: 0.55
  - scenario: "B - La comparaison est un trompe-l'oeil (scepticisme)"
    these: >-
      Le keju n'est pas l'INSP (lettres vs gestionnaires). Le Jiaozi
      n'est pas la Banque de France (credit vs institution). Les
      ever-normal ne sont pas la PAC (stabilisation vs subvention+revenu).
      Le parallele formel cache des differences structurelles
      irreductibles. La majorite des convergences sont des inventions
      independantes.
    cui_bono: "Methodologues, sinologues critiques, historiens du droit compare"
    score: 0.70
  - scenario: "C - Memes pieges bureaucratiques (convergence pathologique)"
    these: >-
      La Chine et la France souffrent de la meme hypertrophie
      bureaucratique. La Chine des Song avait trop de fonctionnaires pour
      sa base fiscale (1 admin/10K hab). La France a 5,7M fonctionnaires
      pour 68M hab. Les deux Etats peinent a se reformer. MAIS les
      regimes politiques (autoritaire vs democratie liberale) differents
      impliquent des mecanismes de sortie de crise tres differents.
    cui_bono: "Reformateurs, observateurs des institutions, lecteurs de North/Wallis/Weingast"
    score: 0.65
tensions_non_resolues:
  - "Monopole sel/fer : succes chinois 2000 ans vs echec francais (gabelle supprimee 1790)"
  - "Meritocratie : keju limitee (1/1000) vs INSP ouverte a tous les bacheliers"
  - "Contrepouvoirs : Chine zero vs France post-1789 (en regression actuelle)"
  - "GLF : crime massif sans equivalent francais, mais c'est un probleme pas une solution"
  - "SCS : extension logique du legalisme ou innovation technique ?"

