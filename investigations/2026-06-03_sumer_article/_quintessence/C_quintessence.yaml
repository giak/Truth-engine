causalites:
  - id: C-C001
    nom: "Keju vers INSP via jesuites et physiocrates"
    description: >-
      Keju (605, Chine) -> traduit par les jesuites (Ricci, XVIIe s.) ->
      Voltaire (Essai sur les moeurs 1756) et Quesnay ("Confucius europeen")
      admirent le modele -> Montesquieu (De l'esprit des lois 1748,
      separation des pouvoirs) -> Revolution francaise (concours interrompu)
      -> Napoleon (Polytechnique 1794, Normale 1795) -> IIIe Republique (loi
      1853 sur concours fonction publique) -> Sciences Po 1872 -> ENA 1945 ->
      INSP 2022. Filiation INTELLECTUELLE documentee, pas une copie
      mecanique. La France a filtre le modele chinois a travers 3 siecles
      de transformations, ajoutant les contrepouvoirs democratiques.
    preuve_tranchante: "Lettres de Voltaire, traductions jesuites, travaux Quesnay"
    fiabilite: ✦
  - id: C-C002
    nom: "Jiaozi vers Banque de France (monnaie d'Etat)"
    description: >-
      Jiaozi (1024, Song Chine) -> Marco Polo rapporte le papier-monnaie
      chinois en Europe (XIIIe) -> experiences europeennes -> Law
      (1716-1720, Systeme de Law = papier-monnaie francais) ->
      Hyperinflation des assignats (1790-1796, abandon du papier) ->
      Banque de France (1803, monnaie metallique jusqu'en 1914) -> Franc
      Poincare (1928, etalon-or) -> Euro (1999, monnaie fiduciaire).
      Verdict : influence POSSIBLE Marco Polo -> Law, mais non documentee
      directement. Le parallele est STRUCTUREL, pas causal. La France a
      reinvente la meme solution a 780 ans d'ecart apres un echec
      (assignats) et un delai d'un siecle.
    preuve_tranchante: "Pas de preuve directe, parallele structurel date"
    fiabilite: ✧
  - id: C-C003
    nom: "Ever-normal granaries vers PAC (stabilisation des prix)"
    description: >-
      Li Kui (~400 av.) propose le principe d'achat/revente etatique du
      grain -> Hu Chang (54 av.) systematisation Han -> maintenu par 15
      dynasties sur 2000 ans -> (AUCUNE transmission connue vers l'Europe)
      -> PAC (1962, France/Europe) -> stockage public, subventions,
      stabilisation. Invention INDEPENDANTE : la Chine a teste un
      mecanisme que la France a reinvente 2350 ans plus tard, sans
      transmission documentee. Mais les principes sont identiques (l'Etat
      lisse les fluctuations de prix via stockage).
    preuve_tranchante: "Aucune transmission documentee, invention parallele"
    fiabilite: ✦
  - id: C-C004
    nom: "Confucianisme (124 av.) vers catholicisme d'Etat (496-1905) comme ideologie de legitimation"
    description: >-
      Han Wudi etablit l'Academie imperiale (124 av.), confucianisme =
      dogme d'Etat -> maintenu 2000 ans -> Confucianisme n'est PAS une
      religion (pas de clerge, pas de dieu) -> ethique sociale, pas
      theologie -> separation IMPOSSIBLE (l'Etat est reste confuceen
      jusqu'en 1911). France : catholicisme religion d'Etat (bapteme de
      Clovis 496) -> separation 1905 (1409 ans de monopole ideologique).
      FONCTION ANALOGUE de legitimation du pouvoir. DIFFERENCE
      categorique : le confucianisme n'a pas de transcendance, le
      christianisme oui. La France a pu se laiciser, la Chine non.
    preuve_tranchante: "Wikipedia Confucianism, Han dynasty"
    fiabilite: ✦
  - id: C-C005
    nom: "GLF (1959-1961) et Revolution culturelle (1966-1976) : violence d'Etat sans contrepouvoir"
    description: >-
      GLF : politique agricole catastrophique + communes populaires +
      fission des rizieres + destruction des outils prives + propagande
      irrealiste + REQUISITIONS FORCEES cachant la famine aux autorites
      centrales. Resultat : 20-30M morts, ratio 3.4-5.1% population.
      Revolution culturelle : Gardes Rouges (jeunes) attaques
      intellectuels, destructions temples/artefacts, humiliations
      publiques, 1.5-3M morts. France n'a AUCUN equivalent a cette
      echelle. Cause structurelle : bureaucratie qui PUNIT les mauvaises
      nouvelles produit des catastrophes inaudibles. Lecon : la
      concentration du pouvoir ETATIQUE sans contrepouvoir democratique
      detruit le peuple qu'elle pretend servir.
    preuve_tranchante: "Wikipedia Great Chinese Famine, Cultural Revolution"
    fiabilite: ✦

