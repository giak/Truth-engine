these_centrale: >-
  La Chine a precede la France de 700 a 2300 ans sur 5 des 7 themes de la
  comparaison : monnaie fiduciaire (Jiaozi 1024, 780 ans avant la Banque de
  France), concours administratif (keju 605, 1350 ans avant l'ENA), code
  ecrit (Tang Code 624, 1180 ans avant le Code civil), monopole d'Etat
  strategique (sel/fer 117 av., ~2000 ans), stabilisation agricole
  (ever-normal granaries 400 av., 2350 ans avant la PAC). MAIS la France a
  ajoute ce que la Chine n'a jamais eu : les contrepouvoirs democratiques
  (Declaration des droits 1789, Etat de droit, justice independante). Le
  paradoxe actuel : la France perd ce qu'elle avait ajoute au moment meme
  ou la Chine continue a developper ses mecanismes d'origine. La convergence
  se fait par le bas, et le Grand Bond en Avant (20-30M morts) rappelle
  que la puissance bureaucratique sans contrepouvoir detruit ses propres
  citoyens.

theses_implicites:
  - >-
    Le parallelisme Chancel/Banque de France est STRUCTUREL, pas causal.
    Marco Polo rapporte le papier-monnaie chinois en Europe (XIIIe s.),
    Law l'a peut-etre lu (1716-1720, systeme de Law), les assignats (1790)
    sont une experience francaise independante. La France n'a PAS copie la
    Chine, elle a reinvente la meme solution a 766 ans d'ecart. Le parallelisme
    releve de la convergence de problemes universels, pas d'une filiation.
  - >-
    Le parallelisme keju (605)/INSP (1945) est plus causal que les autres,
    grace a un intermediaire documente : les jesuites (Ricci, XVIIe s.) ont
    traduit les classiques confuciens en latin, Voltaire (Essai sur les moeurs
    1756) cite le keju comme modele de gouvernement rationnel, Quesnay est
    surnomme "le Confucius europeen" (physiocratie). La filiation intellectuelle
    INSP <- grands corps <- polytechnique (1794) <- concours <- Montesquieu
    <- Voltaire <- Quesnay <- jesuites <- Chine est largement meconnue des
    hauts fonctionnaires francais.
  - >-
    L'advantage chinois sur la France se mesure a un ratio x570 de
    fonctionnaires/habitants : Chine Ming/Qing ~20000 fonctionnaires pour
    150-300M d'habitants (1/10-15K) vs France 5,7M pour 68M (1/12). MAIS
    ce ratio cache une "administration fantome" chinoise : elites locales,
    clans, guildes qui gerent l'administration reelle hors des structures
    officielles. Les sources occidentales ne documentent pas cette
    administration informelle qui est le plus grand angle mort de l'enquete.

