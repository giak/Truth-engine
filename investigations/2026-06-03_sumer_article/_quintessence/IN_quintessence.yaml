  2001)'
perspectives_dialectiques:
- scenario: A - L'Inde confirme mais transforme la these (these continuiste revisee)
  these: 'L''Inde CONFIRME le besoin d''integration (dharma integre tout) mais TRANSFORME
    la these centrale : l''integration ne passe PAS par la dette/andurarum. La sanction
    karmique suffit. La these SYSTEME reste valide (l''integration est universelle),
    la these DETTE est FRAGILISEE. Article "3 civilisations" doit elargir a l''Inde
    (32% du PIB antique) pour etre credible.'
  cui_bono: Antropologues, indianistes, sinologues
  score: 0.75
- scenario: B - L'Inde comme systeme ALTERNATIF (these civilisationnelle indienne)
  these: L'Inde est une CIVILISATION-MONDE qui n'a pas besoin de l'Occident pour exister.
    Caste, dharma, hindouisme, bouddhisme forment un systeme complet. La these 'capture'
    y est REALISEE A L'EXTREME (caste par naissance) et l'article qui pretend expliquer
    la capture occidentale en ignorant l'Inde manque sa cible. Le ZERO, l'algebre,
    les chiffres prouvent que l'Inde a transmis PLUS a l'Occident que ce que l'Occident
    reconnait.
  cui_bono: Post-coloniaux, indianistes, Swami Vivekananda
  score: 0.65
- scenario: C - L'Inde comme refutation empirique (these falsificationniste)
  these: 'L''Inde est une REFUTATION EMPIRIQUE de la these centrale de l''article.
    Si l''integration est possible SANS andurarum (via dharma + karma), alors l''andurarum
    n''est PAS un mecanisme d''integration NECESSAIRE. La these "3 civilisations avec
    dette" est un sous-ensemble. Le concept d''integration est plus large : dette
    + religion + hierarchie + morale + caste. L''article est FALSIFIE par l''Inde
    au sens popperien.'
  cui_bono: Methodologues, philosophes des sciences, economistes
  score: 0.7
