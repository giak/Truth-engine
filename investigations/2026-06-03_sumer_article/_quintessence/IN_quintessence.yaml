causalites:
- id: C-IN001
  nom: Dharma (integration loi+morale+religion) SANS andurarum
  description: 'Le dharma integre loi, morale, religion, economie et hierarchie sociale
    dans UN SEUL SYSTEME. Le Manusmriti (18 titres de droit) couvre droit civil, penal,
    familial, rituel. MAIS PAS d''andurarum indien : la dette n''est JAMAIS annulee,
    elle se transmet aux heritiers. La sanction karmique (la dette non remboursee
    se paie dans la vie prochaine) est PLUS FORTE que n''importe quelle loi civile.
    L''integration indienne PROUVE que la dette n''est PAS le mecanisme d''integration
    necessaire. C''est un mecanisme PARMI D''AUTRES. Fragilise la these centrale de
    l''article.'
  preuve_tranchante: Wikipedia Manusmriti + Dharma (chainage documente)
  fiabilite: ✦
- id: C-IN002
  nom: 'Taux d''interet differencies par caste : preuve d''integration economie+hiérarchie'
  description: 'Le Manusmriti fixe des taux d''interet differencies selon la caste
    d''appartenance : Brahmanes 2%/mois (24%/an), Kshatriyas 3%/mois, Vaishyas 4%/mois,
    Shudras 5%/mois. Ces taux sont TRES ELEVES comparés aux taux romains (12% usuram)
    et mesopotamiens (20% argent, 33% orge). Le DIFFERENTIEL par caste est une preuve
    supplementaire de l''integration economie+hiérarchie sociale : plus la caste est
    basse, plus le taux est eleve, plus l''exploitation est forte. Le systeme economique
    reproduit la hierarchie sociale.'
  preuve_tranchante: Wikipedia Manusmriti (taux d'interet documentes)
  fiabilite: ✦
- id: C-IN003
  nom: Caste (fermeture par naissance) = capture plus efficace que cooptation
  description: 'Le systeme varna/jati repose sur la NAISSANCE (fermeture maximale).
    Le shudra ne peut PAS devenir brahmane. Comparee a la cooptation administrative
    chinoise (concours keju) ou francaise (ENA/INSP), la capture par caste est PLUS
    EFFICACE : elle dure 3000 ans sans reforme reussie. La these ''la mobilite sociale
    comme antidote a la capture'' est INVALIDEe par l''Inde : la mobilite par naissance
    est impossible, la reproduction sociale est garantie.'
  preuve_tranchante: Wikipedia Varna + aboli 1950 (independance), reforme insuffisante
  fiabilite: ✦
- id: C-IN004
  nom: 'Arthashastra (Kautilya) : bureaucratie de CASTE-CRATIE, pas meritocratie'
  description: 'L''Arthashastra de Kautilya (15 livres, 150 chapitres) decrit une
    structure administrative sophistiquee (Samrat, Mantri Parishad, Adhyakshas, Gopa,
    systeme d''espionnage). MAIS c''est une CASTE-CRATIE, pas une MERITOCRATIE : les
    postes eleves sont reserves aux hautes castes, pas ouverts au merite personnel.
    Comparee au keju chinois (concours ouvert theoriquement a tous les hommes lettrés),
    l''Inde a un systeme de recrutement FERME. Le systeme d''espionnage (guerriers,
    courtisanes, marchands espions) est une innovation indienne reprise par Byzance
    et la Chine.'
  preuve_tranchante: Wikipedia Arthashastra + Maurya Empire
  fiabilite: ✦
- id: C-IN005
  nom: 'Transmission INDIRECTE (Inde->Islam->Europe) : chiffres, zero, bouddhisme'
  description: 'L''Inde a transmis a l''Europe via l''Islam : (1) le ZERO (Aryabhata,
    Ve-VIe s.), (2) les CHIFFRES dits ''arabes'' (en realite indiens, transmis par
    Al-Khwarizmi), (3) le BOUDDHISME (Inde -> Chine -> Japon -> Coree), (4) les TEXTILES
    (coton indien vers Rome, Periplus Maris Erythraei). Cette transmission est CULTURELLE
    et MATHEMATIQUE, pas JURIDIQUE (contrairement a l''Islam qui transmet le CJC).
    L''article ignore l''Inde parce qu''elle n''a pas de filiation JURIDIQUE directe,
    mais sa transmission MATHEMATIQUE est aussi determinante (le zero est la base
    de l''informatique).'
  preuve_tranchante: Wikipedia Hindu-Arabic numerals + transmission bouddhiste
  fiabilite: ✦
