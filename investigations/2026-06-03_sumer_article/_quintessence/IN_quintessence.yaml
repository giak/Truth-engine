ce_qui_tient:
- L'Inde representait 32% du PIB mondial en 1 CE (Maddison)
- Le dharma integre loi/morale/religion/economie (plus que Rome/Chine)
- Taux d'interet differencies par caste (Manusmriti, verifie)
- Pas d'andurarum indien (debt transmise heritiers, sanction karmique)
- ZERO invente par Aryabhata (Ve-VIe s.), transmis a l'Europe via l'Islam
- Caste par naissance, 3000 ans, capture MAXIMALE
ce_qui_tombe:
- La these 'integration via dette' est INFIRMEE par l'Inde (sanction karmique suffit)
- La mobilite sociale n'est PAS un antidote a la capture (caste bloque tout)
- 'L''Inde n''est pas ''arrieree'' : elle etait 32% du PIB en 1 CE'
- Les chiffres 'arabes' sont INDIENS (Al-Khwarizmi a transmis)
limites:
