these_centrale: 'L''Inde ancienne (3300 av. - present, continuite de 5300 ans) est
  la grande ABSENTE du recit "3 civilisations" et potentiellement la plus dommageable
  pour la these de l''article. L''Inde representait ~32% du PIB mondial en 1 CE (vs
  Rome ~25%, Chine ~26%). La these SYSTEME est TRANSFORMEE : le dharma integre loi/morale/religion/economie
  PLUS COMPLETEMENT que Sumer, Rome ou Chine, mais SANS andurarum. La these CAPTURE
  est NUANCEE : les brahmanes (corps specialise) reproduisent un schema de capture
  par endogamie de caste, pas par cooptation administrative. La these TRANSMISSION
  est BOULEVERSEE : l''Inde n''a PAS transmis directement son systeme a l''Europe,
  mais a transmis le ZERO, les CHIFFRES ARABES (en fait indiens), le BOUDDHISME, les
  TEXTILES. C''est une TRANSMISSION CULTURELLE/MATHEMATIQUE, pas juridique.'
theses_implicites:
- L'integration indienne via dharma PROUVE que la dette n'est PAS le mecanisme d'integration
  necessaire. La these centrale de l'article (l'integration passe par la dette/andurarum)
  est FRAGILISEE. L'Inde integre loi/morale/religion/economie SANS annulation de dette,
  en utilisant la SANCTION KARMIQUE (la dette non remboursee se paie dans la vie prochaine)
  comme mecanisme de regulation.
- 'La capture par caste est PLUS EFFICACE que la capture par enarques : elle dure
  3000 ans sans reforme reussie. Le systeme varna/jati repose sur la naissance (fermeture
  maximale) et non sur la cooptation administrative. Le shudra ne peut PAS devenir
  brahmane, alors que le fils d''ouvrier peut devenir enarque (theoriquement). Lecons
  pour la France : la capture par reproduction sociale est plus stable que la capture
  par endogamie administrative.'
- L'Inde etait connectee au monde antique via route de la Soie terrestre, route maritime
  ocean Indien, route sud. L'article ignore cette connectivite. L'Inde transmettait
  le ZERO et les CHIFFRES (via l'Islam, d'ou le nom trompeur "arabes"), le BOUDDHISME
  (Inde -> Chine -> Japon), les TEXTILES (coton indien vers Rome). Cette transmission
  CULTURELLE est aussi determinante que la transmission JURIDIQUE islamique ou CARTOGRAPHIQUE
  chinoise.
