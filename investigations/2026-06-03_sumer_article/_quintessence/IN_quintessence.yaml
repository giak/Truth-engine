domaines:
- nom: DETTE
  description: Taux d'interet differencies par caste (Brahmanes 2%, Shudras 5%/mois),
    pas d'andurarum, dette transmise aux heritiers, sanction karmique
  parallele_fr: Taux usuraire medieval (~20%), Pas d'andurarum francais, Securite
    sociale 1945, 120K dossiers surendettement/an
- nom: BUREAUCRATIE
  description: 'Arthashastra : Samrat, Mantri Parishad, Adhyakshas (surintendants),
    Gopa (village), systeme d''espionnage'
  parallele_fr: INSP, grands corps, 5,7M fonctionnaires, Conseil d'Etat
- nom: DROIT
  description: Dharma (integration loi+morale+religion), Manusmriti 18 titres, pas
    de separation droit/morale/religion
  parallele_fr: Code civil 1804 (civil), Declaration droits 1789, separation Eglise/Etat
    1905
- nom: CASTES
  description: Varna (4 castes) + jati (sous-castes) + intouchables, fermeture par
    naissance, endogamie stricte, aboli 1950 formelle
  parallele_fr: Noblesse d'Ancien Regime, caste contemporaine 20 familles (HUB Changement
    de Regime)
- nom: SCIENCES
  description: ZERO (Aryabhata Ve-VIe s.), calcul decimal, astronomie, medecine (Ayurveda),
    mathematiques
  parallele_fr: Ecole polytechnique 1794, recherche scientifique, INSERM, INRIA
- nom: TRANSMISSION
  description: Inde->Islam (chiffres, zero, algebre) puis Europe, bouddhisme -> Chine
    -> Japon, textiles vers Rome
  parallele_fr: Chiffres arabes en France, bouddhisme marginal, transmission JURIDIQUE
    islamo-romaine
- nom: CAPTURE
  description: Caste = capture MAXIMALE (naissance, 3000 ans, pas de mobilite), brahmanes
    gardiens du savoir
  parallele_fr: Grands corps (Conseil d'Etat, Inspection des finances), caste 20 familles,
    reproduction elite
