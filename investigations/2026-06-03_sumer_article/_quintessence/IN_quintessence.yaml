iceberg:
- angle: Omission de l'Inde = la plus grande perte epistemique de l'article
  convergence: 0.9
  description: L'Inde representait ~32% du PIB mondial en 1 CE (Maddison), plus que
    Rome (~25%) et la Chine (~26%). Sa continuite civilisationnelle est de 5300 ans
    (IVC 3300 av. -> present), comparable a la Chine. Les "3 civilisations" (Sumer,
    Rome, Chine) omettent 32% de l'economie mondiale antique. L'Inde CONFIRME le besoin
    d'integration (dharma) mais INFIRME la these de l'integration via la dette (pas
    d'andurarum indien).
  source_section: §3 / §1 / §7
- angle: 'Dharma integre tout SANS annulation de dette : fragilise la these centrale'
  convergence: 0.85
  description: 'Le dharma integre loi, morale, religion, economie, hierarchie sociale
    dans UN SEUL SYSTEME (plus complet que Sumer, Rome, Chine). MAIS PAS D''ANDURARUM
    indien : la dette se transmet aux heritiers, sanctionnee par le karma. La these
    "l''integration passe par la dette" est FRAGILISEE. L''Inde prouve que l''integration
    peut reposer sur la SANCTION RELIGIEUSE, pas sur l''annulation politique de la
    dette.'
  source_section: §8A / §8B / §10
- angle: Caste = capture MAXIMALE par naissance, 3000 ans, plus efficace que l'ENA
  convergence: 0.8
  description: 'Le systeme varna repose sur la NAISSANCE (fermeture maximale). Compare
    a la cooptation administrative chinoise (concours keju) ou francaise (ENA/INSP),
    la capture par caste est PLUS EFFICACE : elle dure 3000 ans sans reforme reussie.
    Le shudra ne peut PAS devenir brahmane. La these ''la mobilite sociale comme antidote
    a la capture'' est invalidee par l''Inde.'
  source_section: §10 / §3
- angle: 'Transmission indirecte mais determinante : zero, chiffres, bouddhisme'
  convergence: 0.75
  description: 'L''Inde a transmis a l''Europe via l''Islam : le ZERO (Aryabhata),
    les CHIFFRES dits ''arabes'' (en realite indiens, transmis par Al-Khwarizmi),
    le BOUDDHISME, les TEXTILES. Cette transmission est CULTURELLE et MATHEMATIQUE,
    pas JURIDIQUE. L''article ignore l''Inde parce qu''elle n''a pas de filiation
    juridique directe, mais le ZERO est la base de l''informatique moderne.'
  source_section: §8E
- angle: Inde comme civilisation-monde integree 5300 ans (continuite > Rome)
  convergence: 0.7
  description: La continuite indienne (3300 av. - present) est PLUS LONGUE que celle
    de Rome (753 av. - 476 ap. = 1229 ans) et comparable a la Chine (1600 av. - present).
    L'Inde a survecu a toutes les invasions (Aryens, Grecs, Scythes, Huns, Arabes,
    Turcs, Britanniques) en integrant les apports exterieurs (bouddhisme issu de l'aryanisation,
    islam du Sultanat, christianisme colonial, anglais). Capacite d'INTEGRATION unique.
  source_section: §7 / §1
