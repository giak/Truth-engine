iceberg:
  - angle: "Le 'trou de 594 ans' comble par l'Islam, pas par l'Europe"
    convergence: 0.90
    description: >-
      Le recit lineaire "Rome perdu -> redecouvert a Bologne (1070)"
      est un MYTHE. La veritable chaine est Rome -> Bayt al-Hikma
      (~830) -> Cordoue (Xe) -> Tolede (XIIe) -> Bologne (1070) ->
      Paris. Sans Bayt al-Hikma, Irnerius n'aurait pas eu acces au
      CJC. L'Islam n'est pas un "pont" passif mais le CONSERVATEUR
      ACTIF du savoir antique. Article europeen ignore ce maillon
      determinant.
    source_section: "§2"
  - angle: "Charia = integration MAXIMALE (culte+droit+morale+conomie)"
    convergence: 0.85
    description: >-
      La charia integre culte, transactions, droit penal, droit
      familial, ethique et economie dans un MEME cadre juridique.
      Plus complet que Sumer (andurarum seulement), Rome (CJC
      civil), Chine (Tang Code penal). L'integration n'est PAS
      une particularite europeenne ancienne, c'est un UNIVERSEL
      des societes complexes. Le monde moderne specialise/fragmente
      ce que toutes les civilisations anciennes integraient.
    source_section: "§1 / §5"
  - angle: "Riba = plus radical que l'andurarum (interdit la creation, pas l'annulation)"
    convergence: 0.80
    description: >-
      Le riba (Coran, sourate 2:275-279) INTERDIT la creation de
      la dette a interet. L'andurarum sumerien ANNULE periodiquement
      les dettes existantes. Plus radical, plus durable, plus
      systematique. MAIS contournements (hiyal, montages juridiques
      hanafites et malikites) demontrent que l'interdit theorique
      est contourne structurellement. Lecon : la theorie islamique
      de l'interdiction montre que l'integration maximale n'empeche
      PAS la capture.
    source_section: "§3"
  - angle: "Oulemas : capture par le savoir religieux, pas par la nomination"
    convergence: 0.75
    description: >-
      Les oulemas forment un corps comparable aux scribes, juristes,
      mandarins, enarques. MEME endogamie, MEME capture potentielle.
      MAIS contrepoids unique : autorite par le savoir, pas par
      nomination royale. Revoltes des oulemas contre califes
      injustes attestees historiquement. Le systeme s'affaiblit
      quand l'alignement calife-oulemas devient systematique sous
      les Abbassides. Lecon : l'independance du savoir est un
      contrepouvoir reel quand elle est preservee.
    source_section: "§4"
  - angle: "Al-Andalus 711-1492 : laboratoire detruit par la Reconquista"
    convergence: 0.70
    description: >-
      Al-Andalus (Espagne islamique) 711-1492 (781 ans), apogee
      Cordoue Xe s. (500 000 hab., bibliotheques immenses). La
      chute progressive (Tolede 1085, Cordoue 1236, Grenade 1492,
      Morisques 1609) detruit la communaute productrice du savoir.
      La France herite des TEXTES via Tolede mais PAS de la
      tradition vivante. La rupture est aussi epistemique que
      politique.
    source_section: "§2"
