perspectives_dialectiques:
  - scenario: "A - L'Islam comme chainon determinant (these continuiste medievale islamique)"
    these: >-
      L'Islam est le chainon MANQUANT et le CONSERVATEUR ACTIF de
      l'heritage antique. Bayt al-Hikma (~830) traduit systematiquement
      Aristote, Galien, Ptolemee. Cordoue (Xe) et Tolede (XIIe)
      transmettent a l'Europe. Sans l'Islam, pas de redecouverte
      europeenne. La these SYSTEME est renforcee (charia integre
      tout) et la these CAPTURE relativisee (oulemas avec
      contrepoids). Article "3 civilisations" est incomplet.
    cui_bono: "Medievistes, historiens des sciences arabes, islamisants"
    score: 0.80
  - scenario: "B - L'Islam comme universal capture-resistant (these critique post-coloniale)"
    these: >-
      L'Islam montre que l'integration MAXIMALE (charia) n'empeche
      PAS la capture (hiyal, alliance oulemas-calife). Le systeme
      le plus integre de l'histoire produit quand meme des
      specialistes captifs. La capture n'est pas un accident
      europeen mais un universel des societes complexes. La
      these "laicite comme solution a la capture" est invalidee
      par l'Islam qui n'a JAMAIS eu de separation.
    cui_bono: "Antropologues, sociologues des religions, post-coloniaux"
    score: 0.70
  - scenario: "C - Riba > andurarum comme reponse a la dette (these structurelle)"
    these: >-
      L'interdiction coranique du riba est PLUS RADICALE que
      l'andurarum sumerien : elle interdit la creation de la dette
      a interet, pas seulement l'annulation. Plus durable, plus
      systematique, couvrant tous les prets. MAIS contournements
      (hiyal) montrent que l'interdit theorique est contourne.
      LECON : la these "l'integration juridique resout la dette"
      est demystifiee par l'Islam. Meme avec l'integration
      maximale, la dette se reinvente sous des formes cachees.
    cui_bono: "Economistes, juristes, finance islamique"
    score: 0.75
