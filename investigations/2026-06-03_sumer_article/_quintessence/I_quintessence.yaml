causalites:
  - id: C-I001
    nom: "Bayt al-Hikma (Bagdad) vers redecouverte europeenne du CJC"
    description: >-
      Bayt al-Hikma (~830, al-Ma'mun) traduit systematiquement du grec
      et syriaque vers l'arabe (Aristote, Galien, Ptolemee, mais aussi
      textes scientifiques et philosophiques) -> Cordoue (Xe-XIIe) et
      Tolede (XIIe, Ecole de traducteurs) traduisent de l'arabe vers
      le latin -> Irnerius (1070, Bologne) accede au CJC grace aux
      versions arabes conservees en Espagne islamique. La these
      "Rome -> Bologne -> France" est INCOMPLETE. La vraie chaine est
      "Rome -> traduction syriaque -> Bayt al-Hikma -> Cordoue/Tolede
      -> Bologne -> Paris". L'Islam est le CONSERVATEUR ACTIF du
      savoir antique.
    preuve_tranchante: "Wikipedia Bayt al-Hikma + School of Toledo (chainage documente)"
    fiabilite: ✦
  - id: C-I002
    nom: "Charia : integration totale culte+droit+morale+conomie+politique"
    description: >-
      La charia integre le culte (priere, jeune, pelerinage, zakat),
      les transactions (commerce, dette, contrat, heritage), le droit
      penal (crimes et chatiments), le droit familial (mariage,
      divorce, filiation), l'ethique (bien/mal, permis/interdit) et
      l'economie (riba interdit, zakat obligatoire, succession). AUCUNE
      SEPARATION entre ces domaines. Le meme cadre juridique traite
      une vente immobiliere et un peche mortel. INTEGRATION
      MAXIMALE - plus que Sumer (andurarum), Rome (CJC), Chine
      (Tang Code). La these SYSTEME est renforcee : l'integration
      dette+droit+morale n'est pas une particularite europeenne mais
      un universel des societes complexes.
    preuve_tranchante: "Wikipedia Sharia (couverture exhaustive documentee)"
    fiabilite: ✦
  - id: C-I003
    nom: "Riba (interdiction) vers andurarum (annulation) : deux reponses a la dette"
    description: >-
      Riba (Coran, sourate 2:275-279) INTERDIT la creation de la dette
      a interet. Andurarum (Mesopotamie) ANNULE periodiquement les
      dettes existantes. Plus radical (interdit la creation), plus
      durable (interdiction permanente, pas edits ponctuels), plus
      systematique (tous les prets, pas seulement agricoles). MAIS
      contournements : hiyal (montages juridiques des hanafites et
      malikites) reproduisent l'interet sous des formes
      contractuellement differentes. Lecon : l'interdit theorique
      est contourne structurellement, comme l'andurarum.
    preuve_tranchante: "Wikipedia Riba + Hiyal (chainage documente)"
    fiabilite: ✦
  - id: C-I004
    nom: "Oulemas comme corps specialise analogue aux enarques"
    description: >-
      Oulemas (savants religieux) MEME FONCTION que scribes sumeriens,
      jurisconsultes romains, mandarins chinois, enarques francais :
      interpreter la norme. MEME ENDOGAMIE : reproduction par
      filiation + madrasa (formation religieuse). MEME CAPTURE
      POTENTIELLE : alliance avec calife/sultan -> gardiens du
      systeme plutot que serviteurs de la justice. MAIS
      CONTREPOIDS UNIQUE : les oulemas ne sont PAS nommes par le
      pouvoir politique. Leur autorite vient du savoir religieux,
      pas d'un concours ou d'une nomination royale. Ce contrepoids
      a partiellement fonctionne (revoltes des oulemas contre
      califes injustes) mais s'est affibli avec l'alignement
      califat-oulemas sous les Abbassides.
    preuve_tranchante: "Wikipedia Ulema (structure du corps documentee)"
    fiabilite: ✦
  - id: C-I005
    nom: "Al-Andalus 711-1492 : laboratoire de transmission puis rupture"
    description: >-
      Al-Andalus (Espagne islamique) 711-1492 (781 ans). Apogee Xe s. :
      Cordoue 500 000 habitants, bibliotheques immenses, ecoles de
      medecine, traduction de textes grecs. Chute progressive :
      perte de Tolede (1085), chute de Cordoue (1236), chute de
      Grenade (1492), expulsion des Morisques (1609). RUPTURE
      brutale avec la Reconquista : les savoirs accumules sont
      partiellement transmis aux universites europeennes via les
      traducteurs de Tolede (XIIe), mais la communaute productrice
      est detruite. La France herite ainsi de textes mais PAS de
      la tradition vivante qui les a produits.
    preuve_tranchante: "Wikipedia Al-Andalus, School of Toledo"
    fiabilite: ✦

