these_centrale: >-
  L'Islam (VIIe-XIIIe s.) est la grande absente du recit "3 civilisations
  antiques" et le chainon MANQUANT de la transmission vers l'Europe. La
  these SYSTEME est renforcee : la charia integre culte, transactions,
  droit penal, droit familial, ethique et economie dans un MEME cadre
  juridique, plus complet que Sumer, Rome ou Chine. La these TRANSMISSION
  est BOULEVERSEE : Rome -> MA -> France est un recit eurocentrique. La
  chaine reelle est Rome -> Bagdad (Bayt al-Hikma) -> Cordoue -> Tolede
  -> Paris. Sans les traductions arabes, Irnerius n'aurait pas retrouve
  le CJC a Bologne. La these CAPTURE est RELATIVISEE : les oulemas
  (specialistes religieux du droit) fonctionnent comme un corps separe,
  endogame, coopte par le calife/sultan. La capture n'est pas un
  accident europeen mais une TENDANCE universelle des societes complexes.

theses_implicites:
  - >-
    Le "trou de 594 ans" (476-1070) entre la chute de Rome et la
    redecouverte du CJC a Bologne n'est pas un vide europeen : il
    est comble par l'Islam. Bayt al-Hikma (~830) traduit systematiquement
    Aristote, Galien, Ptolemee du grec vers l'arabe. Cordoue (Xe-XIIe)
    et Tolede (XIIe) traduisent ensuite de l'arabe vers le latin. Sans
    l'Islam, pas de redecouverte europeenne des textes antiques.
  - >-
    Le riba (interdiction coranique de l'interet) est PLUS radical que
    l'andurarum sumerien : il interdit la CREATION MEME de la dette a
    interet, pas seulement l'annulation periodique. Il est plus durable
    (interdiction permanente) et plus systematique (tous les prets, pas
    seulement agricoles). MAIS les contournements (hiyal, montages
    juridiques) demontre que l'interdit theorique est contourne
    structurellement. Lecon : l'integration maximale n'empeche pas la
    capture.
  - >-
    Les oulemas (specialistes du droit religieux) sont comparables aux
    scribes sumeriens, juristes romains, mandarins chinois, enarques
    francais. MEME fonction (interpreter la norme), MEME endogamie
    (reproduction par filiation + madrasa), MEME capture potentielle
    (alliance avec calife/sultan). MAIS contrepoids unique : ils ne
    sont PAS nommes par le pouvoir politique (autorite par le savoir,
    pas par nomination). Ce contrepoids a partiellement fonctionne.

