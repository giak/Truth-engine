iceberg:
- angle: Rome comme recit selectif (droit retenu, esclavage ignore)
  convergence: 0.8
  description: 'La France choisit sa Rome comme toutes les societes avant elle : chaque
    epoque selectionne les elements du passe qui servent son recit present. La Republique
    francaise retient le droit romain (qui legitime l''Etat) et ignore l''esclavage
    (qui destabilise le recit republicain universaliste).'
  source_section: §18 ICEBERG
- angle: Nexum aboli mais dette jamais resolue (Gracques, Catilina, 33 ap.)
  convergence: 0.75
  description: 'Rome n''a PAS resolu la dette structurellement : elle a oscille entre
    abolitions ponctuelles (Gracques 133-121, Catilina 63) et crises cycliques (33
    ap. renflouement Tibere, inflation IIIe siecle 1000%). Parallele avec France 2025
    (3416 Mds, 120000 dossiers surendettement/an) : aucun des deux systemes n''a de
    mecanisme d''annulation structurelle.'
  source_section: §18 / §10 CHAINE 1
- angle: 'Cursus honorum / INSP : parallele structurel fort'
  convergence: 0.7
  description: Meme fonction d'elite administrative (formation, carriere planifiee,
    postes cles, reseau de pairs) mais echelle x800 (5000 vs 5,7M fonctionnaires).
    La France a une bureaucratie de masse la ou Rome avait une aristocratie de service.
  source_section: §18 / §10 CHAINE 3
- angle: 'Corpus Juris Civilis vers Code civil : filiation DIRECTE'
  convergence: 0.9
  description: C'est le parallele le PLUS solide de toute l'enquete (avec Sumer sur
    l'andurarum). Le CJC (529-534) est DANS le Code civil (1804), pas une influence,
    une inclusion textuelle. 1.5M mots de droit romain preserves. Categories (personnes,
    biens, obligations) identiques.
  source_section: §18 / §10 CHAINE 4
- angle: Chute de Rome comme mythe politique
  convergence: 0.75
  description: 'Instrumentalise par tous les bords (Gibbon critique l''Eglise, Mussolini
    invoque l''Empire, les Lumieres celebrent la Republique), mais les causes structurelles
    (inflation, fiscalite excessive, bureaucratisation, perte de legitimite) sont
    reelles. La France 2025 presente des symptomes similaires : dette 115,6% PIB,
    defiance institutionnelle 70%, complexite administrative paralysante.'
  source_section: §18 / §8 / §16
shadow_factor: 2.8
ce_qui_tient:
- Abolition nexum 326 av. verifie, source fiable
- Corpus Juris Civilis vers Code civil filiation directe documentee
- Cursus honorum = ancetre INSP structure identique
- Crise 33 ap. = ancetre crise 2008 mecanisme similaire (renflouement d'Etat)
- Annone = ancetre Etat-providence fonction analogue
- Esclavage massif 30-40% Italie documente
ce_qui_tombe:
- 'Rome avait resolu la dette faux : oscillations sans solution structurelle'
- Parallele bureaucratique parfait ratio x800 cache difference de nature
- 'Chute de Rome = avertissement direct nuance : chaque epoque projette sa propre
  peur'
- 'Rome = notre heritage complet faux : heritage SELECTIF (droit oui, esclavage non)'
limites:
- 'Biais élitaire des sources : 90% de ce qu''on sait de Rome vient de sénateurs (Cicéron,
  Tacite, Tite-Live). Esclaves, femmes, pauvres sont silencieux.'
- 'Temporalité compressée : 1200 ans de Rome traités comme ''la Rome antique'' — la
  République diffère radicalement de l''Empire'
- 'Biais Gibbon : le récit du Déclin et de la Chute (1776) imprègne encore toute lecture
  de Rome malgré sa critique'
- 'Instrumentalisation moderne : Rome est un répertoire symbolique réutilisé par tous
  les régimes (Mussolini, USA, UE) — aucun accès ''neutre'' à Rome n''existe'
- 'Données économiques lacunaires : pas de comptabilité nationale romaine. Budgets
  et PIB sont des reconstitutions approximatives'
- Le chiffre de 30-40% d'esclavage en Italie est une fourchette très large (Bates)
  — la réalité provinciale varie énormément
- 'Césure Rome/Byzance arbitraire : Justinien compile le droit romain en 529-534,
  soit ~80 ans après la chute officielle de l''Empire d''Occident (476)'
perspectives_dialectiques:
- scenario: A — L'héritage romain est une sélection (thèse critique)
  these: 'La Rome que nous invoquons est un artefact politique. Gibbon a instrumentalisé
    la ''décadence'' pour critiquer l''Église ; Mussolini a instrumentalisé l''Empire
    ; les Lumières ont instrumentalisé la République. Chaque époque choisit la Rome
    qui sert son récit. La France fait de même : elle retient le droit romain (qui
    légitime l''État) et ignore l''esclavage (qui déstabilise le récit républicain).
    Les parallèles sont vrais mais sélectifs.'
  cui_bono: Historiens critiques, déconstructeurs du récit national (Mary Beard)
  score: 0.6
- scenario: B — Rome est un avertissement (thèse investigation)
  these: 'Rome a duré 1000 ans avec des institutions remarquablement stables (Sénat,
    droit, armée). Sa chute n''est pas venue des Barbares mais de causes internes
    : inflation, fiscalité excessive, bureaucratisation, perte de légitimité. La France
    présente des symptômes similaires : dette 115,6% PIB, défiance institutionnelle
    70%, complexité administrative paralysante. La question n''est pas ''Rome avait-elle
    des solutions ?'' mais ''la France répète-t-elle les mêmes erreurs ?'''
  cui_bono: Réformateurs anti-statu-quo, lecteurs attentifs de Tite-Live
  score: 0.65
- scenario: C — Filiation directe comme continuum juridique (thèse patrimoniale)
  these: 'Le Corpus Juris Civilis (529-534) n''est pas une ''influence'' romaine sur
    la France : c''est une inclusion textuelle. 1500 ans de continuité juridique (Rome
    → Justinien → Bologne XIe s. → Code civil 1804 → Code civil 2025) font de la France
    une héritière DIRECTE, pas une ''disciple''. Toute réforme du droit français qui
    ignore cette filiation est condamnée à la superficialité.'
  cui_bono: Juristes, historiens du droit, tradition civiliste française
  score: 0.55
tensions_non_resolues:
- 'Dette : Rome n''avait pas de dette publique vs Rome a eu des crises de credit memorables,
  donnees absentes pour budget imperial'
- 'Esclavage : Rome etait esclavagiste donc illegitime vs Rome a aboli le nexum avant
  la France, abolition nexum = fait ; esclavage = fait'
- 'Bureaucratie : 5000 fonctionnaires rien a voir vs Structure identique echelle differente,
  ratio 1/10000 vs 1/12 = diff x800'
- 'Chute : Mythe politise par Gibbon vs Avertissement structurel reel, les deux sont
  vrais'
- 'Filiation : Selective donc biaisee vs Directe donc solide, les deux sont vrais'
