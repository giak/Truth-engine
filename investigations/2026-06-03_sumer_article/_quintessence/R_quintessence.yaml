these_centrale: 'Rome et la France sont unies par une filiation DIRECTE et documentée
  — le Corpus Juris Civilis (529-534 ap.) est DANS le Code civil français (1804) —
  là où Sumer n''offrait qu''un parallèle fonctionnel spéculatif. Mais cette proximité
  est un piège : la France a sélectionné l''héritage romain qui sert son récit national
  (le droit, la République) et occulté ce qui dérange (l''esclavage massif, l''impérialisme
  violent, la faillite fiscale). Les parallèles bureaucratiques sont solides (cursus
  honorum / INSP, ratio ×800 fonctionnaire/habitant), mais l''avertissement romain
  sur la dette (abolition nexum 326 av., crise 33 ap., renflouement Tibère) reste
  inaudible : la France oscille entre les mêmes cycles d''endettement, de crise et
  de réforme sans jamais résoudre structurellement la question de la reproduction
  des élites et du surendettement public.'
theses_implicites:
- 'Le Corpus Juris Civilis (529-534) n''est pas une "influence" romaine sur la France
  : c''est une inclusion textuelle directe. Justinien a compilé 1000 ans de droit
  romain en 4 volumes (Codex, Digeste, Institutes, Novelles) ; le Code civil de 1804
  reprend ses catégories (personnes, biens, obligations) avec 2300 articles au lieu
  des ~3000 fragments du Digeste. Le multiplicateur est ~1.3×, pas 1000×.'
- 'L''abolition du nexum (326 av., lex Poetelia Papiria) n''a PAS résolu la dette
  à Rome : la cité a oscillé entre abolitions ponctuelles (Gracques 133-121, Catilina
  63), crises de crédit massives (33 ap., renflouement Tibère 100M sesterces) et inflation
  par débasement (IIIe siècle, 1000%). Le parallèle avec la France est structurel
  : pas de solution pérenne, juste des cycles de renflouement public qui valident
  le surendettement suivant.'
- 'Le ratio fonctionnaires/habitants est trompeur si on s''arrête au chiffre absolu
  : Rome 5000 fonctionnaires / 50-80M hab. = 1/10000-16000 ; France 5,7M / 68M = 1/12.
  Mais la nature du fonctionnaire diffère : procurateurs romains étaient des EQUITES
  (ordre équestre, propriétaires) servant de gestionnaires de province, pas une carrière
  de masse. Le parallèle structurel (cursus honorum → INSP) est valide, mais l''échelle
  ×800 cache une différence de nature : la France a une classe administrative de masse
  là où Rome avait une aristocratie de service.'
