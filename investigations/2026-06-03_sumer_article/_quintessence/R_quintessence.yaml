causalites:
- id: C-R001
  nom: 'Dette : Nexum → Abolition → Crédit → Crise → Renflouement'
  description: 'L''abolition du nexum (326 av.) libère les débiteurs de la contrainte
    corporelle, ce qui permet au crédit privé de se développer sans garantie humaine.
    L''aristocratie romaine s''endette massivement (Gracques 133-121), des crises
    cycliques surviennent (Catilina 63, crise 33 ap.), Tibère renfloue avec 100M sesterces
    sans réforme structurelle. Le cycle recommence. Quantification : 100M sesterces
    injectés (Tibère) ; 2008 France : 400 Mds€ de renflouement bancaire.'
  preuve_tranchante: Abolition nexum = fait historique vérifié ; crise 33 = Wikipedia
    article dédié
  fiabilite: ✦
- id: C-R002
  nom: 'Dette France : Surendettement → Procédure individuelle → Pas d''annulation'
  description: 'Crise économique (2008 Lehman, 2020 Covid) → perte d''emploi → accumulation
    dettes → 120000 dossiers/an déposés → Commission Banque de France → plan d''apurement
    individuel (effacement partiel, rééchelonnement) → PAS d''annulation générale
    ni d''abolition structurelle. Quantification : 120000 dossiers/an, 3416 Mds€ dette
    publique (115,6% PIB). Cross-domain : DETTE → ÉCONOMIE → JUSTICE.'
  preuve_tranchante: Statistiques Banque de France, données T2 2025 INSEE
  fiabilite: ✦
- id: C-R003
  nom: 'Bureaucratie : Cens → Cursus honorum → Grands corps'
  description: 'Censitaires romains (5 classes de richesse, Servius Tullius) → Cursus
    honorum (questeur → édile → préteur → consul → censeur) → Magistratures et promagistratures
    → Clientèle et réseau des ordines (sénateurs, chevaliers) → Élite auto-reproductive.
    Parallèle France : Grandes écoles (ENS, Polytechnique, ENA) → INSP → Postes clés
    (directions ministères, cabinets, grands corps) → Reproduction des élites. Quantification
    : Rome ~5000 fonctionnaires / 50-80M hab. (1/10000-16000) ; France 5,7M / 68M
    (1/12). Ratio ×800.'
  preuve_tranchante: Purdue (Rome) + IFrap (France) + ratio arithmétique direct
  fiabilite: ✦
- id: C-R004
  nom: 'Droit : Douze Tables → Ius Gentium → Corpus Juris → Code civil'
  description: 'Douze Tables (451-450 av.) : premier code écrit → Praetor peregrinus
    (242 av.) crée le ius gentium (droit des gens, pour non-citoyens) → Jurisconsultes
    (Ier s. av.-IIIe s. ap., doctrine à force de précédent) → Corpus Juris Civilis
    (529-534, Justinien compile 1000 ans de droit) → Redécouverte Bologne (XIe s.,
    gloses, commentateurs) → Code civil français (1804, 2300 articles). FILIATION
    DIRECTE ET DOCUMENTÉE — pas spéculative. Multiplicateur : ~12 articles (Tables)
    → 2300 articles (Code civil). Taux de conservation : 1.5M mots de droit romain
    préservés.'
  preuve_tranchante: Wikipedia (Twelve Tables, Napoleonic Code) + Quest Journals (CJC)
  fiabilite: ✦
- id: C-R005
  nom: 'Dogme : Pax deorum → Culte impérial → Christianisme → Laïcité'
  description: 'Religion publique romaine polythéiste (pax deorum comme fondement
    de l''État) → Culte impérial instauré par Auguste (27 av.) → Persécution des chrétiens
    (Ier-IIIe s., refus de vénérer l''empereur) → Conversion Constantin (312, édit
    de Milan) → Christianisme religion d''État (391, édit de Théodose) → Sécularisation
    progressive (XIXe s.) → Laïcité (1905, loi de séparation). Quantification : 300
    ans de transition paganisme → christianisme ; ~100 ans de sécularisation française.
    Cross-domain : RELIGION → JUSTICE (légitimation des lois) → POUVOIR.'
  preuve_tranchante: Continuité documentée par sources primaires (Eusèbe, Augustin,
    Symmaque)
  fiabilite: ✦
