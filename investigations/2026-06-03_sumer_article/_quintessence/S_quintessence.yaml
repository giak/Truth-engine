shadow_factor: 3.1
these_centrale: 'Sumer et la France partagent des structures fonctionnelles communes
  (dette, bureaucratie, redistribution, droit, dogme) à des échelles incommensurables,
  mais chaque parallèle doit être accompagné de son Shadow Factor (3.1×) : la complexité
  réelle est ~3× supérieure à ce que la comparaison laisse voir, et la reconstruction
  savante de Sumer (occidentale, basée sur <10% des tablettes) est asymétrique à la
  France vécue (données complètes, 2026).'
theses_implicites:
- L'andurarum sumérien n'est pas un "jubilé moderne" mais un outil politique ponctuel
  (1 tous les 33 ans en moyenne), pas un mécanisme systémique de redistribution comparable
  à la Sécurité sociale française.
- 'Le parallèle scribes/INSP est le plus solide de l''enquête, mais l''échelle (×1000)
  et le pouvoir décisionnel diffèrent radicalement : le scribe sert le temple/roi,
  le technocrate sert "l''État" au nom du peuple.'
- 'La dette française (3 416,3 Mds€, 115,6% PIB) est un problème réel mais l''analogie
  avec l''andurarum est un faux-ami : taux bas, majorité détenue par non-résidents
  (54,7%), hors-bilan ~500-800 Mds€ — profil structurellement différent du surendettement
  paysan sumérien.'
