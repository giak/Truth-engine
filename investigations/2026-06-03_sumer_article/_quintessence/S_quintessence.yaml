iceberg:
- angle: Sumer comme construction occidentale instrumentalisée
  convergence: 0.75
  description: 'Kramer, Jacobsen, et l''enquête : Sumer sert des récits modernes (démocratie
    originelle, éden perdu). Reconstruction savante, pas réalité historique.'
  source_section: §18 ICEBERG / §13 biais 6
- angle: Andurarum ≠ jubilé moderne
  convergence: 0.8
  description: Outil politique ponctuel (1/33 ans en moyenne), PAS mécanisme systémique.
    Comparer à fréquence crises françaises (1/30-40 ans) = différence non spectaculaire.
  source_section: §18
- angle: Temple redistributeur ≠ Sécurité sociale
  convergence: 0.7
  description: Temple redistribuait à SON PERSONNEL (salaire en nature), pas à la
    population générale comme la Sécu universelle. Polanyi sur-interprète.
  source_section: §8.2 / §12 Scénario A
- angle: Urukagina = restauration conservatrice, pas innovation
  convergence: 0.75
  description: Schrakamp & Zólyomi (2025, De Gruyter) montrent que les 'réformes'
    sont une RESTAURATION de l'ordre divin traditionnel contre les abus des prêtres,
    pas une innovation sociale progressiste. 'Réforme' = anachronisme moderne.
  source_section: §8.4 / §18 correction V2
- angle: Absence irakienne = trou épistémique post-colonial
  convergence: 0.85
  description: Journal Sumer (Bagdad, ISSN 0081-9271) non consulté. Perspective non-occidentale
    absente. L'enquête regarde Sumer depuis l'Europe, pas depuis l'Irak.
  source_section: §13 biais 9
