causalites:
- chaine: Dette paysan → esclavage pour dette → crise agraire → andurarum → stabilisation
  liens:
  - Crise agricole Sumer/Lagash
  - Endettement paysans
  - Vente forcée terres/esclavage
  - Décision royale (amargi)
  - Annulation + retour terres
  - Stabilisation + base fiscale
  quantification: ~30 cycles / 1000 ans (2400-1400) — fréquence ~1/génération
  source_section: §10 CHAÎNE 1
- chaine: Crédit → surendettement → procédure individuelle → pas d'annulation collective
  liens:
  - Crise éco (2008/2020)
  - Perte emploi/maladie/divorce
  - Accumulation dettes
  - Dossier surendettement (120K/an)
  - Commission Banque de France
  - Apurement partiel
  quantification: 120 000 dossiers/an (2024)
  source_section: §10 CHAÎNE 2
- chaine: Formation longue → jargon spécialisé → accès pouvoir → reproduction élite
  liens:
  - Élite (fils de scribes / bourgeois)
  - Edubba 8-12 ans / INSP 7 ans
  - Sumérien administratif / jargon
  - Postes temple/palais/État
  - Reproduction par cooptation
  quantification: Sumer <1% scribes / France 5,7M fonctionnaires (22%)
  source_section: §10 CHAÎNE 3
- chaine: Dogme → ordre social → hiérarchie → pouvoir des élites
  liens:
  - Religion sumérienne / laïcité républicaine
  - Roi/État agent dieux/peuple
  - Ordre divin/rationnel
  - Hiérarchies justifiées
  - Maintien pouvoir élites
  quantification: Sumer ~3000 dieux / France 1905 (loi), 15% pratique catholique,
    70% défiance institutions
  source_section: §10 CHAÎNE 4
- chaine: Code court → complexification → inflation législative (Sumer → France)
  liens:
  - Code Ur-Nammu (57 art.)
  - Lipit-Ishtar (~1200 lignes)
  - Hammourabi (282 art.)
  - Droit romain (Douze Tables)
  - Code civil (2300 art.)
  - 15 000 lois + 400K pages
  quantification: Multiplicateur ×260 (57 → 15 000) ; ~33 art./an moyens depuis 1804
  source_section: §10 CHAÎNE 5
  note: Filiation Sumer→Rome non documentée directement — convergence probable, pas
    transmission.
perspectives_dialectiques:
  p1_officielle:
    these: La complexité moderne est un progrès, pas une pathologie
    arguments:
    - Droit 15 000 lois = 200 ans de sédimentation démocratique
    - Sécurité sociale couvre 100% (vs temple = personnel)
    - Fonctionnaires 76/1000 = continuité État, pas caste
    - Endettement 115,6% PIB = soutenable (taux ~3%)
    - Laïcité 1905 = neutralité, Sumer ne l'avait pas
    acteurs:
    - DGAFP
    - INSEE
    - Banque de France
    - Conseil d'État
    suspicion: 0.5
  p2_critique:
    these: La complexité masque une régression et constitue un outil de capture
    arguments:
    - Dette +1 000 Mds€ en 7 ans = transfert vers rentiers
    - 120K dossiers surendettement = esclavage pour dette moderne
    - Grands corps = caste auto-reproductive (Le Monde 2024)
    - 76/1000 = 2× Allemagne (11% vs 22% pop. active)
    - Jargon technocratique = langue de spécialistes inaccessibles
    acteurs:
    - Michael Hudson
    - Dominique Charpin (nuance)
    - IFrap
    - Thomas Piketty
    suspicion: 0.65
  p3_arbitrage:
    faits:
    - Code Ur-Nammu 57 art. vs Code civil 2 300 art.
    - Taux fixes (orge 33%, argent 20%) vs marché
    - ~30 annulations/1000 ans = ~1/33 ans
    - Edubba 8-12 ans vs INSP 7 ans (comparable)
    - 5,7M fonctionnaires vs <1% scribes sumériens
    - Pas de dette publique Sumer (roi = débiteur ultime)
    synthese: 'Parallèles fonctionnels réels mais échelle incommensurable. Ce qui
      change : taille population (30K-80K vs 68M), marché financier globalisé, démocratie
      imparfaite. La complexité française protège des droits (WJP France 95/100, Iraq
      27/100).'
limites:
- 'Asymétrie temporelle : Sumer = reconstruction 1500 ans ; France = point 2026. ''Sumer''
  n''a jamais existé comme entité unifiée.'
- 'Biais de source : Kramer, Hudson, Polanyi ont leurs agendas. Kramer a sur-interprété
  Sumer comme ''berceau de tout''.'
- 'Données lacunaires : 500K-2M tablettes excavées, ~100K publiées (<10%). Biais de
  conservation : textes administratifs > littérature, temples > maisons privées.'
- 'Filiation non documentée : aucune preuve directe Sumer → Rome → France. Similitudes
  = convergences indépendantes probables.'
- 'Comparaison normative : ''Sumer avait la solution'' est un artefact, pas une preuve
  que la solution ''marchait'' mieux.'
- 'Biais du web anglophone : 0 recherche en arabe, 0 en allemand. Journal irakien
  Sumer (Bagdad, ISSN 0081-9271) non consulté.'
