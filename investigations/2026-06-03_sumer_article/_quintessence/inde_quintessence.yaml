these_centrale: 'L''Inde ancienne est le TEST DÉCISIF pour la thèse de l''article : elle confirme l''intégration (dharma =
  système le plus intégré après la charia), confirme la capture (brahmanes = caste spécialisée), MAIS infirme la dette comme
  MÉCANISME CENTRAL (pas d''andurarum indien, dette = obligation karmique, pas annulation).'
theses_implicites:
- 'L''Inde avait un système intégré LOIN DE LA DETTE : dharma (droit/morale/religion) + caste (hiérarchie sociale) — pas besoin
  d''andurarum'
- Les brahmanes formaient un corps de spécialistes comparable aux scribes/juristes/mandarins, MAIS leur pouvoir vient de la
  CONNAISSANCE des textes sacrés, pas d'une nomination royale
- L'Inde avait des corporations (shreni) avec PERSONNALITÉ JURIDIQUE dès le 8e s. BCE — avant Rome et bien avant l'Europe
  médiévale
- L'Arthashastra de Kautilya (Ier-IIIe s. CE) est un traité de science politique COMPLET, comparable à Machiavel mais 1700
  ans plus tôt
- L'Inde représentait ~32% du PIB mondial en 1 CE — son omission du récit civilisationnel est un BIAIS POST-COLONIAL majeur
- La caste est la CAPTURE par excellence — plus efficace que la bureaucratie chinoise ou française, elle dure 3000 ans
