causalites:
- cause: F-005
  effet: F-008
  mecanisme: Dette = obligation karmique (transmissible aux héritiers) → pas besoin d'andurarum, la sanction religieuse suffit
- cause: F-002
  effet: F-012
  mecanisme: Shreni (corporations bancaires dès 8e s. BCE) → fixation de taux d'intérêt différenciés par caste (Manu) → intégration
    économie+hiérarchie
- cause: F-007
  effet: F-003
  mecanisme: Empire Maurya (1re unification) → besoin d'administration centralisée → Arthashastra comme manuel du roi
perspectives_dialectiques:
- position: Thèse SYSTÈME confirmée mais TRANSFORMÉE
  argument: L'Inde a poussé l'intégration PLUS LOIN via dharma, mais via caste+karma, pas via dette+andurarum
- position: Thèse CAPTURE confirmée mais NUANCÉE
  argument: Les brahmanes = caste de spécialistes du droit comparable aux juristes romains et mandarins chinois. Capture par
    endogamie de caste, pas par cooptation administrative
- position: Thèse TRANSMISSION TRANSFORMÉE
  argument: L'Inde n'a PAS été une ceinture de transmission vers l'Europe (contrairement à l'Islam). Mais elle était connectée
    au monde antique (océan Indien, route de la soie)
limites:
- 'Biais occidental : sources presque toutes en anglais, pas de sources en tamoul/sanskrit/hindi'
- Wikipedia comme source primaire, pas les textes originaux (Arthashastra, Manusmriti)
- Pas d'accès aux manuscrits originaux
- 'Inverse le biais de l''article : pourrait SUR-estimer l''importance de l''Inde pour compenser l''omission'
wolves:
- nom: Eurocentrisme / récit 'miracle européen'
  argument: Les 'grandes civilisations' sont celles qui mènent à l'Europe
  reponse: L'Inde était 32% du PIB en 1 CE. Le 'miracle européen' est une reconstruction post-XVIIe, pas un fait antique
- nom: Système de castes (justification interne)
  argument: La caste est un ordre divin, pas une hiérarchie sociale
  reponse: La caste est une fermeture d'élite MAXIMALE (naissance détermine statut) qui bloque la mobilité sociale pendant
    3000 ans
- nom: Lecteurs orientalistes
  argument: L'Inde est une civilisation 'mystérieuse' et 'spirituelle', pas pragmatique
  reponse: L'Arthashastra est un traité PRAGMATIQUE de science politique, comparable à Machiavel. Les shreni étaient des corporations
    CAPITALISTES
- nom: Nationalistes hindous contemporains (BJP)
  argument: L'Inde était la plus grande civilisation, l'Occident l'a détruite
  reponse: La critique est valide (occultation occidentale), mais la SUR-valeur nationaliste (Vedas = science quantique) est
    aussi un biais
iceberg:
- 'Sujet immergé #1 : la dette n''est PAS le mécanisme central d''intégration en Inde (karma oui, dette non)'
- 'Sujet immergé #2 : les brahmanes sont une caste de CAPTURE plus efficace que les énarques (3000 ans de reproduction endogame)'
- 'Sujet immergé #3 : les shreni (corporations) sont CAPITALISTES et antérieures à Rome'
- 'Sujet immergé #4 : l''Inde était 32% du PIB en 1 CE — la plus grande économie de l''histoire antique'
- 'Sujet immergé #5 : l''Arthashastra est un traité de science politique COMPLET, 1700 ans avant Machiavel'
