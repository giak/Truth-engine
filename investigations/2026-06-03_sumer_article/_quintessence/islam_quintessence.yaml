perspectives_dialectiques:
- position: Thèse SYSTÈME (intégration maximale)
  argument: La charia prouve qu'une société peut intégrer culte + économie + droit + morale dans un SEUL cadre. Score SYSTÈME
    passe de 0.72 à ~0.85
- position: Thèse TRANSMISSION corrigée
  argument: La filiation n'est pas Rome → 594 ans → Bologne. C'est Rome → Islam (Bagdad/Cordoue) → Europe. L'article actuel
    est eurocentrique même dans son récit de transmission
- position: Thèse CAPTURE relativisée
  argument: Les oulémas sont un corps de spécialistes comparable aux énarques MAIS avec contre-pouvoir (autorité religieuse
    ≠ nomination politique). L'intégration n'empêche pas la capture — elle la transforme
limites:
- 'Biais orientaliste : sources occidentales dominantes, perspective islamique autochtone rare'
- 'Shadow Factor 3,5× : le riba est contourné dans la pratique (hiyal), écart norme/pratique'
- 'Charia moderne : diversité d''interprétations (4 écoles sunnites + chiites)'
- 'L''Islam n''est pas un 4e miroir comparable à Sumer/Rome/Chine : c''est un CHAÎNON MANQUANT de la TRANSMISSION et une PREUVE
  ULTIME de la thèse SYSTÈME'
wolves:
- nom: Eurocentrisme académique
  argument: Rome → Bologne est la chaîne de transmission classique
  reponse: La vraie chaîne est Rome → Bagdad → Cordoue → Tolède → Bologne. Sans l'Islam, pas de redécouverte bolonaise
- nom: Lecteurs Occidentaux (sinophiles)
  argument: L'Islam est un 'pont' entre Grèce et Europe
  reponse: L'Islam n'est pas un PONT, c'est un CONSERVATEUR ACTIF. Les textes grecs ont été préservés, commentés, et AMÉLIORÉS
    pendant 5 siècles en arabe
- nom: Idéologues du 'choc des civilisations' (Huntington)
  argument: Islam vs Occident — incompatibilité civilisationnelle
  reponse: La Scolastique médiévale (Thomas d'Aquin) INTÈGRE Aristote via Avicenne/Averroès. L'Islam EST dans l'ADN intellectuel
    de l'Europe
- nom: Banque islamique contemporaine
  argument: La finance islamique est une alternative morale au capitalisme
  reponse: Le riba a TOUJOURS été contourné (hiyal). La finance islamique moderne est partiellement marketing. Mais l'innovation
    dans la contrainte est réelle
iceberg:
- 'Sujet immergé #1 : l''Islam est la ceinture de transmission VRAIE, pas Rome → Bologne directement'
- 'Sujet immergé #2 : le riba est plus radical que l''andurarum (interdit la création, pas seulement l''annulation)'
- 'Sujet immergé #3 : les oulémas ont un contre-pouvoir (autorité religieuse) que les énarques n''ont pas'
- 'Sujet immergé #4 : la charia est l''intégration TOTALE — culte, droit, économie, morale, famille dans un seul cadre'
- 'Sujet immergé #5 : l''Islam a influencé la Scolastique médiévale (Thomas d''Aquin) via Avicenne/Averroès'
