these_centrale: 'L''Islam (VIIe-XIIIe s.) est la CIVILISATION MANQUANTE de l''article : il est la ceinture de transmission
  VRAIE (Rome → Bagdad → Cordoue → Tolède → Bologne), la preuve ULTIME de la thèse SYSTÈME (charia = intégration maximale),
  et la RELATIVISATION de la thèse CAPTURE (les oulémas sont un corps comparable mais avec contre-pouvoir).'
theses_implicites:
- 'La charia est le système juridique le PLUS INTÉGRÉ de tous ceux étudiés : culte + transactions + pénal + familial + éthique
  + économie dans UN même cadre'
- Le Bayt al-Hikma (Bagdad, ~830) et Córdoba-Tolède (Xe-XIIe) sont la VRAIE chaîne de transmission du savoir antique, pas
  Rome → Bologne
- Le riba (interdiction coranique de l'intérêt) est un mécanisme PLUS RADICAL que l'andurarum sumérien (interdit la création
  de dette à intérêt, pas seulement l'annulation)
- Les oulémas sont un corps de spécialistes comparable aux scribes/énarques, MAIS avec contre-pouvoir (autorité religieuse,
  pas nomination politique)
- Sans l'Islam, Irnerius n'aurait pas eu accès au CJC — la 'redécouverte' bolonaise dépend des traductions arabes antérieures
- L'Islam prouve que la capture par un corps spécialisé est une tendance de TOUTE société qui produit des spécialistes du
  droit — pas une pathologie européenne
