    1439 → bureaucratie de perception → ancêtres des grands corps
perspectives_dialectiques:
- position: Thèse officielle (récit national)
  argument: Philippe Auguste + Saint Louis + Philippe le Bel = fondateurs progressifs de l'État moderne. Le MA est le berceau
    de la France
- position: Antithèse critique (post-coloniale)
  argument: 'Le MA européen est en réalité MA islamo-chrétien : Bagdad → Cordoue → Tolède → Bologne est la vraie chaîne, pas
    Rome → Bologne'
- position: 'Synthèse : ceinture de transmission CONTEXTUELLE'
  argument: Le MA a TRANSMIS l'héritage antique, mais en le filtrant par la féodalité, le christianisme, et la guerre. La
    France qui en sort n'est pas Rome — c'est une RÉINTERPRÉTATION
limites:
- 'Biais Renaissance : le terme ''Moyen Âge'' délégitime la période (invention des humanistes)'
- 'Biais Révolutionnaire : la Révolution a construit son récit sur le rejet du MA comme ''Ancien Régime'''
- Pas de sources primaires consultées (rôles Chambre des Comptes, registres Parlement)
- Période carolingienne (751-987) sous-représentée — la renaissance carolingienne prépare Bologne
- Période 1515-1789 (absolutisme, offices, Paulette 1604) sous-représentée
wolves:
- nom: Récit national classique
  argument: Le MA est l'ancêtre DIRECT de la France moderne
  reponse: Le MA est un MÉDIATEUR (ceinture de transmission) qui filtre l'héritage antique par la féodalité et le christianisme.
    Pas une continuité pure
- nom: Juristes catholiques (XIXe)
  argument: Le droit romain est notre tradition, transmis sans rupture
  reponse: 470 ans de perte (600-1070). Bologne est une REDÉCOUVERTE, pas une transmission. Le filtre féodal est majeur
- nom: Historiens marxistes
  argument: Le MA est une parenthèse féodale entre Rome et le capitalisme
  reponse: Le MA invente la dette publique (rentes), l'État fiscal (États généraux, taille) — des INSTITUTIONS durables
- nom: Historiens orientalistes (Pirenne)
  argument: Le MA est créé par l'Islam (Mahomet, pas Mahomet, le vide créé par la rupture avec l'Orient)
  reponse: 'La thèse Pirenne (1922) : sans rupture commerciale Orient-Occident (VIIe-VIIIe), pas d''émergence de l''Occident.
    Reprise par Hodges, Wickham'
iceberg:
- 'Sujet immergé #1 : la vraie chaîne de transmission est Rome → Islam (Bagdad/Cordoue) → Tolède → Bologne — pas Rome → Bologne
  directement'
- 'Sujet immergé #2 : la féodalité est la ''caste'' médiévale — l''INSP moderne en est l''héritier (et la rupture est incomplète)'
- 'Sujet immergé #3 : la spoliation des Templiers (1307) est le précédent médiéval de l''annulation de dette par la force
  — utilisé ensuite par les rois successifs'
- 'Sujet immergé #4 : ''quod principi placuit'' est la formule de l''absolutisme qui FONDE la monarchie française (et que
  la Révolution ABOLIT)'
- 'Sujet immergé #5 : la crise du XIVe siècle (Guerre Cent Ans + peste) est analogue à la crise contemporaine (COVID + dette)
  — la réponse médiévale est ''plus d''État'', la réponse contemporaine est ''plus de capture'''
