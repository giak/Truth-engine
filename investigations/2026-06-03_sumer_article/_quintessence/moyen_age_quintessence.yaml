causalites:
- cause: F-001
  effet: F-006
  mecanisme: Redécouverte CJC (Bologne 1070) → tradition glossatrice → légistes (Pierre Flotte, Nogaret) → Parlement de Paris
    (1250) → magistrats professionnels
- cause: F-002
  effet: F-012
  mecanisme: Digeste de Justinien (quod principi placuit) → monarchie absolue → absolutisme → Révolution française (rupture
