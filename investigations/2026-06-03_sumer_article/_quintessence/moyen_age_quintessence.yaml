these_centrale: 'Le Moyen Âge (987-1515) est la CEINTURE DE TRANSMISSION qui fait passer l''héritage antique vers l''État
  français moderne, via trois inventions : la redécouverte du droit romain (Bologne 1070), l''invention de la dette publique
  (rentes HDV 1522 + spoliation Templiers 1307), et l''invention de l''État fiscal (États généraux 1302 + taille permanente
  1439).'
theses_implicites:
- Sans Bologne 1070, le Code civil français (1804) n'existerait pas — le CJC comble 594 ans de perte (476-1070)
- La rente sur l'Hôtel de Ville de Paris (1522) est l'ORIGINE de la dette publique française moderne — les 54 Mds€ d'intérêts/an
  en descendent
- Les légistes de Philippe le Bel (Pierre Flotte, Nogaret, Marigny) sont les ancêtres directs des grands corps (INSP, Conseil
  d'État)
- La féodalité (Xe-XVe s.) est la forme médiévale de l'asymétrie verticale — la 'caste des 20 familles' modernes en est une
  version déguisée
- La crise du XIVe siècle (Guerre Cent Ans + peste noire) PRODUIT plus d'État — au XXIe siècle, la crise produit plus de capture
- 'Philippe le Bel est le ''fondateur moderne'' de l''État : légistes, États généraux, spoliation, fiscalité — sans lui, pas
  de monarchie absolue, pas de Révolution'
