perspectives_dialectiques:
- position: Rome comme modèle à NE PAS suivre
  argument: Esclavage 30-40%, persécution chrétiens, guerre civile, inflation — la France a fait mieux sur tous ces axes
- position: Rome comme avertissement
  argument: Rome a DURÉ 1000 ans avec esclavage. La France a 200 ans sans. La résilience romaine est un indicateur, pas un
    modèle
- position: 'Synthèse : héritage sélectif'
  argument: La France retient le droit (Code civil) et oublie l'esclavage. Cette sélection EST le 'vrai empire de mensonges'
    (terme de V1)
limites:
- Biais élitaire des sources antiques (Cicéron, Tacite, Tite-Live = tous sénateurs)
- Rome = bloc 1200 ans (Royauté → République → Principat → Dominat)
- Gibbon (1776) a biaisé tout le récit postérieur (déclin moral)
- Couverture réduite de 6 lièvres et 6 loups = 6 preuves downgradées de ✦ à ✧
wolves:
- nom: Rome classique comme 'âge d'or'
  argument: Vertus républicaines (Cincinnatus, Caton)
  reponse: Vertus d'une aristocratie esclavagiste — pas un modèle de droits humains
- nom: Edward Gibbon
  argument: Christianisme cause de la chute
  reponse: 'Révisionnistes : monnaies, fiscalité, invasions — pas la religion'
- nom: Mommsen / Pothier / Code civil
  argument: Transmission directe du CJC au Code civil
  reponse: 470 ans de perte + 700 ans de reconstruction savante = filiation reconstruite, pas continue
- nom: Hudson (extension Rome)
  argument: Annone et crises de crédit = preuve d'État-providence antique
  reponse: Annone = privilège civique pour 200k sur 1M ; crises résolues par débasement, pas annulation
iceberg:
- 'Sujet immergé #1 : esclavage 30-40% — la matrice RÉELLE de l''économie romaine'
- 'Sujet immergé #2 : femmes (tutela mulierum) — rupture civilisationnelle France 1944 / Rome antique'
- 'Sujet immergé #3 : strat juridique (pérégrins, déditices) — l''universalisme républicain est une INVENTION française'
- 'Sujet immergé #4 : ferme fiscale (publicani) — la France a SUPÉRIEUR à Rome sur l''administration de l''impôt'
- 'Sujet immergé #5 : Édit du Maximum (Dioclétien) — échec du contrôle des prix que la France a évité'
- 'Sujet immergé #6 : la ''ligne brisée'' Rome→France (perte 470 ans, double France nord/sud, Révolution)'
- 'Mnemolite INDEXEE pour Rome ICEBERG : 1 memoire directe avec 6 lievres + 6 loups, EDI* revise 0.43 (de 0.489), Shadow revise
  3.4x (de 2.8x).'
- 'Cross-references Mnemolite integrees : 1 memoires directes ou d''enrichissement'
