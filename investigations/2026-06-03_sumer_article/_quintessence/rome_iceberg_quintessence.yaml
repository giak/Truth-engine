enquete_source: investigations/2026-06-03_sumer_article/2026-06-03_14-30_rome_v2_ICEBERG_MAX_CONTRE_RAPPORT.md
these_centrale: L'investigation Rome V1 sous-estime 6 angles morts majeurs (esclavage, femmes, citoyenneté, publicani, Dioclétien,
  perte du CJC) et 4 approximations factuelles (nexum, cursus honorum, annona, crise 33 ap.). La filiation Rome→France est
  RÉELLE mais reconstruite, pas transmise.
theses_implicites:
- 'L''omission de l''esclavage (30-40% Italie) est le biais le plus grave : sans esclavage, pas de compréhension de l''économie
  romaine (latifundia)'
- Le Corpus Juris Civilis a été PERDU 470 ans en Occident (600-1070) — la 'filiation directe' est une reconstruction savante
- Le nexum (esclavage pour dette) n'est PAS l'équivalent de la prison pour dette française (contrainte par corps) — institutions
  différentes
- L'annona était un PRIVILÈGE civique masculin (~200k sur 1M d'habitants de Rome), pas un État-providence universel
- La comparaison Tiberius 33 ap. / 2008 est suggestive mais mécaniquement fausse (pas de titrisation, pas de bulle immobilière,
  pas de système financier global)
