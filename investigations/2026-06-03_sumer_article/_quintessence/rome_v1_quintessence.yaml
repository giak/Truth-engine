enquete_source: investigations/2026-06-03_sumer_article/2026-06-03_13-00_rome_vs_france_INVESTIGATION.md
these_centrale: Rome est l'ancêtre DIRECT de la France (Corpus Juris Civilis → Code civil, cursus honorum → INSP), et plusieurs
  mécanismes romains (abolition nexum 326 av., renflouement Tibère 33 ap., annona) ont des parallèles fonctionnels avec la
  France contemporaine — mais l'esclavage (30-40% Italie), la stratification juridique, et la guerre civile permanente restent
  des angles morts majeurs.
theses_implicites:
- La filiation Corpus Juris Civilis → Code civil est DIRECTE et documentée, contrairement à Sumer (1500 ans de trou)
- Rome a aboli l'esclavage pour dette (nexum) 2193 ans avant la France, mais ne l'a jamais résolu structurellement (Gracques,
  Catilina, Tibère 33 ap.)
- Le cursus honorum et l'INSP remplissent la même fonction d'élite administrative, mais le premier est politique/électif et
  le second administratif/par concours
- L'annona nourrissait 200 000 citoyens mâles — pas une sécurité sociale universelle, un PRIVILÈGE civique (femmes, esclaves,
  pérégrins exclus)
- L'Empire romain a duré 1000 ans avec esclavage et instabilité — la République française 200 ans sans. La 'leçon de Rome'
  est ambiguë
