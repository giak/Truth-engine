perspectives_dialectiques:
- position: Thèse officielle-académique
  argument: Rome est notre héritage institutionnel ; la France a amélioré ce qu'elle a reçu (citoyenneté universelle, abolition
    esclavage)
- position: Antithèse investigatif-critique
  argument: Rome avait résolu des problèmes que la France n'a pas résolus (nexum 326 av. vs prison pour dette 1867) ; Rome
    a duré 1000 ans, la Ve République 67 ans
- position: 'Synthèse : héritage sélectif'
  argument: Rome a transmis le droit (Code civil) mais aussi l'esclavage (30-40% Italie). La France a sélectionné ce qui sert
    le récit national
limites:
- 'Biais des sources : 90% de ce qu''on sait de Rome vient de sénateurs (Cicéron, Tacite, Tite-Live)'
- Rome = bloc 1200 ans (Royauté → République → Principat → Dominat) — chaque période diffère radicalement
- 'Données économiques lacunaires : pas de comptabilité nationale romaine'
- L'esclavage (30-40% Italie) est absent du récit 'berceau de la civilisation'
wolves:
- nom: Edward Gibbon (1776)
  argument: Déclin moral de Rome causé par le christianisme et la luxure
  reponse: 'Révisionnistes (Heather, Ward-Perkins) : causes structurelles (monnaie, fiscalité, invasions)'
- nom: Mussolini / extrema droite
  argument: Empire romain comme modèle fasciste (fascisme = fasces)
  reponse: L'Empire romain était une dictature militaire, pas un fascisme idéologique
- nom: Mommsen
  argument: Droit romain = fondement universel
  reponse: CJC a été perdu 470 ans en Occident, redécouvert par hasard à Bologne — la transmission est reconstruite, pas continue
- nom: Hudson
  argument: L'andurarum romain (analogie) prouve l'existence d'un outil anti-dette
  reponse: L'Empire romain n'a jamais annulé de dette publique — les crises Tiberius 33 et IIIe siècle sont résolues par débasement,
    pas annulation
iceberg:
- 'Sujet immergé #1 : esclavage massif (30-40% Italie) — angle mort le plus grave de l''enquête'
- 'Sujet immergé #2 : femmes (tutelle mulierum, pas de vote, pas de magistrature) — Rome moins émancipatrice que la France
  post-1944'
- 'Sujet immergé #3 : citoyenneté exclusive (pérégrins, latins, déditices) — l''universalisme républicain est une RUPTURE
  avec Rome'
- 'Sujet immergé #4 : ferme fiscale (publicani) — la France a un système SUPÉRIEUR (administration directe depuis 1948)'
- 'Sujet immergé #5 : Édit du Maximum (Dioclétien, 301 ap.) — échec retentissant du contrôle des prix, la France a évité cet
  écueil'
- 'Verdict : Mnemolite UP, base non indexée sur Rome — pas bloquant, à documenter'
- 'Mnemolite INDEXEE pour Rome : 4 memoires trouvees (tag=rome). Le verdict ''base non indexee'' est INVALIDE.'
- 'Cross-references Mnemolite integrees : 1 memoires directes ou d''enrichissement'
