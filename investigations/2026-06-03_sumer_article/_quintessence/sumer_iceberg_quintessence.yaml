enquete_source: investigations/2026-06-03_sumer_article/2026-06-03_13-00_sumer_vs_france_ICEBERG_MAX_CONTRE_RAPPORT.md
these_centrale: 'L''investigation Sumer V1 surestime la force des parallèles fonctionnels en sous-estimant 5 biais systémiques
  : biais du ''berceau'' (Kramer), biais Hudson (économie hétérodoxe), biais Polanyi (anti-marché), biais du web anglophone
  (zéro source irakienne), biais de la complexité comme perte.'
theses_implicites:
- 'L''andurarum n''est PAS un mécanisme systémique : 30 édits en 1000 ans = 1 par génération, fréquence comparable aux crises
  financières françaises'
- Sumer comme 'bloc uniforme' (1500 ans) masque des ruptures (dynastique archaïque ≠ Ur III ≠ paléo-babylonien)
- Le temple redistribuait à SON PERSONNEL, pas à la population générale — ce n'est PAS une sécurité sociale universelle
- L'absence de sources irakiennes (le journal Sumer, Bagdad, ISSN 0081-9271) reproduit un déséquilibre épistémique post-colonial
- La complexité juridique française protège les droits (WJP 95/100) — pas une pathologie, un acquis
