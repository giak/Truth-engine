causalites:
- cause: F-002
  effet: F-003
  mecanisme: L'anachronisme 'article' (V1) crée une fausse équivalence avec le Code civil moderne ; corriger la catégorie
    dissout l'asymétrie
- cause: F-004
  effet: F-006
  mecanisme: La rareté des annulations (5-8 sur 400 ans purement sumériens) soutient la thèse Charpin (conjoncturel) contre
    Hudson (structurel)
- cause: F-008
  effet: F-010
  mecanisme: Si Urukagina restaure l'ordre (et n'invente pas), Sumer comme 'origine de la justice sociale' s'effondre
perspectives_dialectiques:
- position: Thèse V1 (continuisme)
  argument: Sumer a résolu des problèmes que la France a perdus (andurarum, edubba, redistribution)
- position: Antithèse ICEBERG MAX
  argument: '5 biais systémiques sapent l''argument : ''berceau'' (Kramer), hétérodoxie (Hudson), anti-marché (Polanyi), web
    anglophone, complexité=perte'
- position: Synthèse révisée
  argument: Les parallèles sont réels mais l'ampleur est exagérée d'un facteur 3. Le 'Sumer' de V1 est une construction occidentale
    à 75% (convergence 5 faisceaux)
limites:
- Shadow Factor 3.1 calculé sur 10 dimensions cachées (temporelle, biais, asymétrie)
- 'Couverture réelle des sources : ~45% de l''optimal APEX'
- 'Biais de l''auteur : Truth Engine a écrit V1 puis s''auto-critique — risque de sur-correction'
- Filiation Sumer→Rome→France reste non documentée (1500 ans de trou)
wolves:
- nom: Kramer (assyriologie du XXe)
  argument: Sumer = 'berceau de la démocratie' (téléologie occidentale)
  reponse: Schrakamp 2025 invalide la lecture progressiste des réformes
- nom: Hudson (CADTM)
  argument: 30 annulations = politique économique moderne anticipée
  reponse: 'Charpin : rituel de légitimation, pas stabilisateur macro'
- nom: Polanyi
  argument: Temple redistributeur = alternative au capitalisme
  reponse: 'Silver 2007 : marchés privés existaient ; redistribuait à personnel, pas population'
- nom: Lecteur occidental
  argument: Sumer appartient à l'Occident savant
  reponse: Patrimoine irakien vivant (journal Sumer, Bagdad) — perspective non-occidentale absente
iceberg:
- 'Sujet immergé #1 : fabrication occidentale de Sumer (Kramer 1952, Jacobsen, Schrakamp 2025)'
- 'Sujet immergé #2 : l''andurarum n''est PAS un jubilé moderne (Charpin)'
- 'Sujet immergé #3 : scribes/grands corps — parallèle réel mais limité (×1000 d''échelle)'
- 'Sujet immergé #4 : dette française — problème réel mais parallèle faux-ami avec andurarum'
- 'Sujet immergé #5 : absence irakienne = trou épistémique post-colonial'
- 'Verdict : Mnemolite opérationnelle mais base non indexée sur Sumer — pas bloquant, à documenter'
- 'Mnemolite INDEXEE pour Sumer ICEBERG : 2 memoires directes, dont V2 corrigee avec corrections factuelles integrees.'
- 'Cross-references Mnemolite integrees : 2 memoires directes ou d''enrichissement'
