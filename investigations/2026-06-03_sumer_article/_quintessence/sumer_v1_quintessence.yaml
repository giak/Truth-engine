enquete_source: investigations/2026-06-03_sumer_article/2026-06-03_12-30_sumer_vs_france_INVESTIGATION.md
these_centrale: Sumer a développé entre 3400 et 2000 av. des mécanismes institutionnels (andurarum, edubba, redistribution
  templière) dont la CLARTÉ et l'INTÉGRATION égalent ou surpassent ce que la France contemporaine a préservé, mais la comparaison
  souffre d'une asymétrie temporelle (1500 ans de Sumer traités en bloc vs France 2025) qui fausse la commensurabilité.
theses_implicites:
- L'andurarum n'est pas un 'jubilé' moderne mais un outil politique de restauration (Charpin), pas un mécanisme systémique
  de justice sociale.
- Le parallèle scribes/énarques est structurellement valide mais incommensurable en échelle (~1% scribes vs 22% fonctionnaires).
- 'La dette française (115,6% PIB) n''est PAS l''équivalent des dettes privées sumériennes : c''est de la dette publique sur
  les marchés financiers mondiaux.'
- Sumer est largement une 'construction occidentale du XXe siècle' (Kramer, Jacobsen) qui sert à légitimer des récits contemporains.
- La complexité juridique française protège les droits (France 95/100 WJP vs Irak 27/100), elle n'est pas une pathologie.
