perspectives_dialectiques:
- position: Thèse continuiste
  argument: Sumer avait des mécanismes (andurarum, edubba, temple redistributeur) dont la clarté d'intégration dépasse le
    morcellement français
- position: Antithèse incommensurabiliste
  argument: Sumer = reconstruction savante occidentale (Kramer 1952) ; 1500 ans traités en bloc ; 30 000-80 000 hab. vs 68M
    ; sans démocratie ni droits humains
- position: Synthèse critique
  argument: Les parallèles fonctionnels sont réels mais limités par l'échelle, la légitimité, et la disponibilité documentaire.
    La complexité française protège les droits (WJP 95/100 vs 27/100 Irak)
limites:
- 'Asymétrie temporelle : Sumer 1500 ans en bloc vs France point 2025'
- Filiation Sumer→Rome→France non documentée (1500 ans de trou)
- <10% des tablettes sumériennes publiées — image biaisée par ce qui a survécu
- 'Biais occidental : 0 source en arabe, 0 consultation journal Sumer (Bagdad)'
- 'Population sumérienne corrigée : 30 000-80 000 (et non 300 000)'
- Comparaison 57 articles vs 15 000 lois = asymétrie catégorielle
wolves:
- nom: Samuel N. Kramer
  argument: Sumer comme 'berceau de la démocratie' — agenda téléologique occidental
  reponse: Schrakamp 2025 confirme restauration conservatrice, pas innovation
- nom: Michael Hudson
  argument: 30 annulations = stabilisateur macroéconomique
  reponse: 'Charpin 1987 : rituel de légitimation, pas politique économique. Fréquence = 1/33 ans, pas mécanisme quotidien'
- nom: Karl Polanyi
  argument: Temple redistributeur = sécurité sociale antique
  reponse: 'Silver 2007 : marchés privés existaient ; le temple redistribuait à SON personnel, pas à la population générale'
- nom: IFrap / think-tanks libéraux
  argument: Bureaucratie française = pathologie (76/1000 vs ~11% Allemagne)
  reponse: Ratio pondéré par la qualité de service public (santé, éducation, justice) ; comparaison brute ignore les outputs
iceberg:
- 'Sujet immergé : 0 source irakienne (le journal Sumer, Bagdad, n''est pas consulté) — biais post-colonial'
- 'Sujet immergé : la dette sumérienne était AGRICOLE (subsistance), la dette française est PUBLIQUE sur marchés financiers
  — catégories incommensurables'
- 'Conclusion : Mnemolite opérationnelle mais vide sur l''axe civilisations antiques — pas un blocage, une information à documenter'
