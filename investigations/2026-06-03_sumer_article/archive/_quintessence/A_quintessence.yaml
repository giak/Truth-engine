perspectives_dialectiques:
  - position: "Thèse (Hudson/Graeber)"
    argument: "L'andurarum constitue un mécanisme structurel d'intégration par la dette, un stabilisateur macroéconomique récurrent qui préfigure le Jubilé biblique et témoigne d'une conscience politique précoce des dégâts de l'endettement chronique."
  - position: "Antithèse (Charpin/Kraus)"
    argument: "L'andurarum est un acte royal restaurateur, idéologique avant d'être économique, conjoncturel et lié à des dynasties spécifiques ; son extinction après 1400 BCE prouve qu'il ne saurait être qualifié d'institution centrale de la civilisation mésopotamienne."
  - position: "Synthèse"
    argument: "L'andurarum est un dispositif politique double, à la fois rituel de légitimation royale et outil ponctuel de préservation de la base fiscale et militaire ; il ne neutralise pas la dette commerciale, ce qui en limite drastiquement la portée comme matrice théorique d'une économie sans dette."

limites:
  - "L'enquête repose sur des sources secondaires (Charpin, Hudson, Kraus, Westbrook) et non sur la lecture directe des tablettes cunéiformes."
  - "Le corpus des édits royaux préservés est lacunaire : trente édits attestés ne signifie pas trente édits émis ; le chiffre réel pourrait être supérieur."
  - "L'enquête ne traite pas du contexte économique précis de chaque édit (sécheresse, guerre, transition dynastique), ce qui interdit une analyse causale fine."
  - "La transmission supposée vers le Jubilé biblique (Lévitique 25) reste affirmée mais non démontrée linguistiquement de manière irréfutable."
  - "Mnemolite ne contenait aucun mémo préalable sur le sujet : zéro résultat sur les trois requêtes lancées, ce qui prive l'analyse d'un contexte cross-séries."
  - "La distinction tamkārum/débiteur ordinaire mériterait une cartographie sociologique plus fine que celle proposée par l'investigation."

wolves:
  - nom: "Hudsonien orthodoxe"
    argument: "Vous instrumentalisez Charpin pour réintroduire un narratif libéral qui nie l'existence de toute justice sociale antique ; la fréquence de trente édits sur mille ans suffit à établir le caractère institutionnel."
    reponse: "Trente édits sur mille ans donnent une moyenne d'un par génération, mais leur concentration sous Hammurabi et leur extinction post-1400 BCE contredisent toute lecture structurelle ; Charpin n'est pas un libéral, il est philologue et lit les tablettes."
  - nom: "Libertarien revendiquant amargi"
    argument: "L'amargi prouve la priorité historique de la liberté individuelle face à la dette d'État ; la Hayek Society est dans son droit en l'arborant."
    reponse: "Hudson lui-même qualifie cette polysémie de test de Rorschach idéologique ; la réduction d'amargi à la liberté individuelle ignore que les édits étaient une émanation du pouvoir royal absolu, non une garantie de droit naturel."
  - nom: "Graeberien orthodoxe"
    argument: "Vous attaquez Graeber pour défendre une orthodoxie économique néoclassique ; les sources primaires confirment l'annulation des dettes."
    reponse: "Les sources primaires confirment l'annulation des dettes agricoles et l'exclusion explicite des dettes commerciales, ce qui ruine l'idée d'une neutralisation générale de la dette ; cette critique n'a rien de néoclassique, elle est philologique."
  - nom: "Universitaire prudent"
    argument: "Conclure à un shadow de 5,8× est excessif : les sources se complètent plus qu'elles ne s'opposent."
    reponse: "Le shadow de 5,8× est décomposé fait par fait dans F-A022 ; il agrège cinq divergences documentées, dont la disparition post-1400 BCE qu'aucune lecture rationaliste n'explique convenablement."

iceberg:
  - "La distinction entre dette de subsistance (annulable) et dette commerciale (préservée) constitue une matrice analytique transposable aux dettes contemporaines (ménages vs. interbancaire) que l'investigation n'explore pas."
  - "Le statut juridique du tamkārum comme agent du palais ou du temple suggère une dualité État/marché déjà institutionnalisée trois millénaires avant Polanyi."
  - "L'effacement du Lévitique 25 et de la généalogie hébraïque de la racine dror n'est qu'effleuré : la transmission philologique mériterait une enquête à part entière."
  - "Le rôle des tablettes administratives palatiales et des archives privées (Mari, Larsa) dans la fabrication du chiffre de trente édits n'est pas problématisé : combien de tablettes perdues, combien d'édits non documentés ?"
  - "Résultat Mnemolite : aucun mémo préexistant sur andurarum, Charpin, Hudson ou amargi dans la base, ce qui révèle un angle mort de la mémoire vectorielle du projet sur l'historiographie économique antique."
  - "La récupération libertarienne d'amargi (Hayek Society, Liberty Fund, Kramer 1981) ouvre un dossier d'archéologie idéologique sur les usages politiques contemporains de l'antiquité que l'investigation n'instruit pas."

