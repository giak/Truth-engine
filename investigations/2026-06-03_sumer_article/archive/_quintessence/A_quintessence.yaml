these_centrale: "L'andurarum mésopotamien n'était pas une annulation générale et structurelle des dettes mais une mesure royale, irrégulière, restreinte aux dettes agricoles de subsistance et instrumentalisée à des fins de légitimation politique, ce qui ruine l'extrapolation graeberienne d'un mécanisme universel de neutralisation de la dette."

theses_implicites:
  - "L'École Graeber/Hudson surinterprète des sources philologiques en projetant une économie politique contemporaine sur l'âge du bronze."
  - "Le consensus assyriologique francophone, dominé par Charpin, est systématiquement passé sous silence dans la littérature économique hétérodoxe anglophone."
  - "La portée d'une institution antique se mesure moins à sa fréquence qu'à sa survie : la disparition de l'andurarum après 1400 BCE signe sa nature conjoncturelle."
  - "Une terminologie polysémique (amargi, andurarum) devient un test de Rorschach idéologique récupéré aussi bien par les libertariens que par les économistes de gauche."
  - "La distinction entre dette agricole de subsistance et dette commerciale, déjà opérante au IIe millénaire, préfigure la dualité moderne entre dette des ménages et dette financière."

domaines:
