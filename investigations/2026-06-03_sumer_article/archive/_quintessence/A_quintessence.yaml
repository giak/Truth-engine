  - "Philologie sémitique"

faits_atomiques:
  - id: "F-A001"
    enonce: "Le terme sumérien ama.ar.gi se décompose en ama (mère), ar (retour) et gi (réclamer ou rendre), traduit littéralement par « retour à la mère », c'est-à-dire retour à l'état originel."
    source_url: ""
    source_section: "§1.1"
    head_status: null
    tier: 2
    glyphe: "❧"
  - id: "F-A002"
    enonce: "Dominique Charpin, dans son cours du Collège de France du 21 février 2022, traduit l'andurarum par « retour au statut d'origine » et récuse explicitement la lecture moderne du « progrès social »."
    source_url: "https://www.college-de-france.fr/fr/agenda/cours/justice-en-mesopotamie-au-iie-millenaire-av-j-c"
    source_section: "§1.1"
    head_status: null
    tier: 1
    glyphe: "⁅"
  - id: "F-A003"
    enonce: "En akkadien, andurarum signifie « liberté » ou « libération » et constitue le cognat de l'hébreu dror employé en Lévitique 25 ; la racine évoque l'eau qui s'écoule librement."
    source_url: ""
    source_section: "§1.2"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A004"
    enonce: "Le terme akkadien misharum (« justice », « équité », racine YSR/ISHAR) désigne l'édit royal de justice, dont l'annulation des dettes n'est qu'une composante parmi d'autres."
    source_url: ""
    source_section: "§1.2"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A005"
    enonce: "Michael Hudson, dans Modern (Mis)interpretations of Ancient Debt Cancellation (2024), concède que ces termes servent de « test de Rorschach idéologique reflétant les croyances du traducteur »."
    source_url: ""
    source_section: "§1.2"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A006"
    enonce: "Le consensus assyriologique établit que les dettes commerciales étaient systématiquement exclues des annulations royales : seules les dettes personnelles agricoles étaient remises."
    source_url: "https://en.wikipedia.org/wiki/History_of_debt_relief"
    source_section: "§2.1"
    head_status: null
    tier: 3
    glyphe: "⁅"
  - id: "F-A007"
    enonce: "L'édit d'Ammisaduqa (1646 BCE) stipule explicitement que les tablettes concernant les dettes des commerçants (tamkārum) doivent être préservées, excluant ces créances de l'annulation."
    source_url: ""
    source_section: "§2.2"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A008"
    enonce: "Britannica précise qu'Ammisaduqa annulait les dettes privées en argent et en grain issues de prêts, ainsi que les arriérés d'impôts, à l'exclusion des créances marchandes."
    source_url: "https://www.britannica.com/biography/Ammisaduqa"
    source_section: "§2.1"
    head_status: null
    tier: 2
    glyphe: "⁅"
  - id: "F-A009"
    enonce: "Michael Hudson reconnaît dans The Lost Tradition of Biblical Debt Cancellations (1993, p. 29-30) qu'Ammisaduqa exemptait explicitement les dettes des marchands."
    source_url: ""
    source_section: "§2.1"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A010"
    enonce: "Environ trente édits d'annulation générale ont été identifiés avec certitude entre 2400 et 1400 avant notre ère, soit en moyenne un édit tous les trente-trois ans, avec une distribution très inégale."
    source_url: "https://www.cadtm.org/The-Long-Tradition-of-Debt-Cancellation-from-3000-BCE-to-1000-AD"
    source_section: "§3.1"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-A011"
    enonce: "La dynastie d'Hammurabi concentre six édits sur cent soixante-six ans, soit un édit tous les vingt-huit ans, contre des intervalles plus longs sous les autres dynasties."
    source_url: ""
    source_section: "§3.1"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A012"
    enonce: "Aucun édit d'andurarum n'est attesté après 1400 BCE, ce qui ruine l'hypothèse d'une institution structurelle continue de la civilisation mésopotamienne."
    source_url: ""
    source_section: "§3.1"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A013"
    enonce: "La disparition de l'andurarum après 1400 BCE coïncide avec l'effondrement de l'âge du bronze, ce qui plaide pour une pratique conjoncturelle liée à une configuration politique précise selon Charpin."
    source_url: ""
    source_section: "§3.2"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A014"
    enonce: "Charpin qualifie l'andurarum d'acte conservateur : « l'andurârum témoigne de la volonté de revenir à ce qu'on croyait être la perfection des origines » (Collège de France, 21 février 2022)."
    source_url: "https://www.college-de-france.fr/fr/agenda/cours/justice-en-mesopotamie-au-iie-millenaire-av-j-c"
    source_section: "§4.2"
    head_status: null
    tier: 1
    glyphe: "⁅"
  - id: "F-A015"
    enonce: "Hudson interprète l'andurarum comme un stabilisateur macroéconomique destiné à préserver la base fiscale et militaire du roi en empêchant la concentration des terres."
    source_url: ""
    source_section: "§4.3"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A016"
    enonce: "Le calendrier des édits suit le rythme des accessions au trône, calendrier politique, et non les cycles agricoles de quarante-neuf ou cinquante ans qui caractérisent le Jubilé biblique."
    source_url: ""
    source_section: "§4.5"
    head_status: null
    tier: 2
    glyphe: "❧"
  - id: "F-A017"
    enonce: "Michael Hudson n'est pas assyriologue de formation et fonde son interprétation sur les traductions de F.R. Kraus (1984) et Raymond Westbrook plutôt que sur la lecture directe des tablettes cunéiformes."
    source_url: ""
    source_section: "§5.1"
    head_status: null
    tier: 2
    glyphe: "❧"
  - id: "F-A018"
    enonce: "Le consensus assyriologique académique, représenté par Westbrook, Kraus, Villard et Charpin, penche vers une interprétation restauratrice et conjoncturelle, contre l'interprétation structurelle de Hudson."
    source_url: ""
    source_section: "§5.2"
    head_status: null
    tier: 1
    glyphe: "❧"
  - id: "F-A019"
    enonce: "Le terme amargi a été récupéré symboliquement par les libertariens américains, la Hayek Society de la LSE (logo officiel) et la maison d'édition Liberty Fund."
