  - cause: "F-A013"
    effet: "F-A012"
    mecanisme: "L'effondrement du système politique paléo-babylonien tarit la pratique des édits royaux, ce qui révèle leur dépendance à une configuration institutionnelle spécifique."
  - cause: "F-A016"
