    source_url: ""
    source_section: "§5.3"
    head_status: null
    tier: 2
    glyphe: "❧"
  - id: "F-A021"
    enonce: "L'andurarum est attesté de 2400 à 1400 BCE comme pratique royale ponctuelle, sur une fenêtre d'un millénaire."
    source_url: ""
    source_section: "§6.1"
    head_status: null
