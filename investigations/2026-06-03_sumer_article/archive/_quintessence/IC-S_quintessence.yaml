causalites:
- cause: F-IC-S007
  effet: F-IC-S001
  mecanisme: Le biais kramerien du berceau pousse à magnifier la taille et la sophistication de Sumer, ce qui produit des
    chiffres exagérés comme la population de trois cent mille habitants à Uruk, mécaniquement repris dans l'enquête mère sans
    vérification.
- cause: F-IC-S008
  effet: F-IC-S004
  mecanisme: L'agenda militant de Hudson au CADTM gonfle l'importance des annulations de dettes pour servir un plaidoyer contemporain
    en faveur du jubilé, ce qui conduit à agréger les édits paléo-babyloniens postérieurs à Sumer dans le compte des trente
    annulations.
- cause: F-IC-S010
  effet: F-IC-S017
  mecanisme: L'absence de requêtes en arabe ou en turc dans la méthodologie de recherche web exclut mécaniquement le journal
    Sumer et toute production scientifique irakienne contemporaine, reproduisant un angle aveugle post-colonial.
- cause: F-IC-S012
  effet: F-IC-S003
  mecanisme: La conservation de moins de dix pour cent des tablettes cunéiformes biaise structurellement notre Sumer vers
    les textes administratifs et palatiaux conservés, ce qui rend toute comparaison quantitative (cinquante-sept énoncés contre
    quinze mille lois) épistémiquement bancale.
- cause: F-IC-S013
  effet: F-IC-S007
  mecanisme: La réévaluation Schrakamp-Zólyomi de 2025 disqualifie la lecture progressiste kramerienne d'Urukagina et confirme
    rétroactivement que le biais du berceau a structuré toute la sumérologie occidentale du vingtième siècle.
perspectives_dialectiques:
- position: Thèse
  argument: L'enquête originale capture des parallèles fonctionnels réels entre Sumer et la France (dette, bureaucratie, redistribution,
    droit, dogme) et constitue un apport heuristique légitime à la critique de la modernité française.
- position: Antithèse
  argument: L'enquête originale projette anachroniquement sept parallèles nets sur une réalité historique infiniment plus
    fragmentée (mille cinq cents ans de Sumer traités comme un bloc, moins de dix pour cent des tablettes publiées, biais
    Kramer-Hudson-Polanyi non déclarés), ce qui invalide la prétention forensique du résultat.
- position: Synthèse
  argument: 'Les parallèles tiennent comme métaphores heuristiques mais s''effondrent comme preuves comparatives : toute investigation
    trans-temporelle doit publier son shadow factor (ici 3.1) et accompagner chaque parallèle d''un coefficient d''incertitude
    documenté, sous peine de reproduire mécaniquement les biais hérités de la sumérologie occidentale du vingtième siècle.'
limites:
- 'Le contre-rapport reste lui-même tributaire des sources occidentales accessibles : aucun article du journal Sumer (Bagdad)
  n''a été consulté dans le présent audit, ce qui reproduit le biais anglophone identifié.'
- Le shadow factor pondéré de 3.1 repose sur une grille d'évaluation interne (preuves directes à cent pour cent, preuves indirectes
  à cinquante pour cent) qui n'a pas été validée par une méta-analyse externe.
- 'Les sept corrections factuelles s''appuient majoritairement sur Wikipedia et CADTM : la profondeur académique reste limitée
  par rapport à un audit forensique mené par des assyriologues professionnels.'
- 'Le contre-rapport ne propose pas de méthode alternative quantifiable pour comparer cinquante-sept énoncés casuistiques
  sumériens à deux mille trois cents articles du Code civil : la critique est plus mature que la solution.'
- La perspective genrée sur le statut réel des femmes sumériennes (variable selon la classe et la période) reste ouverte et
  non résolue par le présent audit.
wolves:
- nom: Défenseur de la lecture hudsonienne
  argument: Hudson cite Charpin abondamment et la fréquence d'une annulation tous les trente-trois ans en moyenne reste un
    mécanisme institutionnel inédit dans les économies modernes, ce qui valide l'analogie macroéconomique.
  reponse: 'L''argument confond mécanisme institutionnel et outil politique ponctuel : la fréquence moyenne masque une distribution
    hétérogène (cinq à huit annulations purement sumériennes contre vingt à vingt-cinq paléo-babyloniennes), et les crises
    économiques françaises modernes présentent une fréquence comparable sans être qualifiées de mécanisme systémique.'
- nom: Défenseur du framing kramerien
  argument: Le code d'Ur-Nammu précède bel et bien le Code Hammourabi de trois siècles, et le parallèle scribes contre énarques
    (edubba contre INSP) capture une réalité sociologique des élites administratives transhistoriques.
  reponse: 'Précéder n''est pas fonder : aucune filiation directe Sumer-Rome-France n''est documentée, et le parallèle edubba-INSP
    s''effondre sur l''échelle (moins de un pour cent de scribes contre vingt-deux pour cent de fonctionnaires) et la légitimité
    politique (scribe au service du roi-dieu contre haut fonctionnaire au service de l''État démocratique).'
- nom: Défenseur de l'analogie temple-Sécurité sociale
  argument: Polanyi reste une référence canonique en anthropologie économique, et le temple sumérien remplissait une fonction
    de redistribution irréductible aux logiques de marché contemporaines.
  reponse: 'Silver (2007) démontre que les marchés privés coexistaient avec le temple, et l''enquête mère reconnaît la contestation
    sans en tirer les conséquences interprétatives : la redistribution temple-personnel n''est pas une couverture universelle
    comparable à la Sécurité sociale française.'
iceberg:
- 'L''agenda du Baas irakien (années 1970-2000) qui a instrumentalisé l''archéologie sumérienne comme outil de propagande
  nationaliste : dimension géopolitique absente de l''enquête mère.'
- 'Le pillage du musée de Bagdad post-2003 et la destruction de sources primaires : impact épistémique non chiffré dans l''enquête
  originale.'
- 'La perspective genrée systématique sur le statut des femmes sumériennes (propriété, commerce, justice variables) : effleurée
  mais non développée.'
- Le hors-bilan français (engagements futurs estimés cinq cents à huit cents milliards d'euros) absent de la comparaison dette
  publique contre dette paysanne sumérienne.
- 'Résultat Mnemolite : zéro mémoire indexée sur les requêtes Sumer biais Kramer Hudson contre-rapport, andurarum jubilé dette
  annulation, Polanyi temple redistribution Mésopotamie (mode tag_only, aucun chunk pertinent).'
