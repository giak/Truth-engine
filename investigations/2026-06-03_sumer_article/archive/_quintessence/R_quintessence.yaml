these_centrale: "Rome est l'ancêtre DIRECT et documenté de la France: le Corpus Juris Civilis (529-534) est intégré dans le Code civil de 1804, le cursus honorum inspire l'INSP, et la lex Poetelia Papiria (326 av.) abolit l'esclavage pour dette 2193 ans avant la France (1867). Cette filiation a été triée: la France a retenu le droit (qui légitime l'État) et occulté l'esclavage (qui dérange le récit républicain), reproduisant les cycles de dette, de réforme agraire avortée et de renflouement étatique sans résoudre structurellement la question de la reproduction des élites."

theses_implicites:
  - "Le Corpus Juris Civilis (529-534) n'est pas une influence distante sur le Code civil français de 1804: c'est une inclusion textuelle directe. Justinien a compilé 1000 ans de droit romain en quatre volumes (Codex, Digeste, Institutes, Novelles); le Code civil reprend ses catégories (personnes, biens, obligations) avec 2300 articles au lieu des ~3000 fragments du Digeste, multiplicateur ~1.3x."
  - "L'abolition du nexum par la lex Poetelia Papiria (326 av.) n'a PAS résolu la question de la dette à Rome: la cité oscille ensuite entre abolitions ponctuelles (Gracques 133-121, Catilina 63), crises de crédit massives (33 ap., renflouement Tibère 100M sesterces) et inflation par débasement (IIIe siècle, 1000%). Le parallèle avec la France est structurel: pas de solution pérenne, juste des cycles de renflouement public qui valident l'impuissance politique."
  - "La Rome dont la France se réclame est une construction historiographique. 90% de ce que nous savons de Rome vient de sénateurs (Cicéron, Tacite, Tite-Live). Les esclaves (30-40% de l'Italie), les femmes, les provinciaux et les plébéiens sont structurellement absents des sources. La filiation 'Rome à France' n'est pas falsifiée mais elle est sélective: elle projette une Rome qui sert le récit national français."
  - "L'argument de l'avertissement romain (Rome a chuté, donc nous chuterons) est un framing temporel puissant utilisé par tous les bords politiques. Chaque époque projette ses angoisses sur Rome: Gibbon y projette la décadence morale, Mussolini l'autoritarisme, les Lumières la République vertueuse, l'époque contemporaine la bureaucratie paralysante. Aucun accès neutre à Rome n'existe."
  - "Le ratio fonctionnaire/habitant est ~800 fois plus élevé en France (5,7M pour 68M, soit 1/12) qu'à Rome (~5000 pour 50-80M, soit 1/10000). Le parallèle cursus honorum/INSP tient sur la structure mais pas sur l'échelle: la France a une bureaucratie massive qui n'a aucun équivalent antique direct."

