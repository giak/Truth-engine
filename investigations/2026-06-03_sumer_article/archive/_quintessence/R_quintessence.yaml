causalites:
  - cause: "F-R001"
    effet: "F-R003"
    mecanisme: "L'abolition du nexum (326 av.) libère le débiteur de la contrainte corporelle, ce qui permet le développement du crédit privé sur garantie patrimoniale, lequel finit par produire une crise de crédit massive (33 ap.) absorbée par un renflouement impérial."
  - cause: "F-R002"
    effet: "F-R008"
    mecanisme: "L'échec de la réforme agraire des Gracques (assassinés 133 et 121 av.) verrouille la concentration des terres et la dépendance économique des plébéiens, alimentant un réservoir de candidats à l'esclavage pour dette puis à la révolte servile (Spartacus, 73-71 av.)."
  - cause: "F-R005"
    effet: "F-R006"
    mecanisme: "La compilation justinienne du droit romain (529-534) crée un corpus textuel unifié qui, redécouvert à Bologne au XIe siècle, devient la base directe du Code civil français de 1804: filiation documentaire, pas analogie."
  - cause: "F-R007"
    effet: "F-R011"
    mecanisme: "La séquence magistrale romaine (cursus honorum) inspire la formation séquentielle des élites administratives françaises (INSP), reproduisant la fonction de filtre social et de reproduction oligarchique, mais à une échelle 800 fois supérieure en nombre."
  - cause: "F-R017"
    effet: "F-R019"
    mecanisme: "La stratification censitaire (Servius Tullius) fige la structure verticale de la cité, ce qui produit une crise de légitimité que l'Empire (puis Gibbon au XVIIIe siècle) réinterprète en 'décadence' morale et politique."
  - cause: "F-R019"
    effet: "F-R020"
    mecanisme: "Le récit gibbonien de la chute morale de Rome ouvre un répertoire symbolique (fasces, aigles, SPQR) que les régimes autoritaires du XXe siècle (Mussolini, hyperprésidentialisme américain) s'approprient pour légitimer leur pouvoir par filiation impériale."

perspectives_dialectiques:
  - position: "Thèse officielle-académique"
    argument: "Le droit romain (Corpus Juris Civilis) est la base documentaire du Code civil français; Napoléon l'a explicitement utilisé; la France a amélioré ce qu'elle a hérité (esclavage aboli, État-providence universel). Rome est un héritage, pas un modèle."
  - position: "Antithèse critique-investigative"
    argument: "Rome avait des mécanismes que la France a perdus ou n'a jamais adoptés: abolition de l'esclavage pour dette 2193 ans plus tôt, réforme agraire proposée par les Gracques, renflouement d'État lors de la crise de 33 ap.; la durée de vie romaine (1000 ans) est un indicateur de résilience institutionnelle que la Ve République (67 ans) n'égale pas."
  - position: "Synthèse par les faits"
    argument: "Rome est un ancêtre direct, donc le parallèle est plus solide qu'avec Sumer. Mais la filiation ne garantit pas la leçon: Rome a duré 1000 ans avec l'esclavage, la France dure 200 ans sans. La différence de valeurs (liberté individuelle, droits humains) n'est pas mesurable dans les parallèles institutionnels. Le parallèle bureaucratique (cursus honorum/INSP) tient structurellement mais pas à l'échelle."

limites:
  - "Budget exact de l'Empire romain inconnu: les estimations varient et aucune comptabilité nationale n'a survécu; les chiffres (15% PIB pour l'annone, 1.5-2.5% PIB pour l'armée) sont des reconstructions."
  - "Biais élitaire des sources: 90% de ce que nous savons de Rome vient de sénateurs (Cicéron, Tacite, Tite-Live); les esclaves, les femmes, les provinciaux et les plébéiens sont structurellement absents des sources littéraires."
  - "Temporalité compressée: 1200 ans de Rome (Royauté, République, Principat, Dominat) traités comme 'la Rome antique', masquant des discontinuités institutionnelles majeures."
  - "Pas d'instrument de mesure commun Rome/France: PIB, dette publique, ratio fonctionnaire/habitant sont des catégories modernes projetées rétrospectivement sur une société antique qui ne les conceptualisait pas."
  - "Population impériale romaine incertaine: estimations entre 50M et 80M habitants, ce qui fausse tous les ratios proportionnels (notamment la comparaison administration/habitants)."

wolves:
  - nom: "Historiens romanistes académiques (Mommsen, Beard)"
    argument: "L'INSP n'a aucun rapport structurel avec le cursus honorum: le premier forme des généralistes administratifs, le second formait des magistrats judiciaires et militaires; la ressemblance est superficielle et anachronique."
    reponse: "La ressemblance porte sur la fonction (séquence de formation des élites, filtre social, accès aux postes clés), pas sur le contenu; la filiation documentaire (cursus → grandes écoles) est attestée par les manuels d'histoire des institutions."
  - nom: "Libéraux anti-fonction publique (IFrap, Institut Montaigne)"
    argument: "Comparer 5000 fonctionnaires romains à 5,7M fonctionnaires français n'a aucun sens: Rome n'était pas un État-providence, la France si; l'argument du 'parallèle bureaucratique' est un artifice rhétorique pour naturaliser la bureaucratie."
    reponse: "Le parallèle porte sur la STRUCTURE de sélection et de reproduction des élites, pas sur l'effectif; le ratio ×800 lui-même est le fait saillant, pas l'assimilation des deux systèmes."
  - nom: "Spécialistes de l'esclavage antique (Bradley, Harper)"
    argument: "Le chiffre 30-40% d'esclaves en Italie est une estimation maximaliste; les chiffres plus crédibles oscillent entre 20-30% et l'esclavage rural n'avait pas la même intensité qu'urbain."
    reponse: "L'enquête cite l'estimation 30-40% avec une source universitaire (Bates/Bradley) sans la figer; la fourchette est cohérente avec la littérature dominante et la fourchette importe moins que le fait que l'esclavage romain était massif et occulté du récit de la 'civilisation'."
  - nom: "Romanistes anti-révisionnistes (Heather, Ward-Perkins)"
    argument: "La chute de l'Empire romain d'Occident a des causes structurelles documentées (pressions barbares, rupture des réseaux fiscaux, dépopulation), pas seulement internes; minimiser les invasions est un biais historiographique."
    reponse: "L'enquête ne nie pas les invasions mais les resitue dans un faisceau de causes internes (inflation, bureaucratie, fiscalité, perte de légitimité); le débat Gibbon vs révisionnistes n'est pas tranché et l'enquête assume cette incertitude."

iceberg:
  - "Sujet immergé: la fiscalité romaine (tributum, portorium, vectigal) et ses transformations du Principat au Dominat, absente du récit officiel de 'Rome notre ancêtre' mais centrale pour comprendre la chute."
  - "Résultat Mnemolite: zéro mémoire indexée pour la requête 'Rome droit France corpus juris' (2026-06-07); cette enquête n'a donc pas de précédent dans la base vectorielle du projet."
  - "Sujet immergé: la question de la dette publique romaine (le concept n'existait pas sous cette forme, mais la crise de crédit de 33 ap. et l'inflation du IIIe siècle montrent une dynamique de soutenabilité budgétaire)."
  - "Sujet immergé: le rôle de l'armée romaine comme institution économique (1.5-2.5% PIB estimé) et sonnera institutionnalisation du clientélisme militaire, parallèle sous-exploité avec les grands corps français."

