civ: "S"
complexity: "COMPLEX"
date_extraction: "2026-06-07"
enquete_source: "investigations/2026-06-03_sumer_article/2026-06-03_12-30_sumer_vs_france_INVESTIGATION.md"
shadow_factor: 3.1

these_centrale: >
  Sumer et la France partagent des structures fonctionnelles communes (dette,
  bureaucratie, redistribution, droit, dogme) à des échelles incommensurables, mais
  chaque parallèle doit être accompagné de son Shadow Factor (3.1×) : la complexité
  réelle est environ trois fois supérieure à ce que la comparaison laisse voir, et
  la reconstruction savante de Sumer (occidentale, basée sur moins de 10% des
  tablettes) est asymétrique à la France vécue (données complètes, 2026).

theses_implicites:
  - >
    L'andurarum sumérien n'est pas un jubilé moderne mais un outil politique
    ponctuel (environ un tous les 33 ans en moyenne), et non un mécanisme
    systémique de redistribution comparable à la Sécurité sociale française.
  - >
    Le parallèle entre scribes sumériens et grands corps français (INSP, Conseil
    d'État, Inspection des Finances) est le plus solide de l'enquête, mais
    l'échelle (×1000) et le pouvoir décisionnel diffèrent radicalement : le
    scribe sert le temple et le roi, le technocrate sert l'État au nom du peuple.
  - >
    La dette française (3 416,3 milliards d'euros, 115,6% du PIB) est un problème
    réel, mais l'analogie avec l'andurarum est un faux-ami : taux bas, majorité
    détenue par des non-résidents (54,7%), hors-bilan de 500 à 800 milliards
    d'euros ; le profil est structurellement différent du surendettement paysan
    sumérien.
  - >
    La complexité juridique française n'est pas un symptôme pathologique d'inflation
    mais le résultat de 200 ans de sédimentation démocratique, et la comparaison
    directe avec un code unique d'Ur-Nammu gonfle artificiellement le contraste.
  - >
    L'assyriologie occidentale du XXe siècle a construit un Sumer utile à des
    récits contemporains (démocratie originelle, éden perdu), et l'enquête
    hérite de ce cadrage sans le critiquer suffisamment.

