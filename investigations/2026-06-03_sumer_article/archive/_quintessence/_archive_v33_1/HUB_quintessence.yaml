causalites:
- id: C-HUB001
  nom: CONCENTRATION INSEE ~30% = dependance a un seul producteur de statistiques
  description: 'INSEE est citee comme source unique pour environ 30% des faits economiques
    du corpus 04_FACTCHECK.md. L''INSEE produit des donnees agregees fiables, mais
    elle ne documente PAS les mecanismes de capture, pantouflage, evasion fiscale.
    L''impression de ''746 faits verifies'' masque que la majorite sont des indicateurs
    macroeconomiques standards, pas des revelations. L''enquete sur la capture de
    l''Etat repose lourdement sur les chiffres que l''Etat lui-meme produit. Risque
    : confirmation bias, dependance institutionnelle.'
  preuve_tranchante: HUB audit categorisation
  fiabilite: ✦
- id: C-HUB002
  nom: ABSENCE DE CONTRE-THESE = selection unidirectionnelle des sources
  description: 'ZERO source pro-reforme (Bercy, Elysee, Majorite presidentielle, rapports
    d''impact gouvernementaux). ZERO source emanant de Think tanks liberaux/centristes
    (Institut Montaigne cite UNE fois negativement, France Strategie, Terra Nova absents).
    La selection des sources est unidirectionnelle : tout ce qui CONFIRME la these
    des 5 tensions, rien qui la CONTREDIT. C''est un PLAIDOIRIE, pas une enquete equilibree.
    Le lievre #3 (independance) est confirme.'
  preuve_tranchante: HUB audit §2.3 / F-HUB013, F-HUB014
  fiabilite: ✦
- id: C-HUB003
  nom: CIRCULARITE ICEBERG MAX = auto-citation viole l'independance
  description: Les faits ZF1-ZF14 de la section 14.3 citent 'ICEBERG MAX' comme source.
    ICEBERG MAX est la MEME investigation KERNEL. C'est une AUTO-CITATION qui viole
    le principe de verification independante. La these des 5 tensions est citee comme
    PREUVE d'elle-meme, ce qui est methodologiquement invalide. 2% des faits sont
    dans ce cas, mais ce sont souvent les plus spectaculaires (ZF = Zero Factchecking,
    les angles morts extremes).
  preuve_tranchante: HUB audit §2.4 / F-HUB015
  fiabilite: ✦
- id: C-HUB004
  nom: 37 FAITS NON-RECOUPES = les affirmations les + fortes sont les + faibles
  description: 'Environ 37 faits (~5%) sont marques non-recoupes (⚠). Ils incluent
    les affirmations les plus fortes de la these : FT12 ''Trajectoire dette non soutenable
    avant 2028'' (source unique Touati), FR7 ''Transfert ascendant ~1000 Md€'' (estimation
    non recoupée), EF4 ''Actifs suisses 150-200 Md€'' (estimation FMI/UBS). Les ~5%
    de faits les plus FAIBLES sont ceux qui soutiennent les affirmations les plus
    FORTES. Biais d''attention : la these repose partiellement sur ses points les
    + vulnerables.'
  preuve_tranchante: HUB audit §2.2 / F-HUB009
  fiabilite: ✦
- id: C-HUB005
  nom: MEDIAS D'INVESTIGATION = biais politique de gauche dans la selection
  description: Mediapart, Le Monde, Le Canard Enchaine representent ~10% des faits,
    cients pour les allegations les plus contestables (affaires, scandales, pantouflage).
    Leur fiabilite est bonne mais leur orientation politique est marquee a gauche,
    ce qui cree un BIAIS DE CONFIRMATION POLITIQUE. Les allegations contre les hautes
    esferas (pantouflage, conflits d'interets) sont documentees par des medias d'opinion,
    pas par des contre-pouvoirs institutionnels ou de droite. La these est ideologiquement
    asymetrique.
  preuve_tranchante: HUB audit §1.3 / F-HUB005
  fiabilite: ✧
