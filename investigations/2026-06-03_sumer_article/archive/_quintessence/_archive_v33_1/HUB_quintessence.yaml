these_centrale: 'L''audit du HUB Changement de Regime identifie un BIAIS DE SELECTION
  UNIDIRECTIONNEL dans 04_FACTCHECK.md (746 faits) : 55% des sources sont gouvernementales
  francaises, ZERO source pro-reforme, ZERO contre-argument, AUTO-CITATION ICEBERG
  MAX. Le shadow d''independance est de 2,8x. Le corpus est un PLAIDOIRIE, pas une
  enquete equilibree. Recommandations : integrer sources Bercy/Elysee/Think tanks
  liberaux, contredire explicitement les contre-arguments, remplacer les auto-citations,
  recouper les ~37 faits non-recoupes.'
theses_implicites:
- Un audit sur la capture de l'Etat qui s'appuie a 55% sur des sources de l'Etat est
  logiquement contradictoire
- Les medias d'investigation (Mediapart, Le Monde) sont cients pour les faits les
  plus contestables, ce qui introduit un biais de confirmation politique
- Les faits les plus forts de la these (FT12 trajectoire dette, FR7 transfert 1000
  Md, ES6, EF4 actifs suisses) sont marques non-recoupes
- L'auto-citation ICEBERG MAX viole le principe de verification independante
- La these des 5 tensions du Changement de Regime est un PLAIDOIRIE selectionnee,
  pas une enquete equilibree
