causalites:
- id: C-MA001
  nom: Redecouverte CJC (Bologne 1070) vers Code civil 1804
  description: Chute de Rome (476) -> perte de l'integralite du CJC -> survivance
    fragmentaire chez les legistes carolingiens et a Pavie -> Irnerius (1070) retrouve
    un manuscrit complet a Bologne -> fonde l'Ecole de Bologne et la tradition des
    glossateurs (Summa Codicis) -> diffusion europeenne via les universites (XIIe-XIIIe)
    -> reception en France par les legistes royaux (Pierre Flotte, Nogaret) -> Code
    civil francais 1804 (Napoléon, Portalis) qui compile 2300 articles inspires du
    CJC. Le MA comble un TROU DE 594 ANS par reconstruction active.
  preuve_tranchante: Wikipedia Irnerius + Corpus Juris Civilis (chainage documente)
  fiabilite: ✦
- id: C-MA002
  nom: Spoliation Templiers (1307) vers dette publique institutionnalisee (rente HDV
    1522)
  description: 'Phase 1 : Philippe le Bel endette par les guerres flamandes et le
    conflit Boniface VIII -> arret des Templiers (13 oct. 1307), motif financier (saisie
    tresor du Temple = effacement dette). Phase 2 : XIVe-XVe, emprunt force aux banquiers
    lombards et grandes villes, taux eleves, defaut frequent. Phase 3 : Francois Ier
    (1522) cree la rente sur l''Hotel de Ville de Paris -> premier instrument de dette
    publique NEGOCIABLE. Le marche des rentes finance l''Etat jusqu''a la Revolution.
    MECANISME TOUJOURS EN VIGUEUR : 54 Mds€ d''interets annuels en France 2024.'
  preuve_tranchante: Wikipedia Philippe le Bel + Persee rentes HDV
  fiabilite: ✦
- id: C-MA003
  nom: Domaine royal vers impot national (taille permanente 1439)
  description: 'Avant XIIIe : roi vit de son domaine (150 000 livres/an sous Philippe
    Auguste) -> impots exceptionnels seulement. Philippe le Bel (1285-1314) : taxation
    clerge, saisie Juifs/Lombards, devaluation, convocation Etats generaux 1302 ->
    Charles VII (1439) : Guerre de Cent Ans impose effort permanent -> Etats generaux
    autorisent la taille royale PERPETUELLE -> premier impot direct permanent. Naissance
    de la bureaucratie fiscale (officiers, tresoriers, elus) -> ancetres des grands
    corps INSP.'
  preuve_tranchante: EHNE Philippe Auguste + cours-de-droit legislation royale
  fiabilite: ✦
- id: C-MA004
  nom: Curia Regis vers Parlement de Paris (professionnalisation justice)
  description: 'Justice royale personnelle (Louis IX rend la justice sous le chene
    de Vincennes) -> delegation a des juges professionnels (XIIIe) -> Parlement de
    Paris (~1250) devient cour souveraine -> magistrats professionnels (premiers ''gens
    de robe'') -> attribution : jugement en dernier ressort, enregistrement ordonnances,
    droit de remontrance. PARALLELE avec Code Ur-Nammu sum (justice ecrite), Douze
    Tables rom (loi affichee forum). La specialisation du droit cree la distance entre
    le droit et le citoyen, premiere etape de la CAPTURE institutionnelle.'
  preuve_tranchante: Wikipedia Parlement + cours-de-droit histoire Parlement
  fiabilite: ✧
- id: C-MA005
  nom: Feodalite (asymetrie verticale) vers caste contemporaine des 20 familles
  description: 'Feodalite (Xe-XVe) : systeme de dependances personnelles, vassalite/fief/hommage/seigneurie,
    trois ordres juridiques (clerge, noblesse, tiers), servage attache paysan a la
    terre (aboli 1315 par Louis X). ASYMETRIE VERTICALE (symbole ↕) : regles differentes
    selon ordre. La caste des 20 familles modernes (HUB Changement de Regime) en est
    une VERSION DEGUISEE : noblesse d''Etat au lieu de noblesse de sang, mais meme
    endogamie, meme capture des institutions, meme extraction (par l''impot plutot
    que par la corvee).'
  preuve_tranchante: Cours-de-droit feodalite + HUB Changement de Regime
  fiabilite: ✦
