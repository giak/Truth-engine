iceberg:
- angle: Le MA delegitime par la Renaissance et la Revolution
  convergence: 0.85
  description: Le terme "Moyen Age" est une INVENTION des humanistes de la Renaissance
    pour delegitimer la periode au profit de l'Antiquite retrouvee. La Revolution
    francaise a RENFORCE ce rejet en construisant son recit sur la destruction de
    "l'Ancien Regime". Double biais narratif qui cache que le MA est un AGE FONDATEUR,
    pas une transition obscure. Les 3 inventions mediecales (Bologne, rente HDV, taille
    permanente) sont les CHAINONS MANQUANTS de l'histoire francaise.
  source_section: §18 ICEBERG / Fact Registry SHADOW FACTOR
- angle: Filiation Rome->France reconstruite, pas continue (trou 594 ans)
  convergence: 0.9
  description: 'Le chainage Rome -> France n''est PAS continu : il est RECONSTRUIT
    par les glossateurs de Bologne (1070) qui comblent un trou documentaire de 594
    ans (476-1070). Cette reconstruction est le premier exemple de "rattrapage" de
    l''heritage antique par une civilisation qui se pense comme son heritier. Le Code
    civil 1804 est une TROISIEME vague de transmission (apres Justinien 529-534 et
    Irnerius 1070). La transmission est plus complexe qu''un simple heritier qui recoit
    un testament.'
  source_section: §2 / §9
- angle: 5 tensions du Changement de Regime reproduites au XIVe
  convergence: 0.8
  description: 'Les 5 tensions du Changement de Regime (extraction, capture, demantelement,
    abdication, dette) trouvent toutes leur PRECEDENT medieval : Guerre de Cent Ans
    + Peste noire + taille permanente reproduisent les memes structures. La DIFFERENCE
    cle : au XIVe s., la crise produit PLUS D''ETAT (le roi sort renforce avec la
    taille permanente) ; au XXIe s., elle produit PLUS DE CAPTURE (la caste extrait
    sans reformer). Meme mecanisme, trajectoire divergente.'
  source_section: §7 / §10 IMPACT
- angle: Legistes comme chainon entre droit romain et Etat moderne
  convergence: 0.75
  description: 'Les legistes de Philippe le Bel (Pierre Flotte, Nogaret, Marigny)
    ne sont pas des nobles : ce sont des TECHNICIENS du droit formes a Bologne. Ils
    theorisent la souverainete royale en s''appuyant sur le droit romain ("le roi
    est empereur en son royaume" - formule des glossateurs). La phrase "quod principi
    placuit legis habet vigorem" (Digeste de Justinien) devient le fondement de la
    monarchie absolue. SANS BOLOGNE (1070), pas de legistes. SANS legistes, pas d''absolutisme.
    SANS absolutisme, pas de Revolution francaise.'
  source_section: §8
- angle: Templiers 1307 = premiere annulation de dette par la violence
  convergence: 0.7
  description: L'arret des Templiers (13 oct. 1307) est une ANNULATION DE DETTE par
    la violence d'Etat. Philippe le Bel, endette par les guerres flamandes et le conflit
    avec Boniface VIII, saisit le tresor du Temple (principal creancier du roi) ->
    efface sa dette. 15 000 hommes arretes en une nuit, l'ordre dissous en 1312. C'est
    l'equivalent feodal d'une banqueroute souveraine. MECANISME REPETE en France 1789-1796
    (assignats) et 2024 (taxe sur les super-benefices des multinationales = menace
    d'annulation par la violence fiscale democratique).
  source_section: §3 / §10
shadow_factor: 1.5
ce_qui_tient:
- Bologne 1070 comble le trou 476-1070 par reconstruction documentee
- Rente HDV 1522 = premier instrument de dette publique negociable
- Taille permanente 1439 = premier impot direct permanent
- Parlement 1250 = cour souveraine, ancetre Conseil d'Etat
- Legistes = techniciens du droit formes a Bologne, fondement absolutisme
- Peste noire 1347-51 = crise systemique, accelere formation Etat
ce_qui_tombe:
- MA n'est pas une simple transmission -> c'est une RECONSTRUCTION critique
- Templiers 1307 pas une simple 'repression religieuse' -> motif financier dominant
- Feodalite pas un systeme homogene -> 3 ordres avec droits inegaux
- Philippe le Bel sur-represente dans les sources -> biais documentaire
limites:
- 'Biais Renaissance : terme ''Moyen Age'' delegitime la periode au profit de l''Antiquite'
- 'Biais Revolutionnaire : rejet en bloc de l''Ancien Regime'
- 'Pas de sources primaires : archives medievales (Chambre des Comptes, Parlement)
  non consultees'
- Periode 751-987 (Carolingiens) traitee trop rapidement -> renaissance juridique
  prepare Bologne
- Ancien Regime strict (1515-1789) sous-represente -> offices, Paulette 1604, systeme
  fiscal
- Sur-representation de Philippe le Bel (regne bien documente) -> biais documentaire
- '5 faits marques ✧ sur 22 (F008, F009, F011, F015-F017, F020) : sources secondaires'
perspectives_dialectiques:
- scenario: A - MA comme ceinture de transmission (these continuiste medievale)
  these: 'Le MA n''est pas une parenthese : il est la CEINTURE DE TRANSMISSION qui
    fait passer l''heritage antique vers la France moderne. Sans Bologne (1070), pas
    de CJC transmis. Sans CJC, pas de Code civil. Sans Parlement, pas de Conseil d''Etat.
    Sans legistes, pas d''absolutisme. Les 3 inventions mediecales (redécouverte droit,
    dette publique, Etat fiscal) sont les chainons manquants de la filiation Rome
    -> France.'
  cui_bono: Medievistes, historiens du droit, europeanistes
  score: 0.75
- scenario: B - MA comme age delegitime (these critique post-moderne)
  these: 'Le MA est un age obscur delegitime par DEUX biais narratifs ulterieurs (Renaissance
    et Revolution). La realite est plus complexe : le MA invente l''universite, la
    banque, l''Etat fiscal, le marche des titres. Mais c''est aussi l''age de la peste,
    de la guerre de Cent Ans, du servage, des trois ordres inegaux. C''est un age
    de contradictions, pas un age d''or.'
  cui_bono: Critiques post-coloniaux, historiens des subalternes
  score: 0.6
- scenario: C - MA comme repetition des 5 tensions du Changement de Regime
  these: 'Les 5 tensions du Changement de Regime contemporain (extraction, capture,
    demantelement, abdication, dette) trouvent leur PRECEDENT medieval. La Guerre
    de Cent Ans + Peste noire + taille permanente reproduisent les memes structures
    que la mondialisation + dette 115% PIB + defiance institutionnelle. Meme mecanisme,
    trajectoire divergente : au XIVe, la crise produit plus d''Etat ; au XXIe, plus
    de capture.'
  cui_bono: Reformateurs, observateurs du Changement de Regime
  score: 0.7
tensions_non_resolues:
- 'Bologne 1070 : reconstruction critique ou trahison du CJC ?'
- 'Templiers 1307 : repression religieuse motivee par finance, ou l''inverse ?'
- 'Taille 1439 : progres fiscal ou alourdissement de l''oppression ?'
- 'Cinq tensions du Changement de Regime : invariance structurelle ou parallelisme
  de surface ?'
- 'Caste contemporaine : continuation de la feodalite, ou phenomene neuf ?'
