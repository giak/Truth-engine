these_centrale: 'Le Moyen Age (987-1515) n''est pas une parenthese entre l''Antiquite
  et la modernite — il est la CEINTURE DE TRANSMISSION qui fait passer l''heritage
  antique vers la France moderne. Trois inventions medievales comblent le trou de
  594 ans entre la chute de Rome (476) et la France : (1) la REDECOUVERTE du Corpus
  Juris Civilis a Bologne (~1070, Irnerius) sans laquelle le Code civil de 1804 n''existerait
  pas ; (2) l''INVENTION de la dette publique par la rente sur l''Hotel de Ville (1522,
  Francois Ier) — passage de la spoliation (Templiers 1307) au marche des titres negociables,
  fondation du systeme que la caste contemporaine utilise encore ; (3) l''INVENTION
  de l''Etat fiscal par la taille permanente (1439, Charles VII) — transition du domaine
  royal patrimonial a l''impot national, qui cree la bureaucratie ancetre des grands
  corps INSP. Sans cette traduction medievale, la filiation Rome -> France serait
  restee lettre morte.'
theses_implicites:
- 'Le Moyen Age est meconnu parce qu''il a ete delegitime par DEUX recits ulterieurs
  : (1) le BIAIS RENAISSANCE des humanistes qui inventent le terme "Moyen Age" pour
  delegitimer la periode au profit de l''Antiquite retrouvee, (2) le BIAIS REVOLUTIONNAIRE
  qui rejette l''Ancien Regime comme un bloc. Le MA est un AGE FONDATEUR, pas une
  transition obscure.'
- 'La filiation Rome -> France n''est PAS continue : elle est RECONSTRUITE par les
  glossateurs de Bologne (1070) qui comblent un trou documentaire de 594 ans (476-1070).
  Cette reconstruction est le premier exemple de "rattrapage" de l''heritage antique
  par une civilisation qui se pense comme son heritier. Le Code civil 1804 est une
  TROISIEME vague de transmission (apres Justinien 529-534 et Irnerius 1070).'
- 'Les 5 tensions du Changement de Regime (extraction, capture, demantelement, abdication,
  dette) trouvent toutes leur PRECEDENT medieval : la Guerre de Cent Ans + Peste noire
  + taille permanente reproduisent les memes structures. La difference : au XIVe,
  la crise produit PLUS D''ETAT ; au XXIe, elle produit PLUS DE CAPTURE. Le mecanisme
  est identique, la trajectoire diverge.'
