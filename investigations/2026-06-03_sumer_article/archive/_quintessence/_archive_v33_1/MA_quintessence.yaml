domaines:
- nom: DETTE
  description: Spoliation Templiers 1307 (annulation par violence) -> rente HDV 1522
    (marche titres negociables)
  parallele_fr: Defaut 1790-1796 (assignats) -> dette 3416 Mds€ 2025 (115,6% PIB)
- nom: BUREAUCRATIE
  description: Baillis/senechaux de Philippe Auguste -> Parlement de Paris 1250 ->
    officiers/tresoriers/legistes
  parallele_fr: INSP/ENA 1945-2022, 5,7M fonctionnaires, grands corps
- nom: DROIT
  description: Reception CJC par glossateurs de Bologne (1070) -> legistes royaux
    -> Code civil 1804
  parallele_fr: Code civil 1804 (Portalis) compile 2300 articles inspires du CJC
- nom: FISCALITE
  description: Domaine royal (150K livres) -> impots exceptionnels Philippe le Bel
    -> taille permanente 1439
  parallele_fr: TVA, IR, IS, CSG, 15 codes, 400 000 pages, dette 115,6% PIB
- nom: JUSTICE
  description: Justice personnelle Louis IX (chene de Vincennes) -> Parlement de Paris
    (gens de robe) -> enregistrement des lois
  parallele_fr: Conseil d'Etat 1799, Cour de cassation, Conseil constitutionnel
- nom: DOGME
  description: Catholicisme d'Etat (bapteme Clovis 496) -> legistes invoquent 'quod
    principi placuit'
  parallele_fr: Laicite 1905, Etat de droit, Declaration droits de l'homme 1789
- nom: CAPTURE
  description: Feodalite (asymetrie verticale, 3 ordres, servage 1315) -> noblesse
    d'Etat -> caste 20 familles
  parallele_fr: Caste contemporaine (HUB Changement de Regime), reproduction des elites,
    endogamie grands corps
