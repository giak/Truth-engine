    complete: true
    complete_détail: 8 sections couvrant 22 F### (tous), 5 articles corpus référencés,
      13 investigations mappées.
    intro_methodo: 'Cet article naît d''un constat matériel. Le 30 juin 2025, la dette
      publique française atteint 3 416,3 milliards d''euros, soit 115,6% du produit
      intérieur brut. Au premier trimestre 2025, 54,7% de cette dette est détenue
      par des créanciers non-résidents, institutions financières et fonds souverains
      étrangers. À Sumer, quatre millénaires plus tôt, le taux d''intérêt de l''orge
      avoisinait 33,3% et celui de l''argent 20%. Entre ces deux chiffrages, une structure
      commune se devine, qui n''a rien d''évident ni de littéraire.


      La méthode employée est celle de l''enquête forensique, non de l''essai comparatiste.
      Vingt-deux faits atomiques, extraits de la main investigation (F001 à F022),
      sont croisés avec cinq articles publiés antérieurement sur des sujets connexes
      (dette, féodalité, pétrodollar, capture, effondrement). Chaque fait porte un
      identifiant, une source primaire vérifiée, une URL précise, un statut (Confirmé,
      Nuance, À vérifier). Aucun rapprochement analogique n''est postulé a priori.
      La similarité de structure, si elle existe, doit émerger de la confrontation
      des chiffrages.


      Trois thèses candidates ont été soumises à un test de résistance. La première,
      dite d''inversion, soutient que la modernité a oublié une solution antique (l''annulation
      générale de dettes, pratiquée par andurarum à Sumer entre 2400 et 1400 avant
      notre ère). La deuxième, dite de système, propose que bureaucraties sumérienne
      et française partagent un même type structurel : une institution qui se perpétue
      en captant les flux qu''elle prétend réguler. La troisième, dite de capture,
      identifie un acteur captant (clergé hier, marchés aujourd''hui). Après pesée,
      la deuxième a été désignée cardinale.


      L''enquête ne postule aucune conclusion morale. Elle pose des chiffrages en
      regard, et laisse au lecteur le soin d''en tirer les conséquences. Le parallélisme
      structural, s''il se vérifie au fil des sections, n''implique aucune identité
      de nature, aucune continuité de personne, aucune fatalité historique. Il implique
      seulement que certaines formes institutionnelles se reproduisent quand les conditions
      matérielles qui les ont fait émerger demeurent.'
    intro_methodo_n_mots: 360
    intro_methodo_ancrage_matériel: true
    intro_methodo_zéro_conclusion_prématurée: true
    urls_resolues: 22
    n_urls_dans_mapping: 22
