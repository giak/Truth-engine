    - id: §2
      h2: 'Le pouvoir d''annuler : mécanique des andurarum'
      question: Pourquoi les rois sumériens annulaient-ils périodiquement toutes les
        dettes ?
      révèle: 'Les souverains disposaient d''un pouvoir d''annulation générale (F003,
        F004) ; Gudea l''inscrit sur cylindres vers 2120 av. (F015) ; Charpin (F014)
        nuance : il s''agissait d''un retour au statut d''origine, non d''une libération
        universelle. Le Dialogue de Pessimisme mésopotamien (F009) signale que la
        critique interne du système religieux datait de la même époque.'
      question_suivante: Qui produisait cette masse de dettes insoutenables ?
      faits:
      - F003
      - F004
      - F011
      - F014
      - F015
      - F009
    - id: §3
      h2: 'L''Edubba et les scribes : fabrique institutionnelle de la bureaucratie'
      question: Quelle institution reproduisait la bureaucratie sumérienne ?
      révèle: L'Edubba, école de scribes standardisée (F006) ; 500 000 à deux millions
        de tablettes cunéiformes excavées, 100 000 publiées (F019) ; le Code Lipit-Ishtar
        (F013) montre la formalisation juridique.
      question_suivante: Comment l'écriture devient-elle pouvoir ?
      faits:
      - F006
      - F019
      - F013
      pivot: true
      pivot_raison: 'Edubba pivot : scribe sumérien → fonctionnaire moderne.'
    - id: §4
      h2: Urukagina et la réforme impossible
      question: Les réformes d'Urukagina étaient-elles conservatrices ou novatrices
        ?
      révèle: Réforme « le fort n'opprimera pas le faible » (F008) = restauration
        d'un ordre ancien, pas innovation (F018, De Gruyter 2025). La forme 'réforme'
        existe à Sumer, mais sa capacité transformative reste captive du système.
      question_suivante: Quel parallèle moderne se dessine ?
      faits:
      - F008
      - F018
      pivot: true
      pivot_raison: 'Urukagina pivot : réforme impossible antique → réformes cosmétiques
        modernes.'
    - id: §5
      h2: '3 416 milliards d''euros : qui détient la dette française ?'
      question: En France 2026, qui détient la dette et qui paie ?
      révèle: 54,7% de la dette française (3 416,3 Mds€, 115,6% PIB) détenue par des
        créanciers non-résidents (F001, F022). Le flux est externalisé comme à Sumer
        où l'accumulation se concentrait entre deux andurarum.
      question_suivante: Quel est le coût humain de cette structure ?
      faits:
      - F001
      - F022
      - F005
      pivot: true
      pivot_raison: DETTE pivot moderne.
    - id: §6
      h2: 'Six millions de fonctionnaires : le clergé de papier'
      question: Le clergé scribal sumérien a-t-il un équivalent structurel moderne
        ?
      révèle: 6 millions de fonctionnaires en France (76/1000 hab., 22% de l'emploi,
        F007). Uruk comptait 40 000 à 80 000 habitants à son apogée (F017). L'institution
        qui se perpétue par la formation et l'archivage existe des deux côtés du millénaire.
      question_suivante: Quel droit régit cette masse ?
      faits:
      - F007
      - F006
      - F017
      pivot: true
      pivot_raison: 'F006 pivot hérité §3 → §6 : Edubba scribe → fonctionnaire moderne.'
    - id: §7
      h2: Le code civil de 1804 a-t-il un successeur ?
      question: Existe-t-il aujourd'hui un code civil français comparable à celui
        de 1804 ?
      révèle: Le Code civil de 1804 comprenait environ 2 300 articles (F020), rationalité
        juridique condensée. Le Code Lipit-Ishtar (~400 lignes, F013) est son ancêtre
        structurel. Aucune condensation comparable n'a eu lieu depuis ; l'inflation
        normative contemporaine signale un changement de régime.
      question_suivante: Le système a-t-il une logique commune ?
      faits:
      - F002
      - F013
      - F020
      pivot: true
      pivot_raison: 'DROIT pivot : codes antiques → Code civil → inflation normative.'
    - id: §8
      h2: 'Cinq mille ans de bureaucratie : la continuité qui ne dit pas son nom'
      question: La structure bureaucratique sumérienne a-t-elle un équivalent contemporain
        ?
      révèle: Van De Mieroop & Hudson (2025, F016) reconnaissent la continuité des
        débats assyriologiques sans opposer « redistribution » et « marchés ». Polanyi
