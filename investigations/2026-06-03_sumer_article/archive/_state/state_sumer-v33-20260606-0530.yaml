    - id: §1
      h2: 'L''argile et l''or : anatomie d''une dette de cinq mille ans'
      question: À Sumer, qui devait à qui, à quel taux, avec quelle issue ?
      révèle: 'Le mécanisme matériel de l''endettement : taux 33,3% orge / 20% argent
