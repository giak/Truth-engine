    observation: 'PARADOXE DU HUB : l''audit des sources biaisees (55% etatiques,
      0% contre-argument) a le shadow LE PLUS BAS parmi les fiches meta (2.8x vs META
      5.0x, A 5.8x). Plus on est reflexif, MOINS on a d''ombre.'
