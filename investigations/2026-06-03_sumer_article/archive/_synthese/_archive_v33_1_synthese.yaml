      que nous croyons modernes' est en partie contredit par les 9 autres enquetes.
      Le 'miracle grec' est en partie une illusion d'optique.
  - id: OBS-003
    observation: 'ASYMETRIE EST/OUEST DANS LES OMBRES : 4 fiches sur civilisations
      non-occidentales (C, I, IN, AM) ont shadow moyen 4.4x. 4 fiches sur occident/Rome/Sumer/MA
      ont shadow moyen 2.55x (avec META = recalcul qui est 5.0x et HUB = 2.8x). L''exotisme
      produit plus d''ombre que la normalite.'
    evidence: 'shadows : C 3.2 + I 2.8 + IN 5.2 + AM 6.4 = moyenne 4.4. S 3.1 + R
      2.8 + MA 1.5 + HUB 2.8 = moyenne 2.55. Ratio 1.7x. META 5.0 (recalcul) et A
      5.8 (andurarum refute) sont les perturbateurs qui confirment la tendance.'
