    - I
    - IN
    - AM
    - S
    - R
    - MA
    - HUB
    implication: 'Le regard occidental applique des standards plus stricts aux civilisations
      non-occidentales (biblio recente, sources directes, comparaison systematique).
      Resultat : plus d''incertitude documentee. Mais cette asymetrie EST la preuve
