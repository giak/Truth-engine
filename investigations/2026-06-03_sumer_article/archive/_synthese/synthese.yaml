- titre: 'THESE-005 : 5000 ANS DE STRUCTURES FONCTIONNELLES RÉCURRENTES (continuité, prudence)'
  enonce: 'Les 11 enquêtes convergent sur l''existence de structures fonctionnelles RÉCURRENTES (dette, fiscalité, bureaucratie,
