sujet_majoritaire: Comparer la France contemporaine (2026) à 8 civilisations antiques et médiévales (Sumer, Rome, Chine, Moyen
  Âge, Islam, Inde, Amériques précolombiennes, Andurarum) PLUS 3 auto-critiques ICEBERG pour tester la validité des thèses
  « dette universelle », « transmission linéaire » et « capture étatique » sur 5300 ans d'histoire.
theses_cardinales:
- titre: 'THESE-001 : TRANSMISSION MULTI-LINEAIRE (continuité)'
  enonce: 'La transmission des structures étatiques, juridiques et administratives n''est PAS une flèche Sumer→Grèce→Rome→France
    : c''est un RÉSEAU multi-linéaire passant par Bologne (1070), Cordoue-Tolède (IXe-XIIIe), Pékin-Confucius-Voltaire (XVIIe-XVIIIe),
    Aryabhata-Al-Khwarizmi (Ve-Xe). Le « 3 civilisations » est un artefact historiographique occidental.'
  position: continuité
  f_atomiques_justificatifs:
  - F-R002
  - F-MA001
  - F-IN001
  - F-C001
  - F-I001
  - F-S001
  - F-AM001
  shadow: 2.7
- titre: 'THESE-002 : LA DETTE N''EST PAS UNIVERSELLE (rupture)'
  enonce: 'La dette n''est PAS le mécanisme universel d''intégration sociale : 4 civilisations (Inca, Maya, Aztèque, Inde
    dharmique) fonctionnent SANS dette structurelle, prouvant que l''intégration sociale admet d''autres formes (mit''a, tribut,
    dharma-caste, monopole informationnel). La thèse de la dette comme universel est RÉFUTÉE par contre-exemples.'
  position: rupture
  f_atomiques_justificatifs:
  - F-AM005
  - F-AM006
  - F-I001
  - F-I002
  - F-S003
  - F-C003
  - F-A001
  shadow: 5.5
- titre: 'THESE-003 : L''ANDURARUM EST UN RITUEL POLITIQUE, PAS UN MÉCANISME ÉCONOMIQUE (exception)'
  enonce: 'L''andurarum mésopotamien n''est PAS un précédent de restructuration universelle de la dette : c''est un rituel
    royal IRRÉGULIER (1 tous les 33 ans en moyenne), RESTREINT aux dettes agricoles, INSTRUMENTALISÉ à des fins de légitimité
    politique. Charpin (Collège de France) contredit Hudson : l''andurarum a DISPARU après 1400 av. sans transmission.'
  position: exception
  f_atomiques_justificatifs:
  - F-A001
  - F-A002
  - F-A003
  - F-A004
  - F-A005
  - F-S014
  - F-S003
  shadow: 5.0
- titre: 'THESE-004 : CAPTURE UNIVERSELLE, MÉCANISMES VARIABLES (continuité)'
  enonce: 'Le phénomène de capture étatique par une élite (scribes, lettrés, clercs, énarques, brahmanes, quipucamayocs) est
    UNIVERSEL et TRANS-TEMPOREL. Mais ses MÉCANISMES varient : formation longue (S, R, C, MA), naissance (I), monopole informationnel
    (AM, I), tribunal-religion (IN), legs bureaucratique (MA). Toute réforme qui s''attaque à un mécanisme sans toucher aux
    autres échoue.'
  position: continuité
  f_atomiques_justificatifs:
