cartes_positions:
- fiche: S
  position: continuité
  justification: Sumer propose des structures fonctionnelles reproduites en France, mais à des échelles incommensurables (shadow
    3.1)
- fiche: R
  position: continuité
  justification: Rome est l'ancêtre DIRECT et TEXTUEL du Code civil français (Corpus Juris Civilis 529-534 → 1804)
- fiche: C
  position: continuité
  justification: La Chine précède la France sur 5/7 mécanismes bureaucratiques de 700 à 2350 ans (APEX, 26 faits)
- fiche: MA
  position: continuité
  justification: Le Moyen Âge est la CEINTURE DE TRANSMISSION qui fait passer Rome→France (Bologne 1070)
- fiche: IN
  position: continuité
  justification: L'Islam est le chaînon manquant Rome→Europe via Cordoue-Tolède (IXe-XIIIe)
- fiche: I
  position: rupture
  justification: 'L''Inde intègre par CASTE + DHARMA, pas par dette : réfute partiellement la thèse dette comme universel'
- fiche: AM
  position: rupture
  justification: 'L''Inca fonctionne SANS dette, SANS monnaie, SANS marché : réfute la dette comme universel'
- fiche: A
  position: exception
  justification: L'andurarum est un rituel politique IRRÉGULIER, pas un mécanisme économique (Charpin > Hudson)
- fiche: IC-S
  position: méta-critique
  justification: 'Auto-critique : 6 biais + 7 corrections dans l''enquête Sumer originale'
- fiche: IC-R
  position: méta-critique
  justification: 'Auto-critique : 4 comparaisons inexactes + 6 angles morts dans l''enquête Rome'
- fiche: IC-C
  position: méta-critique
  justification: 'Auto-critique : confiance réduite de 77% à 50% dans l''enquête Chine'
