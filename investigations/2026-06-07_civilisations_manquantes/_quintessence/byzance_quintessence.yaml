perspectives_dialectiques:
- position: Thèse — Byzance conservatoire
  argument: Byzance est le chaînon MANQUANT de la transmission juridique. Sans elle, le CJC est perdu. Avec elle, Bologne et le Code civil sont possibles.
- position: Antithèse — Byzance transformatrice
  argument: Byzance ne se contente pas de CONSERVER. Elle TRADUIT (Basiliques), ADAPTE (Épanagogue), et CRÉE (thèmes). La transmission est active.
- position: Synthèse — Byzance contre-modèle
  argument: Le césaropapisme byzantin est l'EXACT OPPOSÉ de la laïcité française (1905). La France a CHOISI l'inverse.
limites:
- Sources majoritairement Britannica (encyclopédique) — 3 ✦ primaires ajoutées en v2
- 0 source musulmane ou slave sur la conquête de 1453
- Dimension religieuse (orthodoxie, schisme 1054) sous-traitée
wolves:
- nom: Edward Gibbon
  argument: Byzance = décadence, corruption, théologie stérile — empire 'indigne' de Rome
  reponse: Gibbon a imposé ce préjugé pour 200 ans. Byzance a conservé le droit romain quand l'Occident l'a perdu
- nom: Historiographie occidentale
  argument: Rome→Bologne = chaîne directe, Byzance = parenthèse orientale négligeable
  reponse: Faux. Sans Byzance, pas de transmission. La chaîne réelle est Rome→Byzance→Italie→Bologne→Paris
