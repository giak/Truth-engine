these_centrale: "L'affaire Lyhanna révèle une architecture à trois étages connectés par une logique de caste : (1) le déviant local Barella protégé par le silence institutionnel, (2) l'infrastructure qui punit les protecteurs (Damien Tabard) et récompense les complices (Brandouy promu), (3) la galaxie élitaire (Duhamel, Lang, Boutonnat, Matzneff) qui pratique la prédation à l'échelle industrielle avec impunité. Ces trois étages ne sont pas séparés : le même mécanisme de protection de caste les connecte."

theses_implicites:
  - "Le système n'est pas défaillant : il fonctionne avec une précision chirurgicale. Il alloue ses ressources de punition aux protecteurs d'enfants (Tabard licencié en 2022) et ses ressources de protection aux prédateurs (Barella libre jusqu'en 2026)."
  - "L'infrastructure médiatique (Rizet/BFMTV) sert de diversion systémique : détourner la colère légitime vers des boucs émissaires (Islam en prison) plutôt que de pointer la défaillance judiciaire française."
  - "La verticale de la prédation n'est pas une conspiration mais un effet de système : la même logique de caste qui protège Barella par négligence locale protège Duhamel par prescription nationale."

