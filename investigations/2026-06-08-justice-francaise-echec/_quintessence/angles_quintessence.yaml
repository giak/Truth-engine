causalites:
  - cause: "F-ANG-007"
    effet: "F-LYH-001"
    mecanisme: "Absence de signalement Article 40 en 2021 → Barella jamais fiché → plaintes ultérieures non croisées → prédateur libre → Lyhanna assassinée"
  - cause: "F-ANG-001"
    effet: "F-LYH-005"
    mecanisme: "Inversion documentée : le protecteur d'enfants (Tabard) puni avec célérité maximale, le prédateur (Barella) protégé par inertie administrative. Le système alloue ses ressources de contrôle avec une précision qui révèle sa finalité réelle."
  - cause: "F-ANG-002"
    effet: "F-LYH-014"
    mecanisme: "La diversion médiatique (Rizet pointe l'Islam) détourne la pression publique de la question du budget justice. Sans pression, le budget reste à 0,20% PIB."

perspectives_dialectiques:
  - position: "Thèse (officielle)"
    argument: "Les cas Tabard et Bailly sont des cas individuels sans lien entre eux. Le licenciement de Tabard relève du droit du travail. Rizet exprime une opinion personnelle. Il n'y a pas de système."
  - position: "Antithèse (critique)"
    argument: "La convergence de ces 7 angles morts dessine un système cohérent de protection des prédateurs et de punition des protecteurs. Ce n'est pas une conspiration, c'est un effet de système : la même logique de caste opère à tous les niveaux."
  - position: "Synthèse"
    argument: "La thèse critique est étayée par la convergence des cas mais l'absence de contradictoire (aucun des acteurs nommés n'a été interrogé) et de sources primaires pour certains faits (F-ANG-004, F-ANG-007) impose une prudence forensique. Le pattern est documenté, le niveau de coordination reste hypothétique."

limites:
  - "F-ANG-004 (1 million photos magistrat) est une rumeur non sourcée qui affaiblit l'argumentaire si elle est citée comme fait établi"
  - "Le proviseur de Lectoure n'est pas nommé. Mostafa Fourar n'a pas été contacté."
  - "La coordination entre les niveaux (local, médiatique, élitaire) est inférée, pas documentée"
  - "Absence de contradictoire direct pour tous les acteurs nommés"

wolves:
  - nom: "Dominique Rizet"
    argument: "Consultant BFMTV, utilise sa plateforme pour détourner la colère post-Lyhanna vers l'Islam en prison. Historique de proximité avec les forces de l'ordre."
    reponse: "La question n'est pas l'opinion de Rizet mais la ligne éditoriale de BFMTV : pourquoi cette diversion a-t-elle été diffusée dans le contexte Lyhanna ? Qui l'a briefé ?"
  - nom: "Proviseur de Lectoure (non nommé)"
    argument: "A licencié Barella en 2021 sans signalement Article 40. Premier maillon de la chaîne causale."
    reponse: "Son nom devrait être public. La question n'est pas seulement qui il est, mais pourquoi il n'a pas signalé : peur du scandale, pression hiérarchique, ou négligence ?"
  - nom: "Mostafa Fourar"
    argument: "Recteur de Toulouse en 2021. A-t-il eu connaissance du licenciement ? A-t-il ordonné ou omis un signalement ?"
    reponse: "La chaîne de remontée administrative (proviseur → DASEN → recteur → ministre) doit être auditée. Le silence institutionnel est le premier maillon."

