these_centrale: "Le transcript du Monde Moderne (9 juin 2026, invité Castelnau) documente un système judiciaire biface : répression maximale contre les couches populaires via circulaires de priorisation politique, inertie structurelle face à la pédocriminalité. Cette asymétrie résulte de la sociologie de la magistrature, pas d'un complot."

theses_implicites:
  - "La contre-narration indépendante produit une analyse structurelle que ni les médias dominants ni l'institution judiciaire ne produisent."
  - "L'État de droit est invoqué sélectivement : absolu pour protéger la corporation judiciaire, quasi-absent pour protéger les enfants."
  - "Le transcript est un artefact de résistance, mais son EDI à 0.17 impose de le traiter comme une source parmi d'autres."

