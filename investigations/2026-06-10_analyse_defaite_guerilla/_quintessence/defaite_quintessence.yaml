causalites:
  - cause: "F-defaite-014"
    effet: "F-defaite-001"
    mecanisme: "L'absence de sanctuaires imperméables en France rend impossible la survie d'un mouvement armé au-delà de quelques années. Sans sanctuaire, l'infiltration et la surveillance totale (téléphone, numérique, agents doubles) sont inévitables."
  - cause: "F-defaite-006"
    effet: "F-defaite-007"
    mecanisme: "L'assassinat politique brûle les ponts : il coupe le mouvement de sa base sociale ET rend toute négociation impossible. Sans base sociale et sans perspective de négociation, la seule 'sortie' est la mort ou la prison."
  - cause: "F-defaite-008"
    effet: "F-defaite-001"
    mecanisme: "Le burn-out générationnel (2-3 ans de vie clandestine avant effondrement psychologique) rend le recrutement impossible à maintenir. L'État, lui, recrute des informateurs en continu. Le ratio informateur/militant augmente jusqu'au point de rupture."
  - cause: "F-defaite-009"
    effet: "F-defaite-002"
    mecanisme: "L'asymétrie de ressources (1:10 000) + l'horizon temporel infini de l'État créent une guerre d'usure que le mouvement ne peut pas gagner. L'État n'a pas besoin de gagner vite — il lui suffit de ne pas perdre."
  - cause: "F-defaite-017"
    effet: "F-defaite-006"
    mecanisme: "Dans une démocratie médiatique, la violence armée génère une propagande négative automatique. Chaque attentat renforce le soutien public à la répression étatique et isole davantage le mouvement."

perspectives_dialectiques:
  - position: "Thèse — La guérilla armée est un suicide politique garanti en Occident"
    argument: "Les 4 cas (AD, BR, RAF, WUO) + ETA prouvent empiriquement que tout mouvement armé en démocratie occidentale est détruit en moins de 30 ans. L'État dispose d'un avantage structurel insurmontable : monopole de la violence légitime, ressources infinies, horizon temporel illimité, médias alliés, lois d'exception. Tenter la guérilla armée en France 2026, c'est garantir la prison ou la mort."
  - position: "Antithèse — L'IRA et la FARC prouvent que la négociation est possible"
    argument: "L'IRA a forcé le Royaume-Uni à négocier (Good Friday Agreement, 1998). La FARC a signé un accord de paix avec la Colombie (2016). Le PKK est en transition politique (cessez-le-feu 2025). La variable n'est pas 'démocratie vs non-démocratie' mais 'sanctuaire vs absence de sanctuaire'. Avec un sanctuaire imperméable, un mouvement armé peut survivre assez longtemps pour forcer une négociation."
  - position: "Synthèse — Le modèle zapatiste adapté est la seule voie, mais non testée"
    argument: "En l'absence de sanctuaires en France 2026, la guérilla armée est effectivement impossible. Mais le modèle zapatiste (zéro violence après la phase 1, autonomie locale, communication, base sociale préexistante, durabilité) est transposable en principe — à condition d'accepter qu'il n'a jamais été testé hors du Chiapas. Le modèle 'Be Water' de HK 2019 ajoute l'imperméabilité à la décapitation mais au prix de l'incapacité à négocier. La synthèse est un mouvement non-violent, leaderless-résilient, à objectif local plutôt qu'étatique, avec une stratégie de communication plutôt que de confrontation."

limites:
  - "Les 4 cas sont concentrés sur les années 1970-80 — les dynamiques de surveillance numérique (IA prédictive, LOPMI 2023, reconnaissance faciale) ont radicalement changé la donne et rendent l'analyse potentiellement optimiste."
  - "Le modèle zapatiste adapté est hypothétique : il n'a JAMAIS été testé hors du Chiapas rural, pauvre, indigène. Le transposer à la France urbaine, riche, atomisée de 2026 est un saut dans l'inconnu."
  - "Les sources sont secondaires (livres, analyses académiques) — les archives des services de renseignement (DST, BKA, FBI) ne sont pas consultables, ce qui limite la vérification des taux d'infiltration."
  - "L'enquête principale (APEX) a un biais de sélection : elle choisit 4 échecs et 2 succès atypiques (FLN colonial, Zapatistes rural). Le GAP corrige partiellement ce biais en ajoutant 7 cas, mais l'échantillon reste limité."
  - "Aucune analyse quantitative de la perte de soutien (les sondages cités sont indicatifs, pas systématiques)."

wolves:
  - nom: "Partisan de la lutte armée"
    argument: "Les 4 mouvements ont échoué parce qu'ils étaient trop petits et mal organisés, pas parce que la lutte armée est impossible. Avec une discipline FLN, des cellules compartimentées, et des sanctuaires numériques (crypto, darknet), un mouvement armé du 21e siècle pourrait survivre."
    reponse: "Les sanctuaires numériques ne sont PAS des sanctuaires physiques. La LOPMI 2023 permet la surveillance algorithmique prédictive. Un mouvement armé en 2026 serait détecté avant son premier acte — pas par un informateur, mais par un algorithme. Le darknet n'offre pas de refuge contre les mandats d'arrêt."
  - nom: "Pacifiste absolu"
    argument: "Même le modèle zapatiste est trop risqué. L'autonomie territoriale en France tombe sous l'art.450-1 CP. Toute coordination de 5+ personnes est une association de malfaiteurs. La seule action légitime est le vote et la manifestation déclarée."
    reponse: "Les Soulèvements de la Terre ont survécu à une tentative de dissolution (2023) en restant dans le cadre légal. Le modèle zapatiste adapté ne propose PAS la violence — il propose l'autonomie locale par des moyens légaux ou a-légaux (SEL, coopératives, ZAD). La frontière entre légal et légitime est l'objet même de la lutte."
  - nom: "Chenoweth & Stephan"
    argument: "L'étude quantitative de 323 mouvements (2011) montre que les mouvements non-violents ont 2x plus de chances de succès que les violents. La non-violence n'est pas un idéal — c'est une stratégie empiriquement supérieure."
    reponse: "Exact. Cette enquête le confirme pour les démocraties occidentales. La non-violence n'est pas une garantie de succès (Occupy, HK 2019, Gilets Jaunes ont tous échoué), mais la violence est une garantie d'échec. La question n'est pas 'violence ou non-violence' mais 'quelle non-violence fonctionne'."

iceberg:
  - "La démocratie occidentale comme système immunitaire : toute menace (violente ou non) génère une réponse qui renforce le système. Les mouvements violents accélèrent la réponse. Les mouvements non-violents la ralentissent mais ne l'empêchent pas."
  - "La surveillance numérique (LOPMI 2023, IA prédictive, reconnaissance faciale) comme nouvelle arme absolue : un mouvement armé en 2026 serait détecté avant son premier acte."
  - "La question de la taille critique : existe-t-il un seuil (en nombre de membres) en dessous duquel un mouvement est 'trop petit pour négocier' et au-dessus duquel il est 'trop grand pour être écrasé' ?"
  - "Le paradoxe leaderless : les mouvements sans chef (HK 2019, Arab Spring) résolvent l'infiltration mais créent une incapacité à négocier. Le modèle 'Be Water' est le plus adapté à la France 2026 mais sa limite fatale (pas de contrepartie à offrir) n'est pas résolue."
  - "Mnemolite: UP (health OK) mais endpoint /v1/search/ retourne 500. Aucune recherche cross-séries possible."
  - "Résultat Mnemolite: [defaite guerilla armee democratie → 500 Internal Server Error]"

