these_centrale: "La guérilla armée est un suicide politique dans une démocratie occidentale : les 4 mouvements armés occidentaux (AD, BR, RAF, WUO) ont tous été détruits en moins de 30 ans par l'infiltration, l'escalade, la perte de base sociale, l'absence de sortie politique et l'épuisement générationnel. Le seul modèle viable est le modèle zapatiste adapté : zéro violence armée, refus du pouvoir d'État, communication, base sociale préexistante, durabilité — mais ce modèle n'a jamais été testé hors du Chiapas."
theses_implicites:
  - "Les sanctuaires imperméables sont le discriminant principal entre succès et échec : l'IRA (sanctuaire irlandais), le FLN (sanctuaires marocain/tunisien), les Zapatistes (jungle du Chiapas), la FARC (jungle colombienne) et le PKK (monts Qandil) ont tous survécu grâce à des sanctuaires que l'État adverse ne pouvait pas pénétrer. Aucun sanctuaire de ce type n'existe en France 2026."
  - "La taille critique du mouvement détermine la possibilité de négociation : les micro-groupes (<200 membres : AD, BR, RAF, WUO) sont trop petits pour négocier et sont écrasés ; les mouvements massifs (>1000 combattants : FARC, LTTE, IRA) peuvent forcer une négociation par épuisement mutuel. La France 2026 ne permet pas la constitution de mouvements massifs armés."
  - "Les mouvements leaderless (HK 2019, Arab Spring) sont imperméables à la décapitation mais incapables de négocier ou de consolider une victoire. Le modèle 'Be Water' résout le problème de l'infiltration mais crée un problème de gouvernance post-victoire."

faits_atomiques:
  - id: "F-defaite-001"
    enonce: "Les 4 mouvements armés occidentaux des années 1970-80 (Action Directe, Brigades Rosse, RAF, Weather Underground) ont tous été détruits ou dissous en moins de 30 ans. Aucun n'a conquis le pouvoir politique."
    source_url: "Synthèse 4 cas, §1"
    source_section: "§1 Problem Statement"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-002"
    enonce: "La RAF (Allemagne, 1970-1998) : ~30% des membres de la 1ère génération étaient des informateurs du BKA ou du Verfassungsschutz. Autodissolution le 20 avril 1998 sans défaite militaire mais défaite stratégique totale. Aucun impact sur les lois allemandes."
    source_url: "Aust, Der Baader Meinhof Komplex (1985)"
    source_section: "§3.1, §5.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-003"
    enonce: "Action Directe (France, 1979-1987) : le téléphone de Rouillan était sur écoute dès 1977. La DST a attendu 8 ans pour arrêter tous les dirigeants simultanément au lieu-dit 'La Ferme' (1987). L'assassinat de Georges Besse (PDG de Renault, 1986) a été condamné par TOUTE la classe politique française."
    source_url: "Dammame, Action Directe : chronique d'une liquidation (1987)"
    source_section: "§5.1"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-004"
    enonce: "Brigades Rosse (Italie, 1970-1988) : 800 brigadistes se sont repentis entre 1980-1990 (sur ~4 000 membres). La loi Cossiga (1980) offrait une réduction de peine massive pour dénonciation. L'assassinat d'Aldo Moro (1978) a coupé les BR de toute la gauche italienne."
    source_url: "Galleni, Rapporto sul terrorismo (1981) ; Drake, The Aldo Moro Murder Case (1995)"
    source_section: "§5.2"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-005"
    enonce: "Weather Underground (USA, 1969-1977) : seul mouvement armé occidental à n'avoir JAMAIS tué un civil intentionnellement. La townhouse explosion (6 mars 1970) a tué 3 de leurs propres membres. Dissolution par exhaustion en 1977."
    source_url: "Varon, Bringing the War Home (2004) ; Ayers, Fugitive Days (2001)"
    source_section: "§5.4"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-006"
    enonce: "Les 4 mouvements échoués ont TOUS commis l'erreur fatale de l'assassinat politique. Chaque assassinat a détruit le soutien social résiduel : Schleyer (RAF, 1977), Moro (BR, 1978), Besse (AD, 1986). L'assassinat politique est un suicide politique dans une démocratie."
    source_url: "Synthèse §6.1"
    source_section: "§6.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-007"
    enonce: "Les 4 mouvements n'avaient AUCUNE stratégie de sortie politique. Leur horizon stratégique était soit la victoire totale (impossible), soit la mort. Sans perspective de sortie, la rétention des membres et le recrutement deviennent impossibles."
    source_url: "Synthèse §3.4"
    source_section: "§3.4"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-008"
    enonce: "La durée de vie moyenne d'un militant clandestin armé est de 2-3 ans avant la mort, l'arrestation ou l'exil (RAF), 3-4 ans avant la repentance ou la capture (BR). La clandestinité est psychologiquement destructrice : paranoïa permanente, isolement social, rupture familiale."
    source_url: "Della Porta, Clandestine Political Violence (2013)"
    source_section: "§3.5"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-009"
    enonce: "L'État dispose d'un avantage de ressources de 1:10 000 sur les mouvements armés (budget DST vs AD). L'asymétrie n'est pas une faiblesse de l'État — c'est sa force maximale. L'État peut attendre 10-30 ans ; le mouvement a besoin de résultats en mois."
    source_url: "Shapiro, The Terrorist's Dilemma (2013)"
    source_section: "§4.1, §4.4"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-010"
    enonce: "Le FLN (Algérie, 1954-1962) a réussi grâce à 6 conditions ABSENTES en France 2026 : (1) contexte colonial, (2) base sociale massive préexistante (9M d'Algériens), (3) sanctuaires extérieurs (Maroc, Tunisie), (4) soutien international (ONU, URSS, non-alignés), (5) objectif clair et négociable (indépendance), (6) symétrie partielle (armée coloniale pratiquant la torture)."
    source_url: "Horne, A Savage War of Peace (1977) ; Stora, Histoire de la guerre d'Algérie (1993)"
    source_section: "§5.5"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-011"
    enonce: "Les Zapatistes (Chiapas, 1994-présent) sont le seul modèle viable : 12 jours de combats puis abandon des armes, refus du pouvoir d'État, communication poétique (Marcos), base sociale indigène préexistante, 30+ ans de survie par autonomie locale. Modèle jamais testé hors du Chiapas."
    source_url: "Tello Diaz, EZLN : la guerra y la paz (1995) ; Holloway, Change the World Without Taking Power (2002)"
    source_section: "§5.6"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-012"
    enonce: "Le modèle Mao-Che (guerre prolongée, foco) présuppose 4 conditions ABSENTES en France 2026 : sanctuaires ruraux, population hostile à l'État, État faible, économie locale de survie. Citer Mao et Che dans la stratégie, c'est citer une doctrine inapplicable en démocratie occidentale."
    source_url: "Synthèse §6.4"
    source_section: "§6.4"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-013"
    enonce: "L'IRA (1969-2005) est le SEUL mouvement armé ayant forcé un État de l'OTAN à négocier (Good Friday Agreement, 1998). Facteurs décisifs : sanctuaires en République d'Irlande, diaspora US (NORAID), bras politique légal (Sinn Féin), restructuration cellulaire (ASU, 4-5 personnes)."
    source_url: "Moloney, A Secret History of the IRA (2002) ; BBC, Good Friday Agreement explainer (2023)"
    source_section: "GAP §2.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-014"
    enonce: "Les sanctuaires imperméables sont le discriminant principal entre succès et échec : IRA (Irlande), FLN (Maroc/Tunisie), Zapatistes (jungle Chiapas), FARC (jungle Colombie), PKK (monts Qandil) ont tous survécu grâce à des sanctuaires. Aucun sanctuaire de ce type n'existe en France 2026 — le territoire est intégralement cartographié et surveillé."
    source_url: "Synthèse GAP §3"
    source_section: "GAP §3"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-defaite-015"
    enonce: "La FARC (Colombie, 1964-2016) a forcé un accord de paix après 52 ans de conflit — ni victoire ni défaite. Facteurs : sanctuaires dans la jungle, financement autonome via narcotrafic (~$500M/an), structure trop grande pour être écrasée, médiation internationale (Cuba, Norvège)."
    source_url: "Peace Accords Matrix, Final Agreement (2016)"
    source_section: "GAP §2.5"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-016"
    enonce: "Hong Kong 2019 : mouvement leaderless 'Be Water' — 2M de manifestants (25% de la population), imperméable à la décapitation mais incapable de négocier. Écrasé par la Loi sur la sécurité nationale chinoise (juin 2020). 10 000+ arrestations entre 2019 et 2024."
    source_url: "ResearchGate, Solidarity and Implications of a Leaderless Movement in Hong Kong (2020) ; The Guardian (2019)"
    source_section: "GAP §2.7"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-017"
    enonce: "Le paradoxe de la propagande dans une démocratie médiatique : la violence armée est TOUJOURS une propagande négative pour celui qui la commet. Les médias sont structurés pour rapporter la violence comme déviance criminelle, pas comme action politique. Chaque 'coup' médiatique est un coup POUR l'État."
    source_url: "Herman & Chomsky, Manufacturing Consent (1988)"
    source_section: "§4.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-018"
    enonce: "L'ETA (1959-2018) a survécu 59 ans sans jamais forcer l'Espagne à négocier. Effondrement par coordination policière franco-espagnole (2007+), perte du soutien social basque, interdiction de Batasuna, isolement international post-9/11."
    source_url: "BBC, ETA: Key events (2018) ; Britannica, ETA (2024)"
    source_section: "GAP §2.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-019"
    enonce: "Les BR sont le SEUL mouvement armé occidental ayant eu une véritable base sociale ouvrière (FIAT, Pirelli, Alfa Romeo). Même avec cette base, l'assassinat Moro a détruit le soutien. La base se désolidarise quand le mouvement tue."
    source_url: "Della Porta, Social Movements, Political Violence, and the State (1995)"
    source_section: "§5.2"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-defaite-020"
    enonce: "Sous le droit français, toute organisation de 5+ personnes en vue d'actions collectives non autorisées = association de malfaiteurs (art.450-1 CP, 10 ans). Toute action visant à 'troubler l'ordre public par l'intimidation' = terrorisme (art.421-1 CP, 30 ans)."
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006417294"
    source_section: "§6.5"
    head_status: 0
    tier: 1
    glyphe: "❧"

