causalites:
  - cause: "F-audit-004"
    effet: "F-audit-003"
    mecanisme: "L'absence de projet politique (LEVIER) est le gap le plus grave car il précède logiquement tous les autres. Sans savoir POUR QUOI se coordonner, l'analyse de la police, du narratif, de la psychologie militante reste sans objet."
  - cause: "F-audit-005"
    effet: "F-audit-009"
    mecanisme: "Le biais de classe rend les protocoles non testables sur la population qu'ils prétendent servir. Un protocole conçu par et pour des CSP+ ne peut pas être validé empiriquement pour des ouvriers de la France périphérique."
  - cause: "F-audit-007"
    effet: "F-audit-008"
    mecanisme: "La police exécute le verrouillage par la force, les médias par le récit. Les deux sont les faces d'un même contrôle social intégré que le corpus n'a pas cartographié comme système."
  - cause: "F-audit-018"
    effet: "F-audit-005"
    mecanisme: "Le biais de l'enquêteur (homme blanc CSP+) produit mécaniquement un corpus qui parle à des hommes blancs CSP+. Les classes populaires, les femmes racisées, les précaires sont structurellement exclus du lectorat implicite."
  - cause: "F-audit-009"
    effet: "F-audit-001"
    mecanisme: "L'absence de validation empirique fait chuter le score du corpus à 6/10. Sans test terrain, les protocoles restent des hypothèses conceptuelles, pas des solutions actionnables."

perspectives_dialectiques:
  - position: "Thèse — Le corpus est suffisamment bon pour publier (pragmatisme)"
    argument: "Le corpus fait ce qu'il annonce : analyser la coordination acéphale. Score 7.5/10, meilleur que 90% des analyses systémiques. Les gaps sont des directions futures, pas des erreurs. Publier maintenant avec les gaps déclarés honnêtement. Attendre la perfection, c'est ne jamais publier."
  - position: "Antithèse — Les gaps sont trop graves pour publier (rigueur)"
    argument: "Publier sans avoir traité LEVIER (projet politique), CLASSE (60% population absente) et RACE/GENRE (biais systémique) serait irresponsable. Le corpus deviendrait un diagnostic d'élite pour une élite — exactement le contraire de sa mission. Les 3 gaps de Phase 1 sont des prérequis, pas des options."
  - position: "Synthèse — Scénario B avec Phase 1 minimum"
    argument: "Publier avec gaps déclarés mais après avoir traité les 3 gaps bloquants de Phase 1 (LEVIER + CLASSE + RACE/GENRE). ~5 500 lignes d'enquête supplémentaires transforment l'audit en levier sans exiger la perfection. Le reste (Phase 2 et 3) peut suivre après publication."

limites:
  - "L'audit lui-même peut reproduire le biais de classe qu'il dénonce — l'auditeur est un agent LLM sans expérience vécue des réalités de classe ou de race."
  - "Les 10 gaps sont identifiés mais pas investigués en profondeur — chaque gap mériterait son enquête complète (seuls #2 et #3 ont un MANIPULATION_REPORT détaillé)."
  - "Pas de FETCH des URLs sources — les recherches web ont été faites mais les contenus n'ont pas été vérifiés en profondeur."
  - "Les données sur les discriminations policières (CNRS 2017) datent de 9 ans — les chiffres ont pu évoluer avec la LOPMI 2023."
  - "Aucune interview de terrain — les gaps psychologie, race/genre, et classe nécessiteraient des entretiens avec les premiers concernés."

wolves:
  - nom: "Défenseur du corpus"
    argument: "Le corpus ne prétend pas être exhaustif. Il analyse la coordination — pas le projet politique, pas la sociologie des mouvements, pas la police comme institution. Ces sujets sont hors périmètre. L'audit reproche au corpus de ne pas faire ce qu'il n'a jamais promis de faire."
    reponse: "Un corpus qui analyse 'comment se coordonner' sans dire 'pour quoi' est un moyen sans fin. La coordination n'est pas une fin en soi. L'absence de projet n'est pas un hors-périmètre — c'est un impensé structurel qui rend tous les autres travaux inaboutis."
  - nom: "Accusateur de biais"
    argument: "Le corpus est un produit de son milieu — homme blanc CSP+ écrivant pour son semblable. C'est structurel et irréparable. Ajouter une section 'classe' ou 'race/genre' ne changera pas le fait que l'auteur ne vit pas ces réalités. Mieux vaut l'assumer que le masquer."
    reponse: "Assumer le biais est la première étape, mais ne pas le corriger est la seconde. Intégrer les données disponibles (INSEE, CNCDH, Crédoc, littérature académique) et consulter des personnes concernées n'efface pas le biais mais le réduit. Le pire serait de déclarer le biais sans rien changer."
  - nom: "Chenoweth & Stephan"
    argument: "Les données sont claires : mouvements non-violents = 2× plus de succès. Mouvements avec objectif clair = survie prolongée. Le corpus doit intégrer cette littérature empirique et cesser de théoriser dans le vide."
    reponse: "Intégration nécessaire. Le corpus gagnerait à ancrer ses protocoles dans la littérature quantitative sur les mouvements sociaux plutôt que de les déduire de principes philosophiques."

iceberg:
  - "La question du public réel : qui lit le corpus ? Les données Substack (abonnés, démographie, engagement) sont-elles disponibles ? Si le public est déjà CSP+ masculin, le biais de classe est un biais d'audience autant que de production."
  - "Le rôle du financement dans la production du corpus : le temps d'enquête est-il bénévole ou rémunéré ? Un enquêteur bénévole ne peut pas produire au rythme d'un enquêteur salarié — ce qui explique partiellement les gaps."
  - "La tension entre exhaustivité et action : corriger les 10 gaps prendrait 6-12 mois. Est-ce que le contexte politique français permet ce délai ?"
  - "Mnemolite: UP (health OK) mais endpoint /v1/search/ retourne 500. Aucune recherche cross-séries possible."
  - "Résultat Mnemolite: [audit corpus coordination gap → 500 Internal Server Error]"

