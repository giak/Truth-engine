causalites:
  - cause: "F-benelux-001"
    effet: "F-benelux-012"
    mecanisme: "L'art.450-1 CP est une anomalie répressive en Europe — aucun autre pays n'a un seuil aussi bas. Cette spécificité française fait de la France le pire choix pour toute coordination contestataire."
  - cause: "F-benelux-010"
    effet: "F-benelux-011"
    mecanisme: "Le MAE a aboli l'exception politique, rendant la désescalade juridique (se baser au Benelux) largement inefficace. La seule protection est l'art.4(6) MAE, qui dépend de la nationalité/résidence et du consentement de l'État d'émission."
  - cause: "F-benelux-009"
    effet: "F-benelux-006"
    mecanisme: "L'utilisation du §129 StGB contre Letzte Generation montre que la précision théorique du droit allemand ne protège pas dans la pratique. Le politique prime sur le juridique."
  - cause: "F-benelux-003"
    effet: "F-benelux-012"
    mecanisme: "Le nouveau Code pénal belge (septembre 2026) avec l'infraction d''atteinte méchante à l'autorité de l'État' réduit l'avantage comparatif de la Belgique comme juridiction refuge."

perspectives_dialectiques:
  - position: "Thèse — La désescalade juridique fonctionne (optimisme légal)"
    argument: "Le droit comparé montre des différences réelles : l'Allemagne a des exceptions pour partis politiques, les Pays-Bas exigent une permanence, la Belgique a des peines plus faibles. Choisir sa juridiction est une stratégie défensive rationnelle qui réduit le risque pénal."
  - position: "Antithèse — La désescalade juridique est une illusion (réalisme)"
    argument: "Le MAE abolit l'exception politique. L'harmonisation européenne (directive 2017/541) réduit les différences. La pratique (Letzte Generation, Tarnac) montre que le politique prime sur le juridique. Aucune juridiction n'offre de 'safe harbor'."
  - position: "Synthèse — La désescalade juridique est une optimisation marginale, pas une solution"
    argument: "La différence entre 3 ans (Belgique) et 10 ans (France) est réelle mais pas décisive. La vraie protection n'est pas juridique mais politique : construire un soutien public tel que les poursuites deviennent politiquement coûteuses. Le droit comparé est un outil tactique, pas une stratégie."

limites:
  - "Le droit comparé suppose une mobilité géographique (pouvoir vivre en Belgique ou aux Pays-Bas) — c'est un biais de classe implicite."
  - "L'analyse ne couvre pas le droit pénal européen supranational (directive 2017/541, Parquet européen) qui pourrait harmoniser les définitions."
  - "La pratique judiciaire réelle (poursuites, condamnations, peines prononcées) peut diverger significativement des peines maximales théoriques."
  - "L'analyse est statique — les lois changent rapidement (nouveau CP belge septembre 2026, loi anti-blocage néerlandaise juin 2026)."

wolves:
  - nom: "Optimiste juridique"
    argument: "Le droit belge est clairement plus favorable : 1-3 ans vs 10 ans en France. C'est une différence de facteur 3 à 10. Se baser à Bruxelles est une stratégie rationnelle et efficace."
    reponse: "La différence de peine est réelle, mais le MAE permet à la France de demander l'extradition. L'art.4(6) MAE offre une protection conditionnelle, pas absolue. Et le nouveau CP belge 2026 change la donne."
  - nom: "Pessimiste juridique"
    argument: "Aucune juridiction n'offre de protection réelle. Letzte Generation est poursuivie en Allemagne malgré le §129. Le MAE rend l'extradition quasi-automatique. Mieux vaut assumer le risque français."
    reponse: "Même marginale, une différence de peine de 7 ans (10 vs 3) justifie le choix de juridiction. Et la résidence en Belgique active l'art.4(6) MAE, ce qui n'est pas négligeable."

