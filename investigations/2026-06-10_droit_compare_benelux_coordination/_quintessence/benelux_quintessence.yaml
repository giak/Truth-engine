these_centrale: "Aucune des quatre juridictions (France, Belgique, Pays-Bas, Allemagne) n'offre de 'safe harbor' pour la coordination contestataire. La différence est une question de degré (seuils de déclenchement, peines maximales), pas de nature. La France reste le pire choix (art.450-1 CP le plus large d'Europe), la Belgique offre la peine la plus faible (1-3 ans) mais la définition la plus large (pas d'acte matériel requis), l'Allemagne a la définition la plus précise (§129 StGB) mais est utilisée contre les activistes climatiques."
theses_implicites:
  - "Le Mandat d'Arrêt Européen (MAE) a aboli l'exception d'infraction politique : se baser à Bruxelles ne protège pas d'une extradition vers la France pour association de malfaiteurs. La seule protection disponible est l'art.4(6) MAE (nationalité/résidence)."
  - "La désescalade juridique (choisir la juridiction la moins répressive) est une stratégie défensive réelle mais limitée : l'harmonisation européenne (directive 2017/541) et la jurisprudence récente (Letzte Generation, BGH 2023) réduisent progressivement les différences entre pays."
  - "Le droit comparé révèle que l'art.450-1 CP français est une anomalie répressive en Europe — aucun autre pays n'a un seuil de déclenchement aussi bas ('groupement ou entente' sans structure). Cette spécificité est un argument politique autant que juridique."

faits_atomiques:
  - id: "F-benelux-001"
    enonce: "Art.450-1 CP français : 'groupement ou entente' + 1 fait matériel = 10 ans. Définition la plus large d'Europe, ne requiert ni structure hiérarchique ni permanence."
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006417294"
    source_section: "§6 Tableau comparatif"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-002"
    enonce: "Art.322 CP belge : association de malfaiteurs existe 'par le seul fait de l'organisation de la bande' — aucun acte matériel requis. Peine : 1-3 ans (art.324ter)."
    source_url: "https://www.ejustice.just.fgov.be/cgi_loi/change_lg.pl?language=fr&la=F&cn=1867060801&table_name=loi"
    source_section: "§2.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-003"
    enonce: "Nouveau Code pénal belge : entrée en vigueur reportée au 1er septembre 2026. Crée l'infraction d''atteinte méchante à l'autorité de l'État', validée par la Cour constitutionnelle le 29 janvier 2026 malgré le recours de la Ligue des Droits Humains."
    source_url: "https://www.lalibre.be/belgique/judiciaire/2026/01/29/la-cour-constitutionnelle-rejette-le-recours-en-annulation-contre-latteinte-mechante-a-lautorite-de-letat-JY5QV7754VE63DS5DLVAUMB45A/"
    source_section: "§2.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-benelux-004"
    enonce: "Art.140 Sr néerlandais : exige 'permanence et structure' (jurisprudence Hoge Raad). Peine max 6 ans (simple), 10 ans (crimes 12+). La participation inclut le soutien financier ou matériel."
    source_url: "https://maxius.nl/wetboek-van-strafrecht/artikel140"
    source_section: "§3.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-005"
    enonce: "Art.140a Sr néerlandais : organisation terroriste = 15-20 ans depuis la modification du 6 mars 2025. Peine alourdie si l'organisation vise des crimes punis de perpétuité."
    source_url: "https://www.njb.nl/wetgeving/staatsbladen/strafmaximum-deelneming-terroristische-organisatie"
    source_section: "§3.2"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-006"
    enonce: "§129(2) StGB allemand : définition la plus précise d'Europe — 'association organisée de plus de deux personnes, à durée indéterminée, poursuivant un intérêt commun supérieur'. §129(3) exclut les partis politiques et les buts accessoires. Peine max 5 ans."
    source_url: "https://www.gesetze-im-internet.de/stgb/__129.html"
    source_section: "§4.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-007"
    enonce: "§129a StGB allemand : organisation terroriste = 1-10 ans, avec élément intentionnel (intimider la population, contraindre les autorités, déstabiliser les structures de l'État). Chefs : minimum 3 ans."
    source_url: "http://www.wiete-strafrecht.de/User/Leitsaetze/LS_129a_StGB.html"
    source_section: "§4.2"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-008"
    enonce: "BGH 28 juin 2023 (3 StR 424/22) : le §129 StGB est applicable aux groupes opérant exclusivement en ligne, sans rencontre physique. Extension jurisprudentielle majeure."
    source_url: "https://ht-strafrecht.de/blog/strafrecht/wie-schnell-bin-ich-mitglied-einer-kriminellen-vereinigung-der-fall-der-goyim-partei"
    source_section: "§4.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-benelux-009"
    enonce: "Letzte Generation (Dernière Génération) : poursuivie pour §129 StGB en Allemagne. Procès ouvert à Berlin en février 2026 pour déterminer si la désobéissance civile constitue une 'kriminelle Vereinigung'. Précédent dangereux."
    source_url: "https://www.tagesspiegel.de/berlin/klimaaktivisten-vor-gericht-prozess-letzte-generation-eine-kriminelle-vereinigung-15236109.html"
    source_section: "§4.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-benelux-010"
    enonce: "Mandat d'Arrêt Européen (décision-cadre 2002/584/JAI) : a aboli l'exception d'infraction politique. L'association de malfaiteurs figure dans la liste des 32 catégories sans contrôle de double incrimination. Un MAE français ne peut pas être refusé par la Belgique pour défaut de double incrimination."
    source_url: "https://www.robert-schuman.eu/fr/questions-d-europe/0016-le-mandat-d-arret-europeen-et-son-application-par-les-etats-membres"
    source_section: "§5.1-5.4"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-011"
    enonce: "Art.4(6) MAE : seule protection disponible — refus de remise si la personne est nationale ou résidente de l'État d'exécution et que cet État s'engage à exécuter lui-même la peine. Nécessite le consentement de l'État d'émission (CJUE C-2024, 2026)."
    source_url: "https://www.lexology.com/library/detail.aspx?g=b7d8e180-bf22-4792-9e13-6a8e79ac80f6"
    source_section: "§5.5"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-benelux-012"
    enonce: "Classement des juridictions par sécurité : 1. Belgique (peine faible 1-3 ans, mais définition large + nouveau CP 2026), 2. Allemagne (définition précise, exceptions, mais utilisée contre activistes), 3. Pays-Bas (jurisprudence protectrice, mais art.140a sévère), 4. France (pire choix)."
    source_url: "Synthèse §7"
    source_section: "§7"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-benelux-013"
    enonce: "Loi néerlandaise anti-blocage adoptée le 3 juin 2026 : pouvoirs accrus pour les bourgmestres face aux blocages d'autoroutes et voies ferrées. Durcissement des peines pour infractions lors de manifestations."
    source_url: "https://www.rijksoverheid.nl/actueel/nieuws/2026/06/03/kabinet-geeft-burgemeesters-meer-bevoegdheden-bij-demonstraties"
    source_section: "§3.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-benelux-014"
    enonce: "Wet openbare manifestaties (Wom) 1988 néerlandaise : obligation de notification (pas d'autorisation). Le bourgmestre ne peut interdire qu'en cas de menace grave à l'ordre public. Régime le plus libéral des 4 pays."
    source_url: "https://wetten.overheid.nl/BWBR0004318/"
    source_section: "§3.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-benelux-015"
    enonce: "CEDH Bodson c. Belgique 2025 : le droit de grève n'inclut pas le droit de bloquer intentionnellement la circulation. L'entrave méchante à la circulation (art.406 CP belge) est régulièrement utilisée contre les manifestants, y compris syndicaux."
    source_url: "https://sotra.be/news/739-het-stakingsrecht-omvat-niet-het-recht-om-het-verkeer-opzettelijk-te-hinderen?lang=fr"
    source_section: "§2.4"
    head_status: 0
    tier: 2
    glyphe: "❧"

