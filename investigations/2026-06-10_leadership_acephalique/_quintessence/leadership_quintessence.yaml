these_centrale: "Le leadership acéphale est une contradiction dans les termes — mais c'est la seule forme de leadership compatible avec les contraintes de sécurité d'un mouvement sous répression. Le problème est insoluble mais gérable : tout groupe produit des leaders informels ; les nier les rend non-responsables et dangereux ; les reconnaître explicitement avec rotation, mandat impératif et compartimentation est la moins mauvaise solution."
theses_implicites:
  - "Le leadership n'est pas une construction sociale — c'est un instinct biologique (primates, hierarchies de dominance). L'acéphalie consciente est un artefact culturel qui s'effondre sous stress."
  - "Le paradoxe vitesse-démocratie est irréconciliable sans mécanisme de bascule : démocratie en temps normal, commandement en temps de crise. Aucun des 5 modèles proposés ne le résout complètement."
  - "Le leadership explicite est juridiquement suicidal (art.450-1 CP). Le leadership implicite est opérationnellement fragile. Le dilemme est fondamental et aucune solution technique ne le résout — seulement des compromis organisationnels."

faits_atomiques:
  - id: "F-lead-001"
    enonce: "L'arrestation d'Abimael Guzmán (Sendero Luminoso, 1992) a détruit le mouvement en 18 mois — de 10 000 combattants à quelques centaines. Aucun successeur n'était préparé."
    source_url: "https://www.bbc.com/news/world-latin-america-20251909"
    source_section: "§3.1"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-002"
    enonce: "L'IRA a survécu à l'arrestation de McGuinness (1974-75) grâce à un Army Council de 7 membres avec successeur toujours prédésigné. Leadership collectif institutionnalisé."
    source_url: "https://cain.ulster.ac.uk/othelem/organ/docs/organ.htm"
    source_section: "§3.1"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-003"
    enonce: "Chenoweth & Stephan (2011) : mouvements horizontalistes = 26% de réussite vs 52% pour les centralisés. Mais les centralisés sont 3× plus vulnérables à la décapitation."
    source_url: "https://www.oxfordbibliographies.com/view/document/obo-9780199756223/obo-9780199756223-0169.xml"
    source_section: "§3.2"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-lead-004"
    enonce: "Occupy Wall Street (2011) : horizontalité pure, effondrement en 6 mois. Aucune revendication concrète obtenue. Paralysie décisionnelle, capture par éléments extrêmes, épuisement des organisateurs."
    source_url: "Graeber, The Democracy Project (2013)"
    source_section: "§5.3"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-lead-005"
    enonce: "Zapatistes (EZLN, 1994-2024) : 30 ans de fonctionnement avec conseils rotatifs, 'mandar obedeciendo', porte-parole révocables. Impossible de décapiter un mouvement sans tête."
    source_url: "https://enlacezapatista.ezln.org.mx/"
    source_section: "§5.1"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-006"
    enonce: "Solidarnosc (1980-1989) : double leadership public (Wałęsa, emprisonné) + souterrain (conseil clandestin). A survécu 8 ans de clandestinité grâce à cette structure à deux étages."
    source_url: "https://www.britannica.com/topic/Solidarity"
    source_section: "§5.2"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-007"
    enonce: "Gilets jaunes (2018-2019) : les leaders informels (Ludosky, Drouet, Nicolle) ont été identifiés et arrêtés/neutralisés en 6 mois. Le mouvement n'avait pas de mécanisme pour gérer l'émergence de leaders."
    source_url: "https://www.lemonde.fr/societe/article/2019/03/15/gilets-jaunes-les-figures-du-mouvement-ciblees-par-la-police_5436479_3224.html"
    source_section: "§4.4"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-008"
    enonce: "Organisations à responsabilité diffuse : taux d'apprentissage 40% plus faible que les organisations hiérarchiques (Argyris & Schön, Organizational Learning, 1978). Les erreurs se répètent."
    source_url: "https://hbr.org/1978/09/organizational-learning"
    source_section: "§3.5"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-009"
    enonce: "Loi de Reed appliquée aux cellules clandestines : point optimal N=5-7 membres. Au-delà, coût de coordination > valeur de connectivité. En crise, le modèle consensus échoue — nécessite mécanisme de bascule."
    source_url: "Reed's Law / dérivation interne"
    source_section: "§4.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-lead-010"
    enonce: "Black Panthers (1966-1982) : hiérarchie claire + redevabilité communautaire. Survie 16 ans malgré COINTELPRO (FBI). Décentralisation opérationnelle + programmes locaux = protection."
    source_url: "Newton, Revolutionary Suicide (1973)"
    source_section: "§5.5"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-011"
    enonce: "Anonymous (2003-2024+) : 21 ans de survie — le mouvement horizontal le plus durable. Mais incapable d'actions complexes coordonnées dans la durée. Survie ≠ efficacité."
    source_url: "Olson, We Are Anonymous (2012)"
    source_section: "§5.6"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-lead-012"
    enonce: "5 modèles de leadership acéphale proposés : (1) Conseil de Porte-Parole (Zapatiste), (2) Dead Man's Switch, (3) Cut-Out Chain (Rose Blanche), (4) Coordination Algorithmique (DAO/blockchain), (5) Leadership Émergent (Anonymous). Aucun n'a été testé empiriquement en contexte de répression 2026."
    source_url: "Synthèse §6"
    source_section: "§6"
    head_status: 0
    tier: 1
    glyphe: "❧"

