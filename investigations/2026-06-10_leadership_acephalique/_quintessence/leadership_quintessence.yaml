causalites:
  - cause: "F-lead-001"
    effet: "F-lead-002"
    mecanisme: "Sendero Luminoso (leader unique) vs IRA (conseil de 7) : la différence de survie après décapitation tient entièrement au mécanisme de succession préétabli."
  - cause: "F-lead-003"
    effet: "F-lead-012"
    mecanisme: "Le paradoxe Chenoweth & Stephan (centralisés = 2× plus de succès mais 3× plus vulnérables) impose de trouver un modèle hybride qui capture les avantages des deux sans leurs vulnérabilités respectives."
  - cause: "F-lead-008"
    effet: "F-lead-004"
    mecanisme: "L'absence de responsabilité désignée (pas de leader = pas d'apprentissage) condamne les mouvements horizontalistes à répéter les mêmes erreurs jusqu'à épuisement."

perspectives_dialectiques:
  - position: "Thèse — Le leadership est inévitable, mieux vaut l'assumer"
    argument: "Tout groupe produit des leaders informels. Les nier les rend non-responsables. Mieux vaut un leadership explicite, rotatif, avec mandat impératif et mécanisme de succession."
  - position: "Antithèse — Le leadership explicite est une cible, l'acéphalie protège"
    argument: "Tout leader identifiable est une cible juridique (art.450-1 CP) et policière. L'anonymat structurel (Anonymous, cellules compartimentées) est la seule protection dans un État de surveillance totale."
  - position: "Synthèse — Leadership de fonction, pas de personne"
    argument: "Séparer la fonction (coordonner, décider) de la personne. Rotation obligatoire, mandat impératif, dead man's switch. Le leadership devient un rôle temporaire, pas une identité. C'est la leçon zapatiste."

limites:
  - "Aucun des 5 modèles proposés n'a été testé empiriquement en contexte de répression française 2026 (LOPMI, surveillance algorithmique)."
  - "Les 6 cas historiques sont majoritairement occidentaux — absence des modèles asiatiques (PCC, Dalai Lama, Aung San Suu Kyi)."
  - "Biais techno-solutionniste : les solutions blockchain/ZKP supposent une infrastructure que la clandestinité ne permet pas."
  - "Le biais biologique (leadership = instinct primate) est mentionné mais pas intégré aux solutions proposées."

wolves:
  - nom: "Partisan de l'horizontalité pure"
    argument: "Toute structure de leadership, même rotative, finit par créer une caste. Les Zapatistes eux-mêmes ont des 'commandants' qui ne tournent pas vraiment. L'horizontalité pure (Occupy) a échoué mais par manque de temps, pas de principe."
    reponse: "21 ans d'Anonymous et 6 mois d'Occupy — la durée tranche. L'horizontalité pure survit (Anonymous) mais n'agit pas. L'action exige une coordination que seul un leadership (même temporaire) peut fournir."
  - nom: "Réaliste juridique"
    argument: "Art.450-1 CP qualifie TOUTE structure de commandement d'association de malfaiteurs. Même un conseil rotatif de porte-parole est une cible. Le seul leadership sûr est l'absence de leadership."
    reponse: "L'art.450-1 CP criminalise l'organisation, pas le leadership. C'est l'existence d'une structure qui déclenche l'infraction, pas la présence d'un chef. L'acéphalie ne protège pas juridiquement."

