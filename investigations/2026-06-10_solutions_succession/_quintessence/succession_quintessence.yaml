iceberg:
- item: 'Le dead man''s switch Git-based (lp1) utilise GitHub public comme heartbeat — l''infrastructure la plus publique
    possible devient un outil clandestin. Paradoxe interessant a explorer.

    '
- item: 'L''IRA separait strictement la fonction militaire (Army Council) de la fonction politique (Sinn Fein). Si l''une
    est decapitee, l''autre assure la continuite. Ce modele a deux tetes n''est pas explore pour les mouvements civils.

    '
- item: 'Mnemolite: UP, search DOWN.

    '
- item: 'Le Pause Guardian pattern (DAO) permet de geler les operations sans pouvoir les modifier — separation des pouvoirs
    d''urgence. Applicable a la succession humaine ?

    '
