perspectives_dialectiques:
- P1: 'Favorable : Des solutions techniques existent et sont operationnelles (StillAliveBot, Posthumous, Sarcophagus). Les
    modeles historiques (IRA, Solidarnosc, Zapatistes) prouvent que la succession est soluble.

    '
- P2: 'Defavorable : Aucune solution testee sous repression francaise. La tech est tracable/saisissable. Un protocole ecrit
    = preuve penale. La rotation zapatiste exige une culture politique que la France n''a pas.

    '
- P3: 'Synthese : La succession ne se resout pas par un outil mais par une architecture. Combiner dead man''s switch technique
    + rotation des roles + partage cryptographique (Shamir) + Individual Initiative (Holacracy). Mais le risque art.450-1
    CP reste structurel.

    '
limites:
- Aucun outil teste en contexte repressif reel.
- Un protocole ecrit = preuve penale (art.450-1 CP).
- Dependance a l'infrastructure tech (Telegram bloque dans 15 pays).
- Complexite technique hors de portee des militants moyens.
- Aucun protocole ne resiste a la compromission du leader arrete.
- La rotation zapatiste exige une culture politique inexistante en France.
