these_centrale: 'La succession du leader arrete est le verrou central non resolu de la coordination acephale. 5 approches
  existent : dead man''s switch technique (StillAliveBot, Sarcophagus, Posthumous), succession historique (IRA co-option,
  Solidarnosc TKK, Zapatistes rotation), blockchain DAO (multisig Gnosis Safe, Governor Bravo), partage cryptographique (Shamir,
  TOTP), et gouvernance adaptative (Holacracy Individual Initiative). Aucune n''a ete testee en contexte repressif francais.
  Suspicion score : 5.0/10.

  '
theses_implicites:
- TI1: 'Le dead man''s switch est la solution technique la plus prometteuse mais cree une dependance a l''infrastructure (Telegram
    bloque dans 15 pays, serveurs saisissables). La tech est un point de defaillance, pas une solution.

    '
- TI2: 'La rotation zapatiste (Juntas del Buen Gobierno) est la seule approche qui elimine structurellement le probleme de
    la succession : il n''y a pas de leader unique a remplacer.

    '
- TI3: 'Un protocole de succession ecrit constitue une preuve materielle d''association de malfaiteurs (art.450-1 CP). Le
    document qui sauve le mouvement peut aussi le condamner.

    '
