these_centrale: 'Le systeme ne maintient pas son controle par la repression seule mais en empechant activement la coordination
  entre les individus. La reponse historiquement validee est une contre-organisation de type guerilla : chaines de commandement,
  separation des pouvoirs, patience strategique, discipline de fer. La HYPER_MATRICE propose 15 protocoles operationnels (cellules
  3-5, mitose, socio-cratie, caisse commune, compartimentation FLN, care politique, temps long) mais un auto-audit brutal
  revele que cette V1 est structurellement inadequate face aux menaces du 21e siecle (repression algorithmique, guerre de
  l''information IA, sterilisation legale de l''espace associatif).

  '
theses_implicites:
- TI1: 'La contradiction systemique est mortelle pour l''individu mais vitale pour le systeme : l''individualisme est promu
    tandis que la cooperation est exigee. Cette contradiction atomise la societe et empeche la coordination par defaut.

    '
- TI2: 'La V1 HYPER_MATRICE est un manuel de guerilla du 20e siecle face a une repression algorithmique du 21e. Le systeme
    apprend et neutralise les structures de resistance plus vite qu''elles ne se construisent.

    '
- TI3: 'Les 5 loups identifies (repression algorithmique, climat comme pretexte, guerre information IA, sterilisation legale,
    fragilite demographique) menacent la coordination a un niveau que la V1 n''anticipe pas.

    '
