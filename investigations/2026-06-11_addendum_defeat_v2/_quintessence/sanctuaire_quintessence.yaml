    (guerre syrienne, tolerance irakienne). Non reproductible en France.

    '
- item: 'La diaspora francaise (2.5M) est un sanctuaire sous-exploite. Financement, relais mediatique, protection juridique
    (extradition limitee pour motifs politiques).

    '
- item: 'Le RIC comme sanctuaire politique est une these originale qui merite investigation dediee. 73% de soutien = protection
    narrative.

    '
