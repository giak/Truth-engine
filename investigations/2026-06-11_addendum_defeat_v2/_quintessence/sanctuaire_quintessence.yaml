perspectives_dialectiques:
- P1: 'Favorable : La France n''a pas de Qandil mais peut construire des sanctuaires (ZAD 8 ans, diaspora 2.5M, RIC a 73%,
    campus). Le sanctuaire n''est pas donne par la geographie — il se construit.

    '
- P2: 'Defavorable : Aucun sanctuaire construit en France n''a survecu a un Etat determine (NDDL demantelee, SdT dissous).
    Les sanctuaires virtuels ne suffisent pas (HK 2019). Le territoire est sature.

    '
- P3: 'Synthese : La seule voie francaise est la combinaison : sanctuaire politique (RIC, constituante) + sanctuaire diasporique
    (2.5M Francais etranger) + sanctuaire psychologique (inner sanctuary). Aucun sanctuaire unique ne suffit — il faut la
    redondance du modele PKK.

    '
limites:
- Correlation sanctuaire-duree basee sur N=8, pas de test statistique.
- Biais de survivorship: mouvements morts en 6 mois absents de l'analyse.
- La France n'a pas de sanctuaire physique disponible.
- Sanctuaires francais (NDDL, SdT) demanteles par l'Etat.
- Le RIC comme sanctuaire politique est une these non testee.
- Le sanctuaire est une dependance, pas une solution permanente.
