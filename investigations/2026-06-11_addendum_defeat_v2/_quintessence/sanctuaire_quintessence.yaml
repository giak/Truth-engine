these_centrale: 'Le sanctuaire (physique, diasporique, territorial, virtuel, etatique) est le meilleur predicteur de la longevite
  d''un mouvement. Tous les mouvements ayant dure plus de 10 ans avaient un sanctuaire physique. Tous les mouvements sans
  sanctuaire ont dure moins de 2 ans. La France n''a pas de sanctuaire physique disponible — il faut le construire. Suspicion
  score : 7.8/10.

  '
theses_implicites:
- TI1: 'La question strategique centrale n''est pas "comment agir" mais "ou exister". Sans sanctuaire, le plus beau protocole
    de coordination est une liste de taches pour epuises.

    '
- TI2: 'Le sanctuaire cree une dependance strategique : chaque type de sanctuaire peut fermer (Etat-hote, diaspora sous pression,
    plateforme qui bannit). Le modele PKK (sanctuaires multiples) est le plus resilient.

    '
- TI3: 'Le sanctuaire psychologique (inner sanctuary) est le sanctuaire primaire en France : en l''absence de sanctuaire physique
    durable, l''abri interieur (communaute, recit, rituels) devient la protection accessible.

    '
