these_centrale: 'Aucun protocole du corpus n''a jamais ete teste empiriquement. Le design de validation propose 3 phases (labo
  sec → conditions reelles → stress), 7 metriques de succes/echec, 8 protocoles priorises, cadre ethique. La validation historique
  confirme les protocoles (IRA = tous appliques → victoire ; GJ = aucun → defaite) mais n''est pas un test controle. Le corpus
  doit etre falsifiable (conditions de refutation). 4 protocoles sont structurellement non testables. Suspicion score : 6/10.

  '
theses_implicites:
- TI1: 'Sans validation empirique, le corpus reste une speculation — la mieux documentee possible, mais une speculation. Le
    test ultime est l''histoire, pas le laboratoire.

    '
- TI2: 'La validation historique (IRA vs GJ) est puissante mais biaisee : les cas sont selectionnes pour confirmer la these.
    Ou sont les mouvements avec sanctuaire qui ont echoue ?

    '
- TI3: 'Le corpus est structurellement irrefutable tant que la coordination n''existe pas en France. C''est sa force (pas
    de refutation possible) et son danger (peut passer des annees sans validation ni invalidation).

    '
faits_atomiques:
- id: F-EMP-001
  enonce: 'Aucun protocole du corpus Truth Engine n''a ete teste empiriquement. Risques : inefficacite silencieuse, danger
    (securite inverse), auto-illusion, accusation de "theorie de salon".

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-002
  enonce: 'Design de validation : 3 phases. Phase 1 (labo sec, 1-2 semaines, risque nul, 5-20 personnes). Phase 2 (conditions
    reelles, 1-3 mois, risque faible, 10-50 personnes). Phase 3 (stress, 2-4 semaines, risque moyen, 10-20 personnes dont
    2-3 "adversaires").

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-003
  enonce: '7 metriques de succes : taux de completion (>80%), temps d''execution (<1.5x), satisfaction (>4/5), confidentialite
    (0 fuites), resilience (>60%), reproductibilite (3/3).

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-004
  enonce: '8 protocoles priorises par ordre de test : Signal cellule → leadership tournant → cloisonnement cellulaire → financement
    invisible → succession → non-escalade → coordination inter-cellules → sortie de crise.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-005
  enonce: 'Cadre ethique : consentement eclaire, droit de retrait, pas de piege, debriefing, anonymisation. Regles securite
    : pas de vrais militants sous surveillance, pas d''activites illegales.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-006
  enonce: 'Validation historique : IRA applique tous les protocoles (leadership, cellules, financement, sanctuaire, projet)
    → Good Friday Agreement. GJ n''appliquent aucun protocole → defaite 6 mois.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-007
  enonce: 'Occupy (2011), Printemps arabe (2011), Hong Kong (2019), GJ (2018) : tous les mouvements sans protocoles du corpus
    ont echoue en <2 ans. Validation par la negative.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-008
  enonce: 'Effet Hawthorne (Mayo 1930s) : participants testes modifient leur comportement. Biais les tests de phase 1. Solutions
    : tests aveugles, auto-observation, proxy, triangulation.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-009
  enonce: 'Conditions de falsification (Popper) : un mouvement sans sanctuaire >10 ans, un mouvement acephale qui gagne, un
    mouvement sans projet politique qui gagne → le corpus serait refute.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-010
  enonce: '4 protocoles structurellement non testables : repression massive, succession en cas de decapitation, ethique du
    sacrifice, guerre narrative contre l''Etat.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-011
  enonce: 'Probleme d''echelle (Dunbar 1993) : neocortex limite a ~150 relations stables. Aucun mouvement acephale n''a depasse
    ~50 000 membres coordonnes. Les protocoles ne sont pas invariants d''echelle.

    '
  source_url: null
  source_section: ''
  glyphe: ❧
  head_status: 0
  tier: 2
- id: F-EMP-012
  enonce: 'Suspicion score : 6/10. Validation historique 7/10 (coherence mais selection des cas), design de test 6/10 (labo
    possible mais limites observateur), falsifiabilite 5/10 (theorique mais pratiquement difficile).

    '
  source_url: null
  source_section: ''
