perspectives_dialectiques:
- P1: 'Favorable : la validation historique est puissante. 4 mouvements sans protocoles = 4 echecs. IRA avec protocoles =
    victoire. La correlation est parfaite dans les cas etudies.

    '
- P2: 'Defavorable : selection biaisee des cas, pas de test controle, contexte different (Irlande 1969 ≠ France 2026). L''effet
    Hawthorne biaise les tests en labo. 4 protocoles non testables.

    '
- P3: 'Synthese : le corpus ne sera valide ni par un test en laboratoire ni par l''histoire passee. Le test ultime est l''emergence
    d''un mouvement de coordination reel en France. Jusque-la, le corpus reste une hypothese.

    '
limites:
- Biais historico-centre: cas selectionnes pour confirmer la these.
- Effet Hawthorne: comportement modifie sous observation.
- Falsifiabilite theorique mais pratiquement difficile.
- 4 protocoles structurellement non testables.
- Dunbar: plafond biologique de 150 relations stables.
- Le test ultime (mouvement reel) est hors de controle.
wolves:
- nom: Si le corpus est structurellement irrefutable tant que la coordination n'existe ...
  argument: 'Si le corpus est structurellement irrefutable tant que la coordination n''existe pas, alors il peut passer 20
    ans sans etre ni valide ni invalide. Est-ce une theorie ou une foi ?

    '
  reponse: ''
- nom: La validation historique est une confirmation, pas une preuve
  argument: 'La validation historique est une confirmation, pas une preuve. Un biais de selection inverse (mouvements avec
    protocoles qui ont echoue) pourrait invalider la these. Ces cas existent-ils et sont-ils caches ?

    '
  reponse: ''
iceberg:
- item: 'Niveau 10 : le corpus n''est pas une science tant qu''il n''est pas falsifiable. L''histoire tranchera. En attendant,
    c''est l''hypothese la mieux documentee disponible.

    '
- item: 'Dunbar (150) : plafond biologique de la coordination acephale. Les protocoles sont concus pour le micro — pas pour
    le scaling.

    '
- item: '4 protocoles non testables : l''acceptation de cette limite est plus robuste que la pretention a une scientificite
    impossible.

    '
