perspectives_dialectiques:
- etiquette: État fort ou État fragile ?
  position_A: La France a une armée nucléaire, un siège au CSNU, une administration puissante — c'est un État fort
  position_B: Ces attributs masquent une fragilité interne documentée par 12 indicateurs empiriques
  synthese: 'La force apparente et la fragilité réelle ne sont pas contradictoires. L''État fort est la coquille qui protège
    l''État fragile — mais la coquille se fissure.

    '
- etiquette: Fragilité = danger ou opportunité ?
  position_A: La fragilité étatique mène au chaos, à la violence, au coup d'État — danger absolu
  position_B: La fragilité est une fenêtre d'opportunité pour la coordination acéphalique — le système est vulnérable
  synthese: 'Ni danger ni opportunité en soi. La fragilité est une surface d''attaque. Sans stratégie de coordination, elle
    profite aux autoritaires. Avec stratégie, elle peut profiter au peuple.

    '
- etiquette: La France est-elle comparable aux États fragiles africains ?
  position_A: Comparaison absurde — la France n'est pas le Soudan
  position_B: La fragilité est un spectre, pas un binaire. La France est sur le spectre.
  synthese: 'Les mécanismes de fragilité (délégitimation, corruption, factionnalisation) sont universels. L''intensité varie.
    La France est un cas de fragilité à haute capacité répressive — le pire des deux mondes.

    '
limites:
- Dépendance aux indicateurs FFP — méthodologie contestée par certains États
- Confusion possible entre perception (corruption, confiance) et réalité matérielle
- 'Risque de biais de confirmation : sélection des indicateurs qui confirment la thèse'
- Aucun test empirique de la corrélation fragilité/opportunité stratégique
- 'Suspicion globale : 5.5/10'
