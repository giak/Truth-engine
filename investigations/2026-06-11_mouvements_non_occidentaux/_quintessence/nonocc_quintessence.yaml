perspectives_dialectiques:
- etiquette: Les cas non-occidentaux sont-ils applicables à la France ?
  position_A: La France est une démocratie — les cas non-occidentaux sont des contextes autoritaires, incomparables
  position_B: Hong Kong est comparable (État de niveau OTAN). Les mécanismes de coordination sont universels même si la répression
    varie.
  synthese: 'Les mécanismes de coordination (contagion, occupation, grève générale) sont universels. Le niveau de répression
    détermine le coût, pas la validité du mécanisme.

    '
- etiquette: Pourquoi intégrer des cas qui ont tous échoué ?
  position_A: Intégrer des échecs affaiblit la thèse — se concentrer sur les succès (Solidarnosc, Otpor!)
  position_B: L'échec est plus instructif que le succès. Comprendre POURQUOI ça échoue est la clé.
  synthese: 'Les 5 cas ont échoué POUR DES RAISONS SPÉCIFIQUES (répression extrême, absence de sanctuaires, contre- révolution).
    Documenter ces raisons renforce la thèse.

    '
