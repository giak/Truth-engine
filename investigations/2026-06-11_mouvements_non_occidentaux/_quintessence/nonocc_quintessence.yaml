complexity: COMPLEX
these_centrale: 'Le corpus de coordination acéphalique est biaisé vers les mouvements occidentaux (Europe, Amérique du Nord).
  5 cas non-occidentaux documentés (Printemps arabe, Soudan 2019, Myanmar 2021, Iran 2022, Hong Kong 2019) révèlent des mécanismes
  de coordination absents du corpus actuel et des niveaux de répression qui invalident certains postulats du modèle français.

  '
theses_implicites:
- label: T1
  texte: 'Le modèle zapatiste n''est pas le seul modèle non-occidental viable. Les Printemps arabes et le Soudan 2019 documentent
    des formes de coordination spontanée que le corpus ignore.

    '
- label: T2
  texte: 'Les niveaux de répression des cas non-occidentaux (tirs à balles réelles, disparitions, torture) rendent le modèle
    français de « non-escalade » naïf si appliqué à ces contextes. Mais la France n''est PAS à ce niveau.

    '
- label: T3
  texte: 'Le corpus souffre d''un occidentalisme structurel : les références théoriques (Sharp, Ostrom, Scott) sont occidentales
    ; les cas historiques (Solidarnosc, Otpor!) sont occidentaux. Intégrer les mouvements non-occidentaux renforcerait la
    crédibilité du cadre.

    '
