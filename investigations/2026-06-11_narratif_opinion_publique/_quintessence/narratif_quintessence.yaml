complexity: COMPLEX
these_centrale: 'La coordination acéphalique ne peut vaincre sans un narratif qui perce le filtre médiatique. Le corpus identifie
  4 canaux (médias, réseaux sociaux, viralité organique, bouche-à-oreille) et 3 récits-cadres (dépossession, souveraineté
  volée, fracture élite/peuple). Mais le narratif n''a jamais été testé.

  '
theses_implicites:
- label: T1
  texte: 'Le narratif n''est pas un accessoire — il est l''arme principale. Sans narratif, la coordination reste un concept
    académique invisible.

    '
- label: T2
  texte: 'Le corpus Substack actuel EST le narratif. Chaque article est un test de cadre narratif. Les 20+ articles publiés
    sont un laboratoire de framing.

    '
- label: T3
  texte: 'La viralité organique est le seul canal non-contrôlable par l''État. Elle ne peut pas être achetée, seulement méritée.

    '
