these_centrale: 'La doctrine française de maintien de l''ordre (MO) a subi une mutation radicale entre 2016 et 2025 : du modèle
  « défensif négocié » au modèle « offensif dissuasif ». Cette mutation rend caduques les stratégies de confrontation classiques
  et renforce la nécessité du modèle non-escalade zapatiste.

  '
theses_implicites:
- label: T1
  texte: 'La mutation du MO n''est pas une réponse à une menace réelle mais une anticipation préemptive. L''État se prépare
    à une insurrection qui n''existe pas encore.

    '
- label: T2
  texte: 'Le MO français post-2016 est le plus agressif d''Europe occidentale. Aucun autre pays de l''UE n''a adopté le niveau
    de létalité et de discrétion policière français.

    '
- label: T3
  texte: 'La non-escalade zapatiste est la SEULE réponse viable face à cette doctrine. Toute confrontation frontale est mathématiquement
    perdante.

    '
