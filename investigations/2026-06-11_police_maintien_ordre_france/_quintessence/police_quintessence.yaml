perspectives_dialectiques:
- etiquette: La police est-elle une variable indépendante ou un symptôme ?
  position_A: La police est l'outil de la volonté politique — variable dépendante
  position_B: La police a son autonomie doctrinale, budgétaire, syndicale — variable indépendante
  synthese: 'Les deux sont vrais à des niveaux différents. La police a une autonomie croissante (budget, doctrine) mais reste
    subordonnée au politique. L''autonomie est le problème.

    '
- etiquette: La non-violence zapatiste est-elle applicable face à une police offensive ?
  position_A: Impossible — la police attaque même les non-violents
  position_B: La non-violence zapatiste n'est pas passive — c'est une stratégie d'évitement, pas de soumission
  synthese: 'La non-escalade zapatiste = décentralisation + autonomie locale + invisibilité stratégique. Pas de cible = pas
    de répression possible. Reste théorique.

    '
