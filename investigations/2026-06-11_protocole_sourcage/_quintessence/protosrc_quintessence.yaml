these_centrale: 'Le corpus actuel manque d''un protocole de sourçage standardisé. 12 règles de sourçage sont proposées pour
  élever le corpus au standard académique (Wikipédia < 50%, sources primaires > 30%, HEAD-check systématique, etc.). Ce pacte
  est auto-contraignant et irréversible s''il est appliqué.

  '
theses_implicites:
- label: T1
  texte: 'Sans protocole de sourçage, le corpus est vulnérable à la disqualification. Un fait non-sourcé est une ligne d''attaque.

    '
- label: T2
  texte: 'Le sourçage est une arme défensive ET offensive. Défensive : blindage anti-fact-checking. Offensive : chaque source
    est une munition partageable.

    '
- label: T3
  texte: 'La contrainte du protocole est aussi une contrainte éditoriale : les faits non-sourçables ne seront pas écrits.
    C''est un filtre de qualité.

    '
