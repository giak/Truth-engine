perspectives_dialectiques:
- etiquette: Le sourçage est-il une perte de temps pour un média citoyen ?
  position_A: Le temps passé à vérifier est du temps non-écrit — productivité réduite
  position_B: Un fait non-vérifié publié est une bombe à retardement — le temps gagné est perdu 10×
  synthese: 'Le sourçage n''est pas optionnel pour un média qui prétend à la vérité. C''est le ticket d''entrée.

    '
- etiquette: Les règles 1-12 sont-elles réalistes pour un auteur solo ?
  position_A: Non — 12 règles, c'est du travail d'équipe éditoriale
  position_B: Le Sublimator automatise déjà une partie du travail. Le LLM hôte est l'équipe éditoriale.
  synthese: 'Le LLM + Sublimator rendent le pacte réaliste pour un auteur solo. Sans ces outils, c''était impossible.

    '
limites:
- 12 règles = overhead significatif sur le temps d'écriture
- Risque de sur-sourçage (paralysie par excès de vérification)
- Le pacte n'a pas été testé sur un article complet
- Certaines règles (traçabilité page/paragraphe) sont irréalistes pour les sources web
- 'Suspicion : 6.5/10 (protocole solide mais non-testé)'
