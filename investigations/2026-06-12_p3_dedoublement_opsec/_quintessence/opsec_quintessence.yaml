    effet: "F-opsec-002"
    mecanisme: "La double appartenance des leaders crée une vulnérabilité juridique que l'État tente d'exploiter via les supergrasses. L'échec partiel est dû à l'absence de preuves documentaires."
  - cause: "F-opsec-003"
    effet: "F-opsec-004"
    mecanisme: "Le Broadcasting Ban démontre que le front légal peut être neutralisé sans toucher à la base clandestine, en attaquant sa VISIBILITÉ plutôt que son existence."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le modèle double structure est une protection éprouvée : l'IRA a survécu 29 ans et négocié le Good Friday Agreement grâce à cette architecture."
  - position: "Antithèse"
    argument: "Le modèle est dépendant de conditions historiques absentes en 2026 (pas de métadonnées, pas de TRACFIN, pas de LOPMI). L'étanchéité pré-numérique est morte."
  - position: "Synthèse"
    argument: "La question n'est pas la transposition du modèle IRA mais son ADAPTATION : quel est l'équivalent contemporain de l'étanchéité pré-numérique ? L'enquête ne répond pas à cette question."

limites:
  - "Modèle IRA contextuellement spécifique (conflit colonial, diaspora américaine massive) — non transposable tel quel en France 2026."
  - "Variantes (Hamas, Hezbollah, FLN) inapplicables : proto-États ou mouvements de libération nationale, pas contestation en démocratie."
  - "L'enquête ne propose pas d'alternative contemporaine au modèle IRA."

wolves:
  - nom: "Faille métadonnées"
    argument: "En 2026, toute communication entre front légal et base clandestine laisse des traces numériques exploitables (IP, bornages, flux TRACFIN). L'art. 450-1 CP pulvérise la double structure sans exiger de preuve d'acte violent."
    reponse: "Reconnaissance partielle : le modèle IRA est pré-numérique. La question pertinente est 'quel est l'équivalent contemporain de l'étanchéité ?' — question sans réponse."
  - nom: "Chantage administratif"
    argument: "L'État n'a pas besoin de condamnation pénale : les notes blanches suffisent pour dissolution en Conseil d'État et gel des avoirs. Le front légal est une surface d'attaque élargie."
    reponse: "Partiellement neutralisé : une coordination acéphale sans personnalité juridique n'a ni siège ni comptes à geler. Mais le risque de dissolution sous LOPMI 2023 est réel."

iceberg:
  - "L'impact de l'IA prédictive sur l'étanchéité : les algorithmes de détection d'anomalies peuvent identifier des patterns de communication entre branches que les humains ne verraient pas."
  - "Mnemolite: UP (36 942 mémoires) mais API search en erreur 500 — recherche cross-séries impossible."
  - "Sujet immergé : comment les mouvements contemporains (Catalogne, Hong Kong) ont-ils tenté d'adapter le modèle double structure à l'ère numérique ?"

