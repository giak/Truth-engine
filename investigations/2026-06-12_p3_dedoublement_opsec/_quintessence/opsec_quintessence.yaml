enquete_id: "opsec"
complexity: "COMPLEX"
date_extraction: "2026-06-12"
enquete_source: "investigations/2026-06-12_p3_dedoublement_opsec/2026-06-12_12-00_double_structure_sinn_fein_ira_INVESTIGATION.md"

these_centrale: "Le modèle double structure (front légal + base clandestine) est un équilibre précaire : le front légal offre légitimité et visibilité mais expose à la surveillance, à la censure, et à la dissolution administrative. La condition critique est l'étanchéité juridique entre les deux branches — condition que la France de LOPMI 2023 et TRACFIN rend structurellement plus difficile à maintenir que dans l'Irlande pré-numérique des années 1970."

theses_implicites:
  - "Le modèle Sinn Féin/IRA est contextuellement non transposable en France 2026 — l'absence de métadonnées numériques était une condition permissive que LOPMI a supprimée."
  - "Le Broadcasting Ban britannique (1988-1994) démontre que le front légal est vulnérable à des sanctions extra-judiciaires qui ne visent pas la clandestinité mais la VISIBILITÉ."
  - "Les variantes historiques (Hamas, Hezbollah, FLN) sont inapplicables à la contestation en démocratie occidentale : ce sont des proto-États ou des mouvements de libération nationale."

faits_atomiques:
  - id: "F-opsec-001"
    enonce: "L'IRA et le Sinn Féin entretenaient une relation symbiotique : les leaders des deux branches étaient souvent les mêmes individus (Gerry Adams, Martin McGuinness). La séparation était une stratégie de gestion d'image plutôt qu'une séparation organisationnelle réelle."
    source_url: null
    source_section: "§1"
    head_status: null
    tier: 3
    glyphe: "✧"
  - id: "F-opsec-002"
    enonce: "Les supergrass trials (années 1980) ont tenté de remonter du front légal à la base clandestine via des repentis : échec partiel. La charge de la preuve (lien direct entre déclaration politique et acte criminel) était quasi impossible sans documents internes."
    source_url: null
    source_section: "§1"
    head_status: null
    tier: 3
    glyphe: "✧"
  - id: "F-opsec-003"
    enonce: "Le Royaume-Uni a interdit la diffusion médiatique du Sinn Féin de 1988 à 1994 (Broadcasting Ban) : le front légal est vulnérable à des sanctions extra-judiciaires. Les propos ne pouvaient être diffusés que lus par des acteurs."
    source_url: null
    source_section: "§2"
    head_status: null
    tier: 2
    glyphe: "✦"
  - id: "F-opsec-004"
    enonce: "Le front légal donne une adresse (sièges, bureaux, comptes bancaires) que la base clandestine n'a pas. Si le front légal faiblit, il devient le levier par lequel l'État force le mouvement à négocier ou à se dissoudre."
    source_url: null
    source_section: "§2"
    head_status: null
    tier: 4
    glyphe: "❧"
  - id: "F-opsec-005"
    enonce: "Le Hezbollah refuse officiellement toute distinction entre branche politique et militaire : structure unifiée. Ce modèle est plus résilient militairement mais plus vulnérable diplomatiquement (pas de front légal 'propre')."
    source_url: null
    source_section: "§3"
    head_status: null
    tier: 3
    glyphe: "✧"
  - id: "F-opsec-006"
    enonce: "Le FLN algérien a fusionné GPRA (politique) et ALN (militaire) : l'objectif était la reconnaissance étatique, pas la dissimulation. Modèle adapté aux guerres de décolonisation, pas aux démocraties."
    source_url: null
    source_section: "§3"
    head_status: null
    tier: 4
    glyphe: "❧"

