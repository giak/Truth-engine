enquete_id: "repression"
complexity: "MEDIUM"
date_extraction: "2026-06-12"
enquete_source: "investigations/2026-06-12_p3_repression_differentielle/2026-06-12_12-00_repression_differentielle_race_genre_INVESTIGATION.md"

these_centrale: "La matrice pénale française applique un multiplicateur asymétrique de risque : les racisés subissent un contrôle au faciès ×20 plus probable et des peines plus lourdes à infraction égale ; les femmes bénéficient d'une clémence relative. Le corpus, en ignorant cette asymétrie, produit des 'solutions' calibrées pour le profil le moins exposé."

theses_implicites:
  - "L'enquête confond deux matrices répressives distinctes : la BAC (délinquance de droit commun, biaisée racialement) et la DGSI/SDAT (répression politique, ciblant les réseaux indépendamment du phénotype)."
  - "Suggérer que les femmes sont 'moins ciblées' donc mieux placées pour la coordination est naïf : l'IA prédictive LOPMI ne fait pas de sentimentalisme genré."
  - "L'intersectionnalité répressive (race × genre × classe) n'est pas additive mais multiplicative : chaque strate transforme qualitativement l'expérience de la justice."

faits_atomiques:
  - id: "F-repr-001"
    enonce: "Les hommes perçus comme noirs ou arabes ont 20 fois plus de risques d'être contrôlés par la police (Défenseur des Droits, 2017 ; Conseil d'État, octobre 2023)."
    source_url: null
    source_section: "§1"
    head_status: null
    tier: 1
    glyphe: "✦"
  - id: "F-repr-002"
    enonce: "Le traitement pénal différencié : les peines sont plus lourdes pour les racisés à infraction égale via l'effet de sélection sociale (absence d'emploi, logement stable, garanties de représentation)."
    source_url: null
    source_section: "§1"
    head_status: null
    tier: 2
    glyphe: "✧"
  - id: "F-repr-003"
    enonce: "Les femmes bénéficient de peines moins lourdes et de plus de mesures alternatives via le stéréotype de la maternalisation (Ministère de la Justice)."
    source_url: null
    source_section: "§2"
    head_status: null
    tier: 1
    glyphe: "✦"
  - id: "F-repr-004"
    enonce: "La clémence genrée est une arme à double tranchant : elle protège les femmes mais rend la coordination féminine invisible comme actrice politique."
    source_url: null
    source_section: "§2"
    head_status: null
    tier: 4
    glyphe: "❧"
  - id: "F-repr-005"
    enonce: "Le cumul race + genre + classe crée un multiplicateur de risque pénal multiplicatif, pas additif. Le jeune homme racisé sans emploi est la cible privilégiée du système."
    source_url: null
    source_section: "§3"
    head_status: null
    tier: 4
    glyphe: "❧"
  - id: "F-repr-006"
    enonce: "La répression des émeutes 2023 (post-Nahel) vs Gilets Jaunes montre une asymétrie : violence physique pour les mouvements blancs 'légitimes', procédure expéditive pour les mouvements racisés 'menaçants'."
    source_url: null
    source_section: "§3"
    head_status: null
    tier: 4
    glyphe: "❧"

