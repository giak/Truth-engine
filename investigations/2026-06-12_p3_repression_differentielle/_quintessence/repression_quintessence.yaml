causalites:
  - cause: "F-repr-001"
    effet: "F-repr-005"
    mecanisme: "Le contrôle au faciès est la porte d'entrée vers la machine pénale. Chaque contrôle découverte (téléphone, carnet, connexion militante) peut déclencher une procédure, indépendamment de la qualification finale (droit commun ou terroriste)."
  - cause: "F-repr-003"
    effet: "F-repr-004"
    mecanisme: "La clémence genrée protège pénalement mais invisibilise politiquement — les femmes sont sous-représentées comme actrices politiques dans le corpus parce que le système les traite comme 'moins dangereuses'."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "La matrice pénale est structurellement raciste et genrée : les données (Défenseur des Droits, OIP) l'établissent. Ignorer cette asymétrie rend le corpus inutilisable pour les populations les plus exposées."
  - position: "Antithèse"
    argument: "L'enquête confond BAC (délinquance de rue) et DGSI (répression politique). L'appareil anti-terroriste cible les réseaux, pas les phénotypes. Tarnac (blancs, CSP+) l'a démontré."
  - position: "Synthèse"
    argument: "Les deux matrices sont distinctes mais connectées : le contrôle au faciès est la porte d'entrée vers la machine pénale, même si la qualification finale est politique. L'asymétrie est réelle au premier contact, pas nécessairement à la condamnation finale."

limites:
  - "Données sur le traitement pénal différencié agrégées — pas d'accès aux données individuelles du casier judiciaire."
  - "Intersectionnalité absente du droit français : l'analyse est sociologique, pas juridique."
  - "Comparaison GJ vs émeutes 2023 qualitative — pas d'étude comparative systématique disponible."
  - "Confusion non résolue entre matrice BAC (droit commun) et matrice DGSI (répression politique)."

wolves:
  - nom: "Fausse équivalence BAC/DGSI"
    argument: "L'enquête analyse le contrôle au faciès (BAC) et l'applique à la répression politique (DGSI). L'appareil anti-terroriste cible les réseaux et l'intention, pas les phénotypes. Tarnac (blancs, CSP+) = 10 ans de procédure sans privilège blanc."
    reponse: "Partiellement recevable : l'enquête aurait dû distinguer plus clairement les deux matrices. Mais la sur-exposition au premier contact policier reste un multiplicateur de risque pour toute forme d'action, politique incluse."
  - nom: "Leurre opérationnel"
    argument: "Suggérer que les profils 'moins ciblés par la BAC' devraient mener la coordination les expose à la machine anti-terroriste sans préparation — ils deviennent PLUS vulnérables, pas moins."
    reponse: "Recevable. L'enquête n'a pas suffisamment problématisé les risques spécifiques de l'exposition des profils 'protégés' à la machine anti-terroriste."

iceberg:
  - "L'impact de l'IA prédictive LOPMI sur la détection genrée : les algorithmes ne font pas de sentimentalisme mais peuvent reproduire des biais statistiques de la base d'entraînement."
  - "Mnemolite: UP (36 942 mémoires) mais API search en erreur 500 — recherche cross-séries impossible."
  - "Sujet immergé : la DGSI recrute-t-elle des informateurs différemment selon le profil ethnique ou genré ?"

