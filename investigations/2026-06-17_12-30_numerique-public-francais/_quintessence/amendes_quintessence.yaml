enquete_id: "amendes"
enquete_source: "2026-06-17_15-00_amendes-cnil-circulaires-comptables-etat_INVESTIGATION.md"
date_extraction: 2026-06-17
complexity: "APEX"

these_centrale: "Le systeme des amendes CNIL est une 'sanction sans consequence' : architecture deliberee pour donner l'apparence de l'action repressive sans aucun benefice pour les victimes ni effet dissuasif reel. L'argent des amendes est une recette fiscale deguisee. L'inefficacite est une caracteristique, pas un bug."

theses_implicites:
  - "Le rejet des amendements senatoriaux de 2018 (COM-10, COM-11, COM-34) prouve que l'Etat a deliberement choisi un systeme inefficace - l'argument de la LOLF etait un pretexte juridique"
  - "Le modele espagnol (AEPD garde 100% des amendes) prouve qu'un cercle vertueux est possible et que le choix francais est politique, pas technique"
  - "L'exemption des ministeres (art. 32 loi 78-17) protege les vrais responsables des fuites : le vrai decideur n'est jamais sanctionne"

