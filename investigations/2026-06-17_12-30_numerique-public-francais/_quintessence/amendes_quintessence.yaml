causalites:
  - cause: "Flechage des amendes rejete par le Gouvernement en 2018 malgre le vote du Senat"
    effet: "Maintien du circuit actuel : amendes -> budget general -> 0€ aux victimes, 0€ a la CNIL"
    confiance: Haute
  - cause: "Exemption des ministeres (art. 32 loi 78-17)"
    effet: "Les vrais decideurs des fuites ne sont jamais sanctionnes financierement"
    confiance: Haute
  - cause: "Sanctions des EPA (France Travail, ANTS) puisees dans leur budget de fonctionnement"
    effet: "Le contribuable paie deux fois : il finance l'administration et la sanction de cette meme administration"
    confiance: Haute
  - cause: "Absence de publication du taux de recouvrement specifique des amendes CNIL"
    effet: "Impossibilite de savoir si les 487M€ annonces sont reellement collectes (hypothese : 17-50% reel)"
    confiance: Moyenne

perspectives_dialectiques:
  - perspective: "Officielle"
    resume: "Les amendes vont au budget general pour eviter tout conflit d'interets. Si la CNIL gardait l'argent, elle serait tentee de sanctionner plus. Le budget general garantit la neutralite. L'argent finance les services publics. Google, Shein, Free ont paye - la dissuasion existe."
    validite_partielle: "L'argument de l'independance de la CNIL est legitime. Les sanctions existent et sont mediatisees."
    limite: "Ignore que le Senat proposait un fonds independant (pas la CNIL), que les 487M€ disparaissent sans tracabilite, que les ministeres sont proteges."
  - perspective: "Critique"
    resume: "L'argument du conflit d'interets est un pretexte. Le Senat a propose un fonds independant - rejete. 487M€ disparaissent dans le budget general. Aucune tracabilite. Aucun benefice pour les victimes. Les ministeres sont proteges. Le systeme est concu POUR etre inefficace."
    validite_partielle: "Les faits de rejet du flechage, de non-tracabilite et d'exemption des ministeres sont documents."
    limite: "Ignore que certains pays (comme la France) ont des contraintes constitutionnelles et budgetaires reelles, meme si contournables."
  - perspective: "Triangulation"
    resume: "Les deux perspectives contiennent du vrai. L'independance de la CNIL est un argument legitime (P1) MAIS l'histoire legislative de 2018 prouve que le Gouvernement a rejete toute espece de flechage - meme un fonds independant. Donc le motif reel n'est pas l'independance. La seule explication coherente : l'Etat ne veut pas d'un systeme ou les victimes sont indemnisées, car il serait le premier debiteur."
    validite_partielle: "Synthese robuste : le motif officiel (LOLF) contredit par l'existence de comptes d'affectation speciale, le modele espagnol existant, et l'absence de debat depuis 2018."

limites:
  - "Absence de donnee primaire : aucun rapport sur l'utilisation des amendes CNIL n'existe"
  - "Biais source : sources majoritairement CNIL + presse specialisee, pas d'acces aux comptes DGFiP"
  - "Biais chronologique : focus 2018-2026, pas d'analyse de la loi de 1978 originale"
  - "Pas de donnee comparative exhaustive centralisee sur les destinations des amendes europeennes"
  - "La conclusion que le rejet des amendements est 'delibere pour proteger l'Etat' est une inference, pas un fait"
  - "Pas d'acces au detail de l'utilisation des 487M€ dans le budget general (noye dans 500 Mds€)"

