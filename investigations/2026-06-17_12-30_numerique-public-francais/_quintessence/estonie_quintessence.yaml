acteurs:
  - nom: "RIA (Estonian Information System Authority)"
    role: "Agence exécutive unique combinant cybersécurité, infra IT et supervision des SI. 49 M€ budget, 307 agents. Pouvoir de sanction"
    faits_lies: ["F-EST-013"]
  - nom: "NIIS"
    role: "Nordic Institute for Interoperability Solutions. Gère le développement de x-Road (open source, MIT). Budget annuel 1,5-2 M€"
    faits_lies: ["F-EST-002"]
  - nom: "Riigikontroll"
    role: "Cour des comptes estonienne. Confirme l'absence de vue centrale des dépenses IT"
    faits_lies: ["F-EST-025"]
  - nom: "DINUM"
    role: "DSI interministérielle française, rôle de conseil sans pouvoir exécutif. Peine à être la DSI de l'État (Cour des comptes)"
    faits_lies: ["F-EST-016"]

causalites:
  - cause: "F-EST-013"
    effet: "F-EST-001"
    mecanisme: "L'agence unique RIA combine cybersécurité, infrastructure et supervision avec pouvoir exécutif → capacité à imposer x-Road et le principe 'once-only' à toutes les administrations → 100% digital"
  - cause: "F-EST-007"
    effet: "F-EST-006"
    mecanisme: "L'investissement IT par habitant 2,5-3x plus élevé en Estonie qu'en France (188€ vs 66€) n'explique pas seul l'écart - la gouvernance et l'architecture sont les vrais facteurs"
  - cause: "F-EST-016"
    effet: "F-EST-025"
    mecanisme: "L'absence de vue centrale des dépenses IT (constat commun aux deux pays) empêche le pilotage rationalisé et permet la dérive des grands projets français"

perspectives_dialectiques:
  - position: "Thèse (Modèle estonien comme idéal)"
    argument: "L'Estonie prouve qu'un petit État peut construire un numérique public efficace, économique et souverain en 20 ans. La France doit s'inspirer de x-Road, de l'agence unique et du principe 'once-only'."
  - position: "Antithèse (Limites structurelles)"
    argument: "L'Estonie n'est pas transposable : 1,37 M d'habitants sans legacy administratif, régime autoritaire numérique, dépendance à l'eID unique. Les vulnérabilités (ROCA, monopole SK ID, absence de plan B) sont masquées par le storytelling 'e-Estonia'."
  - position: "Synthèse (Leçons ciblées)"
    argument: "L'Estonie n'est pas un modèle à copier mais un laboratoire. La France peut en tirer 3 leçons : (1) l'architecture distribuée plutôt que les hubs centraux, (2) l'agence exécutive avec pouvoir de sanction, (3) la mesure systématique des gains - sans copier l'isikukood ni le tout-numérique sans plan B."

limites:
  - "L'Estonie (1,37 M hab.) et la France (68 M hab.) ne sont pas comparables en échelle : la complexité d'un système fédéré croît avec le nombre de nœuds"
  - "L'Estonie a construit son administration from scratch après 1991, sans legacy IT. La France porte des décennies d'héritage"
  - "Les économies d'échelle déclarées (années de travail, % PIB) sont basées sur des extrapolations avec 'marge d'erreur élevée' (IBS, 2022)"
  - "L'absence de plan B physique est un risque existentiel sous-évalué dans le discours e-Estonia"

wolves:
  - nom: "e-Estonia storyteller"
    argument: "Le modèle estonien est un succès incontestable exportable à tous les pays. La France devrait adopter x-Road immédiatement."
    reponse: "L'Estonie multiple les mises en garde : sa propre Cour des comptes note l'absence de vue centrale des dépenses. La vulnérabilité ROCA (58% du parc) montre le risque de monotechnologie. La transposition à une échelle 50x n'est pas triviale."
  - nom: "Sceptique hexagonal"
    argument: "La France est trop complexe, trop grande, trop enracinée dans ses silos ministériels pour adopter un modèle estonien. Les comparaisons sont vaines."
    reponse: "Les problèmes structurels français (45 projets en dérive, absence d'interopérabilité, dépendance fournisseurs) sont précisément ceux que x-Road et une agence unique résolvent. La complexité est un argument pour la réforme, pas contre."

iceberg:
  - "Le storytelling e-Estonia masque une réalité moins glorieuse : quadruplement du budget en 10 ans, absence de vue centrale des dépenses, dépendance à IDEMIA pour les cartes"
  - "Le monopole SK ID Solutions (certificats eID) crée une dépendance privée dans un système présenté comme souverain"
  - "La France dépense autant en 3 grands projets (>9 M€) que l'Estonie pour l'ensemble de son IT public annuel"
  - "Les services de renseignement des deux pays bénéficient probablement du chaînage des données via identifiants uniques"

