enquete_id: "estonie"
complexity: "COMPLEX"
date_extraction: "2026-06-17"
enquete_source: "investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_18-45_comparaison-france-estonie-x-road-numerique-public_INVESTIGATION.md"

these_centrale: "L'Estonie (1,37 M hab., 0,60% du PIB en IT public) a réussi une transformation numérique radicale via l'architecture distribuée x-Road, tandis que la France (68 M hab., 0,16-0,18% du PIB) reste bloquée dans un modèle ministériel en silos avec 45 grands projets en dérive (dépassement 6,5%, retard 21%). L'écart n'est pas budgétaire (la France investit 2,5-3x moins par habitant que l'Estonie) mais architectural et de gouvernance : absence de couche d'interopérabilité obligatoire, pilotage DINUM sans pouvoir exécutif, dépendance aux fournisseurs non-européens."

theses_implicites:
  - "Le succès estonien est autant politique et constitutionnel (principe 'once-only', identifiant unique isikukood) que technique (x-Road)"
  - "Le quadruplement du budget IT estonien en 10 ans (66 M€ → 265,5 M€) interroge la soutenabilité du modèle, même s'il reste très inférieur au ratio français par service rendu"
  - "Les vulnérabilités du modèle estonien (dépendance eID unique, absence de plan B physique, monopole SK ID Solutions) sont le revers de sa cohérence"
  - "Le manque de vue centrale des dépenses IT est un problème commun aux deux pays - ni l'Estonie ni la France n'ont de pilotage consolidé"

