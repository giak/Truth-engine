enquete_id: "impact"
complexity: "APEX"
date_extraction: "2026-06-17"
enquete_source: "investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_17-00_impact-4-5-milliards-it-efficacite-service-public_INVESTIGATION.md"

these_centrale: "La France dépense 4 à 5 Md€ par an pour ses systèmes d'information publics sans aucune évaluation d'impact systématique. La Cour des comptes confirme que les gains de productivité sont 'l'angle mort des projets numériques de l'État'. Le FTAP (1,1 Md€) n'a généré que 339 M€ d'économies soit 0,42 € pour 1 € investi. Cette ignorance organisée profite à tous les acteurs : ESN, ministères dépensiers, et un État qui préfère ne pas savoir."

theses_implicites:
  - "L'opacité budgétaire sur les dépenses IT (aucune publication par ministère, contrairement au Royaume-Uni) est un choix politique, pas un accident technique - les référentiels comptables pourraient être adaptés"
  - "Le ratio de pilotage DINUM (1,6% du budget IT qu'elle est censée piloter) rend tout pilotage effectif impossible, ce qui sert les intérêts de l'oligopole ESN et des ministères dépensiers"
  - "L'absence d'évaluation des gains de productivité est fonctionnelle : elle empêche toute remise en cause des projets et permet à chaque acteur de maintenir ses flux budgétaires"

