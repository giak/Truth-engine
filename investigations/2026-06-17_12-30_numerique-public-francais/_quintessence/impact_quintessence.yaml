acteurs:
  - nom: "DINUM"
    role: "DSI de l'État. 79-138 M€ pour piloter 4-5 Md€. Sous-dimensionnement chronique. 5 directeurs depuis 2018"
    faits_lies: ["F-IMP-007", "F-IMP-008", "F-IMP-015"]
  - nom: "Cour des comptes"
    role: "Principale source d'audit. Rapports récurrents sur l'opacité et l'absence d'évaluation. Recommandations jamais suivies"
    faits_lies: ["F-IMP-001", "F-IMP-003", "F-IMP-007", "F-IMP-010"]
  - nom: "DITP"
    role: "Gère FTAP. Accepte projections déclaratives jamais vérifiées"
    faits_lies: ["F-IMP-003", "F-IMP-020"]
  - nom: "UK Government Digital Service"
    role: "Contre-modèle. Transparence open data, zero-based review, publication des dépenses IT par département"
    faits_lies: ["F-IMP-016"]
  - nom: "ESN (Capgemini, Sopra Steria, Atos, Accenture)"
    role: "Oligopole bénéficiaire de l'opacité. 3/4 des prestations externes IT"
    faits_lies: ["F-IMP-005"]

causalites:
  - cause: "F-IMP-015"
    effet: "F-IMP-007"
    mecanisme: "Le sous-dimensionnement de la DINUM (1,6% ratio) la rend incapable d'évaluer les gains de productivité - confirmé par la Cour des comptes sur l'absence d'analyse d'impact"
  - cause: "F-IMP-010"
    effet: "F-IMP-009"
    mecanisme: "L'opacité des dépenses IT n'est pas un accident technique mais l'absence d'une volonté politique de transparence, comme le prouve la comparaison UK"
  - cause: "F-IMP-003"
    effet: "gaspillage FTAP"
    mecanisme: "Le FTAP a dépensé 800 M€ pour générer 339 M€ d'économies (perte 461 M€). L'absence de méthode d'évaluation harmonisée a permis des projections théoriques non vérifiées"
  - cause: "F-IMP-018"
    effet: "biais de déclaration DINUM"
    mecanisme: "Les projets sortis du périmètre ne sont plus comptés comme échecs (ex: GMBI), biaisant les statistiques de surcoût et retard"

perspectives_dialectiques:
  - position: "Thèse officielle (Narrative de modernisation)"
    argument: "La France investit massivement dans la transformation numérique de l'État. 4-5 Md€ par an, 45 grands projets, un FTAP doté de 1,1 Md€. Les surcoûts baissent (6,5% contre 17,5% en 2024). La DINUM pilote."
  - position: "Antithèse (Gaspillage structurel)"
    argument: "Aucune évaluation d'impact, des économies FTAP inférieures à l'investissement, une dette technique de 1-1,5 Md€/an, l'opacité budgétaire. Les 4-5 Md€ financent principalement la maintenance de systèmes hérités et la rémunération de l'oligopole ESN."
  - position: "Synthèse (Ignorance organisée)"
    argument: "Si personne ne mesure l'impact, personne ne peut démontrer que l'argent est mal dépensé. Cette ignorance organisée profite à tous les acteurs : ESN, ministères, DINUM, Parlement. Le Royaume-Uni prouve que la transparence est possible - la France choisit de ne pas le faire."

limites:
  - "Chiffres DINUM (6,5% surcoût, 21% retard) sont des auto-évaluations - pas d'audit indépendant systématique des 45 grands projets"
  - "Estimation dette technique (1-1,5 Md€) est une fourchette haute de la Cour des comptes, pas un coût comptabilisé"
  - "Comparaison UK biaisée par différence de taille et de structure administrative (UK centralisé vs France déconcentrée)"
  - "Données prestations externes datent de 2021 - les chiffres 2024-2025 peuvent différer"

wolves:
  - nom: "L'optimiste technique"
    argument: "Le surcoût moyen baisse (17,5% à 6,5%). Les 45 grands projets avancent. La DINUM s'améliore. C'est une tendance positive qui mérite d'être encouragée."
    reponse: "Le 6,5% est un artefact qui exclut les projets sortis du périmètre. Sans évaluation d'impact indépendante, l'amélioration des indicateurs de processus ne dit rien de l'efficacité réelle."
  - nom: "Le défenseur de la souveraineté"
    argument: "La France n'est pas le Royaume-Uni. Notre modèle administratif est différent. La transparence UK est un choix culturel qui ne s'exporte pas."
    reponse: "La transparence budgétaire n'est pas une question culturelle mais technique et politique. Les outils existent (open data, comptabilité analytique). La France choisit de ne pas les utiliser."
  - nom: "Le relativiste FTAP"
    argument: "339 M€ d'économies c'est mieux que rien. Certains projets FTAP ont réussi. Le fonds a financé des transformations qui n'auraient pas eu lieu autrement."
    reponse: "Le ratio 0,42€ économisé pour 1€ investi signifie une perte nette de 461 M€. Sans audit indépendant des 'économies' déclarées, le bilan réel pourrait être pire."

iceberg:
  - "Les sorties de périmètre abusives : GMBI retiré du suivi des grands projets alors qu'il était encore en développement - le biais de déclaration DINUM est systémique"
  - "L'absence de benchmark international : la France est le seul grand pays européen à ne pas produire d'évaluation d'impact de ses dépenses IT publiques"
  - "Le paradoxe DINUM : 5 directeurs depuis 2018 - l'instabilité chronique du pilotage central est à elle seule un signal de non-priorité politique"
  - "Résultat Mnemolite: search 'budget IT état 4-5 milliards impact' → 3 mémoires"
  - "Si 1% du budget IT (40-50 M€) était redirigé vers les autorités de contrôle : CNIL doublerait ses effectifs, ANSSI triplerait ses audits"

