enquete_id: "predation"
complexity: "APEX"
date_extraction: "2026-06-17"
enquete_source: "investigations/2026-06-17_12-30_securite-informatique-etat-francais-intentionnelle_INVESTIGATION.md"

these_centrale: "Le système de sécurité informatique de l'État français est structurellement prédateur : les incitations institutionnelles sont alignées contre la sécurité réelle, produisant des fuites massives qui servent les intérêts budgétaires et politiques du complexe consulting-sécurité-État."

theses_implicites:
  - "L'absence de sanction crée une immunité de facto pour les administrations négligentes, rendant la sécurité impossible à prioriser"
  - "La réponse systématique aux crises (création d'Ariane, plans budgétaires) produit des dépenses sans correction structurelle - un pattern de 'réforme sans changement'"
  - "Les citoyens sont exposés à l'usurpation d'identité comme conséquence acceptée du fonctionnement du système, non comme anomalie"
  - "La distinction entre incompétence et intentionnalité est moins pertinente que l'identification des bénéficiaires structurels de l'insécurité"

