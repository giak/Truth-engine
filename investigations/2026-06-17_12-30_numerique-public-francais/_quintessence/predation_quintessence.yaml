    mecanisme: "La création d'Ariane plutôt que le renforcement de l'ANSSI reproduit le pattern de 'réforme sans changement' - nouvelle structure sans correction structurelle"

perspectives_dialectiques:
  - position: "Thèse officielle (Narrative d'État)"
    argument: "Les cyberattaques sont des accidents inévitables dans un contexte de menace mondiale croissante. L'État répond par des mesures immédiates (restriction d'accès, notification CNIL). La solution est technique et administrative : plus de budget, nouvelle autorité (Ariane)."
  - position: "Antithèse (Intentionnalité)"
    argument: "L'insécurité informatique est fonctionnelle : elle justifie des budgets croissants détournés via cabinets conseil, conditionne les citoyens à l'exposition de leurs données, offre un prétexte à la surveillance de masse. Le non-usage du pouvoir de sanction, l'absence de correction de failles connues depuis 19 ans, l'impunité - tout converge vers un système qui bénéficie de l'insécurité."
  - position: "Synthèse (Analyse forensique)"
    argument: "Négligence structurelle aux effets convergents, pas complot centralisé. Les ministères ne sont pas sanctionnés, l'ANSSI dépend politiquement de ceux qu'elle contrôle, les cabinets profitent de l'insécurité qu'ils ne résolvent pas. Le système n'a pas besoin d'être intentionnel pour être prédateur : les incitations sont alignées contre la sécurité."

limites:
  - "Absence de preuve directe d'intentionnalité : aucun document (note, mail) ne prouve une décision explicite de laisser les systèmes vulnérables"
  - "Biais de disponibilité : les fuites récentes (2026) sont surreprésentées, le pattern a pu être différent par le passé"
  - "Données budgétaires réelles partielles : budgets cybersécurité difficiles à tracer entre dédié et mutualisé"
  - "Comparaison internationale absente : pas de benchmark systématique avec Estonie, Finlande, Danemark"
  - "L'ANSSI comme bouc émissaire : Ariane peut être une réponse politique mais aussi une réponse rationnelle à un problème réel de gouvernance"

wolves:
  - nom: "Défenseur du statu quo"
    argument: "Les fuites sont la conséquence inévitable de la numérisation et de la sophistication des attaquants. Aucun pays n'est à l'abri. La France fait mieux que la moyenne européenne."
    reponse: "Les failles élémentaires (IDOR 2007 non corrigée, API non sécurisées) contredisent l'argument de sophistication. Des pays comparables (Estonie, Finlande) ont des taux d'incidents bien inférieurs."
  - nom: "Relativiste technique"
    argument: "Sécuriser des milliers de SI interconnectés est objectivement difficile. L'ANSSI fait ce qu'elle peut avec ses moyens. 50 audits/an est un maximum réaliste."
    reponse: "La question n'est pas le nombre absolu d'audits mais l'absence de corrélation entre l'augmentation des budgets et l'amélioration de la sécurité. Le budget ANSSI est passé de 80 M€ à 136 M€ sans baisse des incidents."
  - nom: "Critique du framework d'enquête"
    argument: "L'enquête confond incompétence et intention. La thèse de 'prédation structurelle' est une construction rhétorique qui prête au système une cohérence qu'il n'a pas."
    reponse: "L'enquête conclut explicitement à une prédation structurelle sans intention consciente (8/10), pas à un complot centralisé (3/10). La distinction entre incompétence et prédation est documentée au §11."

iceberg:
  - "La surveillance de masse comme objectif politique non-dit : les systèmes vulnérables facilitent l'accès aux données citoyennes par les services de renseignement"
  - "Le rôle des GAFAM dans l'hébergement des données sensibles françaises (Health Data Hub sur Azure 2019-2026, Cloud Act américain)"
  - "Résultat Mnemolite: search 'sécurité informatique État français ANSSI prédation' → 5 mémoires trouvées (ea915e71, 2da2a197, 3cf3395c, ba1542f0, 2e6bf2ad). L'ADVENDA (2da2a197) confirme et étend avec 15 faits supplémentaires."
  - "La formation des élites (X, Mines, ENA) comme filtre produisant un entre-soi incapable de critique systémique"

