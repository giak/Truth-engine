causalites:
  - cause: "Sous-financement chronique de la CNIL (30M€ pour 67M d'habitants)"
    effet: "Delais de traitement de 6 a 18 mois, saturation, classement sans suite de 60% des plaintes"
    confiance: Haute
  - cause: "Architecture individuelle des recours (Art. 82 RGPD)"
    effet: "Seuls les citoyens avertis avec avocat (2000-5000€) peuvent obtenir indemnisation"
    confiance: Haute
  - cause: "Action de groupe structurellement inefficace (2 jugements de responsabilite en 10 ans)"
    effet: "Aucune dissuasion collective, aucun effet de masse sur les violations massives"
    confiance: Haute
  - cause: "Absence de donnees sur l'indemnisation reelle des victimes"
    effet: "Impossibilite d'evaluer et de reformer le systeme sur des bases factuelles"
    confiance: Moyenne

perspectives_dialectiques:
  - perspective: "Officielle"
    resume: "La France dispose d'un des cadres de protection des donnees les plus robustes au monde. RGPD, CNIL, action de groupe reformee en 2025. 487M€ d'amendes en 2025. Plainte CNIL gratuite en ligne."
    validite_partielle: "Le cadre legal existe effectivement et la CNIL est active (83 sanctions). Les recours sont documentés."
    limite: "Ignore que 487M€ d'amendes = 0€ pour les victimes, que l'action de groupe est quasi-morte, que la CNIL est sous-financée."
  - perspective: "Critique"
    resume: "Le systeme est une illusion. CNIL sous-financee, action de groupe impossible, administrations jamais sanctionnees. Le vrai recours est technique (chiffrement, VPN)."
    validite_partielle: "Les faits de sous-financement, d'inefficacite de l'action de groupe et d'impunite des administrations sont verifies."
    limite: "Ignore que le cadre legal offre des voies de recours formelles qui peuvent fonctionner pour certains plaignants determines et aises."
  - perspective: "Triangulation"
    resume: "Le cadre legal existe MAIS son application est structurellement defaillante. Les donnees manquantes (taux d'indemnisation reel) empechent une conclusion definitive. 487M€ d'amendes = 0€ reverse aux victimes. 43M victimes France Travail = 0.12€/personne de sanction."
    validite_partielle: "Synthese des deux lectures : les recours existent sur le papier (P1) mais echouent structurellement (P2). Les donnees disponibles confirment les deux lectures partielles."

limites:
  - "Absence de donnees fiables sur le nombre de victimes indemnisées via Art. 82 RGPD (donnee non collectee)"
  - "Absence d'enquete de terrain aupres des plaignants (cout humain non mesure)"
  - "Biais mediatique : sources majoritairement CNIL + presse specialisee (Le Monde Pixels, La Croix, Silicon)"
  - "Biais temporel : focus 2024-2026, perspective historique courte"
  - "Pas d'acces aux decisions CNIL non publiees"
  - "Exclusion des recours penaux et des recours CEDH"
  - "L'estimation de 5% d'efficacite est une inference, pas un fait verifie"

wolves:
  - "Avocats spécialisés RGPD (+30% d'activite estime 2024-2026)"
  - "Assureurs cyber (primes qui explosent, benefices records)"
  - "Cabinets de conseil en conformite RGPD"
  - "GAFAM (amendes CNIL = cost of doing business)"
  - "L'Etat budgetairement (les 487M€ d'amendes vont au budget general)"

