enquete_id: "systeme"
enquete_source: "2026-06-17_15-45_systeme-it-etat-francais-chaine-complete_INVESTIGATION.md"
date_extraction: 2026-06-17
complexity: "APEX"

these_centrale: "Le systeme IT de l'Etat francais est sous-traite a un oligopole d'ESN privees (Capgemini, Sopra Steria, Atos, Accenture) qui captent l'essentiel des 4-5 Mds€ annuels. Les organes de controle (DINUM, ANSSI) sont structurellement sous-dimensionnes. Le pantouflage et la porosite public-prive verrouillent le systeme. Les alertes recurrentes de la Cour des Comptes depuis 2015 n'ont jamais ete suivies d'effets structurels."

theses_implicites:
  - "L'Etat a structurellement renonce a maitriser son SI : la sous-traitance n'est pas une solution temporaire mais un abandon definitif de competence. Revenir en arriere couterait 5-10 ans et des milliards"
  - "Le pantouflage cree une communaute d'interets entre decideurs publics et ESN : ceux qui ecrivent les appels d'offres seront demain chez ceux qui y repondent"
  - "La 'souverainete numerique' francaise est un cadre vide : donnees de sante sur Azure, cloud 'de confiance' Bleu est une coentreprise avec Microsoft, Chorus est chez SAP"

