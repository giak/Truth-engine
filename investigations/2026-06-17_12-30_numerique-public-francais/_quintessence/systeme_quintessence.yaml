causalites:
  - cause: "Sous-dimensionnement chronique de la DINUM (79M€ pour 5 Mds€ de SI)"
    effet: "Impossibilite structurelle de controler les projets IT des ministeres, 'politique de l'evitement' generalisee"
    confiance: Haute
  - cause: "Capacite d'audit ANSSI derisoire (32 audits/an) et pouvoir de sanction jamais utilise"
    effet: "La securite du SI Etat est largement non-auditee, les vulnerabilites persistent"
    confiance: Haute
  - cause: "Pantouflage massif (29% mines, 22% ENA) et allers-retours public-prive"
    effet: "Dependance cognitive : les decideurs publics savent qu'ils travailleront pour les ESN demain"
    confiance: Moyenne
  - cause: "Contrats ESN longs (4-8 ans) sans transfert de competence"
    effet: "Dependance technique irreversible : seul le prestataire sortant peut maintenir le systeme"
    confiance: Haute
  - cause: "Donnees sensibles hebergees chez fournisseurs soumis au Cloud Act (Microsoft Azure pour HDH 7 ans)"
    effet: "Donnees de sante de 67M Francais potentiellement accessibles aux autorites americaines"
    confiance: Haute

perspectives_dialectiques:
  - perspective: "Officielle"
    resume: "La transformation numerique de l'Etat est en marche. DINUM pilote la strategie 'Cloud au centre'. 84M€ cloud europeen en 2025 (+62%). 99% des commandes cloud vers fournisseurs europeens. 45 grands projets suivis avec ecart budgetaire reduit a 6.5%. HDH migre vers Scaleway. ANSSI reconnue internationalement."
    validite_partielle: "La doctrine 'Cloud au centre' existe, les ecarts budgetaires se reduisent, HDH quitte effectivement Azure."
    limite: "Ignore que 84M€ cloud est infime face aux 5 Mds€ totaux, que 21% de retard reste enorme, que 32 audits/an est derisoire."
  - perspective: "Critique"
    resume: "5 Mds€/an gaspilles dans un systeme verrouille par les ESN. Capgemini 1.1 Md€ en 5 ans. ANSSI 32 audits/an. Ministeres contournent la DINUM. Donnees sensibles chez Microsoft. Pantouflage verrouille le systeme. McKinsey : 0€ IS. Le 'Cloud de confiance' Bleu est une coentreprise avec Microsoft."
    validite_partielle: "Tous les faits invoques sont verifies par des sources multiples (CdC, Senat, Le Monde)."
    limite: "Ignore que la transformation est reelle sur certains perimetres (Chorus S/4HANA reussi, cloud DINUM en croissance)."
  - perspective: "Triangulation"
    resume: "Les deux perspectives contiennent du vrai. La doctrine 'Cloud au centre' existe (P1) mais son budget (84M€) est infime face aux 5 Mds€ totaux (P2). DINUM a reduit les ecarts budgetaires (P1) mais 21% de retard reste enorme (P2). ANSSI est reconnue (P1) mais 32 audits/an est derisoire (P2). La verite : le systeme est en transition, mais la dependance aux ESN et au cloud US est structurelle, pas conjoncturelle."
    validite_partielle: "Synthese equilibree : transformation partielle dans un cadre de dependance structurelle. Les faits des deux lectures sont verifies."

limites:
  - "Absence de donnee primaire centralisee : la France ne publie pas de 'digital budget' agrege. Les 4-5 Mds€ sont une estimation."
  - "Biais de disponibilite : les donnees sur les contrats sont partielles (macellum.fr, openprocurements)"
  - "Pas d'acces aux contrats : analyse basee sur les marches notifies, pas sur les avenants"
  - "Conjecture sur le pantouflage : impact precis sur les decisions d'achat public non quantifiable"
  - "Biais temporel : focus 2017-2026, pas d'analyse de la sous-traitance pre-2017"
  - "Exclusion du SI defense et renseignement (classifie)"

