  - id: "OBS-008"
    enonce: "Convergence DPAs-DPAs-matrice : les 2 enqu-tes europ-ennes confirment que le sous-financement des autorit-s de protection des donn-es est un ph-nom-ne europ-en structurel, pas fran-ais isol-. 22/27 DPAs en budget g-n-ral pur. Gr-ce : seul pays UE ayant r-duit (pas augment-) le budget DPA. Autriche DSB en 'Notbetrieb' (budget 5,9 M€). DPAs Europe centrale < 2 M€. La Commission europ-enne tol-re la violation de l'article 52.4 GDPR (ind-pendance budg-taire) sans proc-dure d'infraction. NOYB et epicenter.works ont port- plainte en 2025."
