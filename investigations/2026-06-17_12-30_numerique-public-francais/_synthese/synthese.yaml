  - titre: "THESE-003 : Porte tournante tat-ESN — pantouflage institutionnalis- sans contr-le"
    enonce: "12 directeurs/anciens directeurs de DINUM, ANSSI, DITP (2016-2026) ont transit- entre r-gulation et prestation. 34 faits documentent cette porosit-. Cas cl-s : Guillaume Poupard (DG ANSSI 2014-2022, d-finit les crit-res SecNumCloud) recrut- par Docaposte (2023) puis board Sekoia.io (2024) puis Orange (2025). douard Philippe nomm- administrateur Atos 3 mois apr-s Matignon. C-dric O bloqu- par la HATVP pour Atos puis pour cr-ation d'entreprise de conseil — double blocage in-dit. Nathalie Kosciusko-Morizet directrice Capgemini US (cloud/cyber, 2018-2025). Fran-ois Braun consultant Capgemini Monaco (2024-) autoris- par HATVP. La HATVP est un filtre d-coratif : 74,3 % d'avis compatibles avec r-serves, 4,5 % d'incompatibilit-, 0 suivi des r-serves. 57 dossiers transmis au parquet en 2025 (record) — sanctions r-elles inexistantes. Le r-tro-pantouflage (priv- - public) est plus massif encore : 3 directeurs DITP/DINUM sur 5 viennent du priv-, dont Nadi Bou Hanna (ex-Capgemini, ex-Atoz, consultant priv- avant DINUM)."
