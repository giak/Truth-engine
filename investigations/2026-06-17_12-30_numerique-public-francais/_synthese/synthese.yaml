    coherence_interne: "Convergence parfaite entre les 3 enqu-tes : les faits de s-curit- (predation 14 faits) confirment l'absence de sanction que l'analyse budg-taire (impact) explique par le sous-dimensionnement, que la description du syst-me IT (systeme) replace dans la cha-ne compl-te. Le shadow factor -lev- (8,2) tient - la profondeur des donn-es (34 faits combin-s) mais ne peut -tre 10 car l'intentionnalit- n'est pas prouv-e — la pr-dation est structurelle, pas consciemment organis-e."

  - titre: "THESE-002 : Captation ESN — oligopole, rente et verrouillage technique"
    enonce: "5 ESN (Capgemini ~1,7 Md€/52 %, Atos ~500 M€/15 %, Sopra Steria ~430 M€/13 %, Accenture ~350 M€/11 %, McKinsey ~100 M€/3 %) captent 94 % du march- IT public, soit ~3,08 Md€ sur 2017-2025. Ce n'est pas un march- concurrentiel mais un oligopole structurel : contrat Cassiop-e Justice (60 M€) a re-u une seule offre, 20 cabinets = 55 % du conseil aux minist-res. Le verrouillage est triple : technique (Chorus/SAP propri-taire, Health Data Hub sur Azure, Cloud Bleu coentreprise Microsoft), contractuel (march-s pluriannuels sans clause de sortie, 250+ contrats Capgemini) et cognitif (perte de comp-tence interne document-e par la Cour des Comptes depuis 2015). Le surco-t vs r-gie est de 85-100 % (300-450 M€/an). La dette technique aggrav-e par l'externalisation co-te 1-1,5 Md€/an. Les alertes r-currentes de la Cour des Comptes, du S-nat et de l'IGF/CGE depuis 2015 n'ont jamais -t- suivies d'effets."
    f_atomiques_justificatifs:
      - "F-MPC-001"    # Capgemini 1,7 Md€
      - "F-MPC-002"    # 5 ESN 94 % du march-
      - "F-MPC-003"    # D-penses conseil 379 M€ (2018) - 894 M€ (2021)
      - "F-MPC-004"    # McKinsey 0 IS France 2011-2020
      - "F-MPC-006"    # 20 cabinets = 55 % conseil
