  - titre: "THESE-005 : Sous-investissement chronique sans pilotage ni -valuation"
    enonce: "La France investit 2,5-3x moins que l'Estonie dans l'IT public : ~60-74 €/hab (0,16-0,18 % du PIB) contre 188 €/hab (0,60 % du PIB). La DINUM (79-138 M€) ne p-se que 1,6 % du budget IT qu'elle est cens-e piloter. Aucune comptabilit- analytique fiable n'existe — personne ne sait exactement combien chaque minist-re d-pense en IT. Aucune -valuation d'impact des 4-5 Md€ annuels n'est produite : le Royaume-Uni publie un breakdown d-taill- par d-partement, la France ne le fait pas. Le FTAP (Fonds pour la Transformation de l'Action Publique, 1,1 Md€) affiche un ratio co-t/b-n-fice de 0,42 € pour 1 € investi, soit une perte nette de 461 M€ sur les 800 M€ consomm-s. Les 339 M€ d'-conomies d-clar-es par la DINUM n'ont pas -t- auditi-es ind-pendamment. L'Estonie prouve qu'un contre-mod-le existe : 1,37 M d'habitants, 100 % services en ligne, x-Road open source (295 M requ-tes/mois, 97 % machine-to-machine, 2 611 jours sans interruption), RIA qui combine cyber+infra+supervision (budget 49 M€, 307 agents)."
    f_atomiques_justificatifs:
      - "F-EST-001"    # Estonie 100 % services publics en ligne
      - "F-EST-002"    # x-Road 295 M requ-tes/mois, 97 % M2M
