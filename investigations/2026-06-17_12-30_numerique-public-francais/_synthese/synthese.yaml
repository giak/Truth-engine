      - "F-EST-004"    # Budget IT estonien doubl- : 123 M€ (2019) - 257 M€ (2024)
      - "F-EST-005"    # Budget agences IT quadrupl- : 66 M€ - 265,5 M€
      - "F-EST-006"    # France 60-74 €/hab vs Estonie 188 €/hab
      - "F-EST-007"    # France 0,16-0,18 % PIB vs Estonie 0,60 %
      - "F-EST-011"    # ROCA 2017 : 800 000 eID vuln-rables, migration ECC en 2 semaines
      - "F-EST-013"    # RIA combine cyber (49 M€) + infra + supervision
      - "F-EST-016"    # 45 projets > 9 M€ suivis DINUM
      - "F-IMP-001"    # Aucune -valuation d'impact
      - "F-IMP-003"    # FTAP 1,1 Md€ dot-, 800 M€ consomm-s
      - "F-IMP-004"    # FTAP ratio 0,42 : perte nette 461 M€
      - "F-IMP-005"    # conomies FTAP 339 M€ non auditi-es
      - "F-IMP-006"    # 80 % projets FTAP < 200 000 € (saupoudrage)
      - "F-IMP-007"    # DINUM 1,6 % du budget pilot-
      - "F-IMP-008"    # 5 directeurs DINUM en 8 ans
      - "F-IMP-010"    # Pas de m-thode d'-valuation harmonis-e
      - "F-IMP-013"    # UK publie breakdown par d-partement
      - "F-IMP-015"    # 1 agent DINUM pour 3 000 agents IT
      - "F-IMP-016"    # UK Transformation Fund £3,25 Md
      - "F-IMP-018"    # Biais de d-claration DINUM (sorties de p-rim-tre)
      - "F-IMP-019"    # 80 % programmes UK sans m-triques de r-sultat
      - "F-IMP-020"    # FTAP absence de groupe t-moin
      - "F311"         # DINUM 79 M€ - 5 Md€ = 1,6 %
      - "F-COUT-018"   # FranceConnect : succ-s de la r-gie
    fiches_concernees: ["estonie", "impact", "cout"]
    shadow: 6.0
    etendue: 3
    coherence_interne: "Les donn-es de comparaison (estonie) sont robustes et l'-cart France-Estonie (2,5-3x) est calcul- par habitant ET en % PIB. L'absence de pilotage (impact) et le manque de comptabilit- (cout) convergent. Le shadow factor est mod-r- (6,0) car la comparaison Estonie-France est pertinente mais la diff-rence de taille (x50 population) limite la g-n-ralisation directe."

