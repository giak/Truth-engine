sujet_majoritaire: "Le syst-me IT de l'-tat fran-ais est un m-canisme de pr-dation structurelle o- un oligopole de 5 ESN (Capgemini 52 %, Atos 15 %, Sopra Steria 13 %, Accenture 11 %, McKinsey 3 %) capte 94 % des 4-5 Md€/an de d-penses IT publiques sans -valuation d'impact, o- la CNIL inflige 487 M€ d'amendes qui ne servent - rien (0 € aux victimes, 0 € - la pr-vention), o- 237 faits atomiques documentent un syst-me de s-curit- qui produit 17 802 violations/an sans sanction, et o- le pantouflage institutionnalis- de 12 directeurs DINUM/ANSSI/DITP verrouille l'ensemble dans un -quilibre stable dont aucun acteur n'a int-r-t - sortir. La boucle est comptablement ferm-e : les fuites produisent des amendes qui vont au budget g-n-ral qui sous-finance la CNIL et l'ANSSI qui auraient d- les emp-cher, tandis que les ESN encaissent les march-s pay-s par le m-me budget g-n-ral."

theses_cardinales:
  - titre: "THESE-001 : Architecture de pr-dation structurelle — incitations align-es contre la s-curit-"
    enonce: "14 fuites massives document-es (2025-2026) suivent un pattern identique : faille -l-mentaire connue non corrig-e, absence de sanction, r-ponse budg-taire sans correction structurelle. L'ANSSI (20 audits/an pour des milliers de SI, pouvoir de sanction jamais utilis- contre une administration depuis sa cr-ation) est structurellement incapable de pr-venir. La DINUM (79-138 M€ pour piloter 4-5 Md€ = 1,6 %) est sous-dimensionn-e. 17 802 violations de donn-es en 2025 (+10 %). Taux de sanction des administrations : 0 %. Le pattern 'r-forme sans changement' est document- : plan cybers-curit- 1 Md€ (2021) sans baisse des fuites, cr-ation d'Ariane (mai 2026) comme -ni-me -pisode sans renforcement des contr-les existants."
