transversalites:
  - id: "TR-001"
    concept: "Architecture d'illusion"
    description: "Pattern transversal dominant (10/14 fiches). Le syst-me produit l'apparence de l'action r-gulatrice (ANSSI audite, CNIL sanctionne, DINUM pilote, HATVP contr-le, LOLF encadre) sans effet r-el. Chaque m-canisme existe formellement mais est structurellement sous-dimensionn- ou contourn-, cr-ant un 'filet de s-curit- en papier' qui donne l'illusion d'une protection sans en offrir la r-alit-."
    fiches_concernees: ["predation", "amendes", "recours", "lolf", "dpas", "dpas-matrice", "systeme", "impact", "projets", "reseau", "carto"]
    faits_communs: ["F-pred-006", "F-pred-005", "F201", "F206", "F-RES-009", "F-REC-110", "F-IMP-001", "F-DPA-102", "F-DPA-113"]
    metrique_clef: "ANSSI : 0 sanctions sur 0 administrations en X ann-es. HATVP : 74,3 % avis sans force. CNIL : 0 € aux victimes. DINUM : 1,6 % de ratio de pilotage. Action de groupe : 2 jugements en 10 ans."

  - id: "TR-002"
    concept: "Circulaire comptable ferm-e"
    description: "Pattern pr-sent dans 8/14 fiches. L'argent circule en boucle ferm-e : les amendes CNIL (487 M€/2025) vont au budget g-n-ral qui sous-finance la CNIL (30 M€), l'ANSSI (136 M€) et la DINUM (79-138 M€) — soit les 3 agences qui devraient pr-venir les fuites. Les ESN encaissent 3,2 Md€ de march-s IT pay-s par le m-me budget g-n-ral. Les hauts fonctionnaires qui -crivent les appels d'offres passeront demain chez les ESN qui y r-pondent. Aucun acteur n'a int-r-t - briser le cycle."
    fiches_concernees: ["amendes", "lolf", "predation", "recours", "dpas", "cout", "marches", "systeme"]
    faits_communs: ["F201", "F202", "F203", "F206", "F-MPC-001", "F-MPC-002", "F-COUT-001", "F-pred-005", "F-pred-006"]
    boucle_comptable: "Fuites de donn-es -> Amendes CNIL (487 M€) -> Budget g-n-ral -> Sous-financement ANSSI/CNIL/DINUM -> Plus de fuites. Co-t : 0 € pour les d-cideurs. B-n-fice net pour l'-tat : 487 M€ - 30 M€ (CNIL) - 136 M€ (ANSSI) = +321 M€/an."

  - id: "TR-003"
    concept: "Ignorance organis-e"
    description: "Pr-sent dans 9/14 fiches. L'absence syst-matique de donn-es cl-s emp-che toute r-forme factuelle. Pas de donn-es sur l'indemnisation des victimes de fuites (recours). Pas d'-valuation d'impact des 4-5 Md€ (impact). Pas de comptabilit- analytique des d-penses IT par minist-re (cout). Pas de ventilation HATVP par secteur/entreprise (reseau). Pas de publication UK-style par d-partement (impact). Pas de suivi ind-pendant du FTAP (impact). Pas de donn-es sur le taux de recouvrement r-el des amendes CNIL (amendes)."
    fiches_concernees: ["impact", "cout", "recours", "reseau", "systeme", "projets", "predation", "amendes", "dpas"]
    faits_communs: ["F-IMP-001", "F-IMP-010", "F-IMP-013", "F-IMP-018", "F-COUT-001", "F-REC-101", "F-RES-009", "F-RES-010"]
    mecanisme: "Personne ne mesure - Personne ne peut d-montrer l'inefficacit- - Personne n'est oblig- de r-former. L'ignorance est 'organis-e' non par complot mais parce qu'aucun acteur n'a int-r-t - produire les donn-es qui r-v-leraient l'-chec du syst-me."

  - id: "TR-004"
    concept: "Verrouillage par d-pendance technique"
    description: "Pr-sent dans 6/14 fiches. L'-tat ne poss-de pas le code source de ses syst-mes critiques : Chorus (SAP), Health Data Hub (Microsoft Azure), Cloud Bleu (coentreprise Microsoft), SI minist-riels (Capgemini, Atos, Sopra Steria). La d-pendance est technique (code propri-taire), contractuelle (march-s pluriannuels sans clause de sortie) et cognitive (perte de comp-tence interne). Le co-t de sortie est dissuasif : reprendre la ma-trise d'ouvrage IT de l'-tat co-terait 5-10 ans et des milliards."
    fiches_concernees: ["systeme", "cout", "marches", "impact", "estonie", "projets"]
    faits_communs: ["F306", "F308", "F312", "F-MPC-001", "F-MPC-002", "F-COUT-012", "F-COUT-013", "F-EST-002", "F-GP-001"]

  - id: "TR-005"
    concept: "Double standard de contr-le"
    description: "Pr-sent dans 6/14 fiches. Les r-gles sont appliqu-es de mani-re asym-trique : C-dric O bloqu- pour Atos (2022-2023) vs douard Philippe autoris- (2020) — m-me entreprise, m-me HATVP, r-sultats oppos-s. Les administrations ne sont jamais sanctionn-es par la CNIL (Art. 32) mais les entreprises (Free 42 M€, Amazon 2025) oui. La HATVP a 74,3 % d'avis compatibles avec r-serves sans force contraignante — le taux d'incompatibilit- r-el (4,5 %) est cosm-tique. Les r-serves HATVP ne sont jamais suivies. 57 dossiers transmis au parquet en 2025 — aucune condamnation."
    fiches_concernees: ["reseau", "amendes", "carto", "recours", "lolf", "dpas"]
    faits_communs: ["F-RES-001", "F-RES-002", "F-RES-009", "F206", "F-REC-106", "F-REC-115"]

  - id: "TR-006"
    concept: "Rotation institutionnelle comme alternative - la r-forme"
    description: "Pr-sent dans 5/14 fiches. Face aux -checs r-p-t-s, l'-tat cr-e de nouvelles structures au lieu de renforcer les existantes. Cr-ation de la DITP (2017) pour encadrer le conseil — les d-penses conseil ont doubl- (379 M€ - 894 M€). Cr-ation d'Ariane (mai 2026) pour remplacer l'ANSSI — sans renforcer l'ANSSI. 5 directeurs DINUM en 8 ans — rotation des t-te sans changement de cap. Cr-ation du FTAP (1,1 Md€) sans audit ind-pendant. Chaque cr-ation efface l'-chec pr-c-dent et repart - z-ro."
    fiches_concernees: ["predation", "impact", "systeme", "projets", "cout"]
    faits_communs: ["F-pred-010", "F-RES-006", "F-IMP-003", "F-IMP-008", "F-IMP-018", "F-COUT-005"]

  - id: "TR-007"
    concept: "Privatisation du risque et socialisation des pertes"
    description: "Pr-sent dans 4/14 fiches. Les ESN captent les b-n-fices (marge Capgemini 13,3 %, marge brute ESN 28-40 %, McKinsey 0 IS) tandis que les co-ts des -checs sont support-s par le contribuable : fuites de donn-es (co-t r-putationnel et indemnitaire assum- par l'-tat), dette technique (1-1,5 Md€/an), surco-t externalisation (300-450 M€/an). Le contrat Cassiop-e Justice — 60 M€, offre unique, pas de clause de p-nalit-— est l'illustration parfaite : si -a -choue, le contribuable paie deux fois."
    fiches_concernees: ["marches", "cout", "amendes", "predation"]
    faits_communs: ["F-MPC-004", "F-MPC-011", "F-COUT-004", "F-COUT-012", "F-COUT-013", "F201", "F202"]

gaps:
  - "GAP-001 : Aucune investigation sur les alternatives open source existantes dans l'administration fran-aise. x-Road estonien (MIT license) a -t- adopt- par 50+ pays — la France ne l'a pas -tudi-. Des initiatives comme l'Agence du Num-rique (ex-DINSIC) ou les logiciels libres de l'ducation nationale (ENT, Moodle) existent mais n'ont pas -t- cartographi-es."
  - "GAP-002 : Aucune investigation sur les syndicats et repr-sentants du personnel IT de la fonction publique. Quelle est leur analyse du syst-me ? Ont-ils alert- ? Ont-ils -t- -cout-s ?"
  - "GAP-003 : Aucune investigation sur les fournisseurs cloud alternatifs fran-ais (OVH, Scaleway, Outscale). Pourquoi l'-tat les ignore-t-il au profit d'hyperscalers US (AWS, Azure, GCP) ? Le rapport S-nat 2022 et les recommandations ANSSI SecNumCloud ne sont pas analys-s."
  - "GAP-004 : Aucune investigation sur le comportement parlementaire lors du vote des lois de finances — qui a vot- quoi sur les amendements IT (FTAP, CNIL, ANSSI, DINUM) et pourquoi."
  - "GAP-005 : Aucune investigation sur le march- de la conformit- RGPD (DPO, audits de s-curit-, assurance cyber, conseil juridique RGPD) comme b-n-ficiaire de l'inefficacit- du syst-me de sanction. Les loups identifi-s dans les enqu-tes (avocats RGPD +30 %, assureurs cyber b-n-fices records) m-ritent une enqu-te d-di-e."
  - "GAP-006 : Aucune comparaison syst-matique France-Allemagne-Royaume-Uni en mati-re de gouvernance IT publique. Le UK publie son breakdown par d-partement — que font l'Allemagne et les pays nordiques ?"
  - "GAP-007 : Aucune investigation sur le taux de recouvrement r-el des amendes CNIL. Les donn-es de l'Irlande (0,5 %) et du Luxembourg (ratio 0,07) sugg-rent un taux fran-ais bas — mais les chiffres ne sont pas publics."
  - "GAP-008 : Aucune investigation sur l'histoire des d-cisions budg-taires ANSSI/CNIL/DINUM depuis 2010. Qui a d-cid- de sous-dimensionner ces agences ? Quels arbitrages budg-taires ont -t- faits ?"

