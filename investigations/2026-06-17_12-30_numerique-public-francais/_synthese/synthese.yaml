  - titre: "THESE-004 : Sanction sans cons-quence — l'illusion r-pressive du syst-me CNIL"
    enonce: "487 M€ d'amendes en 2025 (83 sanctions) = impression de s-v-rit-. R-alit- : 0 € va aux victimes, les amendes sont une recette fiscale d-guis-e au budget g-n-ral, l'action de groupe est quasi-morte (2 jugements en 10 ans), les administrations ne sont jamais sanctionn-es (Art. 32 loi 78-17), la CNIL est sous-financ-e (30 M€ pour 67 M d'habitants, 277 agents pour 20 150 plaintes). Les amendements parlementaires de 2018 (COM-10, COM-11, COM-34 de Mme Joissains) qui proposaient le fl-chage des amendes vers la CNIL ont -t- rejet-s. L'argument de la LOLF (universalit- budg-taire) est un paravent politique : la LOLF pr-voit des exceptions (CAS, fonds de concours), l'Espagne fl-che 100 % de ses amendes - l'AEPD depuis 1993, et 22/27 DPAs europ-ennes sont en budget g-n-ral pur sans que -a pose de probl-me juridique. L'Irlande (DPC) reversera 1,7 Md€ au Tr-sor en 2025 — l'amende m-me qui devait prot-ger les citoyens devient une taxe d-paysante."
