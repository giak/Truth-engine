perspectives_dialectiques:
  - position: "These"
    argument: "Modeler l'addiction confirme: systeme francais en logocratie avancee (Stade 4). 5 boucles de retroaction verrouillees de l'interieur. Sevrage impossible sans effondrement."
  - position: "Antithese"
    argument: "Comparer la politique a une addiction est une metaphore abusive. La communication gouvernementale est une fonction normale de la democratie. Les 407 mensonges sont une goutte d'eau dans 10 ans de discours."
  - position: "Synthese"
    argument: "Le modele addiction est un cadre heuristique puissant coherent avec toutes les donnees disponibles. 25 faits documentes, EDI* 0.83. Necessite validation academique independante pour passer d'hypothese outillee a theorie etablie."

limites:
  - "Metaphore vs mecanisme: le systeme politique n'a pas de recepteurs dopaminergiques — transposition DSM-5 heuristique"
  - "Absence de donnees longitudinales completes: 12 API construits sur 2017-2026, serie temporelle courte"
  - "Effet Macron: le modele se concentre sur 2017-2026 — charge de la preuve faible pour phases anterieures"
  - "Comparaison internationale absente de ce dossier — specificite francaise non isolee"
  - "Sous-estimation des contre-pouvoirs reels (Mediator, ZAD, Gilets Jaunes)"

wolves:
  - nom: "Le Producteur"
    argument: "Sans les communicants (1500 agents, 1 MdE), pas de substance addictive"
    reponse: "Le systeme produirait du discours meme sans caste specialisee — l'addiction est structurelle"
  - nom: "Le Distributeur"
    argument: "Sans les medias (9 milliardaires, 90% parts), la dose n'atteint pas le consommateur"
    reponse: "Les medias sont aussi addicts — ils ont besoin du spectacle pour survivre"
  - nom: "Le Consommateur"
    argument: "Les citoyens sont libres de ne pas consommer le spectacle politique"
    reponse: "L'abstention 57% est le signe du desengagement — mais le systeme ne depend plus du vote"
  - nom: "Le Regulateur"
    argument: "Viktorovitch, Blast, Off Investigation prouvent que la critique existe et est efficace"
    reponse: "La critique est la naloxone du systeme — micro-dose de verite qui empeche le sevrage brutal"
  - nom: "L'Institutionnalisateur"
    argument: "Le 49.3 et les ordonnances sont des outils constitutionnels legitimes"
    reponse: "28× 49.3 et 82% ordonnances non ratifiees depassent tout usage raisonnable — verrouillage systemique"

iceberg:
  - "Le point de rupture inconnu: l'addiction peut etre infinie — contrairement a la dette ou la confiance, pas de seuil de mort identifie"
  - "L'addiction comme condition post-democratique: et si ce n'etait pas une pathologie mais la forme achevee de la democratie liberale?"
  - "La verite comme trauma collectif: le sevrage signifierait affronter le declin irreversible et l'impuissance publique"
  - "La memoire effacee par le present perpetuel: chaque matin le systeme se reveille vierge, pret a produire un nouveau mensonge"
  - "Le budget reel total incluant les operateurs non declares est inconnu"
  - "Les transactions secretes entre agences de communication et partis politiques"

