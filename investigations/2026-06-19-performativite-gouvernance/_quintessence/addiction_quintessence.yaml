enquete_id: "addiction_performative_modele_theorique"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "2026-06-19_08-50_addiction_performative_modele_theorique_INVESTIGATION.md"

these_centrale: "Le systeme politique francais est structurellement dependant de la production de discours performatifs non pas parce que le mensonge est un choix, mais parce qu'il est une necessite systemique de survie. Le Modele d'Addiction Performative (MAP) formalise cette dependance avec 12 indicateurs quantitatifs, 5 boucles de retroaction et 4 stades cliniques. Score API: 78/100 — Stade 4 Addiction Chronique."

theses_implicites:
  - "Sans le milliard d'euros de communication, le gouvernement serait nu devant la realite — la performance est un cache-sexe structurel"
  - "Les communicants sont une caste auto-reproduite (CELSA → Sciences Po → cabinet → Elysee → agence privee) — les dealers du systeme"
  - "Les citoyens sont accros au spectacle politique consommable — indignation comme feuilleton sans consequences"
  - "La critique est absorbee comme dose de regulation (Viktorovitch sur CNews, Blast subventionne) — naloxone du systeme"

