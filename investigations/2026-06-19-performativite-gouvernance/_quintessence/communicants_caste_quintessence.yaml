enquete_id: "communicants"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_08-50_1500_communicants_etat_caste_INVESTIGATION.md"

these_centrale: "Les 1500 communicants de l'État forment une caste administratively-privée qui a capturé l'appareil de production du récit gouvernemental, formée au même moule (CELSA/INSP/Sciences Po), circulant entre public et privé sans friction, avec un coût annuel dissimulé de 1 milliard d'euros."

theses_implicites:
  - "Le SIG est passé d'un service technique de diffusion à une machine de cadrage narratif (glissement sémantique du décret 2024 : « diffuser » → « valoriser »)"
  - "La réforme Lecornu 2026 est un correctif budgétaire qui renforce paradoxalement le pouvoir centralisé de la caste"
  - "Le monopole CELSA sur la formation des communicants d'État verrouille la reproduction de la caste"
  - "L'insuffisance du contrôle HATVP (77% réserves non suivies) rend les portes tournantes effectives sans sanction"

