perspectives_dialectiques:
  - position: "Thèse (défense du système)"
    argument: "Les communicants d'État sont des techniciens neutres assurant l'information du public. La réforme Lecornu apporte transparence et économies. Le CELSA garantit l'excellence."
  - position: "Antithèse (critique radicale)"
    argument: "Les 1500 communicants sont une caste verrouillée qui a capturé la parole publique. Le 1 Md€ dissimulé, le glissement sémantique du décret 2024, et les 500+ portes tournantes constituent une confiscation antidémocratique."
  - position: "Synthèse (systémique)"
    argument: "La caste est le produit de 60 ans de construction institutionnelle (SLII 1963 → SIG 2026). La réforme Lecornu résout le problème budgétaire mais aggrave le problème démocratique en centralisant le pouvoir de cadrage."

limites:
  - "Le chiffre 1500 communicants est cité par POLITICO avec source Matignon mais le périmètre exact est flou"
  - "Données DICOM de 2010 (Écologie 84,3 ETP, Justice 24 ETP) obsolètes — dernières disponibles publiquement"
  - "Budget consolidé de 1 Md€ est une estimation (source JDD), pas un document officiel consolidé"
  - "Le taux d'insertion CELSA 82% est auto-déclaré par l'école"

wolves:
  - nom: "Michael Nathan"
    argument: "Directeur SIG depuis 2018, management contesté, préside à l'extension du pouvoir du SIG"
    reponse: "Nommé en Conseil des ministres, sous autorité directe du Premier ministre"
  - nom: "Sibeth Ndiaye"
    argument: "Spin doctor assumant le mensonge d'État, porte-parole, pantoufle chez Adecco"
    reponse: "Incarnation du cynisme structurel de la caste"
  - nom: "Clément Léonarduzzi"
    argument: "Prototype du spin doctor-gatekeeper, aller-retour Publicis/Élysée"
    reponse: "Nœud central entre caste des communicants et intérêts privés du CAC 40"
  - nom: "Sébastien Lecornu"
    argument: "Réformateur paradoxal : centralise le pouvoir de communication en prétendant le réduire"
    reponse: "Le tour de contrôle unique du SIG est pire que la dispersion"

iceberg:
  - "Léonarduzzi est le versant privé de la même caste : formé Sciences Po, carrière Publicis/Élysée/Publicis, porte tournante parfaite"
  - "La concentration médiatique Bolloré (Prisma Media, Voici, CNews) et Niel (Nice-Matin, Le Monde) sont les réceptacles de la production narrative de la caste"
  - "La performativité comme mensonge systémique est le carburant idéologique qui justifie l'existence de cette caste"

