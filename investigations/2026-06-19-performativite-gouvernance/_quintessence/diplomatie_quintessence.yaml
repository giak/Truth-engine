enquete_id: "diplomatie"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "/home/giak/projects/truth-engine/investigations/2026-06-19-performativite-gouvernance/2026-06-19_12-00_diplomatie_afrique_performative_APEX.md"
these_centrale: "La diplomatie française en Afrique sous Emmanuel Macron (2017-2026) est performative — les énoncés de rupture (Ouagadougou 2017, Abidjan 2019, Africa Forward 2026) produisent un effet d'annonce sans transformation des structures réelles (CFA inchangé depuis 80 ans, bases militaires maintenues puis fermées tardivement, 23 Md€ sans mécanisme de suivi, réseaux Françafrique opérationnels). La fonction de ces discours n'est pas de changer la relation mais d'en rendre la continuation acceptable."
theses_implicites:
  - "Le discours d'Ouagadougou (2017) prétendait acter la fin du « pré carré » mais 9 ans plus tard, le CFA n'a pas été remplacé (parité fixe euro maintenue, Banque de France garante), les bases n'ont pas fermé (Sénégal, Côte d'Ivoire, Gabon, Djibouti), et les réseaux économiques (TotalEnergies, Bolloré, Orange) opèrent inchangés."
  - "La « réforme » du CFA (Abidjan 2019) est qualifiée d'« homéopathique » par Nicolas Normand (ex-ambassadeur) — suppression du dépôt obligatoire des réserves et retrait des représentants français, mais maintien de la parité fixe et de la garantie française (prêteur en dernier ressort). L'Eco, censé remplacer le CFA, est repoussé sine die (2019→2020→2027)."
  - "Africa Forward (Nairobi, mai 2026) est un sommet-vitrine: 23 Md€ annoncés, 250 000 emplois promis, 35 chefs d'État, 7 000 participants — mais zéro mécanisme contraignant dans la Déclaration de Nairobi. Le soft power français recule pour la première fois depuis 2021 (Brand Finance: France 6e mondiale, -47 places potentiel croissance)."
  - "L'opération Barkhane (2014-2022, 5 000 soldats, 1 Md€/an, 59 morts) s'achève sur 3 putschs (Mali 2020/21, Burkina 2022, Niger 2023), un retrait forcé présenté comme « décision stratégique », et un remplacement par Wagner/Africa Corps (présent dans 44 pays africains)."
  - "Le Sommet de Pau (janvier 2020) — ultimatum paternaliste de Macron aux 5 présidents G5 Sahel — a accéléré la rupture plutôt que renforcer la coopération: les 3 putschs ont suivi dans les 3 ans."
