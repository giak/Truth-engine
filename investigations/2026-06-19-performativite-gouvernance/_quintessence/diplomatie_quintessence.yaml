    contenu: "Discours Ouagadougou 2017, réforme CFA Abidjan 2019, Africa Forward Nairobi 2026 (23 Md€, 35 chefs d'État), retrait Barkhane présenté comme décision stratégique"
  - niveau: "MI-PROFONDEUR (partiellement visible)"
    contenu: "CFA: parité fixe euro maintenue, Banque de France garante; Eco repoussé 2020→2027; bases françaises Sénégal/Côte d'Ivoire/Gabon/Djibouti ouvertes; Barkhane 59 morts, 1 Md€/an, 3 putschs; 23 Md€ sans mécanisme de suivi"
  - niveau: "PROFONDEUR (structurel, invisible)"
    contenu: "Architecture monétaire néocoloniale (parité fixe + garantie France), réseaux économiques TotalEnergies/Bolloré/Orange, AFD conditionnée, accords de défense secrets, rivalité Wagner/Africa Corps (44 pays)"
  - niveau: "FACTOR (moteur)"
    contenu: "Nécessité de maintenir l'influence française sans le coût politique de l'occupation militaire — transition de la Françafrique des généraux à la Françafrique des businessmen. Le discours de rupture comme condition de possibilité de cette transition"
