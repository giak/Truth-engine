acteurs:
  - nom: "Emmanuel Macron"
    role: "Président France 2017-2027. Performateur en chef de la diplomatie Afrique. Discours Ouagadougou → Africa Forward."
    type: "Décideur"
    poids: 10
  - nom: "Nicolas Normand"
    role: "Ex-ambassadeur (Mali, Sénégal, Congo). Contre-voix interne. Critique la réforme CFA homéopathique."
    type: "Contre-voix"
    poids: 5
  - nom: "Alassane Ouattara"
    role: "Président Côte d'Ivoire. Relais local de la réforme CFA. Négociateur avec Macron en juillet 2019."
    type: "Relais local"
    poids: 7
  - nom: "William Ruto"
    role: "Président Kenya. Co-host Africa Forward. Pont vers Afrique anglophone."
    type: "Allié diplomatique"
    poids: 5
  - nom: "Assimi Goïta / Ibrahim Traoré"
    role: "Présidents transition Mali/Burkina. Rejecteurs du système français. Alliés Wagner/Africa Corps."
    type: "Opposant"
    poids: 7
  - nom: "Vincent Bolloré"
    role: "Homme d'affaires. Réseau économique informel. Intérêts portuaires/logistiques Afrique."
    type: "Réseau économique"
    poids: 6
  - nom: "Clément Léonarduzzi"
    role: "Spin doctor Macron, VP Publicis. Architecte invisible du cadrage narratif Afrique."
    type: "Spin doctor"
    poids: 4
  - nom: "Brand Finance"
    role: "Cabinet conseil. Documente le recul du soft power français en 2026."
    type: "Observateur"
    poids: 3
causalites:
  - id: "C-diplomatie-01"
    enonce: "Discours Ouagadougou (2017) → Pas de changement structurel CFA → Annonce réforme Abidjan (2019) → Pays anglophones dénoncent → CFA toujours en vigueur 2026 → Eco risqué sans UEMOA"
    type: "Discours de rupture → Status quo monétaire"
  - id: "C-diplomatie-02"
    enonce: "Sommet de Pau (ultimatum 2020) → 3 putschs Mali/Burkina/Niger → Retrait Barkhane (2022) → Wagner/Africa Corps arrive → Décès jihad ×4"
    type: "Paternalisme militaire → Putschs → Perte influence"
  - id: "C-diplomatie-03"
    enonce: "Africa Forward (2026) → 23 Md€ annoncés → Zéro mécanisme contraignant → Aucun calendrier → Maintien structures économiques"
    type: "Sommet-vitrine → Promesses sans exécution"
  - id: "C-diplomatie-04"
    enonce: "Discours performatif → Dissonance vécu/discours → Antifrançaisme monte → Soft power recule → Brand Finance -47 places"
    type: "Performativité → Perte de soft power"
perspectives_dialectiques:
  - position: "Thèse"
    argument: "La France a rompu avec la Françafrique: le discours d'Ouagadougou (2017) a acté la fin du pré carré, la réforme du CFA (2019) a supprimé le compte d'opérations, Africa Forward (2026) concrétise une nouvelle relation d'égal à égal via l'investissement. Le retrait du Sahel répond aux demandes africaines."
  - position: "Antithèse"
    argument: "Rien n'a changé: le CFA existe toujours avec parité fixe et garantie française, les bases n'ont pas fermé, les 23 Md€ sont des promesses sans suivi, le sommet de Nairobi est une vitrine, les réseaux économiques (TotalEnergies, Bolloré, Orange) opèrent inchangés. La réforme CFA est « homéopathique »."
  - position: "Synthèse"
    argument: "La France opère une transition de régime impérial: de l'empire militaire direct (bases, Barkhane, CFA comme pilier) à un empire économique indirect (investissements, normes, contrats, soft power). Les leviers changent de nature mais l'asymétrie reste. Le discours de rupture est la condition de possibilité de cette transition — sans lui, les opinions africaines exigeraient une rupture réelle."
limites:
  - "Pays non-francophones Afrique australe/orientale non couverts (sauf Kenya)"
  - "Politique intérieure française non centrale"
  - "Rôle UE en Afrique non détaillé"
  - "Histoire pré-2017 seulement contextuelle"
  - "Accords de défense secrets non publics"
  - "Biais de sources: sur-représentation sources françaises, sous-représentation sources africaines locales"
wolves:
  - id: "W-diplomatie-01"
    enonce: "Emmanuel Macron — performateur en chef. Architecte narratif de la diplomatie performative. Maintient CFA + bases tout en disant « pré carré terminé ». Discours Ouagadougou → Africa Forward comme cycle performatif."
    confiance: "Élevée"
  - id: "W-diplomatie-02"
    enonce: "Alassane Ouattara — relais local du système CFA. A verrouillé la parité fixe avec Macron sans consulter les 7 autres pays UEMOA (juillet 2019)."
    confiance: "Élevée"
  - id: "W-diplomatie-03"
    enonce: "Vincent Bolloré — réseau économique informel. Intérêts portuaires et logistiques en Afrique comme pilier de l'influence économique française."
    confiance: "Élevée"
  - id: "W-diplomatie-04"
    enonce: "Clément Léonarduzzi — spin doctor de la communication Afrique. VP Publicis. Architecte invisible du cadrage narratif des sommets."
    confiance: "Moyenne"
  - id: "W-diplomatie-05"
    enonce: "La stratégie néolibérale (entrepreneuriat, business) comme substitut aux changements structurels — le « pacifisme des affaires » remplace le paternalisme militaire sans transformer les rapports de force."
    confiance: "Élevée"
