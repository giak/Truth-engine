enquete_id: "education"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "/home/giak/projects/truth-engine/investigations/2026-06-19-performativite-gouvernance/2026-06-19_12-00_education_performative_promesses_APEX.md"
these_centrale: "L'Éducation nationale est le plus grand théâtre performatif de l'État français — les réformes successives (bac Blanquer, Pacte enseignant, réforme formation, choc des savoirs) forment un édifice de communication politique dont la fonction réelle est de masquer une réduction continue des moyens humains et financiers, sans amélioration mesurable des résultats."
theses_implicites:
  - "La suppression de ~10 000 postes depuis 2017 (dont 4 000 en 2026) est présentée comme un ajustement démographique, mais les gains de productivité théoriques ne sont jamais réinvestis dans les salaires ou les conditions d'enseignement."
  - "Le Pacte enseignant (780 M€ budgétés, 480 M€ consommés, 38% de sous-exécution) est un dispositif de revalorisation nominale qui échoue structurellement — seuls 14% des enseignants cumulent plusieurs missions."
  - "La réforme du bac Blanquer (2019), modifiée trois fois en six ans (2021/2023/2025), a transformé le diplôme en dispositif statistique décorrélé de sa mission pédagogique — 91,2% de réussite en 2024 mais baisse continue du niveau en mathématiques."
  - "La réforme de la formation des enseignants (concours Bac+3, salaire M1 à 1 400 €/mois) a été lancée sans que le budget universitaire de préparation (500 M€/an à partir de 2028) ne soit garanti."
  - "L'écart salarial avec l'Allemagne (30 062 € vs 56 787 € brut/an début de carrière, ratio 53%) est structurel et s'aggrave — +1% de pouvoir d'achat France vs +4% moyenne OCDE entre 2015 et 2023."
