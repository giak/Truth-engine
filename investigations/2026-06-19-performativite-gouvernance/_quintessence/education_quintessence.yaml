perspectives_dialectiques:
  - position: "Thèse"
    argument: "L'Éducation nationale est réformée en continu pour l'améliorer — chaque réforme répond à un diagnostic précis (baisse niveau, démographie, attractivité) et modernise le système."
  - position: "Antithèse"
    argument: "Les réformes sont des substituts à l'investissement — elles produisent de la communication politique (le « choc » comme esthétique gouvernementale) sans amélioration mesurable, et masquent la réduction des moyens humains et financiers."
  - position: "Synthèse"
    argument: "La succession de réformes (bac, formation, Pacte, choc des savoirs) constitue un régime d'annonce qui occupe l'espace médiatique, épuise les acteurs par la mise en œuvre permanente, et masque l'absence d'augmentation structurelle du budget éducatif rapporté au PIB (4,7% — moyenne basse OCDE)."
limites:
  - "Enseignement supérieur exclu (hors formation initiale des enseignants)"
  - "Écoles hors contrat non couvertes"
  - "Politiques éducatives locales non analysées"
  - "Comparaison PISA détaillée non incluse"
wolves:
  - id: "W-education-01"
    enonce: "Réforme formation sans budget = piège générationnel. Les étudiants recrutés en L3 (promesse de carrière) découvriront un métier dégradé."
    confiance: "Élevée"
  - id: "W-education-02"
    enonce: "Le « projet d'évaluation » du bac (contrôle continu sélectif 2025) crée un bac à plusieurs vitesses: selon l'établissement, le coefficient 0 supprime des matières entières du diplôme officiel."
    confiance: "Élevée"
  - id: "W-education-03"
    enonce: "Si la démographie continue (-30% d'élèves dans certains départements d'ici 2034), le modèle de « regroupement » de la Cour des comptes légitimera des fermetures massives sous couvert de rationalisation."
    confiance: "Très élevée"
  - id: "W-education-04"
    enonce: "Le déclassement salarial structurel (53% de l'Allemagne) crée une trappe à pauvreté enseignante: futurs recrutés L3 dans le quartile inférieur des salaires français."
    confiance: "Très élevée"
  - id: "W-education-05"
    enonce: "La succession rapide de ministres (5 depuis 2022) interdit toute continuité stratégique — chaque ministre annule ou révise les réformes du prédécesseur."
    confiance: "Élevée"
