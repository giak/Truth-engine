enquete_id: "legalite"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_07-30_legalite_legitimite_INVESTIGATION.md"

these_centrale: "La France présente un écart structurel croissant entre sa légalité formelle et sa légitimité substantielle — cet écart n'est pas accidentel mais systémique, la procédure légale masquant la confiscation du pouvoir citoyen par une oligarchie politico-économique."

theses_implicites:
  - "Le droit est devenu un instrument de maintien d'un ordre social inégalitaire plutôt que l'expression de la volonté générale"
  - "La concentration médiatique verrouille l'espace public et empêche la prise de conscience collective"
  - "Le 'parlementarisme rationalisé' de la Ve République est structurellement déséquilibré au profit de l'exécutif"
  - "La domination légale-rationnelle (Weber) produit des résultats que les citoyens ne reconnaissent pas comme légitimes"
  - "Le droit perd sa légitimité quand le 49.3 et les ordonnances court-circuitent la discussion publique (Habermas)"

