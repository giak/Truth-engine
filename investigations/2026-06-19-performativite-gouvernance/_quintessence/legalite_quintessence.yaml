perspectives_dialectiques:
  - position: "Thèse officielle et académique dominante (P1)"
    argument: "La Ve République est un régime parlementaire renforcé où le 49.3 est un outil normal de stabilité (moyenne 2 fois/an). Les lois sont contrôlées par le CC. Les élections restent le fondement de la légitimité. La défiance est un phénomène occidental non spécifique à la France. L'État de droit est solide."
    cui_bono: "Exécutif, majorité présidentielle, classe politique installée, corps d'État"

  - position: "Antithèse critique et dissidente (P2)"
    argument: "La Ve République est une monarchie élective déguisée. Le 49.3 est un mécanisme structurel de contournement (28 fois sous Macron seul). Le CC est une chambre d'enregistrement nommée par l'exécutif. Les médias sont verrouillés par 9 milliardaires. L'évasion fiscale (80-100 Mds€) est un transfert élites vs peuple. La loi devient instrument de maintien de l'ordre social inégalitaire."
    cui_bono: "Grandes fortunes, multinationales, caste politico-médiatique"

  - position: "Synthèse forensique (P3)"
    argument: "Convergence: les deux perspectives reconnaissent 113 usages du 49.3 et 49% confiance justice. Divergence: P1 voit l'outil normal, P2 voit le symptôme autoritaire. Données tranchantes: 28 49.3 sous Macron dépasse la somme 1958-1995 (27). Concentration médiatique (9 propriétaires, 80%+) est un fait documenté. Évasion fiscale chiffrée par rapports parlementaires. Gap non résolu: intentionnalité du système (incompétence systémique vs capture délibérée)."

limites:
  - "Périmètre limité à la France — comparaison internationale non systématique"
  - "Distinction entre 'incompétence systémique' et 'capture délibérée' non tranchable par les seules données disponibles"
  - "EDI faible (0.28) car sources majoritairement françaises — angle mort géopolitique"
  - "Certains chiffres (évasion fiscale 80-100 Mds€) sont des estimations avec marges d'erreur significatives"
  - "Baromètre Cevipof mesure la défiance mais n'établit pas de lien de causalité direct avec le 49.3"
  - "Chiffre précis de l'impact du 49.3 sur l'abstention non établi quantitativement (corrélation documentée, causalité non établie)"
  - "Analyse des réformes du CC depuis 2008 non détaillée"
  - "Étude de l'influence des think tanks sur la production législative non réalisée"
  - "Analyse détaillée du droit européen exclue du périmètre"

wolves:
  - nom: "Emmanuel Macron"
    argument: "Le 49.3 est un outil constitutionnel normal utilisé pour la stabilité gouvernementale. 28 fois en 5 ans est justifié par l'absence de majorité absolue."
    reponse: "Le nombre de 49.3 sous Macron (28) dépasse la somme de tous les Premiers ministres de 1958 à 1995 (27). La Commission de Venise elle-même alerte sur la dérive autoritaire."
  - nom: "Vincent Bolloré"
    argument: "La concentration médiatique est le résultat du marché. Le pluralisme est garanti par l'Arcom et la loi de 1986."
    reponse: "9 milliardaires contrôlent 80% des médias — le pluralisme formel masque un verrouillage réel. Bolloré a méthodiquement évincé les journalistes réfractaires (grève JDD 40 jours, purge Europe 1)."
  - nom: "Le Conseil constitutionnel"
    argument: "Le CC contrôle la constitutionnalité des lois et garantit l'État de droit. 95% de validation montre la qualité du travail législatif."
    reponse: "95% de validation peut aussi indiquer un contrôle insuffisant. Les 9 membres sont nommés par l'exécutif. Le double filtre QPC (CE/Cassation) bloque 93.2% des recours citoyens."
  - nom: "Le discours officiel (Système)"
    argument: "La France est une démocratie libérale. La défiance est un phénomène occidental lié aux réseaux sociaux, pas un défaut spécifique du système français."
    reponse: "52.5% d'abstention en 2022 est un record absolu de la Ve République. 49% de confiance dans la justice, 26% dans la politique, 15% dans les partis: ces chiffres documentent une érosion structurelle et spécifiquement française."
  - nom: "La HATVP"
    argument: "La Haute Autorité contrôle le pantouflage et garantit la probité des responsables publics."
    reponse: "77% des avis avec réserves ne sont pas suivis. Sans pouvoir de sanction substantiel, la HATVP fonctionne comme un théâtre de légitimation, pas comme un organe de contrôle effectif."

