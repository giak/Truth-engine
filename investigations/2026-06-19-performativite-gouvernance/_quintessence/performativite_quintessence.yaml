perspectives_dialectiques:
  - position: "P1 — Discours officiel / académique mainstream"
    argument: "La démocratie française fonctionne dans son cadre constitutionnel. Le mensonge a toujours existé (Hannah Arendt). La France reste une démocratie libérale (EIU 7.99, flawed democracy, pas autoritaire). Les institutions tiennent."
    cui_bono: "Pouvoir exécutif, partis de gouvernement, médias mainstream, communicants"
    suspicion: 0.50
  - position: "P2 — Critique radicale"
    argument: "La France n'est plus une démocratie mais une logocratie (Viktorovitch), un spectacle intégré (Debord), une hyperréalité (Baudrillard). Les 3 verrous (49.3, médias, abstention) forment une cage."
    cui_bono: "Caste (grands corps, propriétaires médias, communicants), capital"
    suspicion: 0.50
  - position: "P3 — Synthèse triangulée"
    argument: "Les faisceaux convergent sur les faits (mensonges, concentration, défiance). L'intentionnalité du système n'est pas vérifiée (émergent, pas coordonné). La performativité est une pathologie mais pas nécessairement fatale."
    suspicion: 0.50

limites:
  - "Biais de sélection des sources : théoriques critiques (Debord, Baudrillard, Viktorovitch, Chomsky) — aucun théoricien libéral ou conservateur convoqué"
  - "Absence de quantification précise du mensonge politique : 407 mensonges identifiés mais pas de dénominateur (taux inconnu)"
  - "Effet Macron : concentration sur 2017-2026 — biais temporel de proximité"
  - "Comparaison internationale absente : France cas unique ou exemplaire d'un phénomène mondial ?"
  - "Pas de contradictoire cité — aucun spin doctor n'a été interrogé"
  - "Angles morts : zones de résistance sous-documentées (Gilets Jaunes, médias alternatifs), performativité de gauche non traitée"

