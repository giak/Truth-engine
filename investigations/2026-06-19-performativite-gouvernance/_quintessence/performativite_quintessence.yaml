enquete_id: "performativite"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_07-45_performativite_mensonge_systemique_INVESTIGATION.md"

these_centrale: "La performativité n'est pas un défaut de la démocratie française mais son mode de fonctionnement actuel : le système produit des énoncés qui n'engagent à rien, que personne ne croit, mais que tout le monde feint de prendre au sérieux — le dire s'est substitué au faire, la communication remplace l'action, et l'acquiescement mutuel maintient la fiction. La France est une logocratie (Viktorovitch) où le simulacre (Baudrillard) et le spectacle intégré (Debord) sont devenus plus réels que le réel."

theses_implicites:
  - "La France est entrée dans un régime de logocratie en 2017 avec l'élection de Macron — la parole officielle est décorrélée du réel (Viktorovitch)"
  - "Le système viole systématiquement la condition (4) d'Austin (intention) : le locuteur n'a pas l'intention de faire ce qu'il dit — le performatif est un échec institutionnalisé"
  - "La spirale du silence (Noelle-Neumann) s'est refermée : 26% confiance, 74% corruption perçue, 90% déclin perçu, mais personne n'agit"
  - "La communication politique française a atteint la phase 4 de Baudrillard (simulacre) : les discours ne renvoient plus à des actes mais à d'autres discours"
  - "La performativité n'est pas une pathologie mais la fonction normale du système — le spectacle intégré (Debord) où l'image de la démocratie remplace la démocratie"

