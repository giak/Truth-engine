perspectives_dialectiques:
  - position: "Thèse"
    argument: "La France fonctionne comme une logocratie industrielle: 2+ Md€/an en discours et en consultation, une armée de 1 500 communicants, des think tanks qui valident les réformes pré-décidées, et une novlangue qui vide les mots de leur sens — le système est dépendant de la performativité"
  - position: "Antithèse"
    argument: "La communication étatique (1 Md€) est légitime dans une démocratie moderne. Les cabinets de conseil apportent une expertise utile. Les think tanks sont des acteurs normaux du débat public. Les promesses non tenues sont la nature de la politique."
  - position: "Synthèse"
    argument: "La performativité française n'est pas un complot mais une défaillance systémique auto-entretenue par 4 mécanismes d'addiction: la communication masque l'inaction → la caste des communicants se reproduit → les citoyens consomment l'indignation sans agir → la critique est absorbée par le système lui-même"

limites:
  - "Les salaires des spin doctors (Emelien, Gantzer, Léonarduzzi) sont des estimations non sourcées — aucune source publique ne les confirme"
  - "L'affirmation que les 9 milliardaires contrôlent 90% des médias n'est pas liée à une URL spécifique dans le texte"
  - "La thèse de l'addiction performative (§O) est une hypothèse conceptuelle, non étayée par des données empiriques dans ce fichier"
  - "La comparaison France/Hongrie/Pologne (EIU) mériterait une analyse des mécanismes de dégradation différents — le texte suggère plus qu'il ne démontre"

wolves:
  - nom: "Thierry Saussez"
    argument: "Pionnier des communicants politiques, maire-adjoint de Rueil. La communication gouvernementale existe depuis De Gaulle — Macron n'a rien inventé."
    reponse: "L'échelle a changé qualitativement: 1 Md€ de budget communication en 2024, 1500 agents, 500+ portes tournantes CELSA. Ce n'est plus de la communication — c'est une industrie de production du discours qui se substitue à l'action publique."
  - nom: "Clément Léonarduzzi"
    argument: "Fondateur de Telling, conseiller de Macron. Simple professionnel de la communication — aucun pouvoir décisionnel."
    reponse: "Associé à la décision de dissolution (juin 2024), conseiller occulte sans mandat électif, décoré Chevalier du Mérite entouré du CAC40. Spin doctor n'est pas un technicien — c'est un acteur politique de facto."
  - nom: "Michèle Marchand 'Mimi'"
    argument: "Patronne d'agence people comme une autre. La presse people a toujours couvert les politiques. Bestimage était un acteur normal du marché."
    reponse: "Condamnée 18 mois avec sursis pour extorsion, mise en examen pour subornation de témoin (affaire Takieddine), 29 couvertures Macron en 2017 via fausses paparazzades, membre du comité de liaison presse Élysée. Ce n'est pas du people normal — c'est de la communication politique déguisée."
  - nom: "Karim Tadjeddine (McKinsey)"
    argument: "Les cabinets de conseil apportent une expertise mondiale que l'administration n'a pas. Le contrat enseignant à 496k€ était un investissement modeste dans la réflexion."
    reponse: "Le Sénat qualifie le phénomène de 'tentaculaire': 1 Md€ de dépenses en 2021, des livrables qui 'servent à préparer une interview sur BFMTV ou une audition au Sénat'. Capgemini noté 1/5 pour une mission handicap. La consultation est le spectacle de la compétence."
  - nom: "Thierry Pech (Terra Nova)"
    argument: "Les think tanks enrichissent le débat public. Terra Nova est indépendant — son financement mixte garantit cette indépendance."
    reponse: "60% de financement privé (CAC40). La HATVP a tenté d'inscrire les think tanks comme représentants d'intérêts — l'Institut Montaigne a refusé. Circularité: l'État finance Fondapol (80% subventions) qui produit des notes qui justifient la politique de l'État."
  - nom: "Barbara Cassin"
    argument: "La philosophe documente la novlangue — preuve que la critique académique existe et est audible en France."
    reponse: "La critique est absorbée comme dose de régulation du système. Viktorovitch sur CNews, Cassin chez France Culture: le système incorpore sa propre critique comme preuve de son pluralisme, sans jamais changer de fonctionnement."

