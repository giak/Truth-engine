enquete_id: "performativite_v3"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_08-30_performativite_mensonge_V3_SUPPLEMENT.md"

these_centrale: "Le système performatif français est une industrie lourde (2+ Md€/an) où la communication gouvernementale, les cabinets de conseil, les think tanks et les spin doctors forment une économie du discours qui se substitue à l'action — la France est devenue structurellement dépendante de la performativité comme mode de gouvernement."

theses_implicites:
  - "L'économie de la performativité (2+ Md€/an) dépasse ce que l'État dépense pour agir — le discours est devenu la dépense principale"
  - "Les spin doctors forment une caste auto-reproduite (CELSA → cabinet → Élysée → agence privée) dont le modèle économique repose sur la perpétuation du discours vide"
  - "La performativité diplomatique française est une prophétie autoréalisatrice: dire 'il n'y a plus de politique africaine' a provoqué l'effondrement qu'elle décrivait"
  - "Le centre politique (Giscard à Macron) normalise les thèmes d'extrême droite par la novlangue et l'inversion sémantique (Boursier/Lemor 2025)"
  - "La France n'est pas une démocratie illibérale (25e RSF) mais un régime spécifique: concentration capitalistique des médias + défiance massive (62%) + performativité par le haut"

