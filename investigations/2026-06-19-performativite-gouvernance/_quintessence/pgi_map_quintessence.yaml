perspectives_dialectiques:
  - position: "Thèse"
    argument: "La France n'a pas un système performatif — elle EST un système performatif. PGI×MAP = 2.9/10, Persistance = 10/10, Stade 4. Système immunisé à la sanction démocratique."
  - position: "Antithèse"
    argument: "Le PGI est un outil californien qui manque les spécificités françaises. Le MAP est un modèle auto-construit sans validation externe. L'écart entre engagement et exécution existe dans toutes les démocraties."
  - position: "Synthèse"
    argument: "PGI et MAP décrivent le même phénomène sous deux angles: le PGI dit 'l'engagement ne contraint pas', le MAP dit 'le système ne peut pas être contraint'. La convergence des deux outils (l'un externe, l'autre clinique) valide le diagnostic au-delà du biais individuel."

limites:
  - "PGI vient d'un institut californien (IRSA) — pas des sciences politiques françaises"
  - "Le score composite PGI×MAP (2.9/10) agrège deux échelles non calibrées ensemble"
  - "Certaines dimensions PGI (Temporal persistence à 10/10) sont calculées subjectivement"
  - "Pas de validation par une tierce partie du modèle MAP"

wolves:
  - nom: "Emmanuel Macron"
    argument: "La dissolution de juillet 2024 et les 49.3 étaient des nécessités constitutionnelles dans un contexte de majorité relative"
    reponse: "L'effet systémique (82% ordonnances non ratifiées, 36/1 loi appliquée) dépasse l'intention conjoncturelle — c'est le mode de gouvernement structurel."
  - nom: "Le Système"
    argument: "La France est une démocratie fonctionnelle (EIU 7.99) — l'écart entre parole et acte existe partout"
    reponse: "EIU 7.99 = démocratie défaillante, pas fonctionnelle. Et PGI×MAP 2.9/10 mesure l'écart spécifiquement français — facteur 3 entre promesse climat et réalité."

iceberg:
  - "Gap PGI-MAP G1: la persistance mesure la survie aux changements — le performatif persiste, pas l'engagement"
  - "Gap G2: le MAP identifie les causes de l'addiction (4 dépendances) que le PGI ne mesure pas"
  - "Gap G5: 2,18 Md€/an de dépendance économique au performatif — coût mesuré par MAP, absent du PGI"
  - "Mnemolite: cross-links avec lois_perf (36/1, 82%), communicants_caste (1500, 1 Md€), medias (90%, 5 milliardaires)"

