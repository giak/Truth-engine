enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_10-45_pgi_x_map_modele_hybride_INVESTIGATION.md"

these_centrale: "La France souffre d'une gouvernance sans contrainte — une architecture où les engagements sont conçus pour être violés. Le score composite PGI×MAP de 2.9/10 mesure l'intensité performative: le PGI est le thermomètre (6 dimensions), le MAP est le diagnostic clinique (78/100 Stade 4 Addiction Chronique)."

theses_implicites:
  - "L'absence totale de contrainte crée une dépendance maximale — sans contrainte, pas de sevrage possible (MAP intensité 10/10)"
  - "Les 6 dimensions PGI sont effondrées: Binding strength 2/10, Enforcement coupling 2/10, Verification integrity 2/10, Non-bypassability 3/10, Authority alignment 3/10"
  - "Temporal persistence est la seule dimension à 10/10 — la France est hyper-stable dans sa performativité"
  - "La France a construit un système où l'absence de contrainte est la condition de survie — gouverner = performer"

