    mecanisme: "L'existence d'un accord presque signé à Istanbul est systématiquement invisibilisée par BFMTV pour ne pas affaiblir le récit pro-Ukraine"
  - cause: "F-artefacts-004"
    effet: "F-artefacts-007"
    mecanisme: "L'artefact des « 40 jours » crée un cadre narratif qui exclut par construction toute alternative à la guerre"

perspectives_dialectiques:
  - position: "Narratif BFMTV"
    argument: "La guerre évolue en faveur de l'Ukraine. Les documents russes sont authentiques. Les négociations d'Istanbul n'étaient pas sérieuses. Poutine ne veut pas la paix."
  - position: "Contre-narratif factuel"
    argument: "Les négociations d'Istanbul étaient réelles et documentées. Les « 40 jours » n'ont pas de source. Les documents russes n'ont pas été vérifiés. Le débat BFMTV est un récit orienté."
  - position: "Synthèse"
    argument: "BFMTV ne ment pas — elle sélectionne. Ce qu'elle montre est vrai mais incomplet. L'omission des négociations d'Istanbul est le biais le plus grave car il prive le public d'une information essentielle."

limites:
  - "Pas accès aux documents internes russes pour vérifier leur authenticité"
  - "Le transcript SRT est une retranscription — perte possible d'inflexions orales"
  - "Débat historiographique non tranché sur le rôle exact des US/UK dans l'échec d'Istanbul"

wolves:
  - nom: "Direction de l'information BFMTV"
    argument: "Les négociations d'Istanbul ont échoué à cause de Boutcha. Ce n'est pas de la censure, c'est du journalisme qui privilégie les faits récents."
    reponse: "Ne jamais mentionner l'existence des négociations d'Istanbul en 4 ans de guerre n'est pas du « journalisme qui privilégie les faits récents » — c'est une omission éditoriale systématique."
  - nom: "Animateur BFMTV"
    argument: "Les « documents russes » sont une information sensible, on ne peut pas tout révéler."
    reponse: "Si vous ne pouvez pas les vérifier, vous ne devriez pas les présenter comme une preuve."

