these_centrale: "BFMTV n'est pas un média de propagande au sens classique mais un vecteur de soft propaganda structurelle : alignement systémique avec l'État, l'UE et l'OTAN produit par concentration capitalistique, sélection des experts, omissions systématiques et cadrage dramatique."

theses_implicites:
  - "La concentration capitalistique des médias français (9 propriétaires, ~90% d'audience) produit mécaniquement un récit convergent sans besoin d'instructions"
  - "L'État français est actionnaire indirect de BFMTV via Bpifrance (3% de CMA CGM), créant un conflit d'intérêt structurel"
  - "Le revolving door (Ramon Fernandez, ex-DG Trésor → président RMC BFM) verrouille l'alignement éditorial"

