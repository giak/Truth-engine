  - cause: "F-bfmtv-005"
    effet: "F-bfmtv-008"
    mecanisme: "L'absence de pluralisme dans le plateau permet la circulation d'artefacts narratifs non vérifiés"

perspectives_dialectiques:
  - position: "Thèse officielle"
    argument: "BFMTV est une chaîne d'info indépendante. Ses experts sont reconnus. Les rachats sont des opérations normales. La ligne pro-Ukraine reflète la réalité."
  - position: "Contre-thèse structurelle"
    argument: "BFMTV est un rouage d'un dispositif de guerre cognitive : concentration capitalistique, revolving door, purge éditoriale, artefacts narratifs, régulateur impuissant."
  - position: "Synthèse"
    argument: "Pas de propagande au sens classique (mensonge direct). Mais soft propaganda structurelle : omission systématique des alternatives et cadrage univoque qui produisent un consentement à la guerre sans fin."

limites:
  - "Pas d'accès aux documents internes de BFMTV ou CMA CGM"
  - "Pas de preuve de coordination directe État→ligne éditoriale"
  - "Analyse concentrée sur un seul segment de 30 minutes"

wolves:
  - nom: "Direction de BFMTV"
    argument: "Le pluralisme est respecté, les invités sont choisis pour leur expertise"
    reponse: "0 invité russe ou sceptique sur 4 = pluralisme nul par construction"
  - nom: "Ramon Fernandez"
    argument: "Ma nomination est une question de compétences, pas de conflit d'intérêt"
    reponse: "Le circuit Trésor→Orange→CMA CGM→RMC BFM crée un alignement structurel, intentionnel ou non"

iceberg:
  - "Le financement précis des experts invités (combien sont payés, par qui ?) n'est pas traité"
  - "La comparaison avec le traitement d'autres conflits (Gaza, Sahel) n'est pas faite"

