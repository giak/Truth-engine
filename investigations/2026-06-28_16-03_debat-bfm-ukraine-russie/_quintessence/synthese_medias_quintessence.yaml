perspectives_dialectiques:
  - position: "Thèse officielle"
    argument: "La France a des médias libres, pluralistes et indépendants. Le 28 juin 2026, BFMTV a organisé un débat normal sur la guerre."
  - position: "Contre-thèse systémique"
    argument: "Le système médiatique français est un dispositif de verrouillage informationnel qui produit mécaniquement un récit unique aligné sur l'État, l'OTAN et l'UE."
  - position: "Synthèse"
    argument: "Ce n'est pas un complot mais une architecture. Chaque mécanisme est normal. Leur convergence ne l'est pas."

limites:
  - "Pas de preuve de coordination directe entre les 6 mécanismes"
  - "Pas d'étude quantitative de l'évolution du pluralisme"
  - "Analyse centrée sur BFMTV et l'Ukraine — d'autres médias et d'autres sujets pourraient montrer des résultats différents"

wolves:
  - nom: "Lecteur sceptique"
    argument: "Tout ça est exagéré. Les médias français sont libres. Personne n'interdit de dire autre chose."
    reponse: "Personne n'interdit rien. Le système n'a pas besoin d'interdire : il suffit que les voix critiques partent d'elles-mêmes (clause de cession) et que les nouveaux cadres soient alignés."
  - nom: "Journaliste BFMTV"
    argument: "Je fais mon travail en toute indépendance. Personne ne me dicte ce que je dois dire."
    reponse: "Vous n'avez pas besoin qu'on vous dicte quoi dire. Les sujets que vous ne traitez pas (Istanbul, pertes civiles, critiques OTAN) ne vous ont pas été interdits — ils ont simplement été exclus du cadre."

iceberg:
  - "Comparaison internationale : comment d'autres démocraties (Allemagne, UK, Canada) régulent la concentration des médias"
  - "Rôle des réseaux sociaux dans la fragmentation du paysage médiatique et contournement des médias traditionnels"
  - "Impact de la loi sur l'indépendance des médias (non adoptée en France)"

