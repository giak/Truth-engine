these_centrale: "Le système médiatique français est un dispositif de guerre cognitive contre son propre peuple : 6 mécanismes convergents (capture capitalistique, revolving door, purge éditoriale, artefacts narratifs, absence de pluralisme, régulateur inefficace) produisent un récit unique aligné sur l'État, l'OTAN et l'UE."

theses_implicites:
  - "Aucun des 6 mécanismes pris individuellement n'est « illégal » — mais leur convergence produit un verrouillage informationnel total"
  - "Ce système ne produit pas de mensonges directs : il produit des omissions, des cadrages, des silences"
  - "Le public français est informé dans les limites fixées par 9 propriétaires alignés sur les mêmes intérêts"

