these_centrale: 'Les Amériques précolombiennes sont le TEST ULTIME et le RÉFUTATEUR EN CHEF de la thèse dette-centrée : l''Empire
  Inca a développé un État intégré SANS monnaie, SANS dette privée, SANS marché — prouvant que l''intégration ne passe pas
  par la dette et que les Amériques sont un UNIVERSEL PARALLÈLE, pas un chaînon manquant.'
theses_implicites:
- L'Empire Inca avait ZÉRO monnaie, ZÉRO dette privée, ZÉRO marché — mais 10M d'habitants, 40 000 km de routes, et un système
  de redistribution intégrale via le mit'a (impôt-travail)
- Le quipu (cordelettes nouées) est un système d'information PLUS EFFICACE que l'écriture pour les données comptables — la
  bureaucratie n'a pas besoin d'écriture phonétique
- La capture inca est par MONOPOLE D'INFORMATION (quipu illisible sans formation) — pas par droit ou religion, mais par TECHNOLOGIE
  COGNITIVE
- Les Amériques sont des CIVILISATIONS PARALLÈLES (Caral 2600 BCE) sans contact avec l'Ancien Monde avant 1492 — l'intégration
  est un universel humain, pas une filiation
- L'eurocentrisme du récit civilisationnel est une GUERRE COGNITIVE — l'effacement des Amériques reproduit la Conquête espagnole
  sur le plan épistémique
- Si la dette n'est pas nécessaire à l'intégration (Inca), alors la dette n'est pas un MÉCANISME CENTRAL mais une option culturelle
