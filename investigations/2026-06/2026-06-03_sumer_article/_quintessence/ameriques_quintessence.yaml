perspectives_dialectiques:
- position: Thèse académique standard
  argument: Les civilisations américaines sont 'primitives' comparées à l'Ancien Monde. Absence de monnaie = sous-développement
- position: Antithèse indigéniste / andine
  argument: L'Inca a SURPASSÉ l'Europe dans l'organisation économique. Pas de révoltes fiscales, pas de crise de la dette,
    pas d'inflation. Économie au service de l'homme
- position: 'Synthèse : l''intégration est un universel'
  argument: Les Amériques prouvent que l'intégration peut se faire SANS dette. La dette n'est pas le MÉCANISME, c'est un choix
    culturel parmi d'autres
limites:
- 'Sources européennes (conquistadors, chroniqueurs) : biais de conquête'
- Pas d'accès à l'archéologie andine récente
- Quipus non déchiffrés pour les parties non-numériques (littérature, lois ?)
- Tendance à SUR-ESTIMER l'économie inca pour compenser son invisibilité
wolves:
- nom: Eurocentrisme / récit du 'miracle européen'
  argument: Les Amériques sont des 'civilisations précolombiennes' (pré-1492 = définies par la conquête, pas par leur propre
    existence)
  reponse: Caral (2600 av.) est contemporain des pyramides d'Égypte. 4000 ans de développement INDEPENDANT avant tout contact
- nom: Lecteurs matérialistes
  argument: Sans monnaie, pas d'économie ; sans dette, pas d'intégration
  reponse: L'Inca avait 10M d'habitants, 40 000 km de routes, un système fiscal (mit'a) et une redistribution intégrale. C'est
    une ÉCONOMIE, pas une absence d'économie
- nom: Conquistadors / apologistes de la Conquête
  argument: Les Amérindiens ont 'bénéficié' de la civilisation occidentale
  reponse: 90% de la population amérindienne meurt (épidémies + violence). Villes comme Tenochtitlan (200k habitants) détruites.
    Aucun 'bénéfice' ne justifie ce bilan
- nom: Nationalistes incas contemporains (Pérou, Bolivie)
  argument: L'Inca était un État-providence socialiste avant l'heure
  reponse: L'Inca était une monarchie divine avec castes (Sapa Inca, nobles, roturiers) et propriété étatique — pas un socialisme.
    Mais l'organisation collective était remarquable
