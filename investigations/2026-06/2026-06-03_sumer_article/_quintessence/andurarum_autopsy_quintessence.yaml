causalites:
- cause: F-001
  effet: F-005
  mecanisme: Exclusion des dettes commerciales (tamkārum) → le système ne tue pas la dette marchande → sa disparition après
    1400 av. n'est pas une perte économique mais un changement de configuration politique
- cause: F-002
  effet: F-006
  mecanisme: Étymologie 'retour à la mère' → sens RESTAURATEUR (retour à l'état originel) et non RÉFORMATEUR (innovation sociale)
    — la thèse Charpin s'ancre dans la langue
- cause: F-008
  effet: F-010
  mecanisme: Polysémie d'amargi → récupération par tous les bords (libertariens, gauche, Reagan) → 'Rorschach idéologique'
    (Hudson reconnaît mais ne s'auto-critique pas)
perspectives_dialectiques:
- position: Thèse Hudson (lecture économique)
  argument: Andurarum = clean slate macroéconomique, stabilisateur cyclique. Dette = mécanisme central d'intégration de l'âge
    du bronze
- position: Thèse Charpin (lecture assyriologique)
  argument: Andurarum = restauration conservatrice, rituel de légitimation, geste idéologique. Pas une politique économique
    moderne
- position: 'Synthèse : incompatibilité des deux lectures'
  argument: Les deux lectures ne sont pas incompatibles (un acte peut être à la fois rituel et économique), mais la thèse
    de l'article penche EXCLUSIVEMENT vers Hudson sans mentionner Charpin — biais directionnel
limites:
- 'L''enquête prend parti : penche vers Charpin contre Hudson, avec preuve documentaire'
- Le consensus assyriologique penche vers Charpin (Westbrook, Kraus, Villard), mais Hudson a une audience grand public plus
  large
- Hudson reconnaît certaines critiques d'Ammisaduqa mais MINIMISE l'impact
- L'andurarum comme 'jubilé biblique' reste POSSIBLE (cognat linguistique hébreu dror dans Lévitique 25) mais non prouvé directement
wolves:
- nom: Hudson / Graeber / CADTM
  argument: L'andurarum prouve que la dette peut être abolie par la volonté politique — leçon pour aujourd'hui
  reponse: L'andurarum était limité aux dettes agricoles de subsistance, pas une politique macroéconomique moderne. Sa fréquence
    (1/33 ans) est comparable aux crises françaises (1/30-40 ans)
- nom: Libertariens (Hayek Society, Liberty Fund)
  argument: Amargi = liberté individuelle, opposé à l'État
  reponse: Amargi = retour au statut d'origine (famille, terre), pas liberté abstraite. Le créancier perd sa créance, ce n'est
    pas un 'droit naturel'
- nom: Kramer (1959)
  argument: Andurarum = réforme progressiste sumérienne
  reponse: 'Schrakamp 2025 : les ''réformes'' d''Urukagina sont une RESTAURATION conservatrice, pas une innovation. La lecture
    progressiste est anachronique'
- nom: Thèse de l'article (Truth Engine)
  argument: L'andurarum prouve que la dette était le mécanisme d'intégration central
  reponse: 'Charpin : l''andurarum était un rituel de légitimation. La dette n''est ni nécessaire ni suffisante à l''intégration
    (l''Inca prouve l''intégration sans dette)'
iceberg:
- 'Sujet immergé #1 : le débat Charpin vs Hudson n''est PAS un simple désaccord académique — c''est une GUERRE DE PARADIGMES
  (lecture économique vs lecture philologique)'
- 'Sujet immergé #2 : le terme ''amargi'' est un ''Rorschach idéologique'' (Hudson) — chaque époque projette ses valeurs'
- 'Sujet immergé #3 : la DISTINCTION agri/commercial est la clé — Sumer avait un système à deux vitesses (protection paysan-soldat,
  enrichissement marchand)'
- 'Sujet immergé #4 : la DISPARITION après 1400 av. prouve que l''andurarum était lié à une configuration politique SPÉCIFIQUE
  (royauté paléo-babylonienne), pas un universel'
- 'Sujet immergé #5 : la ''leçon pour aujourd''hui'' est plus compliquée que le récit Hudson — une société peut annuler des
  dettes privées sans résoudre structurellement le problème de l''endettement'
- 'Mnemolite INDEXEE pour Andurarum : 2 memoires identiques (doublon). Cette quintessence = memoire source. Le verdict ''base
  non indexee'' est INVALIDE.'
- 'Cross-references Mnemolite integrees : 1 memoires directes ou d''enrichissement'
