enquete_id: andurarum_autopsy
complexity: APEX
date_extraction: '2026-06-07'
enquete_source: investigations/2026-06-03_sumer_article/2026-06-04_14-30_andurarum_autopsy_INVESTIGATION.md
these_centrale: 'L''andurarum (amargi sumérien) — pilier central de la thèse dette de l''article — est une RUPTURE entre le
  récit Graeber/Hudson (annulation générale, politique macroéconomique) et les sources assyriologiques primaires (Charpin
  : restauration du statut d''origine, rituel de légitimation). Shadow Factor révisé : 5.8×.'
theses_implicites:
- L'andurarum n'est PAS une 'annulation générale des dettes' mais un édit qui restaure l'ordre COSMIQUE perturbé (Charpin,
  Collège de France)
- Seules les dettes AGRICOLES de subsistance étaient annulées ; les dettes COMMERCIALES (tamkārum) étaient EXCLUES (Ammisaduqa,
  ~1646 av.)
- La fréquence de 30 édits en 1000 ans = 1 tous les 33 ans, comparable aux crises financières françaises (1/30-40 ans)
- L'andurarum DISPARAÎT après 1400 av. sans laisser de trace — incompatible avec un 'mécanisme central de la civilisation'
- Hudson n'est PAS assyriologue — il s'appuie sur les traductions de Kraus. Charpin lit les tablettes directement
- Le terme 'amargi' est un 'Rorschach idéologique' (Hudson) — libertariens (Hayek Society, Liberty Fund), gauche radicale
  (CADTM), tous se l'approprient
faits_atomiques:
- id: F-001
  enonce: 'Ammisaduqa (1646 av., édit le mieux préservé) : annule les dettes privées en argent et grain si elles résultent
    de prêts. EXCLUT explicitement les dettes des commerçants (tamkārum)'
  source_url: https://en.wikipedia.org/wiki/Ammisaduqa
  source_section: §2
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-002
  enonce: 'Terme sumérien ama.ar.gi = ''retour à la mère/origine'' (ama = mère, ar = retour, gi = réclamer/rendre). Traduction
    littérale : retour à l''état originel'
  source_url: https://shs.cairn.info/revue-d-assyriologie-2008-1-page-149
  source_section: §1
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-003
  enonce: 'Akkadien : deux termes distincts. Andurarum = ''liberté'' (racine : se déplacer librement, comme l''eau). Misharum
    = ''justice/équité'' (racine sémitique YSR/ISHAR)'
  source_url: https://en.wikipedia.org/wiki/Andurarum
  source_section: §1
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-004
  enonce: 30 annulations identifiées avec certitude entre 2400 et 1400 av. (Hudson, Kraus, CADTM). 1 édit tous les 33 ans
    en moyenne
  source_url: https://www.cadtm.org/The-Long-Tradition-of-Debt
  source_section: §3
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-005
  enonce: Aucun édit andurarum connu APRÈS 1400 av. — coïncide avec l'effondrement de l'âge du bronze. Incompatible avec un
    'mécanisme central'
  source_url: https://en.wikipedia.org/wiki/Bronze_Age_collapse
  source_section: §3
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-006
  enonce: 'Charpin (Collège de France, cours 2022) : ''L''andurârum, qu''il faut comprendre comme le retour au statut d''origine
    : cette mesure royale annulait les dettes... Il ne s''agissait pas de mesures de progrès social : rien de plus étranger
    au monde mésopotamien que la réforme au sens des réformistes modernes'''
  source_url: https://shs.cairn.info/revue-d-assyriologie-2008-1-page-149
  source_section: §4
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-007
  enonce: 'Charpin : ''Le mot ne peut être employé que comme lorsqu''il s''agit de réformes religieuses : l''andurârum témoigne
    de la volonté de revenir à ce qu''on croyait être la perfection des origines'' (Collège de France, 21 février 2022)'
  source_url: https://shs.cairn.info/revue-d-assyriologie-2008-1-page-149
  source_section: §4
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-008
  enonce: Hudson (2024, Modern Misinterpretations) reconnaît que 'amargi sert de test de Rorschach idéologique reflétant les
    croyances du traducteur' — mais n'applique pas la critique à sa propre lecture
  source_url: https://michael-hudson.com/2024/modern-misinterpretations-of-ancient-debt-cancellation/
  source_section: §1
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-009
  enonce: 'Wikipedia (History of debt relief) : ''Usually only personal debt was cancelled, whereas debts incurred by merchants
    were unaffected'''
  source_url: https://en.wikipedia.org/wiki/History_of_debt_relief
  source_section: §2
  head_status: 200
  tier: 1
  glyphe: ✦
- id: F-010
  enonce: 'Récupération politique d''amargi : libertariens américains (Hayek Society LSE, logo officiel), Liberty Fund, Samuel
