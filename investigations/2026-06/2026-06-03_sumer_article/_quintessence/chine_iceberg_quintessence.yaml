enquete_id: chine_iceberg
complexity: APEX
date_extraction: '2026-06-07'
enquete_source: investigations/2026-06-03_sumer_article/2026-06-03_14-45_chine_v2_ICEBERG_MAX_CONTRE_RAPPORT.md
these_centrale: L'investigation Chine V1 surestime 5 continuités (keju-méritocratie, Song-richesse, absence propriété, efficacité
  greniers, Jiaozi monnaie) et omet 6 angles morts majeurs (Tiananmen, Grand Firewall, parti-État, miracle économique, femmes,
  fourchette GLF). Le Shadow Factor passe de 3.2× à 3.8×.
theses_implicites:
- Le keju n'était PAS une méritocratie universelle — il FILTRAIT par classe sociale au moins autant qu'il ne SÉLECTIONNAIT
  par compétence (Elman 2000)
- 'Song = PIB/hab leader mondial est CONTESTÉ (Broadberry 2015 : parité ou infériorité avec l''Europe)'
- Pas de propriété privée en Chine est TROP ABSOLU — il existait des droits fonctionnels (chengbang/subsoil) à partir des
  Ming tardifs
- 'Greniers ever-normal : efficaces par périodes (1700-1780) mais CORRUPTION massive, effondrement au XIXe siècle (Will 1991)'
- Jiaozi = certificat de dépôt convertible, PAS une monnaie fiduciaire moderne — le vrai équivalent BdF est le huizi (1160)
  ou le baochao Yuan (1260)
