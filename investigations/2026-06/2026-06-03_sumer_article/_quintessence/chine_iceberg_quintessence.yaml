causalites:
- cause: F-001
  effet: F-007
  mecanisme: Keju = sélection par classe sociale (Elman) → la 'mérite' réelle est un fantasme → Tiananmen 1989 (la vraie mobilité
    est par la rue, pas le concours)
- cause: F-004
  effet: F-011
  mecanisme: Greniers corrompus (XIXe) → famines récurrentes (Lotus Blanc, Taiping, GLF) — le mécanisme préventif n'a pas
    tenu
perspectives_dialectiques:
- position: Chine comme anti-modèle démocratique
  argument: Grande Firewall, Tiananmen, parti-État, SCS = différences RADICALES avec la France démocratique
- position: Chine comme modèle de continuité
  argument: 2000 ans d'administration continue, 800M de personnes sorties de la pauvreté en 40 ans — la France n'a pas ces
    records
- position: 'Synthèse : convergence bureaucratique, divergence politique'
  argument: Les parallèles fonctionnels (keju/INSP, Jiaozi/BdF, greniers/PAC) sont réels au niveau des INSTRUMENTS. Au niveau
    des FONDEMENTS politiques, la Chine autoritaire et la France démocratique divergent totalement
limites:
- 'Biais orientaliste : 0 source en chinois, 0 en russe/arabe/japonais'
- Sources sinologiques occidentales (Elman, Kuhn, Spence) ont leur propre agenda
- Données chinoises modernes (dette, Gini) officielles potentiellement manipulées
- 6 lièvres + 6 loups = EDI* révisé 0.40 (sous seuil APEX 0.50)
wolves:
- nom: Voltaire / Quesnay / sinophiles XVIIIe
  argument: Le keju est un modèle universel de méritocratie
  reponse: 'Elman 2000 : reproduction sociale via préparation longue et coûteuse. 1 jinshi / 2-4M habitants'
- nom: Maddison
  argument: Song = leader mondial du PIB/hab
  reponse: 'Broadberry 2015 : parité ou infériorité européenne. Données ±50-100%'
- nom: État chinois / PCC
  argument: Le SCS est un système intégré et performant
  reponse: 'Werbach 2022 : SCS réel = multiples bases, pas un score unique. Restrictions limitées (train/avion)'
- nom: Mao Zedong / GLF apologistes
  argument: Le Grand Bond était un accident, pas une politique
  reponse: 20-55M de morts par idéologie bureaucratique — catastrophe documentée
- nom: Nationalistes chinois
  argument: La Chine a inventé la méritocratie, le papier-monnaie, les greniers
  reponse: Inventions réelles mais isolées du contexte autoritaire et des catastrophes (GLF, Révolution culturelle)
iceberg:
- 'Sujet immergé #1 : Tiananmen 1989 (3-4 juin) — angle mort politique majeur'
- 'Sujet immergé #2 : Grand Firewall (2000-) — censure Internet sans équivalent en France'
- 'Sujet immergé #3 : parti-État (PCC 100M) — France a une fonction publique APOLITIQUE'
- 'Sujet immergé #4 : miracle économique (1978-2024) — 800M sorties de pauvreté, plus grand développement de l''histoire'
- 'Sujet immergé #5 : la fourchette GLF (15-55M) — le chiffre 20-30M est conservateur'
- 'Sujet immergé #6 : biais des sources (100% occidentales) — perspective chinoise absente'
