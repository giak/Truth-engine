enquete_id: chine_v1
complexity: APEX
date_extraction: '2026-06-07'
enquete_source: investigations/2026-06-03_sumer_article/2026-06-03_14-00_chine_vs_france_INVESTIGATION.md
these_centrale: La Chine a résolu ou expérimenté avant la France 5 mécanismes institutionnels majeurs (méritocratie de concours,
  papier-monnaie d'État, stabilisation des prix, monopoles stratégiques, code administratif) avec une avance de 700 à 2350
  ans, mais ces parallèles sont des CONVERGENCES INDÉPENDANTES, pas des filiations — sauf pour le keju (Voltaire/physiocrates,
  XVIIIe).
theses_implicites:
- Le keju (examen impérial, ~605 ap.) est l'ancêtre CONCEPTUEL de la méritocratie administrative française, transmis via Voltaire
  et Quesnay (sinophiles)
- Le Jiaozi (~1024, Song) est le premier papier-monnaie d'État au monde, 780 ans avant la Banque de France (1803)
- Les greniers ever-normal (~400 av.) sont le premier système étatique de stabilisation des prix, 2350 ans avant la PAC (1962)
- La Chine impériale n'avait PAS de propriété privée au sens romain (dominium) — un fait qui peut expliquer partiellement
  l'absence de révolution industrielle endogène
- Le Grand Bond en Avant (1959-1961) a tué 20-30 millions de personnes — la plus grande famine en temps de paix de l'histoire
  humaine
- La Chine moderne (dette locale 290% PIB, SCS, parti-État) a conservé la structure bureaucratique impériale sous une forme
  communiste
