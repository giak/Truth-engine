perspectives_dialectiques:
- position: Thèse continuiste (la Chine a montré la voie)
  argument: 5 mécanismes (concours, monnaie, greniers, code, monopole) précèdent la France de 700-2350 ans. Voltaire et Quesnay
    ont importé le modèle
- position: Antithèse sceptique (artefact épistémique)
  argument: Keju (lettrés) ≠ INSP (gestionnaires) ; Jiaozi (billet de crédit) ≠ BdF (institution moderne). Convergences indépendantes,
    pas filiations
- position: 'Synthèse : piège bureaucratique commun'
  argument: Les deux États partagent hypertrophie bureaucratique, méritocratie de concours, dette publique accumulée. Trajectoire
    décalée mais parallèle
limites:
- 'Biais orientaliste : 0 source en chinois, 0 en russe/arabe/japonais'
- Données chinoises modernes opaques (censure, manipulation)
- Population chinoise historique débattue (Ming 60-200M selon sources)
- 'Comparaison asymétrique : Chine impériale 2000+ ans vs France 200 ans depuis 1789'
wolves:
- nom: Voltaire / sinophiles XVIIIe
  argument: Le keju est un modèle de méritocratie universelle
  reponse: Keju formait des LETTRÉS (mémorisation confucéenne), pas des gestionnaires. Taux jinshi ~1/2-4M habitants
- nom: Maddison (économie historique)
  argument: Chine Song = PIB/hab le plus élevé au monde
  reponse: 'Broadberry (2015) conteste : parité ou infériorité européenne. Données ±50-100%'
- nom: Polanyi / redistributeurs
  argument: Temple redistributeur = sécurité sociale antique
  reponse: 'Silver 2007 : marchés privés existaient ; redistribuait à personnel, pas population'
- nom: État chinois moderne
  argument: SCS = Big Brother totalitaire
  reponse: 'Werbach 2022 : SCS réel = système de crédit + sanctions, pas un score social unique. Mais potentiel d''extension
    réel'
- nom: Idéologues du 'modèle chinois'
  argument: Le SCS est efficace, la Chine l'a prouvé
  reponse: 'Piketty 2025 : la Chine est plus inégalitaire que la France (Gini 0.37-0.50 vs 0.29-0.32)'
iceberg:
- 'Sujet immergé #1 : la Chine a testé le ''rule by law'' (fazhi) pendant 2000 ans, jamais ''rule of law'' (rule of law implique
  que la loi contraint le souverain)'
- 'Sujetimmergé #2 : pas de propriété privée romaine — conséquence possible : pas de bourgeoisie indépendante, pas de révolution
  industrielle endogène'
- 'Sujet immergé #3 : Tiananmen 1989 (3-4 juin) — absent de V1, omission politique majeure'
- 'Sujet immergé #4 : Grand Firewall (2000-) — censure Internet, sans équivalent en France'
- 'Sujet immergé #5 : parti-État (PCC 100M membres) — fusion bureaucratie/parti, France a une fonction publique APOLITIQUE'
- 'Sujet immergé #6 : miracle économique (1978-2024) — 800M de personnes sorties de la pauvreté, plus grand développement
  de l''histoire humaine'
- 'Mnemolite INDEXEE pour Chine : 12 memoires (tag=chine), dont cette v1. Le verdict ''base non indexee'' est INVALIDE.'
- 'Cross-references Mnemolite integrees : 1 memoires directes ou d''enrichissement'
