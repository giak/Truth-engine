these_centrale: "Les civilisations americaines precolombiennes (Caral 2600 BCE, Olmèque, Maya, Teotihuacan, Inca, Aztèque) constituent le refutateur en chef de la these dette/droit/morale: l empire inca a fonctionne avec ZERO monnaie, ZERO dette monetaire et ZERO marché, tout en developpant une bureaucratie sophistiquee, un impôt-travail (mit a), un réseau routier de 40 000 km et une redistribution etatique integrale, ce qui prouve que l integration sociale est un universel humain et non un mecanisme dependant de la dette."

theses_implicites:
  - "L absence totale de contact avec l Ancien Monde avant 1492 invalide toute these de transmission/filiation civilisationnelle entre continents et impose de traiter l integration comme un phenomene convergent independant."
  - "La capture du pouvoir peut s exercer SANS dette monetaire: l empire inca l a prouve par le monopole d information (quipu illisible sans formation specialisee), le monopole foncier (Sapa Inca proprietaire de toute terre) et le tribut en nature (azteque)."
  - "L exclusion des Ameriques du recit civilisationnel dominant releve d un biais structurel (eurocentrisme epistemique) et non d un simple oubli, ce que confirme le shadow factor 6,4 soit le plus eleve de toutes les enquetes de l article."

faits_atomiques:
  - id: "F-AM001"
    enonce: "La civilisation de Caral (Perou) est la plus ancienne des Ameriques (environ 2600 avant J.-C.), contemporaine des pyramides d Egypte, avec des quipus proto-documentes et aucune dette monetaire connue."
    source_url: "https://en.wikipedia.org/wiki/Caral%E2%80%93Supe_civilization"
    source_section: "§11 F001"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM002"
    enonce: "L economie de l empire inca (Tawantinsuyu, environ 1200-1532) ne possedait aucune monnaie, aucun marche et aucune dette monetaire au sens occidental: le troc et la redistribution imperiale remplaçaient l echange marchand."
    source_url: "https://en.wikipedia.org/wiki/Economy_of_the_Inca_Empire"
    source_section: "§11 F002"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM003"
    enonce: "Le mit a etait un impôt-travail rotationnel obligatoire: chaque foyer devait un certain nombre de jours de travail a l Etat en echange de nourriture, vetements et logement en periode de disette, sans possibilite d endettement pour acquitter l impôt."
    source_url: "https://en.wikipedia.org/wiki/Mita_(Inca)"
    source_section: "§11 F003"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM004"
    enonce: "Le principe ayni designe la reciprocite andine (donne et recoit) comme obligation sociale, distincte de la dette contractuelle occidentale; il s inscrit dans le triptyque ayni/minka/mit a qui structure la vie economique andine."
    source_url: "https://en.wikipedia.org/wiki/Ayni"
    source_section: "§11 F004"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM005"
    enonce: "Le Qhapaq Nan representait 40 000 km de routes pavees, soit le plus long reseau routier de toutes les civilisations etudiees, avec des tambos (relais logistiques) espaces d environ 20 km."
    source_url: "https://en.wikipedia.org/wiki/Inca_road_system"
    source_section: "§11 F005"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM006"
    enonce: "Le quipu etait un systeme comptable decimal positionnel (base 10) a cordelettes nouees, permettant addition, soustraction, multiplication, division, recensement exhaustif de la population et enregistrement des obligations fiscales; environ 1 400 exemplaires subsistent."
    source_url: "https://en.wikipedia.org/wiki/Quipu"
    source_section: "§11 F006"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM007"
    enonce: "Les quipucamayocs constituaient une caste specialisee de comptables formes dans les yachay wasi (ecoles d Etat), detenant un monopole effectif sur le savoir comptable en l absence d ecriture phonetique."
    source_url: "https://en.wikipedia.org/wiki/Quipucamayoc"
    source_section: "§11 F007"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM008"
    enonce: "L empire aztque (1325-1521) utilisait le cacao et les tissus de coton comme monnaie, percevait un tribut en nature (mais, cacao, plumes, or) et developpait un corps de marchands longue distance appeles pochtecas; aucun pret a interet compose documente."
    source_url: "https://en.wikipedia.org/wiki/Pochteca"
    source_section: "§11 F008"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM009"
    enonce: "La civilisation maya (environ 2000 avant J.-C. - 900 apres J.-C.) developpa un systeme d ecriture glyphique, le zero mathematique, un calendrier sophistique et un systeme juridique integrant droit civil, penal et religieux avec des peines variables selon le statut social."
    source_url: "https://en.wikipedia.org/wiki/Maya_civilization"
    source_section: "§11 F009"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM010"
    enonce: "Tenochtitlan, capitale aztque, comptait plus de 200 000 habitants en 1519, ce qui en faisait l une des plus grandes villes du monde a la veille de la conquete espagnole."
    source_url: "https://en.wikipedia.org/wiki/Tenochtitlan"
    source_section: "§11 F010"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM011"
    enonce: "La civilisation olmeque (environ 1500-400 avant J.-C.) est consideree comme la culture mere de la Mesoamerique: ecriture glyphique, calendrier, pratiques commerciales et religieuses structurees."
    source_url: "https://en.wikipedia.org/wiki/Olmec"
    source_section: "§11 F011"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM012"
    enonce: "Aucune source ne documente l existence d un pret a interet compose dans les civilisations americaines precolombiennes, qu il s agisse de l espace andin (Inca) ou de la Mesoamerique (Aztèque, Maya)."
    source_url: ""
    source_section: "§11 F012"
    head_status: null
    tier: 2
    glyphe: "❧"

  - id: "F-AM013"
    enonce: "Teotihuacan (environ 100-650 apres J.-C.) etait la plus grande ville des Ameriques precolombiennes avec quelque 125 000 habitants au pic de son extension, precede par les pyramides du Soleil et de la Lune."
    source_url: "https://en.wikipedia.org/wiki/Teotihuacan"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM014"
    enonce: "Le Sapa Inca etait considere comme le proprietaire divin de toute terre de l empire Tawantinsuyu, detenant une centralite politique absolue (1,0) sur les 10 millions de sujets."
    source_url: "https://en.wikipedia.org/wiki/Tawantinsuyu"
    source_section: "§9"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM015"
    enonce: "Les chasquis etaient des messagers professionnels capables de transmettre un message sur 250 miles par jour le long du Qhapaq Nan, formant un reseau d information rapide au service de l administration imperiale."
    source_url: "https://en.wikipedia.org/wiki/Chasqui"
    source_section: "§3 NETWORK"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM016"
    enonce: "Les tambos, relais espaces d environ 20 km le long du Qhapaq Nan, servaient de points logistiques pour l armee, l administration et le transport des marchandises redistribuees par l Etat."
    source_url: "https://en.wikipedia.org/wiki/Inca_road_system"
    source_section: "§8E"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM017"
    enonce: "La civilisation mississippienne (Cahokia, vers 1100 apres J.-C.) reunissait quelque 20 000 habitants et constitue un cas de societe complexe am ericaine non traite dans l enquete."
    source_url: ""
    source_section: "§13"
    head_status: null
    tier: 2
    glyphe: "❧"

  - id: "F-AM018"
    enonce: "Le tribut aztèque etait paye en nature (mais, cacao, tissus, plumes, or) par les provinces conquises, stocke dans des entrepots centraux, puis redistribue par l Etat mexica."
    source_url: "https://en.wikipedia.org/wiki/Pochteca"
    source_section: "§8C"
    head_status: 200
    tier: 1
    glyphe: "✦"

  - id: "F-AM019"
    enonce: "La conquete espagnole provoque la mort d environ 90 pour cent de la population amerindienne, du fait des epidemies, des guerres et du systeme de l encomienda."
    source_url: ""
    source_section: "§12 LOUPS"
    head_status: null
    tier: 2
    glyphe: "❧"

  - id: "F-AM020"
    enonce: "Francisco Pizarro capture l empereur Atahualpa en 1532, marquant la fin de l empire inca et le debut de la domination espagnole sur le Tawantinsuyu."
    source_url: ""
    source_section: "§7"
    head_status: null
    tier: 2
    glyphe: "❧"

  - id: "F-AM021"
    enonce: "Christophe Colomb arrive dans le Nouveau Monde en 1492, date marquant le premier contact documente entre les civilisations de l Ancien Monde et celles des Ameriques."
    source_url: ""
    source_section: "§7"
    head_status: null
    tier: 2
    glyphe: "❧"

  - id: "F-AM022"
    enonce: "L empire inca (Tawantinsuyu) rassemblait environ 10 millions d habitants au moment de la conquete espagnole, soit une population superieure a la majeure partie des royaumes europeens contemporains."
    source_url: "https://en.wikipedia.org/wiki/Tawantinsuyu"
    source_section: "§5"
    head_status: 200
    tier: 1
    glyphe: "✦"

