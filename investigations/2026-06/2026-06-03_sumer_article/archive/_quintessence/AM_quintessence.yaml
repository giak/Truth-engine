causalites:
  - cause: "F-AM002"
    effet: "F-AM003"
    mecanisme: "L absence de monnaie dans l economie inca interdit l impôt monetaire et impose le mit a comme impôt-travail, evitant tout endettement fiscal."

  - cause: "F-AM006"
    effet: "F-AM007"
    mecanisme: "Le quipu, systeme comptable illisible sans formation, cree une barriere a l entree qui favorise l emergence d une caste de specialistes (quipucamayocs) detenant un monopole informationnel."

  - cause: "F-AM002"
    effet: "F-AM022"
    mecanisme: "L efficacite de la redistribution etatique sans monnaie permet de soutenir une population d environ 10 millions d habitants sans crise fiscale."

  - cause: "F-AM021"
    effet: "F-AM019"
    mecanisme: "Le contact de 1492 introduit des pathogenes (variole, rougeole) et declenche une conquete militaire entrainant une mortalite de l ordre de 90 pour cent."

  - cause: "F-AM005"
    effet: "F-AM015"
    mecanisme: "Le Qhapaq Nan de 40 000 km fournit l infrastructure physique sur laquelle les chasquis peuvent relayer un message de Cusco a 2 500 km en cinq jours."

  - cause: "F-AM003"
    effet: "F-AM006"
    mecanisme: "L enregistrement du mit a sur quipus necessite un systeme comptable standardise, stimulant le developpement et la specialisation du quipu base-10."

perspectives_dialectiques:
  - position: "These: les Ameriques confirment l integration sociale mais refutent la dette comme mecanisme central"
    argument: "L empire inca etait parfaitement integre (Etat, fiscalite, droit, morale) sans dette monetaire; la these large d integration tient, la these specifique dette/morale s effondre."

  - position: "Antithese: les Ameriques invalident la these entiere de l article"
    argument: "Si l integration fonctionne SANS dette (Inca) et que la capture existe AUSSI sans dette (quipucamayocs), alors l article a confondu correlation et causalite en presentant la dette comme mecanisme central."

  - position: "Synthese: reformulation universaliste"
    argument: "Les civilisations americaines prouvent que l integration droit/economie/morale est un universel humain independant de la dette; la dette est un mecanisme parmi d autres (mit a, tribut, monopole informationnel) et non le mecanisme central."

limites:
  - "La civilisation mississippienne (Cahokia, environ 20 000 habitants vers 1100) n est pas traitee dans l enquete."
  - "Les societes pueblo (Chaco Canyon) et les societes amazoniennes (complexes sans Etat centralise) sont exclues du perimetre."
  - "Les sources europeennes (chroniqueurs espagnols) sont affectees par un biais de conquete: elles tendent a presenter l economie inca comme exotique ou primitive."
  - "Les quipus ne sont que partiellement dechiffres; leurs composantes non numeriques (histoire, lois) restent inaccessibles."
  - "L acces a l archeologie andine recente et aux sources en quechua, nahuatl et maya est limite dans l enquete."

wolves:
  - nom: "Sapa Inca comme loup capture"
    argument: "Le monarque absolu a la tete d une economie planifiee sans monnaie represente la forme la plus extreme de capture verticale jamais observee."
    reponse: "La capture verticale inca est compensee par la redistribution en periode de disette et par l impôt-travail qui n endette pas; le contrat social andin differe structurellement de la capture par la dette de l Ancien Monde."

  - nom: "Quipucamayocs comme caste informationnelle"
    argument: "La caste des comptables detenait un monopole de l information economique, comparable aux scribes mesopotamiens ou aux mandarins chinois."
    reponse: "La capture informationnelle inca opere SANS ecriture phonetique, donc SANS dette contractuelle; elle releve d un monopole technique sur un code comptable inaccessible, distinct du monopole juridique-crediteur de l Ancien Monde."

  - nom: "Conquistadors comme destruction violente"
    argument: "La conquete espagnole detruit 90 pour cent de la population amerindienne et efface des systemes politiques alternatifs, contaminant toute description externe."
    reponse: "Le biais de conquete est reconnu (L4, L6) et contrebalance par l archeologie; l effet de la conquete renforce la these d invisibilisation epistemique des Ameriques dans l article."

  - nom: "Historiens occidentalocentristes"
    argument: "Les historiens occidentaux invisibilisent les Ameriques dans les recits de civilisation, perpetuant le biais de l Ancien Monde."
    reponse: "Le shadow factor 6,4 documente precisement ce biais; les sources comme Murra, Rostworowski et Urton sont referencees (score de suspicion 0,75-0,80) comme contre-poids."

iceberg:
  - "La question du quipu narratif: les quipus encodaient-ils des informations non numeriques (histoires, lois, genealogies) qui pourraient reveler un droit ecrit sans ecriture phonetique?"
  - "Les societes andines pre-incas (Chavin, Moche, Nazca, Wari, Tiwanaku) ont-elles experimente des formes de dette avant l unification inca?"
  - "L impact des epidemies pre-contact sur l effondrement maya classique reste mal calibre et pourrait expliquer une partie de la decadence."
  - "L economie politique de l Empire espagnol: dans quelle mesure les systemes de l encomienda et de la mita miniere sont-ils des reformulations de la mit a precolombienne au service de l accumulation monetaire?"
  - "Resultat Mnemolite: zero memoire indexee pour les requetes Inca quipu mit a, Ameriques precolombiennes Azteque Maya tribut, Caral pyramides civilisation andine, Qhapaq Nan routes chasquis (4/4 requetes vides) - le sujet est neuf dans la base vectorielle du projet."

