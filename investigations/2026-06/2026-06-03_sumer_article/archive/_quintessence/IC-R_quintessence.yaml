causalites:
  - cause: "F-IC-R001"
    effet: "F-IC-R015"
    mecanisme: "L'assimilation inexacte nexum/prison pour dette nourrit la these de la 'matrice' directe Rome-France, qui s'effondre des lors qu'on reintroduit les ruptures reelles (perte du CJC, double France, Revolution)."
  - cause: "F-IC-R002"
    effet: "F-IC-R013"
    mecanisme: "La meconnaissance du debat savant sur le nexum revele une tendance de l'enquete V1 a figer des institutions romaines en categories modernes, prelude a la meme operation sur le CJC."
  - cause: "F-IC-R003"
    effet: "F-IC-R010"
    mecanisme: "La lecture politique/elective du cursus honorum aurait du signaler l'asymetrie electorale entre Rome (cite aristocratique) et France (Etat-nation democratique), asy metrie qui contredit directement la these d'une matrice commune."
  - cause: "F-IC-R004"
    effet: "F-IC-R007"
    mecanisme: "La minoration de l'annona a 200 000 privilegies masque que l'economie romaine reposait sur 30-40 % d'esclaves : l'etude selective des institutions a vocation 'sociale' cache la realite productive."
  - cause: "F-IC-R006"
    effet: "F-IC-R012"
    mecanisme: "L'assimilation prematuree Tiberie/subprimes empeche de voir que les interventions etatiques romaines en matiere economique (Edit du Maximum) ont echoue la ou les mecanismes francais contemporains ont, pour l'instant, reussi."
  - cause: "F-IC-R007"
    effet: "F-IC-R008"
    mecanisme: "L'omission de l'esclavage (Loup #1) prive l'enquete de la cle de l'economie, du droit et de la morale romaines : c'est le biais le plus grave, qui rejaillit sur la solidite de tous les paralleles."
  - cause: "F-IC-R009"
    effet: "F-IC-R015"
    mecanisme: "L'absence de la question feminine empeche de voir que la France a INVENTE l'egalite politique (1944) plutot qu'elle ne l'a heritee de Rome."
  - cause: "F-IC-R011"
    effet: "F-IC-R014"
    mecanisme: "L'omission des publicani aurait permis de montrer que la France a resolu un probleme romain (la corruption de la ferme fiscale) par une innovation institutionnelle radicale : l'administration directe d'Etat."

perspectives_dialectiques:
  - position: "These : Rome est la matrice directe des institutions francaises"
    argument: "Le Corpus Juris Civilis, le cursus honorum, l'annona et la lex Poetelia Papiria constituent une filiation lineaire dont le Code civil francais (1804) est l'heritier direct."
  - position: "Antithese : La filiation est reconstruite et selective"
    argument: "Quatre ruptures majeures (perte du CJC, double France coutumiere/ecrite, Revolution, codification napoleonienne) et six angles morts (esclavage, femmes, citoyennete, publicani, Diocletien, reception medievale) separent structurellement les deux ordres juridiques."
  - position: "Synthese : Continuite medievale, ruptures modernes"
    argument: "La France medievale (XIe-XVe siecles) a effectivement reimporte le droit romain par Bologne, mais la France moderne (1789-1804) a refonde le droit sur des principes universels qui rompent avec la logique romaine d'ordres juridiques hierarchises."

limites:
  - "Aucun fait de l'enquete V1 (source du contre-rapport) ne s'appuie sur une URL primaire verifiee : toutes les sources sont des references bibliographiques classiques (Tite-Live, Tacite, Ciceron, Justinien) qui necessiteraient un renvoi a des editions critiques pour passer du tier 3 au tier 1."
  - "Le contre-rapport ne quantifie pas systematiquement l'ampleur de l'esclavage romain hors d'Italie (provinces gauloise, espagnole, orientale) : la focale reste mediterraneenne-italique."
  - "La question de la datation de la lex Poetelia Papiria (326 ou 313 av. J.-C.) reste traitee brievement et l'enquete V1 ne tranche pas."
  - "Le role exact de la jurisprudence intermediaire (glossateurs, commentateurs, humanisme juridique) entre Justinien et Pothier n'est pas detaille : 700 ans de mediation juridique sont resumes en quatre mots."
  - "Aucun acces Mnemolite : recherches 'Rome droit Justinien Corpus biais', 'esclavage Rome annona publicani', 'cursus honorum INSP magistrature' ont toutes retourne zero resultat, ce qui interdit tout croisement automatique avec d'autres enquetes du projet."

wolves:
  - nom: "Defenseur d'une filiation directe Rome-Code civil"
    argument: "Les juristes medievalux ont transmis un patrimoine structure, le Code civil de 1804 s'inscrit dans cette lignee savante, donc la France a recu le flambeau de Rome."
    reponse: "La transmission medievale est elle-meme une red ecouverte partielle (seul le Digeste a ete retrouve vers 1070), filtree par 700 ans d'interpretation et concurrencee par les coutumes du Nord. Pothier est mediate, Justinien n'est pas source directe."
  - nom: "Defenseur de la these 'l'Etat-providence romain est une matrice'"
    argument: "L'annona distribuait du ble gratuit a 200 000 personnes, c'est la preuve d'une politique sociale systematique prefigurant la protection sociale contemporaine."
    reponse: "200 000 hommes adultes citoyens sur 1 million d'habitants (femmes, enfants, esclaves et peregrins exclus) ne constituent pas une solidarite universelle : c'est un privilege civique masculin, voire un instrument de clientelisme politique (cf. lex Clodia de frumentaria, 58 av.)."
  - nom: "Defenseur de l'identite 'esprit des lois' France-Rome"
    argument: "La France a conserve la passion romaine pour la codification, la juridicite de l'action publique, le gout du droit ecrit, l'attachement a l'Etat administrateur."
    reponse: "Ces traits sont communs a toute tradition juridique savante (cf. Allemagne, Italie) et n'etablissent pas une filiation singuliere France-Rome. La France pourrait aussi heriter du droit canonique medieval, du droit coutumier germanique, et de la philosophie des Lumieres : il n'y a pas de fatalite romaine."

iceberg:
  - "Sujet immergé #1 : Le role de l'Eglise catholique et du droit canonique comme MEDIATEUR privilegie entre le droit romain antique et le droit francais moderne (decret de Gratien, ~1140) : voie d'entree du droit romain en Gaule independante des glossateurs bolognais."
  - "Sujet immergé #2 : Les colonies et provinces romaines (Gaule, Hispanie, Afrique du Nord) comme LABORATOIRES juridiques ou s'invente un 'droit romain vulgaire' distinct du droit classique : le droit francais pourrait heriter davantage de ce vulgus que du CJC de Justinien."
  - "Sujet immergé #3 : La dimension RACIALE absente de l'esclavage romain est en realite un phenomene complexe (l'affranchissement massif, le metissage, l'ascension sociale d'affranchis) : la France pourrait avoir importe la ROMANITE de l'esclavage (esclavage colonial atlantique du XVIIe-XIXe siecle) sans pour autant heriter du mode de production esclavagiste antique."
  - "Resultat Mnemolite : recherches 'Rome droit Justinien Corpus biais', 'esclavage Rome annona publicani', 'cursus honorum INSP magistrature' ont toutes retourne zero resultat ; le RAG vectoriel du projet ne contient pas encore de memoire exploitable sur l'Antiquite romaine et le contre-rapport beneficierait d'un amorcage (bootstrap) du corpus Cicero, Tacite, Tite-Live."

chronologie:
  - date: "-326"
    evenement: "Lex Poetelia Papiria (datation alternative : -313) : abolition du nexum selon Tite-Live (Ab Urbe Condita 8.28) et Varron, contenu exact debattu par les historiens du droit romain."
    source_fait: "F-IC-R001"
  - date: "-58"
    evenement: "Lex Clodia de frumentaria : instauration de la gratuite du ble a Rome, explosion des effectifs inscrits a la distribution et logique de clientelisme politique."
    source_fait: "F-IC-R005"
  - date: "33"
    evenement: "Crise financiere sous Tibere : rappel force des credits provinciaux, effondrement des prix fonciers italiens, pret imperial de 100 millions de sesterces sans interet sur 3 ans (Tacite, Annales 6.16-17)."
    source_fait: "F-IC-R006"
  - date: "212"
    evenement: "Constitutio Antoniniana de Caracalla : extension de la citoyennete romaine a tous les habitants libres de l'Empire, mettant fin a la stricte hierarchie cives/peregrini."
    source_fait: "F-IC-R010"
  - date: "301"
    evenement: "Edit du Maximum de Diocletien : plafonnement d'environ 1 200 prix sous peine de mort, echec retentissant, abandonne en 305 apres la mort de l'empereur."
    source_fait: "F-IC-R012"
  - date: "529"
    evenement: "Compilation du Corpus Juris Civilis par Justinien a Constantinople (Codex 529, Digesta et Institutiones 533, Novellae 534) : jamais applique en Gaule."
    source_fait: "F-IC-R013"
  - date: "600"
    evenement: "Disparition du CJC en Occident : plus aucun manuscrit complet jusqu'au XIe siecle, pendant environ 470 ans."
    source_fait: "F-IC-R013"
  - date: "1070"
    evenement: "Red ecouverte des Digesta de Justinien a Bologne par Irnerius, fondation de l'ecole des glossateurs et renaissance du droit romain savant."
    source_fait: "F-IC-R013"
  - date: "1789"
    evenement: "Declaration des droits de l'homme et du citoyen : refondation du droit francais sur les principes d'egalite, rupture avec la logique romaine d'ordres juridiques."
    source_fait: "F-IC-R015"
  - date: "1804"
    evenement: "Code civil napoleonien : synthese des traditions romaine, coutumiere du Nord et revolutionnaire, sous la mediation de Pothier (1699-1772)."
    source_fait: "F-IC-R014"
  - date: "1944"
    evenement: "Droit de vote des femmes francaises : innovation radicale que le droit romain n'avait jamais envisagee pour les citoyennes de seconde zone."
    source_fait: "F-IC-R009"
  - date: "1948"
    evenement: "Creation de la Direction generale des impots francaise (DGI) : administration directe d'Etat, rupture avec la logique romaine de la ferme fiscale (publicani)."
    source_fait: "F-IC-R011"

