these_centrale: "Le parallele Rome/France tel que presente dans l'enquete V1 repose sur quatre comparaisons categoriellement inexactes (nexum, cursus honorum, annona, crise de 33 ap.) et omet six angles morts determinants (esclavage, femmes, citoyennete, publicani, Diocletien, Corpus Juris), de sorte que la filiation invoquee releve d'une reconstruction savante medievale, non d'une transmission directe."

theses_implicites:
  - "L'enquete V1 surdetermine la continuite institutionnelle en sous-estimant les ruptures structurelles entre la cite romaine et l'Etat-nation francais."
  - "La metaphore de la 'matrice' legitime un comparatisme anachronique : ce qui ressemble formellement n'a pas forcement la meme fonction sociale ni la meme extension demographique."
  - "Le silence sur l'esclavage, les femmes et la stratification juridique n'est pas anodin : il ecrase les points ou la France rompt avec Rome au lieu de la prolonger."
  - "L'operation editoriale 'Rome avait deja tout resolu' releve d'une rhetorique d'auto-legitimation contemporaine projetee sur l'Antiquite."

faits_atomiques:
  - id: "F-IC-R001"
    enonce: "Le nexum romain n'etait pas l'equivalent de la contrainte par corps francaise : le nexum etait une mise en gage du corps comme garantie, le debiteur devenait esclave de son creancier, tandis que la prison pour dette francaise est un mecanisme d'emprisonnement temporaire destine a forcer le paiement."
    source_url: ""
    source_section: "Lievre #1"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R002"
    enonce: "La nature exacte du nexum reste disputee par les historiens du droit romain (Crawford, Watson, Talamanca) : etait-ce une mancipatio sui, une forme de cautionnement, ou un vrai contrat de servitude pour dette ? Wikipedia lui-meme note 'Some modern scholars dispute its existence'."
    source_url: ""
    source_section: "Lievre #1"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R003"
    enonce: "Le cursus honorum formait des magistrats POLITIQUES elus pour un an et non des administrateurs permanents de carriere : la filiation directe avec l'INSP francais, systeme ADMINISTRATIF a concours et carriere longue, releve de l'anachronisme."
    source_url: ""
    source_section: "Lievre #2"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R004"
    enonce: "L'annona romaine distribuait du grain a environ 200 000 adultes males citoyens de Rome, en excluant femmes, enfants, esclaves, peregrins et affranchis non inscrits : ce privilege civique cible n'a aucune commune mesure avec la protection sociale francaise universelle couvrant 68 millions de residents."
    source_url: ""
    source_section: "Lievre #3"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R005"
    enonce: "La lex Clodia de frumentaria (58 av. J.-C.) avait instaure la gratuite du ble : les effectifs inscrits a la distribution ont alors explose, temoignant d'une logique d'assistance plus proche d'un clientelisme politique que d'un Etat-providence."
    source_url: ""
    source_section: "Lievre #3"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R006"
    enonce: "La crise financiere de 33 ap. J.-C. sous Tibere (Tacite, Annales 6.16-17) n'a pas la meme structure qu'une crise des subprimes : pas de titrisation, pas de bulle du credit, crise de liquidite provquee par l'application tardive de la lex Julia de modo credendi, et intervention du tresor imperial et non d'une banque centrale."
    source_url: ""
    source_section: "Lievre #4"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R007"
    enonce: "30 a 40 % de la population d'Italie etait esclave au pic de l'epoque augustee (environ 2 a 3 millions d'esclaves pour 6 a 7,5 millions d'habitants, selon Scheidel) : cette realite est totalement absente de l'enquete V1, alors qu'elle est constitutive de l'economie, de la societe et du droit romains."
    source_url: ""
    source_section: "Loup #1"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R008"
    enonce: "L'esclavage romain representait environ 15 % de la population totale de l'Empire (10 millions d'esclaves pour 60 a 70 millions d'habitants), et il n'etait pas 'racial' comme l'esclavage atlantique : il reposait sur la capture de guerre et la naissance, sans lien avec la couleur de peau."
    source_url: ""
    source_section: "Loup #1"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R009"
    enonce: "Les femmes romaines etaient placees sous tutela mulierum permanente (pere, mari, puis tuteur legal) : pas de droit de vote, pas de magistrature, pas de plaidoirie. Les lois Iulia et Papia Poppaea (18 av., 9 ap.) n'accordaient l'immunite de tutelle qu'aux femmes libres ayant 3 ou 4 enfants : une minorite."
    source_url: ""
    source_section: "Loup #2"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R010"
    enonce: "Avant la Constitutio Antoniniana (212 ap. J.-C., Caracalla), seuls les cives romains jouissaient de la plenitude des droits civils et politiques : les peregrins (majorite de la population libre de l'Empire) n'avaient acces qu'au ius gentium, les Latins a un statut intermediaire, les deditices a presque aucun droit. La France post-1789 a cree une citoyennete universelle la ou Rome maintenait une hierarchie d'ordres."
    source_url: ""
    source_section: "Loup #3"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R011"
    enonce: "Les publicani operaient par ferme fiscale (tax farming) en rachetant aux encheres le droit de collecter les impots en province : le systeme creait une double extorsion (remboursement de l'enchere + profit), denoncee par Ciceron dans les Verrines. La France a institue une administration fiscale directe d'Etat (DGI, 1948)."
    source_url: ""
    source_section: "Loup #4"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R012"
    enonce: "L'Edit du Maximum de Diocletien (301 ap. J.-C.) a plafonne les prix d'environ 1 200 biens et services sous peine de mort : il a engendre penuries, marche noir et disparition des produits, puis a ete abandonne apres la mort de l'empereur (305). La France contemporaine evite cet ecueil par des mecanismes de marche regule."
    source_url: ""
    source_section: "Loup #5"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R013"
    enonce: "Le Corpus Juris Civilis, promulgue par Justinien a Constantinople (529-534 ap. J.-C.), n'a JAMAIS ete applique en Gaule pendant l'Antiquite tardive. Il a ete perdu en Occident apres environ 600 ap. J.-C., pendant pres de 470 ans, jusqu'a sa red ecouverte a Bologne vers 1070 par Irnerius et les glossateurs."
    source_url: ""
    source_section: "Loup #6"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R014"
    enonce: "La France medievale etait divisee entre pays de droit ecrit (Sud, droit romain recu comme coutume generale) et pays de coutumes (Nord, droit germanique/celtique/romain mêle) : le Code civil de 1804 fusionne trois traditions (romaine, coutumiere, revolutionnaire), la romaine n'etant qu'une source parmi d'autres, filtree par Pothier (1699-1772)."
    source_url: ""
    source_section: "Loup #6"
    head_status: null
    tier: 3
    glyphe: "❧"

  - id: "F-IC-R015"
    enonce: "La chronologie de la transmission Rome-Code civil comporte quatre ruptures majeures : perte du CJC (600-1070), double France coutumiere/ecrite, Revolution francaise reinventant le droit a partir des principes (DDHC 1789), codification napoleonienne (1804) synthetisant trois heritages. Le recit 'Rome puis France' est une reconstruction retrospective medievale et non une transmission directe."
    source_url: ""
    source_section: "Faisceau d'indices #2"
    head_status: null
    tier: 3
    glyphe: "❧"

