these_centrale: "La civilisation islamique (VIIe-XIIIe s.) est la civilisation manquante la plus dommageable à l'omission de l'article : elle est simultanément le chaînon manquant de la transmission Rome-Europe via Bagdad, Cordoue et Tolède, et la preuve la plus éclatante de l'intégration systémique droit-religion-économie-politique réalisée par la charia."

theses_implicites:
  - "Le récit linéaire Rome puis 594 ans de vide puis Bologne (1070) est eurocentrique : la transmission réelle du savoir antique passe par Bayt al-Hikma (Bagdad), Cordoue et Tolède, où les textes grecs et latins ont été traduits, conservés et transmis en arabe avant d'être restitués au latin."
  - "L'intégration totale réalisée par la charia (culte, transactions, droit pénal, droit familial, éthique, économie) prouve que l'unification du droit, de la morale et de l'économie n'est pas une particularité de Sumer, Rome ou Chine mais un universel anthropologique des sociétés complexes."
  - "La capture par un corps spécialisé n'est pas un accident de l'histoire européenne : en Islam, les oulémas reproduisent le même schéma de capture que les énarques français ou les scribes sumériens, ce qui transforme la thèse CAPTURE en tendance structurelle de toute société lettrée."

faits_atomiques:
  - id: "F-IN001"
    enonce: "La Bayt al-Hikma (Maison de la Sagesse) a été fondée à Bagdad vers 830 sous le calife al-Ma'mun, et constitue le centre principal de la traduction massive des textes grecs, persans et syriaques vers l'arabe."
    source_url: "https://en.wikipedia.org/wiki/House_of_Wisdom"
    source_section: "FACT_REGISTRY F001"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN002"
    enonce: "La traduction systématique des textes grecs (Aristote, Galien, Ptolémée) en arabe est réalisée du VIIIe au IXe siècle, principalement à Bagdad sous les Abbassides."
    source_url: "https://en.wikipedia.org/wiki/Greek_Contributions_to_the_Islamic_World"
    source_section: "FACT_REGISTRY F002 / §2"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN003"
    enonce: "La charia intègre dans un même cadre normatif le religieux, le juridique, l'économique et le politique depuis le VIIe siècle, réalisant l'intégration systémique la plus complète parmi les civilisations étudiées."
    source_url: "https://en.wikipedia.org/wiki/Sharia"
    source_section: "FACT_REGISTRY F003 / §1"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN004"
    enonce: "Le riba (intérêt et usure) est prohibé par le Coran au VIIe siècle, dans la sourate 2:275-279, ce qui constitue une interdiction permanente de la création de dette à intérêt."
    source_url: "https://en.wikipedia.org/wiki/Riba"
    source_section: "FACT_REGISTRY F004 / §3"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN005"
    enonce: "Le système des diwans organise l'administration abbasside du VIIIe au IXe siècle en cinq départements spécialisés : Kharaj (revenus), Jund (armée), Rasa'il (chancellerie), Barid (postes) et Qudat (justice)."
    source_url: "https://en.wikipedia.org/wiki/Diwan"
    source_section: "FACT_REGISTRY F005"
    head_status: null
    tier: 2
    glyphe: "⁅"

  - id: "F-IN006"
    enonce: "Le vizir (wazir) fonctionne comme chef de l'administration dès le VIIIe siècle, constituant un précurseur structurel du Premier ministre moderne."
    source_url: "https://en.wikipedia.org/wiki/Vizier_(Abbasid_Caliphate)"
    source_section: "FACT_REGISTRY F006"
    head_status: null
    tier: 2
    glyphe: "⁅"

  - id: "F-IN007"
    enonce: "Cordoue constitue un centre majeur de traduction de l'arabe vers le latin du Xe au XIIe siècle, assurant la transmission du savoir antique et islamique vers l'Europe chrétienne."
    source_url: "https://en.wikipedia.org/wiki/Translation_movement_in_Toledo"
    source_section: "FACT_REGISTRY F007 / §2"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN008"
    enonce: "Frédéric II de Sicile (1194-1250) favorise activement la traduction de l'arabe vers le latin, en continuité du mouvement de Tolède."
    source_url: "https://en.wikipedia.org/wiki/Frederick_II,_Holy_Roman_Emperor"
    source_section: "FACT_REGISTRY F008 / §2"
    head_status: null
    tier: 2
    glyphe: "⁅"

  - id: "F-IN009"
    enonce: "La scolastique médiévale (Thomas d'Aquin, Abélard) est influencée aux XIIe-XIIIe siècles par les commentaires d'Avicenne et d'Averroès sur Aristote."
    source_url: "https://en.wikipedia.org/wiki/Thomas_Aquinas"
    source_section: "FACT_REGISTRY F009 / §2"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN010"
    enonce: "Les universités médiévales de Bologne et Paris, fondées au XIIe siècle, sont héritières du modèle d'enseignement islamique (madrasa) et du corpus traduit de l'arabe vers le latin."
    source_url: "https://en.wikipedia.org/wiki/University_of_Bologna"
    source_section: "FACT_REGISTRY F010 / §2"
    head_status: null
    tier: 2
    glyphe: "⁅"

  - id: "F-IN011"
    enonce: "La zakat fonctionne depuis le VIIe siècle comme un impôt religieux obligatoire et un mécanisme structurel de redistribution économique, intégré au système normatif de la charia."
    source_url: "https://en.wikipedia.org/wiki/Zakat"
    source_section: "FACT_REGISTRY F011 / §1"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN012"
    enonce: "La finance islamique développe dès le VIIIe siècle des instruments alternatifs à l'intérêt : sukuk, sakk et murabaha, fondés sur le partage de risque et la détention d'actifs plutôt que sur le prêt à intérêt."
    source_url: "https://en.wikipedia.org/wiki/Islamic_banking_and_finance"
    source_section: "FACT_REGISTRY F012 / §1"
    head_status: null
    tier: 2
    glyphe: "⁅"

  - id: "F-IN013"
    enonce: "Les traducteurs de Tolède, actifs du XIe au XIIIe siècle, jouent un rôle central dans la transmission du savoir antique et arabe vers l'Europe latine, à partir d'une ville reconquise par les chrétiens sur al-Andalus."
    source_url: "https://en.wikipedia.org/wiki/School_of_Toledo_(translators)"
    source_section: "FACT_REGISTRY F013 / §2"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN014"
    enonce: "L'interdiction chrétienne de l'usure, maintenue jusqu'au XVIe siècle, présente une similarité structurelle avec le riba islamique, bien que moins radicale car centrée sur l'annulation ponctuelle des dettes plutôt que sur l'interdiction de leur création."
    source_url: "https://en.wikipedia.org/wiki/Usury"
    source_section: "FACT_REGISTRY F014 / §3"
    head_status: null
    tier: 2
    glyphe: "⁅"

  - id: "F-IN015"
    enonce: "La charia couvre six domaines normatifs indissociables : 'ibadat (culte), mu'amalat (transactions), droit pénal, droit familial, éthique et économie, sans séparation institutionnelle entre ces champs."
    source_url: "https://en.wikipedia.org/wiki/Sharia"
    source_section: "§1"
    head_status: null
    tier: 1
    glyphe: "⁅"

  - id: "F-IN016"
    enonce: "La chaîne de transmission Rome-Europe traverse six étapes documentées : Rome classique et hellénistique, traduction syriaque et persane (Ve-VIIe s.), Bayt al-Hikma (VIIIe-IXe s.), Cordoue et Tolède (Xe-XIIe s.), universités européennes (XIIe-XIIIe s.), Renaissance (XIVe-XVIe s.)."
    source_url: ""
    source_section: "§2"
    head_status: null
    tier: 2
    glyphe: "❧"

  - id: "F-IN017"
    enonce: "Le 'trou' de 594 ans (476-1070) entre la chute de Rome et la redécouverte du droit romain à Bologne est comblé par les traductions arabes passant par l'Espagne islamique : sans Bayt al-Hikma, la restitution du Corpus Juris Civilis à Irnerius n'aurait pas eu lieu dans sa forme complète."
    source_url: ""
    source_section: "§0 / §2"
    head_status: null
    tier: 2
    glyphe: "❧"

  - id: "F-IN018"
    enonce: "Les oulémas, corps de savants religieux spécialistes de la charia, fonctionnent comme un corps comparable aux scribes sumériens, juristes romains, mandarins chinois et énarques français, avec endogamie reproductive par filiation familiale et formation exclusive en madrasa."
    source_url: "https://en.wikipedia.org/wiki/Ulema"
    source_section: "§4"
    head_status: null
    tier: 1
    glyphe: "⁅"

