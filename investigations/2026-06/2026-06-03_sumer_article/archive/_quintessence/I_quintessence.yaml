    faits_lies: ["F-I007", "F-I008", "F-I016", "F-I017", "F-I018"]
  - nom: "Ashoka le Grand"
    role: "Empereur Maurya converti au bouddhisme, promulgateur des edits sur piliers, defenseur du dhamma"
    faits_lies: ["F-I007", "F-I021"]
  - nom: "Brahmanes"
    role: "Classe sacerdotale, gardiens du dharma et du savoir vedic; capture par endogamie, reproduisent leur savoir sur 3000 ans"
    faits_lies: ["F-I003", "F-I009", "F-I010", "F-I020"]
  - nom: "Kshatriyas"
    role: "Caste guerriere, fournit les rois, administrateurs et chefs militaires; taux d'interet de 3%/mois"
    faits_lies: ["F-I010", "F-I017"]
  - nom: "Vaishyas"
    role: "Caste marchande, anime les shreni (guildes bancaires et commerciales); taux d'interet de 4%/mois"
    faits_lies: ["F-I004", "F-I010", "F-I014"]
  - nom: "Shudras"
    role: "Caste des artisans, paysans et serviteurs; taux d'interet de 5%/mois (60% annuel) : exploitation financiere systematique"
    faits_lies: ["F-I010", "F-I019"]
  - nom: "Shreni (guildes)"
    role: "Corporations bancaires, commerciales et artisanales; personnes juridiques avec assemblee elue, fonds commun et contrats des 800 av. J.-C."
    faits_lies: ["F-I004", "F-I014", "F-I018"]
  - nom: "Manu (auteur legendaire)"
    role: "Auteur legendaire du Manusmriti, qui codifie les 18 titres de droit et les taux d'interet par caste"
    faits_lies: ["F-I009", "F-I010"]
  - nom: "Aryabhata"
    role: "Mathematicien et astronome de l'Empire Gupta (Ve-VIe s.), inventeur du ZERO et du systeme decimal de position"
    faits_lies: ["F-I013", "F-I022"]

causalites:
  - cause: "F-I003"
    effet: "F-I020"
    mecanisme: "L'emergence du systeme varna pendant la periode vedique cree une hierarchie sacralisee qui sert de support au dharma: la classification sociale devient le vehicule de l'integration normative entre droit, morale et religion."
  - cause: "F-I009"
    effet: "F-I011"
    mecanisme: "Le Manusmriti codifie 18 titres de droit SANS prevoir d'annulation generale des dettes, transformant l'obligation de remboursement en obligation karmique transmise aux heritiers: c'est la negation directe de l'andurarum sumerien."
  - cause: "F-I010"
    effet: "F-I019"
    mecanisme: "La differenciation des taux d'interet par caste (de 2% a 5%/mois) verrouille l'economie au systeme social; le jajmani system reproduit cet ordre a l'echelle villageoise par echange hereditaire de services et de grain."
  - cause: "F-I012"
    effet: "F-I022"
    mecanisme: "La superiorite economique indienne (32% du PIB en 1 CE) produit un excedent culturel et scientifique (Aryabhata, chiffres, textes bouddhiques) qui sera transmis a l'Islam puis a l'Europe sous forme de savoir mathematique, philosophique et textile."
  - cause: "F-I017"
    effet: "F-I010"
    mecanisme: "La casta-cratie maurya reserve les postes eleves aux hautes castes; le Manusmriti legitime cette fermeture en Differenciant les taux d'interet, le systeme fiscal et les droits selon la naissance, produisant une integration economie+hierarchie sans issue meritocratique."

perspectives_dialectiques:
  - position: "These A : L'Inde confirme mais transforme la these de l'article"
    argument: "L'Inde CONFIRME le besoin universel d'integration normative (dharma integre loi+morale+religion+karma PLUS completement que Sumer, Rome, Chine) mais TRANSFORME la these centrale: l'integration ne passe PAS par la dette/andurarum. La these SYSTEME reste valide (l'integration est un phenomene universel), la these DETTE est FRAGILISEE. L'article « 3 civilisations » doit elargir a l'Inde (32% du PIB antique) pour pretendre a l'exhaustivite."
  - position: "These B : L'Inde comme systeme ALTERNATIF autonome (civilisation-monde)"
    argument: "L'Inde est une civilisation-monde autosuffisante qui n'a pas besoin de l'Occident pour exister. Caste, dharma, hindouisme, bouddhisme forment un systeme complet. La these CAPTURE y est REALISEE A L'EXTREME (caste par naissance) et l'article qui pretend expliquer la capture occidentale en ignorant l'Inde manque sa cible empirique. Le ZERO, l'algebre, les chiffres prouvent que l'Inde a transmis PLUS a l'Occident que ce que l'Occident reconnait."
  - position: "These C : L'Inde comme refutation empirique (falsification au sens popperien)"
    argument: "L'Inde est une REFUTATION EMPIRIQUE de la these centrale de l'article. Si l'integration normative est possible SANS andurarum (via dharma + karma + caste), alors l'andurarum n'est PAS un mecanisme d'integration NECESSAIRE mais un cas particulier parmi d'autres. La these « 3 civilisations avec dette » est un sous-ensemble non representatif: le concept d'integration normative est plus large que dette + religion + hierarchie + morale + caste prises separement."

limites:
  - "Pas d'analyse des empires post-Gupta (Chola, Vijayanagara, Sultanat de Delhi approfondi, Empire moghol) : l'enquete se limite a l'Inde ancienne stricto sensu (3300 av. - 600 ap. J.-C.)."
  - "Pas d'analyse detaillee du systeme mathematique indien au-dela d'Aryabhata: zero, position decimale, trigonometrie, serie entiere pour pi, sanskrit scientifique."
  - "Pas d'etude comparative systematique Inde-Chine des bureaucraties anciennes (Maurya vs Han/Qin/Tang) : uniquement des pistes dans §8C."
  - "Sources presque toutes en anglais (Wikipedia, Khanna 2005, Hudson, Maddison): pas de source en sanskrit, tamoul ou hindi; absence d'acces aux manuscrits originaux de l'Arthashastra ou du Manusmriti."
  - "Population et PIB antiques (32% en 1 CE) sont des estimations Maddison revisees par Broadberry et al.: le debat methodologique sur les series longue n'est pas tranche."
  - "Le systeme des castes a ete partiellement codifie par l'administration britannique au XIXe s. (Dirks 2001): la continuite entre varna vedic et caste coloniale est debattue."
  - "Biais inverse possible: l'enquete pourrait SUR-estimer l'importance de l'Inde pour compenser l'omission de l'article original (effet de compensation)."
  - "Mnemolite n'a retourne AUCUN resultat sur les requetes « Inde caste dharma Aryabhata zero civilisation » et « shreni guildes bancaires Manusmriti Arthashastra »: la base de connaissance vectorielle ne contient pas encore de memoires indexees sur l'Inde ancienne."

wolves:
  - nom: "Brahmanes (classe sacerdotale)"
    argument: "Le systeme indien n'est PAS un contre-modele mais un systeme de fermeture HEREDITAIRE incompatible avec l'ideal d'une mobilite meritocratique; citer l'Inde revient a legitimer un ordre social fige."
    reponse: "L'enquete ne legitime pas l'ordre indien: elle montre que la capture par caste PRECEDE et DEPACE la capture par cooptation administrative occidentale, ce qui INFIRME la these de l'article selon laquelle la mobilite sociale serait un antidote a la capture. La critique brahmanique est elle-meme une preuve de la capture."
  - nom: "Kautilya (Chanakya) : defenseur du realpolitik"
    argument: "L'Arthashastra est un traite de realpolitik comparable a Machiavel: il legitime la ruse, l'espionnage, l'assassinat politique. Le presenter comme « systeme integre » revient a blanchir une pensee cynique du pouvoir."
    reponse: "L'enquete distingue clairement le systeme normatif integre (dharma, droit, fiscalite) du Machiavelisme politique de Kautilya: ce sont deux dimensions distinctes. Le systeme indien INTEGRE plus que le systeme romain, ce qui ne signifie pas qu'il est moralement superieur. La critique de Kautilya ne refute pas la these d'integration."
  - nom: "Marchands shreni (capitalisme indien precoce)"
    argument: "L'Inde avait bien un capitalisme marchand (hundis, banques shreni, commerce ocean Indien) qui contredit l'image d'un systeme fige par les castes. La these de l'enquete ignore ce capitalisme."
    reponse: "L'enquete reconnait explicitement (§3, §8E, F-I004) que les shreni etaient un capitalisme precoce avec PERSONNALITE JURIDIQUE des le 8e s. av. J.-C. La these de l'enquete n'est pas « l'Inde etait figee » mais « l'integration normative indienne etait SANS andurarum, ce qui infirme la these de l'article ». Le capitalisme shreni renforce d'ailleurs la these d'integration precoce."
  - nom: "Historiens occidentalocentristes (colonial knowledge production)"
    argument: "L'absence de l'Inde dans l'article temoigne d'un biais orientaliste STRUCTUREL, pas d'un choix editorial innocent. Reprocher a l'Inde de ne pas « transmettre a l'Europe » revient a reproduire le recit colonial qui fait de l'Europe le centre du monde."
    reponse: "L'enquete accepte cette critique et la documente (§4 L5-L6, §6 P2, §12 SCENARIO B). Elle note que l'Inde a transmis via l'Islam (zero, chiffres) et directement (bouddhisme, textiles), et que cette transmission CULTURELLE/MATHEMATIQUE est aussi determinante que la transmission JURIDIQUE islamique. La critique orientaliste renforce la these d'invisibilite, elle ne l'invalide pas."

iceberg:
  - "Sujet immergé: la SANCTION KARMIQUE comme alternative a l'annulation de dette : l'Inde montre qu'une economie peut fonctionner pendant 3000 ans avec une obligation de remboursement perpetuelle (transgenerationnelle) SANS andurarum et SANS crise sociale majeure, par le seul mecanisme de la dette-cosmique."
  - "Sujet immergé: la CASTE-CRATIE comme forme politique distincte de la MERITOCRATIE chinoise (concours keju) et de la COOPTATION administrative française (ENA) : l'Inde developpe un recrutement FERME par naissance, durable sur 3000 ans, dont les lecons pour la France contemporaine meritent un article separe."
  - "Sujet immergé: la TRANSMISSION INDIRECTE du ZERO indien via Bayt al-Hikma (~830 ap. J.-C.) et Al-Khwarizmi : chainon manquant entre Aryabhata (Ve-VIe s.) et l'Europe medievale, qui prouve qu'une civilisation peut marquer l'histoire mondiale par le calcul pluto que par le droit."
  - "Resultat Mnemolite: ZERO memoire pertinente trouvee pour « Inde caste dharma Aryabhata zero civilisation » (0 resultats) et « shreni guildes bancaires Manusmriti Arthashastra » (0 resultats). La base de connaissance vectorielle du projet n'est pas encore peuplee sur l'Inde ancienne : cette fiche constitue un point d'entree."
  - "Sujet immergé: le JAJMANI SYSTEM comme economie morale villageoise : alternative au marche et a la fiscalite etatique, basee sur l'echange hereditaire de services entre castes; precede et complete le modele economique occidental (Polanyi, economie morale) de 2000 ans."
  - "Sujet immergé: la CONTINUITE INDIENNE 5300 ans (IVC 3300 av. - present), comparable a la Chine (1600 av. - present) et superieure a Rome (753 av. - 476 ap.) : l'Inde survit a toutes les invasions (Aryens, Grecs, Scythes, Huns, Arabes, Turcs, Britanniques) en INTEGRANT les apports exterieurs, ce qui pose la question: l'integration normative est-elle une condition de la survie civilisationnelle?"

