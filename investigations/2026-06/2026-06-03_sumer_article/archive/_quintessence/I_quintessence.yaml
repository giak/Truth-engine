civ: "I"
complexity: "COMPLEX"
date_extraction: "2026-06-07"
enquete_source: "investigations/2026-06-03_sumer_article/2026-06-04_10-30_inde_civilisation_manquante_INVESTIGATION.md"

these_centrale: "L'Inde ancienne (3300 av. J.-C. - present, continuite de 5300 ans, ~32% du PIB mondial en 1 CE) est la grande ABSENTE du recit « 3 civilisations » et potentiellement la plus dommageable pour la these de l'article: son systeme d'integration par le dharma est PLUS complet que ceux de Sumer, Rome et Chine, mais fonctionne SANS andurarum, ce qui infirme la these centrale selon laquelle l'integration passe necessairement par la dette."

theses_implicites:
  - "L'integration indienne via dharma (loi+morale+religion+karma) PROUVE que la dette n'est PAS le mecanisme d'integration necessaire: la sanction karmique (la dette non remboursee se paie dans la vie prochaine) est un mecanisme de regulation PLUS PUISSANT que l'andurarum sumerien, et la these « dette + droit + morale = triangle obligatoire » de l'article est sur-determinee par le choix des civilisations."
  - "La capture par caste (systeme varna/jati) est PLUS EFFICACE que la capture par enarques ou par mandarins: elle repose sur la naissance (fermeture maximale) et l'endogamie, elle dure 3000 ans sans reforme reussie. Le shudra ne peut PAS devenir brahmane, alors que le fils d'ouvrier peut theoriquement devenir enarque. La these « la mobilite sociale comme antidote a la capture » est invalidee par l'Inde."
  - "La these TRANSMISSION est BOULEVERSEE: l'Inde n'a PAS transmis son systeme juridique a l'Europe (contrairement a l'Islam avec le droit romain via Cordoue), mais elle a transmis le ZERO (Aryabhata Ve-VIe s.), les CHIFFRES dits « arabes » (en realite indiens, transmis par Al-Khwarizmi), le BOUDDHISME et les TEXTILES. C'est une transmission CULTURELLE et MATHEMATIQUE determinante, pas juridique."

faits_atomiques:
  - id: "F-I001"
    enonce: "La civilisation de l'Indus (Harappa) debute vers 3300 av. J.-C.: premiere urbanisation indienne, plan orthonorme, systeme d'egouts developpe, greniers publics."
    source_url: "https://en.wikipedia.org/wiki/Indus_Valley_Civilisation"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I002"
    enonce: "Phase mature IVC entre 2600 et 1900 av. J.-C.: commerce actif avec la Mesopotamie identifie sous le nom de Meluhha, perles de steatite, ivoire, textiles exportes."
    source_url: "https://en.wikipedia.org/wiki/Indus_Valley_Civilisation"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I003"
    enonce: "Periode vedique 1500-500 av. J.-C.: redaction progressive des Vedas, emergence du systeme varna (4 castes) qui structurera la societe indienne pendant 3000 ans."
    source_url: "https://en.wikipedia.org/wiki/Vedas"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I004"
    enonce: "Premieres shreni (guildes) vers 800 av. J.-C.: corporations avec personnalite juridique, contrats, assemblee elue et fonds commun : precedents le droit romain des personnes morales de plusieurs siecles."
    source_url: "https://en.wikipedia.org/wiki/Shreni"
    source_section: "§7 / §8E"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-I005"
    enonce: "Mahajanapadas vers 600 av. J.-C.: 16 royaumes concurrents, premieres pieces de monnaie poinconnees en argent, urbanisation monetaire et fiscales simultanees."
    source_url: "https://en.wikipedia.org/wiki/Mahajanapadas"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I006"
    enonce: "Dharma-sutras vers 500 av. J.-C.: premieres codifications systematiques du droit indien, fondant l'integration loi+morale+rituel dans un meme corpus normatif."
    source_url: "https://en.wikipedia.org/wiki/Dharmasastra"
    source_section: "§7 / §8B"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I007"
    enonce: "Empire Maurya (322-185 av. J.-C.): premiere unification de l'Inde sous Chandragupta, conseille par Kautilya; Ashoka (~268-232) impose le bouddhisme et la non-violence apres la guerre de Kalinga."
    source_url: "https://en.wikipedia.org/wiki/Maurya_Empire"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I008"
    enonce: "Arthashastra de Kautilya (compile entre Ier av. J.-C. et IIIe s. ap. J.-C.): traite de 15 livres, 150 chapitres, 180 sujets : science politique, economie, droit, strategie militaire et systeme d'espionnage."
    source_url: "https://en.wikipedia.org/wiki/Arthashastra"
    source_section: "§8C / §8D"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I009"
    enonce: "Manusmriti (IIe av. - IIIe ap. J.-C.): 18 titres de droit couvrant droit civil, penal, familial, rituel et economique dans un seul code : integration totale inconnue du droit romain classique."
    source_url: "https://en.wikipedia.org/wiki/Manusmriti"
    source_section: "§8B"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I010"
    enonce: "Taux d'interet differencies par caste selon le Manusmriti: Brahmanes 2%/mois (24% annuel), Kshatriyas 3%, Vaishyas 4%, Shudras 5% (60% annuel) : preuve directe d'integration systematique entre economie et hierarchie sociale."
    source_url: "https://en.wikipedia.org/wiki/Manusmriti"
    source_section: "§8A"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I011"
    enonce: "Pas d'andurarum indien: la dette est une obligation karmique qui se transmet aux heritiers et se regle dans la vie prochaine : mecanisme de sanction religieuse PLUS FORT que toute loi civile d'annulation periodique."
    source_url: "https://michael-hudson.com/wp-content/uploads/2010/03/HudsonLostTradition.pdf"
    source_section: "§8A / §10"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-I012"
    enonce: "Economie indienne: ~32% du PIB mondial en 1 CE et ~28% en 1000 CE (estimations Angus Maddison), superieure a Rome (~25%) et a la Chine (~26%) au debut de l'ere chretienne."
    source_url: "https://en.wikipedia.org/wiki/Economic_history_of_India"
    source_section: "§3 / §1"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I013"
    enonce: "Empire Gupta (320-550 ap. J.-C.): age d'or culturel et scientifique; Aryabhata invente le ZERO et le calcul decimal, l'astronomie systematique, la medecine (Ayurveda) et le commerce maritime sont en expansion."
    source_url: "https://en.wikipedia.org/wiki/Gupta_Empire"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I014"
    enonce: "Route maritime de l'ocean Indien: commerce actif entre Inde, Rome, Afrique de l'Est et Chine des le IIIe s. av. J.-C. : exportation de coton indien, pierres precieuses et epices (Periplus Maris Erythraei)."
    source_url: "https://en.wikipedia.org/wiki/Indian_Ocean_trade"
    source_section: "§8E"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I015"
    enonce: "Universite de Nalanda (fondation Vle s. ap. J.-C., destruction 1193 par Bakhtiyar Khilji): jusqu'a 10 000 etudiants et 2 000 enseignants : plus grand centre d'enseignement du monde antique."
    source_url: "https://en.wikipedia.org/wiki/Nalanda"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I016"
    enonce: "Systeme d'espionnage maurya decrit par Kautilya: guerriers-espions, courtisanes-espions, marchands-espions : innovation indienne reprise ulterieurement par Byzance et la Chine."
    source_url: "https://pubadmin.institute/administrative-system-at-union-level/mauryan-administrative-system-analysis"
    source_section: "§8C"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-I017"
    enonce: "Structure administrative maurya: Samrat (empereur), Mantri Parishad (conseil des ministres), Adhyakshas (surintendants par secteur), Gopa (officiers de village) : casta-cratie fermee et non meritocratie ouverte au merite individuel."
    source_url: "https://pubadmin.institute/administrative-system-at-union-level/mauryan-administrative-system-analysis"
    source_section: "§8C"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-I018"
    enonce: "Systeme fiscal maurya: impot foncier de 1/6 a 1/4 des recoltes, taxes commerciales, taxes professionnelles, amendes judiciaires et monopoles d'Etat sur mines, forets et sel : fiscalite comparable aux meilleurs systemes antiques."
    source_url: "https://en.wikipedia.org/wiki/Arthashastra"
    source_section: "§8D"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I019"
    enonce: "Jajmani system: economie villageoise autosuffisante, echange hereditaire de services et de grain entre castes sur plusieurs generations : stabilite economique obtenue par reproduction sociale pluto que par marche ouvert."
    source_url: "https://en.wikipedia.org/wiki/Jajmani_system"
    source_section: "§3 / §14"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I020"
    enonce: "Le concept de dharma integre loi, morale, religion, devoir social et rituel de purification dans un meme systeme normatif : distinct du ius romain qui separe en theorie droit et morale."
    source_url: "https://ijcrt.org/papers/IJCRT2510218.pdf"
    source_section: "§8B / §3"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-I021"
    enonce: "Ashoka (~268-232 av. J.-C.): edits sur pierres promulgues dans tout l'Empire Maurya, politique de dhamma (gouvernance par la loi morale bouddhiste), protection des animaux et des minorites religieuses."
    source_url: "https://en.wikipedia.org/wiki/Ashoka"
    source_section: "§9"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-I022"
    enonce: "Transmission indienne vers l'Europe principalement INDIRECTE via l'Islam: ZERO mathematique (Aryabhata Ve-VIe s.), chiffres dits « arabes » en realite indiens, bouddhisme vers Chine et Japon, textiles de coton vers Rome."
    source_url: "https://en.wikipedia.org/wiki/Hindu-Arabic_numeral_system"
    source_section: "§8E / §10"
    head_status: 200
    tier: 1
    glyphe: "✦"

acteurs:
