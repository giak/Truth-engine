causalites:
  - cause: "F-MA002"
    effet: "F-MA001"
    mecanisme: "La redécouverte bolonaise du CJC de Justinien (~1070) ne peut s'opérer que parce que le texte a été conservé intact à Constantinople pendant 540 ans."
  - cause: "F-MA001"
    effet: "F-MA008"
    mecanisme: "Le droit romain redécouvert fournit le substrat intellectuel permettant à Saint Louis de réformer la justice et de rédiger des ordonnances systématiques en 1254."
  - cause: "F-MA001"
    effet: "F-MA016"
    mecanisme: "La formation juridique bolonaise alimente le corpus doctrinal des légistes royaux, qui théorisent la souveraineté absolue à partir du Digeste de Justinien."
  - cause: "F-MA004"
    effet: "F-MA003"
    mecanisme: "La spoliation brutale des Templiers en 1307 crée l'impératif politique d'un mode de financement alternatif : la rente publique de 1522 en est la réponse stabilisée et institutionnalisée."
  - cause: "F-MA007"
    effet: "F-MA009"
    mecanisme: "La convocation des États généraux en 1302 institue la procédure de consentement à l'impôt, mais la Guerre de Cent Ans impose la taille permanente de 1439 qui rend ce consentement formel."
  - cause: "F-MA005"
    effet: "F-MA006"
    mecanisme: "L'administration directe de Philippe Auguste, avec ses baillis et sénéchaux, prépare l'infrastructure juridictionnelle dont le Parlement de Paris est l'aboutissement au XIIIe siècle."
  - cause: "F-MA006"
    effet: "F-MA020"
    mecanisme: "Le Parlement de Paris, issu de la Curia Regis, se spécialise au XIIIe siècle en cour souveraine distincte de la personne du roi, fondant l'autonomie judiciaire."
  - cause: "F-MA016"
    effet: "F-MA012"
    mecanisme: "Les légistes, dont l'influence culmine avec la professionnalisation de l'État sous Philippe le Bel, ne survivent pas à la disparition de leur protecteur en 1314 et sont exécutés ou disgraciés."

perspectives_dialectiques:
  - position: "Continuité antique -> État français"
    argument: "Le Moyen Âge prolonge sans rupture les institutions romaines : fisc, droit, bureaucratie sont transmis de manière organique, et la féodalité n'est qu'un habillage politique sur une armature administrative continue héritée de Rome."
  - position: "Rupture médiévale"
    argument: "Le Moyen Âge est un AGE D'OBSCURANTISME : chute démographique, perte des techniques, isolement intellectuel, économie de subsistance. L'État moderne se construit CONTRE le féodalisme médiéval, non à partir de lui."
  - position: "Traduction et reconstruction"
    argument: "Ni continuité ni rupture : le Moyen Âge est une CEINTURE DE TRANSMISSION qui traduit activement l'héritage antique à travers des médiateurs (glossateurs, légistes, financiers italiens). Le trou documentaire de 594 ans (476-1070) prouve que la continuité n'est pas organique, mais la reconstruction est trop profonde pour être une simple rupture."

limites:
  - "Biais du récit national : la construction de l'État français est un récit téléologique qui survalorise la centralisation capétienne aux dépens des féodalités périphériques et des périodes de crise (Guerre de Cent Ans)."
  - "Période carolingienne (751-987) traitée trop rapidement : la renaissance capitulaire prépare Bologne, ce maillon fondateur mérite une enquête dédiée."
  - "Pas de sources primaires : l'enquête s'appuie sur des sources secondaires (Wikipedia, Herodote, EHNE, cours en ligne). Les archives médiévales (rôles de la Chambre des Comptes, registres du Parlement) n'ont pas été consultées."
  - "Sous-représentation de l'Ancien Régime (1515-1789) : l'absolutisme, le système des offices, la Paulette de 1604 ne sont pas couverts alors qu'ils fondent l'État contemporain."
  - "Sur-représentation de Philippe le Bel : son règne est mieux documenté, ce qui peut exagérer son importance structurelle réelle par rapport à des périodes moins médiatisées."
  - "Mnemolite vide : aucune mémoire indexée pour Moyen Âge, Bologne, dette publique ou François Ier. Pas de cross-sourcing disponible via la base vectorielle du projet."

wolves:
  - nom: "Historien médiévaliste classique (type Georges Duby)"
    argument: "Vous surinterprétez le Moyen Âge comme une « ceinture de transmission » au service d'une thèse sur la caste contemporaine. Le Moyen Âge a sa propre logique, ses propres dynamiques (féodalité, Église, Croisades) qui ne se réduisent pas à une proto-histoire de l'État moderne."
    reponse: "L'enquête ne réduit pas le Moyen Âge à un chaînon manquant, elle identifie trois inventions précises (droit, dette, impôt) dont la postérité est documentée. Le reste de la période garde son autonomie dans l'analyse. La mise en regard avec l'article « Trois civilisations, un même problème » est un cadrage, pas une explication exhaustive."
  - nom: "Juriste historien du droit (type Yan Thomas)"
    argument: "Le droit romain n'est pas « redécouvert » en 1070, il n'a jamais été perdu : les formulaires, les actes de la pratique et le Bréviaire d'Alaric maintiennent une tradition juridique continue."
    reponse: "L'enquête (§2) reconnaît ce point : des fragments du droit romain avaient survécu chez les légistes carolingiens et à Pavie. La redécouverte bolonaise porte sur l'œuvre COMPLÈTE de Justinien, non sur le droit romain en général. La nuance est explicitement documentée."
  - nom: "Économiste (type Thomas Piketty)"
    argument: "Vous sous-estimez l'innovation financière italienne : les banquiers lombards et toscans inventent la dette publique, pas la monarchie française. François Ier n'est qu'un client du système italien."
    reponse: "L'enquête (§3 Phase 2) mentionne explicitement le rôle des banquiers italiens et leurs taux élevés. La rente sur l'Hôtel de Ville est toutefois une innovation institutionnelle FRANÇAISE (gage sur les revenus fiscaux parisiens), qui transforme le prêt privé en titre public. Le mécanisme italien alimente, l'institution française structure."
  - nom: "Politiste (type Pierre Rosanvallon)"
    argument: "Vous idéalisez les États généraux comme moment démocratique : en 1302, il s'agit d'un instrument de LÉGITIMATION de l'impôt royal, non de contrôle parlementaire. La représentation est sélective, le consentement est forcé."
    reponse: "L'enquête (§4) reconnaît ce point : la convocation de 1302 sert d'abord à légitimer l'impôt de guerre. La portée démocratique (Étienne Marcel en 1358) est documentée comme échec. Le mécanisme est bien identifié comme INSTRUMENTALISATION royale, pas comme avancée démocratique."

iceberg:
  - "L'Église comme acteur fiscal : l'exemption du clergé avant 1302, puis la taxation post-conflit avec Boniface VIII, sont un pan majeur de la formation de l'État fiscal que l'enquête effleure sans traiter (F-MA019)."
  - "L'invention du NOTARIAT par les clercs médiévaux : chaînon technique entre la pratique romaine et la bureaucratie d'État, totalement absent de l'enquête."
  - "Les CROISADES comme mécanisme de circulation financière : endettement massif des seigneurs, transferts vers Venise et Gênes, inflation des prix — un précédent de la dette souveraine non traité."
  - "Le droit CANONIQUE comme corpus parallèle au droit civil : Gratien (~1140) et le Décret fondent la tradition juridique européenne au même titre que le CJC, non couvert par l'enquête."
  - "La révolution COMMERCIALE italienne (XIIe-XIIIe siècle) : foires de Champagne, comptabilité en partie double, lettre de change — l'infrastructure financière qui rend possible la rente de 1522, mentionnée mais non documentée."
  - "Mnemolite : 0 résultat sur les 4 requêtes lancées (Moyen Âge glossateurs Bologne État français genèse, Philippe le Bel Templiers dette publique, Philippe Auguste rente François Ier Hôtel de Ville 1522, Irnerius glossateurs Bologne droit romain redécouverte). La base vectorielle est vide pour cette aire."

