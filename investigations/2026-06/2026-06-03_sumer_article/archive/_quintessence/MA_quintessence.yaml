these_centrale: "Le Moyen Âge (987-1515) est la ceinture de transmission qui fait passer l'héritage antique vers la France moderne : trois inventions médiévales (redécouverte du Corpus Juris Civilis à Bologne vers 1070, dette publique par rente sur l'Hôtel de Ville en 1522, État fiscal par taille permanente en 1439) comblent le trou documentaire de 594 ans entre la chute de Rome et la monarchie française, fondant les institutions dont la caste contemporaine capte les rentes."

theses_implicites:
  - "Le Moyen Âge est un âge fondateur défiguré par deux biais narratifs ultérieurs : le BIAIS RENAISSANCE des humanistes (qui inventent le terme pour délégitimer la période au profit de l'Antiquité) et le BIAIS RÉVOLUTIONNAIRE (qui rejette l'Ancien Régime en bloc). Les faits sont robustes, le récit qui les enrobe est une construction politique."
  - "La filiation Rome -> France n'est pas continue, elle est RECONSTRUITE : un trou documentaire de 594 ans (476-1070) est comblé par les glossateurs de Bologne, première vague d'un mécanisme de rattrapage de l'héritage antique que la Troisième République reproduira avec le Code civil de 1804."
  - "Les 5 tensions du Changement de Régime (extraction, capture, démantèlement, abdication, dette) ont leurs précédents médiévaux : la Guerre de Cent Ans, la Peste noire et la taille permanente reproduisent les mêmes structures, mais au XIVe siècle la crise produit plus d'État, au XXIe siècle elle produit plus de capture. Le mécanisme est identique, la trajectoire diverge."

