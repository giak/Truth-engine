causalites:
- id: C-META001
  nom: C1 DETTE UNIVERSELLE REFUTEE 6,5× par 4 civilisations (Inca, Maya, Azteque,
    Inde)
  description: 'L''enquete META agrege 4 civilisations qui REFUTENT la these de la
    dette universelle : (1) Inca (Ameriques) societe integree SANS dette, SANS monnaie,
    SANS marche, (2) Maya zero mathematique, systeme juridique integre SANS dette,
    (3) Azteque tribut en nature, SANS interet compose, (4) Inde (dharma) integre
    par caste ET sanction karmique, PAS par dette. Ces 4 cas cumulés produisent un
    shadow de 6,5× sur C1, suffisant pour REFUTER la these de la dette comme mecanisme
    universel d''integration.'
  preuve_tranchante: 4 enquetes (AM 6,4×, IN 5,2×, IS 2,8×, + corroboration)
  fiabilite: ✦
- id: C-META002
  nom: C3 ANDURARUM AFFAIBLI 6,5× par 5 divergences (Charpin, exclusions, frequence,
    fonction, disparition)
  description: 'L''enquete META agrege les 5 divergences identifiees par l''autopsy
    andurarum (shadow 5,8×) : (1) semantique liberation vs restauration, (2) dettes
    commerciales exclues (Ammisaduqa), (3) frequence irreguliere 30/1000 ans, (4)
    fonction legitimation royale vs stabilisation macro, (5) disparition post- 1400
    av. sans transmission. Cumul : shadow 6,5× sur C3, suffisant pour AFFAIBLIR la
    these de l''andurarum comme precedent pur de restructuration.'
  preuve_tranchante: A enquete (5,8×) agrege
  fiabilite: ✦
- id: C-META003
  nom: C2 TRANSMISSION LINEAIRE AFFAIBLIE 2,5× par Islam (Cordoue) et Chine (Voltaire)
  description: 'L''enquete META identifie 2 sources de TRANSMISSION MULTI-LINEAIRE
    : (1) Islam via Cordoue/Tolede (pas seulement Rome->MA->modernite), (2) Chine
    via Voltaire/Quesnay/Periou (Jesuites, economie politique). Ces 2 canaux paralleles
    prouvent que la transmission n''est pas lineaire mais MULTI-LINEAIRE. Shadow agrege
    2,5× sur C2, suffisant pour AFFAIBLIR la these de la transmission lineaire unique.'
  preuve_tranchante: IS 2,8× + AM 3,0× + MA 1,5× = moyenne 2,5×
  fiabilite: ✦
- id: C-META004
  nom: C4 5 TENSIONS INTACT 3,0× mais artefact possible + 55% sources etatiques
  description: 'Le cadre des 5 tensions en cascade (Moyen Age, Revolution, Vichy,
    1945, Liberation) TIENT comme outil d''analyse, mais : (1) c''est peut-etre un
    ARTEFACT d''analyse (selection de dates qui confirment la these), (2) les sources
    sont 55% etatiques (biais de l''INSEE), (3) absence de sources contre-these. Shadow
    3,0× sur C4 : la these tient mais avec precaution methodologique.'
  preuve_tranchante: HUB 2,8× + corroboration
  fiabilite: ✧
- id: C-META005
  nom: C5 CAPTURE MODERNE INTACTE 2,5× mais biais selection unidirectionnel
  description: 'La capture moderne de l''Etat francais est documentee (pantouflage,
    conflits d''interets, grandes ecoles, Conseil d''Etat) MAIS le corpus souffre
    d''un biais de SELECTION UNIDIRECTIONNEL : ZERO source pro-reforme, ZERO contre-argument,
    medias d''investigation cients a gauche. La these est INTACTE mais avec precaution
    epistemique. Shadow 2,5× sur C5.'
  preuve_tranchante: HUB 2,8× + corroboration (capture documentee)
  fiabilite: ✧
