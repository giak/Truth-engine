these_centrale: 'Le recalcul META des 9 investigations produit un shadow final agrege
  de 5,0×, ce qui signifie qu''UNE conclusion sur CINQ de l''article original tient
  intacte. La these est REFUTEE sur ses FONDATIONS (C1 dette universelle 6,5x, C3
  andurarum 6,5x) et AFFAIBLIE sur sa TRANSMISSION (C2 multi-lineaire 2,5x), mais
  INTACTE sur son CADRE (C4 5 tensions 3,0x) et son DIAGNOSTIC (C5 capture moderne
  2,5x). These reformulee : ''L''integration sociale par le systeme est universelle.
  Le mecanisme est variable (andurarum != dharma != mit''a != riba). La dette est
  un outil parmi d''autres, pas le mecanisme unique. La transmission est multi-lineaire.
  La capture moderne combine ces outils avec une efficacite sans precedent.'''
theses_implicites:
- 'Le shadow recalcule 5,0x est un ECHEC MAJEUR : 1 conclusion sur 5 tient (20%)'
- La these de la dette universelle est REFUTEE par 4 civilisations (Inca, Maya, Azteque,
  Inde dharma)
- L'andurarum est un RITUEL POLITIQUE (Charpin), pas un mecanisme economique (Hudson)
- La transmission est MULTI-LINEAIRE (Islam via Cordoue, Inde via Aryabhata, Chine
  via Volaire), pas lineaire Sumer->Rome->Modernite
- L'integration sociale reste universelle MAIS les mecanismes varient (andurarum,
  dharma, mit'a, riba, capture monopolistique inca)
