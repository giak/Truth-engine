enquete_id: afrique_subsaharienne
complexity: MEDIUM
date_extraction: '2026-06-07'
enquete_source: investigations/2026-06-07_civilisations_manquantes/2026-06-07_16-15_afrique_subsaharienne_INVESTIGATION.md
these_centrale: Les empires africains médiévaux (Mali 1235-1670, Songhai 1464-1591, Grand Zimbabwe XIe-XVe siècle) prouvent
  que des États complexes avec bureaucratie spécialisée, tradition écrite savante, et contrôle du commerce mondial (or, sel)
  existaient en Afrique bien avant le contact colonial. Leur effacement du récit occidental est un produit de l'historiographie
  coloniale, pas un reflet de la réalité historique.
theses_implicites:
- Mansa Musa (1312-1337) est l'homme le plus riche de l'histoire — son pèlerinage à La Mecque en 1324 a provoqué 12 ans d'inflation de l'or en Égypte.
- L'Université de Sankoré à Tombouctou (25 000 étudiants) contredit le mythe d'une Afrique 'sans écriture'.
- Askia Muhammad crée une bureaucratie spécialisée (ministres, gouverneurs) comparable à Sumer ou à la Perse.
- La tradition des griots (historiens oraux) est une alternative à l'écriture pour la transmission juridique et historique.
