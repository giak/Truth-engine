perspectives_dialectiques:
- position: Thèse — L'Afrique avait des empires complexes avant le contact colonial
  argument: Mali, Songhaï, Grand Zimbabwe avaient bureaucratie, écriture (manuscrits de Tombouctou), et commerce mondial. Leur effacement est idéologique.
- position: Antithèse — L'oralité limite la comparabilité
  argument: Les griots transmettent oralement, pas par écrit codifié. La bureaucratie songhaï est moins documentée que Sumer ou Rome. Comparaison asymétrique.
limites:
- Manuscrits de Tombouctou partiellement détruits (occupation djihadiste 2012-2013)
- Biais colonial persistant — historiographie écrite par les colonisateurs jusqu'aux indépendances
wolves:
- nom: Historiographie coloniale
  argument: L'Afrique n'avait pas d'États complexes avant la colonisation — 'terra nullius'
  reponse: Grand Zimbabwe, Tombouctou, l'empire du Mali prouvent le contraire. L'historiographie coloniale était une entreprise de négation
