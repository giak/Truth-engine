perspectives_dialectiques:
- position: Thèse — Carthage était une alternative viable à Rome
  argument: République commerciale stable pendant 600 ans, citée par Aristote comme modèle — Carthage prouve qu'un autre modèle méditerranéen existait
- position: Antithèse — Carthage était structurellement condamnée
  argument: Armée mercenaire = dépendance fatale. Pas de citoyen-soldat = pas de résilience militaire. Le modèle romain était supérieur
limites:
- Biais de source maximal : tout ce qu'on sait de Carthage a été écrit par ses ennemis (Polybe, Tite-Live)
- Pas de sources primaires puniques survivantes
wolves:
- nom: Historiographie romaine
  argument: Carthage = perfidie, cruauté, sacrifices d'enfants — propagande de guerre romaine
  reponse: Les sacrifices d'enfants (tophet) sont archéologiquement attestés mais leur ampleur est débattue
iceberg:
