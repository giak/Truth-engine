these_centrale: Carthage (814-146 av. J.-C.) est une république oligarchique commerciale effacée par Rome — ses sources
  ayant été détruites en 146 av. J.-C. C'est le contre-test méditerranéen à Rome que l'enquête Sumer n'a pas fait : un
  modèle alternatif (thalassocratie commerciale, armée mercenaire) qui a perdu. La France est l'héritière du vainqueur
  (Rome territoriale), pas du vaincu (Carthage maritime).
theses_implicites:
- La destruction totale des archives puniques par Rome est un cas unique de biais de source maximal.
- Carthage = Rome sans la victoire — république aristocratique fondée sur le commerce, pas l'agriculture.
- L'armée mercenaire carthaginoise crée une dépendance fatale (Guerre des Mercenaires, 240-238 av.).
- Aristote cite Carthage comme exemple de constitution mixte stable — au même titre que Sparte.
