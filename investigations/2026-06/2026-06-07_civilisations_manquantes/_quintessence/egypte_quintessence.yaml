these_centrale: L'Égypte pharaonique a fonctionné 3000 ans sans code juridique écrit, sans école de scribes standardisée,
  et sans annulation générale de dettes — elle invalide la thèse selon laquelle les institutions sumériennes (code écrit,
  edubba, andurarum) sont des universaux civilisationnels. La fusion totale droit/religion/économie/morale (Maât), commune
  à Sumer et à l'Égypte, est le vrai universel.
theses_implicites:
- L'absence de code écrit en Égypte n'est pas un 'manque' mais un CHOIX de civilisation — la formalisation juridique écrite est un trait mésopotamien, pas universel.
- Les temples égyptiens capturent l'économie par exemption fiscale (~30% des terres sous Ramsès III), un mécanisme de capture ALTERNATIF à la capture par les scribes sumériens.
- L'Égypte = État unifié centralisé vs Sumer = cités-États fragmentées. Cette différence d'échelle politique fausse toute comparaison directe.
- Le nilomètre est un instrument fiscal qui lie environnement, économie et administration — le déterminisme géographique nilotique n'a pas d'équivalent à Sumer.
- L'absence d'andurarum en Égypte confirme que l'annulation de dette est un trait sumérien contingent, pas un universel.
