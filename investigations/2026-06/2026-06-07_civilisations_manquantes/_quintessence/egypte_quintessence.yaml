perspectives_dialectiques:
- position: Thèse — L'Égypte est l'anti-Sumer
  argument: L'Égypte prouve qu'un État complexe peut fonctionner 3000 ans sans code écrit, sans école de scribes standardisée, et sans annulation de dette. Les patterns sumériens ne sont PAS des universaux.
- position: Antithèse — L'Égypte confirme la fusion des 4 dimensions
  argument: L'Égypte partage avec Sumer la fusion totale droit/religion/économie/morale (Maât). C'est CETTE fusion qui est l'universel civilisationnel — pas les institutions spécifiques.
- position: Synthèse — L'Égypte affine la thèse sans la détruire
  argument: L'universel est la FUSION ; les institutions sont des VARIANTES locales. L'article Sumer doit distinguer le pattern (universel) des institutions (contingentes).
limites:
- Sources primaires lacunaires : papyrus du Delta perdus (milieu humide), biais Haute-Égypte
- 30% terres temples (Ramsès III) est une estimation, marge d'erreur significative
- Comparaison synchronique (IIIe millénaire) plus rigoureuse que la comparaison structurale abstraite
- Période ptolémaïque (hybride gréco-égyptienne) sous-exploitée comme contre-test
wolves:
- nom: Dominique Charpin
  argument: L'absence de code écrit est un argument par absence — les sources ont pu être perdues
  reponse: 200 ans de fouilles sans trouver de code, alors que les codes mésopotamiens abondent, rendent cette hypothèse improbable
- nom: Jan Assmann
  argument: Maât est un concept cosmologique, pas juridique — projeter nos catégories est anachronique
  reponse: Objection valide. L'enquête cherche précisément à documenter cette inadéquation entre nos catégories et les catégories antiques
- nom: Juan Carlos Moreno García
  argument: L'administration égyptienne était plus sophistiquée que les sources conservées ne le suggèrent
  reponse: Exact. Le biais de conservation est documenté dans les LIMITES
iceberg:
- Sujet immergé #1 : 0 source primaire ✦ — tous les faits sont ✧, l'enquête repose sur des sources secondaires
- Sujet immergé #2 : Biais Haute-Égypte — le Delta (milieu humide) a perdu ses papyrus, rendant la Basse-Égypte invisible
- Sujet immergé #3 : La période ptolémaïque (332-30 av.) comme laboratoire d'hybridation gréco-égyptienne — non exploitée
