complexity: MEDIUM
date_extraction: '2026-06-07'
enquete_source: investigations/2026-06-07_civilisations_manquantes/2026-06-07_15-15_grece_classique_INVESTIGATION.md
these_centrale: La démocratie athénienne (508-322 av. J.-C.) est la première société complexe à dissocier partiellement les
  quatre dimensions (droit/religion/économie/morale) et à concevoir des mécanismes ANTI-CAPTURE explicites (sortition,
  rotation, euthynai). Elle n'est PAS l'ancêtre de la démocratie représentative française — c'est un système anti-bureaucratique
  dont la France a fait le CHOIX INVERSE en créant l'ENA en 1945.
theses_implicites:
- La sortition est la solution grecque au problème de capture documenté à Sumer (scribes) — personne n'y pense en France 2026.
- Solon annule les dettes comme LÉGISLATEUR élu, pas comme roi : l'annulation survit au changement de régime politique.
- La liturgie (taxation contrainte des riches) remplace l'impôt progressif sans bureaucratie fiscale permanente.
- La démocratie athénienne exclut 80-90% de la population (femmes, esclaves, métèques) — ce n'est pas un modèle transférable.
- Athènes importe son grain de la mer Noire — dépendance stratégique comparable à la dépendance énergétique française.
