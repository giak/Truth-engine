causalites:
- cause: F-GRE-003
  effet: F-GRE-010
  mecanisme: La sortition (pas de corps permanent) + euthynai (reddition de comptes) empêchent la capture administrative documentée à Sumer et en France
- cause: F-GRE-009
  effet: F-GRE-005
  mecanisme: La dépendance au grain importé contraint la politique étrangère athénienne → la liturgie navale (triérarchie) devient vitale pour sécuriser les routes commerciales
perspectives_dialectiques:
- position: Thèse — La Grèce invente la solution au problème sumérien
  argument: La sortition, la rotation et l'euthynai sont des mécanismes explicites ANTI-CAPTURE. Athènes identifie le problème et le résout en supprimant la bureaucratie permanente.
- position: Antithèse — La Grèce est un cas exceptionnel, pas un modèle
  argument: La démocratie athénienne exclut 80% de la population, repose sur l'esclavage, et ne dure que 186 ans. Ce n'est PAS transférable à un État-nation de 68M d'habitants.
- position: Synthèse — La Grèce inspire sans être copiable
  argument: Le principe grec (mécanismes anti-capture intégrés aux institutions) est universel. La forme grecque (sortition, petite cité-État) est contingente. La France doit inventer SES propres mécanismes.
limites:
- Sources athénocentriques : Sparte, Thèbes, Corinthe sont sous-documentées
- Démocratie exclusive : 10-20% de la population est citoyenne, 80% exclue
- Anachronisme : projeter la démocratie représentative moderne sur la démocratie directe athénienne est une erreur
- Absence de comparaison avec Sparte (contre-test oligarchique)
wolves:
- nom: Moses Finley
  argument: La démocratie athénienne était un face-à-face, pas un gouvernement représentatif — inapplicable à un État-nation moderne
  reponse: La comparaison n'est pas institutionnelle mais principielle : la Grèce a IDENTIFIÉ le problème de capture et y a répondu
- nom: Josiah Ober
  argument: La démocratie athénienne était PLUS efficace que les États modernes grâce à la dispersion du savoir
  reponse: Argument provocateur qui renforce la thèse — si Ober a raison, l'ENA/INSP est un recul par rapport à la Boulè
- nom: Paul Cartledge
  argument: Athènes n'est pas la Grèce — Sparte, Thèbes, Corinthe avaient des systèmes radicalement différents
  reponse: Objection structurelle valide. L'enquête le reconnaît dans les LIMITES
iceberg:
- Sujet immergé #1 : 0 source primaire ✦ — tous les faits sont ✧
- Sujet immergé #2 : Sparte (diarchie, gérousia, éphores) comme contre-test oligarchique — non traité
- Sujet immergé #3 : La démocratie athénienne exclut 80% de la population — angle mort du récit « berceau de la démocratie »
