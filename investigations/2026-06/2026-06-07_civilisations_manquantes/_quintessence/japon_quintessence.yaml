these_centrale: Le Japon (660 av. J.-C.-1945) est la plus ancienne monarchie héréditaire continue du monde et le seul
  pays non-occidental à avoir réussi une industrialisation sans colonisation (ère Meiji 1868-1912). Il offre deux cas-limites
  à l'enquête : la capture la plus extrême par un corps spécialisé (l'armée capture l'État entier, 1931-1945), et
  la dissociation des 4 dimensions IMPOSÉE de l'extérieur (constitution de 1947 sous occupation américaine).
theses_implicites:
- La continuité dynastique japonaise (2600+ ans) est unique dans l'enquête — aucune autre civilisation n'a conservé la même dynastie.
- La modernisation Meiji prouve que l'industrialisation est possible sans occidentalisation culturelle.
- La capture par l'armée (1931-1945) est le cas le plus extrême de capture par corps spécialisé documenté dans l'enquête.
- La constitution de 1947 (dissociation imposée par les USA) est le contre-modèle de la laïcité française (produite de l'intérieur).
