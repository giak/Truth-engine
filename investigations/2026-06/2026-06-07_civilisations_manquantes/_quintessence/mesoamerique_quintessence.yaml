perspectives_dialectiques:
- position: Thèse — La Mésoamérique confirme les universaux
  argument: Comme l'Égypte, pas de code écrit. Comme Sumer, fusion religion/État. Comme Carthage, destruction coloniale des sources. Les patterns sont universels.
- position: Antithèse — La Mésoamérique est incommensurable
  argument: Développée sans cheval, roue, fer, ni contact eurasien — les parallèles sont des coïncidences, pas des preuves d'universalité.
limites:
- Sources espagnoles biaisées (codex post-conquête)
- Sacrifice humain : chiffres invérifiables (4 000-20 000 en 4 jours selon sources espagnoles)
- Isolement absolu rend la comparaison avec l'Eurasie hasardeuse
wolves:
- nom: Historiographie coloniale espagnole
  argument: Sacrifices humains = barbarie, conquête = civilisation
  reponse: Le sacrifice aztèque était une obligation cosmologique, pas de la cruauté gratuite. La fusion religion/État y était plus totale qu'à Rome ou Sumer.
iceberg:
