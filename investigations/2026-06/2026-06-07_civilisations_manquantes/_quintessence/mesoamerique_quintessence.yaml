these_centrale: La Mésoamérique (Olmèques, Mayas, Aztèques) a développé l'écriture, l'astronomie de précision et des empires
  complexes sans CONTACT avec l'Eurasie — ce qui en fait un laboratoire isolé pour tester l'universalité des patterns
  civilisationnels. Elle confirme que le code juridique écrit n'est pas universel (comme l'Égypte), que la fusion
  religion/État peut être PLUS totale qu'à Sumer (sacrifice humain comme obligation d'État), et que la destruction
  coloniale des sources est un pattern récurrent (comme Carthage).
theses_implicites:
- L'absence de code juridique écrit en Mésoamérique confirme le pattern égyptien — le code écrit est mésopotamien, pas universel.
- Les pochteca (marchands-espions) sont un cas unique de fusion commerce/renseignement d'État.
- La destruction des codex par les Espagnols (< 20 survivants) est un effacement comparable à Carthage.
- Le sacrifice humain aztèque est la fusion religion/État la plus totale de l'enquête.
