- Infrastructure : Route Royale 2500 km = colonne vertébrale de l'empire
- Religion : tolérance stratégique, pas principe — Cyrus choisi par Marduk ET Ahura Mazda
- Économie : daric (monnaie d'or standardisée), tribut annuel fixe par satrapie
- Droit : absence de code juridique unifié — le roi est la loi
