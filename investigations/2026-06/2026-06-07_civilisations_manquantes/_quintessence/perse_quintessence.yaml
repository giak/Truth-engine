perspectives_dialectiques:
- position: Thèse — Continuité administrative
  argument: La Perse invente le fédéralisme avant la lettre. Satrapies autonomes, inspecteurs itinérants, lingua franca — tout préfigure les États fédéraux modernes.
- position: Antithèse — Rupture : la tolérance comme realpolitik
  argument: La tolérance perse n'est PAS un principe philosophique mais une TECHNIQUE DE GOUVERNANCE pour un empire trop vaste pour être administré uniformément.
- position: Synthèse — Angle mort : l'absence de code juridique
  argument: Contrairement à Sumer, Rome ou la France, la Perse n'a PAS de code juridique unifié. Le roi est la loi. Cette absence est la fragilité ultime.
limites:
- Sources orientées : l'essentiel vient de sources grecques (Hérodote) ou babyloniennes
- Le Cylindre de Cyrus est surinterprété comme 'déclaration des droits de l'homme'
- Aucun code juridique achéménide n'a survécu
wolves:
- nom: Edward Said / Orientalisme
  argument: Le 'despotisme oriental' est une construction occidentale qui masque la sophistication administrative perse
  reponse: La Perse n'était ni despotique ni démocratique — c'était un empire pragmatique avec tolérance stratégique
- nom: Michael Hudson
  argument: L'absence d'annulation de dette en Perse confirme que l'andurarum est sumérien, pas universel
  reponse: Exact. La Perse confirme que l'annulation de dette est un trait mésopotamien contingent
iceberg:
- Sujet immergé #1 : La Perse a 2 ✦ (British Museum, Persepolis Archive) mais pas de sources perses directes (Behistun, Naqsh-e Rostam)
- Sujet immergé #2 : La tolérance perse coexiste avec la répression violente des révoltes (Babylone, Égypte, Ionie)
