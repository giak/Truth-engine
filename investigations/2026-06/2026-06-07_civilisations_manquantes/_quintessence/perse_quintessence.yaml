these_centrale: L'Empire perse achéménide (559-330 av. J.-C.) est le premier empire multi-ethnique à pratiquer la tolérance
  religieuse comme STRATÉGIE DE CONTRÔLE, pas comme principe moral. Son système de satrapies (20 provinces autonomes)
  et d'inspecteurs itinérants ('Yeux et Oreilles du Roi') préfigure le fédéralisme et l'inspection des finances — mais
  l'absence totale de code juridique unifié en fait un contre-modèle à Rome et à la France.
theses_implicites:
- La tolérance religieuse perse est de la realpolitik impériale, pas un principe — le Cylindre de Cyrus n'est PAS une déclaration des droits de l'homme.
- Les satrapies (autonomie locale) + inspecteurs itinérants (surveillance centrale) = équilibre des pouvoirs avant la lettre.
- L'absence de code juridique unifié est la fragilité structurelle ultime de l'empire achéménide.
- La Route Royale (2500 km, 111 relais, 7 jours) est le système nerveux de l'empire — l'infrastructure = pouvoir.
- La Perse est le CONTRE-MODÈLE de Rome (qui uniformise) et de la France (jacobine).
