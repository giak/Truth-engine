perspectives_dialectiques:
- position: Thèse — La Russie prouve la permanence du corps administratif
  argument: Nomenklatura→oligarchie→siloviki. Le personnel survit aux révolutions. La capture est PLUS résiliente que l'idéologie.
- position: Antithèse — La Russie est un cas pathologique
  argument: La capture totale par les siloviki n'est pas un modèle mais une pathologie politique. La France n'a jamais connu ça.
