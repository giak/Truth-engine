these_centrale: La Russie offre le test le plus pur de la thèse de capture par corps spécialisé : elle a connu TROIS
  effondrements idéologiques complets (Tsarat→URSS 1917, URSS→Fédération 1991) sans que l'ÉTAT administratif ne disparaisse.
  La nomenklatura soviétique se reconvertit en oligarchie postsoviétique, puis les siloviki re-capturent l'État sous Poutine
  — le corps administratif survit à l'idéologie.
theses_implicites:
- Le Table des Rangs (1722) est l'équivalent russe du keju chinois et du concours ENA.
- La nomenklatura soviétique (~1,5M de postes contrôlés) est le plus grand corps spécialisé de l'enquête.
- La transition nomenklatura→oligarchie→siloviki prouve que le corps administratif survit aux révolutions.
- La Russie = 3 systèmes, 1 État — la France = 1 État, 5 républiques. Permanence russe > permanence française.
