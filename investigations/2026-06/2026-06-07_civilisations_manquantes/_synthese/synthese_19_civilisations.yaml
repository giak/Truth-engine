  - perse_achemenide
  - mesoamerique
  - afrique_subsaharienne
  - andurarum_autopsy
- id: THESE-002
  titre: La fusion totale 4D (droit+religion+économie+morale) est l'universel civilisationnel
  enonce: Confirmé et ÉLARGI. Égypte (Maât), Mésoamérique (sacrifice humain comme obligation d'État), Byzance (césaropapisme 1000 ans), Japon (shintoïsme d'État 1868-1945), Russie (URSS = fusion totale) ajoutent 5 nouveaux cas. La France post-1789/1905 est l'EXCEPTION HISTORIQUE.
  shadow: 2.2
  enquetes_support:
  - egypte_pharaonique
  - byzance
  - mesoamerique
  - japon_imperial
  - russie
- id: THESE-003
  titre: La transmission est un RÉSEAU (Rome→Byzance→Bagdad→Cordoue→Tolède→Bologne), pas une flèche
  enonce: Confirmé et ÉLARGI. Byzance (conservation CJC 534-1453) comble le trou de 594 ans. L'Islam (Bayt al-Hikma, Cordoue, Tolède) est le deuxième maillon. La transmission est multi-linéaire, multi-séculaire.
  shadow: 1.8
  enquetes_support:
  - byzance
  - islam
  - moyen_age
- id: THESE-004
  titre: La capture par corps spécialisé est un universel — 12 cas documentés
  enonce: ÉLARGI. Égypte (clergé/30% terres), Japon (armée capture l'État 1931-45), Russie (nomenklatura→oligarchie→siloviki), Perse (satrapes/inspecteurs), Afrique (griots/caste), Mésoamérique (pochteca/guilde) s'ajoutent aux 6 cas originaux. La Grèce (sortition) est le SEUL cas de mécanisme anti-capture documenté.
  shadow: 2.5
  enquetes_support:
  - egypte_pharaonique
  - japon_imperial
  - russie
  - perse_achemenide
  - grece_classique
- id: THESE-005
  titre: Le code juridique écrit est MÉSOPOTAMIEN, pas universel
  enonce: NOUVELLE THÈSE. Égypte (0 code en 3000 ans), Mésoamérique (0 code), Perse (0 code) prouvent que le code écrit est un trait sumérien contingent. L'OBS-004 (code écrit = universel 6/11) est RÉTRACTÉE. 6/20 civilisations ont un code écrit. L'absence de code n'empêche pas la complexité étatique.
  shadow: 3.0
  enquetes_support:
  - egypte_pharaonique
  - mesoamerique
  - perse_achemenide
- id: THESE-006
  titre: La destruction des sources est un pattern récurrent de domination
  enonce: NOUVELLE THÈSE. Carthage (archives détruites par Rome 146 av.), Mésoamérique (codex brûlés <20 survivants), Afrique (historiographie coloniale nie les empires) partagent un même mécanisme d'effacement. Le vainqueur détruit les sources du vaincu.
  shadow: 4.5
  enquetes_support:
  - carthage
  - mesoamerique
  - afrique_subsaharienne
- id: THESE-007
  titre: La dissociation 4D peut être INTERNE (France 1789) ou IMPOSÉE (Japon 1947)
  enonce: NOUVELLE THÈSE. Grèce (dissociation partielle antique), Japon (dissociation imposée par occupation US 1947), France (dissociation produite de l'intérieur 1789/1905). La dissociation n'est pas un progrès linéaire — elle peut être forcée.
  shadow: 3.2
  enquetes_support:
  - grece_classique
  - japon_imperial
- id: THESE-008
  titre: Les mécanismes anti-capture existent depuis l'Antiquité — la France les a oubliés
  enonce: NOUVELLE THÈSE. Grèce (sortition, rotation, euthynai, ostracisme), Perse (inspecteurs itinérants 'Yeux et Oreilles'), Byzance (thèmes = fusion civil/militaire empêche armée autonome). La France a BESOIN de réinventer ses mécanismes anti-capture.
  shadow: 3.5
  enquetes_support:
  - grece_classique
  - perse_achemenide
  - byzance
meta_observations:
- id: OBS-001
  enonce: 'OBS-004 (code écrit = universel) est RÉTRACTÉE. Seulement 6/20 civilisations ont produit un code juridique écrit (Sumer, Rome, Chine, Islam, Inde, Grèce partiel). Égypte, Perse, Mésoamérique, Afrique prouvent qu''un État complexe fonctionne sans code écrit.'
- id: OBS-002
  enonce: 'Byzance + Islam = les DEUX maillons manquants de la transmission. Sans Byzance (conservation CJC 534-1453) ET sans Islam (traduction grec→arabe→latin), la transmission Rome→Paris est impossible.'
- id: OBS-003
  enonce: 'La capture par corps spécialisé est documentée dans 12 civilisations sur 20. La Grèce (sortition) est le SEUL cas de mécanisme ANTI-CAPTURE explicite. La France (ENA 1945) a fait le CHOIX INVERSE de la Grèce.'
- id: OBS-004
  enonce: 'La destruction des sources (Carthage, Mésoamérique, Afrique) est un MÉCANISME DE DOMINATION aussi efficace que la conquête militaire. Le vainqueur écrit l''histoire.'
- id: OBS-005
  enonce: 'Le shadow factor est inversement proportionnel à la densité documentaire : Carthage (6.5, 0 source primaire), Mésoamérique (6.4, <20 codex), Afrique (5.0, historiographie coloniale) vs Moyen Âge (1.5, archives abondantes).'
