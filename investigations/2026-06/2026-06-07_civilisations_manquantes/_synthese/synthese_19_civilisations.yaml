sujet_majoritaire: '19 civilisations (10 originales + 9 manquantes) testent 8 thèses cardinales sur 5000 ans. La fusion 4D (droit+religion+économie+morale) est le vrai universel. La capture par corps spécialisé est confortée par 6 nouveaux cas (Égypte/clergé, Japon/armée, Russie/nomenklatura). Le code écrit est MÉSOPOTAMIEN, pas universel — Égypte, Mésoamérique, Perse le confirment. La transmission Rome→Paris passe par Byzance (conservation CJC 1000 ans) ET l''Islam. La Grèce invente les mécanismes ANTI-CAPTURE (sortition) que la France a oubliés.'
theses_cardinales:
- id: THESE-001
  titre: La dette n'est PAS le mécanisme central — l'andurarum est sumérien, pas universel
  enonce: Confirmé par Égypte (aucune annulation en 3000 ans), Perse (pas de code juridique), Mésoamérique (pas d'annulation), Afrique (pas documenté). L'andurarum est un trait mésopotamien contingent. Thèse Graeber/Hudson réfutée sur 8 civilisations.
  shadow: 5.0
  enquetes_support:
