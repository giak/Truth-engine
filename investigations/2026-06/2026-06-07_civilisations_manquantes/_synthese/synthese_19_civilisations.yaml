shadow_factor_global: 4.1
shadow_factor_justification: 'Moyenne pondérée des 20 enquêtes relevée à 4.1. Les 9 nouvelles civilisations ont un shadow médian de 4.5 (Carthage 6.5, Mésoamérique 6.4, Afrique 5.0, Égypte 4.2, Russie 4.0, Perse 3.8, Grèce 3.5, Japon 4.5, Byzance 3.0) — plus élevé que les 11 originales (3.74) car les sources sont moins denses et plus biaisées. Les 8 thèses tiennent avec un shadow médian de 3.2. La thèse la plus solide : transmission réseau (shadow 1.8). La plus fragile : destruction des sources (shadow 4.5, peu de cas mais pattern clair).'
