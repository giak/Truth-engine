these_centrale: "L'assassinat de Lyhanna (11 ans, 29 mai 2026) est le produit direct de 5 défaillances systémiques convergentes : sous-dimensionnement budgétaire chronique de la justice (0,20% PIB), allocation asymétrique des ressources pénales (répression politique prioritaire sur protection des mineurs), dépendance du parquet à l'exécutif, culture d'impunité institutionnelle (zéro démission), et inversion des priorités pénales (350+ condamnations apologie terrorisme vs zéro interpellation Barella)."

theses_implicites:
  - "Le système judiciaire n'est pas défaillant : il fonctionne exactement comme conçu, allouant ses ressources de contrôle et de punition avec une précision chirurgicale qui révèle sa finalité réelle (protéger l'ordre établi, pas les citoyens)."
  - "L'absence de sanction des responsables (zéro démission, zéro limogeage) n'est pas un accident mais le mécanisme central de reproduction du système."
  - "La revue des 70 000 dossiers annoncée par Darmanin sans moyens supplémentaires est un exercice cosmétique destiné à gagner du temps jusqu'à l'oubli médiatique."

