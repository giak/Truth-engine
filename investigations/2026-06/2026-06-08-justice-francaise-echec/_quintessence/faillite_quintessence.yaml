perspectives_dialectiques:
  - position: "Thèse (officielle)"
    argument: "Défaillances individuelles, pas systémiques. Le budget a augmenté en valeur absolue (7 Md€ → 10,7 Md€). Des circulaires existent, elles n'ont simplement pas été appliquées. L'IGJ enquête."
  - position: "Antithèse (critique)"
    argument: "Système conçu pour échouer. La justice est maintenue dans un sous-dimensionnement chronique qui sert le pouvoir. Le parquet, dépendant de l'exécutif, priorise la répression politique sur la protection des citoyens. Zéro démission = reproduction garantie."
  - position: "Synthèse"
    argument: "Les deux thèses décrivent deux niveaux du même phénomène. La condition de réfutation : si le gouvernement alignait le budget justice sur la moyenne UE (0,31% PIB) et réformait le CSM, la thèse systémique serait fragilisée. L'absence de ces engagements renforce la thèse critique."

limites:
  - "Sources primaires limitées : l'enquête repose principalement sur des sources secondaires (presse, transcript, rapports publics). Les pièces judiciaires ne sont pas accessibles."
  - "Biais de confirmation : l'enquête s'inscrit dans une œuvre dont la thèse (système verrouillé) préexiste à l'affaire Lyhanna."
  - "Absence de contradictoire direct : ni la procureure d'Auch, ni Darmanin, ni les magistrats n'ont été interrogés."
  - "Temporalité : enquête rédigée 4 jours après la découverte du corps. Des informations nouvelles peuvent émerger."
  - "Effet de loupe : l'affaire Lyhanna est exceptionnelle par sa médiatisation. Des milliers d'autres violences sur mineurs ne font jamais la une."

wolves:
  - nom: "Clémence Meyer"
    argument: "La procureure d'Auch disposait d'un seul dossier criminel grave et ne l'a pas traité, invoquant une compétence territoriale discutable."
    reponse: "Le parquet d'Auch comptait 3 procureurs pour 190 000 habitants. La charge de travail était structurellement excessive. Mais le choix de ne pas traiter le seul dossier grave relève d'une priorisation défaillante."
  - nom: "Gérald Darmanin"
    argument: "Garde des Sceaux depuis 2026, refuse de démissionner après un scandale relevant de sa responsabilité ministérielle. Pattern de défausse : Stade de France → SMS → Lyhanna."
    reponse: "La non-démission est devenue une constante du système. Darmanin n'est pas l'exception, il est la règle. La question n'est pas individuelle, elle est structurelle."
  - nom: "Emmanuel Macron"
    argument: "Promesse 2022 non tenue. Son gouvernement a écarté Durand de la CIIVISE. Budget justice stagnant depuis 9 ans."
    reponse: "La destruction est méthodique : promesses non tenues, commissions vidées, budgets gelés. Le constat de fonction suffit, nul besoin d'imputer une intention malveillante."

