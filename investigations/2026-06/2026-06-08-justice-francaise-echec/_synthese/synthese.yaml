  - id: "OBS-001"
    enonce: "Pattern de défausse de Darmanin documenté sur 3 scandales distincts (Stade de France 2022, SMS 2023, Lyhanna 2026). La non-démission est devenue une constante du système : zéro démission pour défaillance de protection de l'enfance en 12 ans."
    fiches_concernees: ["faillite", "castelnau", "fresque"]
  - id: "OBS-002"
    enonce: "La France dispose de l'arsenal juridique (loi 2021, seuil de 15 ans) mais le droit change plus vite que la culture institutionnelle. Le test : les 82 recommandations CIIVISE. Taux d'application <15%."
    fiches_concernees: ["fresque", "faillite"]
  - id: "OBS-003"
    enonce: "Le cycle scandale→émotion→promesses→commission→rapport→écartement→enterrement→prochain scandale est documenté sur deux séquences complètes (CIIVISE 2021-2026, Lyhanna 2026-?)."
    fiches_concernees: ["fresque", "faillite", "castelnau"]

transversalites:
  - id: "TR-001"
    concept: "Asymétrie pénale : répression politique prioritaire, inertie violences sexuelles"
    description: "Les circulaires Dupond-Moretti (2021, 2023) documentent la trace écrite de cette asymétrie : réponse pénale ferme et rapide pour apologie du terrorisme (350+ condamnations en 2 ans), classement sans suite pour apurer les stocks de plaintes pour violences sexuelles. La France a résisté jusqu'en 2021 pour instaurer un seuil de non-consentement à 15 ans (loi du 21 avril 2021) — l'un des derniers pays européens sans âge légal explicite — alors qu'elle condamnait des Gilets Jaunes primo-délinquants à de la prison ferme dès 2018."
    fiches_concernees: ["faillite", "castelnau", "fresque"]
    faits_communs: ["F-LYH-016", "F-CAS-005a", "F-CAS-005b", "F-FR-011"]
  - id: "TR-002"
    concept: "Budget justice 0.20% PIB comme constante structurelle"
    description: "Présent dans 3 fiches sur 4, le chiffre de 0.20% PIB est la donnée la plus transversale du dossier. Inchangé depuis 2017, il est le dénominateur commun de toutes les défaillances documentées."
    fiches_concernees: ["faillite", "castelnau", "fresque"]
    faits_communs: ["F-LYH-014", "F-CAS-011"]
  - id: "TR-003"
    concept: "Zéro démission comme mécanisme de reproduction"
    description: "La non-démission est normalisée à tous les échelons : Darmanin (Garde des Sceaux), Dupond-Moretti (prédécesseur), Macron (Président). Aucun responsable n'a jamais démissionné pour une défaillance de protection de l'enfance."
    fiches_concernees: ["faillite", "angles", "fresque"]
    faits_communs: ["F-LYH-008", "F-ANG-006", "F-FR-013"]
  - id: "TR-004"
    concept: "Cycle scandale→émotion→promesse→oubli→prochaine victime"
    description: "Documenté sur 50 ans : Matzneff (1977→2020, 43 ans d'impunité), CIIVISE (2021→2026, 5 ans de démantèlement), Lyhanna (2026→?). La prédiction forensique : la revue des 70 000 dossiers annoncée par Darmanin sera oubliée avant la prochaine victime."
    fiches_concernees: ["fresque", "faillite", "castelnau"]
    faits_communs: ["F-FR-008", "F-LYH-015", "F-CAS-003"]

gaps:
  - "GAP-001 — Absence de contradictoire direct : aucun des 4 enquêtes n'a interrogé Darmanin, la procureure d'Auch (Clémence Meyer), les magistrats concernés, ou les acteurs nommés (Rizet, Fourar, Philippe). Cette absence est structurelle (enquête en source ouverte) mais constitue une limite forensique majeure."
  - "GAP-002 — Comparaison internationale qualitative : les données CEPEJ (11.3 juges/100k) sont citées mais aucune comparaison qualitative avec l'Allemagne, les Pays-Bas ou la Suède n'est produite. Comment ces pays traitent-ils les violences sexuelles sur mineurs ?"
  - "GAP-003 — Voix des victimes : aucun témoignage direct de victime (hors Springora citée dans la fresque). Les 30 000 témoignages CIIVISE sont mentionnés mais leur contenu n'est pas analysé. La famille de Lyhanna n'a pas été contactée."
  - "GAP-004 — Maillon manquant : le proviseur de Lectoure (2021) n'est pas nommé. La chaîne de remontée administrative (proviseur → DASEN → recteur → ministre) n'est pas documentée."

