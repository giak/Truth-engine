sujet_majoritaire: "L'assassinat de Lyhanna (11 ans, 29 mai 2026) révèle une architecture institutionnelle de protection de la pédocriminalité opérant à 4 niveaux interconnectés : local (silence administratif et inertie du parquet), national (asymétrie pénale structurelle documentée par les circulaires), historique (infrastructure culturelle de 50 ans, de la pétition Foucault 1977 au démantèlement de la CIIVISE), et médiatique (diversion et spectacularisation)."

theses_cardinales:
  - titre: "THESE-001 : Asymétrie pénale structurelle"
    enonce: "La justice française alloue ses ressources de répression avec une précision chirurgicale qui révèle sa finalité réelle : ~400 prison ferme pour Gilets Jaunes, 350+ condamnations pour apologie du terrorisme (circulaire JUSD2327199C du 10 oct 2023), zéro interpellation de Barella malgré 9 procédures antérieures dont 4 plaintes pour viol sur mineur. La dépêche interministérielle du 31 mai 2021 ordonnant le classement sans suite pour 'apurer les stocks' documente la face administrative de cette asymétrie."
    f_atomiques_justificatifs: ["F-LYH-005", "F-LYH-016", "F-CAS-005a", "F-CAS-005b", "F-CAS-007", "F-CAS-011"]
    fiches_sources: ["faillite", "castelnau"]
    shadow: 3.5
    etendue: "2/4 fiches"
    condition_refutation: "Si le gouvernement alignait les condamnations pour violences sexuelles sur mineurs sur le rythme des condamnations pour apologie du terrorisme, la thèse d'asymétrie serait fragilisée."

  - titre: "THESE-002 : Protection de caste"
    enonce: "La même logique qui protège Barella par négligence locale (9 procédures, zéro interpellation) protège Duhamel par prescription nationale et Matzneff par immunité culturelle (40 ans). Le système punit les protecteurs d'enfants avec célérité maximale (Tabard licencié en 2022, débouté aux prud'hommes en 2026) et protège les prédateurs par inertie administrative. La verticale Duhamel→Bigorgne→Barella n'est pas une conspiration mais un effet de système : la même logique de caste opère à tous les niveaux."
    f_atomiques_justificatifs: ["F-ANG-001", "F-ANG-005", "F-FR-001", "F-FR-006", "F-FR-008", "F-LYH-005"]
    fiches_sources: ["angles", "fresque", "faillite"]
    shadow: 5.0
    etendue: "3/4 fiches"
    condition_refutation: "Si un cas documenté de prédateur d'élite sanctionné avec la même célérité qu'un Gilet Jaune était produit, la thèse de protection de caste serait nuancée."

  - titre: "THESE-003 : Vidage méthodique des contre-pouvoirs"
    enonce: "La CIIVISE (2021-2026) illustre le mécanisme de neutralisation des contre-pouvoirs : création sous pression médiatique (janvier 2021) → 30 000 témoignages recueillis → 82 recommandations (novembre 2023) → écartement du président Durand (décembre 2023) → 11 démissions en cascade → taux d'application <15% → nouvelle vague de démissions (janvier 2026) → mission de transformation (reprise en main gouvernementale). La CEDH condamne la France (avril 2025) sans qu'aucune conséquence institutionnelle n'en découle."
    f_atomiques_justificatifs: ["F-FR-010", "F-FR-012", "F-FR-013", "F-FR-016", "F-LYH-015", "F-FR-014"]
    fiches_sources: ["fresque", "faillite"]
    shadow: 4.0
    etendue: "2/4 fiches"
    condition_refutation: "Si le taux d'application des 82 recommandations CIIVISE dépassait 50%, la thèse de vidage serait affaiblie."

  - titre: "THESE-004 : Sous-dimensionnement budgétaire chronique"
    enonce: "Le budget justice français est à 0.20% du PIB depuis 2017 (médiane UE : 0.31%). La France compte 11.3 juges pour 100 000 habitants (moyenne UE : 21.9), la plaçant au 4e rang des budgets les plus faibles d'Europe en part du PIB. Ce sous-dimensionnement n'est pas un accident conjoncturel : il est la constante des 9 années de présidence Macron, malgré une promesse publique en 2022. Le résultat mécanique est un parquet d'Auch disposant de 3 procureurs pour 190 000 habitants, structurellement incapable de traiter les plaintes pour viol sur mineur."
    f_atomiques_justificatifs: ["F-LYH-012", "F-LYH-014", "F-CAS-011", "F-FR-014"]
    fiches_sources: ["faillite", "castelnau", "fresque"]
    shadow: 3.0
    etendue: "3/4 fiches"
    condition_refutation: "Si le budget justice 2027 atteignait 0.31% du PIB (médiane UE), la thèse de sous-dimensionnement volontaire serait fragilisée."

  - titre: "THESE-005 : Convergence médiatique et diversion"
    enonce: "L'affaire Lyhanna déclenche une séquence médiatique identifiable : (1) émotion légitime (marche blanche, 6 000 personnes), (2) diversion (Rizet/BFMTV pointe l'Islam en prison plutôt que la défaillance judiciaire), (3) spectacularisation politique (Darmanin annonce une revue cosmétique de 70 000 dossiers sans moyens supplémentaires), (4) contre-narration indépendante (Le Monde Moderne/Castelnau) qui produit une analyse structurelle absente des médias dominants. Le transcript Castelnau est un artefact de résistance mais son EDI de 0.17 impose de le traiter comme une source parmi d'autres."
    f_atomiques_justificatifs: ["F-LYH-008", "F-ANG-002", "F-CAS-001", "F-CAS-003"]
    fiches_sources: ["faillite", "angles", "castelnau"]
    shadow: 5.5
    etendue: "3/4 fiches"
    condition_refutation: "Si un grand média français produisait une enquête structurelle sur l'asymétrie pénale (et non sur le 'manque de moyens'), la thèse de diversion médiatique serait nuancée."

