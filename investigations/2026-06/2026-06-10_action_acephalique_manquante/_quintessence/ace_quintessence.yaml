    enonce: "Le corpus ne cite JAMAIS Sharp (198 méthodes non-violentes, 1973), Ostrom (8 principes des communs, Nobel 2009), Tilly (WUNC, 2004), Scott (infrapolitique, 1985), Graeber (démocratie directe, 2013), Polletta (démocratie participative, 2002)."
