evolution_v1_v2: "La V1 concluait à une absence totale de théorie d'action acéphalique dans le corpus. La V2 corrige : la théorie EXISTE dans les articles (rhizome, résidu, attrition, désorganisation, RIC) mais n'est PAS intégrée dans l'architecture KERNEL. Le gap réel est un défaut d'intégration architecture/articles, pas une absence."

these_centrale: "Le corpus Truth Engine contient une théorie d'action acéphalique opérationnelle dans ses articles mais son architecture KERNEL (RESISTANCE.md) ne l'intègre pas, produisant un système qui diagnostique le verrouillage avec une précision forensique tout en rendant structurellement invisibles ses propres clés de déverrouillage."
theses_implicites:
  - "L'architecture KERNEL a été figée avant la production des articles d'action — le gap est temporel et méthodologique, pas idéologique."
  - "Le corpus ancre sa théorie d'action dans la tradition française continentale (Weil, Debord, Fisher, Sloterdijk) et ignore délibérément la tradition anglo-américaine de l'action collective (Ostrom, Sharp, Tilly, Scott, Graeber), ce qui le prive d'outils tactiques validés et de cas historiques comparables."
  - "La non-intégration architecture/articles est un Κ (Kappa) auto-appliqué : le corpus produit de la lucidité paralysante en continuant de diagnostiquer le verrouillage sans que ses propres solutions ne remontent dans la structure théorique."

faits_atomiques:
  - id: "F-ace-001"
    enonce: "Le corpus Truth Engine (103 posts Substack, 17 articles centraux) contient 0 mention des théoriciens de l'action collective horizontale : Ostrom, Scott, Sharp, Tilly, Graeber, Polletta, Hirschman, Olson."
    source_url: "Analyse d'index + 17 articles lus"
    source_section: "§4 L1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-ace-002"
    enonce: "RESISTANCE.md (cluster KERNEL) charge 3/8 concepts — tous négatifs (FAKE_RESISTANCE, OPPOSITION_CONTROLLED, DEPOLITICIZATION). Les 5 concepts d'action positive (SOLIDARITY_NETWORK, CIVIL_DISOBEDIENCE, MUTUAL_AID, COMMONS, COLLECTIVE_EFFICACY) sont vides."
    source_url: "file:///home/giak/projects/truth-engine/truth-engine-v2/clusters/RESISTANCE.md"
    source_section: "§3"
    head_status: 0
    tier: 1
    glyphe: "❧"
