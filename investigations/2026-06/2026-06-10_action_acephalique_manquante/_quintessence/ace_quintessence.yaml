perspectives_dialectiques:
  - position: "Thèse — Architecture KERNEL (statu quo)"
    argument: "Le KERNEL est un moteur d'investigation forensique. Sa fonction première est la révélation (Ξ). Les clusters de résistance chargent les concepts pertinents pour le diagnostic — les formes contrôlées ou fausses de résistance. La prescription n'est pas dans son périmètre. Les articles la traitent séparément, et cette séparation est fonctionnelle."
  - position: "Antithèse — Perspective Articles (théorie d'action embarquée)"
    argument: "Les articles contiennent une théorie d'action complète et opérationnelle en 4 couches (rhizome → résidu → désorganisation → RIC). Cette théorie est testée conceptuellement, reliée entre articles par des renvois, et ancrée dans une tradition philosophique cohérente. Mais sa non-intégration dans le KERNEL réduit son impact systémique et la rend invisible aux investigateurs qui utilisent le KERNEL comme point d'entrée."
  - position: "Synthèse — Double gap architecture/articles + France/Anglo-Amérique"
    argument: "Le corpus a deux gaps simultanés : (1) un gap interne (articles vs KERNEL) corrigible par mise à jour de RESISTANCE.md avec 5 nouveaux concepts (RHIZOME, RESIDU, ATTRITION, DESORGANISATION, RIC), et (2) un gap externe (tradition française continentale vs anglo-américaine) qui prive le corpus de 198 méthodes tactiques documentées (Sharp), de 5 cas historiques comparables, et de cadres théoriques validés empiriquement (Ostrom, Tilly). Les deux gaps sont indépendants mais se renforcent mutuellement."

limites:
  - "L'investigation s'appuie sur 22 articles lus (17 diagnostiques + 5 stratégiques) — d'autres articles pourraient contenir des références aux théoriciens absents ou à des cas historiques."
  - "L'analyse de RESISTANCE.md est basée sur le fichier à date — le KERNEL a pu évoluer depuis l'analyse."
  - "L'intention de l'auteur (Giak) n'est pas connue : l'absence d'Ostrom/Sharp/Scott pourrait être un choix éditorial délibéré plutôt qu'une omission involontaire."
  - "La V1 a conclu à une absence totale de théorie d'action — cette conclusion était partiellement erronée, ce qui rappelle que même une méta-investigation rigoureuse peut manquer des faits significatifs."
  - "Aucune analyse de la réception par les lecteurs : les abonnés Substack ont-ils noté cette absence ? Les commentaires en parlent-ils ?"

wolves:
  - nom: "Défenseur de l'architecture KERNEL"
    argument: "Le KERNEL n'a pas vocation à intégrer la prescription. Sa fonction est le diagnostic. Mélanger diagnostic et prescription dans la même architecture créerait de la confusion épistémique. Les articles sont le bon véhicule pour l'action, le KERNEL pour l'analyse."
    reponse: "La séparation est défendable, mais elle doit être EXPLICITE, pas subie. Si RESISTANCE.md a 5 slots vides, le lecteur ne voit pas 'choix éditorial', il voit 'absence'. L'architecture doit soit intégrer les concepts, soit documenter explicitement pourquoi elle ne le fait pas."
  - nom: "Critique de la tradition française"
    argument: "Weil, Debord, Fisher, Sloterdijk suffisent. La tradition anglo-américaine (Ostrom, Sharp) est trop optimiste, trop réformiste, trop libérale. Le corpus fait un choix philosophique cohérent en s'ancrant dans la critique continentale."
    reponse: "Même en acceptant ce choix, les cas historiques (Solidarnosc, Zapatistes, Hong Kong) ne sont pas des 'théories anglo-américaines' — ce sont des FAITS. Un corpus forensique ne peut pas exclure des faits pour des raisons de tradition philosophique."
  - nom: "Pragmatiste"
    argument: "Cette méta-investigation est du nombrilisme. Le corpus produit des articles de qualité, les lecteurs les lisent, le gap architecture/articles est un problème d'ingénierie interne qui n'intéresse personne."
    reponse: "Le gap n'est pas qu'interne. Il affecte les nouveaux lecteurs qui découvrent le corpus par l'index ou le KERNEL — ils voient un corpus autopsique sans savoir que les solutions existent. C'est un problème de première impression et de complétude."

iceberg:
  - "La question du lectorat réel : qui lit le KERNEL vs qui lit les articles ? Le gap n'est problématique que si les mêmes personnes lisent les deux."
  - "Le rôle de l'IA dans la production du corpus : les articles d'action ont-ils été co-écrits avec un LLM ? Si oui, le gap est aussi un gap entre production humaine (KERNEL) et production assistée (articles)."
  - "La viabilité réelle des 4 couches d'action : le rhizome, le résidu, l'attrition et la désorganisation ont-ils été testés empiriquement ou restent-ils des hypothèses conceptuelles ?"
  - "Mnemolite UP mais endpoint /v1/search/ retourne 500 Internal Server Error (3 tentatives, GET et POST). Base non interrogeable pour ce sujet."
