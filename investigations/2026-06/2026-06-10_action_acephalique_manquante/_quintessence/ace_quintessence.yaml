    enonce: "Le corpus ne cite AUCUN cas historique de résistance acéphalique massive : Solidarnosc (1980, 17 grévistes → 10M membres), Zapatistes (1994-2026, 30 ans d'autonomie), Hong Kong 2019 (modèle open-source leaderless), Occupy Wall Street (2011, AG de 3000+ personnes), Civil Rights Movement (1955-1968)."
