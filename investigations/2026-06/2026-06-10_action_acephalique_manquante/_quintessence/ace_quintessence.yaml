    enonce: "Le corpus contient une théorie d'action acéphalique en 4 couches : Rhizome (Protocole ré-enracinement, 6 étapes), Souveraineté par le Résidu (Dernière Récolte §V, 4 tactiques), Attrition logistique (Agriculture scanner §VIII-IX, 3 zones), Désorganisation (Peuple souverain, guerre cognitive retournée)."
