enquete_id: "finance"
complexity: "APEX"
date_extraction: "2026-06-12"
enquete_source: "investigations/2026-06-10_financement_coordination/"
fichiers_sources:
  - "2026-06-10_10-00_financement_coordination_APEX.md (416 lignes, 20 faits, 6 modèles historiques, 3 scénarios budgétaires)"

these_centrale: "L'argent est le verrou silencieux de la coordination : sans budget minimum de 6000-8000€/mois pour une cellule de 5 personnes, les 15 protocoles de la HYPER_MATRICE sont des fantasmes. La fenêtre de financement viable (2000-10 000€/mois) est trop étroite pour les actions de masse et toute caisse commune est juridiquement qualifiable d'association de malfaiteurs (art.450-1 CP)."
theses_implicites:
  - "La dette et la précarité sont les armes de contrôle social les plus efficaces : un citoyen endetté n'a ni le temps ni l'argent pour militer. Le verrou financier est auto-exécutoire — le système n'a pas besoin d'interdire, il suffit de rendre toute caisse commune illégale et tout mouvement financier tracé (TRACFIN)."
  - "Aucun modèle historique de financement (NORAID, FLN, Zapatistes, Black Panthers, collectivités espagnoles, crypto) n'est à la fois légal, non-détectable et suffisant en France 2026. Chaque modèle a été soit détruit, soit neutralisé, soit inapplicable au contexte français."
  - "Le financement est le maillon le plus risqué juridiquement : art.450-1 CP (10 ans), art.324-1 CP blanchiment (5 ans), art.706-158 CPP gel des avoirs, art.413-10 CP intelligence avec puissance étrangère (15 ans). La moindre erreur de gestion expose toute la cellule."

faits_atomiques:
  - id: "F-finance-001"
    enonce: "Budget survie minimale d'une cellule de 5 personnes (zéro action, pure préparation) : 6050€/mois — 72 600€/an. Postes : logement 2500€, alimentation 1500€, santé 400€, transport 500€, communication 100€, légal 250€."
    source_url: "Scénario §5.1"
    source_section: "§5.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-finance-002"
    enonce: "Budget cellule active (5 personnes, 1 action/mois, défense légale) : 8150€/mois — 97 800€/an. Ce niveau commence à générer des flux détectables par TRACFIN."
    source_url: "Scénario §5.2"
    source_section: "§5.2"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-finance-003"
    enonce: "Budget expansion (5→20 personnes, 3 cellules, 6 actions/mois) : 36 100€/mois — 433 200€/an. Détection TRACFIN quasi-certaine à ce niveau."
    source_url: "Scénario §5.3"
    source_section: "§5.3"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-finance-004"
    enonce: "Seuil TRACFIN : déclaration obligatoire pour tout dépôt en espèces >1000€ (art.L561-15 CMF). Depuis 2024, TRACFIN détecte les flux <10 000€ par analyse de pattern (signaux faibles)."
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000038588629"
    source_section: "§4.1"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-finance-005"
    enonce: "Fenêtre de financement viable : 2000-10 000€/mois. Sous 2000€ = impossible d'opérer. Au-dessus de 10 000€ = détection TRACFIN quasi-certaine. La fenêtre est trop étroite pour les actions de masse."
    source_url: "Analyse §4.3"
    source_section: "§4.3"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-finance-006"
    enonce: "Art.450-1 CP : toute caisse commune en vue d'actions collectives non autorisées = association de malfaiteurs (10 ans, 750 000€ d'amende). Le simple fait d'organiser une cotisation mensuelle est un acte préparatoire."
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006417294"
    source_section: "§4.4"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-finance-007"
    enonce: "NORAID (Irish Northern Aid Committee) : millions de dollars collectés dans la diaspora irlandaise US via pubs, dons, galas. Infiltré par le FBI. Modèle inapplicable en France (art.413-10 CP, 15 ans)."
    source_url: "https://www.britannica.com/topic/NORAID"
    source_section: "§6.1"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-008"
    enonce: "FLN algérien : triple financement — soutien du régime égyptien (Nasser), impôt révolutionnaire (3-5% des salaires des Algériens en France), collectes pays arabes. ~50M francs/an (1960). Dépendance à un État étranger = vulnérabilité politique."
    source_url: "Colin-Jeanvoine, Le financement du FLN (2005)"
    source_section: "§6.2"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-009"
    enonce: "Zapatistes EZLN : modèle coopératif — refus de tout financement étatique. Financement par coopératives agricoles (café, artisanat) + tourisme solidaire + dons internationaux. Contrôle communautaire par assemblées. Seul modèle encore fonctionnel (30+ ans)."
    source_url: "https://enlacezapatista.ezln.org.mx/"
    source_section: "§6.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-010"
    enonce: "Black Panthers Free Breakfast Program (1969) : nourrissait 20 000 enfants/jour dans 36 villes. Service social légitime = couverture pour financement politique. Hoover (FBI) : 'la plus grande menace pour la sécurité intérieure'. Détruit par le FBI."
    source_url: "https://www.blackpast.org/african-american-history/black-panther-partys-free-breakfast-program-1969-1980/"
    source_section: "§6.4"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-011"
    enonce: "Coût d'un avocat pénaliste : garde à vue 250-1200€, forfait procédure pénale 2000-8000€, cour d'assises 5000-15 000€. Sans fonds légal, un militant arrêté est isolé et peut dénoncer ses camarades sous pression."
    source_url: "https://www.mariloulepage.fr/blog/prix-avocat-penaliste"
    source_section: "§3.2"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-012"
    enonce: "Coût communication cellule : 4440-8350€ première année (VPN, téléphones cryptés Pacem 800-1500€/pièce, serveurs, Proton Mail). Récurrent an 2+ : 1140-1800€/an."
    source_url: "https://mullvad.net ; https://pacem.global/smartphones-securises/"
    source_section: "§3.3"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-013"
    enonce: "Eusko (monnaie locale basque) : 40M€ en circulation (2025), plus grande monnaie locale d'Europe. Aucune monnaie locale n'a atteint l'échelle nécessaire pour financer une coordination politique."
    source_url: "https://www.euskalmoneta.org/"
    source_section: "§8 Niveau 7"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-014"
    enonce: "Chainalysis (2025) : 90% des transactions BTC/ETH sont cartographiées, <50% des transactions Monero. La blockchain est un registre public. Les échangeurs sont KYC/AML. La crypto est un outil, pas une solution."
    source_url: "https://www.chainalysis.com/crypto-crime-report/"
    source_section: "§8 Niveau 6"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-finance-015"
    enonce: "Paradoxe de la dépendance : pour être indépendant du système, il faut de l'argent qui ne peut venir que du système. Tout financement passe par des membres qui travaillent dans l'économie légale, donc identifiés, tracés, vulnérables."
    source_url: "Analyse §4.2"
    source_section: "§4.2"
    head_status: 0
    tier: 1
    glyphe: "❧"

acteurs:
  - nom: "Cellule de 5 personnes"
    role: "Unité de base de la coordination — besoin de 6050-8150€/mois pour exister et agir"
    faits_lies: ["F-finance-001", "F-finance-002"]
  - nom: "TRACFIN"
    role: "Agence de détection financière — seuil 1000€ espèces, signaux faibles <10 000€, rend toute caisse commune traçable"
    faits_lies: ["F-finance-004", "F-finance-005"]
  - nom: "NORAID"
    role: "Modèle diaspora irlandaise — millions $ collectés, infiltré FBI, inapplicable en France (art.413-10 CP)"
    faits_lies: ["F-finance-007"]
  - nom: "Zapatistes (EZLN)"
    role: "Seul modèle encore fonctionnel — coopératives agricoles, refus financement étatique, 30+ ans de survie financière"
    faits_lies: ["F-finance-009"]
  - nom: "État français (Légifrance, TRACFIN, JIRS)"
    role: "Cadre répressif : art.450-1 CP, 324-1 CP, 706-158 CPP, 413-10 CP — toute tentative de financement est criminalisée"
    faits_lies: ["F-finance-006"]

causalites:
  - cause: "F-finance-015"
    effet: "F-finance-001"
    mecanisme: "Le paradoxe de la dépendance rend tout financement traçable : l'argent vient de membres qui travaillent dans l'économie légale, donc chaque flux est détectable par TRACFIN."
  - cause: "F-finance-004"
    effet: "F-finance-005"
    mecanisme: "Les seuils TRACFIN (1000€ espèces, signaux faibles <10 000€) créent une fenêtre de financement viable trop étroite : sous 2000€/mois impossible d'opérer, au-dessus de 10 000€/mois détection quasi-certaine."
  - cause: "F-finance-006"
    effet: "F-finance-002"
    mecanisme: "L'art.450-1 CP qualifie toute caisse commune de préparation d'association de malfaiteurs. Même le scénario 'cellule active' (8150€/mois) expose à 10 ans de prison."
  - cause: "F-finance-014"
    effet: "F-finance-005"
    mecanisme: "La pseudo-solution crypto est un mirage : BTC/ETH sont tracés à 90%, Monero est illiquide, les échangeurs sont KYC/AML. La blockchain n'offre pas l'anonymat promis."

perspectives_dialectiques:
  - position: "Thèse — La coordination est impossible sans argent"
    argument: "Les 15 protocoles de la HYPER_MATRICE supposent des ressources (local, avocat, téléphones, véhicules, tracts). Sans budget minimum de 6000-8000€/mois, ils sont des fantasmes. Nier le problème de l'argent, c'est condamner la coordination à l'échec avant même d'avoir commencé."
  - position: "Antithèse — L'argent n'est pas le vrai problème"
    argument: "Les Gilets Jaunes ont mobilisé sans budget (cagnottes Leetchi = 1M€ mais pour 300 000 participants). Les Zapatistes vivent avec presque rien. La vraie ressource est la détermination, pas l'argent. Si 5 personnes sont vraiment déterminées, elles trouveront 6000€/mois."
  - position: "Synthèse — Le problème n'est pas la somme mais la légalité"
    argument: "6000€/mois est une somme accessible (5 personnes × 200€ de cotisation + cagnotte = 1000€ de base, le reste par dons). Le vrai problème n'est pas d'atteindre la somme — c'est qu'à partir du moment où 5 personnes cotisent régulièrement à une caisse commune en vue d'actions non autorisées, elles commettent l'infraction d'association de malfaiteurs (art.450-1 CP). Le verrou n'est pas économique, il est juridique."

limites:
  - "Les estimations budgétaires supposent un niveau de vie 'normal' — en mode frugalité extrême (dortoirs collectifs, sans mutuelle), les coûts pourraient être réduits de 30-40%."
  - "Les prix cités sont français (2026) — une cellule basée en Belgique ou en zone rurale réduirait certains coûts mais en augmenterait d'autres."
  - "Les 6 modèles historiques sont présentés comme des preuves de concept mais tous ont été soit détruits, soit neutralisés."
  - "L'analyse crypto sous-estime peut-être Monero et les solutions P2P (Bisq) mais la tendance réglementaire est au durcissement."

wolves:
  - nom: "Optimiste crypto"
    argument: "Monero résout le problème. Pas de KYC, pas de registre public, pas de traçabilité. Une cellule peut se financer intégralement en XMR sans que TRACFIN ne voie rien."
    reponse: "Monero est effectivement plus anonyme mais (1) les échangeurs le délistent progressivement, (2) le volume est insuffisant pour 6000€/mois de conversion, (3) la possession de XMR est en elle-même un signal pour TRACFIN, (4) le prix du XMR est volatile."
  - nom: "Frugaliste"
    argument: "6000€/mois c'est du luxe. Une cellule en mode survie peut fonctionner avec 2000-3000€/mois : squat collectif, nourriture Recovery, transports à vélo, avocat commis d'office, téléphones reconditionnés."
    reponse: "Possible mais au prix d'une précarité qui use les militants en mois, pas en années. La frugalité extrême est une solution court-terme, pas une stratégie de viabilité."

iceberg:
