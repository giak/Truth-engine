causalites:
  - cause: "F-fresque-001"
    effet: "F-fresque-011"
    mecanisme: "Milgram, Asch, Zimbardo démontrent que l'obéissance est la norme, pas l'exception. Le système n'a pas besoin d'imposer par la force — il lui suffit de configurer les conditions (autorité légitime, pression du groupe, rôle) pour que l'obéissance émerge spontanément."
  - cause: "F-fresque-005"
    effet: "F-fresque-010"
    mecanisme: "La concentration médiatique (9 milliardaires = 80%) verrouille le cadre du débat public (Chomsky, 5 filtres), rendant la stratégie du choc (Klein) imperceptible comme système — chaque crise semble 'naturelle'."
  - cause: "F-fresque-012"
    effet: "F-fresque-013"
    mecanisme: "L'angle mort du système (non-numérisable, non-marchand, non-spectacularisable) est l'espace où les 5 doctrines de guérilla (rhizome, résidu, désorganisation, RIC, asphyxie) peuvent opérer sans être détectées."
  - cause: "F-fresque-006"
    effet: "F-fresque-007"
    mecanisme: "La dette (115,6% PIB) justifie l'austérité qui étrangle l'éducation. PISA baisse. La population devient incapable de comprendre les mécanismes qui l'écrasent — cercle vicieux."

perspectives_dialectiques:
  - position: "Thèse — Les 12 mécanismes forment un système intentionnel"
    argument: "La convergence parfaite des outputs (tous produisent l'isolement), la densité du réseau élitaire (Le Siècle, ENA), et la synchronisation des crises (COVID, guerre, climat) suggèrent une coordination centrale. La thèse du 'complot' n'est pas nécessaire mais la thèse de l'accident l'est encore moins."
  - position: "Antithèse — Les mécanismes sont des phénomènes séparés, convergents par hasard"
    argument: "Milgram (psychologie), Bernays (publicité), Chomsky (médias), Klein (économie) n'ont jamais collaboré. Leur convergence est le produit de la sélection naturelle des tactiques efficaces, pas d'une coordination. L'ENA et Le Siècle sont des clubs, pas un comité central."
  - position: "Synthèse — Convergence structurelle sans coordination centrale"
    argument: "L'enquête elle-même le reconnaît (L5) : l'application macrosociale de Biderman est une 'extension abusive'. La convergence est réelle mais son explication est structurelle (intérêts de classe partagés, mêmes écoles, mêmes clubs) plutôt qu'orchestrée. La distinction technique n'a pas d'importance pratique pour ceux qui subissent l'effet."

limites:
  - "L'application macrosociale de Biderman (8 techniques de lavage de cerveau en captivité) à la société civile est une extension théorique non validée empiriquement."
  - "L'iceberg factor (2.13) est calculé avec des coefficients subjectifs — la méthode n'est pas scientifique."
  - "Aucune analyse genrée ou raciale des 12 mécanismes — ils frappent différemment selon le genre, la race, la classe."
  - "Pas de comparaison internationale — les mécanismes sont-ils spécifiques à la France ou communs à toutes les démocraties occidentales ?"
  - "Le biais déterministe : le système semble invincible, les contre-exemples (Solidarnosc, Zapatistes) sont mentionnés mais minimisés."

wolves:
  - nom: "Défenseur du système"
    argument: "Les 12 mécanismes sont la description de toute société complexe, pas d'un 'système oligarchique'. La dette, la publicité, les médias, l'éducation : ce sont des réalités, pas des complots. Vous confondez description et accusation."
    reponse: "La question n'est pas l'existence des mécanismes mais leur CONVERGENCE. Pris séparément, chacun est banal. Pris ensemble, ils produisent un citoyen qui ne peut pas se coordonner. La convergence est un fait, pas une théorie."
  - nom: "Techno-optimiste"
    argument: "L'angle mort du système (non-numérisable) se réduit chaque année. L'IA, la reconnaissance faciale, la blockchain : tout devient traçable. Dans 5 ans, il n'y aura plus d'angle mort. Le maquis est une solution temporaire."
    reponse: "L'angle mort se réduit pour le système, pas pour les humains. La confiance, le contact réel, la production commune restent non-numérisables par nature. Le maquis n'est pas une cachette — c'est un mode d'existence alternatif."

iceberg:
  - "Les mécanismes additionnels non identifiés (3-5 estimés) : financement politique occulte, capture de la justice, contrôle des nominations, etc."
  - "La question des nouveaux mécanismes 2020-2030 : IA générative, surveillance prédictive (LOPMI), effondrement attentionnel — non traités en profondeur."
