these_centrale: "L'oligarchie contemporaine ne maintient pas son pouvoir par la force directe mais par un système bouclé de 12 mécanismes interconnectés (Milgram, Biderman, publicité, division, choc, égotisme, spectacle, propagande, escrologie, ploutocratie, complosophisme, idiocratie) dont la fonction unique est la production de l'individu isolé, informé et inoffensif — incapable de coordination réelle. Le système ne verrouille pas la révolte, il verrouille la coordination."
theses_implicites:
  - "La convergence sans coordination centrale est le principe organisateur du système : les 12 mécanismes sont actionnés par des acteurs différents (publicitaires, politiciens, algorithmes, médias) mais produisent TOUS le même output. La sélection naturelle des tactiques qui 'marchent' remplace le complot."
  - "L'angle mort du système est ce qu'il ne peut pas voir, numériser, monétiser ou spectaculariser : la communauté non-marchande, l'action invisible, la coordination hors-ligne, le maquis. C'est dans cet angle mort que la résistance peut opérer."
  - "Le corpus contient déjà une doctrine de guérilla complète en 5 couches (rhizome, résidu, désorganisation, RIC, asphyxie du Golem) mais fragmentée dans 5 articles. La synthèse existe, l'organisation manque."

faits_atomiques:
  - id: "F-fresque-001"
    enonce: "Milgram (1963) : 65% des sujets infligent des décharges de 450V sur ordre d'une autorité. Hofling (1966) : 21/22 infirmières obéissent à un ordre médical dangereux. Stanford Prison (1971) : le rôle transforme l'identité en 6 jours."
    source_url: "https://www.simplypsychology.org/milgram.html"
    source_section: "§12 F1, F2, F3"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-002"
    enonce: "Biderman (1957) : 8 techniques de coercition (isolement, monopole attention, épuisement, humiliation, menaces, pressions, indulgence occasionnelle, conformité forcée) — transposables à la société civile entière."
    source_url: "https://www.strath.ac.uk/media/1newwebsite/departmentsubject/socialwork/documents/eshe/Bidermanschartofcoercion.pdf"
    source_section: "§12 F14"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-003"
    enonce: "Bernays (1928) : invente les relations publiques comme technique de manipulation des masses par les désirs inconscients. 'Torches of Freedom' (1929) : fait fumer les femmes en liant cigarette à émancipation."
    source_url: "https://www.pbs.org/wgbh/americanexperience/features/torches-of-freedom/"
    source_section: "§12 F5"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-004"
    enonce: "Gilens & Page (2014) : analyse de 1779 propositions politiques sur 20 ans. Les élites économiques ont une influence substantielle ; les citoyens ordinaires et les groupes de masse en ont presque zéro."
    source_url: "https://archive.org/details/gilens_and_page_2014_-testing_theories_of_american_politics.doc"
    source_section: "§12 F4"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-005"
    enonce: "Concentration médiatique : 9 milliardaires contrôlaient 80% des médias français (Bolloré, Niel, Drahi, Arnault, Saadé, Bouygues, Dassault, Lagardère, Ouest-France). Après consolidations 2025, 5 milliardaires. CNews n°1 chaîne info (2024)."
    source_url: "https://lessentieldeleco.fr/2322-qui-possede-les-medias-en-france/"
    source_section: "§12 F6, F17"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-fresque-006"
    enonce: "Dette publique française : 3 482 Mds€ (115,6% PIB, Q3 2025). Charge d'intérêts : 67 Mds€ (2025) → 74 Mds€ (2026). Premier budget de l'État, justifie l'austérité."
    source_url: "https://www.insee.fr/fr/statistiques/8686951"
    source_section: "§12 F8, F9"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-007"
    enonce: "PISA 2022 : France 26e en compréhension de l'écrit (474 pts), baisse historique et structurelle depuis 30 ans. 50% des Français ne comprennent pas un texte simple."
    source_url: "https://www.oecd.org/en/about/programmes/pisa.html"
    source_section: "§12 F7"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-008"
    enonce: "Le Siècle (~600 membres) + ENA/INSP (~6 500 énarques) : cœur de la reproduction élitaire française. 85% des décideurs sortent de l'ENA. Degré de séparation entre élites ~2."
    source_url: "https://www.vie-publique.fr/eclairage/268499-le-siecle-cercle-de-reflexion-influent"
    source_section: "§12 F10"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-009"
    enonce: "Aza Raskin invente l'infinite scroll (2006) — l'innovation clé du verrouillage attentionnel. L'algorithme maximise l'engagement = maximise la division."
    source_url: "https://www.npr.org/2026/04/07/nx-s1-5775917/why-infinite-scrolls-inventor-wants-to-kill-his-creation"
    source_section: "§12 F15"
    head_status: 0
    tier: 2
    glyphe: "❧"
  - id: "F-fresque-010"
    enonce: "Klein (2007) : la 'stratégie du choc' — les crises (coup d'État chilien 1973, Katrina 2005, Irak 2003, COVID 2020) sont utilisées pour imposer privatisations, dérégulation et austérité."
    source_url: "https://www.penguinrandomhouse.com/books/287562/the-shock-doctrine-by-naomi-klein/"
    source_section: "§12 F12"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-011"
    enonce: "Iceberg Factor total : Σ hidden / Σ visible = 25.6/12 = 2.13. La face cachée du système est 2× plus grande que sa face visible. Les mécanismes additionnels estimés : 3-5."
    source_url: "Analyse §5"
    source_section: "§5 Iceberg Analysis"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-012"
    enonce: "Angle mort du système = tout ce qui n'est pas numérisable, monétisable, spectacularisable : communauté non-marchande, action invisible, coordination hors-ligne, maquis. Le système ne voit que ce qu'il peut tracer."
    source_url: "Analyse §6"
    source_section: "§6 Angle mort"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-013"
    enonce: "5 doctrines de guérilla du corpus synthétisées : Rhizome (6 étapes de ré-enracinement), Résidu (4 tactiques de guérilla asymétrique), Désorganisation (guerre cognitive retournée), RIC Constituant (levier politique), Asphyxie du Golem (3 piliers : ischémie, engorgement, cécité)."
    source_url: "Articles Substack locaux"
    source_section: "§7.2"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-014"
    enonce: "Ce qui manque : coordination inter-cellules, discipline d'exécution, patience stratégique, capacité de frappe synchronisée, refus du spectacle. La doctrine existe, l'organisation manque."
    source_url: "Analyse §7.3"
    source_section: "§7.3"
    head_status: 0
    tier: 1
    glyphe: "❧"
  - id: "F-fresque-015"
    enonce: "Les 8 techniques de Biderman sont applicables au système social entier : isolement (algorithmes), monopole attention (pub+médias), épuisement (stress chronique), menaces (crise permanente), récompenses (likes, soldes), etc."
    source_url: "Analyse §9.1"
    source_section: "§9.1"
    head_status: 0
    tier: 1
    glyphe: "❧"

