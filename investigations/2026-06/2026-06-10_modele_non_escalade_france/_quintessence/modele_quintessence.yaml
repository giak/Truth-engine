perspectives_dialectiques:
- P1: 'Favorable : Le modele est operationnellement documente (Otpor!, ZAD, SdT) et les briques existent separement en France.
    Il suffirait de les assembler.

    '
- P2: 'Defavorable : Aucun test en democratie occidentale. Le Chiapas est un contexte non-transposable (cohesion communautaire
    preexistante, Etat mexicain plus tolerant que la France LOPMI 2023).

    '
- P3: 'Synthese dialectique : Le modele n''est pas a importer mais a reinventer. Les briques francaises (SdT, ZAD, AMAP, SCIC)
    sont le materiau. L''innovation n''est pas theorique mais architecturale : assembler l''existant en systeme.

    '
limites:
- Absence de test grandeur nature en France.
- Transposabilite Chiapas → ZUP non demontree.
- Temporalite 120 ans incompatible avec urgence climatique 2030 et echeances politiques.
- Modele fiable a 500 personnes, non teste a 500 000.
- Surveillance algorithmique (LOPMI, VSA) rend certaines methodes Sharp obsoletes.
- Pas de mecanisme de regeneration contre l'usure lente (desabandons, epuisement).
- Reproduction intergenerationnelle non resolue hors structures familiales/ecoles autonomes.
wolves:
- nom: L'absence de test en France est-elle une contingence ou une impossibilite struct...
  argument: 'L''absence de test en France est-elle une contingence ou une impossibilite structurelle ? Le modele zapatiste
    suppose une cohesion sociale preexistante que la France atomisee n''a pas.

    '
  reponse: ''
- nom: La non-violence est-elle vraiment superieure face a un Etat qui n'hesite pas a t...
  argument: 'La non-violence est-elle vraiment superieure face a un Etat qui n''hesite pas a tirer ? La theorie de Chenoweth
    (3.5% de la population) suppose un regime sensible a l''opinion — la France 2026 l''est-elle encore ?

    '
  reponse: ''
iceberg:
- item: 'La dissolution annulee des SdT (Conseil d''Etat, novembre 2023) est un precedent juridique majeur — la justice administrative
    a protege un mouvement ecology contre l''executif. Ce fait merite une investigation dediee.

    '
- item: 'La reforme zapatiste de 2023 (JBG → GAL) est un cas d''ecole d''auto-correction organisationnelle. Aucun mouvement
    francais n''a cette capacite de restructuration volontaire.

    '
- item: 'Otpor! a reussi parce que Milosevic etait un dictateur en fin de regime, pas une democratie a surveillance algorithmique.
    La transposabilite a la France est un saut non documente.

    '
