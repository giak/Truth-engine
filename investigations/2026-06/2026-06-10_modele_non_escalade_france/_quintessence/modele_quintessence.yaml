these_centrale: 'Le modele zapatiste adapte est le seul viable theoriquement pour la France 2026, mais sa transposition necessite
  4 conditions aujourd''hui absentes : caracoles urbains, culture de la non-violence integree, autosuffisance economique,
  temporalite longue (horizon 120 ans). Le modele est documente, operationnel, mais jamais teste en democratie occidentale.
  Suspicion score : 5.5/10.

  '
theses_implicites:
- TI1: 'La non-violence n''est pas une posture morale mais une technologie operationnelle (198 methodes Sharp, protocole marshals,
    contre-infiltration) qu''aucun mouvement francais ne maitrise integralement.

    '
- TI2: 'L''echec des Gilets jaunes n''est pas un echec du people power mais de l''absence de discipline non-violente — le
    mouvement a ete detruit par sa permeabilite aux casseurs et aux agents provocateurs.

    '
- TI3: 'Le zapatisme a mis 30 ans et s''est auto-corrige en 2023 (dissolution JBG → GAL). La France militante n''a ni cette
    patience ni cette capacite d''auto-correction structurelle.

    '
faits_atomiques:
