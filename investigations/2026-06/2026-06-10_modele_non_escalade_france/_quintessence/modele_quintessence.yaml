  enonce: 'Les Juntas de Buen Gobierno (JBG) zapatistes ont fonctionne de 2003 a 2023 avec rotation obligatoire de 10-14 jours
    par mandat, empechant le clientelisme.

    '
  source_url: https://schoolsforchiapas.org/blog-entry-zapatista-autonomy
  source_section: ''
