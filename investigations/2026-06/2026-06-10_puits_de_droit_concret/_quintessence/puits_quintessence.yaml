perspectives_dialectiques:
- P1: 'Favorable : Le droit francais offre un arsenal de protections constitutionnelles que les mouvements n''exploitent pas.
    L''empilement est legal, transparent, et chaque etage a une fonction claire. L''arret SLT 2023 montre que la justice administrative
    protege effectivement.

    '
- P2: 'Defavorable : L''empilement n''a jamais ete teste. Gerer 5 entites est operationnellement irrealiste pour 99% des militants.
    Le droit peut etre suspendu ou revoque. Tarnac a ete poursuivi SANS structure — preuve que la qualification politique
    contourne le droit.

    '
- P3: 'Synthese : Le puits de droit est une condition necessaire mais non suffisante. Il transforme la repression en bataille
    juridique (terrain plus favorable) mais ne l''elimine pas. Priorite operationnelle : commencer par 2 entites (asso + syndicat)
    avant de complexifier.

    '
limites:
- L'empilement n'a jamais ete teste en conditions reelles.
- La dissolution individuelle reste possible (SdT dissous, CRI dissoute).
- La responsabilite penale des dirigeants n'est pas abolie.
- Gerer 5 entites exige une competence juridique et comptable rare.
- Le precedent Tarnac: le droit ne protege pas contre la qualification politique.
- L'Etat de droit peut etre suspendu (etat d'urgence, article 16).
- La complexite administrative est une barriere d'entree qui exclut la plupart des militants.
wolves:
- nom: Le droit est-il vraiment une protection ou un piege ? Plus on structure juridiqu...
  argument: 'Le droit est-il vraiment une protection ou un piege ? Plus on structure juridiquement la coordination, plus on
    donne de prises a la repression (comptes bancaires saisissables, adresses de siege, dirigeants identifies). Le groupement
    de fait (N0) est-il en realite plus protecteur que tout le stack ?

    '
  reponse: ''
- nom: L'Etat de droit est un contrat politique
  argument: 'L''Etat de droit est un contrat politique. Si l''Etat decide de le rompre (suspension art.16, etat d''urgence
    permanent), le puits s''effondre en une heure. Est-ce que le risque de suspension est reel en France 2026 ? La loi LOPMI
    2023 et les pratiques recentes (VSA, dissolution SdT puis annulation) suggerent un Etat qui teste ses limites.

    '
  reponse: ''
iceberg:
- item: 'L''arret SLT 2023 (proportionnalite des dissolutions) est un precedent jurisprudentiel qui merite une investigation
    dediee. Il pourrait devenir la pierre angulaire d''une strategie juridique defensive.

    '
- item: 'La SCIC avec reserves impartageables (exoneration IS) est un vehicule fiscal quasi-inconnu des militants. Une investigation
    sur "SCIC militante" serait operationnellement precieuse.

    '
- item: 'Le syndicat comme bouclier juridique (pas de dissolution administrative, caisse de greve) est l''angle mort strategique
    du mouvement social francais. Pourquoi les mouvements ne creent-ils pas de syndicats ?

    '
