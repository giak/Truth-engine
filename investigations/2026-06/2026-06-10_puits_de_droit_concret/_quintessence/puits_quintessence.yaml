  tier: 1
- id: F-PUI-009
  enonce: 'Le financement public des partis politiques s''eleve a 64 M€ en 2025, reparti en deux fractions (suffrages legislatifs
    + parlementaires rattaches).

    '
  source_url: https://blog.landot-avocats.net/2025/09/08/financement-des-partis-et-groupements-politiques-voici-les-montants-2025-64-me-et-la-ventilation-correspondante/
