these_centrale: 'L''architecture du "puits de droit" (empilement de 5 entites juridiques distinctes : association 1901, SCIC,
  SARL/SAS, syndicat, parti politique) est la seule strategie defensive coherente face a l''art.450-1 CP. Chaque etage a une
  protection specifique (valeur constitutionnelle pour asso/syndicat/parti, responsabilite limitee pour SCIC/SARL) mais l''empilement
  n''a jamais ete teste. Suspicion score : 6.5/10. Le precedent Tarnac rappelle que le droit ne protege pas contre la qualification
  politique.

  '
theses_implicites:
- TI1: 'Le droit francais offre des protections constitutionnelles puissantes (liberte d''association CC 1971, liberte syndicale
    loi 1884, art.4 Const.) que les mouvements sous-exploitent systematiquement.

    '
- TI2: 'Le verrou n°1 du puits n''est pas juridique mais operationnel : gerer 5 entites avec dirigeants distincts, comptes
    separes, et conventions reglementees exige une competence que 99% des militants n''ont pas.

    '
- TI3: 'L''Etat de droit est la seule protection disponible en democratie — mais il peut etre suspendu (etat d''urgence, art.16).
    Le puits est un amortisseur, pas un blindage.

    '
faits_atomiques:
- id: F-PUI-001
  enonce: 'La liberte d''association est un principe fondamental reconnu par les lois de la Republique depuis la decision
    CC 71-44 DC du 16 juillet 1971.

    '
  source_url: https://www.conseil-constitutionnel.fr/decision/1971/7144DC.htm
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
  note: URL HEAD 200 OK.
- id: F-PUI-002
  enonce: 'L''article L.212-1 du Code de la securite interieure permet la dissolution administrative des associations qui
    provoquent a la violence.

    '
  source_url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025505191
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
- id: F-PUI-003
  enonce: 'Le Conseil d''Etat, decision du 9 novembre 2023 (n°476384), a annule la dissolution des Soulevements de la Terre
    au motif de proportionnalite : la dissolution "ne peut etre legalement prononcee que si elle presente un caractere adapte,
    necessaire et proportionne."

    '
  source_url: https://www.legifrance.gouv.fr/ceta/id/CETATEXT000048384891
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
- id: F-PUI-004
  enonce: 'La loi n°2021-1109 du 24 aout 2021 (separatisme) impose un contrat d''engagement republicain aux associations demandant
    des subventions publiques.

    '
  source_url: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000043964778
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
- id: F-PUI-005
  enonce: 'La SCIC (loi 47-1775 modifiee 2001) est une societe cooperative a capital variable associant obligatoirement 3
    categories d''associes (salaries, beneficiaires, autres parties prenantes). Les reserves impartageables (57,50% du resultat)
    sont deduites de l''assiette IS.

    '
  source_url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000684004
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
- id: F-PUI-006
  enonce: 'L''abus de bien social (SARL art. L.241-3, SAS art. L.244-1 C.com) est puni de 5 ans d''emprisonnement et 375 000
    € d''amende. La parade est le regime des conventions reglementees (autorisation prealable du conseil).

    '
  source_url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006449786
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
- id: F-PUI-007
  enonce: 'Les syndicats professionnels (loi 21 mars 1884, art. L.2111-1 C.trav) ne peuvent pas etre dissous par decret administratif.
    Seule une decision judiciaire peut le faire (art. L.2131-6 C.trav).

    '
  source_url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006072050/LEGISCTA000006132331
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
- id: F-PUI-008
  enonce: 'L''article 4 de la Constitution du 4 octobre 1958 garantit la libre formation et activite des partis politiques.

    '
  source_url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000019240999
  source_section: ''
  glyphe: ✦
