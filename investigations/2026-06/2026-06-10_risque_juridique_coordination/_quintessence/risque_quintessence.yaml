these_centrale: 'Le droit penal francais constitue un systeme anti-coordination autonome, coherent, et efficace. Il ne necessite
  ni police ni juge pour fonctionner : la simple menace de 10 ans d''association de malfaiteurs (art.450-1 CP) suffit a dissoudre
  un reseau emergent. Le droit est l''arme la plus efficace car elle est legitime, invisible, et auto-executoire. Les 8 protocoles
  de la HYPER_MATRICE sont quasi tous illegaux. Score de risque global : 7.4/9. Suspicion score : 7.5/10.

  '
theses_implicites:
- TI1: 'La detention provisoire (2 ans delit, 4 ans crime, art.137-1 CPP) est l''arme tactique decisive : le systeme n''a
    pas besoin de prouver la culpabilite, il lui suffit d''emprisonner les coordinateurs pour desorganiser le reseau. Tarnac
    : 9 mois de detention, 10 ans de procedure, relaxe finale mais reseau detruit.

    '
- TI2: 'L''acceleration legislative depuis 2017 (5 lois majeures 2019-2025 vs 2 lois 1955-2000) est elle-meme une forme de
    surcharge — les militants ne peuvent pas suivre l''evolution du cadre legal, ce qui cree une insecurite juridique permanente.

    '
- TI3: 'Le "vide juridique" est un mythe militant. Le droit francais est sature : ce qui n''est pas explicitement autorise
    est implicitement interdit, et les standards elastiques (art.421-1 terrorisme) absorbent toute action non categorisee.

    '
faits_atomiques:
- id: F-RIS-001
  enonce: 'Art.450-1 CP : 10 ans d''emprisonnement et 750 000€ d''amende pour tout groupement forme en vue de preparer un
    crime ou un delit puni de 5+ ans. La simple preparation collective suffit, pas besoin de passage a l''acte.

    '
  source_url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006417294
  source_section: ''
  glyphe: ✦
  head_status: 200
  tier: 1
- id: F-RIS-002
  enonce: 'Art.421-1 CP : 30 ans pour terrorisme, defini par "l''intention de troubler gravement l''ordre public par l''intimidation
    ou la terreur". Standard suffisamment elastique pour couvrir blocages, greves, sabotages.

    '
  source_url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006417075
  source_section: ''
  glyphe: ✦
  head_status: 200
