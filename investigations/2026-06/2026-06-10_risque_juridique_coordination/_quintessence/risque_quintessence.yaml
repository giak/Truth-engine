perspectives_dialectiques:
- P1: 'Favorable : Le droit n''est pas un instrument total. QPC 2024 (censure LOPMI), CEDH Ezelin 1991 (condamnation France),
    arret SdT annule en novembre 2023 (pas en aout). Le controle juridictionnel fonctionne encore ponctuellement.

    '
- P2: 'Defavorable : 5 lois anti-coordination en 6 ans. Standards elastiques. Detention provisoire sans preuve. IA predictive.
    Le systeme n''a pas besoin de condamner — il lui suffit d''accuser pour detruire.

    '
- P3: 'Synthese : Le droit est un champ de bataille asymetrique ou l''Etat a l''initiative. Les victoires defensives existent
    (QPC, CEDH) mais ne renversent pas le rapport de force. La strategie optimale n''est pas la confrontation juridique frontale
    mais la deslocalisation (Benelux, droit compare) et l''architecture defensive (puits de droit).

    '
limites:
- Sur-ponderation du risque penal: peine maximale ≠ peine reelle. La plupart des militants ecologistes prennent 6-18 mois
    avec sursis.
- Absence de test empirique des 5 strategies defensives.
- Pas d'entretien avec un avocat penaliste specialise.
- Non-actualisation 2026 (loi securite globale peut modifier le paysage).
- Defaitisme legal: minimise les victoires juridiques (QPC, CEDH, relaxes).
- Centrisme francais: ne considere pas assez le droit compare (Belgique, Pays-Bas, Allemagne).
wolves:
- nom: Si le droit est vraiment sature et les peines reellement dissuasives (10-30 ans)...
  argument: 'Si le droit est vraiment sature et les peines reellement dissuasives (10-30 ans), alors la coordination acéphale
    est impossible en France en 2026 — point final. Est-ce la verite ou une projection defaitiste ? Les 4000 condamnations
    Gilets jaunes sont un fait, mais le mouvement a quand meme dure 18 mois.

    '
  reponse: ''
- nom: Tarnac a ete detruit PAR la procedure, pas PAR la peine
  argument: 'Tarnac a ete detruit PAR la procedure, pas PAR la peine. Si la procedure est l''arme, alors la vitesse et l''invisibilite
    comptent plus que la legalite. Est-ce que la vraie protection n''est pas la desorganisation permanente (rendre la cible
    insaisissable) plutot que le blindage juridique ?

    '
  reponse: ''
iceberg:
- item: 'La timeline legislative 1955-2025 montre une courbe exponentielle depuis 2017. Ce rythme est lui-meme une arme :
    impossible pour les militants de suivre l''evolution legale. L''insecurite juridique est produite activement.

    '
- item: 'Le droit allemand (StGB §129) est plus restrictif que l''art.450-1 CP francais — il exige une structure hierarchique.
    La France est le pays europeen le plus repressif sur l''association de malfaiteurs.

    '
- item: 'La CEDH est un champ de bataille, pas un refuge. Kudrevicius 2015 (validation blocages) est un precedent defavorable
    majeur que les mouvements ignorent systematiquement.

    '
- item: 'L''affaire Tarnac (2008-2018) est le precedent le plus instructif : 10 ans de procedure, detention provisoire, relaxe
    finale, reseau detruit. La lecon n''est pas "le droit protege" mais "la procedure detruit".

    '
- item: 'Mnemolite: UP, search DOWN. Aucune cross-reference.

    '
