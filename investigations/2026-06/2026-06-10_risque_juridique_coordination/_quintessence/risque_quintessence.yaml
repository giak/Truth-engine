    provisoire, relaxe finale en appel. Reseau detruit malgre l''innocence finale.

    '
  source_url: https://www.francetvinfo.fr/societe/justice/affaire-tarnac-la-cour-d-appel-de-paris-relaxe-tous-les-prevenus_2788389.html
