- id: F-RIS-003
  enonce: 'CE, 11 aout 2023 : dissolution des Soulevements de la Terre confirmee. Le CE valide que "l''incitation a des degradations
    materielles" suffit pour justifier une dissolution administrative.

    '
  source_url: https://www.conseil-etat.fr/actualites/dissolution-des-soulevements-de-la-terre-le-conseil-d-etat-confirme
  source_section: ''
  glyphe: ✦
