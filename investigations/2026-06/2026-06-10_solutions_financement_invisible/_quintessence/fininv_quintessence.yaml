    dediee.

    '
- item: 'Spark Alliance (HK 2019) : le crowdfunding bancarise est vulnerable a la fermeture de compte et au gel des fonds.
    Le precedent est direct pour toute cagnotte Leetchi/HelloAsso militante.

    '
- item: 'Navalny : Bitcoin a fonctionne parce que la Russie n''a pas TRACFIN. La France a TRACFIN + ERMES + LOPMI. Les precedents
