these_centrale: 'Aucun mecanisme isole ne permet de deplacer 8 150€/mois sans detection en France 2026. Seule une combinaison
  4 piliers (prets particuliers 30%, caisse associative 30%, cash evenementiel 25%, crypto Monero P2P 15%) atteint le volume
  necessaire, mais toutes les methodes sont illegales au regard de l''art.324-1 CP (blanchiment) et l''art.324-1-1 CP (presomption
  blanchiment crypto anonyme). Suspicion score : 4.5/10 — aucune methode testee en contexte repressif francais.

  '
theses_implicites:
- TI1: 'Le vrai probleme n''est pas le volume (8 000€/mois) mais l''echelle : a 80 000€/mois (scenario expansion), aucune
    methode ne fonctionne. Le financement invisible est un amortisseur, pas une solution de long terme.

    '
- TI2: 'L''article 324-1-1 CP (juin 2025) est une rupture juridique majeure : il etablit une presomption legale de blanchiment
    pour toute utilisation de crypto-actif anonyme. Posseder du Monero est desormais presume illicite.

    '
- TI3: 'TRACFIN + ERMES (2025) + LOPMI (2023) forment un systeme de detection quasi-total : 215 410 declarations en 2024 (+13.2%),
    algorithmes anti-structuring, KYC obligatoire sur tous les PSAN. Le "trou" dans le filet n''existe plus.

    '
faits_atomiques:
- id: F-FINV-001
  enonce: 'TRACFIN a recu 215 410 declarations de soupcon en 2024, +13.2% par rapport a 2023. Le secteur bancaire represente
    57.2% des declarations.

    '
