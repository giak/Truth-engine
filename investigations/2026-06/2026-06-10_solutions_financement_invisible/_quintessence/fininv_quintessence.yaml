- id: F-FINV-002
  enonce: 'Plafond especes France : 1 000€ entre particulier et professionnel (art. L112-6 Code monetaire et financier). Aucun
    plafond entre particuliers.

    '
  source_url: https://www.banque-france.fr/fr/aide-faq/Moyens%20de%20paiement
