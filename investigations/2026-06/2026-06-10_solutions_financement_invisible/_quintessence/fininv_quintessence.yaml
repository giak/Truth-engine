perspectives_dialectiques:
- P1: 'Favorable : Des methodes existent et sont operationnellement documentees (prets particuliers legaux < 5k, caisses de
    greve syndicales existantes, Monero techniquement robuste). La combinaison 4 piliers est faisable a petite echelle.

    '
- P2: 'Defavorable : Toutes les methodes sont illegales. L''art.324-1-1 CP (juin 2025) cree une presomption de culpabilite
    pour Monero. Le fiat off-ramp est le point de rupture universel. A 80 000€/mois (echelle), rien ne fonctionne.

    '
- P3: 'Synthese : Le financement invisible est un probleme d''echelle, pas de methode. A 8 000€/mois, la combinaison est risquee
    mais envisageable. Au-dela, il faut des structures economiques autosuffisantes (cooperatives, AMAP, SCIC) generant leurs
    propres revenus plutot que de compter sur des flux externes opaques.

    '
limites:
- Aucune methode testee en contexte repressif francais.
- Toutes les methodes violent l'art.324-1 CP (blanchiment).
- Volumetrie: 8 000€/mois possible, 80 000€ impossible.
- Art.324-1-1 CP cree une presomption de culpabilite pour Monero.
- Fiat off-ramp crypto → euros systematiquement detectable.
- Algorithmes anti-structuring (LOPMI) neutralisent le cash pooling bancaire.
- Dependance a des donateurs techniques (crypto) ou physiquement presents (cash).
