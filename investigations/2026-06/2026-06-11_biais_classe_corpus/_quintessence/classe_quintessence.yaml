these_centrale: 'Le corpus Truth Engine est concu PAR des CSP+ POUR des CSP+. Les classes populaires (42.8% de la population
  active, 12.4M, INSEE 2024) sont structurellement absentes comme acteurs ET comme destinataires. 4 filtres excluent 65% de
  la population : capital culturel (illectronisme 9% ouvriers vs 1.2% cadres), temps disponible (1-2h/jour vs 3-5h exigees),
  revenu (1400€/mois vs cotisation 1200€/personne), mode d''action (cellule secrete vs greve massive). Aucun protocole ne
  depasse 2/10 d''accessibilite pour les profils C/D/E. Suspicion score revise : 3.8/10.

  '
theses_implicites:
- TI1: 'Le corpus ne peut pas integrer les classes populaires sans se detruire. Ajouter un contre-modele populaire (visible,
    massif, simple, territorial) est la seule voie — mais ce contre-modele lui echappe structurellement.

    '
- TI2: 'La precarite volontaire du militant CSP+ (ZAD) est confondue avec la precarite subie du smicard. Cette confusion est
    le biais le plus pernicieux du corpus.

    '
- TI3: 'L''auto-audit revele que le chiffre-phare (53.6%) datait de 2009-2015 et n''avait pas ete recoupe avec INSEE 2024
    (42.8%). Echec du fact-checking KERNEL. Le genre (76.5% des employes sont des femmes) etait absent de l''analyse initiale.

    '
