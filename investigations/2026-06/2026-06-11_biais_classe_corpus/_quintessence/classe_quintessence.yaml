perspectives_dialectiques:
- P1: 'Le biais de classe invalide le corpus : 65% de la population exclue. Chaque protocole doit etre recentre sur les classes
    populaires.

    '
- P2: 'Le biais est inevitable : tout corpus a un lieu d''enonciation. L''important n''est pas l''absence de biais mais sa
    declaration transparente.

    '
- P3: 'Synthese : ajouter un contre-modele populaire (MAP) distinct des protocoles HYPER_MATRICE, base sur visibilite, masse,
    simplicite, ancrage territorial.

    '
limites:
- Le corpus ne peut pas integrer les classes populaires sans se detruire.
- Donnees centrales initiales (53.6%) obsoletes — corrigees a 42.8% post-audit.
- Dimension genre initialement absente — corrigee §13.
- Guilluy cite sans contradicteurs — corrige §16.
- Contre-exemples (Banlieues Climat, SdT) omis — corriges §18.
- L'enquete reproduit le biais qu'elle denonce (ecrite en francais soutenu).
wolves:
- nom: Si le corpus est vraiment inaccessible a 65% de la population, alors il n'est pa...
  argument: 'Si le corpus est vraiment inaccessible a 65% de la population, alors il n''est pas un outil de liberation mais
    un outil de reproduction de la domination culturelle. Les CSP+ s''organisent entre eux et appellent ca "le peuple".

    '
  reponse: ''
- nom: Le contre-modele populaire propose (MAP) est lui-meme ecrit par un CSP+
  argument: 'Le contre-modele populaire propose (MAP) est lui-meme ecrit par un CSP+. Qui peut parler POUR les classes populaires
    sans les consulter ?

    '
  reponse: ''
iceberg:
- item: 'Niveau 10 : le corpus ne peut pas integrer les classes populaires sans se detruire. Ajouter "en plus" ne changera
    rien. Remplacer detruirait l''architecture. Le corpus est un outil CSP+ — il doit l''admettre.

    '
- item: 'Intersection classe-genre : 76.5% des employes sont des femmes. La classe populaire est massivement feminine. Le
    temps partiel subi (31%) est une contrainte de genre, pas de classe seule.

    '
- item: 'Mnemolite: DOWN.

