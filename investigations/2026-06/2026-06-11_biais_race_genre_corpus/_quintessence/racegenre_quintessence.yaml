these_centrale: 'Le corpus ignore totalement la race et le genre comme categories politiques. Zero mention de "race", "racisme",
  "genre", "discrimination". Les protocoles supposent un acteur blanc, masculin, CSP+. Or : jeune homme percu noir/arabe =
  12x plus de controles pousses (Defenseur des Droits 2024), detention provisoire 5x plus elevee pour nes a l''etranger (Fassin/etude
  Nantes), discrimination a l''embauche 2.8x (DESPERADO V). 7 profils (α-ζ + η LGBTQ+) identifies, seul α (homme blanc CSP+)
  est compatible avec les protocoles. Suspicion score : 6.2/10.

  '
theses_implicites:
- TI1: 'Le faux universalisme republicain ("nous ne voyons pas les races") est un outil politique actif : il interdit de mesurer
    les discriminations, donc de les prouver, donc de les combattre. Le corpus reproduit ce geste.

    '
- TI2: 'Le protocole "puits de droit" suppose que le systeme judiciaire traite tout le monde egalement. C''est factuellement
    faux. Un racise a un risque juridique 5x plus eleve — non calcule dans les protocoles.

    '
- TI3: 'Les femmes (51% de la population) sont invisibilisees comme actrices politiques. Le care (enfants, personnes agees)
    est un prerequis invisible de toute action militante — jamais analyse dans le corpus.

    '
