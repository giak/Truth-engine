perspectives_dialectiques:
- P1: 'Race/genre invalident le corpus : un protocole qui ignore que le rapport a la police est 12x different n''est pas valide.
    Chaque protocole doit etre intersectionnalise.

    '
- P2: 'Le probleme est francais, pas universel : l''interdiction des stats ethniques est une specificite. Dans d''autres pays,
    ces donnees existent et sont integrees a l''analyse.

    '
- P3: 'Synthese : repenser chaque protocole a partir de l''experience du profil le plus domine (femme trans racisee de classe
    populaire). Si un protocole fonctionne pour η, il fonctionnera pour tous.

    '
limites:
- Interdiction francaise des statistiques ethniques limite les donnees.
- Etude Jobard date de 2007-2008 — le profilage a-t-il change ?
- Biais parisianiste: la plupart des etudes portent sur Paris/banlieue.
- Dimension LGBTQ+ ajoutee post-audit mais encore en construction.
- P3 ignore les mouvements antiracistes reels comme le corpus ignore la race.
- Comparaison europeenne ebauchee, a approfondir.
wolves:
- nom: Si le protocole PUITS DE DROIT suppose l'egalite devant la justice, mais qu'un r...
  argument: 'Si le protocole PUITS DE DROIT suppose l''egalite devant la justice, mais qu''un racise a 5x plus de risque de
    detention provisoire, alors le puits de droit est un leurre pour quiconque n''est pas blanc. Le corpus offre une protection
    qui n''existe pas pour les plus vulnerables.

    '
  reponse: ''
- nom: La correction par l'intersectionnalite est-elle possible sans tomber dans l'hype...
  argument: 'La correction par l''intersectionnalite est-elle possible sans tomber dans l''hyper-specification ? Si chaque
    profil exige son protocole, il n''y a plus de coordination possible — chaque groupe agit dans son couloir.

    '
  reponse: ''
iceberg:
- item: 'Niveau 9 : l''interdiction des stats ethniques n''est pas une "specificite" — c''est un outil politique de reproduction.
    Le faux universalisme est une strategie de maintien de l''ordre racial.

    '
- item: 'Profil η (femme trans racisee de classe populaire) : le plus invisible de tous. Cumule toutes les discriminations.
    Presence dans le corpus : zero.

    '
- item: 'Violences genrees policieres (fouilles a nu, violences sexuelles en manifestation) : angle mort de P3 comme du corpus.

    '
