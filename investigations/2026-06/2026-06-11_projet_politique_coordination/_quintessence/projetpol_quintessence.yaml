these_centrale: 'La coordination acéphalique sans projet politique est un suicide stratégique. Le corpus identifie LEVIER
  comme le gap le plus critique : qu''est-ce qu''on propose concrètement APRES ? 5 solutions documentées (RIC, constituante,
  revenu universel, souveraineté numérique, communs). Aucune n''est testée.

  '
theses_implicites:
- label: T1
  texte: 'Le RIC (Référendum d''Initiative Citoyenne) est le CHEVAL DE TROIE institutionnel — une fois le RIC en place, toutes
    les autres réformes deviennent possibles sans passer par le Parlement.

    '
- label: T2
  texte: 'Sans projet politique positif, la coordination acéphalique est exclusivement définie CONTRE le système, jamais POUR
    quelque chose. Le négatif mobilise, le positif fidélise.

    '
- label: T3
  texte: 'Le RIC sert aussi de ''test de réalité'' : si une majorité de Français ne le soutient pas, la coordination acéphalique
    n''a pas de base populaire. Le RIC est un thermomètre.

    '
