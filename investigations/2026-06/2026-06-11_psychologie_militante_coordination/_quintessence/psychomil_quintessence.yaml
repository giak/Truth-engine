complexity: COMPLEX
these_centrale: 'La coordination acéphalique est un problème psychologique autant que stratégique. 7 pièges psychologiques
  menacent le militant (burnout, paranoïa, pureté idéologique, solitude, schisme interne, désespoir appris, addiction à la
  dopamine numérique). Le corpus identifie 5 mécanismes de résilience (cure de dopamine, rotation des rôles, protocole silence,
  discipline narrative, célébration des petites victoires). Aucun n''a été testé.

  '
theses_implicites:
- label: T1
  texte: 'L''effondrement psychologique du militant est un VECTEUR DE DÉFAITE plus probable que la répression policière. Le
    système n''a pas besoin de tuer — il lui suffit d''épuiser.

    '
- label: T2
  texte: 'La coordination acéphalique est psychologiquement PLUS EXIGEANTE que l''action hiérarchique. Sans chef pour rassurer,
    sans structure pour protéger, le militant est nu.

    '
- label: T3
  texte: 'Le ''désespoir appris'' (learned helplessness) est l''arme psychologique principale du système. Casser ce désespoir
    est la première victoire.

    '
