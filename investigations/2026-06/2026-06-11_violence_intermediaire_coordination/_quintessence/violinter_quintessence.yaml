date_extraction: '2026-06-12'
complexity: COMPLEX
these_centrale: 'La frontière entre ''violence'' et ''non-violence'' n''est pas binaire mais spectrale. Entre le tract et
  la bombe, il existe un continuum de ''violence intermédiaire'' (cyberattaques, sabotage économique, occupation de locaux,
  doxing, blocages, désobéissance civile de masse) que le corpus n''a jamais cartographié. La question n''est pas ''faut-il
  être violent ?'' mais ''où placer le curseur sur le spectre tactique ?''

  '
theses_implicites:
- label: T1
  texte: 'Le modèle zapatiste actuel est positionné à l''extrémité ''zéro violence'' du spectre. Mais ce positionnement n''a
    jamais été JUSTIFIÉ stratégiquement — c''est un postulat, pas une conclusion.

    '
- label: T2
  texte: 'La violence intermédiaire est le TABOU du corpus. Personne n''ose en parler parce que l''admettre rend la coordination
    vulnérable juridiquement (art.450-1 CP).

    '
- label: T3
  texte: 'Exclure la violence intermédiaire PAR PRINCIPE est aussi dogmatique que l''adopter PAR PRINCIPE. La question doit
    être tranchée stratégiquement, pas moralement.

    '
