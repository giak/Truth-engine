perspectives_dialectiques:
- etiquette: 'Le curseur tactique : où le placer ?'
  position_A: N0 strict (zéro violence, zéro illégalité) — légitimité morale absolue
  position_B: N3 maximum (violence économique, pas physique) — rapport de force matériel
  synthese: 'Le curseur optimal est probablement N1-N2 : illégalité non-violente assumée (désobéissance civile). C''est ce
    que faisaient Gandhi, MLK, Solidarnosc. La question est : N3 (économique) est-il un saut qualitatif ou juste un degré
    supplémentaire ?

    '
- etiquette: Discuter de la violence est-il dangereux en soi ?
  position_A: Oui — le simple fait d'en discuter rend la coordination vulnérable juridiquement
  position_B: Non — le refus d'en discuter est une faiblesse stratégique que l'adversaire exploitera
  synthese: 'La discussion théorique n''est pas criminalisable. L''absence de discussion est une fracture dans le blindage
    stratégique. Il faut cartographier sans préconiser.

    '
