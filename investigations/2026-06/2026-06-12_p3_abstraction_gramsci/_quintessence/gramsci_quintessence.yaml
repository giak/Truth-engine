enquete_id: "gramsci"
complexity: "MEDIUM"
date_extraction: "2026-06-12"
enquete_source: "investigations/2026-06-12_p3_abstraction_gramsci/2026-06-12_12-00_abstraction_gramsci_etape_ou_impasse_INVESTIGATION.md"

these_centrale: "L'abstraction CSP+ du corpus est une ETAPE necessaire (elaboration d'outils conceptuels) mais reste une IMPASSE tant qu'elle n'est pas reapproprie et re-traduite par ceux a qui elle doit servir. La question n'est pas 'faut-il simplifier le corpus ?' mais 'qui fera le travail de traduction ?'"

theses_implicites:
  - "Le modele gramscien de l'intellectuel organique presuppose des conditions sociales (syndicats de masse, lieux de sociabilite populaire, temps libre) qui n'existent plus en France 2026."
  - "La comparaison avec le zapatisme (EZLN) est anachronique et elitiste : l'EZLN n'est pas parti d'un fichier .md sur GitHub mais de decennies d'organisation communautaire indigene armee."
  - "Sans traducteurs, le corpus sera capte par des factions academiques pour asseoir leur distinction sociale, pas pour organiser le bloc populaire."

faits_atomiques:
  - id: "F-gram-001"
    enonce: "Pour Gramsci, chaque classe sociale ascendante genere ses propres 'intellectuels organiques' dont la fonction est de traduire la theorie en pratique par un dialogue dialectique avec le sens commun populaire."
    source_url: null
    source_section: "par1"
    head_status: null
    tier: 2
    glyphe: "✦"
  - id: "F-gram-002"
    enonce: "Le marxisme n'est pas devenu populaire par une lecture directe du Capital mais via des institutions de traduction : presse militante, ecoles du Parti, universites populaires, brochures educatives. Ces institutions n'existent plus en 2026."
    source_url: null
    source_section: "par1"
    head_status: null
    tier: 3
    glyphe: "✧"
  - id: "F-gram-003"
    enonce: "La pedagogie des opprimes (Paulo Freire, 1968) propose une co-construction du savoir entre academique et populaire, inversant la logique de transmission verticale."
    source_url: null
    source_section: "par2"
    head_status: null
    tier: 2
    glyphe: "✦"
  - id: "F-gram-004"
    enonce: "Le zapatisme (EZLN) est une production theorique originale co-produite par les communautes indigenes et les cadres du mouvement. La theorie n'a pas precede la pratique : c'est l'inverse du modele corpus."
    source_url: null
    source_section: "par2"
    head_status: null
    tier: 3
    glyphe: "✧"
  - id: "F-gram-005"
    enonce: "L'abstraction CSP+ du corpus est une ETAPE si elle est suivie d'une traduction par des intellectuels organiques issus des classes populaires."
    source_url: null
    source_section: "par3"
    head_status: null
    tier: 4
    glyphe: "❧"
  - id: "F-gram-006"
    enonce: "L'abstraction CSP+ est une IMPASSE si elle reste un marqueur de distinction sociale inaccessible a ceux qu'elle pretend servir. La question de decisive est : le corpus est-il traduisible ?"
    source_url: null
    source_section: "par3"
    head_status: null
    tier: 4
    glyphe: "❧"

acteurs:
