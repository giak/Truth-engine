causalites:
  - cause: "F-gram-001"
    effet: "F-gram-005"
    mecanisme: "Le modele gramscien postule que l'abstraction theorique est suivie d'une traduction par des intellectuels organiques. L'enquete applique ce modele au corpus."
  - cause: "F-gram-002"
    effet: "F-gram-006"
    mecanisme: "La disparition des institutions de traduction (partis, syndicats, universites populaires) rend l'abstraction inaccessible. Sans traducteurs, le corpus est une impasse."

perspectives_dialectiques:
  - position: "These"
    argument: "L'abstraction CSP+ est une etape necessaire dans un processus gramscien : les intellectuels produisent les outils conceptuels, les traducteurs les popularisent. Le corpus a 6 mois, c'est trop tot pour juger."
  - position: "Antithese"
    argument: "L'abstraction CSP+ est une impasse structurelle : les traducteurs n'existent plus (syndicats <10%, illectronisme 15%, TikTok), et le corpus sera capte par les factions academiques comme marqueur de distinction sociale."
  - position: "Synthese"
    argument: "Le critere d'evaluation est empirique : le corpus sera une etape s'il genere des traducteurs, une impasse s'il reste confine au lectorat CSP+. Verdict dans 2-5 ans."

limites:
  - "Gramsci cite de memoire : l'analyse est conceptuelle, pas philologique."
  - "Corpus a 6 mois d'existence : trop tot pour evaluer la generation de traducteurs."
  - "Comparaison avec le marxisme anachronique (50 ans de diffusion)."

wolves:
  - nom: "Barriere cognitive algorithmique"
    argument: "Dans une societe a 15% d'illectronisme aspiree par TikTok, la figure du traducteur organique gramscien est une utopie des annees 70. Le corpus restera confine au lectorat CSP+."
    reponse: "Devastateur. La defense temporelle (6 mois) est faible : si les conditions structurelles de la traduction n'existent plus, le temps ne les fera pas reapparaitre."
  - nom: "Captation bourgeoise"
    argument: "Un corpus exigeant un Bac+5 sera capte par les partis politiques de gauche et les factions academiques pour asseoir leur distinction sociale, pas pour organiser le bloc populaire."
    reponse: "Devastateur. L'enquete n'y repond pas de maniere satisfaisante. La seule defense : 6 mois est trop tot. Mais la tendance est vers l'IMPASSE."

iceberg:
  - "Qui sont les lecteurs reels du corpus ? Donnees de lectorat Substack : profil socio-economique des abonnes — si >80% CSP+, la these de l'IMPASSE est confirmee."
  - "Mnemolite: UP (36942 memoires) mais API search en erreur 500."
  - "Sujet immerge : le corpus a-t-il deja genere des 'traducteurs' (republications, adaptations, citations dans des medias populaires) ?"

