  - "3 infractions qui ne requièrent pas de passage à l'acte : 450-1, 222-14-2, 421-2-6"
  - "Procédure comme arme : GAV, CJ, DP détruisent indépendamment du jugement"
  - "Le corpus sous-estime la finesse de la frontière intention/acte"

