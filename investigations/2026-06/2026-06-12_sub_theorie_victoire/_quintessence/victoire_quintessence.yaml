    glyphe: "✧"
  - id: "F-vic-003"
    enonce: "Le risque de la victoire defensive : la demobilisation — les competences se dispersent, les reseaux s'atrophient. Sans objectif suivant, la victoire defensive est terminale."
    source_url: null
    source_section: "par1"
    head_status: null
    tier: 4
    glyphe: "❧"
  - id: "F-vic-004"
    enonce: "L'IRA a redefini la victoire de la reunification totale au partage du pouvoir (Good Friday Agreement, 1998). Cette redefinition a exige une structure de negociation : le Sinn Fein comme parti structure."
    source_url: null
    source_section: "par2"
    head_status: null
    tier: 3
    glyphe: "✧"
  - id: "F-vic-005"
    enonce: "Pour negocier, il faut un interlocuteur capable de garantir l'application de l'accord — une coordination acephale ne peut offrir aucune de ces trois fonctions."
    source_url: null
