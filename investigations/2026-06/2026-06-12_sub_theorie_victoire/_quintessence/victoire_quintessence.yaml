causalites:
  - cause: "F-vic-005"
    effet: "F-vic-006"
    mecanisme: "L'impossibilite de negocier force la coordination acephale a redefinir la victoire comme erosion plutot que capture. Mais cette victoire est fragile : l'adversaire peut revenir des que la pression diminue."
  - cause: "F-vic-002"
    effet: "F-vic-003"
    mecanisme: "La victoire defensive demobilise parce que le mouvement perd sa raison d'etre immediate. Sans objectif suivant, il se fragmente et meurt."

perspectives_dialectiques:
  - position: "These"
    argument: "La coordination acephale est condamnee a la survie et a la perturbation — elle ne peut pas gagner au sens classique. C'est une limite structurelle, pas un defaut ponctuel."
  - position: "Antithese"
    argument: "La survie EST la victoire dans un systeme concu pour eliminer toute opposition. Le simple fait de continuer a exister est une defaite infligee au systeme."
  - position: "Synthese"
    argument: "La survie est une victoire minimaliste insuffisante pour mobiliser au-dela des convaincus. La coordination acephale doit soit s'articuler a une organisation politique structuree, soit redefinir la victoire comme erosion de long terme."

limites:
  - "Le corpus ne definit pas la victoire parce que ce n'est peut-etre pas son role (boite a outils, pas programme politique)."
  - "La survie comme victoire est une position defendable mais elle est politiquement faible (ne mobilise pas)."
  - "L'erosion comme modele de victoire n'a pas ete testee empiriquement sur une decennie."

wolves:
  - nom: "Survie = victoire"
    argument: "Dans un Etat qui criminalise la contestation, survivre est deja une victoire. Exiger une 'victoire' classique est un biais de la pensee hierarchique."
    reponse: "Partiellement recevable. Mais c'est une victoire minimaliste : personne ne risque 10 ans de prison pour 'survivre'. La survie ne mobilise pas."
  - nom: "Ce n'est pas le role du corpus"
    argument: "Le corpus est une boite a outils, pas un programme politique. Reprocher au corpus de ne pas definir la victoire, c'est reprocher a un marteau de ne pas dire quel mur frapper."
    reponse: "Recevable. Mais le corpus pretend documenter 'COMMENT gagner' (TC1, TC3). S'il utilise 'gagner' sans le definir, il pose une question sans objet."

iceberg:
  - "Quel est l'objectif politique REEL du corpus ? Si l'objectif est la perturbation, le corpus est surdimensionne. Si l'objectif est la conquete, le corpus ignore sa propre limite structurelle."
  - "Mnemolite: UP (36942 memoires) mais API search en erreur 500."
  - "Sujet immerge : la coordination acephale comme 'bras arme' d'un mouvement plus large structure — est-ce son seul role strategique viable ?"

