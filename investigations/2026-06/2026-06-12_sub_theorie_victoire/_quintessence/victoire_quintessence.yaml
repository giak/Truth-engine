enquete_id: "victoire"
complexity: "MEDIUM"
date_extraction: "2026-06-12"
enquete_source: "investigations/2026-06-12_sub_theorie_victoire/2026-06-12_12-00_theorie_victoire_gagner_coordination_acephale_INVESTIGATION.md"

these_centrale: "La coordination acephale ne peut pas 'gagner' au sens classique (prise de pouvoir) parce qu'elle n'a pas de mecanisme pour negocier, signer, ou garantir des accords. Sa victoire est l'erosion du pouvoir adverse, pas sa capture. Le corpus, en documentant la survie sans definir la victoire, refuse de reconnaitre cette limite structurelle."

theses_implicites:
  - "Les victoires totales historiques (ANC, FLN, Solidarnosc) ont toutes exige une organisation structuree capable de negocier et de gouverner — ce que l'acephalie, par definition, ne peut pas fournir."
  - "Les objectifs documentes par le corpus (RIC, demantelement LOPMI, renversement 49.3) exigent une reforme constitutionnelle donc une organisation politique structuree — ce qui ferait cesser la coordination d'etre acephale."
  - "Si la coordination acephale ne peut offrir que la survie et la perturbation, elle ne peut pas mobiliser au-dela des convaincus : personne ne risque 10 ans de prison pour 'survivre'."

