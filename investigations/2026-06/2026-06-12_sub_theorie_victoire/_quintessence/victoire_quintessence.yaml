    glyphe: "❧"
  - id: "F-vic-006"
    enonce: "La victoire d'une coordination acephale est l'erosion du pouvoir adverse, pas sa capture : rendre le projet trop couteux plutot que de le remplacer."
    source_url: null
    source_section: "par3"
    head_status: null
    tier: 4
