theses_cardinales:

  # --- THÈSE 1 : LE SYSTÈME ANTI-COORDINATION (robustesse 8/10) ---
  - id: TC1
    rang: 1
    robustesse: 8
    enonce: >
      Le système de pouvoir en France ne maintient pas son contrôle par la répression
      mais par l'empêchement actif de la coordination entre les individus. Ce contrôle
      opère sur 6 axes autonomes et redondants : juridique (art.450-1 CP, 10 ans),
      financier (TRACFIN, fenêtre 2000-10 000€/mois), algorithmique (LOPMI 2023,
      IA prédictive), cognitif (surcharge, illectronisme 15.4%), social (atomisation,
      fracture territoriale), et législatif (5 lois majeures 2019-2025, courbe
      exponentielle). Aucun de ces axes n'est nécessaire — le système survit à la
      neutralisation de n'importe lequel — mais leur combinaison rend la coordination
      structurellement impossible sans architecture défensive dédiée.
    dossiers:
      - verrou (12 mécanismes interconnectés, HYPER_MATRICE V1, 5 loups)
      - risque (art.450-1, 421-1, 413-10 CP ; LOPMI ; détention provisoire)
      - fresque (12 mécanismes de verrouillage systémique)
      - finance (TRACFIN, fenêtre 2000-10 000€/mois, paradoxe dépendance)
      - police (mutation maintien de l'ordre 2016→2025, +62% budget)
      - classe (illectronisme 15.4%, capital culturel)
      - etatfragile (8 indicateurs FFP, fragilité masquée)
    faits_cles:
      - F-VER-001 (système empêche coordination)
      - F-RIS-001 (art.450-1 CP, 10 ans, 750 000€)
      - F-RIS-007 (LOPMI IA prédictive)
      - F-RIS-012 (5 lois 2019-2025 vs 2 lois 1955-2000)
      - F-FIN-004 (TRACFIN signaux faibles <10 000€)
      - F-FIN-005 (fenêtre 2000-10 000€/mois)
      - F-CLA-002 (illectronisme 15.4%, 9% ouvriers)
      - F-VER-013 (5 loups : algorithmique, climat, IA, légal, démographique)
    acteurs_cles:
      - Système/Oligarchie (12 mécanismes)
      - TRACFIN (détection financière)
      - Législateur (accélération 2019-2025)
      - LOPMI (surveillance algorithmique)
    shadow: 1.5
    shadow_justification: >
      Thèse la mieux documentée du corpus. 30+ faits ✦ sur legifrance/INSEE/CEDH.
      Les mécanismes juridiques et financiers sont vérifiables (articles de loi,
      budgets publics). Mais deux zones d'ombre : (1) l'efficacité réelle de la
      surveillance algorithmique LOPMI est classifiée (secret-défense), (2) le
      fonctionnement interne de TRACFIN (signaux faibles, algorithmes) n'est pas
      public. Ces angles morts justifient un shadow de 1.5 plutôt que 1.0.

  # --- THÈSE 2 : LE PARADOXE DU DIAGNOSTIC SANS PRESCRIPTION (robustesse 6/10) ---
  - id: TC2
    rang: 2
    robustesse: 6
    enonce: >
      Le corpus Truth Engine a produit une théorie d'action acéphalique opérationnelle
      en 4 couches (rhizome, résidu, attrition, désorganisation → RIC) dans ses articles
      Substack, mais son architecture KERNEL (RESISTANCE.md) ne l'intègre pas. Ce
      désalignement produit un système qui diagnostique le verrouillage avec une précision
      forensique tout en rendant structurellement invisibles ses propres clés de
      déverrouillage. Le gap est double : (1) interne — le KERNEL figé en novembre 2025
      n'a pas été mis à jour après la production des articles d'action (janvier-mai 2026),
      et (2) externe — le corpus ignore la tradition anglo-américaine de l'action
      collective (Ostrom, Sharp, Tilly, Scott, Graeber), se privant de 198 méthodes
      tactiques documentées et de 5 cas historiques validés. Ce double gap est un Κ
      auto-appliqué : la lucidité paralysante du diagnostic empêche la remontée des
      solutions dans la structure théorique.
    dossiers:
      - ace (V1→V2 : absence corrigée en non-intégration, 20 faits)
      - leadership (5 modèles de leadership acéphalique, 0 testés)
      - modele (modèle zapatiste documenté, 0 test en démocratie occidentale)
      - projetpol (95% diagnostic, 5% proposition)
      - empirique (0 test empirique, design de validation proposé)
      - audit (score corpus 7.5/10, 3 gaps bloquants : LEVIER, CLASSE, RACE/GENRE)
    faits_cles:
      - F-ace-001 (0 mention théoriciens action collective)
      - F-ace-002 (RESISTANCE.md 3/8 concepts chargés, tous négatifs)
      - F-ace-003 (théorie 4 couches existe dans les articles)
      - F-ace-005 (0 article d'action dans RESISTANCE.md)
      - F-ace-007 (jamais cite Sharp, Ostrom, Tilly, Scott, Graeber)
      - F-ace-012 (biais épistémique Ξ > ρ)
      - F-EMP-001 (0 protocole testé empiriquement)
      - F-PPR-009 (corpus 95% diagnostic, 5% proposition)
    acteurs_cles:
      - Architecture KERNEL (figée, biais Ξ)
      - Giak (gap entre ses propres couches de production)
      - Ostrom/Sharp/Tilly/Scott/Graeber (absents)
      - EZLN/Zapatistes (modèle jamais intégré)
    shadow: 2.0
    shadow_justification: >
      Thèse principalement ❧ (analyse interne du corpus). Les faits sont documentés
      (articles existent, KERNEL figé), mais l'interprétation (Κ auto-appliqué,
      lucidité paralysante) est spéculative. L'absence de Sharp/Ostrom est vérifiable,
      l'intention de l'auteur ne l'est pas.

  # --- THÈSE 3 : L'IMPOSSIBILITÉ JURIDICO-FINANCIÈRE ET L'ARCHITECTURE DÉFENSIVE (robustesse 7/10) ---
  - id: TC3
    rang: 3
    robustesse: 5
    enonce: >
      La coordination acéphale en France 2026 est une quasi-impossibilité juridique,
      financière et opérationnelle. Le corpus identifie 4 piliers défensifs combinés
      comme seule voie théorique : (1) puits de droit (empilement 6 niveaux : asso 1901 →
      SCIC → SARL → syndicat → parti politique, fragmentant la responsabilité pénale),
      (2) financement invisible sous 10 000€/mois (crypto Monero, dons fractionnés,
      coopératives), (3) non-violence disciplinée (198 méthodes Sharp, protocole
      marshals, contre-infiltration), (4) temporalité longue (horizon 30-120 ans,
      transmission intergénérationnelle). Aucun pilier n'est suffisant seul, et la
      combinaison n'a jamais été testée. L'absence de sanctuaire imperméable en
      France 2026 rend toute guérilla armée suicidaire (4 mouvements occidentaux
      détruits en <30 ans) et toute structure visible juridiquement ciblable (Tarnac :
      10 ans de procédure, réseau détruit malgré relaxe). La France est le pays
      européen le plus répressif sur l'association de malfaiteurs (art.450-1 CP ne
      requiert PAS de structure hiérarchique, contrairement au StGB §129 allemand).
    dossiers:
      - risque (art.450-1, 421-1 CP ; dissolution administrative ; Tarnac)
      - puits (architecture 6 niveaux, SCIC, syndicat, parti politique)
      - finance (budget 6000-8000€/mois, TRACFIN, fenêtre 2000-10 000€)
      - fininv (4 piliers combinés, aucun testé)
      - defaite (4 mouvements armés détruits, sanctuaires absents en France)
      - sanctuaire (sanctuaire = variable critique, corrélation 8/8, France = 0)
      - succession (dead man's switch, transmission, Holacracy)
      - modele (zapatiste adapté, 4 conditions non remplies en France)
      - benelux (droit comparé : France = pire choix, Belgique = peine min)
    faits_cles:
      - F-RIS-001 (art.450-1 CP, 10 ans)
      - F-RIS-004 (Tarnac 10 ans procédure, relaxe, réseau détruit)
      - F-RIS-015 (StGB §129 exige hiérarchie, art.450-1 non)
      - F-PUI-013 (puits 6 niveaux, jamais testé)
      - F-FIN-001 (budget survie 6050€/mois)
      - F-FIN-005 (fenêtre 2000-10 000€/mois)
      - F-defaite-001 (4 mouvements armés détruits)
      - F-defaite-014 (sanctuaires = discriminant, France = 0)
      - F-MOD-015 (modèle zapatiste jamais testé en démocratie occidentale)
    acteurs_cles:
      - TRACFIN (détection financière)
      - Parquet/Juge d'instruction (art.450-1, détention provisoire)
      - Conseil d'État (dissolution SdT)
      - FLN/IRA/Zapatistes (modèles historiques de survie)
      - Tarnac (précédent : procédure détruit même sans condamnation)
    shadow: 1.5
    shadow_justification: >
      Thèse bien documentée côté juridique (13✦, legifrance/CEDH/CE).
      Côté solutions : purement spéculatif. Le puits de droit, le financement
      invisible, et le modèle zapatiste adapté sont des architectures théoriques
      jamais testées. La fenêtre TRACFIN et les budgets sont vérifiables ;
      l'efficacité combinée des 4 piliers ne l'est pas.

  # --- THÈSE 4 : L'EXCLUSION STRUCTURELLE DES 65% (robustesse 5/10) ---
  - id: TC4
    rang: 4
    robustesse: 5
    enonce: >
      Le corpus Truth Engine exclut structurellement 65% de la population française
      (classes populaires, 42.8% ; illectronisme 15.4% ; temps partiel subi 31% des
      employées ; revenu médian 1400€/mois) et 100% des perspectives non-masculines/
      non-blanches. 4 filtres (capital culturel, temps disponible, revenu, mode
      d'action) rendent les protocoles HYPER_MATRICE inaccessibles aux profils C/D/E
      (score ≤2/10). Le biais de genre est total : 0 mention dans le corpus original,
      76.5% des employés sont des femmes, 77.5% des temps partiels sont féminins.
      Le biais de race est également total : 0 mention, alors que les QPV (quartiers
      prioritaires) ont 60% d'abstention et sont les premières cibles de la répression
      policière. La psychologie militante analysée (7 pièges, 5 mécanismes de
      résilience) est une psychologie CSP+, urbaine, éduquée. Le corpus ne peut pas
      intégrer ces populations sans se détruire : ajouter un contre-modèle populaire
      (MAP) visible, massif, simple, territorial est la seule voie, mais ce
      contre-modèle échappe structurellement au corpus.
    dossiers:
      - classe (42.8% classes populaires, 4 filtres, suspicion 3.8/10)
      - racegenre (0 mention race/genre, 12 contrôles, suspicion 6.2/10)
      - psychomil (7 pièges militants CSP+, 5 mécanismes résilience)
      - verrou (biais masculinité militariste, élitisme avant-garde)
      - violinter (spectre N0→N6, curseur optimal N1-N2)
      - audit (gap CLASSE et RACE/GENRE identifiés comme bloquants)
    faits_cles:
      - F-CLA-001 (classes populaires 42.8%, 12.4M)
      - F-CLA-002 (illectronisme 15.4%, 9% ouvriers vs 1.2% cadres)
      - F-CLA-004 (76.5% employés = femmes)
      - F-CLA-008 (0 protocole >2/10 accessibilité C/D/E)
      - F-RG-003 (0 mention race dans le corpus)
      - F-RG-007 (12 contrôles proposés, 0 race/genre dans version initiale)
      - F-VER-012 (biais romantisme, élitisme, masculinité, occidentalo-centrisme)
    acteurs_cles:
      - Classes populaires (12.4M, absentes)
      - Femmes (76.5% des employés, invisibles)
      - QPV (60% abstention, absents)
      - Banlieues Climat (contre-exemple ignoré)
    shadow: 2.5
    shadow_justification: >
      Données INSEE ✦ (vérifiables). Mais la thèse centrale ("le corpus ne peut
      pas intégrer les classes populaires sans se détruire") est une spéculation
      stratégique, pas un fait. Le biais de race est documenté par absence (0 mention)
      mais l'absence ne prouve pas l'exclusion. Shadow le plus élevé du corpus.

  # --- THÈSE 5 : L'HYPOTHÈSE NON VALIDÉE (robustesse 4/10) ---
  - id: TC5
    rang: 5
    robustesse: 4
    enonce: >
      Aucun des protocoles du corpus n'a été testé empiriquement. Le corpus est
      la meilleure hypothèse disponible sur la coordination acéphale en France 2026
      — mais il reste une hypothèse. La validation historique (IRA = tous protocoles
      appliqués → Good Friday ; GJ = aucun protocole → défaite 6 mois) est cohérente
      mais biaisée (sélection des cas pour confirmer la thèse). 4 protocoles sont
      structurellement non testables (répression massive, succession en cas de
      décapitation, éthique du sacrifice, guerre narrative). Le plafond Dunbar (150
      relations stables) n'est pas intégré aux solutions. L'effet Hawthorne (biais
      d'observation) biaise tout test en laboratoire. Le corpus est structurellement
      irréfutable tant que la coordination n'existe pas en France — c'est sa force
      (pas de réfutation possible) et son danger (peut passer 20 ans sans validation
      ni invalidation). La falsifiabilité poppérienne est théorique (un mouvement
      sans sanctuaire >10 ans, un mouvement acéphale qui gagne) mais pratiquement
      inaccessible.
    dossiers:
      - empirique (design 3 phases, 7 métriques, 0 test, suspicion 6/10)
      - defaite (validation historique IRA vs GJ, biais sélection)
      - finance (budgets théoriques, 0 cellule réelle documentée)
      - modele (zapatiste jamais testé en démocratie occidentale)
      - projetpol (5 propositions, 0 test)
      - leadership (5 modèles, 0 testés empiriquement)
    faits_cles:
      - F-EMP-001 (0 protocole testé empiriquement)
      - F-EMP-002 (design 3 phases proposé)
      - F-EMP-006 (validation historique IRA/GJ)
      - F-EMP-010 (4 protocoles non testables)
      - F-EMP-011 (Dunbar 150, plafond biologique)
      - F-defaite-013 (IRA seul mouvement OTAN ayant forcé négociation)
    acteurs_cles:
      - IRA (validation historique positive)
      - Gilets jaunes (validation historique négative)
      - Popper (falsifiabilité)
      - Dunbar (150)
      - Mayo (Hawthorne)
    shadow: 2.5
    shadow_justification: >
      Thèse la plus spéculative. Le design de validation est rigoureux (3 phases,
      7 métriques, cadre éthique) mais n'a jamais été exécuté. La validation
      historique est cohérente mais non aveugle. Le test ultime (mouvement réel)
      est hors de contrôle. La thèse est honnête dans son auto-limitation.

