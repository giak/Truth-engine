# ============================================================
# §6 WOLVES DE SYNTHÈSE
# ============================================================

wolves_synthese:
  - nom: "Le corpus est un exercice de style, pas un outil"
    argument: "25 dossiers, 370 faits, 0 test. La coordination acéphale est une expérience de pensée fascinante mais n'a aucune existence réelle. Le corpus est une bibliothèque, pas un mouvement."
    reponse: "La bibliothèque précède le mouvement. La théorie de la coordination est un préalable à la coordination réelle — mais le corpus doit admettre qu'il est un préalable, pas une solution."
  - nom: "Le droit rend tout impossible — point final"
    argument: "Art.450-1 CP = 10 ans. TRACFIN détecte <10 000€. LOPMI prédit les patterns. Aucune architecture défensive ne survit à la détermination d'un État qui veut écraser un mouvement. Le corpus décrit l'impossibilité sans l'admettre."
    reponse: "Tarnac a été détruit par la procédure, mais les Soulèvements de la Terre ont survécu à la dissolution. Le droit n'est pas un instrument total — il a des failles (CC 1971, QPC 2024, CE proportionnalité). La question n'est pas 'le droit rend-il tout impossible' mais 'comment exploiter les failles du droit'."
  - nom: "Le corpus s'auto-détruit par l'analyse"
    argument: "TC4 démontre que le corpus exclut 65% de la population. TC5 démontre qu'aucun protocole n'est testé. TC2 démontre que le KERNEL ignore ses propres solutions. À quoi sert un corpus qui démontre sa propre invalidité ?"
    reponse: "L'auto-critique n'est pas l'auto-destruction. C'est la condition de la robustesse. Un corpus qui ne documente pas ses propres angles morts est un corpus fragile. La lucidité sur les limites est la seule position intellectuellement honnête — et la seule stratégiquement utile."

# ============================================================
# §7 LIMITES DE LA SYNTHÈSE
# ============================================================

limites_synthese:
  - "Mnemolite DOWN : 0 cross-référencement avec les productions antérieures du corpus. La synthèse est aveugle aux investigations Sumer, justice française, et autres séries."
  - "Biais du LLM hôte : la synthèse est produite par un agent conversationnel qui a lu les 25 YAMLs mais pas les ~38 fichiers sources originaux. Des nuances peuvent être perdues."
  - "Les 5 thèses cardinales sont une construction interprétative — d'autres découpages sont possibles (par domaine, par solution, par acteur)."
  - "Les contradictions identifiées (non-violence vs État qui tire, etc.) sont présentées comme des apories mais pourraient être résolues par des investigations supplémentaires."
  - "Le shadow factor des thèses cardinales est une estimation qualitative, pas un calcul mécanique."
  - "La synthèse ne priorise pas les solutions — elle cartographie le problème. La Phase 2.6 (plan d'article) devra trancher."

# ============================================================
# §8 SHADOW FACTOR GLOBAL
# ============================================================

shadow_factor_synthese: 2.0
shadow_justification_synthese: >
  La synthèse repose sur 370 faits dont 75% sont ❧ (non vérifiés par URL externe).
  Les thèses cardinales sont des constructions interprétatives, pas des faits.
  Mnemolite DOWN empêche tout cross-référencement. Le LLM hôte introduit un biais
  de synthèse (tendance à chercher des patterns même là où il n'y en a pas).
  En contrepartie, la cohérence inter-dossiers est forte (5 patterns transversaux
  documentés dans ≥5 dossiers chacun) et les thèses sont falsifiables (conditions
  de réfutation identifiables).

