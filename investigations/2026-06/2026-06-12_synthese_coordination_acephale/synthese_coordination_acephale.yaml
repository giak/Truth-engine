      dossiers: [defaite, sanctuaire, verrou, modele, finance, ace]
      description: "La variable critique de survie des mouvements (IRA, FLN, FARC, PKK, Zapatistes) est absente en France 2026. Le territoire est intégralement cartographié et surveillé (LOPMI 2023). Aucun protocole ne résout ce problème."
