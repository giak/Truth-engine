  perspectives_dialectiques_synthese:
    - contradiction: "Non-violence vs État qui tire"
      these: "La non-violence est la seule stratégie viable en démocratie (Chenoweth : 2× plus de succès). Les 198 méthodes Sharp + protocole marshals + contre-infiltration offrent une technologie opérationnelle complète."
      antithese: "L'État français 2026 n'hésite pas à tirer (30 blessés graves GJ, 2 morts, LBD). La non-violence suppose un régime sensible à l'opinion — la France LOPMI 2023 ne l'est plus."
      synthese: "La non-violence disciplinée n'est pas une garantie de succès mais la violence armée est une garantie d'échec en démocratie occidentale (4/4 mouvements détruits). La question n'est pas 'non-violence ou violence' mais 'quelle non-violence survit à un État qui tire'. La réponse zapatiste : ne pas donner de cible (acéphalie), ne pas donner de prétexte (zéro violence), ne pas donner de prise (autonomie économique)."
    - contradiction: "Structure vs acéphalie"
      these: "La structure (cellules 3-5, mitose, succession, compartimentation FLN) est nécessaire pour survivre à la répression. Sans structure, pas de coordination."
      antithese: "Toute structure est une cible juridique (art.450-1 CP ne requiert PAS de hiérarchie) et algorithmique (LOPMI pattern detection). La structure que le système attend est celle qu'il détruit."
      synthese: "La solution n'est ni la structure visible (cible) ni l'acéphalie pure (inefficace, cf. Occupy). C'est la structure INVISIBLE : cellules à géométrie variable, rôles tournants, pas de siège, pas de compte bancaire unique, pas de leader identifiable. Le puits de droit fragmente la responsabilité ; la mitose fragmente la structure. L'invisibilité n'est pas l'absence — c'est la désorganisation apparente."
    - contradiction: "Visibilité vs invisibilité"
      these: "La visibilité massive (grèves, ronds-points, occupations) protège par le nombre et crée la légitimité démocratique. Les concessions de l'État sont proportionnelles à la pression visible."
      antithese: "La visibilité est un suicide juridique et algorithmique. Toute action visible est filmée, analysée, poursuivie. Les 4000 condamnations GJ sont le prix de la visibilité."
      synthese: "Deux régimes distincts : le mouvement de masse visible (grève, manifestation, occupation) pour la pression politique, et le réseau invisible (cellules, financement, coordination) pour la survie organisationnelle. Les GJ avaient la visibilité sans le réseau — ils ont obtenu 17 Md€ de concessions mais ont été détruits en 6 mois. L'IRA avait le réseau avec une visibilité dosée (Sinn Féin) — elle a survécu 29 ans et forcé une négociation. La synthèse est un mouvement à deux vitesses : surface légale visible + profondeur acéphale invisible."

