    enonce: "Le concept de 'signal aux marchés' (ICRG, spreads) est absent des 3 enquêtes support (saturation, USA, GJ) — seule la V2 le traite, dans sa section §29 corrective. C'est l'innovation théorique la plus importante de tout le corpus."
    fiches_concernees: ["boycott_v2"]
  - id: "OBS-002"
    enonce: "L'hélicoptère de Macron est le détail qui valide toute la théorie : si un président doit être exfiltré, le mouvement n'est pas 'symbolique'. Pourtant, ce même mouvement n'a rien construit."
    fiches_concernees: ["gilets_jaunes", "boycott_v2"]
  - id: "OBS-003"
    enonce: "Le mythe '47 jours' est débunké par l'enquête USA, mais il circule encore comme 'fait alternatif'. Cela illustre la difficulté de la vérification factuelle dans l'activisme."
    fiches_concernees: ["boycott_usa"]

transversalites:
