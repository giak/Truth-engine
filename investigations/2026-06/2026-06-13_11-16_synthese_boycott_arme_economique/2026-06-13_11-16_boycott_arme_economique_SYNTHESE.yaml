    concept: "Boycott comme arme asymétrique"
    description: "Les 4 enquêtes convergent sur l'idée que le boycott est une arme de résistance asymétrique — pas de coordination nécessaire, pas de structure à infiltrer, légal (Baldassi), scalable."
    fiches_concernees: ["saturation", "boycott_usa", "gilets_jaunes", "boycott_v2"]
    faits_communs: ["F-SAT-001", "F-USA-009", "F-GJ-002", "F-V2-007"]
  - id: "TR-002"
    concept: "V1/V2 — schisme entre colère et infrastructure"
    description: "Les GJ (zéro V2) et la théorie V2 (boycott_v2) décrivent le même problème : la colère sans structure meurt. La saturation propose une tactique complémentaire (saturation administrative) qui est une forme de V1.5."
    fiches_concernees: ["gilets_jaunes", "boycott_v2", "saturation"]
    faits_communs: ["F-GJ-008", "F-GJ-010", "F-V2-003", "F-SAT-004"]
  - id: "TR-003"
    concept: "Fragilité juridique du boycott"
    description: "Aux US, 1A protège (NAACP v. Claiborne). En France, CEDH protège mais amendement CL46 menace. Les deux enquêtes convergent : la fenêtre de légalité est une ressource politique temporaire."
    fiches_concernees: ["boycott_usa", "boycott_v2"]
    faits_communs: ["F-USA-009", "F-V2-007", "F-V2-008"]
  - id: "TR-004"
    concept: "Coût social du boycott — fracture de classe"
    description: "Les 3 enquêtes notent que le boycott coûte plus cher aux pauvres : TVA régressive, alternatives plus chères, illectronisme. Le boycott ne peut pas être un mouvement de masse sans résoudre cette contradiction."
    fiches_concernees: ["saturation", "boycott_usa", "boycott_v2"]
    faits_communs: ["F-SAT-008", "F-USA-012", "F-V2-017", "F-V2-002"]
  - id: "TR-005"
    concept: "CEO comme cible vulnérable"
    description: "Tesla (Musk) a perdu -71% bénéfice car Musk EST la cible. Target (Cornell, invisible) a mieux résisté. France : Bolloré, Arnault, Niel, Drahi sont des cibles potentielles."
    fiches_concernees: ["boycott_usa", "boycott_v2"]
    faits_communs: ["F-USA-001", "F-USA-002"]

gaps:
  - "GAP-001 : Élasticité de la TVA — combien une baisse de X% de consommation réduit-elle les recettes ? Aucune étude empirique française."
  - "GAP-002 : Comportement BCE face à une révolte fiscale politique — la BCE est 'apolitique' en théorie mais une crise de boycott est politique."
  - "GAP-003 : Comment résoudre la contradiction V1/V2 sans structure de leadership ? Aucun précédent historique."
  - "GAP-004 : 35M de dépendants de l'État — aucune stratégie pour leur permettre de rejoindre (ou au moins ne pas combattre) le mouvement."
  - "GAP-005 : Capacité d'emprunt réelle de l'État si la notation chute en catégorie spéculative — scénario non modélisé."

