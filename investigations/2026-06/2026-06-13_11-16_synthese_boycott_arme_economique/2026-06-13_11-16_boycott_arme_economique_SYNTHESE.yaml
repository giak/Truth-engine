sujet_majoritaire: "Le boycott comme arme économique asymétrique — théorie d'action à deux vitesses pour assecher l'État par le signal aux marchés financiers, validée par l'expérience des Gilets jaunes (V1-sans-V2) et le laboratoire américain 2023-2026."

theses_cardinales:
  - titre: "THESE-001 : Le vrai pouvoir du boycott est le SIGNAL aux marchés, pas l'assec fiscal"
    enonce: "L'analyse initiale (V1) surestimait l'impact budgétaire direct d'une baisse de TVA. La correction §29 montre que le mécanisme réel est la spirale dette/défiance : boycott → perte de consentement fiscal → dégradation ICRG → hausse spreads → dette auto-alimentée → crise de légitimité. -10 points ICRG = +106bp spreads + -2% PIB (Bruegel 2024)."
    f_atomiques_justificatifs: ["F-V2-001", "F-V2-009", "F-V2-014", "F-V2-015", "F-V2-016"]
    shadow: 3.5
  - titre: "THESE-002 : V1-sans-V2 meurt — les GJ sont la preuve expérimentale"
    enonce: "Les Gilets jaunes (287k manifestants, 47k actions, 17 Md€ d'absorption étatique, hélicoptère prêt à exfiltrer Macron) ont validé EXPÉRIMENTALEMENT que la puissance de blocage sans infrastructure alternative mène à l'échec. Zéro infrastructure survivante en 2026. Le modèle deux vitesses (V1 colère + V2 alternative) est la seule voie durable."
    f_atomiques_justificatifs: ["F-GJ-001", "F-GJ-002", "F-GJ-005", "F-GJ-008", "F-GJ-010", "F-V2-013"]
    shadow: 2.5
  - titre: "THESE-003 : Le laboratoire US (11 boycotts, 40 sources) fournit des leçons opérationnelles transposables"
    enonce: "Tesla (-71% bénéfice), Bud Light (-30% persistants), Target (-$12.4B), Starbucks (-$11B) montrent que CEO visible, cible unique, alternative disponible et durée limitée sont les facteurs de succès. La transposition à la France doit intégrer le cadre juridique différent (pas de 1er Amendement, CEDH Baldassi mais amendement CL46 prêt)."
    f_atomiques_justificatifs: ["F-USA-001", "F-USA-003", "F-USA-004", "F-USA-008", "F-USA-009", "F-USA-011"]
    shadow: 3.0
  - titre: "THESE-004 : La protection juridique du boycott est une fenêtre étroite qui se refermera"
    enonce: "La CEDH (Baldassi 2020) protège l'appel au boycott comme expression politique. Mais l'amendement CL46 (3 ans + 45k€) est déjà écrit et prêt à être voté en 72h. La fenêtre de légalité est ouverte depuis 2020 — elle se fermera dès que le boycott deviendra une menace réelle."
    f_atomiques_justificatifs: ["F-V2-007", "F-V2-008", "F-USA-009", "F-SAT-006", "F-SAT-009"]
    shadow: 2.0
  - titre: "THESE-005 : Le boycott est structurellement inégalitaire — les pauvres paient le coût"
    enonce: "La TVA est régressive (pèse plus lourd sur les bas revenus). Les circuits alternatifs (V2) sont 20-40% plus chers. 35M de personnes dépendent financièrement de l'État. La fracture numérique (15% illectronisme) exclut une partie de la population de la saturation administrative. Le boycott est un luxe de classe moyenne qui ne peut réussir sans résoudre cette contradiction."
    f_atomiques_justificatifs: ["F-SAT-008", "F-V2-002", "F-V2-017", "F-USA-012"]
    shadow: 3.5

meta_observations:
