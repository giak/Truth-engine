enquete_id: "boycott_v2"
complexity: "APEX"
date_extraction: "2026-06-13"
enquete_source: "investigations/2026-06-13_boycott_arme_economique_v2/2026-06-13_23-30_boycott_arme_economique_INVESTIGATION_V2.md"

these_centrale: "Le boycott est une arme économique asymétrique viable contre l'État — son vrai pouvoir n'est pas dans l'assec fiscal direct (l'État emprunte 310 Md€/an) mais dans le SIGNAL envoyé aux marchés financiers (ICRG rating, spreads, notation souveraine), combiné à la construction d'alternatives économiques (V2) qui seules empêchent l'épuisement du mouvement."

theses_implicites:
  - "La correction §29 invalide l'analyse initiale : le pouvoir du boycott n'est pas comptable (baisse TVA) mais financier (perte de confiance des marchés) — -10 points ICRG = +106bp spreads + -2% PIB"
  - "Le modèle Swadeshi (boycott + construction d'alternative) est la clé : V1 sans V2 meurt (GJ l'ont prouvé expérimentalement), V2 sans V1 est un marché de niche"
  - "La fenêtre de protection juridique du boycott (CEDH Baldassi 2020) est étroite — l'amendement CL46 (3 ans + 45k€) est déjà écrit ; elle se fermera quand le boycott deviendra une menace réelle"

faits_atomiques:
  - id: "F-V2-001"
    enonce: "TVA brute 2025 : 175,1 Md€, soit 35,4% des recettes fiscales nettes de l'État — l'impôt le plus important et le moins visible."
    source_url: "https://www.insee.fr/fr/statistiques/2381416"
    source_section: "§2"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-V2-002"
    enonce: "Seulement 50% des ménages français paient l'impôt sur le revenu. Les 50% qui ne le paient pas sont insensibles à la pression fiscale directe mais TOUS paient la TVA."
    source_url: "https://www.vie-publique.fr/en-bref/302473-hausse-de-71-des-recettes-fiscales-en-2025"
    source_section: "§2"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-V2-003"
    enonce: "Swadeshi (Inde, 1905-1908) : importations de coton britannique en baisse de -22% à -44% ; partition du Bengal annulée en 1911. Modèle boycott + construction d'alternative."
    source_section: "§1"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-V2-004"
    enonce: "Montgomery Bus Boycott (1955-1956) : 381 jours, 750 000 $ de pertes pour la compagnie de bus, ségrégation abolie. Soutenu par un carpool (V2) qui a permis la durée."
    source_url: "https://www.nps.gov/articles/montgomery-bus-boycott.htm"
    source_section: "§1"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-V2-005"
    enonce: "Addiopizzo (Sicile, 2004-2026) : 1000+ commerçants et 9000+ consommateurs labellisés 'Pago chi non paga' — consommation critique contre la mafia."
    source_section: "§1"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-V2-006"
    enonce: "Grève des loyers Sonacotra (1975-1981) : 20 000 résidents, 100+ foyers, 6 ans de résistance sans leader ni structure formelle."
    source_url: "https://vacarme.org/article115.html"
    source_section: "§1"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-V2-007"
    enonce: "CEDH, arrêt Baldassi c. France (11 juin 2020) : l'appel au boycott de produits d'un État relève de la liberté d'expression politique (article 10 CEDH). La France condamnée."
    source_section: "§17"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-V2-008"
    enonce: "Amendement CL46 (25 janvier 2025) : tentative de criminalisation du boycott (3 ans d'emprisonnement + 45 000 € d'amende) — repoussée, mais prête à être votée en 72h."
    source_section: "§17"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-V2-009"
    enonce: "Déficit de l'État 2025 : 124,7 Md€. Besoin de financement 2026 : 310 Md€. Dette publique : 114% du PIB."
    source_section: "§18"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-V2-010"
    enonce: "98% des révoltes fiscales historiques échouent, réprimées dans le sang (Éric Anceau, professeur Université Lorraine, Ca m'intéresse 2025)."
    source_section: "§19"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-V2-011"
    enonce: "TRACFIN a traité 180 000 déclarations de soupçon en 2024. Seuil de déclenchement : 10 000 € pour opération atypique. Smurfing (fractionnement) = motif explicite de déclaration."
    source_url: "https://www.economie.gouv.fr"
