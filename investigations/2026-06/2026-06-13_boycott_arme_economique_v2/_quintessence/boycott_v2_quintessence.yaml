    enonce: "Cinq fronts de pression externe en 2026 : tarifs Trump 20%, NATO 3.5% PIB, procédure déficit UE, BCE restrictive, concurrence Chine + Allemagne en récession."
    source_section: "§29"
    head_status: 200
    tier: 2
    glyphe: "✧"
