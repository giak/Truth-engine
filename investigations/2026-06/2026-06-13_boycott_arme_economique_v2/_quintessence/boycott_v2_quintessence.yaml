    enonce: "Les Gilets jaunes (287 700 manifestants au pic) ont validé expérimentalement la thèse V1-sans-V2 : zéro infrastructure survivante en 2026."
    source_section: "§25"
    head_status: 200
    tier: 1
    glyphe: "✦"
