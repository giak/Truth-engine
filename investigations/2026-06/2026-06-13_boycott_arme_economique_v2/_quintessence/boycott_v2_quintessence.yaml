causalites:
  - cause: "F-V2-001"
    effet: "F-V2-002"
    mecanisme: "La TVA est l'impôt universel invisible (35,4% des recettes) — toucher TOUS les consommateurs sans distinction, contrairement à l'IR"
  - cause: "F-V2-014"
    effet: "F-V2-016"
    mecanisme: "La dégradation du rating ICRG (-10pts = +106bp spreads) combinée à la dette 114% PIB crée une boucle auto-réalisatrice : plus de spreads = plus de dette = moins de confiance"
  - cause: "F-V2-007"
    effet: "F-V2-008"
    mecanisme: "La protection juridique (CEDH Baldassi 2020) est activement menacée par l'amendement CL46 — la fenêtre de légalité du boycott est étroite et temporaire"

perspectives_dialectiques:
  - position: "Thèse — Le boycott est l'arme asymétrique ultime"
    argument: "Il ne nécessite pas de coordination préalable, il est contagieux par imitation sociale, légal (Baldassi 2020), et il frappe le seul langage que l'État comprend : l'argent. Le signal aux marchés (ICRG, spreads) est plus puissant que l'impact comptable direct."
  - position: "Antithèse — Le boycott est une illusion de résistance"
    argument: "Aucun boycott n'a jamais fait plier un État moderne (Anceau : 98% échouent). L'État emprunte 310 Md€/an, la BCE soutient la dette. Le boycott pénalise les pauvres (TVA régressive) et les alternatives (V2) sont 20-40% plus chères."
  - position: "Synthèse — Le boycott est un levier de pression, pas une solution"
    argument: "Le vrai pouvoir est le SIGNAL (ICRG + spreads), pas l'assec fiscal. Combiné aux 5 fronts externes (Trump, NATO, UE, BCE, Chine), même une perte de confiance limitée des marchés peut déclencher une spirale. Mais sans V2 (construction d'alternative), le boycott meurt comme les GJ."

limites:
  - "Pas de données précises sur l'élasticité de la TVA face à un boycott coordonné"
  - "Aucun boycott n'a jamais fait tomber un État moderne disposant d'une banque centrale, d'une armée et d'une police"
  - "La contradiction V1/V2 sans structure de leadership n'est résolue par aucun précédent historique"
  - "Les circuits alternatifs (AMAP, bio) sont 20-40% plus chers — le boycott est structurellement un luxe de classe moyenne"
  - "35M de dépendants financiers de l'État ne soutiendront pas un boycott qui menace leur survie"
  - "TRACFIN détecte les patterns de smurfing — l'économie parallèle plafonne à ~15-20% du PIB"

wolves:
  - nom: "Macro-économiste libéral"
    argument: "L'État emprunte 310 Md€/an à 2.8%. Une baisse de TVA de 10% = 17.5 Md€, soit 5.6% de l'emprunt annuel. C'est une variation négligeable pour un État qui a levé 2 300 Md€ de PIB."
    reponse: "L'erreur est de ne regarder que les flux réels. Le SIGNAL d'un boycott massif — perte de consentement fiscal — déclenche une spirale sur les marchés (ICRG → spreads → dette auto-alimentée) qui est sans commune mesure avec l'impact comptable direct."
  - nom: "Juriste pénaliste"
    argument: "La protection Baldassi est fragile. L'amendement CL46 (3 ans + 45k€) montre que le législateur peut criminaliser le boycott en 72h par ordonnance ou 49.3."
    reponse: "Le boycott viral (sans coordination, sans structure) est indétectable et inarrêtable. On ne peut pas criminaliser l'imitation sociale."

