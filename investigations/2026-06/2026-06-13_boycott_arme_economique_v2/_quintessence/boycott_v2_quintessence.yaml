    enonce: "Le spread OAT/Bund a culminé à 88bp. La charge de la dette est de ~50 Md€/an. Un spread à 250bp doublerait cette charge à ~80-90 Md€/an."
    source_section: "§29"
    head_status: 200
    tier: 2
    glyphe: "✧"
