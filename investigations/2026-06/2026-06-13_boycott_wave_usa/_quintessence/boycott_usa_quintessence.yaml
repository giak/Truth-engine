enquete_id: "boycott_usa"
complexity: "COMPLEX"
date_extraction: "2026-06-13"
enquete_source: "investigations/2026-06-13_boycott_wave_usa/2026-06-13_11-00_boycott_wave_usa_2025_2026_INVESTIGATION.md"

these_centrale: "La vague de boycotts américains 2023-2026 constitue le laboratoire le plus massif d'action consommateur jamais observé — 11 boycotts documentés, 40 sources — et fournit des leçons opérationnelles transposables à la France, à condition d'intégrer les différences juridiques (1er Amendement vs droit pénal français) et structurelles (polarisation, échelle)."

theses_implicites:
  - "La durée '47 jours' comme cycle standard de boycott est un mème non sourcé — les durées réelles varient de 24h à 3+ ans, moyenne empirique 13-18 mois pour les boycotts persistants"
  - "Le facteur #1 de succès d'un boycott est la visibilité du CEO comme cible (Musk > Tesla, Cornell > Target) — plus le PDG est identifié, plus le boycott frappe"
  - "La polarisation politique neutralise les boycotts bidirectionnels (Target boycotté par les deux camps), mais amplifie les pertes quand un seul camp frappe (Tesla)"

faits_atomiques:
  - id: "F-USA-001"
    enonce: "Tesla a subi -9% de ventes annuelles en 2025 (1,63M unités vs 1,79M en 2024), -71% de bénéfice net au T1 2025, et -49% de ventes en Europe en mai 2025."
    source_url: "https://techcrunch.com/2026/01/02/tesla-annual-sales-decline-9"
    source_section: "§1.3"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-USA-002"
    enonce: "L'effet 'Musk partisan effect' (Yale NBER 2025) a coûté à Tesla entre 1 et 1,26 million de ventes potentielles depuis 2022."
    source_url: "https://observer.com/2025/11/yale-study-elon-musks-political-actions-cost-tesla"
    source_section: "§1.3"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-USA-003"
    enonce: "Bud Light a perdu 30% de ses ventes de façon persistante 2+ ans après le pic de la controverse Dylan Mulvaney (avril 2023) et n'a jamais retrouvé son statut de #1 bière américaine, dépassé par Modelo Especial."
    source_url: "https://en.wikipedia.org/wiki/Bud_Light_boycott"
    source_section: "§1.1"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-USA-004"
    enonce: "Target a perdu 12,4 milliards de dollars de valeur marchande après l'annonce de son rollback DEI (janvier 2025), avec une baisse de trafic de 5,7% semaine 17 mars 2025 (8e semaine consécutive de baisse)."
    source_url: "https://fortune.com/2025/02/22/target-backtracking-dei-efforts"
    source_section: "§1.2"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-USA-005"
    enonce: "Le boycott publicitaire de X/Twitter a fait chuter les recettes de ~4,51 milliards $ (2021) à ~2 milliards $ (2024). X a perdu son procès antitrust contre GARM/WFA en mars 2026 : les annonceurs ont le droit de boycotter collectivement."
    source_url: "https://arstechnica.com/tech-policy/2026/03/elon-musk-loses-big-in-court"
    source_section: "§1.4"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-USA-006"
    enonce: "Starbucks a subi 6 trimestres consécutifs de baisse (octobre 2023 - présent), -22% de profit opérationnel, 11 milliards $ de perte de capitalisation boursière, et a supprimé 900 emplois en septembre 2025."
    source_section: "§1.5"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-USA-007"
    enonce: "Le boycott économique général 'Economic Blackout' (28 février 2025, 24h) n'a pas eu d'impact statistiquement significatif au niveau macro (Numerator 2025). Les sous-groupes afro-américains ont sur-mobilisé."
    source_url: "https://numerator.com/resources/blog/economic-blackout-results"
    source_section: "§1.8"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-USA-008"
    enonce: "La durée '47 jours' comme cycle standard de boycott est non sourcée — aucune étude académique ou journalistique fiable ne cite ce chiffre. Les durées réelles vont de 24h à 3+ ans."
    source_section: "§5"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-USA-009"
    enonce: "Aux États-Unis, le 1er Amendement protège les boycotts politiques (NAACP v. Claiborne Hardware, 1982 — Cour Suprême). En France, l'appel au boycott discriminatoire est pénalisé par la loi 2017-86 (27 janvier 2017)."
    source_url: "https://supreme.justia.com/cases/federal/us/458/886"
    source_section: "§3"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-USA-010"
    enonce: "38 états américains ont des lois anti-BDS avec certifications obligatoires pour les contractants publics. Le HR 867 (IGO Anti-Boycott Act, 2025) étend l'interdiction aux organisations internationales."
    source_section: "§3.1"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-USA-011"
    enonce: "62% des Français soutiennent un boycott des produits américains et 18% y participent déjà (CRÉDOC 2025)."
    source_url: "https://credoc.fr/publications/guerre-commerciale"
    source_section: "§1.9"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-USA-012"
    enonce: "35-55% des comptes discutant du boycott Amazon en juin 2025 étaient des bots (Cyabra), ce qui a miné la crédibilité du mouvement."
    source_url: "https://cyabra.com/reports/unmasking-the-bot-driven-boycott-of-amazon"
    source_section: "§1.6"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-USA-013"
    enonce: "Tesla a perdu sa place de #1 constructeur EV mondial au profit de BYD (2,26M unités vs 1,63M)."
    source_section: "§1.3"
    head_status: 200
    tier: 1
    glyphe: "✦"

