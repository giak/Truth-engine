perspectives_dialectiques:
  - position: "Thèse — Les boycotts US sont un modèle pour la France"
    argument: "Les 11 cas documentés montrent que des boycotts ciblés, avec CEO visible et alternative disponible, peuvent infliger des pertes massives (-71% bénéfice Tesla, -30% ventes Bud Light)."
  - position: "Antithèse — Les différences structurelles US/France interdisent la transposition"
    argument: "Le 1er Amendement est le bouclier juridique qui rend les boycotts américains possibles. La France criminalise l'appel au boycott discriminatoire (loi 2017-86, projet Yadan). L'échelle est différente : 5% des consommateurs US = 17M personnes vs 3,3M en France."
  - position: "Synthèse"
    argument: "Les leçons tactiques (cible unique, CEO vulnérable, alternative disponible, durée limitée) sont transposables. Le cadre juridique français nécessite d'adapter la formulation ('choix consommateur' plutôt qu''appel au boycott')."

limites:
  - "Sources majoritairement journalistiques (Reuters, Bloomberg, Forbes) — peu de données brutes d'entreprise vérifiées indépendamment"
  - "CRÉDOC 2025 : sondage déclaratif, pas un comportement observé"
  - "L'effet cumulatif de boycotts simultanés n'est pas modélisé"
  - "Pas d'analyse de l'effet des contre-boycotts sur l'économie globale"
  - "Les données Cyabra (bots) sont d'une seule source, non recoupées"

wolves:
  - nom: "Économiste néoclassique"
    argument: "Les boycotts sont inefficaces car les consommateurs agissent en 'free riders' — chacun attend que les autres boycottent à sa place."
    reponse: "Les données Tesla (-71% bénéfice) et Bud Light (-30% persistants) contredisent cette assertion. Les consommateurs boycottent massivement quand l'enjeu est identitaire."
  - nom: "Juriste français"
    argument: "La loi Copé (2003), la loi 2017-86 et le projet Yadan rendent l'appel au boycott risqué en France. La transposition des tactiques US est juridiquement périlleuse."
    reponse: "La formulation en 'choix consommateur individuel' plutôt qu'en 'appel au boycott collectif' contourne partiellement le risque. Le risque zéro n'existe pas."

