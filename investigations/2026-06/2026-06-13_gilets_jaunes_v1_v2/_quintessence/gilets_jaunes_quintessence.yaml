causalites:
  - cause: "F-GJ-001"
    effet: "F-GJ-002"
    mecanisme: "L'ampleur de la mobilisation (287k pic) a créé une menace existentielle perçue par l'État, justifiant un plan d'exfiltration"
  - cause: "F-GJ-005"
    effet: "F-GJ-006"
    mecanisme: "Les mesures sociales + Grand Débat ont constitué un contre-feu en trois volets : absorber (17 Md€), dialoguer (GDN), réprimer (LBD, lois)"
  - cause: "F-GJ-008"
    effet: "F-GJ-010"
    mecanisme: "Les esquisses de V2 (AdA, Vrai Débat) n'ont pas survécu à l'épuisement du mouvement, faute d'infrastructure financière et juridique"

perspectives_dialectiques:
  - position: "Thèse — Les GJ ont prouvé que la V1 seule est une impasse"
    argument: "287k manifestants, 47k événements, 17 Md€ d'absorption — et pourtant zéro infrastructure en 2026. La puissance de blocage sans V2 est un feu de paille."
  - position: "Antithèse — Les GJ ont réussi comme signal historique"
    argument: "La giletjaunisation (SNCF contrôleurs, médecins, boulangers), le RIC (9/12 candidats), et la recomposition du vote populaire sont des victoires invisibles mais réelles. La V1 a suffi pour imprimer une marque culturelle."
  - position: "Synthèse"
    argument: "Les GJ ont réussi comme signal et échoué comme mouvement. La V2 aurait amélioré la résilience mais pas changé le verrou institutionnel. La prescription : investir la V2 dès le jour 1, mais avec un horizon 5-10 ans."

limites:
  - "Sources principalement journalistiques (Le Monde, Le Figaro, JDD) — les données DILA et archives préfectorales pourraient affiner les métriques"
  - "L'analyse de la V2 gagnerait à être complétée par des entretiens avec les participants de l'AdA"
  - "L'effet GJ à long terme (giletjaunisation) est difficilement mesurable quantitativement"
  - "Pas de comptage GPS indépendant des blocages"

wolves:
  - nom: "Sociologue institutionnel"
    argument: "La thèse V1/V2 est une reconstruction a posteriori. Les GJ n'avaient pas de 'théorie d'action' — ils réagissaient à une injustice immédiate. L'absence de V2 n'est pas un échec mais une caractéristique."
    reponse: "L'absence de théorie d'action explicite est précisément le problème documenté. Les GJ ne pensaient pas en termes de V1/V2, mais l'analyse montre que c'est ce verrou (absence de V2) qui les a condamnés."
  - nom: "Militant GJ"
    argument: "Nous avons changé le pays. Le RIC est dans tous les programmes. La giletjaunisation est partout. Ce n'est pas un échec."
    reponse: "Le signal est réel mais ne suffit pas. Aucune des 47 revendications initiales n'a été satisfaite structurellement. Le Grand Débat n'a produit aucune loi. L'onde culturelle est tangible, la victoire politique est nulle."

iceberg:
  - "Le rôle des réseaux sociaux (Meta/Facebook) dans la coordination vs la fragmentation du mouvement GJ n'est pas analysé en profondeur"
  - "Résultat Mnemolite: [query=gilets jaunes V1 V2, 1587 mémoires, quintessences boycott USA + saturation liées]"
  - "Résultat Mnemolite: [query=mouvement social répression, 1587 mémoires, corpus coordination acéphalique existant]"

