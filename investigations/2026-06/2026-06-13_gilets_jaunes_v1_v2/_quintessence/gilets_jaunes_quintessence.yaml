enquete_id: "gilets_jaunes"
complexity: "COMPLEX"
date_extraction: "2026-06-13"
enquete_source: "investigations/2026-06-13_gilets_jaunes_v1_v2/2026-06-13_gilets_jaunes_v1_v2_thesis_INVESTIGATION.md"

these_centrale: "Les Gilets jaunes (2018-2020) valident l'hypothèse V1-sans-V2 : explosion visible massive (287k manifestants, 47k événements, 17 Md€ d'absorption étatique) mais zéro infrastructure survivante en 2026 — la puissance de blocage sans infrastructure de soutien mène à l'épuisement et à l'échec stratégique, bien que l'onde culturelle (giletjaunisation) persiste."

theses_implicites:
  - "L'hélicoptère prêt à exfiltrer Macron le 8 décembre 2018 (Canard Enchaîné, confirmé) prouve que l'État a perçu une menace existentielle réelle — ce n'était pas une révolte gérable"
  - "Le Grand Débat National a été le contre-feu le plus efficace : il a séparé la colère de la rue (illégitime) de la participation encadrée (légitime) avec un rapport médiatique de 80:1"
  - "La giletjaunisation (contamination du répertoire d'action GJ dans d'autres luttes) est l'héritage le plus tangible, pas l'infrastructure politique"

faits_atomiques:
  - id: "F-GJ-001"
    enonce: "Le pic de mobilisation des Gilets jaunes est de 287 700 manifestants (Acte I, 17 novembre 2018), la plus grande mobilisation extra-syndicale depuis 1968."
    source_section: "§1, §2.2"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-GJ-002"
    enonce: "Un hélicoptère était prêt à exfiltrer Macron de l'Élysée le 8 décembre 2018 (Acte IV) — confirmé par Le Canard Enchaîné, L'Alsace, Valeurs Actuelles."
    source_section: "§1, §4.1"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-GJ-003"
    enonce: "Le mouvement a généré 47 695 manifestations et blocages en 6 mois, avec 2 034 sites de blocage au pic (source JDD)."
    source_section: "§2.2"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-GJ-004"
    enonce: "11 morts, 2 448 manifestants blessés (dont 24 éborgnés, 5 mains arrachées), 1 797 forces de l'ordre blessées, 12 908 tirs LBD en 6 mois."
    source_section: "§2.5"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-GJ-005"
    enonce: "Macron a annoncé 10 milliards d'euros de mesures sociales le 10 décembre 2018 (SMIC +100€, heures supp défiscalisées, CSG annulée). 17 Md€ au total déc 2018 + avril 2019."
    source_section: "§1, §4.4"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-GJ-006"
    enonce: "Le Grand Débat National a reçu 2 millions de contributions, 500 000 participants en réunions locales, 1,9 million en ligne, 20 000 cahiers de doléances. Coût : ~10 M€. Ratio médiatique GDN/Vrai Débat = 80:1."
    source_section: "§4.2"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-GJ-007"
    enonce: "12 107 interpellations en 6 mois, 3 163 condamnations en un an (dont 400 prison ferme immédiate). Loi anti-casseurs promulguée 11 avril 2019."
    source_section: "§2.5, §4.3"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-GJ-008"
    enonce: "L'Assemblée des Assemblées (AdA) a tenu 4 sessions : Commercy (janv 2019), Montceau-les-Mines (230 groupes), Saint-Nazaire (500-1000 délégués), Montpellier (nov 2019). Esquisse de V2."
    source_section: "§3.1"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-GJ-009"
    enonce: "Le Vrai Débat (plateforme Cap Collectif) a réuni 44 576 inscrits, 25 229 propositions, 92 289 arguments, 898 790 votes."
    source_section: "§3.1"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-GJ-010"
    enonce: "En 2026, il ne reste aucune infrastructure pérenne du mouvement : zéro association, fondation, média, coopérative, parti, ou fonds documentaire."
    source_section: "§6.3"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-GJ-011"
    enonce: "44% des GJ ont voté Marine Le Pen, 28% Mélenchon, 5% Macron à la présidentielle 2022 (source BVA/Ouest-France)."
    source_section: "§6.2"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-GJ-012"
    enonce: "Le RIC (Référendum d'Initiative Citoyenne) a été proposé par 9 des 12 candidats présidentiels de 2022 — victoire idéologique la plus tangible du mouvement."
    source_section: "§6.2"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-GJ-013"
    enonce: "Le mouvement a coûté 0,1 point de PIB (France Info, 2019). L'absorption étatique (17 Md€) représente ~0,74% du PIB de 2018."
    source_section: "§4.4"
    head_status: 200
    tier: 2
    glyphe: "✧"

