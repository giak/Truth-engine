causalites:
  - cause: "F-SAT-001"
    effet: "F-SAT-008"
    mecanisme: "L'inflation normative crée une complexité qui exclut les populations à faible littératie numérique"
  - cause: "F-SAT-002"
    effet: "F-SAT-009"
    mecanisme: "Le précédent Poll Tax démontre que le refus fiscal massif + émeutes peut renverser un gouvernement, mais le cadre pénal français verrouille cette option via 450-1"

perspectives_dialectiques:
  - position: "Thèse — La saturation est une arme asymétrique viable"
    argument: "Face à un État qui a verrouillé toutes les autres voies (49.3, maintien de l'ordre offensif, criminalisation), la saturation administrative et le boycott économique sont les seules réponses disponibles qui restent dans le cadre légal."
  - position: "Antithèse — La saturation est une impasse tactique"
    argument: "Aucun précédent historique de saturation coordonnée à grande échelle n'existe. La tactique épuise sans renverser. L'État peut adapter le droit pénal (LOPMI, 450-1) pour criminaliser la saturation."
  - position: "Synthèse"
    argument: "La saturation est une tactique complémentaire, pas une stratégie autonome. Elle gagne du temps et crée un rapport de force, mais nécessite une théorie politique de sortie."

limites:
  - "Aucun précédent historique de saturation administrative coordonnée à l'échelle nationale"
  - "Fracture numérique exclut les classes populaires de la participation"
  - "Le droit pénal évolue rapidement et pourrait criminaliser la saturation"
  - "Les boycott coûtent cher aux ménages précaires"
  - "Pas de théorie de la victoire — la saturation paralyse mais ne renverse pas"

wolves:
  - nom: "Macron / Exécutif"
    argument: "La saturation est une entrave illégale au fonctionnement des services publics (433-1 CP). L'État a le droit et le devoir de protéger sa capacité à fonctionner."
    reponse: "La saturation utilise des actes conformes au droit. Criminaliser des actes légaux massifs est politiquement intenable."
  - nom: "DGSI / Renseignement"
    argument: "La coordination requise pour une saturation efficace est détectable via la surveillance algorithmique (Loi Renseignement 2015)."
    reponse: "La coordination acéphalique (modèle ZAD/Soulèvements) rend la décapitation impossible."

iceberg:
