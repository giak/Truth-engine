enquete_id: "saturation"
complexity: "SIMPLE"
date_extraction: "2026-06-13"
enquete_source: "investigations/2026-06-13_saturation_boycott/2026-06-13_23-30_saturation_boycott_armes_surface_INVESTIGATION.md"

these_centrale: "La saturation administrative et le boycott économique constituent une tactique de résistance asymétrique viable — utiliser massivement les règles du système contre lui-même jusqu'à paralysie — mais n'a jamais été testée à échelle nationale."

theses_implicites:
  - "L'inflation normative française (1700 décrets/an) crée une vulnérabilité structurelle par surcharge que l'administration ne peut pas absorber"
  - "La légalité de surface est le bouclier : l'État ne peut pas réprimer massivement des actes conformes au droit"
  - "Le cadre théorique d'Hirschman (Exit/Voice) combiné à Foucault (contre-conduite) fournit la légitimation académique de la saturation"

faits_atomiques:
  - id: "F-SAT-001"
    enonce: "La France produit environ 1700 décrets et 50 lois par an, créant une inflation normative que l'administration ne maîtrise plus."
    source_section: "§1"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-SAT-002"
    enonce: "La Poll Tax britannique (1990) a enregistré 17,4 millions de refus de paiement, 339 arrestations, 113 blessés, et a conduit à la chute de Thatcher en novembre 1990."
    source_url: "https://wikipedia.org"
    source_section: "§1, §7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-SAT-003"
    enonce: "Le boycott des instances de concertation par les syndicats français (CGT, FO, Solidaires, UNSA) est actif depuis 2019, documenté par UNSA et Le Monde en 2026."
    source_url: "https://lemonde.fr"
    source_section: "§1, §7"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-SAT-004"
    enonce: "La grève du zèle (work-to-rule) est documentée comme tactique de résistance administrative depuis les années 1970, cataloguée par Yale Journal of Regulation (2016)."
    source_url: "https://yalejreg.com"
    source_section: "§1"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-SAT-005"
    enonce: "Hirschman (1970) fournit le cadre théorique Exit/Voice/Loyalty : le boycott combine désertion (exit) et prise de parole (voice)."
    source_section: "§1, §8"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-SAT-006"
    enonce: "Le code pénal français (articles 433-1 à 433-26) criminalise l'entrave au fonctionnement des services publics."
    source_url: "https://legifrance.gouv.fr"
    source_section: "§6, §11"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-SAT-007"
    enonce: "Macron a dénoncé la 'culture de la norme' en septembre 2024 (Acteurs Publics)."
    source_url: "https://acteurspublics.fr"
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-SAT-008"
    enonce: "La fracture numérique en France touche 42,8 % de la population active et 9 % des ouvriers en illectronisme, rendant la saturation administrative inégale."
    source_section: "§13"
    head_status: 200
    tier: 2
    glyphe: "✧"
  - id: "F-SAT-009"
    enonce: "L'article 450-1 CP (association de malfaiteurs) pourrait être appliqué à une coordination de saturation."
    source_section: "§12"
    head_status: 200
    tier: 1
    glyphe: "✦"
  - id: "F-SAT-010"
    enonce: "La LOPMI (2023) et la Loi Renseignement (2015) ont élargi le périmètre de répression des actions collectives."
    source_section: "§7"
    head_status: 200
    tier: 1
    glyphe: "✦"

