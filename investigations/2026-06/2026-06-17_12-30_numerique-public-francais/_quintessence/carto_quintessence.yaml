causalites:
  - cause: "F-RES-045"
    effet: "F-RES-019"
    mecanisme: "La culture du pantouflage institutionnalisée chez les ingénieurs des mines (29% dans le privé) normalise le passage ANSSI → ESN. Poupard (X-Mines) suit la trajectoire majoritaire de son corps"
  - cause: "F-RES-046"
    effet: "F-RES-032, F-RES-033"
    mecanisme: "Le taux d'incompatibilité HATVP de 4,5% crée un quasi-automatisme d'autorisation, mais l'application est politisée (Philippe autorisé, O bloqué pour le même Atos), sans critère objectif transparent"
  - cause: "F-RES-044"
    effet: "F-RES-026"
    mecanisme: "Le lien Macron-Tadjeddine (Attali 2007) → Cazenave supervise McKinsey à la DITP → les marchés McKinsey explosent (+136% entre 2018-2021). La filiation politique structure la commande publique"

perspectives_dialectiques:
  - position: "Thèse officielle (Narrative d'État)"
    argument: "La mobilité public-privé est un enrichissement réciproque : l'expérience privée des hauts fonctionnaires améliore la transformation publique. La HATVP filtre efficacement les cas problématiques (4,5% d'incompatibilité). Les règles de déontologie sont respectées."
  - position: "Antithèse (Critique du pantouflage)"
    argument: "La porte tournante est un mécanisme de capture réglementaire : les régulateurs du numérique (ANSSI, DINUM) sont recrutés par les entreprises qu'ils régulaient, les marchés publics sont attribués aux anciens employeurs des directeurs. Le contrôle HATVP est un filtre de papier sans suivi des réserves."
  - position: "Synthèse (Analyse systémique)"
    argument: "Le pantouflage et le rétro-pantouflage sont deux faces du même mécanisme de circulation des élites. Le privé forme aux logiques commerciales que le public importe (Lambert/Saint-Gobain → DITP). La réforme de 2019 n'a pas résolu le problème car elle n'a pas créé de registre consolidé ni de suivi des réserves."

limites:
  - "Le périmètre se limite à 3 directions (DINUM, ANSSI, DITP) et ne couvre pas les ESN de taille moyenne ni les administrations déconcentrées"
  - "Les sources LinkedIn ne sont pas vérifiées par un tiers indépendant"
  - "Les données HATVP sont dépouillées au cas par cas, pas de base de données consolidée - risque d'omission"
  - "Le nombre de cas de pantouflage (34) est un minimum, la réalité est probablement plus étendue"

wolves:
  - nom: "Défenseur du statu quo"
    argument: "Le pantouflage est une pratique normale dans toutes les démocraties. La France a des règles parmi les plus strictes d'Europe avec la HATVP."
    reponse: "Le taux d'incompatibilité de 4,5% et l'absence de suivi des réserves (77% des avis) montrent que les règles ne sont pas appliquées en pratique. La HATVP est un guichet, pas un filtre."
  - nom: "Relativiste culturel"
    argument: "Les ingénieurs des mines ont toujours eu un lien fort avec l'industrie. Le taux de 29% est historique et ne pose pas de problème spécifique."
    reponse: "Ce taux devient problématique quand les mêmes corps dirigent les administrations qui régulent l'industrie du numérique et attribuent les marchés. Le conflit d'intérêts est structurel."

iceberg:
  - "Le système de contrôle HATVP est conçu pour produire de la conformité apparente, pas du contrôle réel - 74,3% d'avis favorables sans réserves"
  - "La fusion DINUM-DITP annoncée (Walter Arnaud, 2026) pourrait réduire encore le contrôle en concentrant les directions"
  - "Le corps des mines fonctionne comme un réseau d'entre-soi : la loyauté au corps prime sur la séparation public-privé"
  - "L'absence de registre consolidé rend impossible le contrôle citoyen automatisé"

