enquete_id: "carto"
complexity: "COMPLEX"
date_extraction: "2026-06-17"
enquete_source: "investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_18-30_cartographie-reseau-dinum-anssi-ditp-esn_INVESTIGATION.md"

these_centrale: "Les mobilités public-privé entre DINUM, ANSSI, DITP et les ESN (Capgemini, Atos, Sopra Steria, Accenture, McKinsey, Docaposte) forment un système de 'porte tournante' où 12 directeurs/anciens directeurs sur la période 2016-2026 ont transité entre régulation et prestation, avec un contrôle HATVP lacunaire (4,5% d'incompatibilité seulement, 0 suivi des réserves) et un rétro-pantouflage massif non documenté (3 directeurs DITP/DINUM sur 5 viennent du privé)."

theses_implicites:
  - "Le rétro-pantouflage (privé → public) est plus structurant que le pantouflage direct : il importe les logiques commerciales dans la définition des politiques publiques numériques"
  - "La HATVP est un filtre administratif inopérant : 74,3% d'avis favorables sans réserves, 4,5% d'incompatibilité, et aucun suivi des réserves émises dans 77% des cas"
  - "Le double standard Atos (Édouard Philippe autorisé en 2020, Cédric O bloqué en 2022) révèle un traitement politique des avis de compatibilité, non technique"
  - "Le corps des ingénieurs des mines (29% dans le privé) est le vecteur principal de circulation DINUM/ANSSI ↔ ESN"

