enquete_source: "investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_18-45_cout-dependance-esn-externalisation-vs-regie_INVESTIGATION.md"

these_centrale: "L'externalisation informatique de l'État français vers les ESN génère un surcoût structurel de 300 à 450 M€/an par rapport au développement en régie, sans compter 1-1,5 Md€/an de dette technique aggravée par l'externalisation, et un coût d'opportunité cumulé de 1,5-2,2 Md€ sur 5 ans. Les pays les plus avancés numériquement (Estonie, Danemark, Royaume-Uni) réduisent leur dépendance aux ESN et développent des capacités internes."

theses_implicites:
  - "Le surcoût ESN vs régie (+85 à +100%) n'est pas compensé par un gain de productivité : le turn-over ESN (18-24 mois) et la perte de connaissance réduisent la qualité"
  - "La dette technique (1-1,5 Md€/an) est structurellement aggravée par l'externalisation : les ESN facturent la maintenance au TJM sans incitation à réduire la dette"
  - "Le modèle de marge ESN (13,3% opérationnelle Capgemini, 28-40% brute) transfère 100-110 M€/an de bénéfices aux actionnaires des ESN - une sortie de capitaux du périmètre public"
  - "L'absence de comptabilité analytique fiable empêche tout pilotage rationalisé du budget IT de l'État"

