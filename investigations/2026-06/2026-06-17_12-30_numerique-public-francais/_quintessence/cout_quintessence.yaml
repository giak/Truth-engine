causalites:
  - cause: "F-COUT-002"
    effet: "F-COUT-012"
    mecanisme: "Le volume de 670 M€/an de prestations externalisées, combiné au différentiel TJM (+85 à +100% vs régie), génère mécaniquement le surcoût annuel de 300-400 M€"
  - cause: "F-COUT-003"
    effet: "F-COUT-006"
    mecanisme: "La concentration des contrats sur Capgemini (52% du marché) crée une dépendance qui réduit la capacité de l'État à négocier et à contrôler, permettant des dérives comme GMBI (70% externalisé)"
  - cause: "F-COUT-009"
    effet: "F-COUT-012"
    mecanisme: "Le TJM élevé des consultants (600-750 €/j) vs le coût agent public (318-509 €/j) est le mécanisme direct du surcoût : l'État paie 85-100% de plus pour la même compétence"

perspectives_dialectiques:
  - position: "Thèse officielle (Narrative Bercy/ESN)"
    argument: "L'externalisation apporte flexibilité et compétences pointues que l'État ne peut pas recruter en interne. Le surcoût est compensé par la qualité et la disponibilité des ressources. Les ESN innovent plus vite que l'administration."
  - position: "Antithèse (Régie souveraine)"
    argument: "L'externalisation est un transfert massif de capitaux publics vers le privé sans retour mesurable. Le surcoût de 300-450 M€/an est un impôt invisible payé par les citoyens aux actionnaires des ESN. La régie produit des résultats supérieurs (FranceConnect, data.gouv.fr)."
  - position: "Synthèse (Hybridation ciblée)"
    argument: "L'externalisation a un sens pour les pics de charge et les compétences rares, mais le volume actuel (670 M€/an) est excessif. Un rééquilibrage à 30-40% d'externalisation ciblée vs 60-70% de régie permettrait d'économiser 200-300 M€/an."

limites:
  - "Pas de comptabilité analytique fiable : l'État ne publie pas la ventilation exacte du budget IT par nature - le vrai montant externalisé est probablement >1 Md€"
  - "Ratio de charge agent public (1,55x) est une approximation. Certains retraitements (locaux, formation) porteraient le ratio à 1,8-2,0x"
  - "Données Cour des comptes non actualisées depuis 2023 pour le périmètre prestations intellectuelles"
  - "Comparaison de TJM ne tient pas compte de la productivité différentielle agent vs consultant"

wolves:
  - nom: "Lobby ESN"
    argument: "Les ESN apportent des compétences que l'État ne trouve pas. Sans elles, les projets s'arrêteraient. Le coût est le prix de la compétence."
    reponse: "Le référentiel DINUM 2024 montre que l'État peut recruter des profils équivalents à 45-72 k€/an. Le problème n'est pas la disponibilité mais la volonté politique de recruter et de former."
  - nom: "Technocrate du chiffre"
    argument: "Le surcoût de 300-450 M€/an n'est pas démontré : les comparaisons TJM ignorent les coûts indirects de la régie (locaux, formation, management)."
    reponse: "Même avec un ratio de charge à 2,0x (maximum), l'écart reste de +60-75% entre ESN et régie. Le surcoût est structurel, pas méthodologique."

iceberg:
  - "La dette technique (1-1,5 Md€/an) est le vrai coût caché : l'externalisation l'aggrave car les ESN n'ont pas d'incitation à la réduire"
  - "Le coût d'opportunité cumulé 2021-2026 (1,5-2,2 Md€) représente 3-4 ans de budget DINUM"
  - "Les 4-5 Md€/an de budget IT ne sont pas consolidés dans un budget unique - chaque ministère achète ses propres prestations sans vision d'ensemble"

