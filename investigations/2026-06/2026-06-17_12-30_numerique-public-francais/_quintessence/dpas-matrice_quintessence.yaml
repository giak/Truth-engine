causalites:
  - cause: "F-DPA-010"
    effet: "F-DPA-005"
    mecanisme: "Le sous-financement déclaré par 80% des DPAs est corrélé à l'absence de mécanisme obligatoire de dotation - la Grèce en est la preuve extrême avec -15% de budget"
  - cause: "F-DPA-001"
    effet: "F-DPA-007"
    mecanisme: "Le modèle budget général pur (22/27 DPAs) prive les autorités des fruits de leur activité répressive - l'Irlande est le cas limite avec 0,5% de recouvrement et refus explicite d'hypothecation"
  - cause: "F-DPA-002"
    effet: "F-DPA-011"
    mecanisme: "La rétention totale espagnole (100% amendes à l'AEPD) crée un conflit d'intérêts structurel: incitation budgétaire à maximiser les sanctions, confirmé par les critiques du Tribunal de Cuentas"
  - cause: "F-DPA-009"
    effet: "F-DPA-010"
    mecanisme: "Le fee model ICO (redevances obligatoires assujettis) est le seul modèle garantissant une dotation déconnectée du bon vouloir budgétaire de l'État - mais il est politiquement contesté"

perspectives_dialectiques:
  - position: "Thèse officielle (Commission européenne)"
    argument: "Le RGPD a créé un cadre harmonisé de protection des données. Les DPAs sont dotées par les États membres conformément à l'article 52.4. Le système fonctionne: 6,4 Md€ d'amendes émises depuis 2018, des sanctions records contre Big Tech."
  - position: "Antithèse (Critique structurelle)"
    argument: "Le système est un jeu à somme nulle: les DPAs sanctionnent pour l'affichage, les amendes records sont largement virtuelles (0,5% recouvrement Irlande), les DPAs sont structurellement sous-financées (80% auto-déclaration), et les nouvelles missions (AI Act, DGA, NIS2) ne sont pas accompagnées de financement obligatoire."
  - position: "Synthèse (Architecture d'illusion)"
    argument: "Le sous-financement n'est pas un accident mais une caractéristique du système: les États maintiennent leurs DPAs juste assez dotées pour traiter les plaintes visibles, pas assez pour mener des enquêtes proactives. Les 3 modèles alternatifs (ES rétention 100%, IT 50%, PT 40%) montrent que d'autres architectures sont possibles mais chacune a ses propres conflits d'intérêts."

limites:
  - "Données budgétaires 2024 pour la majorité des DPAs : 2025-2026 peuvent avoir modifié les équilibres"
  - "Absence de données de recouvrement publiées par quasi-totalité des DPAs : le taux 0,5% irlandais est une estimation externe, pas une donnée officielle"
  - "Comparaison budgétaire biaisée par les rôles LSA : Luxembourg et Irlande ont des budgets élevés parce qu'ils sont LSA Big Tech, pas parce que leur modèle est supérieur"
  - "Les budgets incluent des périmètres différents (certains DPAs couvrent aussi accès à l'information, AI Act, etc.)"

wolves:
  - nom: "Relativiste budgétaire"
    argument: "Le budget n'est pas corrélé à l'efficacité d'une DPA. L'Italie a 47,7 M€ de budget et 94 M€ d'excédent non dépensé - preuve que l'argent ne fait pas tout."
    reponse: "L'excédent italien est un artefact comptable (trésorerie accumulée, pas un budget non utilisé). La corrélation budget/Efficacité est faible pour les DPAs LSA, mais le sous-financement flagrant (< 2 M€) des DPAs d'Europe de l'Est interdit toute action répressive crédible."
  - nom: "Optimiste régulatoire"
    argument: "6,4 Md€ d'amendes émises depuis 2018 prouvent que le système fonctionne. Les Big Tech sont sanctionnées (Meta 1,2 Md€, Amazon 746 M€)."
    reponse: "Le montant des amendes émises est un indicateur trompeur quand le taux de recouvrement est inconnu ou infime. Les sanctions records sont largement contestées en justice et rarement payées intégralement."

iceberg:
  - "Les DPAs comme variable d'ajustement budgétaire : les coupes budgétaires autrichienne et grecque montrent que les DPAs sont traitées comme des administrations ordinaires, pas comme des autorités constitutionnelles"
  - "La non-application de l'article 52.4 GDPR par la Commission européenne : aucune procédure d'infraction engagée pour sous-financement d'une DPA"
  - "Le design institutionnel orienté vers le conseil et la soft law plutôt que l'enforcement répressif : CNIL 82% masse salariale, majorité des effectifs en conseil/pédagogie"
  - "Les nouvelles missions (AI Act, DGA, Data Act, DSA, NIS2) sans mécanisme de financement obligatoire"

