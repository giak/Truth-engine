enquete_id: "dpas-matrice"
complexity: "COMPLEX"
date_extraction: "2026-06-17"
enquete_source: "investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_16-00_dpas-europeennes_modeles_financement_HYPER_MATRICE.md"

these_centrale: "Seulement 4 DPAs sur 27 dans l'UE ne reversent pas l'intégralité des amendes RGPD au Trésor public. Le modèle dominant (budget général + amendes au Trésor) prive structurellement les autorités de contrôle des ressources issues de leur propre activité répressive, créant un sous-financement systémique que la Commission européenne tolère malgré l'article 52.4 GDPR."

theses_implicites:
  - "Le taux de recouvrement des amendes est systématiquement non publié, produisant un angle mort qui permet aux DPAs de gonfler leurs statistiques d'amendes 'émises' sans rendre compte de l'argent collecté"
  - "Le sous-financement des DPAs d'Europe centrale et orientale (< 2 M€ pour des populations de plusieurs millions) est un angle mort des rapports officiels, noyé dans les moyennes européennes"
  - "La rétention des amendes (Espagne 100%, Italie 50%, Portugal 40%) peut créer un conflit d'intérêts inverse : incitation à maximiser les sanctions pour des raisons budgétaires"

