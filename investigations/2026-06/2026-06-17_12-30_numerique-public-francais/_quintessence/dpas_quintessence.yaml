enquete_id: "dpas"
complexity: "APEX"
date_extraction: "2026-06-17"
enquete_source: "investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_16-30_dpas-europeennes_modeles_financement_INVESTIGATION.md"

these_centrale: "Le modèle de financement majoritaire des DPAs (budget général, amendes au Trésor) crée une incitation perverse à sous-financer sa propre autorité de contrôle : chaque euro supplémentaire est un coût budgétaire, chaque amende collectée est une recette générale sans lien avec la protection des données. Cette architecture maintient les DPAs dans un état de faiblesse permanente qui rend impossible la supervision effective des 4-5 Md€/an du SI public."

theses_implicites:
  - "Les DPAs les plus exposées (LSA: Irlande, Luxembourg, France) agissent comme sous-traitantes régulatoires des Big Tech : elles engagent des procédures, émettent des amendes records, mais n'ont ni les moyens de les collecter ni la capacité de suivre des centaines d'affaires complexes simultanément"
  - "L'absence de publication systématique des taux de recouvrement des amendes par toutes les DPAs est un angle mort qui sert les deux récits - les autorités peuvent gonfler leurs statistiques sans rendre compte de l'argent effectivement collecté"
  - "Le cas irlandais (4,04 Md€ amendes émises, ~0,5% recouvrées) est la preuve ultime de la thèse de la circulaire comptable : le montant des amendes sert de signal politique et médiatique, mais le flux financier réel est dérisoire"

