causalites:
  - cause: "F-DPA-102"
    effet: "F-DPA-113"
    mecanisme: "Le modèle budget général pur (22/27 DPAs) crée une relation de dépendance budgétaire qui rend les DPAs vulnérables aux coupes - la Commission tolère cette violation structurelle de l'article 52.4"
  - cause: "F-DPA-113"
    effet: "F-DPA-104"
    mecanisme: "L'absence de sanction de la Commission pour non-respect de l'art. 52.4 permet aux États comme l'Autriche de réduire délibérément le budget de leur DPA sans conséquence"
  - cause: "F-DPA-102"
    effet: "F-DPA-109"
    mecanisme: "Le modèle de financement par dotation budgétaire discrétionnaire pénalise structurellement les petits États, où la DPA est une variable d'ajustement budgétaire plutôt qu'une priorité politique"
  - cause: "F-DPA-113"
    effet: "sous-financement généralisé"
    mecanisme: "La règle (art. 52.4) existe mais est inapplicable sans procédure d'infraction. Les États le savent et sous-dotent leurs DPAs sans risque juridique"

perspectives_dialectiques:
  - position: "Thèse officielle (États membres)"
    argument: "Le financement des DPAs relève de la souveraineté budgétaire nationale. L'article 52.4 est une disposition-cadre, pas un droit à un budget déterminé. Les moyens augmentent globalement (+40% médiane 2020-2024)."
  - position: "Antithèse (Critique structurelle)"
    argument: "L'architecture de financement est conçue pour maintenir les DPAs incapables d'enforcement réel. L'article 52.4 est sciemment non appliqué par la Commission. Les DPAs sont des 'structures de régulation molle' qui donnent l'illusion d'un contrôle sans en avoir les moyens."
  - position: "Synthèse (Architecture d'illusion confirmée)"
    argument: "Le sous-financement n'est ni un accident ni un complot, mais une propriété émergente d'un système où les incitations budgétaires (États) et régulatoires (Commission) sont alignées contre des DPAs fortes. Les 3 exceptions (ES rétention, IT partage, UK fee model) montrent que d'autres modèles existent, mais chacun introduit ses propres distorsions."

limites:
  - "Taux de recouvrement des amendes non publié par la quasi-totalité des DPAs - le taux irlandais de 0,5% est une estimation externe, pas une donnée officielle vérifiée"
  - "Données budgétaires hétérogènes : certains DPAs incluent les missions connexes (accès à l'information, AI Act), d'autres non"
  - "Focus sur le budget comme indicateur unique d'efficacité - ne mesure pas la qualité des décisions, les précédents juridiques créés"
  - "Comparaison France-Luxembourg biaisée par le statut LSA : le ratio 13x s'explique en partie par les missions Big Tech"

wolves:
  - nom: "L'optimiste incrémental"
    argument: "Les budgets des DPAs augmentent globalement (+40% médiane 2020-2024). C'est une tendance positive. Les cas extrêmes (Grèce, Autriche) sont des exceptions."
    reponse: "La hausse médiane de 40% part de bases extrêmement basses (< 2 M€ pour 7 DPAs). La Grèce et l'Autriche ne sont pas des exceptions mais des révélateurs de la fragilité du modèle: si un État peut réduire sa DPA de 15% sans conséquence, aucun DPA n'est à l'abri."
  - nom: "Le technocrate régulatoire"
    argument: "L'indépendance d'une DPA ne dépend pas de son mode de financement mais de son statut juridique et de la culture institutionnelle du pays."
    reponse: "L'indépendance formelle (statut juridique) sans indépendance budgétaire (ressources prévisibles) est une coquille vide. La DSB autrichienne est indépendante en droit et en Notbetrieb en pratique."

iceberg:
  - "Les DPAs comme sous-traitantes régulatoires des Big Tech : elles engagent des procédures qu'elles ne peuvent pas mener à terme faute de ressources, produisant des contentiels qui durent des années (Amazon 746 M€ bloqué depuis 2021)"
  - "La thésaurisation italienne (94 M€ d'excédent) comme signal que même les DPAs 'riches' ne dépensent pas pour l'enforcement réel"
  - "Le design institutionnel des DPAs orienté vers le conseil et la pédagogie, pas l'enforcement répressif: 82% du budget CNIL en masse salariale"
  - "Résultat Mnemolite: search 'DPA financement amendes recouvrement' → 3 mémoires dont investigation Cartographie 27 DPAs et LOLF fléchage"

