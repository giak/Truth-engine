    enonce: "Modèle italien: 50% amendes à la DPA (Garante), fléché vers 3 activités. 94 M€ excédent accumulé. 100 000+ signalements/an"
    source_url: "https://rm.coe.int/t-pd52021-2-etude-en/1680a291e1"
