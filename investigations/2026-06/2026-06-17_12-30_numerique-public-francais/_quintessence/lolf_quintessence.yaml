justification: "L'argument LOLF est un paravent politique commode : il permet de justifier le statu quo sans débat sur le fond. Le Trésor préserve une recette (486,8 M€ en 2025), le gouvernement évite de renforcer une autorité de contrôle qui le gêne, et les opposants au fléchage n'ont pas à défendre leur position sur le fond. La faible mobilisation sur le sujet (proposition sénatoriale rejetée sans débat en 2018) confirme que le statu quo arrange la plupart des acteurs."

