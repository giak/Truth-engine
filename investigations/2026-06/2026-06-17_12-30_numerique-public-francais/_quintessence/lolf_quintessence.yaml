# QUINTESSENCE - LOLF et Fléchage des Amendes CNIL : Argument Politique, Pas Juridique
# Date extraction : 2026-06-17
# Source : investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_18-15_lolf-flecheage-amendes-cnil-argument-politique_INVESTIGATION.md

complexity: "SIMPLE"

these_centrale:
  "L'argument selon lequel la LOLF (principe d'universalité budgétaire, article 6) interdit le fléchage des amendes CNIL vers un budget spécifique est un choix politique, pas une contrainte juridique. La LOLF prévoit elle-même des exceptions (CAS article 21, fonds de concours articles 17 et 19) qui permettraient le fléchage immédiat sans modifier la loi. Plusieurs AAI françaises (ARCOM, AMF, Médiateur énergie) ont déjà des recettes affectées. L'Espagne, de tradition juridique similaire, flèche 100 % des amendes à son AEPD depuis 1993."

theses_implicites:
  - "Le refus de flécher les amendes CNIL est un choix budgétaire (le Trésor ne veut pas perdre une recette) et politique (l'État ne veut pas renforcer les autorités de contrôle), présenté comme une nécessité juridique pour éviter le débat."
  - "La circulaire comptable invoquée par la DGFiP est une circulaire ministérielle, pas une loi - une instruction pourrait y déroger."
  - "Les exemples étrangers (Espagne 100 %, Portugal 40 %, Italie 50 %, Royaume-Uni flat fee) démontrent une variété de modèles possibles, aucun n'étant juridiquement impossible en France."

faits_atomiques:
  - id: "F-LOLF-001"
    enonce: "La LOLF prévoit des exceptions au principe d'universalité : les comptes d'affectation spéciale (CAS, article 21) et les fonds de concours (articles 17 et 19). Un CAS « Modernisation numérique de l'État » ou « Indépendance des AAI » alimenté par les amendes CNIL est juridiquement possible sans modifier la LOLF."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

  - id: "F-LOLF-002"
    enonce: "L'Espagne flèche 100 % des amendes de son AEPD (équivalent CNIL) depuis 1993. Le Tribunal de Cuentas recommande l'abolition depuis 2017, systématiquement ignoré par le Parlement. Budget AEPD : 8 M€ (2015) → 32 M€ (2025). Preuve qu'un fléchage total est compatible avec un système de droit napoléonien."
    source_url: "https://www.aepd.es/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

  - id: "F-LOLF-003"
    enonce: "Plusieurs AAI françaises ont déjà des recettes affectées : ARCOM (taxe sur services de télévision via CAS), AMF (taxe sur transactions financières), Médiateur national de l'énergie (contribution fournisseurs). Aucun changement législatif majeur requis pour étendre ce mécanisme aux amendes CNIL."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

