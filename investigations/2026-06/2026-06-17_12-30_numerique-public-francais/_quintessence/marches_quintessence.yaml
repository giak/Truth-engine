enquete_id: "marches"
complexity: "COMPLEX"
date_extraction: "2026-06-17"
enquete_source: "investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_18-45_marches-publics-esn-etat-francais_INVESTIGATION.md"

these_centrale: "L'État français a confié au moins 3,2 milliards d'euros de marchés publics aux cinq principales ESN (Capgemini, Sopra Steria, Atos, Accenture, McKinsey) entre 2017 et 2025, avec une concentration extrême : Capgemini capte 52% du marché (~1,7 Md€), 20 cabinets concentrent 55% du conseil aux ministères, et les marchés sans mise en concurrence sont récurrents (Cassiopée : une seule offre pour 60 M€). Aucun recours n'a été engagé après des échecs documentés (paie Éducation 263 M€ engloutis, Scribe 11,7 M€ abandonné)."

theses_implicites:
  - "La concentration des marchés sur Capgemini (52%) crée une dépendance technologique qui verrouille les SI critiques (Chorus, Cassiopée, SCORPION) et rend toute alternance impossible"
  - "L'absence de recours après échecs majeurs (paie Éducation, Scribe) crée une immunité de facto des ESN - l'État supporte seul le risque"
  - "Les accords-cadres UGAP/DITP permettent de contourner la mise en concurrence, vidant de leur substance les règles de la commande publique"
  - "McKinsey n'a payé 0€ d'IS en France entre 2011 et 2020 tout en percevant 72,8 M€ de contrats publics - le contribuable subventionne l'optimisation fiscale"

