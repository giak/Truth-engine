acteurs:
  - nom: "Capgemini"
    role: "Premier prestataire IT de l'État (52% du marché, ~1,7 Md€). Échecs documentés (paie Éducation 263 M€, Scribe 11,7 M€) sans recours"
    faits_lies: ["F-MPC-001", "F-MPC-006", "F-MPC-013"]
  - nom: "Atos"
    role: "ESN historique Défense (SCORPION, DIRISI, supercalculateurs). En crise financière (dette ~5 Md€). Nationalisé Advanced Computing 410 M€"
    faits_lies: ["F-MPC-010"]
  - nom: "Sopra Steria"
    role: "Partenaire historique des SI financiers (Chorus) et radars (71,6 M€). 51 000 employés"
    faits_lies: ["F-MPC-008"]
  - nom: "McKinsey"
    role: "Influence stratégique > volume financier. 0€ IS France 2011-2020. 72,8 M€ contrats État 2017-2022"
    faits_lies: ["F-MPC-005"]
  - nom: "Accenture"
    role: "Second en volume (~350 M€). Central sur SI santé (pass sanitaire, ANS interopérabilité)"
    faits_lies: ["F-MPC-009"]

causalites:
  - cause: "F-MPC-006"
    effet: "F-MPC-012"
    mecanisme: "L'absence de recours après l'échec de la paie Éducation (263 M€) crée un précédent d'impunité qui permet de ne pas poursuivre pour Scribe (11,7 M€). Les clauses contractuelles floues et les 'torts partagés' sont invoqués systématiquement"
  - cause: "F-MPC-004"
    effet: "F-MPC-001"
    mecanisme: "L'absence de concurrence sur Cassiopée (une seule offre) illustre le verrouillage des SI critiques par Capgemini, permettant une augmentation continue des volumes de contrats sans pression concurrentielle"
  - cause: "F-MPC-005"
    effet: "F-MPC-003"
    mecanisme: "L'optimisation fiscale de McKinsey (0€ IS) lui permet de proposer des prix sous-évalués par rapport aux concurrents qui paient l'IS, créant un avantage déloyal qui contribue à l'explosion des dépenses conseil (+136%)"

perspectives_dialectiques:
  - position: "Thèse officielle (Bercy/ESN)"
    argument: "Les marchés sont attribués selon le code de la commande publique, avec mise en concurrence et respect des règles. Les échecs sont l'exception. Les ESN apportent des compétences que l'État ne peut pas internaliser."
  - position: "Antithèse (Critique de la captation)"
    argument: "Le système est verrouillé par un oligopole : Capgemini (52%), contrats sans concurrence, absence de recours après échecs, optimisation fiscale. L'État est captif de ses prestataires."
  - position: "Synthèse (Dépendance pathologique)"
    argument: "La concentration n'est pas le résultat d'un complot mais d'un cercle vicieux : l'externalisation massive vide l'État de ses compétences internes, le rendant plus dépendant des ESN, qui peuvent donc augmenter leurs prix et réduire leur qualité sans crainte de sanctions."

limites:
  - "Les montants DECP sont des maximums prévisionnels, pas toujours les dépenses réelles"
  - "Les marchés de défense sont partiellement occultés - sous-estimation probable"
  - "Les accords-cadres UGAP/DITP rendent difficile le traçage des dépenses réelles par ESN"
  - "Sous-traitance en cascade (15-30% des missions UGAP) non documentée"

wolves:
  - nom: "Défenseur des ESN"
    argument: "Les échecs de projets IT sont normaux dans le numérique mondial. 263 M€ de perte sur 1,7 Md€ de contrats, c'est 15% - dans la moyenne du secteur privé."
    reponse: "L'absence d'action en justice et la réattribution immédiate de nouveaux contrats (RRF 540 M€ après l'échec Scribe) montrent que l'État ne traite pas ses prestataires comme le ferait un client privé."
  - nom: "Relativiste procédural"
    argument: "Les marchés sans concurrence sont légaux dans le code de la commande publique (urgence, exclusivité technique). Cassiopée est un cas isolé."
    reponse: "Ce n'est pas un cas isolé : Chorus (verrouillage technologique), SCORPION (verrouillage défense), McKinsey COVID (urgence sanitaire) sont des patterns récurrents. L'exception tend à devenir la règle."

iceberg:
  - "L'absence de recours après échecs (paie Éducation, Scribe) cache probablement des clauses contractuelles qui protègent les ESN - négociées par des cadres qui rejoindront ensuite ces mêmes ESN"
  - "La sous-traitance en cascade (15-30% UGAP vers PME) n'apparaît pas dans les données publiques - les PME sont invisibles dans la commande publique"
  - "La nationalisation Advanced Computing (Atos/Bull) pour 410 M€ est une socialisation des pertes après privatisation des profits"

