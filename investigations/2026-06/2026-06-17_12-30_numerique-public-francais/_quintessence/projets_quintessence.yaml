shadow_factor: 9
justification: "Système verrouillé où personne n'a intérêt à la transparence. Les ministères déclarent leurs propres données sans vérification, la DINUM publie sans pouvoir sanctionner, les prestataires empochent les dépassements sans conséquence, et les responsables d'échecs ne sont jamais inquiétés. L'absence totale de sanction et de mesure d'impact crée un équilibre stable où l'échec est structurellement absorbé."

