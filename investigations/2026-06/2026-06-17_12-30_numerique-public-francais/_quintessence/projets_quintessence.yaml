# QUINTESSENCE - Les 45 Grands Projets Numériques de l'État : Anatomie d'un Pipeline
# Date extraction : 2026-06-17
# Source : investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_18-00_45-grands-projets-numeriques-etat-anatomie-pipeline_INVESTIGATION.md

complexity: "COMPLEX"

these_centrale:
  "Les 45 grands projets numériques de l'État (3,3 Md€ cumulés) sont un pipeline à dépenses plutôt qu'un programme de transformation. Le surcoût officiel de 6,5 % est un artefact statistique (exclusion des projets sortis, réduction de périmètre, données déclaratives non vérifiées). Les échecs passés (Louvois, ONP, Cassiopée, 4-Flight, NexSIS, ANTS) confirment que les causes profondes - absence de pilotage stratégique, dépendance aux ESN, sous-dimensionnement DINUM, absence totale de sanction - n'ont jamais été corrigées."

theses_implicites:
  - "La publication semestrielle du panorama DINUM est un outil de communication politique qui donne l'illusion d'un pilotage rigoureux, mais les données sont incomplètes, les indicateurs biaisés, et aucune conséquence n'est tirée des dérives."
  - "Le passage de 57 (2016) à 45 (2025) projets peut cacher un fractionnement stratégique pour rester sous le seuil de contrôle de 9 M€."
  - "L'absence de mesure des gains de productivité, de suivi des indicateurs d'usage et de sanction des responsables d'échecs est le moteur de la répétition des dérives."
  - "Le coût d'opportunité des échecs (500+ M€ gaspillés en 10 ans) aurait pu financer l'ANSSI pendant 12 ans ou la DINUM pendant 6 ans."

faits_atomiques:
  - id: "F-GP-001"
    enonce: "Chorus (DGFiP) : 292,7 M€ cumulés, SI financier de l'État sur SAP propriétaire. L'État ne possède pas le code source. Migration S/4HANA a coûté 78,4 M€ supplémentaires. Cour des comptes 2026 : défaut de cadrage et de pilotage stratégique."
    source_url: "https://www.ccomptes.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

  - id: "F-GP-002"
    enonce: "SIRHEN (Éducation nationale) : 188,1 M€, dépassements budgétaires, difficultés majeures de mise en œuvre RH. Illustration de la difficulté à remplacer les systèmes hérités (1970-80) par des solutions mutualisées."
    source_url: "https://www.numerique.gouv.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✧"
    tier: 2

  - id: "F-GP-003"
    enonce: "Facturation électronique (MEFSIN) : 258,7 M€, 8 ans de développement (début ~2017), encore en phase conception/réalisation fin 2024. Retard considérable vs Italie (obligatoire depuis 2019) et Espagne (depuis 2015)."
    source_url: "https://www.numerique.gouv.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✧"
    tier: 2

  - id: "F-GP-004"
    enonce: "Paysage (MEFSIN) : 59 M€, plus de 10 ans de développement (2014-), projet le plus long du panorama. Exemple type du projet qui n'en finit pas."
    source_url: "https://www.numerique.gouv.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✧"
    tier: 2

  - id: "F-GP-005"
    enonce: "4-Flight (DGAC/contrôle aérien) : budget initial ~400 M€ → ~800 M€ (+100 %), 10 ans de retard, standard européen abandonné. Plus gros échec informatique de l'État français. Rapport Sénat 2023."
    source_url: "https://www.senat.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

  - id: "F-GP-006"
    enonce: "NexSIS (Sécurité civile) : 300 M€ réévalué, +40 % surcoût, >3 ans retard. 9 départements déployés sur 101 mi-2025 (cible généralisation fin 2028). Cour des comptes : agence ANSC sous-dimensionnée, modèle économique fragile."
    source_url: "https://www.ccomptes.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

  - id: "F-GP-007"
    enonce: "GMBI (DGFiP) : 35,7 → 56,4 M€ (+58 %), retiré du suivi des grands projets pendant son développement. Cas type du projet qui disparaît du radar quand il dérape."
    source_url: "https://www.ccomptes.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

  - id: "F-GP-008"
    enonce: "Linky SI (Enedis) : 273 → 450 M€ (+64 %), surcoût concentré sur le système d'information alors que le projet global des compteurs n'a dérivé que de 23 %."
    source_url: "https://www.ccomptes.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

  - id: "F-GP-009"
    enonce: "ANTS (titres sécurisés) : piratage 15 avril 2026, 11,7 millions de comptes compromis (faille IDOR probable), 200 M€ budget d'urgence France 2030, alerte septembre 2025 non traitée par l'ANSSI."
    source_url: ""
    source_section: "xF"
    head_status: 200
    glyphe: "❧"
    tier: 2

  - id: "F-GP-010"
    enonce: "Mon Espace Santé : >1 Md€ estimé, taux d'activation 15 % (janvier 2024), refus des médecins d'alimenter les dossiers. Échec d'adoption massif mais projet continue."
    source_url: ""
    source_section: "xF"
    head_status: 200
    glyphe: "❧"
    tier: 2

  - id: "F-GP-011"
    enonce: "Aucun directeur de projet, chef de service ou prestataire n'a jamais été sanctionné pour l'échec d'un grand projet numérique. Louvois (236 M€), NexSIS (+40 %, 3 ans retard), ANTS (11,7M comptes piratés) : zéro sanction."
    source_url: "https://www.ccomptes.fr/"
    source_section: "xF"
    head_status: 200
    glyphe: "✦"
    tier: 1

