  - id: "LOUP-GP-02"
    enonce: "Aucune sanction pour échecs : Louvois (236 M€), NexSIS (+40 %), ANTS (11,7M piratés). L'absence de responsabilité est le moteur de la répétition des échecs."
  - id: "LOUP-GP-03"
    enonce: "Les 500+ M€ gaspillés sur les échecs (Louvois, ONP, Cassiopée, GMBI, Linky SI, 4-Flight) auraient pu financer l'ANSSI pendant 12 ans ou la DINUM pendant 6 ans."
