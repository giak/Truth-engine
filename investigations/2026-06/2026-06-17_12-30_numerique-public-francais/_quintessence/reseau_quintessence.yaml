shadow_factor: 8
justification: "Système de captation réciproque où tous les acteurs ont intérêt à l'opacité. L'absence de sanction, l'opacité des données HATVP, et la normalisation du pantouflage dans les grands corps créent un équilibre stable où la transparence n'a aucun défenseur institutionnel. La HATVP elle-même n'a pas intérêt à révéler l'ampleur réelle du phénomène."

