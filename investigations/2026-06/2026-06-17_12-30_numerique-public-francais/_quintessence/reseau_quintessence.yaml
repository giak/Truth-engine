perspectives_dialectiques:
  - these: "Le pantouflage est un phénomène marginal, quelques cas individuels sans impact systémique"
    antithese: "29 % des ingénieurs des mines passent par le privé - c'est un phénomène de masse, pas marginal"
    synthese: "Le pantouflage est structurel mais invisible car dilué dans la normalité des parcours de l'élite administrative"
  - these: "La HATVP contrôle efficacement les mobilités public-privé"
    antithese: "74,3 % d'avis avec réserves sans force contraignante, poursuites quasi nulles"
    synthese: "La HATVP est un organe d'enregistrement qui donne l'illusion du contrôle sans en avoir les moyens"

limites:
  - "Données HATVP non structurées par secteur/entreprise/type de contrat - impossible de quantifier précisément le pantouflage par ESN."
  - "L'investigation ne couvre pas les mobilités privé→public (rétro-pantouflage) faute de données."
  - "Les trajectoires post-DINUM des directeurs sont incomplètes - plusieurs destinations restent inconnues."
  - "Absence de données sur les liens personnels aux niveaux intermédiaires (chefs de projet, directeurs adjoints) - seuls les cas les plus visibles sont documentés."

wolves:
  - id: "LOUP-RES-01"
    enonce: "Cédric O a été bloqué non pas parce que le système fonctionne, mais parce que le cas était trop visible. Les mobilités moins exposées passent sans contrôle."
  - id: "LOUP-RES-02"
    enonce: "Guillaume Poupard supervisait les audits ANSSI et la qualification SecNumCloud pendant 8 ans. Son expertise directe est désormais au service de Docaposte, concurrent des fournisseurs cloud qu'il évaluait."
  - id: "LOUP-RES-03"
    enonce: "La commission d'enquête sénatoriale cabinets conseil (mars 2022) a été créée sous pression médiatique mais n'a débouché sur aucune sanction, interdiction ou réforme structurelle."
  - id: "LOUP-RES-04"
    enonce: "Le dispositif HATVP fonctionne comme un système d'enregistrement, pas de dissuasion. 77 % de réserves = la HATVP sait qu'il y a risque mais ne peut pas l'empêcher."
  - id: "LOUP-RES-05"
    enonce: "La DINUM a eu 5 directeurs depuis 2018. Aucun n'avait d'expérience DSI de grand groupe. La fonction de DSI de l'État confiée à des généralistes."
  - id: "LOUP-RES-06"
    enonce: "Les 3 ans de cooling-off sont inefficaces : 74,3 % avis compatibles avec réserves contournables, aucune sanction réelle, Conseil constitutionnel a affaibli le dispositif en janvier 2025."
  - id: "LOUP-RES-07"
    enonce: "Absence de données structurées sur les passages fonctionnaires→ESN. L'opacité protège le système."
  - id: "LOUP-RES-08"
    enonce: "Le rétro-pantouflage (privé → public) est encore moins contrôlé : d'anciens consultants ESN intègrent les ministères puis signent des contrats avec leurs anciens employeurs."

