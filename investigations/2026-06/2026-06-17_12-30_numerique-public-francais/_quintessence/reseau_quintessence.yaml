# QUINTESSENCE - Réseau Personnel : Décideurs Publics du Numérique ↔ ESN & Cabinets de Conseil
# Date extraction : 2026-06-17
# Source : investigations/2026-06-17_12-30_numerique-public-francais/2026-06-17_17-30_reseau-personnel-numerique-etat-esn-cabinets-conseil_INVESTIGATION.md

complexity: "COMPLEX"

these_centrale:
  "La porosité entre l'État et les ESN/cabinets de conseil n'est pas une série de cas individuels mais un système de pantouflage institutionnalisé, où la circulation des élites du numérique crée une captation réciproque : l'État dépend des ESN pour son fonctionnement IT, les ESN dépendent des marchés publics pour leurs revenus, et les hauts fonctionnaires dépendent des ESN pour leur reconversion. Le contrôle HATVP (74,3 % d'avis « compatibilité avec réserves », poursuites quasi nulles) fonctionne comme un système d'enregistrement sans dissuasion."

theses_implicites:
  - "Le blocage de Cédric O par la HATVP (2022-2023) est l'exception qui confirme la règle : seuls les cas trop visibles sont contrôlés, tandis que les mobilités moins exposées (directeurs de projet, chefs de service) passent sans obstacle."
  - "La relation personnelle Macron-Tadjeddine (McKinsey) depuis 2007 a créé un canal privilégié de captation de la décision publique : les consultants McKinsey ont travaillé gratuitement pour la campagne de 2017, puis ont reçu 72,8 M€ de contrats publics après la victoire, sans jamais payer d'impôt sur les sociétés en France de 2011 à 2020."
  - "La DITP fonctionne comme une passerelle institutionnalisée entre l'État et les cabinets de conseil privés, où les consultants alternent entre postes publics et privés avec la connaissance des dossiers et des réseaux."
  - "Le refus d'instaurer une cooling-off period obligatoire et contraignante est un choix politique délibéré, pas un oubli législatif."

