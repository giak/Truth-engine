enquete_id: "climat"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_11-00_climat_performatif_promesses_APEX.md"
these_centrale: "La politique climatique française est un cas paradigmatique de performativité législative : production intensive de textes, plans et stratégies (SNBC 1-2-3, PPE, LPEC, ZAN, PNACC, SPAFTE, SGPE, COP régionales) sans traduction dans les budgets, les investissements, ni les émissions réelles — l'écart entre le discours et le réel atteint un facteur 3 mesurable."
theses_implicites:
  - "La France utilise la production de plans climat (SNBC, PPE, SPAFTE) comme substitut à l'action, chaque nouveau plan justifiant le précédent sans qu'aucun indicateur ne s'améliore structurellement"
  - "Le découplage entre les discours présidentiels ('Ce quinquennat sera écologique') et les arbitrages budgétaires (Fonds vert divisé par 4) est systémique, pas accidentel"
  - "L'absence de mécanisme de sanction pour non-respect des budgets carbone rend toute planification climatique juridiquement non contraignante"
  - "La réduction réelle des émissions françaises est principalement tirée par des facteurs exogènes (désindustrialisation, COVID, crise énergétique) plutôt que par les politiques climatiques"
