  - cause: "F-climat-010"
    effet: "F-climat-011"
    mecanisme: "Les besoins identifiés par l'État lui-même (+82 Md€/an) sont ignorés dans le PLF, les investissements baissent au lieu d'augmenter"
perspectives_dialectiques:
  - position: "Thèse"
    argument: "La France est un leader climatique (COP21, SNBC, planification écologique, électricité décarbonée, -31 % d'émissions 1990-2023)"
  - position: "Antithèse"
    argument: "La France produit des plans sans les financer, promet sans contraindre, légifère sans sanction — l'écart discours-réel atteint un facteur 3"
  - position: "Synthèse"
    argument: "La performativité climatique française est un système auto-entretenu où la production de plans (SNBC, PPE, LPEC, SPAFTE) sert de substitut à l'action, et où la réduction réelle des émissions est principalement tirée par des facteurs exogènes (désindustrialisation, COVID, crise énergétique)"
limites:
  - "L'enquête couvre les émissions territoriales uniquement, pas l'empreinte carbone (émissions importées)"
  - "Les chiffres d'émissions 2025 sont des estimations Citepa provisoires, pas l'inventaire consolidé CCNUCC"
  - "Ne couvre pas la dimension européenne (Fit for 55, ETS, CBAM)"
  - "Ne couvre pas l'adaptation au changement climatique (PNACC)"
wolves:
  - nom: "La baisse T1 2026 (-5,2 %) comme preuve d'inflexion"
    argument: "Le Citepa mesure -5,2 % au T1 2026, preuve que la politique climatique commence à porter ses fruits"
    reponse: "Cette baisse est attribuée par la ministre Barbut à la 'crise au Moyen-Orient' (baisse conjoncturelle du carburant), pas aux politiques climatiques structurelles"
  - nom: "Le Fonds vert présenté comme une hausse"
    argument: "Le Fonds vert 2026 à 837 M€ est présenté comme une hausse par Lecornu par rapport aux 650 M€ du PLF initial"
    reponse: "837 M€ reste une baisse de 27 % par rapport à 2025 (1,15 Md€) et de 67 % par rapport à 2024 (2,5 Md€)"
iceberg:
  - "665 cas de désinformation climatique concentrés sur CNews/Europe1 (QuotaClimat) — lien avec l'enquête médias concentration Bolloré"
  - "La SNBC3 publiée le 12 décembre 2025, date du 10e anniversaire de l'Accord de Paris — date de communication, pas de décision"
  - "Lien avec enquête performativité : le même mécanisme de loi sans décret (LPEC) et de plan sans exécution"
  - "Mnemolite : investigation cybersécurité État français (prédation structurelle) montre le même schéma d'annonce sans résultat — plan 1 Md€ cybersécurité 0 résultat"
