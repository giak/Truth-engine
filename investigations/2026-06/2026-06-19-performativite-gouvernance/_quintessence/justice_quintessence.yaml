these_centrale: "La justice française présente la FORME de l'indépendance sans la SUBSTANCE — le parquet (magistrats du ministère public) reste structurellement subordonné au pouvoir exécutif par un verrou constitutionnel (art. 65 al. 5 : avis simple du CSM, pas conforme) que la classe politique refuse de faire sauter depuis 10 ans, malgré les condamnations de la CEDH et les alertes du CSM."
theses_implicites:
  - "La réforme constitutionnelle votée par l'Assemblée et le Sénat le 26 avril 2016, qui instaurait l'avis conforme du CSM pour les nominations du parquet, n'a jamais été soumise au Congrès — Hollande puis Macron l'ont enterrée"
  - "La CEDH a dit deux fois (Medvedyev 2010, Moulin 2010) que le parquet français n'est 'pas une autorité judiciaire indépendante' — 15 ans sans réforme"
  - "La Commission de Venise (2023) recommande explicitement l'avis conforme — recommandations non suivies"
  - "Le système est conçu pour que le parquet soit indépendant en apparence et contrôlé en réalité : l'abstinence politique (aucun ministre n'a passé outre un avis CSM depuis 2007) est réversible à tout moment"
