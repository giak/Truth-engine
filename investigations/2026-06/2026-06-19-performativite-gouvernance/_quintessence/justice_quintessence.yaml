causalites:
  - cause: "F-justice-002"
    effet: "F-justice-001"
    mecanisme: "L'avis simple du CSM (art. 65 al. 5) permet constitutionnellement au Garde des Sceaux de passer outre l'avis du CSM, maintenant le parquet en subordination"
  - cause: "F-justice-004"
    effet: "F-justice-005"
    mecanisme: "La réforme votée en 2016 mais jamais soumise au Congrès par Hollande puis Macron est le mécanisme central de blocage : on vote pour dire qu'on agit, on n'exécute pas pour conserver le pouvoir"
  - cause: "F-justice-006"
    effet: "F-justice-008"
    mecanisme: "La CEDH condamne la France en 2010, la Commission de Venise confirme en 2023 — l'absence de réforme malgré ces condamnations européennes constitue un déni d'état de droit"
perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le parquet doit rester sous contrôle du pouvoir exécutif car le gouvernement est responsable de la politique pénale devant le Parlement — l'avis conforme serait une 'confiscation démocratique'"
  - position: "Antithèse"
    argument: "La subordination du parquet viole la séparation des pouvoirs, expose les procureurs aux pressions politiques, et prive les citoyens d'une justice réellement indépendante — la CEDH le dit depuis 15 ans"
  - position: "Synthèse"
    argument: "Un parquet indépendant dans ses nominations et sa discipline mais intégré à la politique pénale via des instructions générales publiques (pas individuelles). L'avis conforme du CSM est le minimum vital. La réforme de 2016 est ce compromis — son blocage est un scandale démocratique silencieux"
limites:
  - "Les sources institutionnelles (CSM, Conseil constitutionnel) sont fiables mais représentent le discours officiel"
  - "La pratique réelle des relations parquet-Garde des Sceaux est opaque (instructions non écrites, pressions informelles)"
  - "Ne couvre pas le fonctionnement des parquets spécialisés (PNF, PNAT, Pnaco)"
  - "Comparaison européenne limitée à l'Italie"
wolves:
  - nom: "L'élégance politique comme garantie"
    argument: "Aucun ministre n'a passé outre un avis CSM depuis 2007 — la preuve que le système fonctionne par la vertu"
    reponse: "L'abstinence volontaire n'est pas une garantie constitutionnelle. Rémy Heitz le dit : 'Rien n'interdirait la politisation du parquet' — une garantie réversible n'est pas une garantie"
  - nom: "La réforme est trop compliquée"
    argument: "La majorité des 3/5e nécessaire au Congrès est difficile à réunir, et le sujet ne passionne pas l'opinion"
    reponse: "Le texte a déjà été voté dans les mêmes termes par AN et Sénat en 2016 — la majorité existe. Le blocage est un choix politique, pas une impossibilité technique"
iceberg:
  - "Lien avec enquête performativité : la réforme de 2016 jamais promulguée est un cas paradigmatique de loi fantôme — signifiant sans signifié"
  - "Lien avec enquête climat : même mécanisme de plan sans exécution, de promesse sans livraison (LPEC, réforme CSM)"
  - "L'affaire Lyhanna (communiqué CSM 9 juin 2026) comme test de la pression politique sur les magistrats"
  - "La baisse de confiance des citoyens dans la justice (49 %) en écho à la défiance politique généralisée (26 % CEVIPOF)"
  - "Mnemolite : enquête franc-maçonnerie et pouvoir (2026-04-05) — liens avec la nomination des magistrats et les réseaux d'influence"
