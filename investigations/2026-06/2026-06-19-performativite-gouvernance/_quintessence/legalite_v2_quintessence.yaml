perspectives_dialectiques:
  - position: "Thèse"
    argument: "Les ordonnances permettent l'efficacité gouvernementale, le filtre QPC garantit la qualité juridictionnelle, et les règles européennes assurent la stabilité budgétaire. Les grands corps recrutent par concours méritocratique."
  - position: "Antithèse"
    argument: "Les données contredisent la thèse officielle: 93% des QPC bloquées, 82% des ordonnances non ratifiées, 9 milliardaires contrôlent 80% des médias, 80% des grands corps issus des catégories supérieures. Le système est verrouillé de l'intérieur."
  - position: "Synthèse"
    argument: "Les 7 faisceaux convergent vers un diagnostic unique: l'écart légalité/légitimité a atteint un rapport de 1:5 (ICEBERG 5.2). La France produit statistiquement les mêmes résultats qu'une démocratie illibérale par des moyens subtils, procéduraux, technocratiques."

limites:
  - "Certaines sources restent des URLs racines (commission.europa.eu/, conseil-etat.fr/) — les documents précis n'ont pas été retrouvés dans le texte"
  - "Le calcul N/R 5.2 est un construit de l'enquêteur, pas une donnée issue d'une source académique ou officielle"
  - "83% des sources restent françaises (vs 80% dans V1) — le franco-centrisme est réduit mais pas éliminé"
  - "Les comparaisons internationales (Hongrie, Pologne, Italie) sont qualitatives dans le tableau §10 — seuls les classements EIU/V-Dem sont chiffrés"
  - "Certains faits (Fleur Pellerin, détails pantouflage Bruno Le Maire) sont issus de sources journalistiques non citées avec URL précise"

wolves:
  - nom: "Les présidents du Conseil d'État (Lasserre, Tabuteau, Soulard)"
    argument: "Le Conseil d'État garantit la qualité juridique des textes et le filtre QPC assure que seules les questions sérieuses atteignent le CC."
    reponse: "Le double filtre bloque 93.2% des QPC. Le CE est juge et partie: il conseille le gouvernement sur les projets de loi ET filtre les recours citoyens contre ces mêmes lois."
  - nom: "Les Gardes des Sceaux successifs"
    argument: "Le budget de la justice a augmenté sous Macron, passant de 7 à 10.8 Md€. La sous-dotation est un héritage historique, pas un choix politique."
    reponse: "L'augmentation du budget justice ne rattrape pas le retard structurel: 0.19% du PIB vs 0.40% en Allemagne. 17 juges/100k vs 21 de moyenne UE. La sous-dotation chronique est un invariant trans-gouvernemental — donc un choix."
  - nom: "Bruno Le Maire"
    argument: "La flat tax et la suppression de l'ISF ont stimulé l'investissement et l'attractivité française. Les revenus fiscaux ont augmenté."
    reponse: "L'ISF remplacé par l'IFI ne rapporte qu'1/6e des recettes antérieures. La flat tax à 30% impose le capital moins que le travail (TMI max 45%). 80% des niches fiscales bénéficient aux 10% les plus riches. Le transfert est documenté par la Cour des comptes."
  - nom: "Les négociateurs français à Bruxelles (Bercy, Élysée)"
    argument: "Les règles budgétaires européennes sont nécessaires à la stabilité de la zone euro. La France les a négociées et acceptées démocratiquement."
    reponse: "La France a co-construit des règles qui lient les gouvernements futurs sans possibilité de retrait démocratique. L'EDP 2024-2029 place le budget français sous tutelle — la souveraineté budgétaire est un mot vidé de son sens."
  - nom: "Les grands corps (IGF, Mines, Ponts)"
    argument: "Le pantouflage est la libre circulation des talents entre public et privé. Les grands corps recrutent par concours — pure méritocratie."
    reponse: "80% des membres des grands corps viennent des catégories sociales supérieures (stable depuis 1958). 62% des IGF ont pantouflé. 50% du CAC40 est dirigé par d'anciens grands corps. Ce n'est pas de la circulation — c'est de la fusion État-capital."

