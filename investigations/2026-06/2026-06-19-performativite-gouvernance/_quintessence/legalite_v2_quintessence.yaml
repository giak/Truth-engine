enquete_id: "legalite_v2"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_07-30_legalite_legitimite_INVESTIGATION_V2_SUPPLEMENT.md"

these_centrale: "L'écart légalité/légitimité est trois fois plus profond que V1 ne l'a estimé (ICEFACTOR 1.5→5.2) — sept faisceaux convergents documentent un verrouillage procédural, économique et médiatique qui transforme le droit en instrument de maintien d'un ordre oligarchique."

theses_implicites:
  - "Le système politico-administratif français est structurellement conçu pour produire de l'illégitimité — les mécanismes de contournement du Parlement (ordonnances, 49.3, filtrage QPC) ne sont pas des abus mais des features intégrées"
  - "La sous-dotation chronique de la justice (17 juges/100k, 0.19% PIB) est un choix politique qui rend le droit théoriquement accessible mais pratiquement inaccessible"
  - "Les autorités administratives indépendantes (CSM, HATVP, Arcom, Défenseur des droits, CNIL) fonctionnent comme des théâtres de légitimation: elles donnent l'apparence du contre-pouvoir sans la substance"
  - "La capture médiatique par 9 milliardaires (80% des médias) verrouille ce qui peut être dit et donc ce qui peut être légitimement pensé"
  - "Le droit fiscal organise un transfert ascendant massif (80-100Mds évasion, ~80Mds niches, ISF supprimé, flat tax) qui érode le consentement à l'impôt"
  - "L'UE est utilisée comme alibi auto-construit — la France a participé à la rédaction des règles qui la lient (Maastricht aux nouvelles règles 2024)"
  - "Le pantouflage (62% IGF, 50% CAC40) n'est pas un effet de bord mais la structure même du pouvoir français — fusion entre l'État et le capital"
  - "La France produit statistiquement les mêmes résultats qu'une démocratie illibérale (Hongrie, Pologne) par des moyens différents: subtils, procéduraux, technocratiques"

