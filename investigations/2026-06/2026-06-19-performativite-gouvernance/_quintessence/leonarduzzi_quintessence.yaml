iceberg:
  - "Léonarduzzi est connecté à la caste des 1500 communicants d'État (formation CELSA, circulation public-privé) — voir investigation communicants_caste"
  - "Le rachat de Bestimage par Xavier Niel (2024) et la concentration Bolloré sur la presse people créent un écosystème où le contrôle narratif s'exerce à tous les niveaux : spin doctors présidentiels + agences people + médias Bolloré"
  - "La performativité comme mensonge systémique : Léonarduzzi est un rouage de la machine performative où la communication remplace l'action publique"
  - "Le lien avec Mimi Marchand/Bestimage n'est pas documenté directement mais converge via Niel et Bolloré dans le même système de fabrique du consentement"

