these_centrale: "Clément Léonarduzzi est l'architecte invisible de la communication d'Emmanuel Macron, nœud Élysée/CAC40/Publicis, opérateur de la porte tournante entre pouvoir politique et intérêts privés du conseil en communication."

theses_implicites:
  - "Le spin doctor n'est plus un technicien mais un acteur politique de facto, participant aux décisions d'État sans mandat électif"
  - "La porte tournante Élysée-Publicis est structurelle : le capital social accumulé au service de l'État est monétisé dans le privé"
  - "Le système HATVP est un paravent : quitus donné sans transparence publique, 77% des réserves non suivies"
  - "Le recrutement par SMS révèle une informalité décisionnelle au sommet de l'État"

