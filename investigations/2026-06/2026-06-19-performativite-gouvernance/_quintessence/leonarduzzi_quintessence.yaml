perspectives_dialectiques:
  - position: "Thèse (défenseur du système)"
    argument: "Léonarduzzi est un professionnel talentueux qui a mis son expertise au service de l'État puis l'a valorisée dans le privé légitimement. La HATVP l'a blanchi. Le système des portes tournantes permet l'expertise croisée."
  - position: "Antithèse (critique radicale)"
    argument: "Léonarduzzi illustre la capture démocratique : un homme sans mandat participant aux décisions d'État, monnayant son accès au pouvoir, utilisant la HATVP comme paravent. La Macronie est un système de connivence."
  - position: "Synthèse (systémique)"
    argument: "Léonarduzzi n'est ni génie ni corrompu mais la conséquence logique d'un système où la communication est devenue le cœur du pouvoir politique. Le problème est l'hypertrophie de la communication qui vide la démocratie."

limites:
  - "Sources presse principalement (Le Monde, Le Figaro, La Lettre) — potentiel biais pro-système ou réceptacle de fuites off"
  - "Absence de données financières personnelles (rémunération exacte chez Publicis non publique)"
  - "Dossier HATVP clos mais contenu non public"
  - "Relation post-Élysée avec Macron documentée par sources indirectes seulement"

