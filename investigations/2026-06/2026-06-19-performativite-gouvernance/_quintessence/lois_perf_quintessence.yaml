these_centrale: "Le Parlement francais vote des lois qui ne sont pas appliquees — 36 lois votees depuis la dissolution de juillet 2024, 1 seule avec ses decrets d'application complets. 23 lois depuis janvier 2025 sans aucun decret publie. 69 ordonnances publiees, 12 ratifiees (82% non ratifiees). OQTF: 4,865 executees sur 34,000 (14,3%). La loi n'est plus un instrument de gouvernement mais un instrument de communication politique — Etat performatif."

theses_implicites:
  - "Les decrets d'application sont volontairement retardes quand le cout politique de l'application depasse le cout politique du vote"
  - "L'article 38 desordonnances permet de contourner le debat parlementaire; la non-ratification maintient un flou juridique favorable a l'executif"
  - "Les electeurs ne sanctionnent pas la non-application car ils n'en ont pas conscience (asymetrie d'information)"
  - "L'administration est structurellement sous-dimensionnee: ~120 redacteurs DAJ pour ~15 000 pages de lois par an"

