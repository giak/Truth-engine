perspectives_dialectiques:
  - position: "These"
    argument: "Le gouvernement utilise deliberement la non-publication des decrets pour enterrer les lois qu'il ne souhaite pas appliquer. Les lois sont des leurres mediatiques, les ordonnances non ratifiees a 82% un detournement de procedure."
  - position: "Antithese"
    argument: "Le gouvernement est de bonne foi. Les decrets suivront. La complexite technique justifie les delais. Depuis la dissolution, le contexte politique a ralenti la machine administrative."
  - position: "Synthese"
    argument: "Ni complot ni simple lenteur. Le desequilibre entre capacite de voter (illimitee, rapide, mediatique) et capacite d'appliquer (limitee, lente, invisible) est structurel. La loi performative est le symptome d'un Etat qui prefer l'apparence a l'efficacite."

limites:
  - "Article Le Parisien derriere un paywall (resume accessible, details complets via lead)"
  - "Donnees Eurostat OQTF non verifiees directement sur la base Eurostat"
  - "Chiffre '47% promesses tenues' date de 2022 — non actualise"
  - "Certains faits issus de sources d'opinion (Obs. Mensonge, Le Media) — croises avec sources institutionnelles"
  - "23 recours 49.3 couvre 2017-2024 (inclut deux premiers ministeres) — contexte change apres dissolution"

wolves:
  - nom: "Emmanuel Macron"
    argument: "A impulse l'inflation legislative sans assurer le suivi reglementaire. Dissolution juillet 2024 a paralyse le travail legislatif."
    reponse: "Le phenomene depasse Macron — il est structurel et precede 2017"
  - nom: "Gerald Darmanin"
    argument: "Loi Immigration 2024 comme signal politique, decrets bacles en juillet 2024 en sortant"
    reponse: "Le biais repressif du discours migratoire contredit l'absence d'execution — mais la loi etait un totem politique"
  - nom: "Gouvernement Barnier"
    argument: "N'a pas pris les decrets pour 36 lois — premiere responsabilite constitutionnelle (art. 21)"
    reponse: "Heritage de la dissolution — mais aucune action corrective identifiee"
  - nom: "Francois Bayrou (CNR)"
    argument: "Animation d'une structure couteuse sans aucun texte legislatif contraignant"
    reponse: "Zero loi en 3 ans — echec total de la participation citoyenne institutionnalisee"
  - nom: "Le Parlement (collectivement)"
    argument: "A laisse le gouvernement capter 51% de la production legislative via ordonnances"
    reponse: "N'a pas exige la ratification des 57 ordonnances non ratifiees"

iceberg:
  - "Le taux reel de non-application de toutes les lois francaises est inconnu — pas de suivi centralise automatique"
  - "La DAJ sous-dimensionnee est un choix politique: maintenir l'incapacite d'appliquer pour justifier l'absence d'application"
  - "L'absence de mecanisme de sanction (art. 21 non justiciable) est le verrou invisible du systeme"
  - "Le phenomene precede 2017: les rapports Senat sur l'application des lois existent depuis 1995 sans effet"
  - "L'Allemagne applique >85% de ses lois en 12 mois, le Royaume-Uni a 3 mois — la France n'a ni delai ni sanction"

