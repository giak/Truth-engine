enquete_id: "medias"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "investigations/2026-06-19-performativite-gouvernance/2026-06-19_11-30_medias_concentration_milliardaires_APEX.md"
these_centrale: "Cinq milliardaires (Bolloré, Bouygues, Arnault, Saadé, Niel) contrôlent directement ou indirectement plus de 75 % des audiences médiatiques françaises, et neuf milliardaires détiennent plus de 90 % des médias — le pluralisme formel (multiplicité des titres) masque un pluralisme réel en chute libre, avec des mécanismes de coordination qui contournent les seuils anti-concentration de la loi de 1986."
theses_implicites:
  - "Le contrôle ne s'exerce pas seulement par la propriété capitalistique mais par quatre canaux : nomination des directions alignées, éviction des journalistes réfractaires, coordination entre groupes par échanges de participations, verrouillage des canaux de distribution"
  - "La régulation (Arcom) est structurellement impuissante : sanctions lentes, peu dissuasives, jamais préventives"
  - "Le système médiatique français opère une verticalisation totale incluant l'édition (Hachette, Grasset, Editis), la distribution (Relay) et la production audiovisuelle"
  - "Les réseaux d'influence transverses (CELSA, Léonarduzzi, Marchand) forment un écosystème de circulation des élites entre médias, communication et pouvoir politique"
