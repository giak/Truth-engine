  - cause: "F-medias-012"
    effet: "F-medias-002"
    mecanisme: "Le rachat de BFMTV/RMC par Saadé accélère la concentration, dégradant la position française au classement RSF de la liberté de la presse"
perspectives_dialectiques:
  - position: "Thèse"
    argument: "La concentration des médias par 5 milliardaires est une menace existentielle pour la démocratie française — elle vide le pluralisme de sa substance et verrouille le débat public"
  - position: "Antithèse"
    argument: "La loi de 1986 encadre déjà la concentration, l'Arcom veille au pluralisme, la multiplication des chaînes et pure players compense, et la France reste 25e au classement RSF"
  - position: "Synthèse"
    argument: "Le pluralisme de l'offre (multiplicité des chaînes) ignore la question de la propriété : 5 hommes décident de l'orientation éditoriale des médias que 80 % des Français consomment, et le système combine hyper-concentration et hypocrisie régulatoire"
limites:
  - "Tous les chiffres d'audience sont déclarés par Médiamétrie (méthodologie non auditée)"
  - "Les parts exactes de détention capitalistique peuvent varier dans le temps (holdings opaques)"
  - "Ne couvre pas les pure players indépendants (Mediapart, Blast), les médias associatifs, ni les réseaux sociaux"
  - "L'impact électoral réel des biais médiatiques n'est pas mesuré"
wolves:
  - nom: "LVMH + OpinionWay : fabrication de l'opinion"
    argument: "L'acquisition d'OpinionWay par LVMH crée un conflit d'intérêts inédit : le même groupe possède médias et outil de mesure de l'opinion"
    reponse: "Risque de sondages orientés mis en Une des journaux du groupe, créant une opinion auto-réalisatrice — wolf activé"
  - nom: "Kretinsky verticalisation Fnac/Editis"
    argument: "Kretinsky possède Editis (2e éditeur) et 25 % de la Fnac (1er distributeur de livres)"
    reponse: "Contrôle de la chaîne du livre de l'auteur au lecteur — lequel des deux groupes dicte ses conditions à l'autre ?"
iceberg:
  - "Lien avec enquête climat : 665 cas désinformation climatique, 80 % sur CNews/Europe1 (Bolloré) — la concentration médiatique a un impact direct sur la couverture climat"
  - "Lien avec enquête justice : les médias Bolloré couvrent intensément les affaires judiciaires (Fillon, Lyhanna) avec un angle orienté"
  - "Le CELSA forme 1500 communicants/an placés dans les directions com' des 5 groupes + ministères — capture douce par formation des élites"
  - "Mnemolite : enquête système France 2026-04-05 montre la même cartographie de concentration à 9 milliardaires"
