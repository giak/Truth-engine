these_centrale: "Mimi Marchand (Michèle Marchand) est l'agent trouble de la communication people macronienne : patronne de Bestimage, elle a bâti un monopole de l'imagerie people française, monétisé auprès du pouvoir politique (Sarkozy, Macron) via un réseau convergent Bolloré/Niel où la presse people sert d'arme de communication politique intégrée."

theses_implicites:
  - "La people-isation de la campagne Macron 2017 (29 couvertures, fausses paparazzades) a été orchestrée par Bestimage via Xavier Niel, sans laquelle Macron serait resté un candidat peu connu"
  - "Bestimage a servi d'intermédiaire dans la tentative de subornation de témoin (affaire Takieddine) pour blanchir Sarkozy — réseau people utilisé comme outil de subversion judiciaire"
  - "La concentration Bolloré (Prisma Media → Voici, Ici Paris) et le rachat de Bestimage par Niel créent un monopole total sur la narration people française"

