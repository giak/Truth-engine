perspectives_dialectiques:
  - position: "Thèse (défense people)"
    argument: "Mimi Marchand est une entrepreneur de presse people qui a su capitaliser sur son réseau. Les fausses paparazzades sont une pratique courante. Bestimage était une agence comme une autre."
  - position: "Antithèse (critique radicale)"
    argument: "Mimi Marchand a construit un monopole mafieux sur l'imagerie people française, utilisé pour fabriquer le récit présidentiel, faire chanter des célébrités, et subvertir la justice. C'est une criminelle en col blanc."
  - position: "Synthèse (systémique)"
    argument: "Mimi Marchand est le produit d'un système où la frontière entre information people et communication politique s'est effondrée. Son réseau (Niel, Bolloré, Sarkozy, Macron) n'est pas accidentel mais structurel. La justice a fragmenté le réseau sans le démanteler."

limites:
  - "Le lien direct Bolloré-Macron via Bestimage n'est pas documenté — Bolloré n'a pas de contrat direct avec Bestimage"
  - "Le financement exact de l'opération Takieddine reste opaque (60 000€ constatés, mais montage plus large probable)"
  - "Les réunions Mimi-Brigitte Macron n'ont pas de compte-rendu — degré exact d'influence opaque"
  - "Le rachat à 1€ par Niel peut être un sauvetage amical ou une prise de contrôle stratégique — motivations exactes non documentées"

