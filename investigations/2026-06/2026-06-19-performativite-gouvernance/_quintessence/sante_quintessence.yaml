enquete_id: "sante"
complexity: "APEX"
date_extraction: "2026-06-19"
enquete_source: "/home/giak/projects/truth-engine/investigations/2026-06-19-performativite-gouvernance/2026-06-19_12-00_sante_segur_promesses_non_tenues_APEX.md"
these_centrale: "Le Ségur de la santé (13 juillet 2020) est l'archétype de la promesse sanitaire performative — 8,2 Md€/an annoncés, 37% des projets validés à mi-2024, sous-financement cumulé de 1,7 Md€ sur 2020-2024 révélé par l'IGAS en février 2026, fruit d'« erreurs ou approximations évitables » des administrations, plongeant l'hôpital public dans un déficit historique (2,9 Md€ en 2024, 3+ Md€ en 2025) et forçant un transfert de charge illégal sur les fournisseurs."
theses_implicites:
  - "Le sous-financement du GVT (glissement vieillesse technicité) représente 64,7% du trou (1,1 Md€/1,7 Md€) — ce n'est pas une « erreur » mais un phénomène connu et prévisible non corrigé malgré les alertes récurrentes de la Cour des comptes."
  - "La dette fournisseur des hôpitaux (3,8 Md€ en 2015 → 7,5 Md€ en 2023, délais 71,3 jours fin 2025 vs plafond légal 50 jours) constitue une variable d'ajustement de trésorerie illégale devenue systémique."
  - "L'ONDAM +3,1% pour 2026 (rehaussé de justesse de +1 Md€ par amendement in extremis) est présenté comme un effort historique mais reste sous le besoin réel estimé à +4% minimum par la FHF — écart de 2,5 Md€/an non financés."
  - "L'absence de loi de programmation en santé (demandée par la FHF depuis 2023) et le PLFSS 2026 adopté sans vote du volet recettes constituent un contournement démocratique systématique."
  - "Le pattern est celui d'une addiction performative: l'État annonce des financements qu'il sait ne pas pouvoir tenir, crée une dépendance des hôpitaux, puis sous-compense chroniquement."
