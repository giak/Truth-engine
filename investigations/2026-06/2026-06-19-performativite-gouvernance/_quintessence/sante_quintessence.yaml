causalites:
  - id: "C-sante-01"
    enonce: "Promesse Ségur 8,2 Md€ → Sous-estimation administration 1,7 Md€ → Compensation insuffisante → Déficit hôpital → Retards paiement fournisseurs 71j → PME en difficulté → Renonciation aux appels d'offres → Dégradation qualité → Patients impactés"
    type: "Promesse → Sous-financement → Transfert de charge"
  - id: "C-sante-02"
    enonce: "PLFSS projeté +1,6% → Amendement in extremis +3,1% → Hausse insuffisante vs besoin +4% → Gel tarifs → Effet ciseau → 4 900 lits fermés → Plans blancs → Renoncement 73%"
    type: "Sous-dimensionnement ONDAM → Saturation → Renoncement"
  - id: "C-sante-03"
    enonce: "Absence revalorisation forfait GVT → Sous-financement récurrent 1,1 Md€/5 ans → Aggravation mécanique → Trou permanent → 60% établissements déficitaires → Dettes 2,1 Md€ concentrées sur 20 CHU"
    type: "GVT non compensé → Concentration du risque"
perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le Ségur a revalorisé les soignants (+183 €/mois). L'ONDAM progresse. L'État compense les charges. La trajectoire est soutenable."
  - position: "Antithèse"
    argument: "Le sous-financement de 1,7 Md€ détruit les gains par l'attrition des services. Les « erreurs d'estimation » sont systématiques et prévisibles. La sous-compensation est un mode de régulation budgétaire, pas une erreur technique."
  - position: "Synthèse"
    argument: "Le Ségur illustre le modèle de l'addiction performative: l'État annonce des financements qu'il sait ne pas pouvoir tenir, crée une dépendance des hôpitaux, puis sous-compense chroniquement, forçant les établissements à puiser dans leur trésorerie, leurs fournisseurs et leurs investissements. La revalorisation nominale cache une dégradation réelle."
limites:
