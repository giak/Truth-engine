gaps:
- 'GAP-001 : Rôle du Conseil d''État et du SGG comme législateur réel — la quasi-totalité des projets de loi sont soumis
  à l''avis du Conseil d''État avant dépôt au Parlement, et le SGG arbitre les conflits interministériels en amont. Ces deux
  institutions non élues structurent le texte avant toute délibération parlementaire. Enquête lancée le 2026-06-19 (10 faits,
  9 sources).'
- 'GAP-002 : Conseil constitutionnel comme acteur politique — 95 % de validation des lois, nomination par l''exécutif, anciens
  Présidents membres de droit. Le Conseil constitutionnel valide la quasi-totalité des textes contestés. Enquête lancée le
  2026-06-19 (10 faits, 6 sources). Le taux de filtrage QPC a été corrigé (93,2 % → ~75 %) suite à cette enquête.'
- 'GAP-003 : Performativité de gauche et d''extrême droite — focus exclusif sur le centre macronien. Enquête lancée le
  2026-06-19 et enrichie le même jour (relance KERNEL plein pot, 25 faits, 5 chaînes causales, 6 wolves, carte dialectique).
  Résultat : la performativité traverse le spectre mais avec 3 patterns qualitativement distincts. RN = performativité économique
  (85 Md€ promis vs 14 Md€ financés, écart 71 Md€/an) + dissonance mairies (austérité locale vs discours social national).
  EELV = sur-promesse avec avancées réelles (Lyon +58 % vélo, −12 % trafic auto ; Bordeaux 60 000 arbres plantés ; mais
  objectifs révisés à la baisse). LFI = dissonance rhétorique (discours de rupture vs compromis parlementaires ponctuels).
  Comparaison européenne (Syriza, Podemos, Meloni, Colau) montre que le pattern n''est pas spécifiquement français. La thèse
  de symétrie totale est réfutée ; la thèse d''exception macronienne aussi. La performativité est la grammaire du régime,
  pas la pathologie d''un camp.'
- 'GAP-004 : Comparaison internationale systématique. Enquête APEX lancée le 2026-06-19 (42 faits, 5 chaînes causales, 5 wolves).
  Résultat : la France n''est pas un outlier par l''existence des mécanismes de contournement parlementaire (Italie decreti-legge ~50-80/an, Espagne reales decretos-leyes intensifs, UK 3 500 Statutory Instruments/an) mais par leur convergence. La France est le seul pays où 49.3 (adoption sans vote) + ordonnances + budget com'' 4-5× Allemagne + concentration médiatique 5 milliardaires + Conseil constitutionnel 95 % validation + justice sous-dotée (11-12 juges/100k vs ~25 Allemagne) + pantouflage systémique + dépenses publiques 57 % PIB forment un verrouillage cohérent. La thèse d''outlier absolu est falsifiée ; la thèse d''outlier par convergence est renforcée.'
- 'GAP-005 : Contre-pouvoirs effectifs. Enquête lancée le 2026-06-19 (28 faits, 5 chaînes causales, 5 wolves, carte dialectique).
  Résultat : les contre-pouvoirs gagnent des batailles (NDDL abandonné, dissolution Soulèvements de la Terre annulée, Mediapart 220 000+ abonnés, révélations d''affaires) mais ne gagnent pas la guerre. Le système absorbe les victoires (NDDL → Macron se présente en "président écolo"), réprime les menaces (25 800 blessés Gilets Jaunes, 3 100 condamnations), et co-optent les acteurs (CCC : 149 propositions → ~10 % reprises). Blocages : masse critique médiatique non atteinte (alternatifs <5 % audience), convergence syndicats/mouvements spontanés systématiquement manquée (retraites 2023), victoires judiciaires sans exécution (Affaire du Siècle : 1,1 Md€ d''astreinte éludé). La France est le pays européen le plus conflictuel mais aussi le plus bloqué — le cycle "protestation → répression → statu quo" est le plus intense des 5 pays comparés. Les contre-pouvoirs sont la soupape de sécurité du système : ils prouvent son pluralisme sans menacer sa structure.'
- 'GAP-006 : Cabinets d''avocats d''affaires et lobbys dans la rédaction des lois. Enquête lancée le 2026-06-19 (20 faits, 5 chaînes causales, 5 wolves, carte dialectique). Résultat : la loi du 1er février 2024 interdit formellement la rédaction directe par des prestataires privés. Mais l''influence opère par 3 canaux : expertise externalisée (McKinsey, BCG — rapport Sénat 2022), amendements « clés en main » (AFEP, MEDEF), et pantouflage/commissions (Darrois 2008). Le registre HATVP (3 500-4 000 entités obligatoires, 120 000+ actions) est un progrès réel mais le « critère de l''initiative » et le secret professionnel des avocats limitent la transparence effective. La France a un cadre formellement robuste (Sapin 2, 2016) mais le contrôle réel reste partiel. Comparaison internationale : registre obligatoire allemand (2022) plus strict, USA Lobbying Disclosure Act (3,8 Md$ déclarés), UK registre faible (exclut lobbying interne). La France n''est pas un outlier réglementaire — son cadre est parmi les plus complets d''Europe — mais l''asymétrie des moyens entre acteurs privés et société civile reste le problème structurel.'
- 'GAP-007 : Architecture de l''UE comme structure de verrouillage externe. Enquête lancée le 2026-06-19 et enrichie le
  même jour (relance KERNEL plein pot, 20 faits, 4 chaînes causales, 5 wolves). Résultat : la contrainte européenne est réelle
  mais partielle. La France est sous EDP depuis juillet 2024 (déficit 5,8 % du PIB), doit revenir sous 3 % d''ici 2029. Le
  TSCG impose un déficit structurel <0,5 % du PIB que la France n''a presque jamais respecté. Mais : (1) les sanctions n''ont
  jamais été appliquées, (2) les recommandations exigent l''efficacité de la dépense, pas des coupes directes, (3) la France
  co-construit les règles qu''elle présente comme contraintes externes (double discours documenté par Pisani-Ferry, OFCE,
  Cour des comptes), (4) avec 57 % du PIB de dépenses publiques (plus haut de la zone euro), la sous-dotation des services
  publics relève davantage de choix d''allocation internes que de contraintes européennes. Comparaison internationale : Portugal
  (11,2 %→excédent, 2010-2019), Espagne (>10 %→<3 %, sortie EDP 2019). La France est l''outlier par sa capacité à ne pas se réformer.'
note: 'Ambiguïté des IDs génériques : les quintessences performativite, legalite et legalite_v2 utilisent des préfixes F-NNN
  non globalement uniques (ex: F-004 existe dans 3 fiches avec des significations différentes). Les 13 autres quintessences
  utilisent des préfixes uniques (F-lois_perf-XXX, F-sante-XXX, etc.). Une renumérotation globale est recommandée pour la
  traçabilité forensique complète. Dans l''immédiat, les références F-NNN dans les thèses et transversalités sont implicitement
  qualifiées par leur contexte (la thèse sur l''écart légalité/légitimité mobilise les faits de legalite/legalite_v2 et performativite,
  la thèse sur la performativité mobilise ceux de performativite et du modèle MAP).'
