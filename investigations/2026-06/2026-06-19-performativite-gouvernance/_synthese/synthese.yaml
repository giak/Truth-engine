- titre: 'THESE-004 : La concentration médiatique verrouille l''espace délibératif — 5 milliardaires contrôlent la formation
    de l''opinion sous couvert de pluralisme légal'
  enonce: 'Cinq milliardaires (Bolloré, Arnault, Saadé, Niel, Bouygues) contrôlent plus de 75 % des audiences médiatiques
    ; 9 contrôlent plus de 90 % des médias. La concentration est légale (Arcom impuissante : 0 sanction contre Bolloré) mais
    vide le pluralisme de sa substance. Vincent Bolloré a méthodiquement construit le premier groupe médiatique d''extrême
    droite (CNews, Europe 1, JDD, Paris Match, Hachette, Grasset) par une stratégie d''éviction des journalistes réfractaires.
    La presse people (Mimi Marchand/Bestimage, rachetée par Niel) a été utilisée comme arme de communication politique (29
    couvertures Macron en 2017). Les spin doctors (Léonarduzzi, CELSA → 1500 communicants d''État) forment l''écosystème de
    fabrication du consentement. Résultat : 62 % des Français se méfient des médias traditionnels, 665 cas de désinformation
    climatique concentrés à 80 % sur CNews/Europe1, et un espace délibératif où le débat contradictoire est remplacé par la
    polarisation spectacle — débat qui valide la forme du pluralisme sans jamais menacer les structures de pouvoir.'
