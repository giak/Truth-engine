- titre: 'THESE-005 : L''écart légalité/légitimité produit des catastrophes sectorielles mesurables — le pattern est identique
    dans tous les domaines documentés'
  enonce: 'Chaque secteur documenté présente le même pattern : annonce chiffrée massive → sous-exécution chronique → dégradation
    réelle → nouvelle annonce. Ségur santé : 19 Md€ promis, 37 % des projets validés à mi-2024, déficit hospitalier 2,9 Md€,
    73 % des Français renoncent à des soins. Climat : Fonds vert réduit de 74 % en 3 ans, LPEC avec 3 ans de retard, SNBC3
    publiée le jour anniversaire de l''Accord de Paris (date de communication), besoin +82 Md€/an identifié (Pisani-Ferry)
    mais non financé — condamnation de l''État pour inaction climatique (Grande-Synthe, 2021 ; Avenir, 2023). Éducation :
    10 000 postes supprimés depuis 2017, Pacte enseignant 38 % de sous-exécution, salaire français 53 % du salaire allemand,
    classement PISA en baisse continue. Diplomatie africaine : discours de rupture (Ouagadougou 2017, Africa Forward 2026)
    accompagnés d''un effondrement militaire et diplomatique total (5 bases fermées, Wagner/Africa Corps dans 44 pays, Tchad/Sénégal/Côte
    d''Ivoire demandent le départ des troupes françaises). Le pattern est invariant quel que soit le ministre, le gouvernement
    ou la majorité : la performativité produit des conséquences matérielles mesurables, et l''écart entre le discours et le
    réel s''accroît dans tous les secteurs.'
