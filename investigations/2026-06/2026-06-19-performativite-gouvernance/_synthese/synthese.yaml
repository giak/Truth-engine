  contre_hypothese: Si cet écart était conjoncturel (dû à Macron), on observerait une corrélation avec l'alternance. Or les
    indicateurs se dégradent de façon monotone depuis 2007 (Sarkozy), voire 1958 pour certains (abstention). Si c'était un
    simple 'déficit de communication', les 1 Md€/an de budget com' l'auraient résorbé — il l'aggravent.
  shadow: 3.0
- titre: 'THESE-002 : La performativité est le mécanisme principal qui produit et entretient l''écart — le discours s''est
    substitué à l''action comme mode de gouvernement'
  enonce: 'La France ne souffre pas d''une pathologie conjoncturelle du mensonge politique mais fonctionne structurellement
    comme une logocratie (Viktorovitch, 2025) : un régime où la production de discours performatifs s''est substituée à l''action
    publique. 8 mécanismes documentés (M1 à M8) décrivent le système : l''annonce vaut réalisation (M1), le déni factuel est
    ordinaire (M2), l''inversion sémantique est la norme (M3), la promesse auto-référentielle clôt le débat (M6). 407 mensonges
    documentés (2017-2025), 47 % de promesses tenues, 36 lois votées depuis la dissolution / 1 seule appliquée, 82 % d''ordonnances
    non ratifiées, 1 Md€/an de budget communication — ces chiffres ne sont pas des symptômes mais le mode de fonctionnement
    normal. Le système est structurellement dépendant du discours : la tolérance augmente (dose croissante pour même effet),
    l''addiction épistémique capture les citoyens (consommation d''indignation sans action), l''addiction économique verrouille
    le budget (2+ Md€/an de dépenses performatives : 1 Md€ communication + 1 Md€ cabinets conseil), et la caste des communicants
    s''auto-reproduit (CELSA → cabinet → Élysée → agence privée). Score API 78/100 — Stade 4 Addiction Chronique.'
