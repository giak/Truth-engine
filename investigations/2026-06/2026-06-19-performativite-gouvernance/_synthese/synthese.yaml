hierarchie_causale:
  description: 'Les 5 mécanismes ne sont pas équivalents : deux sont primaires (causes), deux sont secondaires (amplificateurs),
    un est le produit observable (conséquence). Distinguer les niveaux est essentiel pour comprendre pourquoi le système est
    stable et ce qui pourrait le faire basculer.'
  tier_1_primaires:
  - mecanisme: Verrouillage institutionnel (THESE-003)
    role: Cause première. Sans 49.3/ordonnances/AAI neutralisées, la performativité serait sanctionnée électoralement et le
      Parlement exercerait un contre-pouvoir effectif. Le verrouillage est la condition de possibilité de tout le reste.
  - mecanisme: Concentration médiatique (THESE-004)
    role: Cause première. Sans contrôle de l'espace délibératif, la performativité serait exposée, contredite, et perdrait
      son efficacité. Le verrouillage médiatique est le bouclier du verrouillage institutionnel.
  tier_2_secondaires:
  - mecanisme: Performativité/logocratie (THESE-002)
    role: 'Mécanisme opérationnel. C''est le ''comment'' quotidien : ce que le verrouillage institutionnel et médiatique rendent
      possible. La performativité n''est pas la cause — elle est le mode de fonctionnement normal une fois les contre-pouvoirs
      neutralisés.'
  - mecanisme: Caste des communicants et pantouflage (TR-004, TR-007)
    role: Infrastructure humaine. Les 1500 communicants d'État, les portes tournantes CELSA→cabinet→agence, et le pantouflage
      des grands corps (62 % IGF, 50 % CAC40) forment le 'qui' derrière le 'comment'. Sans cette caste auto-reproduite, la
      performativité manquerait de personnel qualifié.
  tier_3_consequences:
  - mecanisme: Catastrophes sectorielles (THESE-005)
    role: Produit observable. Les catastrophes ne sont pas un mécanisme autonome mais la conséquence mesurable de l'écart
      légalité/légitimité. Elles sont le symptôme, pas la maladie.
dynamique_systemique:
  description: Le système est stable parce que 5 boucles de rétroaction se renforcent mutuellement. Aucune boucle isolée ne
    suffirait à maintenir l'écart — c'est leur convergence qui rend le système résilient.
  boucles:
  - id: BOUCLE-1
    nom: Verrouillage → défiance → abstention → renforcement du verrouillage
    mecanisme: 'Le 49.3 et les ordonnances contournent le Parlement → les électeurs constatent l''impuissance de leurs élus
      → abstention croissante (57 %) → le gouvernement peut gouverner avec une légitimité électorale encore plus faible →
      usage accru du 49.3. Boucle de renforcement : chaque tour renforce le suivant.'
    faits:
    - F-001
    - F-002
    - F-006
    - F-007
  - id: BOUCLE-2
    nom: Concentration médiatique → fabrication du consentement → maintien du verrouillage
    mecanisme: 5 milliardaires contrôlent l'information → l'agenda médiatique est aligné sur les intérêts du pouvoir → les
      alternatives politiques ne percent pas → le verrouillage institutionnel n'est jamais un enjeu électoral → la concentration
      médiatique continue. Le pluralisme formel (multiplicité des titres) masque l'absence de pluralisme substantiel.
    faits:
    - F-medias-001
    - F-medias-007
    - F-005
  - id: BOUCLE-3
    nom: Performativité → promesses non tenues → défiance → demande de plus de discours
    mecanisme: Le gouvernement annonce (Ségur, Fonds vert, Pacte enseignant) → sous-exécution → les citoyens constatent l'écart
      → la défiance augmente → le gouvernement répond par de nouvelles annonces pour restaurer la confiance → l'écart se creuse.
      La solution (plus de discours) aggrave le problème (écart croissant). C'est le cœur du modèle d'addiction performative
      (MAP).
    faits:
    - F-sante-001
    - F-climat-008
    - F-education-011
    - F-map-001
  - id: BOUCLE-4
    nom: Sous-dotation → dégradation des services → perte de légitimité → justification de l'austérité
    mecanisme: Justice à 0,19 % du PIB → 94 % des plaintes pour viol classées → les citoyens perdent confiance dans la justice
      → 'la justice ne fonctionne pas, pourquoi y mettre plus ?' → le budget stagne. Même logique pour la santé (déficit 2,9
      Md€ → renoncement aux soins → 'le public est inefficace' → nouvelles coupes).
    faits:
    - F-012
    - F-016
    - F-sante-005
  - id: BOUCLE-5
    nom: Caste auto-reproduite → capture institutionnelle → fabrication du consentement → reproduction de la caste
    mecanisme: CELSA forme les communicants → ils peuplent les cabinets ministériels → ils passent dans les agences privées
      (Publicis, Havas) → ils reviennent comme conseillers → le réseau se densifie → l'entrée dans le système est verrouillée
      pour les outsiders → la pensée unique de la communication se perpétue. 500+ portes tournantes documentées.
    faits:
    - F-310
    - F-311
    - F-312
    - F-LEONARDUZZI-005
cadre_theorique:
  description: Trois cadres théoriques éclairent le phénomène. Aucun n'est parfaitement ajusté au cas français — c'est leur
    combinaison qui capture la spécificité du régime.
  cadres:
  - concept: Post-démocratie (Colin Crouch, 2004)
    application: 'Crouch décrit des régimes où les institutions démocratiques persistent formellement mais où la substance
      de la démocratie (délibération, participation) est vidée par le pouvoir des élites économiques et la professionnalisation
      de la communication politique. Le cas français correspond au modèle : élections maintenues, Parlement formellement actif,
      mais décisions prises ailleurs (exécutif, cabinets de conseil, UE). La concentration médiatique par 5 milliardaires
      est l''incarnation du ''pouvoir des élites économiques'' décrit par Crouch.'
  - concept: Régime hybride / Autoritarisme compétitif (Levitsky & Way, Diamond)
    application: 'Les classements EIU (7.99/10) et V-Dem (0.799) placent la France en ''démocratie défaillante'', à la frontière
      des régimes hybrides. Le concept d''autoritarisme compétitif décrit des régimes où les élections existent mais le terrain
      de jeu est structurellement inégal : médias capturés, justice sous influence, opposition délégitimée. La France n''est
      pas une dictature — mais elle n''est plus classée comme démocratie pleine par l''EIU depuis 2018.'
  - concept: Logocratie (Clément Viktorovitch, 2025)
    application: 'Viktorovitch théorise un régime où le discours n''est plus un outil du pouvoir mais le pouvoir lui-même.
      La logocratie capture spécifiquement le mécanisme opérationnel quotidien du régime français : la production de discours
      performatifs comme substitut à l''action. Ce concept est complémentaire des deux premiers : Crouch décrit le résultat
      (post-démocratie), Levitsky décrit le type de régime (hybride), Viktorovitch décrit le mode de fonctionnement (logocratie).'
contre_hypotheses_ecartees:
- hypothese: C'est uniquement lié à Emmanuel Macron
  rejet: Le 49.3 existe depuis 1958, les ordonnances depuis l'article 38 de la Constitution, le pantouflage est documenté
    depuis les années 1980, la concentration médiatique s'accélère depuis 2000. L'abstention croît de façon monotone depuis
    1958, les classements EIU/V-Dem se dégradent depuis 2007. Macron intensifie les tendances (28×49.3, 1 Md€ com') mais ne
    les crée pas.
  contre_preuve: F-006 (usage 49.3 depuis 1958), F-042 (pantouflage historique), F-005 (concentration médias antérieure à
    2017)
- hypothese: C'est inhérent à la Ve République / au présidentialisme
  rejet: 'Si la Ve République était la cause, l''écart serait stable depuis 1958. Or il s''aggrave : l''abstention passe de
    20 % (1960) à 57 % (2024), le 49.3 passe de 1-2×/mandat à 28×, le budget communication passe de 200 M€ (2000) à 1 Md€
    (2025). La Ve République fournit le cadre légal mais n''explique pas l''intensification.'
  contre_preuve: F-lois_perf-001, F-lois_perf-002, F-001 (abstention 1958-2025)
- hypothese: Tous les pays démocratiques traversent la même crise
  rejet: 'La France est un outlier sur plusieurs métriques : 49.3 (aucun équivalent dans les démocraties parlementaires),
    budget communication étatique (1 Md€ — 3× le budget du Royaume-Uni en proportion du PIB), concentration médiatique (5
    milliardaires pour >75 % audiences — situation unique en Europe occidentale), nombre d''ordonnances (>50 % des textes
    — aucun équivalent en Allemagne, Italie, Espagne).'
  contre_preuve: F-014 (classement EIU), F-015 (comparaison internationale budget justice), F-018 (comparaison ordonnances)
- hypothese: C'est une crise temporaire — les institutions vont s'autocorriger
  rejet: 'Les 5 boucles de rétroaction (cf. dynamique_systemique) sont des mécanismes de renforcement, pas d''autocorrection.
    Chaque boucle est un cercle vicieux : la défiance produit l''abstention qui produit le verrouillage qui produit la défiance.
    Sans choc externe (crise de régime, décision CJUE/CEDH, rupture générationnelle), le système est conçu pour se perpétuer,
    pas pour se corriger.'
  contre_preuve: F-map-009, F-map-010, F-map-011 (modèle addiction) ; BOUCLE-1 à BOUCLE-5 (cf. dynamique_systemique)
- hypothese: Les citoyens sont apathiques ou mal informés
  rejet: 'Les citoyens perçoivent empiriquement l''écart : 74 % jugent les politiciens corrompus, 62 % se méfient des médias,
    45 % pensent la démocratie en danger. La défiance n''est pas de l''apathie — c''est un jugement rationnel sur le fonctionnement
    réel des institutions. L''abstention n''est pas un désintérêt mais un rejet d''un système perçu comme verrouillé (57 %
    d''abstention = 26 millions d''électeurs).'
  contre_preuve: F-001, F-002, F-003
predictions:
- id: PRED-001
  enonce: Usage du 49.3 ≥30 fois d'ici 2032 (prochaine présidentielle + législatives). La trajectoire actuelle (28× sur 2017-2027)
    et la probabilité d'absence de majorité absolue rendent ce seuil quasi certain.
  shadow: 2.0
  horizon: '2032'
- id: PRED-002
  enonce: Abstention >60 % aux présidentielles 2027 et/ou 2032. La tendance monotone depuis 1958 (20 % → 57 %) et l'absence
    de réforme institutionnelle rendent la poursuite de la hausse probable.
  shadow: 2.5
  horizon: 2027-2032
- id: PRED-003
  enonce: Budget communication étatique >1,2 Md€/an d'ici 2030. La trajectoire (200 M€ en 2000 → 1 Md€ en 2025) et la dépendance
    croissante au discours (BOUCLE-3) rendent l'augmentation quasi mécanique.
  shadow: 2.0
  horizon: '2030'
- id: PRED-004
  enonce: 'Concentration médiatique : ≥6 milliardaires contrôlant >80 % des audiences d''ici 2030. La tendance d''acquisition
    (Bolloré 2015-2023, Niel 2024, Arnault 2025) se poursuit en l''absence de régulation effective (Arcom : 0 sanction).'
  shadow: 3.0
  horizon: '2030'
- id: PRED-005
  enonce: Nouvelle crise sociale de type Gilets Jaunes dans les 3-5 ans, absorbée sans réforme structurelle. Définition --
    mobilisation nationale >2 semaines, >100 000 manifestants en pic, couverture médiatique continue, revendications centrées
    sur la justice sociale et/ou la réforme institutionnelle. Le pattern Gilets Jaunes (2018-2019) → absorption par le débat
    public sans changement institutionnel est réplicable. La crise sera un symptôme, pas un facteur de changement, tant que
    les 5 boucles persistent.
  shadow: 4.0
  horizon: 2028-2030
points_rupture:
- id: RUPT-001
  scenario: Crise de légitimité aiguë — convergence Gilets Jaunes + syndicats + jeunesse
  mecanisme: Si une réforme impopulaire (retraites, austérité budgétaire UE) déclenche une mobilisation massive et convergente
    (syndicats + mouvements spontanés + jeunesse), la légitimité formelle du gouvernement (élu par 25 % des inscrits) pourrait
    être contestée frontalement. Le précédent Gilets Jaunes a montré la capacité de mobilisation — ce qui a manqué était la
    convergence avec les corps intermédiaires.
  probabilite: Moyenne (40 %)
- id: RUPT-002
  scenario: Décision CJUE/CEDH invalidant un mécanisme de verrouillage
  mecanisme: Une condamnation de la France par la Cour Européenne des Droits de l'Homme sur l'usage du 49.3, la composition
    du Conseil constitutionnel, ou l'absence de contrôle effectif des AAI obligerait à une réforme. La France a déjà été condamnée
    pour inaction climatique (Grande-Synthe, Avenir) sans effet structurel — mais une condamnation touchant au cœur du verrouillage
    (Parlement, justice) serait plus difficile à ignorer.
  probabilite: Faible (20 %)
- id: RUPT-003
  scenario: Rupture générationnelle — les 18-35 ans basculent dans la contestation active
  mecanisme: La génération 18-35 ans est la plus abstentionniste (71 % aux législatives 2024), la plus exposée à la précarité
    économique, et la plus consommatrice de médias alternatifs (YouTube, Twitch, Substack). Si cette génération passe de l'abstention
    passive à la contestation active (type Nuit Debout mais massifié), le système perd sa base de consentement résiduel.
  probabilite: Moyenne (35 %)
- id: RUPT-004
  scenario: Crise économique majeure + austérité UE → impossibilité de maintenir les promesses
  mecanisme: Si la procédure de déficit excessif (EDP 2024-2029) impose des coupes budgétaires massives, le gouvernement perd
    sa capacité à financer les promesses performatives (Ségur, Fonds vert, Pacte enseignant). L'écart dire/faire deviendrait
    visible même pour les électeurs les moins politisés. Le mécanisme de la performativité s'effondre quand le budget ne suit
    plus.
  probabilite: Élevée (60 %)
- id: RUPT-005
  scenario: Contre-pouvoir médiatique émergeant — un média indépendant atteint une masse critique
  mecanisme: Si un média indépendant (Blast, Off Investigation, ou un nouvel entrant) atteint une audience comparable à CNews
    (10-15 %), le monopole de fabrication du consentement est brisé. La BOUCLE-2 (concentration → consentement → verrouillage)
    est rompue. Actuellement, l'audience cumulée des médias alternatifs reste <5 % — le seuil critique est estimé à 10-15
    %.
  probabilite: Faible (15 %)
gradation:
  description: La gradation couvre les 5 domaines ou l'ecart dire/faire produit des consequences materielles mesurables sur
    les services publics et l'infrastructure (sante, justice, education, climat, diplomatie). Les domaines Medias et Institutions
    sont exclus de cette gradation car ils sont traites dans la hierarchie causale comme mecanismes (Tier 1), pas comme secteurs
    d'impact.
  domaines:
  - domaine: Justice
    intensite_ecart: Maximale
    indicateurs: 0,19 % du PIB, 17 juges/100k, 94 % plaintes viol classées, 49 % confiance, CSM 0 nomination refusée
    explication: 'La justice cumule tous les mécanismes : verrouillage institutionnel (CSM, parquet sous tutelle), sous-dotation
      chronique, performativité (annonces de réforme jamais suivies). C''est le domaine où l''écart entre la forme légale
      et la substance est le plus grand.'
  - domaine: Climat
    intensite_ecart: Très élevée
    indicateurs: Fonds vert -74 %, LPEC 3 ans de retard, SNBC3 publiée le jour anniversaire de l'Accord de Paris, condamnation
      État (Grande-Synthe, Avenir)
    explication: 'Le climat est le cas d''école de la performativité : la France produit des discours climatiques parmi les
      plus ambitieux du monde (Accord de Paris, ''Make Our Planet Great Again'', Convention Citoyenne) tout en étant condamnée
      pour inaction par ses propres juges. L''écart est documenté par des décisions de justice — preuve ultime du découplage
      dire/faire.'
  - domaine: Diplomatie africaine
    intensite_ecart: Très élevée
    indicateurs: 5 bases fermées, Wagner/Africa Corps dans 44 pays, Tchad/Sénégal/Côte d'Ivoire renvoient les troupes françaises
    explication: Le discours souverainiste (Ouagadougou 2017, Africa Forward 2026) masque un effondrement militaire et diplomatique
      sans précédent. L'écart est d'autant plus frappant que les conséquences sont géopolitiques, pas seulement domestiques.
  - domaine: Santé
    intensite_ecart: Élevée
    indicateurs: Ségur 19 Md€ → 37 % exécutés, déficit 2,9 Md€, 73 % renoncement aux soins
    explication: 'Le Ségur est l''archétype de l''annonce performative : un chiffre rond (19 Md€), une communication massive,
      une sous-exécution documentée. 73 % de renoncement aux soins est un indicateur de légitimité substantielle en chute
      libre.'
  - domaine: Éducation
    intensite_ecart: Élevée
    indicateurs: -10 000 postes, Pacte 38 % sous-exécution, salaire 53 % allemand, PISA en baisse
    explication: 'La France produit des discours sur ''l''école de la République'' tout en supprimant des postes et en maintenant
      les salaires les plus bas d''Europe occidentale. Le Pacte enseignant reproduit le pattern Ségur : annonce → sous-exécution
      → dégradation.'
