  contre_hypothese: 'Si la performativité était une stratégie contingente, elle s''ajusterait aux résultats. Or 47 % de promesses
    tenues depuis 2017 n''ont produit aucune correction du comportement — le système augmente la dose. Si c''était un simple
    problème de ''com'''', les citoyens ne le percevraient pas : or 74 % jugent les politiciens corrompus, ce qui indique
    une détection empirique du découplage dire/faire.'
  shadow: 3.5
- titre: 'THESE-003 : Le verrouillage institutionnel garantit la légalité formelle tout en neutralisant la légitimité substantielle
    — Parlement, justice et autorités indépendantes forment un système convergent'
  enonce: 'Trois mécanismes institutionnels distincts convergent pour neutraliser le pouvoir législatif tout en maintenant
    l''apparence constitutionnelle : le 49.3 (28 fois sous Macron, record absolu — utilisé 113 fois depuis 1958 mais 25 %
    des usages concentrés sur 2017-2025), les ordonnances (>50 % des textes législatifs depuis 2007, 82 % non ratifiées),
    et le double filtre QPC (environ 75 % des recours non transmis par le Conseil d''État et la Cour de cassation, 95 % de validation par le Conseil constitutionnel). La justice est
    structurellement sous-dotée (0,19 % du PIB, 17 juges/100k habitants — 3 fois moins que la moyenne européenne, 94 % des
    plaintes pour viol classées sans suite). Les autorités administratives indépendantes (CSM : 0 nomination refusée depuis
    1958 ; HATVP : 77 % d''avis avec réserves non suivis ; Arcom : 0 sanction contre Bolloré) fonctionnent comme des théâtres
    de légitimation sans pouvoir de contrôle effectif. La convergence de ces mécanismes produit un verrouillage systémique
    : chaque contre-pouvoir potentiel est neutralisé par un dispositif légalement irréprochable.'
