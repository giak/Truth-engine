sujet_majoritaire: 'Le système politique français présente un écart structurel croissant entre sa légalité formelle (conformité
  aux procédures constitutionnelles) et sa légitimité substantielle (consentement populaire, justice sociale, attentes démocratiques).
  23 enquêtes, 754 faits atomiques et environ 230 sources documentent cet écart à travers 7 domaines sectoriels et 5 mécanismes systémiques.
  La thèse centrale : la France n''est pas une démocratie qui dysfonctionne — c''est un régime hybride stabilisé où la forme
  légale maintient l''apparence démocratique tandis que la substance du pouvoir (délibération parlementaire, consentement
  populaire, justice sociale) est structurellement neutralisée par 5 mécanismes convergents. Le concept de post-démocratie
  (Crouch, 2004) capture la dynamique : les institutions formelles persistent, mais la participation citoyenne et la délibération
  sont vidées de leur contenu.'
theses_cardinales:
- titre: 'THESE-001 : L''écart entre légalité formelle et légitimité substantielle est structurel et s''aggrave — c''est la
    signature du régime politique français'
  enonce: 'La France maintient scrupuleusement la légalité formelle de ses procédures constitutionnelles (élections régulières,
    contrôle de constitutionnalité, séparation des pouvoirs) mais la légitimité substantielle de son système politique s''effondre.
    Les indicateurs de consentement populaire sont au plus bas historique : 26 % de confiance dans la politique (CEVIPOF 2025),
    74 % des Français jugent les politiciens corrompus (Transparency International 2024), 57 % d''abstention aux législatives
    2024, 49 % de confiance dans la justice. La France est classée ''démocratie défaillante'' par l''EIU (7.99/10, rang 23)
    et en déclin continu par V-Dem (0.799, -0.03 depuis 2017). Cet écart entre forme et substance n''est pas un accident conjoncturel
    : il est le produit de 5 mécanismes systémiques documentés ci-dessous, et sa trajectoire est monotone sur l''ensemble
    de la Ve République, avec une accélération nette depuis 2017.'
