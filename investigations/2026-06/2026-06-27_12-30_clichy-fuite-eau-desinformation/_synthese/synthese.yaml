  - titre: "THESE-002 : Double-ciblage — Sereti (identitaire) puis Moscow (pro-russe) atteignent deux publics avec le même récit"
    enonce: "Le même contenu vidéo est posté à 44 minutes d'intervalle par deux comptes aux audiences distinctes : @RafaelSereti (51K abonnés, cadrage anti-immigration/identitaire via Gloria.tv) et @camille_moscow (20,7K Telegram, cadrage anti-gouvernement/pro-russe). La technique du double-ciblage est documentée par VIGINUM comme modus operandi de Storm-1516 (§4.2)."
    f_atomiques_justificatifs: ["F-CLICHY-007", "F-CLICHY-011"]
    shadow: 3.0
  - titre: "THESE-003 : Verrouillage Veolia/SEDIF — l'iceberg économique (4,3 Md€) que l'anecdote dissimule"
    enonce: "Le contrat Veolia/SEDIF (4,3 Md€/12 ans) et le projet FMHP (1 Md€) créent un verrouillage économique qui rend toute sortie du monopole impossible. Les investissements FMHP amortis sur 30-40 ans engagent le réseau pour deux générations, pendant que Plaine Commune tente une sortie juridique (précédent Est Ensemble 2022) et que le SEDIF oppose un refus. L'anecdote du tweet masque cet enjeu structurel."
    f_atomiques_justificatifs: ["F-CLICHY-006", "F-CLICHY-012", "F-CLICHY-013", "F-CLICHY-018", "F-CLICHY-019"]
    shadow: 2.0
  - titre: "THESE-004 : Anomalie Barbut — conflit d'intérêts sans déport sur le dossier eau"
    enonce: "Monique Barbut, ministre de la Transition écologique supervisant les dossiers eau, n'est pas astreinte au déport malgré 3 mandats rémunérés (Ethifinance 12K€, Greenback 14 286€, ABI 21 037€), 153 362€ d'actions dans 27 entreprises (dont des acteurs du secteur eau/énergie), et un historique d'actions TotalEnergies disparues sans explication. La HATVP n'a pas recommandé de déport. Connexion Mnemolite : l'enquête UlrichFY/Waytz/Barbut du même jour documente une campagne de délégitimation parallèle contre Barbut via instrumentalisation d'une étude scientifique."
    f_atomiques_justificatifs: ["F-CLICHY-014", "F-CLICHY-015"]
    shadow: 3.5
  - titre: "THESE-005 : Synchronie G7 + NoName057(16) + Storm-1516 + tweet J+10"
    enonce: "Le tweet de @camille_moscow (27 juin) arrive 10 jours après le G7 d'Évian (15-17 juin) qui traitait des sanctions pétrole russe. Pendant le sommet, NoName057(16) a lancé des DDoS synchrones. L'opération Storm-1516 (77 opérations documentées VIGINUM, GRU 29155) cible prioritairement la France. Le timing n'est pas une coïncidence mais s'inscrit dans une fenêtre d'amplification documentée où des récits désinformants saturent le débat après un sommet international."
