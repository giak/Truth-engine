these_centrale: "L'Arcom est un régulateur conçu pour ne pas réguler : ses membres sont nommés par le pouvoir politique, elle n'a jamais bloqué un rachat de média, et sa fonction réelle est de donner l'illusion d'un contre-pouvoir."

theses_implicites:
  - "L'Arcom n'est pas indépendante du pouvoir politique qui nomme ses 9 membres"
  - "L'existence même de l'Arcom endort la vigilance citoyenne : le public croit que « quelqu'un contrôle »"
  - "La seule vraie sanction (C8, 2025) est une exception qui confirme la règle de l'impuissance"

