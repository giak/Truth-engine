perspectives_dialectiques:
  - position: "Narratif officiel"
    argument: "L'Arcom est une autorité indépendante qui garantit le pluralisme. Ses sanctions sont rares parce que les médias respectent la loi."
  - position: "Contre-thèse critique"
    argument: "L'Arcom est un cache-sexe démocratique. Elle est nommée par le pouvoir, ne régule rien, et donne l'illusion du contrôle."
  - position: "Synthèse"
    argument: "L'Arcom n'est pas impuissante par hasard : elle est conçue pour être impuissante. Sa composition garantit son inertie."

limites:
  - "Pas d'accès aux délibérations internes de l'Arcom"
  - "Le cas C8 (2025) montre que l'Arcom peut agir — mais c'est une exception"
  - "Analyse porte sur l'inaction, plus difficile à documenter que l'action"

wolves:
  - nom: "Arcom"
    argument: "Nous sommes indépendants et nous agissons quand la loi est violée. La concentration n'est pas de notre ressort."
    reponse: "Vous avez validé tous les rachats, vous n'avez jamais sanctionné BFMTV pour partialité, et vous avez dû être forcés par le Conseil d'État pour renforcer le pluralisme."
  - nom: "Gouvernement"
    argument: "L'Arcom est une autorité indépendante. L'État ne peut pas influencer ses décisions."
    reponse: "L'État nomme ses 9 membres. Il n'a pas besoin d'influencer les décisions — il choisit ceux qui les prendront."

iceberg:
