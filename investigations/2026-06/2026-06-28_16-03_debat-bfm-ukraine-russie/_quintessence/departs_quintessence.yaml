perspectives_dialectiques:
  - position: "Thèse officielle"
    argument: "Les clauses de cession sont normales lors d'un rachat. Les départs sont un renouvellement naturel des effectifs. Les nouveaux cadres sont compétents."
  - position: "Contre-thèse critique"
    argument: "C'est une purge éditoriale délibérée : les journalistes les plus indépendants sont partis, remplacés par des hommes de l'État et de Bolloré. La rédaction est sous contrôle."
  - position: "Synthèse"
    argument: "Pas besoin de purge violente. Il suffit d'ouvrir une clause de cession pour que les voix critiques partent d'elles-mêmes, et de nommer les bons cadres pour que la ligne change."

limites:
  - "Pas de liste exhaustive et vérifiée des 100+ départs"
  - "Indemnités totales non divulguées"
  - "Pas de témoignage de première main sur les pressions éditoriales"

wolves:
  - nom: "Direction RMC BFM"
    argument: "Les départs sont normaux après un rachat. Les journalistes sont partis pour saisir d'autres opportunités."
    reponse: "Une perte de 1/6 de la rédaction de BFMTV en 8 mois n'a pas de précédent dans l'info française. Ce n'est pas un renouvellement normal."
  - nom: "Journalistes restants"
    argument: "On fait notre travail comme avant. La ligne éditoriale n'a pas changé."
    reponse: "Avec 1/6 de l'équipe partie et de nouveaux cadres nommés, la ligne a mécaniquement changé. L'auto-censure n'a pas besoin d'être visible."

