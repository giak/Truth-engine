these_centrale: "Le départ de 100+ journalistes de BFMTV/RMC après le rachat par CMA CGM (2024-2025) est une restructuration éditoriale profonde qui a vidé la rédaction de ses figures les plus expérimentées et les plus indépendantes, remplacées par des cadres alignés sur le propriétaire et l'État."

theses_implicites:
  - "La clause de cession, présentée comme une protection de l'indépendance éditoriale, a servi de mécanisme d'épuration"
  - "Les départs massifs ont un effet de sidération sur la rédaction restante : l'auto-censure devient la norme"
  - "Le profil des remplaçants (État, Bolloré, télécoms) verrouille la ligne éditoriale future"

