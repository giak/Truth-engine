these_centrale: "La nomination de Ramon Fernandez (ex-DG Trésor) à la présidence de RMC BFM est l'aboutissement d'un circuit de revolving door qui verrouille l'alignement entre l'État, le propriétaire CMA CGM, et le média BFMTV, créant une fusion d'intérêt structurelle."

theses_implicites:
  - "Bpifrance (État) est actionnaire indirect de BFMTV via CMA CGM, créant un conflit d'intérêt structurel jamais débattu"
  - "Le circuit Trésor → Orange → CMA CGM → RMC BFM est un parcours type de l'élite administrative française"
  - "La nomination de Fernandez garantit l'alignement éditorial sans avoir besoin d'instructions écrites"

