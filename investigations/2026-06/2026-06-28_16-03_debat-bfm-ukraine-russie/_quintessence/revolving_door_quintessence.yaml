perspectives_dialectiques:
  - position: "Thèse officielle"
    argument: "Fernandez est un expert reconnu. Son parcours Trésor→Orange→CMA CGM→médias est logique et ne pose pas de problème éthique. Bpifrance est un investisseur comme un autre."
  - position: "Contre-thèse critique"
    argument: "Ce circuit est un revolving door typique de l'élite française. L'État place ses hommes aux commandes des médias. Bpifrance est un outil de contrôle étatique déguisé en banque publique."
  - position: "Synthèse"
    argument: "Pas de conspiration mais une architecture : le système est conçu pour que les mêmes personnes circulent entre État, grands groupes et médias. L'alignement est structurel, pas intentionnel."

limites:
  - "Rémunération exacte de Fernandez non disponible"
  - "Pas de preuve de coordination directe État→Fernandez→ligne éditoriale"
  - "L'analyse est structurelle : le conflit d'intérêt est systémique, pas criminel"

wolves:
  - nom: "Ramon Fernandez / Direction RMC BFM"
    argument: "Je suis nommé pour mes compétences dans les médias et la finance, pas pour aligner l'information sur l'État"
    reponse: "Le problème n'est pas votre intention mais le circuit : vous venez de l'État, du propriétaire, et vous dirigez l'info. L'alignement est structurel, que vous le vouliez ou non."
  - nom: "Bpifrance"
    argument: "Nous sommes un investisseur comme les autres, notre actionnariat dans CMA CGM est une opération normale de soutien aux entreprises"
    reponse: "Vous êtes supervisés par le Trésor, dont l'ex-directeur dirige le média que vous financez indirectement. C'est un conflit d'intérêt structurel."

