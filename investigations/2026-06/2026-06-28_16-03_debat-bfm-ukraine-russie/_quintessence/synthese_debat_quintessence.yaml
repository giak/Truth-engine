these_centrale: "Le débat BFM du 28 juin 2026 sur la guerre Ukraine-Russie construit un récit univoque pro-Ukraine/pro-OTAN à travers 4 experts complémentaires (Ancel, Colessimo, Bunna, Amoursky) sans aucun contradicteur, produisant une chambre d'écho de qualité sur l'offensive ukrainienne, la pression sur Poutine et la possibilité d'une paix négociée."

theses_implicites:
  - "L'animateur pose un cadre narratif complet avant le premier invité (« 40 jours d'offensive », « documents internes russes ») que les experts ne contestent jamais"
  - "Les 4 experts sont complémentaires (tactique, historique, technique, témoignage) mais jamais en contradiction — ils renforcent le même récit"
  - "Les sujets absents (pertes civiles ukrainiennes, négociations d'Istanbul, critiques de l'OTAN, voix russes) sont structurellement exclus du cadre"

