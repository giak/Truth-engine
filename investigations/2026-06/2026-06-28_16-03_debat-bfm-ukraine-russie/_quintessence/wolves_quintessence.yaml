perspectives_dialectiques:
  - position: "Narratif officiel"
    argument: "La France a des médias pluralistes et indépendants. Le marché est concurrentiel. La diversité des propriétaires garantit la diversité des opinions."
  - position: "Contre-narratif structurel"
    argument: "9 propriétaires pour 90% d'audience, c'est un oligopole. Les divergences sont des nuances dans un consensus atlantiste, européiste et libéral."
  - position: "Synthèse"
    argument: "Le pluralisme formel existe (multiplicité des chaînes) mais le pluralisme réel est nul (tous alignés sur les mêmes sujets). Le système est verrouillé par construction."

limites:
  - "Pas d'accès aux données d'audience consolidées par propriétaire"
  - "Les chiffres « ~90% » sont une estimation RSF, pas un calcul précis"
  - "L'alignement des lignes éditoriales est constaté mais pas quantifié"

wolves:
  - nom: "Propriétaires de médias"
    argument: "Chaque média a sa propre ligne éditoriale. Nous n'intervenons pas dans les choix éditoriaux."
    reponse: "Vous nommez les directions, les directions nomment les rédactions. Vous n'avez pas besoin de donner d'ordres."
  - nom: "Arcom"
    argument: "Le pluralisme est respecté. Nous n'avons pas à contrôler la propriété."
    reponse: "C'est exactement le problème : le régulateur refuse de réguler la concentration."

iceberg:
