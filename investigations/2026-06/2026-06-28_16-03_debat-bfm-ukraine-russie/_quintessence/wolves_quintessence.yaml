these_centrale: "Le système médiatique français est un oligopole de 9 propriétaires (dont l'État via Bpifrance) qui contrôlent ~90% de l'audience, produisant mécaniquement un récit convergent sans besoin de conspiration."

theses_implicites:
  - "Les 9 propriétaires partagent une même vision du monde : atlantisme, européisme, libéralisme économique"
  - "L'État français est à la fois actionnaire indirect de médias privés (Bpifrance → CMA CGM → BFMTV) et propriétaire de médias publics (France TV, Radio France)"
  - "Le pluralisme formel français (multiplicité des chaînes) masque un pluralisme réel nul (convergence des lignes éditoriales)"

