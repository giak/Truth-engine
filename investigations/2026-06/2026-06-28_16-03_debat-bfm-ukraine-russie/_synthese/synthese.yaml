  - id: "OBS-003"
    enonce: "Le système médiatique (THESE-005) explique structurellement pourquoi le débat (THESE-002) est univoque : les mêmes causes produisent les mêmes effets"
    fiches_concernees: ["wolves", "arcom", "revolving_door", "departs", "synthese_debat", "synthese_ouverture", "cloture"]

