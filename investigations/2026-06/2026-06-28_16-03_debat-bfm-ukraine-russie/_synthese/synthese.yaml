  - id: "TR-003"
    concept: "Guerre cognitive structurelle"
    description: "BFMTV participe à la guerre cognitive à deux niveaux : (1) comme vecteur du récit pro-Ukraine/pro-OTAN dans le débat, (2) comme rouage du système médiatique verrouillé qui empêche structurellement la contradiction"
    fiches_concernees: ["bfmtv", "synthese_medias", "synthese_debat", "ancel_hyper", "pays_baltes"]
    faits_communs: ["F-synthese-001", "F-baltes-001", "F-ancel-001"]
  - id: "TR-004"
    concept: "Illusion de pluralisme"
    description: "Le système donne l'impression du pluralisme (4 experts aux profils différents, Arcom qui « régule », multiplicité des chaînes) mais produit un récit unique : les experts sont tous alignés, l'Arcom ne régule rien, les chaînes convergent"
    fiches_concernees: ["wolves", "arcom", "synthese_debat", "colessimo_hyper", "ancel_hyper", "bunna_crimee"]
    faits_communs: ["F-wolves-009", "F-arcom-003", "F-debat-005", "F-arcom-005"]
  - id: "TR-005"
    concept: "Soft propaganda par omission"
    description: "Ni le débat ni le système ne mentent directement — ils omettent. Le débat omet les négociations d'Istanbul, les pertes civiles ukrainiennes, les asymétries ×10-100. Le système omet de réguler, d'informer sur les conflits d'intérêt, de pluraliser les experts. L'omission systémique est le mécanisme le plus partagé."
    fiches_concernees: ["bfmtv", "artefacts", "synthese_ouverture", "arcom", "ancel_hyper"]
    faits_communs: ["F-bfmtv-005", "F-artefacts-006", "F-ouverture-003", "F-arcom-005"]

