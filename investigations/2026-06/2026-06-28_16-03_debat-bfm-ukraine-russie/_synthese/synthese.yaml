    concept: "Capture éditoriale par revolving door + purge"
    description: "Le circuit État (Fernandez, Trésor) → propriétaire (Saadé, CMA CGM) → média (RMC BFM) + la purge de 100+ journalistes produisent une rédaction alignée qui produit mécaniquement un récit conforme"
    fiches_concernees: ["revolving_door", "departs", "wolves", "bfmtv"]
    faits_communs: ["F-revolving-005", "F-revolving-008", "F-departs-003", "F-departs-007", "F-wolves-003", "F-wolves-008"]
  - id: "TR-002"
    concept: "Artefacts narratifs non vérifiés"
    description: "Les 40 jours, les documents russes et l'enterrement d'Istanbul sont à la fois des artefacts du débat (produits par l'animateur et les experts) ET des conséquences de la capture éditoriale (une rédaction indépendante les aurait vérifiés ou contestés)"
    fiches_concernees: ["artefacts", "synthese_ouverture", "synthese_debat", "cloture"]
