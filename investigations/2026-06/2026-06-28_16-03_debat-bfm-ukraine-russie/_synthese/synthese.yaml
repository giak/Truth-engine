sujet_majoritaire: "BFMTV et le système médiatique français comme dispositif de guerre cognitive : analyse forensique d'un débat de 30 minutes (28 juin 2026) et des 6 mécanismes structurels qui verrouillent l'information en France."

theses_cardinales:
  - titre: "THESE-001 : Soft propaganda structurelle — BFMTV comme vecteur de guerre cognitive"
    enonce: "BFMTV n'est pas un média de propagande classique mais un vecteur de soft propaganda structurelle produit par 6 mécanismes convergents : concentration capitalistique (9 propriétaires, ~90% audience), revolving door État-médias (Ramon Fernandez), purge éditoriale (100+ journalistes partis), fabrique d'artefacts narratifs (40 jours, documents russes, Istanbul enterré), absence de pluralisme (0 invité russe ou sceptique), régulateur impuissant (Arcom)."
    f_atomiques_justificatifs: ["F-bfmtv-003", "F-bfmtv-005", "F-bfmtv-006", "F-revolving-005", "F-revolving-008", "F-artefacts-004", "F-artefacts-006", "F-departs-003", "F-departs-005", "F-wolves-001", "F-wolves-002", "F-wolves-003", "F-arcom-003", "F-arcom-005", "F-synthese-001", "F-synthese-003"]
    shadow: 2.8

  - titre: "THESE-002 : Un débat univoque — 30 minutes sans contradicteur, asymétries ×10-100"
    enonce: "Le segment BFM du 28 juin 2026 (séquences 1511-2268) construit un récit cohérent de basculement de la guerre en faveur de l'Ukraine, avec 4 experts complémentaires mais jamais en contradiction. Les asymétries structurelles (Russie ×40-80 volume de frappes, ×10 impact destructeur, ×100-1 000 pression économique) ne sont jamais mentionnées. 27% des affirmations sont des faits durs (✦), 45% des amplifications (✧), 27% de la rhétorique (⁕)."
    f_atomiques_justificatifs: ["F-debat-001", "F-debat-005", "F-debat-006", "F-ouverture-001", "F-ouverture-002", "F-ouverture-003", "F-ouverture-004", "F-ouverture-007", "F-cloture-001", "F-baltes-001"]
    shadow: 2.8

  - titre: "THESE-003 : Experts construits — l'autorité médiatique dépasse l'expertise réelle"
    enonce: "Les 4 experts invités sont des constructions médiatiques dont l'autorité dépasse l'expertise documentée. Guillaume Ancel (86% ⁕) n'est plus en service depuis 21 ans et a été condamné pour diffamation. Jean-François Colessimo (67% ⁕) est spécialiste en théologie orthodoxe, pas en stratégie militaire. Ulrich Bounat (20% ⁕) est un analyste civil sans expérience militaire. Cyrille Amoursky (24 ans, 4 ans de carrière) est reporter, pas stratège."
    f_atomiques_justificatifs: ["F-ancel-001", "F-ancel-003", "F-ancel-004", "F-colessimo-001", "F-colessimo-002", "F-colessimo-003", "F-bunna-001", "F-bunna-004", "F-amoursky-001", "F-amoursky-005", "F-flamingo-003"]
    shadow: 2.8

  - titre: "THESE-004 : Trois artefacts narratifs — le récit tient par ce qui est tu"
    enonce: "Le débat est structuré par trois artefacts narratifs non vérifiés : les « 40 jours d'offensive » (jamais attribué à une source), les « documents internes russes » (jamais nommés ni vérifiés), et l'enterrement des accords d'Istanbul (mars 2022 — 0 mention dans 30 minutes de débat). Le public français ne peut pas exiger une paix qu'il ne sait pas avoir été possible."
    f_atomiques_justificatifs: ["F-artefacts-002", "F-artefacts-004", "F-artefacts-005", "F-artefacts-006", "F-artefacts-007", "F-debat-002", "F-debat-003", "F-debat-006", "F-ouverture-005"]
    shadow: 2.5

  - titre: "THESE-005 : L'oligopole médiatique — 9 propriétaires, zéro régulation"
    enonce: "Le système médiatique français est un oligopole de 9 propriétaires (Bolloré, Saadé, Bouygues, Arnault, Niel, Dassault, Drahi, Lagardère, État) qui contrôlent ~90% de l'audience. L'Arcom, régulateur aux 9 membres nommés par le pouvoir politique, n'a jamais bloqué un rachat de média. Le pluralisme formel (multiplicité des chaînes) masque un pluralisme réel nul (convergence des lignes éditoriales sur Ukraine, OTAN, UE)."
    f_atomiques_justificatifs: ["F-wolves-001", "F-wolves-002", "F-wolves-003", "F-wolves-004", "F-wolves-005", "F-wolves-006", "F-wolves-007", "F-wolves-008", "F-arcom-001", "F-arcom-003", "F-arcom-004", "F-arcom-005", "F-synthese-004"]
    shadow: 3.0

