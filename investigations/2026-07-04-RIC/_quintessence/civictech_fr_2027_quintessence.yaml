perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le triple Pack CivicTech-FR 2027 est opérationnellement exécutable avec un budget 0,015-0,025 % du PIB."
  - position: "Antithèse"
    argument: "Probabilité conjointe triple d'adoption 30-40 % (loi 1 70-80 %, loi 2 30-40 %, loi 3 50-60 %) ; CC verrou art. 89 al. 4 ; Sénat LR+UC majoritaire."
  - position: "Synthèse"
    argument: "La discipline trans-partisane 5-10 % Pacte FRANCS + Judo Rhétorique cantonales 2027 + Éloge Surface boycott OAT/Bund produit une probabilité révisée ≥ 60 %."

