these_extraite_du_§0_lecture_integrale: |
  La confrontation, en format cross-examination simulée, de trois positions adverses sur le RIC en France
  (Clara Egger Solutions Démocratiques 2027 candidate, Raul Magni-Berton politiste ESPOL co-auteur
  Electoral Plutocracy 2025 EJPE, Jean-Eric Schoettl ancien SG CC auteur Club des Juristes nov 2023)
  révèle que les trois positions s'opposent sur le champ de bataille JURIDIQUE (où le peuple peut-il
  agir?) et non sur le champ DÉMOCRATIQUE (le peuple est-il légitime ?). Le désaccord n'est pas sur le
  PRINCIPE de souveraineté populaire (tous l'acceptent) mais sur les MODALITÉS de sa traduction
  opérationnelle. Le vrai conflit caché est une guerre épistémique entre expertise descendante (Schoettl)
  vs expertise ascendante contrôlée par le peuple (Egger/Magni-Berton). Bilan cross : Egger/Magni-Berton
  4 tours, Schoettl 1 tour, 5 tours à égalité. Verdict : aucune des trois ne convainc intégralement.
  RIC pris entre élite juridique qui le verrouille et mouvement citoyen qui ne sait pas le dessiner.

