causalites:
  - id: C-CE01
    type: M1-verrou-epistemique
    source: "AJDA + Club des Juristes 2023-2025 + Sauvé 2024"
    enonce: "Verrou épistémique expertise constitutionnelle descendante : CC expert → constitutionnalistes prudents → enseignement reproduit → rare pluralisme doctrinal → peuple sans doctrine pluraliste → RIC jugé impraticable par experts"
    preuve: "80% constitutionnalistes partagent Schoettl"
  - id: C-CE02
    type: M2-asymetrie-ploutocratique
    source: "EJPE 2025 + Dubet 2010 + INSEE grandes écoles"
    enonce: "Asymétrie ploutocratique expert-citoyen : capital culturel → grandes écoles → postes-clés → expertise constitutionnelle biaisée → classe expertise reproduit asymétrie → peuple sans accès → facteur 1.53x → RIC considéré impraticable"
    preuve: "Facteur 1.53x EJPE 2025 + 70% grandes écoles issus déciles 7-9"
  - id: C-CE03
    type: M3-polarisation-rhetorique
    source: "Cross-examination §5 + TNS-Sofres 2024"
    enonce: "Polarisation rhétorique radicalisme (Egger) vs conservatisme (Schoettl) : absence pragmatisme (Magni-Berton) → mouvement citoyen sans mode d'emploi technique → échec politique → verrou renforcé"
    preuve: "Analyse TNS-Sofres 2024"
  - id: C-CE04
    type: boucle-verrou-triple
    source: "Cross-examination §9 Phase 4"
    enonce: "M1 (verrou expert) → pas argumentation pluraliste ; M2 (ploutocratie) renforce M1 (experts biaisés) ; M3 (polarisation) bloque synthèse pragmatique → élu/constitutionnaliste/peuple verrouillés chacun dans leur propre biais épistémique"
    preuve: "Triangle verrou expert-élite-peuple"
  - id: C-CE05
    type: boucle-solutions
    source: "Cross-examination §10 Recommandations"
    enonce: "Solutions : (1) Réseau constitutionnalistes pluralistes produisant doctrine opérationnelle ; (2) Mode d'emploi technique RIC (seuil 1-2%, quorum 40%, interdiction personnes morales, tirage au sort, contrôle a posteriori) ; (3) Tester sur proposition pilote (fin de vie)"
    preuve: "Leviers 1-5 cross-examination"
  - id: C-CE06
    type: boucle-constitution-1958
    source: "Constitution 1958 + Bayeux 1946"
    enonce: "Constitution 1958 créée par experts (De Gaulle, Michel Debré, René Cassin) et institué CC expert-descendant ; verrou dans ADN constitutionnel"
    preuve: "Constitution 1958 + Bayeux 1946"
  - id: C-CE07
    type: boucle-grandes-ecoles-INSEE
    source: "INSEE + rapports Cour des Comptes"
    enonce: "70% effectifs grandes écoles (ENS, Science Po, ENA) issus déciles 7-9 ; élites cultivées reproduisent leur propre classe ; 80% CC issus grands corps"
    preuve: "INSEE + Cour des Comptes"
  - id: C-CE08
    type: boucle-asymetrie-statistique
    source: "EJPE 2025 peer-reviewed"
    enonce: "Facteur 1.53x mesure asymétrie d'influence à caractéristiques contrôlées (éducation, âge) ; effet propre argent + capital culturel ; preuve systémique ploutocratie"
    preuve: "Peer-reviewed EJPE 2025"
  - id: C-CE09
    type: boucle-mouvement-citoyen-36-parrainages
    source: "Solutions Démocratiques 2024 + Substack #83"
    enonce: "Mouvement citoyen (SD, Espoir RIC) 36 parrainages/208M électeurs = 0,000017% corps électoral ; refus peuple produire sa propre expertise → échec politique → verrou renforcé"
    preuve: "Liste CC 2022 + SD 2024"
  - id: C-CE10
    type: boucle-politisation-courante
    source: "TNS-Sofres 2024 + Cross-examination §3 credo"
    enonce: "Culture politique française polarise sur principes, pas sur technique ; débat droits/devoirs prime sur débat seuil/quorum ; difficile passer du « il faut » au « comment »"
    preuve: "Analyse TNS-Sofres 2024"

