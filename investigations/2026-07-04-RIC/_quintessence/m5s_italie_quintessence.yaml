these_centrale: "Le Movimento 5 Stelle italien est le cas d'école de la capture d'un mouvement de démocratie directe par le système politique traditionnel : 32,7% en 2018 (premier parti italien, 228 députés) → 15,4% en 2022 → 12% en 2026 (48 députés). 5 mécanismes de capture : (1) sous-traitance technologique Casaleggio, (2) leadership charismatique vertical, (3) piège de l'institutionnalisation, (4) règle des 2 mandats devenue bombe, (5) absence de garde-fous statutaires."

theses_implicites:
  - "Le M5S n'a jamais été un mouvement de démocratie directe pleinement fonctionnel : la démocratie directe était un argument de vente politique, pas une réalité organisationnelle."
  - "La 'capture' du M5S n'est pas une trahison subie mais une conséquence logique de ses contradictions structurelles originelles - le M5S était programmé pour s'autodétruire dès sa fondation."
  - "Casaleggio Associati contrôlait blog, inscriptions, listes électorales, plateforme Rousseau dès 2009 - infrastructure numérique du mouvement détenue par une société privée sur 12 ans."
  - "La règle des 2 mandats a vidé le mouvement de ses talents : les meilleurs élus sont partis vers d'autres partis, ne laissant que les moins employables politiquement."
  - "Le parallèle M5S/Podemos/Syriza/BSW démontre que la capture est la règle, pas l'exception, du populisme européen post-2010."

faits_atomiques:
  - id: "F-M5S-01"
    enonce: "M5S fondé le 4 octobre 2009 par Beppe Grillo + Gianroberto Casaleggio au Teatro Emeral de Gênes."
    source_url: "https://www.movimento5stelle.it/"
    source_section: "CIV-M5S-001 §1.1 + F001"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-02"
    enonce: "163 parlementaires élus en 2013, moyenne d'âge 33 ans (38% femmes), néophytes jamais élus, sélectionnés par 32 000 inscrits via plateforme en ligne."
    source_url: "https://www.camera.it/"
    source_section: "CIV-M5S-001 §1.3 + F002"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-03"
    enonce: "Plateforme Rousseau lancée 2016, gérée par Casaleggio Associati. 10 000 inscrits actifs sur Rousseau pour 10 millions d'électeurs M5S et ~200 000 adhérents officiels (ratio 0,1%)."
    source_url: "https://www.ilfattoquotidiano.it/"
    source_section: "CIV-M5S-001 §2.2 + F004"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-04"
    enonce: "32,7% aux législatives 2018 (premier parti italien, 228 députés + 112 sénateurs)."
    source_url: "https://www.camera.it/"
    source_section: "CIV-M5S-001 §0 + F005"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-05"
    enonce: "Gouvernement Conte I (juin 2018-août 2019) avec Ligue (Salvini). Premier gouvernement populiste. M5S accepte décrets sécurité et chasse aux migrants."
    source_url: "https://www.governo.it/"
    source_section: "CIV-M5S-001 §3.2 + F006"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-06"
    enonce: "Gouvernement Conte II (septembre 2019-janvier 2021) avec PD (ennemi juré). M5S institutionnalise : ministres, négociations budgétaires, compromis. Ligne 'ni droite ni gauche' vole en éclats."
    source_url: "https://www.governo.it/"
    source_section: "CIV-M5S-001 §3.3 + F007"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-07"
    enonce: "M5S vote le soutien à Mario Draghi (ex-président BCE, symbole technocratique) via Rousseau en février 2021. Suicide politique. ~60 parlementaires M5S refusent et s'opposent."
    source_url: "https://www.ansa.it/"
    source_section: "CIV-M5S-001 §3.4 + F008"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-08"
    enonce: "Divorce Rousseau-Conte annoncé avril 2021 : M5S ne peut récupérer ses données membres. Casaleggio refuse (RGPD). Dette revendiquée 450 000 €."
    source_url: "https://www.politico.eu/"
    source_section: "CIV-M5S-001 §5.1 + F009"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-09"
    enonce: "Rousseau suspendue juin 2021 pour 'raisons techniques' (conflit avec Casaleggio Associati insoluble)."
    source_url: "https://www.open.online/"
    source_section: "CIV-M5S-001 §5.2 + F010"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-10"
    enonce: "Hémorragie parlementaire 2019-2022 : ~60 parlementaires quittent M5S. Les meilleurs éléments (qui peuvent être recasés ailleurs) partent les premiers."
    source_url: "https://www.ansa.it/"
    source_section: "CIV-M5S-001 §4.2 + F019"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-11"
    enonce: "Perte de Rome et Turin aux municipales 2021 : Virginia Raggi et Chiara Appendino balayées. Le M5S ne se qualifie même pas pour le second tour dans ses propres villes."
    source_url: "https://www.comune.roma.it/"
    source_section: "CIV-M5S-001 §4.3 + F020"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-12"
    enonce: "Grillo éliminé comme Garant décembre 2024 (80% des votants pour la suppression). Rôle de Garant supprimé lors de l'Assemblée constituante novembre 2024."
    source_url: "https://www.ilfattoquotidiano.it/"
    source_section: "CIV-M5S-001 §6.2 + F012"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-13"
    enonce: "Règle des 2 mandats abolie novembre 2024 (assemblée constituante). L'un des piliers du M5S tombe."
    source_url: "https://www.sky.it/"
    source_section: "CIV-M5S-001 §6.1 + F013"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-14"
    enonce: "M5S rejoint le groupe The Left (GUE/NGL) au Parlement européen en juillet 2025. Ralliement explicite au centre-gauche."
    source_url: "https://www.europarl.europa.eu/"
    source_section: "CIV-M5S-001 §6.1 + F014"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-15"
    enonce: "En 2026 : M5S = 48 députés / 400 (12%), 26 sénateurs / 205 (12,7%), 8 eurodéputés / 76 (10,5%). Ancré au centre-gauche, allié du PD."
    source_url: "https://www.camera.it/"
    source_section: "CIV-M5S-001 §0 + F017"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-16"
    enonce: "15,4% aux législatives 2022 - maintien inespéré. Entrée au gouvernement Meloni comme force d'appoint nécessaire."
    source_url: "https://www.camera.it/"
    source_section: "CIV-M5S-001 §0 + F018"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-17"
    enonce: "Grillo exclut 4 sénateurs en 2014 (purge) - premier signal d'autoritarisme interne. Les médias parlent de 'purge'."
    source_url: "https://www.corriere.it/"
    source_section: "CIV-M5S-001 §1.3 + F021"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-18"
    enonce: "Davide Casaleggio refuse publication des logs de vote, contesté RGPD sans résultat (tribunal Cagliari, 2021). Sans garantie démocratique du secret du vote, Rousseau n'est pas 'direct' mais 'simulé'."
    source_url: "https://www.politico.eu/"
    source_section: "CIV-M5S-001 §12.bis F031"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-19"
    enonce: "Grillo dépose plainte en justice italienne (mars 2026) pour récupérer la marque 'Movimento 5 Stelle' et le symbole. Le fondateur déchu conteste sa propre succession."
    source_url: "https://www.ilfattoquotidiano.it/"
    source_section: "CIV-M5S-001 §12.bis F032"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-20"
    enonce: "Podemos (Espagne) capture en 6 ans (2014-2020) vs M5S en 14 ans (2009-2023). Facteur temps variable selon configuration. BSW (Wagenknecht) reproduit le cycle populisme → institutionnalisation."
    source_url: "https://www.ivo-eu.org/"
    source_section: "CIV-M5S-001 §12.bis F033"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-21"
    enonce: "Alliance M5S-BSW (Wagenknecht) tentée en 2025, échouée faute d'effectifs (M5S < 60 parlementaires). Pas d'alliance transnationale opérationnelle."
    source_url: "https://www.woxx.eu/"
    source_section: "CIV-M5S-001 §12.bis F034"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-22"
    enonce: "196 000 adhérents (2021), estimé <100 000 en 2026. Effondrement structurel de la base militante post-Grillo."
    source_url: "https://www.movimento5stelle.it/"
    source_section: "CIV-M5S-001 §0 + F030"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-23"
    enonce: "5 mécanismes de capture identifiés : (1) sous-traitance technologique Casaleggio, (2) leadership charismatique vertical, (3) piège institutionnalisation, (4) règle 2 mandats devenue bombe, (5) absence de garde-fous statutaires."
    source_url: "https://www.bbc.com/"
    source_section: "CIV-M5S-001 §7 + §11"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-24"
    enonce: "M1 Sous-traitance technologique fatale : Casaleggio Associati contrôle blog + inscriptions + listes + Rousseau dès 2009. Le M5S n'a pas développé sa propre infrastructure numérique."
    source_url: "https://www.researchgate.net/"
    source_section: "CIV-M5S-001 §1.2 + §11 M1"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-25"
    enonce: "M2 Piège institutionnalisation : gouverner → compromis → perte identité → chute électorale → nouveaux compromis pour survivre → effondrement. Cycle auto-renforçant."
    source_url: "https://www.ansa.it/"
    source_section: "CIV-M5S-001 §11 M2"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-26"
    enonce: "M3 Règle 2 mandats accélérateur : les meilleurs partent vers concurrents → le M5S se vide de ses talents → affaiblissement structurel. Abolie trop tard novembre 2024."
    source_url: "https://www.lesoir.be/"
    source_section: "CIV-M5S-001 §11 M3"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-27"
    enonce: "M4 Absence garde-fous statutaires : Grillo et Casaleggio ont délibérément évité toute structure démocratique interne. Pas de majorité qualifiée, pas de veto, pas de clause de verrouillage."
    source_url: "https://www.economist.com/"
    source_section: "CIV-M5S-001 §11 M4"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-28"
    enonce: "Rousseau proposé aux Gilets Jaunes français (2019) - refusé. Les GJ n'ont pas voulu du modèle M5S (capture déjà documentée)."
    source_url: "https://www.franceinter.fr/"
    source_section: "CIV-M5S-001 §10 + F027"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-29"
    enonce: "Stockman & Scalia (2019, European Politics & Society) : la plateforme crée 'l'illusion du choix autonome et un autoritarisme camouflé'. Rousseau = outil de contrôle social, pas de démocratie directe."
    source_url: "https://www.tandfonline.com/"
    source_section: "CIV-M5S-001 §12 R4"
    tier: 1
    glyphe: "✦"
  - id: "F-M5S-30"
    enonce: "Krastev (Liberalism and Its Discontents, 2025) : BSW reproduit le cycle populisme → institutionnalisation. La capture n'est pas une exception italienne mais une LOI du populisme européen post-2010."
    source_url: "https://www.lrb.co.uk/"
    source_section: "CIV-M5S-001 §12.bis R8"
    tier: 1
    glyphe: "✦"

