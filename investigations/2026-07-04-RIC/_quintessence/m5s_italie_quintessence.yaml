  - "Revolving door des 60 députés partis non documenté."

wolves:
  - nom: "Casaleggio Associati (Davide Casaleggio)"
    argument: "Refus publication logs, contestation RGPD, sous-traitance 12 ans."
    reponse: "Solution Démocratique doit intégrer des garde-fous anti-capture (open-source gouvernance, taux limité, neutralité plateforme)."
  - nom: "Presse italienne mainstream (La Repubblica, Corriere, Rai)"
    argument: "M5S violemment attaqué dès 2013 → prophétie auto-réalisatrice."
    reponse: "La 'trahison' est documentée indépendamment de la presse hostile (F-M5S-07 Draghi, F-M5S-10 hémorragie, F-M5S-22 adhérents)."
  - nom: "Capture institutionnelle post-Grillo (Conte 2024+)"
    argument: "Abolition Garant + 2 mandats + ralliement centre-gauche = mort de l'ADN."
    reponse: "Solution Démocratique doit constitutionnaliser des clauses de verrouillage (majorité qualifiée 2/3 pour tout changement statutaire)."

iceberg:
  - "L'angouille M5S est la cooptation par le système représentatif (transcript Clara Egger §11)."
  - "Le précédent M5S est le miroir de Solution Démocratique : comment le Pack CivicTech-FR évite-t-il le même sort ?"
  - "Le sous-traitant Casaleggio Associati est une boîte noire technocratique (Il Foglio 2024) : la plateforme Rousseau n'a jamais été indépendante."
  - "10 000 inscrits actifs sur 10M électeurs = 0,1% - le désintérêt pour la démocratie directe est la maladie, pas la capture."

