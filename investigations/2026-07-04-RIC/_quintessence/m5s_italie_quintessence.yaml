perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le M5S n'a jamais été un mouvement de démocratie directe pleinement fonctionnel. La démocratie directe était un argument de vente politique, pas une réalité organisationnelle. Sa 'capture' est la conséquence logique de ses contradictions structurelles originelles."
  - position: "Antithèse"
    argument: "Le M5S a porté des réformes significatives (revenu de citoyenneté, décrets sécurité, alliance Salvini). Sa mutation en parti traditionnel est une stratégie de survie, pas un enterrement. 48 députés + 26 sénateurs + 8 eurodéputés restent significatifs."
  - position: "Synthèse"
    argument: "Le M5S démontre que tout mouvement de démocratie directe qui accepte le jeu institutionnel perd sa raison d'être. La capture n'est pas une exception italienne mais une LOI du populisme européen post-2010 (Podemos 6 ans, M5S 14 ans, BSW en cours)."

