causalites:
  - cause: "F-BCE02"
    effet: "F-BCE03"
    mecanisme: "Le déficit français 2024 de 6% PIB (vs seuil 3% TFUE art. 126) aboutit mécaniquement à l'ouverture PDE par Commission UE ; sanction potentielle 0,05% PIB = -2,95 Md€/an."
  - cause: "F-BCE04"
    effet: "F-BCE05"
    mecanisme: "Le vote OXI 61,31% grec 5 juillet 2015 déclenche le gel ELA BCE 28 juin + contrôle capitaux 60€/jour + fermeture banques ; produit la capitulation Tsipras en 8 jours (13 juillet)."
  - cause: "F-BCE13"
    effet: "F-BCE14"
    mecanisme: "La proposition budget Conte I (Lega-M5S) 2,4% déficit juin 2018 produit une hausse spread BTP/Bund 130→320 pdb en 6 semaines, contraignant le gouvernement à baisser le déficit à 2,04% sous pression marché sans intervention BCE directe."
  - cause: "F-BCE10"
    effet: "F-BCE21"
    mecanisme: "L'arrêt C-448/23 Pologne 2025 verrouille l'identité constitutionnelle nationale comme justification de dérogation aux traités : ferme le dernier bouclier jurisprudentiel national contre la primauté UE."
  - cause: "F-BCE11"
    effet: "F-BCE12"
    mecanisme: "TPI 2022 et OMT 2012 sont conçus avec critères cumulés de conformité Pacte + soutenabilité dette : un État qui sort délibérément du Pacte perd mécaniquement l'accès aux protections BCE."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le RIC budgétaire est techniquement condamné à l'impuissance tant que la France reste dans l'euro sans renégocier à l'unanimité des 27 ; le précédent grec 2015 démontre l'inéluctabilité de la capitulation."
  - position: "Antithèse"
    argument: "La France dispose d'art. 50 TUE pour sortir unilatéralement, techniquement sans pénalité ; le RIC budgétaire devenu déclaration de sortie aboutirait à une trajectoire Frexit économiquement coûteuse mais politiquement souveraine (cf. députés souverainistes)."
  - position: "Synthèse"
    argument: "Trois issues sont possibles : (1) renégocier les traités UE = probabilité 0 sans unanimité 27 ; (2) Sortir de la zone euro (art. 50 TUE) = légale techniquement, catastrophique économiquement, probabilité 0,05 ; (3) Restreindre le RIC aux questions non-budgétaires (fin de vie, environnement) = probabilité 0,90 mais RIC vidé de substance. Le RIC budgétaire reste un théâtre démocratique tant qu'aucune des trois issues n'est activée."

limites:
  - "L'enquête ne modélise pas explicitement le coût économique d'un Frexit complet (scénario 4) : sortie de la zone euro implique trajectoire incertaine 5-10 ans."
  - "Le Markets obligataires sanction est documentée empiriquement (Italie 2018, Grèce 2015) mais aucune preuve directe qu'une sanction de marché frapperait un RIC non-budgétaire (fin de vie, environnement)."
  - "L'article 50 TUE en sortie unilatérale : pas de jurisprudence CJUE sur activation par référendum ; le précédent Brexit 2017-2020 illustre une activation par voie parlementaire (May) puis négociation politique."
  - "La trajectoire de réduction du déficit français 2024-2028 reste floue : la Commission a validé le plan pluriannuel mais aucun engagement politique post-2027 ne garantit la trajectoire."

wolves:
  - nom: "9 propriétaires médias français (incluant économistes libéraux)"
    argument: "Cadrage médiatique dominant 'sans euro, pas d'Europe' : délégitimation de toute trajectoire Frexit."
    reponse: "La preuve empirique grecque 2015 documente qu'avec l'euro, la démocratie budgétaire est structurellement vidée de substance ; le cap est changé pour la transparence forensique."
  - nom: "Eurosceptiques politiques (RN, LR souverainistes) pro-Brexit"
    argument: "Sortir unilatéralement par art. 50 TUE ramène la souveraineté monétaire."
    reponse: "L'art. 50 TUE + réintroduction franc sont légalement praticables mais économiquement catastrophiques (modèles Grèce/Argentine) ; la discipline d'usage via RIC budgétaire intra-euro reste à explorer (renégociation conditionnelle des traités)."
  - nom: "Bundesbank / Bundesverfassungsgericht"
    argument: "Identité constitutionnelle nationale ne peut justifier dérogation (cf. arrêt PSPP/Weiss 2020) ; convergence avec CJUE C-448/23 2025."
    reponse: "L'arrêt BVerfG PSPP est une relance du débat allemand ; la convergence CJUE-BVerfG est elle-même une construction politique résultant du projet d'intégration post-1957 documenté en L4 M1."
  - nom: "Marchés obligataires (BlackRock / Vanguard / BNP / Barclays)"
    argument: "Spreads haussiers = mécanisme disciplinaire automatique non-négociable."
    reponse: "Mark Carney (BIS 2021) propose la coexistence de monnaies digitales souveraineté / stripping de la dette nationale des marchés = architecture de contournement crédible à 10-15 ans."

iceberg:
  - "Modèle Carney BIS 2021 sur monnaie digitale souveraine + stripping dette nationale des marchés : ouvre une trajectoire de contournement du verrou monétaire à 10-15 ans non documentée dans cette enquête."
  - "Tuckett (2023, Banque d'Angleterre) sur les retraits cash massifs coordinés comme levier de dernier recours : non documentée empiriquement en France ou zone euro."
  - "Mnemolite DOWN : transversalités cross-séries non explorées (cf. dossiers antérieurs Evasion Fiscale 80-100 Md€/an + Dette 3 200 Md€ qui pourraient connecter au verrou BCE)."

