lecture_status: "Complete - lecture intégrale (653 lignes source)"

these_centrale: "Le RIC budgétaire français bute sur 4 verrous cumulatifs cumulants (M1 CJUE primauté absolue + M2 BCE OMT/TPI conditionnels au Pacte + M3 marchés obligataires sanction spontanée + M4 Eurogroupe informel décisions politiques non-justiciables) qui se renforcent mutuellement : briser UN verrou ne suffit pas, le RIC budgétaire est techniquement condamné à l'impuissance tant que la France reste dans l'euro sans renégocier à l'unanimité des 27."

theses_implicites:
  - "Le précédent grec du 5 juillet 2015 (OXI 61,31% puis capitulation Tsipras 13 juillet face à gel ELA BCE) est la preuve empirique grandeur nature que la démocratie budgétaire entre en collision frontale avec l'architecture monétaire de la zone euro."
  - "Le TPI (Transmission Protection Instrument) du 21 juillet 2022 est un verrou by design : il exclut explicitement les États non conformes au Pacte de Stabilité 2024, transformant la protection monétaire en instrument de discipline politique."
  - "Le verdict C-448/23 Commission c/ Pologne (CJUE 2025) ferme définitivement la porte à l'identité constitutionnelle nationale comme justification de dérogation aux traités : plus aucun bouclier jurisprudentiel national contre la primauté du droit UE."
  - "La contrainte italienne 2018-2019 (spread BTP/Bund de 130 à 320 pdb en 6 semaines sans intervention BCE directe) démontre que les marchés obligataires opèrent comme mécanisme disciplinaire automatique plus rapide que tout mécanisme institutionnel."

faits_atomiques:
  - id: "F-BCE01"
    enonce: "Règlement UE 2024/1263 du 29 avril 2024 réforme la gouvernance du Pacte de Stabilité : transformation de la règle unique de dette en trajectoire pluriannuelle 4-7 ans ; entrée en vigueur 30 avril 2024 ; seuils 3% déficit / 60% dette TFUE art. 126 inchangés."
    source_url: "https://eur-lex.europa.eu/eli/reg/2024/1263/oj"
    source_section: "§4.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE02"
    enonce: "Déficit public français 2024 ≈ 6,0% du PIB (INSEE) ; Procédure pour Déficit Excessif (PDE) ouverte par Commission UE depuis juillet 2024."
    source_url: "https://ec.europa.eu/info/business-economy-euro/economic-governance-and-enforcement-european-semester_en"
    source_section: "§4.2"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE03"
    enonce: "Amende pour non-conformité PDE : jusqu'à 0,05% du PIB tous les 6 mois = 1,475 Md€ sur 6 mois = 2,95 Md€/an pour la France (PIB 2026 ~2 950 Md€)."
    source_url: "https://eur-lex.europa.eu/eli/reg/2024/1263/oj"
    source_section: "§4.2"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE04"
    enonce: "Référendum grec 5 juillet 2015 : OXI 61,31% vs NAI 38,69%. Référendum indicatif sur plan d'austérité."
    source_url: "https://www.ypes.gr/en/"
    source_section: "§6.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE05"
    enonce: "Tsipras capitule 13 juillet 2015 (8 jours après le référendum) face à la BCE gelant l'ELA + contrôle capitaux grec 60€/jour ; accepte 3e mémorandum plus dur que le précédent ; 2015-2018 : baisse retraites 25%."
    source_url: "https://www.consilium.europa.eu/en/press/press-releases/2015/07/13/euro-summit-statement/"
    source_section: "§6.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE06"
    enonce: "BCE gèle plafond ELA (Emergency Liquidity Assistance) grec 28 juin 2015 : fermeture banques grecques 6-12 juillet 2015."
    source_url: "https://www.ecb.europa.eu/"
    source_section: "§6.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE07"
    enonce: "Arrêt Costa c/ ENEL (CJUE 6/64, 1964) : droit né du Traité prime sur toute disposition légale nationale ; États ont limité leurs droits souverains au profit d'un ordre juridique intégré."
    source_url: "https://curia.europa.eu/juris/showPdf.jsf?docid=14782"
    source_section: "§5.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE08"
    enonce: "Arrêt Internationale Handelsgesellschaft (CJUE 11/70, 1970) : primauté du droit UE sur les textes constitutionnels nationaux (pas seulement la loi)."
    source_url: "https://curia.europa.eu/juris/showPdf.jsf?docid=14980"
    source_section: "§5.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE09"
    enonce: "Arrêt Simmenthal (CJUE 106/77, 1977) : tout juge national doit écarter d'office une règle interne contraire au droit UE."
    source_url: "https://curia.europa.eu/juris/showPdf.jsf?docid=15029"
    source_section: "§5.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE10"
    enonce: "Arrêt C-448/23 Commission c/ Pologne (CJUE 2025) : identité constitutionnelle nationale ne peut servir à déroger aux obligations des traités ; CJUE est seule autorité compétente pour déterminer les limites des compétences UE ; aucune juridiction nationale ne peut déclarer un acte ultra vires."
    source_url: "https://curia.europa.eu/juris/liste.jsf?num=C-448/23"
    source_section: "§5.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE11"
    enonce: "TPI (Transmission Protection Instrument) lancé 21 juillet 2022 (décision BCE 2022/625) : protection contre fragmentation injustifiée des taux MAIS éligibilité conditionnelle cumulative : conformité Pacte + absence déséquilibres macroéconomiques + soutenabilité dette documentée."
    source_url: "https://www.ecb.europa.eu/press/pr/date/2022/html/ecb.pr220721~973e6e7273.en.html"
    source_section: "§7.2"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE12"
    enonce: "OMT 2012 (Outright Monetary Transactions) : conditionnée à mise sous programme MES complet ou de précaution ; un État qui sort délibérément du Pacte refuse par définition le programme d'ajustement, donc OMT indisponible."
    source_url: "https://www.ecb.europa.eu/press/pr/date/2012/html/pr120906_1.en.html"
    source_section: "§7.3"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE13"
    enonce: "Cas Italie 2018-2019 : gouvernement Conte I (Lega-M5S) propose budget 2,4% déficit en juin 2018 ; spread BTP/Bund monte de 130 à 320 pdb en 6 semaines ; compromis décembre 2018 ramène déficit à 2,04% en 2019."
    source_url: "https://www.mef.gov.it/en/"
    source_section: "§6.2"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE14"
    enonce: "Italie 2018 : contrainte par marché sans intervention BCE directe ; Commission UE fenêtre verbale mais pas de sanction formelle."
    source_url: "https://ec.europa.eu/info/business-economy-euro/economic-governance-and-enforcement-european-semester_en"
    source_section: "§6.2"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE15"
    enonce: "Arrêt Mallis (CJUE C-105/15, 20 juin 2016) : décisions Eurogroupe ne sont pas des actes juridiquement contraignants attaquables. Asymétrie structurelle entre politique économique et contrôle juridictionnel."
    source_url: "https://curia.europa.eu/juris/liste.jsf?num=C-105/15"
    source_section: "§5.2"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE16"
    enonce: "Article 50 TUE (13 décembre 2007 Lisbonne) : sortie unilatérale de l'UE par notification. Précédent Brexit 2017-2020. Pas de jurisprudence CJUE sur activation par référendum."
    source_url: "https://www.treaty-articles.info/50_TUE.pdf"
    source_section: "§6.2"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE17"
    enonce: "Traité de Maastricht 7 février 1992 : création UEM et BCE. Article 123 TFUE interdit financement monétaire des États ; article 130 TFUE consacre indépendance BCE vis-à-vis des États."
    source_url: "https://eur-lex.europa.eu/eli/treaty/tfeu_2012/oj"
    source_section: "§11 (L4 M2)"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE18"
    enonce: "Spread OAT/Bund fin 2025 : ~50 pb en temps normal. Crise grecque 2015 : OAT/Bund +700 pdb. Crise italienne 2018-2019 : BTP/Bund +190 pdb."
    source_url: "https://www.aft.gouv.fr/"
    source_section: "§7"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE19"
    enonce: "Spread OAT/Bund 10 ans au 3 juillet 2026 : 76 pb (AFT - Agence France Trésor / Idéal Investisseur 2026). En baisse depuis 88 pb en juillet 2024."
    source_url: "https://www.aft.gouv.fr/"
    source_section: "§6"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE20"
    enonce: "Coût d'un spread à 200 pdb pendant 6 mois : +25-50 Md€ supplémentaires pour la France (France refinance ~25% de sa dette chaque année ; modélisation BCE/marchés)."
    source_url: "https://www.bis.org/publ/work354.pdf"
    source_section: "§11 (L3 M3)"
    tier: 2
    glyphe: "✧"
  - id: "F-BCE21"
    enonce: "Article 4.3 TUE (loyauté mutuelle) : fondement juridique du consentement initial des États à la primauté UE. Maastricht 1992 référendum 51,05% OUI : consentement considéré comme définitif (adhésion volontaire et durable)."
    source_url: "https://eur-lex.europa.eu/eli/treaty/tfeu_2012/oj"
    source_section: "§11 (L4 M1)"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE22"
    enonce: "PSPP/Weiss (CJUE 2020) : limites à l'identité constitutionnelle réaffirmées post-arrêt Bundesverfassungsgericht 5 mai 2020 sur OMT."
    source_url: "https://curia.europa.eu/juris/liste.jsf?num=C-493/17"
    source_section: "§5.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE23"
    enonce: "Pisani-Ferry (2018) : la sortie de l'euro n'est concevable que pour les États non-stratégiques ; pour les États fondateurs, l'euro est un verrou non-négociable."
    source_url: "https://pisani-ferry.com/"
    source_section: "§11 (R1)"
    tier: 2
    glyphe: "✧"
  - id: "F-BCE24"
    enonce: "Bibow (2013) : la BCE a construit depuis 2010-2012 un arsenal de protection (OMT, TPI) qui fonctionnent comme boucliers unilatéraux mais peuvent être retirés à discrétion."
    source_url: "https://www.levyinstitute.org/"
    source_section: "§11 (R1)"
    tier: 2
    glyphe: "✧"
  - id: "F-BCE25"
    enonce: "Varoufakis (2017, *Adults in the Room*) : le 13 juillet 2015 est le jour où la démocratie grecque a perdu ; la BCE a utilisé l'ELA comme arme économique."
    source_url: "https://yannisvaroufakis.eu/"
    source_section: "§11 (R3)"
    tier: 2
    glyphe: "✧"
  - id: "F-BCE26"
    enonce: "Crise grecque 2010-2018 : ajustements structurels massifs (réduction retraites, hausse TVA, privatisations) sous contrôle UE ; charge fiscale grecque toujours élevée post-programme 2018."
    source_url: "https://www.imf.org/en/Countries/GRC"
    source_section: "§6.1"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE27"
    enonce: "Article 127 TFUE + Article 18 statut SEBC : mandat BCE ; stabilité des prix uniquement ; pas de considération démocratique."
    source_url: "https://eur-lex.europa.eu/eli/treaty/tfeu_2012/oj"
    source_section: "§11 (L2 M2)"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE28"
    enonce: "ESM (Mécanisme européen de stabilité) : prêts conditionnels - programme d'ajustement strict + surveillance Commission + BCE + ESM ; perte souveraineté budgétaire effective durant le programme ESM."
    source_url: "https://www.esm.europa.eu/"
    source_section: "§7.4"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE29"
    enonce: "Loi organique allemande 2017 sur le TSCG : fusion des règles européennes du Traité sur la Stabilité, la Coordination et la Gouvernance dans l'ordre national. Témoignage du verrou interne créé par les traités."
    source_url: "https://www.bundesverfassungsgericht.de/"
    source_section: "§10 (F-BCE20)"
    tier: 1
    glyphe: "✦"
  - id: "F-BCE30"
    enonce: "Marché obligataire mondial : ~120 000 Md€ (Borio/Disyatat BIS 2011). États en concurrence pour financement : conditionnalité soft via spread plus rapide que conditionnalité hard du Pacte (PDE)."
    source_url: "https://www.bis.org/publ/work352.htm"
    source_section: "§11 (L4 M3)"
    tier: 2
    glyphe: "✧"

