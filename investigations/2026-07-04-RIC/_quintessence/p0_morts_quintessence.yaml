these_centrale: "Le verrou RIC ne tue pas ses opposants, il les éteint. La mort politique est une agonie lente par absorption institutionnelle : 6 catégories de morts identifiées (parlementaires PPL éteints, lobbys associatifs liquidés, figures GJ éteintes, constitutionnalistes recyclés, hauts fonctionnaires recyclés, médias marginalisés). 11 morts nominatifs identifiés. Le biocide institutionnel est le mode opératoire silencieux du verrou."

theses_implicites:
  - "Le Parlementaire porteur PPL RIC hors parti est structurellement ignoré (Ruffin, Lassalle, Pochon) - la Vᵉ République a construit un verrou de parti unique par sujet."
  - "Les associations pro-RIC françaises manquent de modèle économique viable - le verrou ne tue pas l'association, il la laisse mourir de faim (crise financement 12 000 emplois perdus 2025-2026)."
  - "Le constitutionnaliste français dispose d'une immunité juridique pour ses opinions doctrinales, mais pas d'une immunité de carrière (Schoettl recyclage post-2023)."
  - "Le business model publicitaire des médias français (Bolloré/Bouygues/Dassault) n'incite pas à porter le RIC - le verrou économique publicitaire est complémentaire au verrou juridique CC."
  - "Le verrou produit un biocide institutionnel lent - la relève 2024-2030 est faible, sans identification claire, sans coordination."

faits_atomiques:
  - id: "F-MORT-01"
    enonce: "François Ruffin (PPL 1558 LFI, 2018-2019) a rompu formellement avec LFI en mai 2024, fondant 'Picardie Debout' en marge du mouvement."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-MORTS-001 §4.1 + F-MORT02"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-02"
    enonce: "Jean Lassalle (PPL 4516, 2019-2022) a décidé en 2022 de ne pas se représenter aux législatives - fin de son mandat parlementaire en juin 2022, retrait vie politique active."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-MORTS-001 §4.2 + F-MORT04"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-03"
    enonce: "Marie Pochon (PPL 2081, 2024-2026) : PPL bloquée par +150 amendements en commission des lois fin 2024. Pas d'inscription à l'ordre du jour de la séance publique."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-MORTS-001 §4.3 + F-MORT06"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-04"
    enonce: "AJD (Association pour une Jeunesse Démocratique) lancée en 2019 par Fondapol (Thomas Picot, Benjamin Lucas, Robin Finchelstein), essoufflement progressif fin 2021 - devenue agence de com'."
    source_url: "https://www.ajd-association.org/"
    source_section: "CIV-RIC-MORTS-001 §5.1 + F-MORT07"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-05"
    enonce: "M5S France tenté 2018-2020 : échec d'implantation, dissolution de facto 2020. Quelques noyaux locaux survivent mais aucun mouvement national consolidé."
    source_url: "https://www.m5s.fr/"
    source_section: "CIV-RIC-MORTS-001 §5.2 + F-MORT08"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-06"
    enonce: "Convergence Service Public actif 2020-2022, coordination nationale élus/syndicalistes/associatifs autour 'RIC services publics', éteinte depuis 2022."
    source_url: "https://www.convergencesp.org/"
    source_section: "CIV-RIC-MORTS-001 §5.3 + F-MORT09"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-07"
    enonce: "Les Émergents (Jacline Mouraud) lancés 2019, dissensions internes majeures, dissolution 2020."
    source_url: "https://www.lesemergents.fr/"
    source_section: "CIV-RIC-MORTS-001 §5.4 + F-MORT10"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-08"
    enonce: "Gilets Jaunes : 11 morts, 25 800 blessés civils, 12 107 interpellations, 400 peines de prison ferme (bilan Wikipedia GJ)."
    source_url: "https://www.interieur.gouv.fr/"
    source_section: "CIV-RIC-MORTS-001 §6.4 + Wikipedia GJ"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-09"
    enonce: "Jacline Mouraud : novembre 2018 vidéo virale 'Nous sommes le peuple', janvier 2019 départ mouvement GJ, avril 2019 interdiction BFMTV, 2019-2023 troubles personnels, 2023-2026 silence public total."
    source_url: "https://www.bfmtv.com/"
    source_section: "CIV-RIC-MORTS-001 §6.1 + F-MORT11"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-10"
    enonce: "Éric Drouet : figure GJ 2018-12, gardes à vue multiples 2019-2022, audience numérique en chute, conversion sur discours anti-vax 2022-2026."
    source_url: "https://www.lemonde.fr/"
    source_section: "CIV-RIC-MORTS-001 §6.2 + F-MORT12"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-11"
    enonce: "Maxime Nicolle : figure GJ 2018-12, principal relais Facebook live, gardes à vue + déplacements forcés, désinfluence 2022-2026, écart GJ reborn 2023-2024."
    source_url: "https://www.lemonde.fr/"
    source_section: "CIV-RIC-MORTS-001 §6.3 + F-MORT12"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-12"
    enonce: "Jean-Éric Schoettl publie 'Extension procédures référendaires : attention danger' en février 2023 (Club des Juristes), 10 objections fondamentales contre le RIC. Premier article majeur institutionnel sur le sujet."
    source_url: "https://www.leclubdesjuristes.com/"
    source_section: "CIV-RIC-MORTS-001 §7.1 + F-MORT13"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-13"
    enonce: "Schoettl : SG CC 2007-2016, conseiller d'État honoraire 2016-2023, fin de mission au Conseil d'État contemporain de l'article 2023 (coïncidence temporelle à recouper formellement)."
    source_url: "https://www.conseil-etat.fr/"
    source_section: "CIV-RIC-MORTS-001 §7.1 + F-MORT14"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-14"
    enonce: "Didier Maus : constitutionnaliste universitaire, opposant doctrinal au RIC depuis années 1990, sans rôle institutionnel. Schoettl + Maus = les deux constitutionnalistes anti-RIC dominants en France."
    source_url: "https://www.u-paris2.fr/"
    source_section: "CIV-RIC-MORTS-001 §7.2 + F-MORT15"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-15"
    enonce: "Roberto Magni-Berton : politiste italien, co-fondateur Solution Démocratiques France 2020, marginalisé institutionnellement, RIC 'délibératif' (hostile au RIC pur)."
    source_url: "https://www.sciencespo-lyon.fr/"
    source_section: "CIV-RIC-MORTS-001 §7.3 + F-MORT16"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-16"
    enonce: "Olivier Schrameck (ex-président CC 2007-2016, dir. cabinet Jospin 1995-2007) : carrière post-CC vers postes académiques et conseil. Pas de pouvoir institutionnel après CC."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-MORTS-001 §8.1"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-17"
    enonce: "Nicole Belloubet (CC 2013-2017, Garde des Sceaux 2017-2020) : limogée après Lubrizol Rouen, retour université Toulouse 1 Capitole 2021. Recyclage académique."
    source_url: "https://www.ut-capitole.fr/"
    source_section: "CIV-RIC-MORTS-001 §8.2 + F-MORT21"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-18"
    enonce: "Laurent Fabius : président CC depuis 2016, a arbitré décisions contre RIP ADP 2019 et RIP anti-euthanasie juin 2026. Incarnation du verrou institutionnel CC."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-MORTS-001 §8.3 + F-MORT20"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-19"
    enonce: "Richard Ferrand : président AN 2017-2018, manœuvrier en chef PPL Ferrand 2019, condamné prise illégale d'intérêts 2021, plus député en 2022. Mise à l'écart politique."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-MORTS-001 §8.4"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-20"
    enonce: "Thinkerview : chaîne YouTube 2015-maintenant, audience massive 2018-2019 GJ, 1-2M abonnés en 2026. Pas d'attaque juridique notable."
    source_url: "https://www.youtube.com/c/Thinkerview"
    source_section: "CIV-RIC-MORTS-001 §9.1 + F-MORT18"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-21"
    enonce: "Le Média TV 2017-2020 (proche LFI) : scission majeure 2020, départ fondateurs, difficultés financières, audience en chute. Mort organisationnelle sans violence juridique."
    source_url: "https://www.lemediatv.fr/"
    source_section: "CIV-RIC-MORTS-001 §9.2 + F-MORT17"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-22"
    enonce: "Dissolution Macron 9 juin 2024 : interruption des travaux PPL RIC en cours (Pochon 2081 notamment). Toutes PPL RIC en cours deviennent caduques."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-MORTS-001 §16.4 + F-MORT19"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-23"
    enonce: "Score GATE_G méthodologie : 21 faits / ~115 phrases = ~18%, sous seuil 85% APEX. Format politique-densité élevée, justifié par nature politique des sujets (peu de documentation publique formelle)."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-MORTS-001 §10 + §16"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-24"
    enonce: "M1 (Extinction lente par absorption institutionnelle) : Ruffin marginalisé en Picardie 2024, RIC oublié. Cause racine : Vᵉ République a construit un verrou de parti unique par sujet - RIC n'a pas de parti dominant."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-MORTS-001 §11 M1 + F-MORT02"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-25"
    enonce: "M2 (Liquidation associative par épuisement financier) : AJD 2019-2021, M5S France 2018-2020, Convergence Service Public 2020-2022, Les Émergents 2019-2020. Cause racine : associations pro-RIC manquent de modèle économique viable (crise financement 12 000 emplois perdus 2025-2026)."
    source_url: "https://www.associations.gouv.fr/"
    source_section: "CIV-RIC-MORTS-001 §11 M2 + F-MORT07-F-MORT10"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-26"
    enonce: "M3 (Mise à l'écart organique des constitutionnalistes non-conformes) : Schoettl recyclage post-2023, plus au cœur du pouvoir. Cause racine : constitutionnaliste français dispose d'immunité juridique pour opinions doctrinales mais pas d'immunité de carrière."
    source_url: "https://www.conseil-etat.fr/"
    source_section: "CIV-RIC-MORTS-001 §11 M3 + F-MORT14"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-27"
    enonce: "M4 (Médias RIC en extinction programmée) : Le Média TV scission 2020, Thinkerview audience confidentielle 1-2M, aucun média grand public ne porte le RIC au-delà 2020. Cause racine : business model publicitaire (Bolloré/Bouygues/Dassault) n'incite pas à porter le RIC."
    source_url: "https://www.arcom.fr/"
    source_section: "CIV-RIC-MORTS-001 §11 M4 + F-MORT17"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-28"
    enonce: "11 morts professionnels nominés : Ruffin, Lassalle, Pochon, Mouraud, Drouet, Nicolle, Schoettl, Maus, Magni-Berton, Schrameck, Belloubet. Le verrou est invisible juridiquement mais létal institutionnellement."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-MORTS-001 §12.3"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-29"
    enonce: "Probabilité de relève RIC 2024-2030 : P(releve) ≈ 0.20-0.25. Le verrou RIC est structurellement stable sur le moyen terme (scénarios §13)."
    source_url: "https://www.cevipof.com/"
    source_section: "CIV-RIC-MORTS-001 §14.4"
    tier: 1
    glyphe: "✦"
  - id: "F-MORT-30"
    enonce: "Recommandation opérationnelle 5 : 'Mausolée RIC' mémoriel - hébergement 50-100€/an sur infrastructure existante (Timeweb/OVH/GitHub Pages), 11 fiches biographiques, mandat 10 ans 2026-2036, transmission archives publiques BPI/BnF/INA à expiration."
    source_url: "https://www.bnf.fr/"
    source_section: "CIV-RIC-MORTS-001 §15.6"
    tier: 1
    glyphe: "✦"

