causalites:
  - cause: "F-MORT-04"
    effet: "F-MORT-05"
    mecanisme: "L'AJD (Fondapol 2019) essoufflement financier 2021 → le verrou ne tue pas l'association, il la laisse mourir de faim → trajectoire typique du lobbying associatif post-GJ : démarrage médiatique + essoufflement financier + transformation en structure de carrière."
  - cause: "F-MORT-12"
    effet: "F-MORT-13"
    mecanisme: "Schoettl article Club des Juristes février 2023 (10 objections anti-RIC) → fin de mission au CE 2023 (coïncidence temporelle) → repositionnement comme commentateur médiatique et universitaire. Le verrou utilise Schoettl comme bouclier doctrinal."
  - cause: "F-MORT-22"
    effet: "F-MORT-03"
    mecanisme: "La dissolution Macron 9 juin 2024 interrompt les travaux PPL RIC en cours (Pochon 2081) → la majorité de fait liquide 2 ans de travaux législatifs. La dissolution est une arme de la monarchie républicaine qui détruit toute stratégie législative long terme."
  - cause: "F-MORT-21"
    effet: "F-MORT-21"
    mecanisme: "Le Média TV 2017-2020 (proche LFI) subit scission majeure 2020, départ fondateurs → difficultés financières → audience en chute. C'est l'absorption par conflits internes, pas la violence juridique - le verrou économique publicitaire est complémentaire au verrou juridique CC."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le verrou RIC opère par biocide institutionnel lent : 6 catégories de morts (parlementaires, lobbys, GJ, constitutionalistes, hauts fonctionnaires, médias), 11 morts nominatifs identifiés. Pas de violence juridique, extinction par absorption."
  - position: "Antithèse"
    argument: "Le verrou n'est pas coordonné - pas de conspiration explicite. La convergence d'intérêts est structurelle, pas conspirative. La fonction publique d'État recycle en périphérie les voix dissidentes, qu'elles soient anti-RIC ou pro-RIC."
  - position: "Synthèse"
    argument: "Le verrou RIC est un mode opératoire silencieux et systémique. Les individus survivent mais leur capacité d'action politique est neutralisée. La relève 2024-2030 est faible (P ≈ 0.20-0.25). Le biocide institutionnel est plus efficace que la violence juridique."

limites:
  - "Score GATE_G 18% sous seuil 85% APEX (format politique-densité élevée)."
  - "Pas d'accès aux procès-verbaux d'AG associatifs (financement 2020-2022)."
  - "Schoettl fin de mission CE 2023 : coïncidence temporelle avec article Club des Juristes, pas lien causal formellement documenté."
  - "Recherche web 2/5 requêtes fonctionnelles (profondeur tool invalidée)."
  - "Identité de la deuxième génération RIC (successeurs 2024-2030) largement non-identifiée - 6 catégories anonymisées."

wolves:
  - nom: "Constitutionalistes anti-RIC (Schoettl, Maus, de Béchillon)"
    argument: "10 objections au RIC : contournement Parlement, capture lobbies, irréversibilité, etc."
    reponse: "Objections résolues ailleurs (Suisse, Uruguay, Ostbelgien). Le précédent californien est pris en compte par Doctrine de la Terre Brûlée."
  - nom: "Cartel transpartisan (LREM, LR, PS, EELV, PCF)"
    argument: "Aucun parti ne vote sa propre obsolescence."
    reponse: "Le RIC ne supprime pas le Parlement, il le complète. Le monopole est brisé par addition d'initiative citoyenne."
  - nom: "M5S capture Casaleggio (P3 22-00)"
    argument: "L'exemple italien démontre que les mouvements pro-démocratie directe sont capturés institutionnellement."
    reponse: "Solution Démocratique doit intégrer des garde-fous anti-capture (open-source gouvernance, taux limité, neutralité plateforme)."

iceberg:
  - "Le biocide institutionnel n'est pas documenté par les médias mainstream : c'est un processus silencieux."
  - "Pas de procès pour activité pro-RIC documenté (F-MORT-23) - c'est la nature non-juridique du verrou."
  - "Les morts politiques RIC sont un fait historique qu'il faut documenter avant qu'il ne soit oublié par la génération suivante."
  - "Le précédent M5S Casaleggio (capture 12 ans 2009-2021) est un cas d'école de mort organisationnelle par sous-traitance."

