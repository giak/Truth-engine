  - "Le point sur Dassault/Outscale : ces industriels ne sont pas objecteurs catholiques, leur capacité religieuse est hypothétique non-vérifiée."
  - "Position fondamentaliste FSSPX peu documentée publiquement (registre)."

wolves:
