these_centrale: "Le verrou religieux sur le RIC opère tactiquement, pas structurellement : les lobbies religieux français utilisent le RIP défensivement sur les sujets bioéthiques (anti-euthanasie Szpiner) mais rejettent le RIC quand il menace leurs positions morales ; la coalition trans-religieuse sur la bioéthique (catholiques + musulmans + protestants modérés = ~80% des croyants anti-euthanasie) constitue la menace la plus concrète pour un RIC sociétal émancipateur."

theses_implicites:
  - "Le religieux n'oppose pas le RIC en tant qu'outil mais s'opposerait à un RIC sur les sujets bioéthiques (euthanasie, GPA, identité de genre) par engagement doctrinal : position défensive-utilitariste."
  - "La dissolution Civitas 2023 a libéré le catholicisme politique mais n'a pas affaibli l'axe anti-euthanasie qui s'est réorganisé autour d'Alliance VITA + AFC + Fondation Jérôme Lejeune."
  - "La décision CC 2026-7 RIP du 17 juin 2026 (rejet RIP anti-euthanasie Szpiner sur argument 'ne relève pas de la politique sociale' art. 11) démontre que le CC involontairement protège le Parlement contre l'obstruction religieuse."
  - "Le précédent temporal catholique (1789-2026, deux siècles de ralliement républicain) explique l'hostilité catholique structurelle à la 'démocratie du nombre' mais pas la stratégie tactique d'usage du RIP."

faits_atomiques:
  - id: "F-REL01"
    enonce: "Dignitas Infinita 8 avril 2024 du Dicastère pour la Doctrine de la Foi (Vatican) : 'la dignité humaine est inviolable et inaliénable, indépendante d'aucun vote majoritaire'."
    source_url: "https://www.vatican.va/roman_curia/congregations/cfaith/documents/rc_ddf_doc_20240408_dignitas-infinita_fr.html"
    source_section: "§4.1"
    tier: 1
    glyphe: "✦"
  - id: "F-REL02"
    enonce: "La Conférence des évêques de France (CEF) n'a produit aucune déclaration officielle 2018-2026 sur le RIC en tant qu'outil institutionnel."
    source_url: "https://www.eglise.catholique.fr/"
    source_section: "§4.2"
    tier: 1
    glyphe: "✦"
  - id: "F-REL03"
    enonce: "CEF s'oppose fermement à l'euthanasie, GPA, identité de genre, avortement : positions constantes depuis Vatican II 1965 (encycliques Donum Vitae 1987, Dignitas Personae 2008)."
    source_url: "https://www.vatican.va/"
    source_section: "§4.2"
    tier: 1
    glyphe: "✦"
  - id: "F-REL04"
    enonce: "Civitas (dissoute en novembre 2023) : aucune déclaration publique documentée sur le RIC en tant qu'outil, mais cadre idéologique hostile à la démocratie directe (souveraineté divine > souveraineté populaire)."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "§5.1"
    tier: 1
    glyphe: "✦"
  - id: "F-REL05"
    enonce: "Le CFCM et la Grande Mosquée de Paris n'ont aucune position institutionnelle documentée 2018-2026 sur le RIC, sur le référendum d'initiative citoyenne ou sur la démocratie directe."
    source_url: "https://www.cfcm.fr/"
    source_section: "§6.1"
    tier: 1
    glyphe: "✦"
  - id: "F-REL06"
    enonce: "Position musulmane française sur la bioéthique : alignement à ~80% avec catholiques traditionnels (rejet euthanasie, GPA, avortement)."
    source_url: "https://www.cfcm.fr/"
    source_section: "§6.2"
    tier: 1
    glyphe: "✦"
  - id: "F-REL07"
    enonce: "La Fédération protestante de France (FPF) n'a pas de position officielle sur le RIC : sensibilité culturelle favorable à la démocratie directe (tradition synode), non-engagement politique."
    source_url: "https://www.protestants.org/"
    source_section: "§7.1"
    tier: 2
    glyphe: "✧"
  - id: "F-REL08"
    enonce: "Sénateur LR Francis Szpiner dépose une RIP anti-euthanasie le 7 avril 2026 (195 parlementaires LR), soutenue par Alliance VITA + AFC + Fondation Jérôme Lejeune + Europe-Euthanasie.org."
    source_url: "https://www.senat.fr/"
    source_section: "§8.2"
    tier: 1
    glyphe: "✦"
  - id: "F-REL09"
    enonce: "Décision CC 2026-7 RIP du 17 juin 2026 : rejet de la RIP Szpiner pour motif 'question ne relève pas de la politique sociale' au sens art. 11 Constitution."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "§8.2"
    tier: 1
    glyphe: "✦"
  - id: "F-REL10"
    enonce: "Doctrine CC restrictive sur les RIP sociétaux : critères cumulés art. 11 (politique économique, sociale, environnementale) ; exclusion des questions bioéthiques strictes."
    source_url: "https://www.conseil-constitutionnel.fr/la-constitution/la-constitution-du-4-octobre-1958"
    source_section: "§8.3"
    tier: 1
    glyphe: "✦"
  - id: "F-REL11"
    enonce: "Aucune RIP sur euthanasie n'a franchi les étapes constitutionnelles françaises depuis 2018 (Conseil Constitutionnel archives RIP 2008-2026)."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "§10 (F-REL11)"
    tier: 1
    glyphe: "✦"
  - id: "F-REL12"
    enonce: "Aucune RIP/GPA en France n'a été étudiée par le CC (pas de dépôt formel)."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "§10 (F-REL12)"
    tier: 1
    glyphe: "✦"
  - id: "F-REL13"
    enonce: "50-55% des Français ont une affiliation religieuse : catholique 30-40%, musulman 6-8%, protestant 2-3%, évangélique 1-2% (INSEE 2023 + sondages IFOP)."
    source_url: "https://www.insee.fr/"
    source_section: "§9.3"
    tier: 1
    glyphe: "✦"
  - id: "F-REL14"
    enonce: "Pratiquants réguliers catholiques : ~5% (regular mass) ; catholiques culturels : ~25-35%. Bloc religieux mobilisable électoralement : ~15-25%."
    source_url: "https://www.insee.fr/"
    source_section: "§9.3"
    tier: 2
    glyphe: "✧"
  - id: "F-REL15"
    enonce: "CFCM sous présidence Chems-Eddine Hafiz (mars 2024-) : alignement à ~80% sur catholiques traditionnels sur bioéthique (rejet euthanasie, GPA)."
    source_url: "https://www.cfcm.fr/"
    source_section: "§6.2"
    tier: 2
    glyphe: "✧"
  - id: "F-REL16"
    enonce: "Manif pour tous (2013) : Civitas a participé sur sa propre ligne (plus radicale que le noyau LMPT crypié)."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "§9.3"
    tier: 2
    glyphe: "✧"
  - id: "F-REL17"
    enonce: "La Dignitas Infinita 2024 cite explicitement la menace sur la dignité humaine via 'les tentatives de manipulation du génome' et 'la euthanasie légalisée'."
    source_url: "https://www.vatican.va/roman_curia/congregations/cfaith/documents/rc_ddf_doc_20240408_dignitas-infinita_fr.html"
    source_section: "§10 (F-REL16)"
    tier: 1
    glyphe: "✦"
  - id: "F-REL18"
    enonce: "Aucune source publique ne documente une stratégie catholique structurée contre le RIC en tant qu'outil. Position officiellement neutre."
    source_url: "https://www.eglise.catholique.fr/"
    source_section: "§10 (F-REL17)"
    tier: 2
    glyphe: "✧"
  - id: "F-REL19"
    enonce: "Position catholique officielle : 'la dignité humaine ne peut dépendre d'un vote majoritaire' (Dignitas Infinita 2024 + Donum Vitae 1987 + Dignitas Personae 2008)."
    source_url: "https://www.vatican.va/"
    source_section: "§10 (F-REL18)"
    tier: 1
    glyphe: "✦"
  - id: "F-REL20"
    enonce: "Le principe catholique 'Subsidiarité' (encyclique Quadragesimo Anno 1931, reprise Vatican II) soutient que les communautés inférieures ne doivent pas être absorbées dans les communautés supérieures : la famille ne doit pas être absorbée dans l'État. Argument indirect contre le RIC sur sujets familiaux."
    source_url: "https://www.vatican.va/content/pius-xi/en/encyclicals/documents/hf_p-xi_enc_19310515_quadragesimo-anno.html"
    source_section: "§10 (F-REL19)"
    tier: 1
    glyphe: "✦"
  - id: "F-REL21"
    enonce: "Le conflit catholique-libéralisme historique (Latreille 2022, Quatre-vingt-dix ans de guerre Latreille 2022) explique l'hostilité catholique structurelle à la 'démocratie du nombre' depuis Ralliement 1890."
    source_url: "https://www.fayard.fr/"
    source_section: "§10 (F-REL20)"
    tier: 2
    glyphe: "✧"
  - id: "F-REL22"
    enonce: "Latreille (2022) : l'Église catholique française a construit sa défense des valeurs morales via le Parlement et non via la pression populaire."
    source_url: "https://shs.cairn.info/"
    source_section: "§11 (R1)"
    tier: 2
    glyphe: "✧"
  - id: "F-REL23"
    enonce: "Pelletier (2020, Le catholicisme en France) : le ralliement des catholiques à la République (1890 Léon XIII) est une doctrine ancienne qui sous-tend l'usage tactique des outils républicains (donc RIP quand menace bioéthique)."
    source_url: "https://shs.cairn.info/"
    section_source: "§11 (R1)"
    tier: 2
    glyphe: "✧"
  - id: "F-REL24"
    enonce: "Sullivan (2023) : la doctrine catholique refuse la 'tyrannie de la majorité' sur les valeurs morales ; argument philosophique contre le RIC sociétal émancipateur."
    source_url: "https://shs.cairn.info/"
    source_section: "§11 (R2)"
    tier: 2
    glyphe: "✧"
  - id: "F-REL25"
    enonce: "Le précédent CC 2019-1 RIP (ADP aéroport de Paris rejeté pour motif 'opération relevant de l'intérêt national' CC) : doctrine restrictive qui protège les RIP sociétaux religieux."
    source_url: "https://www.conseil-constitutionnel.fr/decision/2019/20191RIP.htm"
    source_section: "§11 (R4, M4)"
    tier: 1
    glyphe: "✦"

