    argument: "Position officielle : 'la CEF ne s'oppose pas au RIC en tant qu'outil, et reste vigilante morale sur la bioéthique'."
    reponse: "Même position officielle neutre sur l'outil = veto implicite sur substance (euthanasie, GPA) ; RIC-Neutralité-explorée entre vigilance morale et engagement politique."
  - nom: "Jean-Pierre Mignard (avocat LMPT)"
    argument: "Combat pro-sociétale 'Manif pour tous' 2013 : le RIC renforce la société civile dans ses demandes progressistes."
    reponse: "Mignard lui-même critique le RIC quand il menace ses positions sur GPA ; la 'société civile' est hétérogène."
  - nom: "Réseau CivicTech-FR (Egger, Magni-Berton)"
    argument: "Le RIC est un outil universel qui transcende les clivages religieux."
    reponse: "Le RIC ne transcende pas la bioéthique : la coalition catholique+musulmane (~50% français) reste massivement hostiles à RIC sur euthanasia ; recentrage nécessaire."

