perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le religieux est un acteur opportuniste et défensif, pas un blocage structurel permanent : PRO-RIP quand le RIP sert à bloquer une réforme anti-RIC religieuse (anti-euthanasie), ANTI-RIP quand le RIP menace ses positions (RIC sur GPA, familles), NEUTRE sur RIC non-bioéthique."
  - position: "Antithèse"
    argument: "La coalition trans-religieuse sur la bioéthique (80% des croyants) constitue un point de résistance culturelle non-négociable face à un RIC sociétal émancipateur (euthanasie, GPA) ; sans stratégie d'évitement, le RIC bioéthique se heurtera à une résistance massive."
  - position: "Synthèse"
    argument: "Le RIC programme-doit concentrier sur les questions techniquement et culturellement sécurisées (numérique, système pénal, gouvernance locale) plutôt que sur bioéthique afin de neutraliser le veto religieux latent. Le RIC constitutionnel RIC-renforcement resterait structurellement bloqué par CC art. 89 al. 4."

limites:
