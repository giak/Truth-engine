causalites:
  - cause: "F-VI-05"
    effet: "F-VI-09"
    mecanisme: "L'OMT BCE (2012) + TPI BCE (2022) avec conditionnalité MES produisent le verrou monétaire algorithmique : spread BTP/Bund italien passe de 130 pdb (juin 2018) à 320 pdb (octobre 2018). Aucun décideur nominatif ne fixe le spread - c'est l'algorithme de marché."
  - cause: "F-VI-01"
    effet: "F-VI-02"
    mecanisme: "L'activation art. 16 (1961) + arrêt Rubin de Servens (CE 1962) démontrent que l'art. 16 = acte de gouvernement sans recours juridictionnel. Le verrou militaro-sécuritaire est juridiquement disponible mais jamais utilisé depuis 1961."
  - cause: "F-VI-21"
    effet: "F-VI-29"
    mecanisme: "Le Steering Committee Bilderberg (Castries Institut Montaigne + Baudson Amundi + Vassy Sciences Po) socialise les élites françaises vers l'alignement culturel technocratique - la doctrine anti-RIC est importée via ce réseau, pas produite en France."
  - cause: "F-VI-18"
    effet: "F-VI-23"
    mecanisme: "Le pantouflage IGF → Rothschild/Lazard/BNP/Société Générale (Anne-Cécile Visozum) crée un pont entre M3 (technocratique national) et M4 (transnational) - la doctrine anti-RIC circule par les réseaux interpersonnels pantouflés."
  - cause: "F-VI-12"
    effet: "F-VI-13"
    mecanisme: "La doctrine DGSI (mouvements pro-RIC surveillés si présomption basculement violent + ingérence étrangère) étend la sécurité économique aux mouvements politiques domestiques - précédent Camus Moscow / Clichy-fuite-eau opérationnalise la doctrine."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le verrouillage RIC est une infrastructure d'État profond à 5 couches superposées (M1-M4 + C0). Les acteurs individuels (Macron, Fabius, Schoettl) ne sont que les opérateurs visibles d'un système qui les dépasse. Tuer un opérateur ne tue pas le système."
  - position: "Antithèse"
    argument: "La thèse impersonnelle risque la déresponsabilisation : si le verrou est impersonnel, plus personne n'est individuellement responsable. C'est un risque démocratique majeur. La thèse impersonnelle ne nie pas la responsabilité individuelle, elle l'inscrit dans une architecture systématique."
  - position: "Synthèse"
    argument: "Le verrou RIC est à la fois individuel (opérateurs Schoettl/Fabius le portent activement) et impersonnel (structures BCE/CE/IGF/DGSI/Bilderberg le rendent opérationnel indépendamment). Les deux thèses sont complémentaires, pas contradictoires."

limites:
  - "Score GATE_G 23% sous seuil 85% APEX (méthodologie ouverte)."
  - "Recherche web 4/5 requêtes fonctionnelles (méthodologie dégradée reconnue)."
  - "Inférence raisonnable sur les 'notes blanches' IGF - pas de preuve documentaire directe de la doctrine anti-RIC des grands corps."
  - "Reconstruction du Bilderberg-France : membres Steering Committee publics (Castries, Baudson, Vassy) mais discussions internes confidentielles (Chatham House Rule)."
  - "Pas d'accès aux documents classifiés DGSI - doctrine publique mais dossiers spécifiques classifiés."

wolves:
  - nom: "BCE + Agences de notation (M1)"
    argument: "L'algorithme de marché protège automatiquement la stabilité monétaire."
    reponse: "Un RIC budgétaire + sortie de l'Eurogroupe est techniquement faisable (cf. cas grec 2015) mais coûteux - c'est un choix politique, pas une impossibilité technique."
  - nom: "État profond (M2 + M3 + M4)"
    argument: "Art. 16, DGSI, IGF, CE, Bilderberg sont les gardiens de l'ordre public, économique, idéologique."
    reponse: "La doctrine impersonnelle ne nie pas la responsabilité des opérateurs mais démontre que les remplacer ne suffit pas - il faut attaquer simultanément les 5 couches."

iceberg:
  - "L'inférence raisonnable sur les 'notes blanches' IGF est le point faible de l'enquête - la doctrine anti-RIC n'est pas documentée formellement."
  - "Le pantouflage entre IGF et banques internationales (M3-M4) est un pont crucial mais non documenté exhaustivement."
  - "La doctrine DGSI anti-subversion est publique mais son application aux mouvements pro-RIC est rarement documentée (Camus Moscow / Clichy-fuite-eau sont des exceptions opérationnelles)."
  - "Le précédent grec 2015 (Tsipras capitulation) traumatise la gauche radicale européenne, qui hésite à porter le RIC depuis."

