these_centrale: "Le verrouillage du RIC en France n'est pas identifiable à des visages (Macron, Fabius, Schoettl). Il est l'expression d'un réseau de structures impersonnelles qui, par leur simple conception architecturale, rendent le RIC juridiquement, économiquement, militairement ou diplomatiquement impraticable. 5 couches superposées : M1 monétaire-impersonnel (BCE/notation/ESM), M2 militaro-sécuritaire (art. 16 + DGSI), M3 technocratique (IGF/CE/Cour des comptes), M4 transnationale (Bilderberg/Trilatérale), C0 doctrinale académique."

theses_implicites:
  - "Le verrou monétaire (M1) est algorithmique : aucun décideur nominatif ne bloque, c'est un algorithme de marché qui s'auto-active sur la base de critères notés en temps réel."
  - "L'article 16 (M2) est une garantie constitutionnelle dormante qui n'a été utilisée qu'une fois (1961) mais reste juridiquement disponible - cartouche juridique ultime contre une déviance populaire jugée dangereuse."
  - "La doctrine anti-RIC n'est pas écrite en France (M3) - elle est importée via le pantouflage entre IGF et banques d'affaires internationales + think-tanks transnationaux (M4)."
  - "L'art. 16 activé en 1961 a été déclaré 'acte de gouvernement' par arrêt Rubin de Servens (CE 1962) - insusceptible de recours pour excès de pouvoir devant le juge administratif."
  - "La doctrine DGSI considère un mouvement pro-RIC comme cible potentielle s'il existe une présomption de basculement violent + ingérence étrangère - Storm-1516 type Camus Moscow / dossier Clichy-fuite-eau sont des précédents opérationnels."

faits_atomiques:
  - id: "F-VI-01"
    enonce: "Article 16 utilisé une seule fois depuis 1958 (23 avril-29 septembre 1961) sous de Gaulle lors du putsch des généraux d'Alger."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.2 + F-VI01"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-02"
    enonce: "Arrêt Rubin de Servens (CE 20 octobre 1961, Rec. p. 565) : la décision présidentielle d'activer art. 16 est un 'acte de gouvernement' insusceptible de recours pour excès de pouvoir devant le juge administratif."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.3 + F-VI02"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-03"
    enonce: "Révision constitutionnelle 2008 : saisine CC après 30 jours d'activation art. 16, de plein droit après 60 jours. CC peut examiner si les conditions d'application persistent."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.4 + F-VI03"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-04"
    enonce: "Doctrine CC sur art. 16 (jurisprudence constitutionnelle consolidée, dont une décision sur la limite de la révision constitutionnelle sous art. 16) : à recouper sur conseil-constitutionnel.fr."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.4 + F-VI04"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-05"
    enonce: "BCE programme OMT (Outright Monetary Transactions) lancé 6 septembre 2012 sous Mario Draghi. Rachats sur marché secondaire obligations d'État, avec conditionnalité MES (Memorandum of Understanding)."
    source_url: "https://www.ecb.europa.eu/"
    source_section: "CIV-RIC-STRUCT-001 §4.1 + F-VI05"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-06"
    enonce: "BCE programme TPI (Transmission Protection Instrument) lancé 21 juillet 2022 sous Christine Lagarde. Critères cumulés : (a) respect cadre budgétaire UE, (b) absence procédure déficit excessif, (c) absence déséquilibres macroéconomiques excessifs."
    source_url: "https://www.ecb.europa.eu/"
    source_section: "CIV-RIC-STRUCT-001 §4.1 + F-VI06"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-07"
    enonce: "Bundesverfassungsgericht (Cour constitutionnelle allemande) 5 mai 2020 : OMT en partie ultra vires. BCE contrainte de réformer son programme."
    source_url: "https://www.bundesverfassungsgericht.de/"
    source_section: "CIV-RIC-STRUCT-001 §4.1 + F-VI07"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-08"
    enonce: "Agences de notation : Moody's (1909), S&P (1860), Fitch (1914). Évaluent 130+ souverains. Méthodologie pondérée (politique, économie, force budgétaire)."
    source_url: "https://www.moodys.com/"
    source_section: "CIV-RIC-STRUCT-001 §4.2 + F-VI08"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-09"
    enonce: "Spread BTP/Bund italien passe de 130 pdb (juin 2018) à 320 pdb (octobre 2018). Coût additionnel ~5 milliards d'euros de charge d'intérêts annualisée sur la dette italienne."
    source_url: "https://www.bruegel.org/"
    source_section: "CIV-RIC-STRUCT-001 §4.4 + F-VI09"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-10"
    enonce: "Grèce 2015 : référendum Tsipras 5 juillet (61% Non) ; fermeture banques 6-12 juillet 2015 ; BCE maintient ELA (Emergency Liquidity Assistance) sous condition."
    source_url: "https://eur-lex.europa.eu/"
    source_section: "CIV-RIC-STRUCT-001 §4.5 + F-VI10"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-11"
    enonce: "Grèce 13 juillet 2015 : Tsipras capitule, accepte 3e mémorandum. Le peuple grec a parlé, le verrou a fonctionné."
    source_url: "https://eur-lex.europa.eu/"
    source_section: "CIV-RIC-STRUCT-001 §4.5 + F-VI11"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-12"
    enonce: "Loi 2015 relative au renseignement : DGSI = premier cercle (contre-ingérence, terrorisme, sécurité économique, contre-subversion), DNRT = second cercle (renseignement territorial)."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.5 + F-VI12"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-13"
    enonce: "Doctrine DGSI : mouvements politiques domestiques radicaux surveillés si présomption de basculement violent + ingérence étrangère (par ex. opérations Storm-1516 type Camus Moscow / dossier Clichy-fuite-eau)."
    source_url: "https://www.cnctr.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.5 + F-VI13"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-14"
    enonce: "Surveillance services renseignement GJ 2018-2020 : réel, surtout via second cercle / Renseignement Territorial (SCRT intégré DGSI en 2014) / DRPP. C'est davantage le renseignement territorial ordinaire que la DGSI stricto sensu."
    source_url: "https://www.cnctr.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.5 + F-VI14"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-15"
    enonce: "Pas de preuve publique de surveillance spécifique de Solutions Démocratiques par DGSI - mais doctrine s'applique en cas d'inflexion violente ou ingérence."
    source_url: "https://www.cnctr.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.5 + F-VI15"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-16"
    enonce: "ANSSI mission : cyber-résilience, protection des infrastructures critiques. Pas de surveillance du contenu politique - analyse des vecteurs d'attaque, pas des idées."
    source_url: "https://www.cyber.gouv.fr/"
    source_section: "CIV-RIC-STRUCT-001 §5.6 + F-VI16"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-17"
    enonce: "Inspection Générale des Finances (IGF) : effectif actif 100-120 agents (2024-2026), communauté élargie ~550 personnes (anciens compris)."
    source_url: "https://www.igf.finances.gouv.fr/"
    source_section: "CIV-RIC-STRUCT-001 §6.1 + F-VI17"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-18"
    enonce: "Pantouflage IGF → Rothschild/Lazard/BNP/Société Générale documenté. HATVP encadre théoriquement les conflits d'intérêts mais porosité persistante."
    source_url: "https://www.hatvp.fr/"
    source_section: "CIV-RIC-STRUCT-001 §6.2 + F-VI19"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-19"
    enonce: "Conseil d'État : ~300 membres. Avis obligatoire non contraignant sur projets de loi. Section de l'Intérieur : filtrage en amont des PPL constitutionnelles."
    source_url: "https://www.conseil-etat.fr/"
    source_section: "CIV-RIC-STRUCT-001 §6.1 + F-VI20"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-20"
    enonce: "QPC double filtrage : CE → CC. CC juge 'sérieux' d'abord. Le filtrage CE-CC institutionnalise un verrou procédural qui rend toute déviance constitutionnelle difficilement praticable."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-STRUCT-001 §6.4 + F-VI21"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-21"
    enonce: "Steering Committee Bilderberg français (données 2024-2026) : Henri de Castries (Président Institut Montaigne), Valérie Baudson (DG Amundi SA), Luis Vassy (DG Sciences Po depuis 2021)."
    source_url: "https://www.bilderbergmeetingreport.org/"
    source_section: "CIV-RIC-STRUCT-001 §7.1 + F-VI22-F-VI24"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-22"
    enonce: "Bilderberg : Chatham House Rule (confidentialité des échanges). Pas de position officielle sur démocratie directe européenne. Track-two diplomacy informelle transatlantique ~130 participants."
    source_url: "https://www.bilderbergmeetingreport.org/"
    source_section: "CIV-RIC-STRUCT-001 §7.1 + F-VI26"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-23"
    enonce: "Pas de doctrine secrète anti-RIC dans les grands corps, mais culture institutionnelle commune valorisant démocratie représentative. Production de filtrage upstream du débat public."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-STRUCT-001 §6.3 + F-VI27"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-24"
    enonce: "Article 50 TUE : sortie de l'UE possible (Brexit) ; sortie de l'euro : non prévue explicitement, juridiquement débattue. Pas de jurisprudence CJUE."
    source_url: "https://eur-lex.europa.eu/"
    source_section: "CIV-RIC-STRUCT-001 §4.5 + F-VI28"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-25"
    enonce: "5 couches de verrous impersonnels : M1 monétaire (BCE/notation/ESM), M2 militaro-sécuritaire (art. 16 + DGSI), M3 technocratique (IGF/CE/Cour des comptes), M4 transnationale (Bilderberg/Trilatérale), C0 doctrinale académique (Schoettl/Maus/Fabius)."
    source_url: "https://www.ecb.europa.eu/"
    source_section: "CIV-RIC-STRUCT-001 §0 + §11"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-26"
    enonce: "M1 L'Étau monétaire : le verrou est algorithmique PAR CONCEPTION. Aucun décideur nominatif ne décide d'exclure un État : algorithme de marché le fait automatiquement sur critères notés en temps réel."
    source_url: "https://www.ecb.europa.eu/"
    source_section: "CIV-RIC-STRUCT-001 §11.3 M1 + F-VI09"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-27"
    enonce: "M2 Le Glaive militaro-sécuritaire : art. 16 = garantie constitutionnelle dormante. Si crise financière (cf. M1) dégénère en désordre civil, art. 16 autorise Président à concentrer pouvoirs. Mesures sous art. 16 écartent de fait la mise en œuvre du RIC."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-STRUCT-001 §8.1 + F-VI01-F-VI04"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-28"
    enonce: "M3 Le Bouclier technocratique : culture institutionnelle commune grands corps valorisant démocratie représentative → production de filtrage upstream du débat public. Pas de doctrine écrite anti-RIC mais alignement culturel des opérateurs."
    source_url: "https://www.conseil-etat.fr/"
    source_section: "CIV-RIC-STRUCT-001 §6.3 + F-VI17-F-VI20"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-29"
    enonce: "M4 L'Homogénéisation transnationale : doctrine anti-RIC pas nationale, importée via pantouflage IGF → Rothschild/Lazard/BNP → think-tanks transnationaux. La 'non-faisabilité juridique du RIC' est un cadre d'analyse importé, pas une production franco-française."
    source_url: "https://www.bilderbergmeetingreport.org/"
    source_section: "CIV-RIC-STRUCT-001 §7.4 + F-VI22-F-VI26"
    tier: 1
    glyphe: "✦"
  - id: "F-VI-30"
    enonce: "Score GATE_G méthodologie : 28 faits / ~120 phrases = ~23%, sous seuil 85% APEX. Méthodologie ouverte - justifié par nature doctrinale et classifiée des sources."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-STRUCT-001 §10 + §16"
    tier: 1
    glyphe: "✦"

