    enonce: "Bürgerrat-FR 24-90 sortition sur 68M habitants : aucun précédent empirique documenté. C'est l'angle mort structurel du Pack CivicTech-FR 2027."
    source_url: "https://www.buergerdialog.be/"
    source_section: "CIV-RIC-COORD-EU-001 §14.4"
    tier: 1
    glyphe: "✦"
