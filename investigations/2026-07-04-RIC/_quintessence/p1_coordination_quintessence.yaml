these_centrale: "La coordination transnationale des mouvements pro-démocratie directe contre le verrou M4 Bilderberg/Trilatérale est techniquement faisable mais structurellement entravée par 5 obstacles : M1 capture populiste (M5S post-Grillo, Podemos post-Sumar), M2 asymétrie doctrinale identitaire (AfD disqualifiante), M3 isolement EU-institutionnel (BSW ostracisé), M4 faiblesse juridique ICE (Commission peut refuser), M5 rupture des bases militantes (32%→15% M5S, 21%→12% Podemos)."

theses_implicites:
  - "L'Initiative Citoyenne Européenne (ICE) est un outil d'agenda, pas un levier contraignant. La Commission peut refuser toute proposition législative (cf. Stop Glyphosate, Right2Water)."
  - "Le M5S post-Grillo (Garant aboli novembre 2024, limite 2 mandats supprimée) est devenu un parti classique, non un mouvement pro-RIC opérationnel. Capture institutionnelle."
  - "Podemos (Espagne) post-Iglesias-Errejón + sortie Sumar 2024-2026 est en fragmentation identitaire. Doctrine pro-RIC devenue rhétorique."
  - "BSW (Wagenknecht, Allemagne) a une doctrine pro-Volksentscheid explicite mais est ostracisé par EELV (gauche), CDU (centre-droit), AfD (droite). Isolement politique structurel."
  - "L'AfD 'reformiste' (Weidel/Chrupalla) promeut Volksentscheid 'modèle suisse' mais avec projet identitaire disqualifiant (Höcke/Thüringen). Démagogie caractérisée, pas un partenaire sincère."

