    source_section: "CIV-RIC-COORD-EU-001 §13"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-20"
    enonce: "Probabilité coordination effective 2026-2030 (5 scénarios) : S1 stabilité verrou (P=0.45), S2 coalition bilatérale (P=0.20), S3 ICE significative (P=0.10), S4 convergence transnationale (P=0.05), S5 crise systémique (P=0.20)."
    source_url: "https://www.europarl.europa.eu/"
    source_section: "CIV-RIC-COORD-EU-001 §13"
    tier: 1
    glyphe: "✦"
