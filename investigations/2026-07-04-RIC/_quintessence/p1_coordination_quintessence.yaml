    effet: "F-COORD-02"
    mecanisme: "M5S post-Grillo novembre 2024 : Garant aboli + 2 mandats supprimés + Rousseau abandonné → capture institutionnelle → le mouvement n'est plus opérationnel comme contre-pouvoir pro-RIC."
  - cause: "F-COORD-10"
    effet: "F-COORD-11"
    mecanisme: "ICE Right2Water (1,8M signatures) → Commission contrainte d'envisager → révision directive 2018 modeste. ICE Stop Glyphosate → Commission refuse interdiction totale → renouvellement 5 ans. ICE = outil d'agenda, pas de levier."
  - cause: "F-COORD-04"
    effet: "F-COORD-06"
    mecanisme: "BSW ostracisé par SPD/EELV (gauche) CDU (centre) AfD (droite) → isolemement politique structurel → doctrine Volksentscheid explicite mais sans partenaire politique → influence faible."
  - cause: "F-COORD-07"
