    enonce: "M5S ralliement centre-gauche 2026, alliance PD italienne. Alliances passées avec Lega 2018-2019 (Conte I), PD 2019-2021 (Conte II), Draghi 2021, Meloni 2022+. Trajectoire institutionnalisation complète."
    source_url: "https://www.camera.it/"
    source_section: "CIV-RIC-COORD-EU-001 §6.1"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-25"
    enonce: "Dynamiques populistes européennes 2009-2026 : M5S (2009 capture 2017-2024), Podemos (2014 capture 2020-2024), Syriza (2015 collapse 2019), BSW (2024 en cours), AfD (2013 constant). Convergence similaire vers institutionnalisation."
    source_url: "https://www.lrb.co.uk/"
    source_section: "CIV-RIC-COORD-EU-001 §14.2"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-26"
    enonce: "PROTOCOLE-PNRED-RIC-001 : coordination opérationnelle 5 ans 2026-2030 via 8 modules (6 piliers FRANCS + CCP 24-90 sortition + CS tripartite + Plan 18 mois T0/T+6/T+12/T+18/T+36 + Judo Rhétorique + Éloge Surface + Ré-enracinement 6 étapes + Pack Données Souveraines SecNumCloud+X-Road FR+Papier-First)."
    source_url: "https://proto.engines.sublimator/"
    source_section: "Sublimator v34 §1-§6"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-27"
    enonce: "Bürgerrat-FR rejoint la VEILLE européenne : Coordination européenne Bürgerrat-FR + Bürgerrat Ostbelgien + vTaiwan + Suisse initiative populaire = 4 modèles CivicTech étrangers comparables au Pack CivicTech-FR."
    source_url: "https://www.buergerdialog.be/"
    source_section: "CIV-RIC-COORD-EU-001 §14.2"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-28"
    enonce: "Pour briser M4 Bilderberg/Trilatérale, il faut simultanément : (1) renforcer mouvements non-captifs (BSW candidat), (2) utiliser ICE même si faible (impact symbolique), (3) coalitions bilatérales ad hoc par sujet, (4) anticiper événement déclencheur (crise systémique)."
    source_url: "https://www.bilderbergmeetingreport.org/"
    source_section: "CIV-RIC-COORD-EU-001 §15"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-29"
    enonce: "Solution Démocratique (France) doit éviter les 5 mécanismes de capture M5S : (1) sous-traitance Casaleggio → SecNumCloud + X-Road FR open-source, (2) leadership charismatique → gouvernance collégiale Bürgerrat, (3) piège institutionnalisation → rester mouvement + alliance Pacte FRANCS, (4) règle 2 mandats → rotation stricte sans cumul, (5) absence garde-fous → majorité qualifiée 2/3 pour tout changement statutaire."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "CIV-RIC-COORD-EU-001 §15"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-30"
    enonce: "Recommandation opérationnelle : 'Contre-vivier RIC européen' - think-tank multi-pays produisant doctrine pro-RIC offline (CEPS Brussels, ECFR, ou nouvelle structure). Objectif : préparer la fenêtre d'opportunité."
    source_url: "https://www.ceps.eu/"
    source_section: "CIV-RIC-COORD-EU-001 §15.8"
    tier: 1
    glyphe: "✦"

