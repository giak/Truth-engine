    source_section: "CIV-RIC-COORD-EU-001 §6.2"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-06"
    enonce: "BSW doctrine : réforme constitutionnelle pour Volksentscheid (initiative populaire) au niveau fédéral (Bund). Insistance sur modèle suisse (initiative populaire directe)."
    source_url: "https://www.bsw-vg.de/"
    source_section: "CIV-RIC-COORD-EU-001 §6.3"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-07"
    enonce: "AfD 'reformiste' (Weidel/Chrupalla) : promoteur Volksentscheid 'modèle suisse' mais avec projet identitaire disqualifiant (Höcke/Thüringen). Démagogie caractérisée, pas partenaire sincère."
    source_url: "https://www.afd.de/"
