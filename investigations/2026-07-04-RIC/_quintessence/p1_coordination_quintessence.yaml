perspectives_dialectiques:
  - position: "Thèse"
    argument: "La coordination transnationale pro-RIC est techniquement faisable (ICE, Bürgerrat Ostbelgien, vTaiwan) mais structurellement entravée par 5 obstacles. P(effective 2026-2030) ≈ 0.20-0.25."
  - position: "Antithèse"
    argument: "Les mouvements populistes européens sont en voie d'institutionnalisation rapide (M5S 14 ans, Podemos 6 ans, Syriza 4 ans, BSW en cours). Le verrou M4 Bilderberg/Trilatérale opère au-dessus des verrous nationaux."
  - position: "Synthèse"
    argument: "Pour briser M4, il faut attaquer simultanément plusieurs couches : mouvement non-captif (BSW) + ICE symbolique + coalitions bilatérales + anticipation crise systémique. Aucune stratégie isolée ne suffit."

limites:
  - "Score GATE_G 17% sous seuil 85% APEX (complexité multi-pays)."
  - "Composante imparfaite de la cartographie (AfD moins dense que les 3 autres)."
  - "Pas de preuve publique de coordination Bilderberg → doctrine anti-RIC (Chatham House Rule)."
  - "Steering Committee italiens (Draghi) et espagnols (Botín) partiellement confirmés."
  - "Bürgerrat-FR 24-90 transposition pas de précédent empirique."

wolves:
  - nom: "Bilderberg + Steering Committees nationaux"
    argument: "Alignement élitaire transnationale, doctrine anti-RIC importée."
    reponse: "Le Pack CivicTech-FR crée un canal média-citoyen structurel (SecNumCloud + X-Road FR) qui bypasse le walled garden Bilderberg."
  - nom: "Cartel transpartisan + concentration médias"
    argument: "Convergence d'intérêts anti-RIC, blocage parlementaire."
    reponse: "Le RIC abrogatif peut suspendre promulgation d'une loi de blocage : le verrou procédural devient une cible juridique du RIC."
  - nom: "Capture M5S / Podemos (modèles Syriza)"
    argument: "Les mouvements populistes sont institutionnalisés en 4-14 ans."
    reponse: "Solution Démocratique doit intégrer des garde-fous anti-capture (open-source gouvernance, taux limité, neutralité plateforme)."

iceberg:
  - "Le précédent M5S est un cas d'école : la capture en 14 ans démontre que la voie institutionnelle seule n'est pas viable."
  - "L'ICE est un outil d'agenda, pas de levier. La Commission peut refuser (Stop Glyphosate)."
  - "Bürgerrat-FR 24-90 sur 68M hab. = aucun précédent empirique."
  - "BSW est ostracisé par tous les blocs (gauche + droite) : isolement diplomatique."

