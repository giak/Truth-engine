    tier: 1
    glyphe: "✦"
  - id: "F-COORD-08"
    enonce: "2021 : Bundestag rejette initiative AfD sur Volksentscheid. Critique des partis traditionnels (CDU/CSU, SPD, FDP, Verts) : 'Démantèlement du système parlementaire.'"
    source_url: "https://www.bundestag.de/"
    source_section: "CIV-RIC-COORD-EU-001 §7.2"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-09"
    enonce: "Article 11.4 TUE + Article 24.4 TFUE : au moins 1 million de citoyens issus d'au moins 7 États membres peuvent inviter la Commission européenne à présenter une proposition législative (ICE)."
    source_url: "https://eur-lex.europa.eu/"
    source_section: "CIV-RIC-COORD-EU-001 §8.1"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-10"
    enonce: "ICE Right2Water (mars 2012-mars 2013) : 1 882 790 signatures. PREMIÈRE ICE RÉUSSIE. Commission contrainte d'envisager révision directive eau (2018) avec impact direct limité."
    source_url: "https://www.europarl.europa.eu/"
    source_section: "CIV-RIC-COORD-EU-001 §8.2"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-11"
    enonce: "ICE Stop Glyphosate (février 2017-septembre 2019) : ~1 million signatures. Commission refuse interdiction totale, renouvellement pour 5 ans (UE 2019/2020). IMPUISSANCE ICE documentée."
    source_url: "https://ec.europa.eu/"
    source_section: "CIV-RIC-COORD-EU-001 §8.2"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-12"
    enonce: "M5S membre du groupe GUE/NGL (La Gauche) au Parlement européen. Relations passées avec Podemos via Five Star International 2014-2018 mais alliance dissoute."
    source_url: "https://www.europarl.europa.eu/"
    source_section: "CIV-RIC-COORD-EU-001 §4.2"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-13"
    enonce: "AfD exclue du cordon sanitaire classique (à droite comme Volksentscheid). BFC/Verfassungsschutz 2025 place l'AfD sous surveillance droite-extrémiste."
    source_url: "https://www.bfdi.bund.de/"
    source_section: "CIV-RIC-COORD-EU-001 §7.0"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-14"
    enonce: "Steering Committee Bilderberg France : Castries (Institut Montaigne), Baudson (Amundi), Vassy (Sciences Po). Equivalents italiens : Mario Draghi (Co-président Steering Committee Italy, ex-BCE + ex-PM)."
    source_url: "https://www.bilderbergmeetingreport.org/"
    source_section: "CIV-RIC-COORD-EU-001 §7.1 + §9.1"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-15"
    enonce: "5 obstacles structurels à la coordination transnationale : M1 capture M5S/Podemos, M2 asymétrie identitaire droite/gauche, M3 isolement EU-institutionnel, M4 faiblesse juridique ICE, M5 rupture bases militantes."
    source_url: "https://www.cevipof.com/"
    source_section: "CIV-RIC-COORD-EU-001 §10"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-16"
    enonce: "M5S bases : 32% en 2018 → 15% en 2024-2026 (perte 53%). Podemos bases : 21% en 2015 → 12% en 2024 (perte 43%). BSW bases : 6,2% EU 2024 (modeste)."
    source_url: "https://www.camera.it/"
    source_section: "CIV-RIC-COORD-EU-001 §10.5"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-17"
    enonce: "Taïwan : vTaiwan CivicTech open-source (Audrey Tang 2016-20 mai 2024) + JOIN (Join.gov.tw) + Factcheck. Modèle CivicTech étranger du Pack CivicTech-FR."
    source_url: "https://www.vtaiwan.com/"
    source_section: "CIV-RIC-COORD-EU-001 §7"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-18"
    enonce: "Bürgerrat Ostbelgien 2019 : 24 sortition + 50 Bürgerversammlungen. Modèle Bürgerrat-FR 24-90 sortition transposition française (Pack CivicTech-FR)."
    source_url: "https://www.buergerdialog.be/"
    source_section: "CIV-RIC-COORD-EU-001 §7"
    tier: 1
    glyphe: "✦"
  - id: "F-COORD-19"
    enonce: "Cumulés : 22 enquêtes P3 + 4 M5S Italie/Podemos/BSW/AfD Cartographie = 4 mouvements pro-RIC cartographiés. Faisabilité coordination transnationale P ≈ 0.20-0.25 (2026-2030)."
