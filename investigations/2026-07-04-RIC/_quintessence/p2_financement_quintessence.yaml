these_centrale: "Le financement de Solution Démocratique est structurellement transparent (loi 88-227 : plafond 7500€/an/donateur, interdiction personnes morales, AFSD agréée CNCCFP 13 mai 2024) MAIS structurellement fragile : absence de subventions publiques, absence de fondation politique adossée (à la différence des Stiftungen allemandes 41M€/an), absence de cercle de grandes fortunes. L'asymétrie systémique entre forces pro-RIC (transparentes et étroites) et forces anti-RIC (think tanks opaques massifs : Institut Montaigne 7,5M€/an + Fondapol 1,3M€/an + Fondation Concorde 2M€/an) est mathématiquement convergente."

theses_implicites:
  - "Tandis que les P0 #1-P0 #4 ont documenté des verrous invisibles (BCE opaque, Bilderberg non public, DGSI classifiée, IGF pantouflage), le financement de SD est visible mais étroit : la transparence n'est pas une ruse mais une obligation légale française (loi 11 mars 1988)."
  - "Le piège asymétrique du système : verrouillage par le haut (opacité, fonds massifs) vs verrouillage par le bas (transparence forcée, fonds étroits) aboutissent mécaniquement à une inégalité matérielle entre mouvements pro-RIC et forces anti-RIC."
  - "L'absence de fondations politiques françaises style allemande (Stiftungen 1964 : Konrad Adenauer + Friedrich Ebert + Rosa Luxemburg + Heinrich Böll = 41M€/an financement public formation politique) est franco-allemande et n'est pas réformable sans choix politique conjoncturel."
  - "La contrainte budgétaire française (loi 88-227) exclut les montants significatifs (pas de grandes fortunes, pas de fondations, pas de fonds européens directs aux mouvements politiques) : comment rivaliser avec Bilderberg + BCE 25-50 Md€ d'actifs avec 7500€/donateur/an ?"

