causalites:
  - cause: "F-P2-04"
    effet: "F-P2-09"
    mecanisme: "L'agrément AFSD + plafond légal 7500€ + interdiction pers. morales produisent une capacité budgétaire structurellement étroite pour SD : 36 parrainages/500 atteint en 2022 trop court pour la présidentielle ; 2-3M€/an effectif vs 10M€ minimum campagne présidentielle."
  - cause: "F-P2-12"
    effet: "F-P2-15"
    mecanisme: "L'asymétrie Montaigne 7,5M€ + Fondapol 1,3M€ + Fondation Concorde 2M€ = >10,8M€/an cumulés hors plafond légal : permet aux think tanks anti-RIC de mobiliser des fonds privés massifs sans plafond ni transparence."
  - cause: "F-P2-10"
    effet: "F-P2-11"
    mecanisme: "Modèle allemand Stiftungen 41M€/an financement public formation politique vs absence française : choix politique français d'hostilité jacobine envers la professionnalisation politique financée par l'État produit une asymétrie franco-allemande structurelle."
  - cause: "F-P2-20"
    effet: "F-P2-16"
    mecanisme: "Plafond 1988 non revalorisé index inflation sur 15 ans = -20% pouvoir achat : ralentit mécaniquement la mobilisation de nouveaux donateurs (effet plafond-bas + non-révalorisation)."
  - cause: "F-P2-19"
    effet: "F-P2-21"
    mecanisme: "L'ADN + Pacte Civique, partenaires trans-partisans, produisent une coalition Pacte FRANCS 5-10% qui pourrait, par discipline électorale, générer 200-400k voix perdues en législatives 2027 = levier indirect de financement (pas de subvention directe mais effet déstabilisant candidats anti-RIC)."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le financement SD est structurellement vertueux (cadre légal strict) mais structurellement fragile (capacité budgétaire étroite). L'asymétrie mathématique avec les think tanks anti-RIC est irréductible sans réforme de la loi 88-227."
  - position: "Antithèse"
    argument: "Une Constitution des solutions existe : (a) revalorisation plafond 7500€ indexé inflation, (b) création fondations politiques françaises style Stiftungen, (c) extension obligations transparence aux associations d'influence (anti-asymétrie)." 
  - position: "Synthèse"
    argument: "La discipline de vote 5-10% Pacte FRANCS + élargissement coalition ADN + PPL Pochon + transpartisanité LFI/Renaissance peuvent lever la contrainte matérielle sans réforme structurelle. Solution Démocratique cristallise l'asymétrie mais ne peut seul inverser le rapport de force."

limites:
  - "AFSD comptes 2024-2026 détaillés non publics en accès libre (publication post-2027 après clôture compte Clara Egger)."
  - "Donateurs individuels AFSD anonymes par construction (anonymat fiscal garanti : plafond 7500€)."
  - "Subventions publiques potentielles ANS/FDVA/Erasmus+/FEDER : pas identifiées mais doivent être vérifiées individuellement."
  - "Fondations privées finançant SD : à recouper une par une (Fondation de France, Abbé Pierre, etc.)."

wolves:
  - nom: "Institut Montaigne + Fondapol (penseurs anti-RIC)"
    argument: "SD marginal + incapable de mobiliser 50k donateurs + plafond légal + plafond comptable 2-3M€/an est sans impact électorale ; le RIC reste virtuel."
    reponse: "SD est structurellement étroit mais la candidature 2027 Egger + PPL Pochon 2025-2026 + agenda Pacte FRANCS restent une pression politique atteignable, indépendamment du financement direct."
  - nom: "9 propriétaires médias français"
    argument: "SD n'a pas accès à l'audiovisuel (picto~médiatique 90% concentration). Pas de campagne télévisée = pas de visibilité."
    reponse: "Substack + Telegram diaspora ne contournent pas le walled garden, mais produisent visibilité alternative + Substack-Sponsor-Chain pourrait induire 1-3M€ nouveaux donateurs (post-publication du 2e article)."
  - nom: "Pacte Civique + ADN (partenaires trans-partisans)"
    argument: "SD sans assise partisane solide reste sans ancrage électoral = échec structurel."
    reponse: "L'absence d'ancrage partisan est explicitement l'identité de SD ('mouvement citoyen') ; la transpartisanité observée (LFI+Renaissance) rend SD un chamelier permanent sans gains immédiats."

iceberg:
  - "DGSE + fermetures structurées post-MIT lecture écosystème frontière : peu documentée sur le financement des partis via groupes industriels (cf. contrats MBA en management-consulting)."
  - "Modèle allemand Stiftungen dépassant 41M€/an : extension plausible aux mouvements sociétaux (non-partis) reste à analyser."
  - "Pratique italienne 'volontariato civico' : variable d'ajustement du modèle allemand ? non analysée en France."
  - "Mnemolite DOWN : transversalités cross-séries non explorées (cf. enquêtes Évasion Fiscale + Dette 3 200 Md€)."
  - "Lobot 2025-2026 sur EBITDA 7,5M€/an Institut Montaigne (financements privés) : pas d'enquête comptable en accès libre."

