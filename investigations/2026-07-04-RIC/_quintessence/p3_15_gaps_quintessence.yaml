causalites:
  - cause: "F-GAP-01"
    effet: "F-GAP-19"
    mecanisme: "Le financement des think tanks anti-RIC (Institut Montaigne 7,5M€/an + Fondapol 1,3M€ + etc.) alimente une doctrine constitutionnelle conservatrice (Schoettl 2023) qui légitime le verrouillage des PPL par la Conférence des Présidents (Ferrand/Braun-Pivet)."
  - cause: "F-GAP-09"
    effet: "F-GAP-10"
    mecanisme: "L'absence de jurisprudence CJUE sur RIC+UE produit une zone d'incertitude juridique - le précédent grec 2015 démontre que la BCE peut maintenir l'ELA sous condition, ce qui rend le RIC budgétaire impraticable sans sortir de l'Eurogroupe."
  - cause: "F-GAP-12"
    effet: "F-GAP-20"
    mecanisme: "Le modèle uruguayen (15 consultations depuis 1985, seuil 2%/25%) et le modèle ostbelgien (5 ans sans crise, taux acceptation 10%) documentent la faisabilité opérationnelle du RIC - l'OS Démocratique Souverain (SecNumCloud + X-Road + Papier-First) transpose ces modèles à l'échelle française."
  - cause: "F-GAP-27"
    effet: "F-GAP-19"
    mecanisme: "La réforme Ferrand 2019 (suppression motions de rejet) devait fluidifier le débat mais produit paradoxalement l'effet inverse : la majorité compense par déluge d'amendements dans les niches, retournant le paradigme traditionnel où seule l'opposition obstruait."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le RIC est verrouillé par un consensus transpartisan + un réseau de think tanks convergents structurellement + une absence de jurisprudence CJUE + un précédent grec 2015 démontrant l'impraticabilité budgétaire."
  - position: "Antithèse"
    argument: "L'Ostbelgien (5 ans sans crise) et l'Uruguay (15 consultations depuis 1985) démontrent la faisabilité opérationnelle. Le soutien populaire 62-73% est confirmé par 3 instituts indépendants (IFOP/Harris/OpinionWay 2019). Le 4e perspective OS Démocratique Souverain offre une voie technique concrète."
  - position: "Synthèse"
    argument: "Le RIC n'est pas un outil miracle mais une conquête démocratique. Les modèles étrangers (Suisse 1891, Uruguay 1919, Ostbelgien 2019) démontrent la faisabilité. L'absence de précédent français s'explique par l'ADN de 1958, pas par l'impossibilité technique. Le Pack CivicTech-FR 2027 (SecNumCloud + X-Road + Papier-First) opérationnalise la voie."

limites:
  - "Score GATE_G 43,3% reste sous seuil APEX 85% (mais améliore +15,7 pts vs CIV-RIC-001)."
  - "Aucune étude INA quantitative du temps d'antenne RIC 2018-2024 (accès payant)."
  - "Pas d'enquête AdL sur les fonctionnaires parlementaires qui ont activement entravé les PPL en commission."
  - "Bürgerrat-FR 24-90 sortition sur 68M hab. : aucun précédent empirique documenté."
  - "Capture Casaleggio M5S non documentée (P3 22-00 traite)."
  - "Financement des think tanks converge structurellement mais sans preuve de coordination."

wolves:
  - nom: "Think tanks français (Institut Montaigne, Fondapol, Terra Nova, Fondation Concorde, Club de l'Horloge)"
    argument: "Doctrine constitutionnelle conservatrice 1958, défense orthodoxie, anti-RIC."
    reponse: "Le Pack CivicTech-FR crée des think tanks alternatifs (Fondation CivicTech-FR, chaires universitaires) qui produisent une doctrine pro-RIC."
  - nom: "9 propriétaires médias (Bolloré, Bouygues, Dassault, Arnault, Niel, Drahi)"
    argument: "Concentration bloque tout débat RIC par omission et délégitimation."
    reponse: "Le RIC crée un canal média-citoyen structurel (SecNumCloud + X-Road) qui bypasse le walled garden médiatique."
  - nom: "Conférence des Présidents (Ferrand, Braun-Pivet, Larcher)"
    argument: "Refus d'inscrire RIC à l'ordre du jour, blocage par la majorité."
    reponse: "Le RIC abrogatif (700k signatures) peut suspendre promulgation d'une loi de blocage : le verrou procédural devient une cible juridique du RIC."

iceberg:
  - "Le précédent grec 2015 est sous-documenté en France : la capitulation Tsipras après 8 jours a traumatisé la gauche radicale européenne, qui hésite à porter le RIC depuis."
  - "L'Ostbelgien fonctionne depuis 2019 sur 78 000 habitants : la transposition Bürgerrat-FR 24-90 sortition sur 68M habitants n'a aucun précédent empirique documenté."
  - "Le financement des think tanks converge structurellement mais sans preuve de coordination : c'est l'ADN d'un système qui produit le verrou, pas une conspiration."
  - "La 4e perspective OS Démocratique Souverain (SecNumCloud + X-Road + Papier-First) résout le paradoxe technique mais pas le politique (volonté)."


