these_centrale: "CIV-RIC-GAPS-002 résout 7 zones d'ombre laissées ouvertes par META-001 : (1) financement des think tanks anti-RIC converge structurellement, (2) sondages IFOP/Harris 2019 confirment 62-73% soutien au RIC constituant, (3) mur médiatique non quantifié mais faisceau concordant, (4) CJUE ZÉRO jurisprudence sur référendums+UE, (5) Uruguay 15 consultations depuis 1985, (6) Ostbelgien 5 ans sans crise, (7) obstruction AdL documentée Ferrand/Braun-Pivet/Larcher. 4e perspective OS Démocratique Souverain ajoutée."

theses_implicites:
  - "Le financement des think tanks anti-RIC (Institut Montaigne 7,5M€/an + Fondapol 1,3M€/an + Fondation Concorde 2M€/an + Terra Nova 2M€/an + Club de l'Horloge) opère par convergence structurelle, pas conspiration coordonnée."
  - "Le soutien populaire au RIC constituant (62-73% selon sondage et formulation) est confirmé par 3 instituts indépendants (IFOP 2019, Harris 2019, OpinionWay 2019) - le chiffre 75% du transcript Egger était à la limite supérieure de la fourchette."
  - "L'Ostbelgien fonctionne depuis 2019 sur 78 000 habitants, taux d'acceptation participation 10% - transposition française Bürgerrat-FR 24-90 sortition sur 68M habitants n'a aucun précédent empirique documenté."
  - "L'Uruguay démontre 15 consultations populaires depuis 1985 (gauche + droite) mais son seuil 25% pour initiative constitutionnelle dépasse le 1% proposé par PNRED - divergence opérationnelle."
  - "La 4e perspective OS Démocratique Souverain résout le paradoxe technique (l'infrastructure suppose un État compétent) en séparant le 'comment' (technique) du 'politique' (volonté)."

