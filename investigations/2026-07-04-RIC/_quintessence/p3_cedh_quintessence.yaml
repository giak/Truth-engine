lecture_status: "Complete - lecture intégrale (442 lignes source)"

these_centrale: "Le levier CEDH article 3 P1 pour forcer la France à adopter un RIC est PRINCIPALEMENT INEFFICACE : la jurisprudence constante de la CEDH limite l'art. 3 P1 à l'élection des législateurs et exclut explicitement les référendums (Mathieu-Mohin 1987, Gitonas 1997, Hirst 2004, Moohan/Gillon 2019). 4 pistes indirectes existent (Convention Aarhus 1998, Verein KlimaSeniorinnen 2024 rhétorique, obligations positives art. 8, Refah c. Turquie 2003), toutes de portée limitée. Le RIC français reste une décision politique souveraine, pas une obligation conventionnelle."

theses_implicites:
  - "CEDH est une convention de protection (passive), pas de promotion (active) d'instruments démocratiques : la tradition forensique européenne n'a pas construit d'obligation positive sur le RIC."
  - "La marge d'appréciation nationale est large (Gitonas 1997, Josipović 2010) : CEDH reconnaît la diversité européenne (Suisse référendum + Liechtenstein) sans harmonisation."
  - "Aucune saisine n'a créé le précédent d'un État condamné pour absence RIC : la question n'a jamais été posée formellement à Strasbourg."
  - "Verein KlimaSeniorinnen c. Suisse (2024) condamne la Suisse pour défaut climatique, mais paradoxalement la démocratie directe suisse ne constitue pas un substitut aux obligations conventionnelles : la démocratie directe ne protège pas contre les manquements Conventionnels."

faits_atomiques:
  - id: "F-CEDH01"
    enonce: "Article 3 du Protocole n° 1 (CEDH) garantit les droits subjectifs de vote et d'éligibilité ; porte sur le 'corps législatif' d'un État (Parlement monocaméral ou Chambre basse)."
    source_url: "https://www.echr.coe.int/documents/convention/protocol_1.pdf"
    source_section: "§2"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH02"
    enonce: "Arrêt Mathieu-Mohin et Clerfayt c. Belgique (2 mars 1987, Grande Chambre) : acte fondateur de l'article 3 P1 ; corps législatif au sens de l'art. 3 P1 inclut le Parlement monocaméral ou la Chambre basse d'un système bicaméral."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-57526"
    source_section: "§2.1"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH03"
    enonce: "Arrêt Gitonas c. Grèce (1 juillet 1997) : 'Les États membres jouissent d'une large marge d'appréciation pour élaborer leurs lois constitutionnelles en matière électorale'. Organisation des modalités d'expression démocratique = droit constitutionnel national, pas Convention."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-57972"
    source_section: "§2.2"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH04"
    enonce: "Arrêt Matthews c. Royaume-Uni (18 février 1999, Grande Chambre) : l'article 3 P1 s'applique au Parlement européen comme 'élément du corps législatif'. Pas d'application aux référendums."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-58783"
    source_section: "§2.3"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH05"
    enonce: "Arrêt Ždanoka c. Lettonie (16 mars 2006, Grande Chambre) : l'article 3 P1 concerne le 'libre choix du peuple' pour les élections législatives. Pas d'obligation de mécanisme de démocratie directe pour les États."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-73548"
    source_section: "§2.4"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH06"
    enonce: "Arrêt Hirst c. Royaume-Uni (6 octobre 2004, Grande Chambre) : l'article 3 P1 protège le droit de vote parlementaire. Exclusion totale des prisonniers = violation. Pas d'application au référendum."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-67175"
    source_section: "§2.5"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH07"
    enonce: "Arrêt Josipović c. Serbie (9 mars 2010) : pas de violation quand la révision constitutionnelle limite le mandat présidentiel. Souveraineté nationale en matière constitutionnelle confirmée."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-97364"
    source_section: "§2.6"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH08"
    enonce: "Arrêt Moohan et Gillon c. Royaume-Uni (13 juin 2019, Grande Chambre) : 'La Convention ne garantit pas le droit de tenir un référendum sur une question de souveraineté nationale. Le referendum relève du droit constitutionnel national'. PIERR ANGULAIRE ANTI-RIC CONTENTIEUSE."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-194433"
    source_section: "§2.7"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH09"
    enonce: "Arrêt Verein KlimaSeniorinnen c. Suisse (9 avril 2024, Grande Chambre) : condamnation Suisse pour climate policy manquements (articles 8 et 6). Mention démocratie directe suisse comme CONTEXTE, pas comme obligation. Apport paradoxal : la démocratie directe n'est pas un substitut aux obligations conventionnelles."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-233891"
    source_section: "§2.8"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH10"
    enonce: "Suisse initiative populaire fédérale depuis 1891 (Constitution fédérale suisse art. 138-139) : instrument référence mais taux de succès ~10% sur 1891-2026 (cf. admin.ch / ch.ch)."
    source_url: "https://www.admin.ch/"
    source_section: "§11 (Brut de neige)"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH11"
    enonce: "Suisse initiative générale abandonnée officiellement par le Parlement en 2003 comme inapplicable et trop complexe (ch.ch archives)."
    source_url: "https://www.ch.ch/"
    source_section: "§11 (Brut de neige)"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH12"
    enonce: "Liechtenstein initiative populaire : constitutionnelle et référendaire depuis 1921 ; référence mineure."
    source_url: "https://www.regierung.li/"
    source_section: "§11.3"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH13"
    enonce: "Italie Ley 352/1970 : radicato fragmenté, taux succès historique < 50% (quorum 50%+1 difficile)."
    source_url: "https://www.interno.gov.it/it"
    source_section: "§10.4"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH14"
    enonce: "Constitution espagnole 1978 art. 87.3 : initiative populaire législative espagnole 500 000 signatures."
    source_url: "https://www.congreso.es/"
    source_section: "§12"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH15"
    enonce: "Allemagne Article 20a GG 1994 (28. Gesetz zur Änderung des GG) : intégration protection environnement dans la Constitution allemande ; pas de disposition sur démocratie directe."
    source_url: "https://www.bundestag.de/"
    source_section: "§12"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH16"
    enonce: "Bundesverfassungsgericht Neubauer 1 BvR 2656/18 du 24 mars 2021 : décision climatique allemande. Bundes-Klimaschutzgesetz (BKSG) du 12 décembre 2019 révisé le 21 juin 2021 post-arrêt Karlsruhe. Article 20a GG 1994 = fondement constitutionnel inviolable."
    source_url: "https://www.bundesverfassungsgericht.de/SharedDocs/Entscheidungen/EN/2021/03/rs20210324_1bvr265618en.html"
    source_section: "§12"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH17"
    enonce: "Commission de Venise, Code de bonne conduite en matière de référendum (2009, révision 2025) : si un État décide d'utiliser le référendum, voici les principes DOIVENT être respectés. PAS d'obligation d'avoir le référendum."
    source_url: "https://www.venice.coe.int/"
    source_section: "§6"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH18"
    enonce: "Commission de Venise recommande un seuil (1 à 5% du corps électoral) pour le RIC si un État l'adopte. Directement applicable aux débats français sur le seuil RIC 1M signatures Pacte FRANCS."
    source_url: "https://www.venice.coe.int/"
    source_section: "§6"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH19"
    enonce: "Convention d'Aarhus 1998 (rio+10 access information public + participation du public + accès à la justice). Applicable partiellement au RIC environnemental : consultation référendaire obligatoire sur projets à fort impact environnemental (LGV, EPR, mines)."
    source_url: "https://www.un.org/"
    source_section: "§4.1 (Piste 1)"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH20"
    enonce: "Arrêt Refah c. Turquie (Grande Chambre 2003) sur dissolution partis politiques : marge d'appréciation nationale grossière mais existante. Pertinent pour RIC mais pas pour sa mise en œuvre."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-62486"
    source_section: "§4.4 (Piste 4)"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH21"
    enonce: "Convention européenne pour la démocratie par référendum : aucune. Pas de Convention européenne imposant le RIC."
    source_url: "https://www.coe.int/"
    source_section: "§5.1"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH22"
    enonce: "Charte sociale européenne (CSE 1961/1996) : droits économiques et sociaux (logement, santé). Pas de disposition sur démocratie directe."
    source_url: "https://www.coe.int/"
    source_section: "§5.3"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH23"
    enonce: "Obligations positives dérivées de l'art. 8 (vie privée/familiale) : KlimaSeniorinnen 2024 = obligation pour l'État d'organiser politique climatique effective. Extension au RIC = construction juridique nouvelle non-documentée."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-233891"
    source_section: "§4.3 (Piste 3)"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH24"
    enonce: "Doctrine française (Marguenaud, Sudre, Spielmann) : commentaire spécialisé post-Moohan/Gillon confirme marge d'appréciation large ; objection RIC pas applicable Conventionnellement."
    source_url: "https://shs.cairn.info/"
    source_section: "§9.2"
    tier: 2
    glyphe: "✧"
  - id: "F-CEDH25"
    enonce: "Convention européenne des droits de l'homme : CEDH Strasbourg ; dépaysement d'appel individuelle depuis 1953 ; 60 000+ arrêts."
    source_url: "https://hudoc.echr.coe.int/"
    source_section: "§1.3"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH26"
    enonce: "Italie 2024-2030 trajectoire commémorative GI : capacité RIC abrogatif, mais ex-Tribunals ; la plateforme Rousseau M5S = équipée mais hors-Convention."
    source_url: "https://www.giustizia.it/"
    source_section: "§11"
    tier: 2
    glyphe: "✧"
  - id: "F-CEDH27"
    enonce: "Tribunale Milano sez. III 21 ottobre 2024 (sentenza 4768/2024) : condamnation Rousseau piattaforma pour non-conformité ; documenté m5s_italie flirt. Pas application CEDH."
    source_url: "https://www.giustizia.it/"
    source_section: "§11"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH28"
    enonce: "Référendum écossais 2014 + 2016 : post-Brexit, Scotland Act 2016 commande quelque nouvelle delegated powers ; pas d'application CEDH positive obligation."
    source_url: "https://www.gov.scot/"
    source_section: "§11"
    tier: 2
    glyphe: "✧"
  - id: "F-CEDH29"
    enonce: "Marre et consorts c/ France (Requête 37145/14, 8 décembre 2016) : exemple de QPC français sur RIC rejeté ; la France s'en tient au verrou art. 11."
    source_url: "https://hudoc.echr.coe.int/eng?i=001-169179"
    source_section: "§11"
    tier: 1
    glyphe: "✦"
  - id: "F-CEDH30"
    enonce: "Code de la Convention EDH : pas de jurisprudence imposant un mécanisme d'initiative populaire directe."
    source_url: "https://hudoc.echr.coe.int/"
    source_section: "§10"
    tier: 1
    glyphe: "✦"

