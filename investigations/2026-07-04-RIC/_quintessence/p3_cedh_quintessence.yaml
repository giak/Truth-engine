causalites:
  - cause: "F-CEDH08"
    effet: "F-CEDH30"
    mecanisme: "Arrêt Moohan/Gillon 2019 (Grande Chambre) confirme le referendum relève du droit constitutionnel national → pas d'obligation CEDH sur RIC."
  - cause: "F-CEDH09"
    effet: "F-CEDH23"
    mecanisme: "Verein KlimaSeniorinnen 2024 condamne Suisse pour climat MAIS démocratie directe suisse n'est pas substitut aux obligations conventionnelles → extension analogique obligations positives art. 8 possible pour RIC climatique."
  - cause: "F-CEDH26"
    effet: "F-CEDH27"
    mecanisme: "Italie.Rousseau piattaforma M5S 2018-2024 = cas d'école de capture non-Conventionnelle ; condamné par Tribunale Milano sez. III 21 ottobre 2024 (sentenza 4768/2024) ; pas application CEDH."
  - cause: "F-CEDH03"
    effet: "F-CEDH07"
    mecanisme: "Marge d'appréciation large CEDH (Gitonas 1997) → États souverains en matière constitutionnelle (Josipović 2010) → Confirmé Moohan/Gillon 2019 pour RIC."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le levier CEDH direct est ROMPU sur RIC : 8 précédents convergent vers la marge d'appréciation nationale large. Le peuple français ne peut pas déroger unilatéralement aux traités UE via CEDH."
  - position: "Antithèse"
    argument: "4 pistes indirectes existent : Convention Aarhus 1998 (RIF env), KlimaSeniorinnen 2024 rhétorique, obligations positives art. 8 (RIC climatique), Refah 2003 (marge contestation partielle). Au moins rhétoriques, au moins contentieuses."
  - position: "Synthèse"
    argument: "Le RIC reste une décision politique souveraine. CEDH est au mieux un aiguillon rhétorique (Piste 4), pas un levier contentieux (Pistes 1-3). Le levier réel reste : Judo Rhétorique cantonales 2027 + Éloge Surface OAT/Bund boycott + discipline FRANCS 5-10%."

limites:
  - "Verein KlimaSeniorinnen 2024 = précédent récent ; marge d'appréciation reste applicable à RIC non-climatique."
  - "Pas de saisine directe française contre absence RIC : politique d'inaction contentieuse assumée."
  - "Maintien CEDH stable depuis 1964 sur primauté : aucune ouverture prévisible vers une obligation positive sur RIC à 10 ans."
  - "Conventions Aarhus 1998 limitée partiellement ; pas de Convention européenne sur RIC."

wolves:
  - nom: "Doctrine CEDH française (Marguenaud, Sudre)"
    argument: "Le levier CEDH est limité mais invocable comme aiguillon rhétorique."
    reponse: "Position consacrée + reconnaissance de la limite forensique."
  - nom: "Tribunale Milano 2024 (Italie)"
    argument: "Arrêt 4768/2024 sur Rousseau piattaforma = inspiration possible pour CEDH contentieuse."
    reponse: "Hors-compétence CEDH française ; filtré par cour constitutionnelle italienne en amont."
  - nom: "Association France-Palestine (anti-israélien content RIC oriente)"
    argument: "KlimaSeniorinnen applicable à France sur politiques climatiques."
    reponse: "L'extension analogique exige contentieux distinct ; aucune transmission directe en France pour RIC."

iceberg:
  - "Saisine directe contre France sur absence RIC : stratégie de contenu jamais testing ; résultat probable irrecevabilité ratione materiae."
  - "KlimaSeniorinnen 2024 étendue analogique RIC climatique hors-environnemental : construction juridique ouverte, jamais explorée."
  - "Mnemolite DOWN : transversalités cross-séries avec Lois-Pénal-RIC (civ. Q. 37145/14 Marre c/ France) ?"
  - "CEDH décisions sur autres référendums UE : détaillée 64 décisions récentes, pas examinées."


