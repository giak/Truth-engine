enquete_titre: "Conventions citoyennes vs RIC contraignant : pattern délibération→application (2019-2026)"
statut: "COMPLETE"
lecture_status: "Integrale - 30 faits atomiques extraits"
shadow_factor: 2.3

these_extraite_du_§0_lecture_integrale: |
  Le pattern « Convention citoyenne→RIC contraignant » existe (Irlande, Ostbelgien, Corrézienne CD 19)
  mais reste embryonnaire en France : sur 3 conventions majeures 2019-2026, seules les locales CD 19
  permettent application contraignante (~85%) car le commanditaire (CD) a compétence exécutive directe.
  Les conventions nationales (Climat 2019-2020, Fin de vie 2024) sont systématiquement dévaluées lors
  de la transcription parlementaire : taux réel ~30% vs 67% officiel ADEME-CGDD oct 2023. Le passage
  Convention→RIC contraignant nécessite un mécanisme de transformation que la France n'a pas
  (à la différence de l'Irlande Citizens' Assembly+Oireachtas ayant produit 2 référendums réussis
  mariage 2015 + avortement 2018).

