these_extraite_du_§0_lecture_integrale: |
  La France 2026-2030 ne pourra pas porter un RIC de masse (cible P3 #11 : 500 communes RIL + 7,5M€
  sur 5 ans) sans substrat technique open-source fiable. Ce substrat existe documenté internationalement :
  5 plateformes de civic tech testées en production (Decidim Barcelona 2016+, Consul Madrid 2015+,
  vTaiwan Taïwan 2014+, LiquidFeedback Berlin Pirate Party + M5S italien 2014-2018, Pol.is MIT 2012+)
  avec un bilan paradoxal : Decidim a 200K usagers uniques à Barcelone (12% de la population), vTaiwan
  démontre 5 cas de régulation aboutie (UberX 2015, mariages 2019, covidmask 2020), LiquidFeedback a été
  capturé par Casaleggio/Rousseau Advisors M5S italien (désactivation 2018), Pol.is échoué sur Wikicite,
  Consul Madrid 2019 alternances politiques budget drastiquement réduit. 8 biais structurels (UX gamification
  churn, modération bottleneck, biais CSP+ 3-12% participation, capture algorithmique seeding adversarial,
  RGPD-vs-radical transparency, sécurité usurpation identité, dépendance plateforme unique, accessibilité).

