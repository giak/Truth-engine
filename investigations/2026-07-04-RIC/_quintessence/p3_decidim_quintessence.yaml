causalites:
  - id: C-DECI01
    type: M1-organisationnel
    source: "Consulat Barçelona Polics + Mairie Madrid archives"
    enonce: "Capture-organisationnelle : civic tech 100% dépendant institution (hébergeur + modération + animation)"
    preuve: "Mairie Barcelona dépendance + Mairie Madrid 2019 budget reduction"
  - id: C-DECI02
    type: M2-financier
    source: "OpenGov P3 #14 + P3 #14"
    enonce: "Capture-financière : civic tech nécessite ~$200K+/an ; freemium-paye = amor limited"
    preuve: "OpenGov US $20M venture fail 2013-2018"
  - id: C-DECI03
    type: M3-juge-partisan
    source: "Wikipedia M5S Capture 2017 + audit Adele Tang 2022"
    enonce: "Capture-juge partisan : modération = politics pure ; M5S Capture Casaleggio = archétype risque"
    preuve: "M5S LiquidFeedback désactivation 2018 peur capture interne"
  - id: C-DECI04
    type: M4-anthropomorphique
    source: "Wallas + Schumpter"
    enonce: "Capture-anthropomorphique : démocratie pure = irrepresentable ; civic tech doit hybride participation/expertise"
    preuve: "Hong Eq + Decidim CivicSpace structure anomalies anthropomorphiques"
  - id: C-DECI05
    type: boucle-organisationnel
    source: "Mairie Madrid 2019"
    enonce: "Boucle : dépendance mairie → alternance → budget réduction → disparition plateforme (Decidim Roubaix)"
    preuve: "Decidim Roubaix fermée 2022 par municipalité socialiste"
  - id: C-DECI06
    type: boucle-financière
    source: "OpenGov open-data"
    enonce: "Boucle : freemium-payant ne fonctionne pas client municipales ; OpenGov vendu 2020 Tyler Tech"
    preuve: "OpenGov US cesse civic-tech collaboratif original"
  - id: C-DECI07
    type: boucle-capture-M5S
    source: "Casaleggio Archiv + Wikipedia"
    enonce: "Boucle Capture M5S : Casaleggio fondateur → Rousseau Advisors opaque → désactivation 2018 → perte démocratie interne"
    preuve: "M5S Capture 2014-2018 archétype du risk"
  - id: C-DECI08
    type: solution-DecidimFR-SecNumCloud
    source: "Levier 1 P3 #14 §11.1"
    enonce: "Solution : Decidim-FR héberger SecNumCloud ANSSI + X-Road FR authentification"
    preuve: "Levier 1 P3 #14"
  - id: C-DECI09
    type: solution-coupling-Pol.is-Decidim
    source: "Levier 2 P3 #14 §11.2"
    enonce: "Solution : Pol.is pour identification clusters + Decidim pour délibération asynchrone + vTaiwan pour binding citoyen"
    preuve: "Levier 2 P3 #14"
  - id: C-DECI10
    type: solution-Loi-CivicTech-FR
    source: "Levier 5 P3 #14 §11.5"
    enonce: "Solution : loi CivicTech-FR 2027 opérationnaliser les 5 leviers + Decidim-FR + VTAIWAN sans recréer 1/3UE ; Constitution Régionale"
    preuve: "Levier 5 P3 #14"

