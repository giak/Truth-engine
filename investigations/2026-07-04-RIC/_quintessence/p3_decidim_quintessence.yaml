enquete_titre: "Démocratie numérique open-source (Decidim, Consul, vTaiwan, LiquidFeedback, Pol.is) : substrat technique RIC 2026-2030"
statut: "COMPLETE"
lecture_status: "Integrale - 27 faits atomiques extraits"
