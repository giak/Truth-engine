these_centrale: "Le verrouillage du RIC en France n'est pas anonyme mais nominatif : 20 Hauts Fonctionnaires identifiables opérant sur 4 étages institutionnels (Conseil Constitutionnel filtre RIP → Conseil d'État rapports publics → SGG mémoires en défense → Commissions des Lois enterrement parlementaire), protégés par l'anonymat administratif anti-accountability, recyclés post-fonction dans des postes économiques privés (pantouflage). Le verrou peut être démantelé par la réforme du règlement intérieur CC + l'allongement du délai HATVP + la publication des mémoires SGG."

theses_implicites:
  - "Le blocage du RIC n'est pas le fait « des juges » ou « du système » en général ; il est l'œuvre d'un petit groupe de 20 personnes physiques identifiables dont les nominations JO, les carrières (ENA, ENS, Sciences Po) et les positions sont documentables."
  - "La doctrine de l'anonymat administratif cache une responsabilité individuelle : ce qui est présenté comme protecteur (protection des fonctionnaires) opère en réalité comme absence d'accountability démocratique."
  - "Le pantouflage post-fonction des HF français (Rothschild, Lazard, EDF, Total, think tanks Montaigne + Fondapol) crée un verrou d'intérêts : les anciens HF sont liés aux milieux économiques qui ont intérêt au statu quo institutionnel."
  - "Le verrou des Hauts Fonctionnaires est opéré par une chaîne procédurale de 4 étages (CC → CE → SGG → Commissions des Lois) qui produit l'effet final sans qu'aucun responsable nominatif unique ne puisse être identifié publiquement."

faits_atomiques:
  - id: "F-HFB01"
    enonce: "Laurent Fabius, président du Conseil Constitutionnel depuis 2016 (mandat 2016-2029), ancien Premier ministre 1984-1986, président COP21. Vote systématiquement l'irrecevabilité des PPL RIC."
    source_url: "https://www.conseil-constitutionnel.fr/le-conseil-constitutionnel/les-membres-du-conseil-constitutionnel"
    source_section: "§2.1"
    tier: 1
    glyphe: "✦"
  - id: "F-HFB02"
    enonce: "Cécile Guérin-Barral, secrétaire générale du CC depuis 2024, magistrate administrative, coordonne l'instruction des dossiers RIP depuis juin 2024."
    source_url: "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000049919045/"
    source_section: "§2.1"
    tier: 1
    glyphe: "✦"
  - id: "F-HFB03"
    enonce: "Conseil Constitutionnel : 9 membres nommés par Président République + Présidents AN/Sénat (art. 56 Constitution). Mandat 9 ans non renouvelable. Composition publiée JO."
    source_url: "https://www.conseil-constitutionnel.fr/le-conseil-constitutionnel/les-membres-du-conseil-constitutionnel"
    source_section: "§2.1"
    tier: 1
    glyphe: "✦"
  - id: "F-HFB04"
    enonce: "La procédure de filtrage des RIP : saisine du CC par Président AN ou Sénat → instruction par SG (Guérin-Barral 2024-) → désignation d'un rapporteur parmi les 9 membres (anonymisé) → vote en formation plénière → publication décision sans mention nominative du rapporteur."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "§2.1"
    tier: 1
    glyphe: "✦"
  - id: "F-HFB05"
    enonce: "Exception française : le rapporteur des décisions CC n'est pas publié. Bundesverfassungsgericht allemand + Corte Costituzionale italienne + Tribunal Constitucional espagnol publient nominativement le rapporteur dans TOUTES leurs décisions."
    source_url: "https://www.bundesverfassungsgericht.de/"
    source_section: "§5 indice A2"
    tier: 1
    glyphe: "✦"
  - id: "F-HFB06"
