causalites:
  - cause: "F-HFB04"
    effet: "F-HFB05"
    mecanisme: "La procédure CC de filtrage des RIP avec rapporteur anonyme aboutit механиquement à une exception française non-justifiée comparativement au Bundesverfassungsgericht allemand où le rapporteur est public."
  - cause: "F-HFB14"
    effet: "F-HFB01"
    mecanisme: "Le SGG (Grimbert puis Moal) rédige les mémoires en défense devant CC ; CC (Fabius + 8 membres anonymisés) vote irrecevabilité sur argument de fond fabriqué par le SGG : chaîne d'opacité externe."
  - cause: "F-HFB07"
    effet: "F-HFB29"
    mecanisme: "Le pantouflage Sauvé en Lazard conseil 2019 produit un conflit d'intérêts structurel : même cabinet conseille des groupes financiers hostiles au RIC interventionniste, créant un verrou d'intérêts post-fonction."
  - cause: "F-HFB17"
    effet: "F-HFB18"
    mecanisme: "La présidence Braun-Pivet (2017-2022) puis Michaux (2022-2026) à la Commission des Lois produit une inertie multipartite : PPL RIC déposée = non inscrite à l'ordre du jour, donc pas examinée."
  - cause: "F-HFB30"
    effet: "F-HFB05"
    mecanisme: "La loi organique 2019-1140 du CC ne prescrit pas de publication du rapporteur : c'est un choix réglementaire amendable sans révision constitutionnelle → l'anonymat n'est pas constitutionnel mais réglementaire."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le verrou du RIC est identifié nominativement sur 20 Hauts Fonctionnaires ; la réforme du règlement intérieur CC (publication rapporteur) + allongement délai HATVP + publication mémoires SGG sont 3 leviers techniques neutralisables sans révision constitutionnelle."
  - position: "Antithèse"
    argument: "L'anonymat administratif protège la fonction et empêche les pressions politiques directes sur les rapporteurs CC. La rupture d'anonymat risque d'introduire des ciblages politiques partisans incompatibles avec la sérénité des décisions constitutionnelles."
  - position: "Synthèse"
    argument: "L'argument 1 (transparence) vaut pour les cours constitutionnelles des autres pays européens (Allemagne, Italie, Espagne) sans dommage institutionnel ; la publication des rapporteurs français renforcerait la légitimité démocratique sans dégrader la qualité des décisions. La combinaison (a) publication rapporteur + (b) allongement pantouflage (3 → 5 ans) + (c) publication mémoires SGG est un programme réformable techniquement."

limites:
  - "Anonymat des rapporteurs CC : tradition administrative française ; recoupement par carrière (ENA, dates), postes, publications pris de position publiques."
  - "Mémoires SGG non publics : inférence par procédure contentieuse publique (cadrage doctrinal)."
  - "Votes nominatifs CC : pas d'historique ; inférence par alignement public."
  - "Carrière pantouflage post-fonction : Légifrance + Who's Who + LinkedIn + HATVP."
  - "Pas d'accès aux délibérations nominatives CC/C : les fiches forensiques déduisent les positions à partir de publications publiques."

wolves:
  - nom: "Laurent Fabius (Président CC)"
    argument: "'Le CC protège la Constitution contre le chaos plébiscitaire ; l'anonymat du rapporteur préserve l'indépendance de l'institution et l'impartialité des décisions.'"
    reponse: "Allemagne (Bundesverfassungsgericht), Italie (Corte Costituzionale), Espagne (TC) publient nominativement leurs rapporteurs sans dégradation institutionnelle documentée. L'argument ne tient pas comparativement."
  - nom: "Société des juristes constitutionnalistes français (Chagnolaud, Fatin-Rouge Stefanini)"
    argument: "L'anonymat du rapporteur est une tradition républicaine française ; respecter cette tradition est essentiel à l'institution CC."
    reponse: "La 'tradition' est un choix, pas une nécessité juridique ; le règlement intérieur CC est amendable."
  - nom: "Fondapol (Reynié), Institut Montaigne (Bébéar/Touahria)"
    argument: "Publier les rapporteurs CC les expose à des pressions politiques directes ; c'est une fragilisation de l'institution."
    reponse: "L'absence de publication produit l'absence d'accountability démocratique et le verrou structurel ; la pression est l'expression démocratique normale."

iceberg:
  - "Rapport Sauvé Lazard conseil : détails des clients financiers non publics, conflit d'intérêts opérationnels non documentés."
  - "Réseaux pantouflage vs politiques : ENA, corps techniques, cabinets de conseil (McKinsey, BCG) : détail du recyclage non public."
  - "Composition nominative des délibérations CC avant vote publication : non public."
  - "Réseaux HFB-Court des Comptes-IGF : détail non auditable."
  - "Think tanks partenaires non documentés (Fondation Concorde, autres) ; comptes IFRAP et Ifri par hypothèse."

