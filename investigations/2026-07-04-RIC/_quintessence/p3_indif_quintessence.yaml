these_extraite_du_§0_lecture_integrale: |
  Le RIC est plébiscité par 62-73% des Français (cf. P3 #7 SOCIO) mais il n'arrive qu'en queue de liste
  des préoccupations réelles (pouvoir d'achat 38-44%, santé 28-32%, immigration 24-30%, climat 18-22%,
  éducation/retraite/logement 14-20%, **RIC<10%**). L'indifférence majoritaire, et non son opposition
  active, est le vrai verrou du RIC. Paradoxe favorable/non prioritaire : 62-73% favorables (IFOP 2019,
  IPSOS 2024 vague 14) mais <5% le classent parmi les 3 priorités nationales. Sans activation cognitive
  par l'agenda-setting médiatique saturé par d'autres sujets (pouvoir d'achat 20-25% du temps antenne,
  immigration 18-22%, santé 10-14%, **RIC <1%**), l'élite peut maintenir le verrou opérationnel sans
  opposition active.

