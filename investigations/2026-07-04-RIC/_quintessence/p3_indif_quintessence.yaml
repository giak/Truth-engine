causalites:
  - id: C-IND01
    type: M1-learned-helplessness
    source: "Seligman 1975 + Cevipof vague 16"
    enonce: "Apathie apprise : majorité favorable en sentiment mais absent en action ; 50 ans institution centralisée → apathy conditionnée"
    preuve: "65% dangereux politique + 70% préfère détourner"
  - id: C-IND02
    type: M2-effet-Condorcet
    source: "IPSOS What Worries + Triangulation IFOP/FJ"
    enonce: "Ce qui est principe ≠ urgence ; pouvoir d'achat+immigration+santé ~50% agenda vs RIC <5%"
    preuve: "Ratio ~12x"
  - id: C-IND03
    type: M3-agenda-setting
    source: "Acrimed 2024 + Arcom 2024"
    enonce: "Concentration capitalistique médias (P3 #8) sature par anti-priorités ; absence porte-parole médias-mass retail du RIC"
    preuve: "<1% temps antenne RIC"
  - id: C-IND04
    type: M4-no-incarnation
    source: "Politique pro-RIC 2024"
    enonce: "Pas de leader RIC national ; Solution Démocratique = intellectuel mais pas carrière politique ; pas de RIC candidat stable"
    preuve: "Pas d'incarnation leadership pro-RIC"
  - id: C-IND05
    type: boucle-apathie
    source: "Cevipof vague 16"
    enonce: "Apathie → 'favorable en sentiment' → pas action → pas résultat → autre apathie (cycle Seligman)"
    preuve: "65% dangereux politique"
  - id: C-IND06
    type: boucle-Condorcet
    source: "Journal Pol 2024"
    enonce: "Urgence matérielle perçue urgente ≠ RIC perçu comme urgente → RIC ne se classe pas en quartier prioritaire"
    preuve: "Ratio 12-15x"
  - id: C-IND07
    type: boucle-agenda
    source: "Acrimed + Arcom 2024"
    enonce: "Congrès priorités médias : basseclé Passagers-cible authentique ; concentration verrouille saturation RIC"
    preuve: "<1% temps antenne"
  - id: C-IND08
    type: boucle-incarnation
    source: "Théorie demande décisions + Min.Interieur 2024"
    enonce: "Pas de personne RIC engageant élections → pas d'action concrete → pas d'exemples → pas d'espoir Intégral"
    preuve: "Absences candidats RIC Législatives 2024"
  - id: C-IND09
    type: solution-RIL-conviction
    source: "Levier 2 propre enquête + P3 #9"
    enonce: "Pratique 'Référendum Local' commune-par-commune démontre minorité active adopter sujet concret ; premier abaissement 'helplessness'"
    preuve: "Levier 2 P3 #10 §9"
  - id: C-IND10
    type: recom-emotion-connexion
    source: "Levier 5 propre enquête"
    enonce: "Mouvement RIC doit passer du rationnel démocratique au émotionnel des Perte-perte ; RIC devient Recours symbolique société épuisée"
    preuve: "Levier 5 P3 #10 §9"

