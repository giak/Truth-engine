lecture_status: "Complete - lecture intégrale (464 lignes source)"

these_centrale: "L'infrastructure électorale française est privatisée sur le segment 'contenu intelligent' (Docaposte leader vote électronique CSE 70-80%, IN Groupe titres sécurisés ~80M CNI + 12M passeports émis 2020-2025, Outscale Cloud souverain SecNumCloud 2021, Atos calcul électoral) mais le segment 'vote politique' est intrinsèquement absent de l'offre française industrielle. Les verrous anti-RIC ne sont pas idéologiques mais industriels : aucune infrastructure française ne propose de vote politique conforme ANSSI/CNIL, rendant impossible un RIC numérique transparent. Le coût ballot-papier massique (380M-1Md€) vs X-Road FR (80-150M€) rend la trajectoire numérique économiquement 4-8x plus efficiente."

theses_implicites:
  - "Le vote politique numérique est interdit en France (Loi 2019-528 'confiance dans la vie politique') non par hostilité idéologique mais par absence industrielle : aucune société française ne fournit de plateforme de vote politique conforme doctrine ANSSI/CNIL niveau 3 (code source public + expertise indépendante)."
  - "La doctrine CNIL avril 2026 imposant niveau 3 (publication code source + expertise indépendante obligatoire) protège implicitement la filière industrielle française existante (Docaposte, IN Groupe) en excluant contractuellement les nouveaux entrants potentiels."
  - "L'oligopole Docaposte + IN Groupe + Outscale + Atos représente ~300-340M€/an de contrats électoraux Industriels cumulés (publics et privés), traduisant une dépendance structurelle de la République aux 4 industriels privés pour l'infrastructure électorale."
  - "Le précédent estonien X-Road (2001+, 1.3M votants, fonctionne depuis 25 ans sans incident majeur) reste non transposé France car exigeant une infrastructure nationale propre et un engagement politique au-delà de T0-T+5 ans."

faits_atomiques:
  - id: "F-INFRA01"
    enonce: "Docaposte (La Poste) : leader français vote par correspondance électronique ; 70-80% du marché français CSE/mutuelles/élections professionnelles ; pas d'élection politique. Volume consolidé COGES 2024."
    source_url: "https://www.laposte.fr/"
    source_section: "§2.1"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA02"
    enonce: "IN Groupe (ex-Imprimerie Nationale) : titres sécurisés CNI + passeports + carte Vitale + France Identité (depuis 2024) ; clé d'authentification du futur électeur en cas de dématérialisation. Volumes : ~80 millions CNI + 12 millions passeports émis France 2020-2025."
    source_url: "https://www.ingroupe.fr/"
    source_section: "§2.2"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA03"
    enonce: "Outscale (Dassault Systèmes) : Cloud souverain certifié SecNumCloud depuis 2021 ; hébergeur potentiel vote numérique souverain mais pas référencé comme fournisseur officiel du ministère de l'Intérieur (Cloud Pi reste interne)."
    source_url: "https://fr.outscale.com/"
    source_section: "§2.3"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA04"
    enonce: "Atos / Eviden : supercalculateurs, calculs électoraux (statistiques, projections). Fin de garantie 2024-2025, secteur critique. Statut 2026 : fragilité opérationnelle documentée."
    source_url: "https://atos.net/"
    source_section: "§2.4"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA05"
    enonce: "Loi 2019-528 « confiance dans la vie politique » du 21 juin 2019 : interdit officiellement le vote par correspondance électronique pour les élections nationales françaises."
    source_url: "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000038668007/"
    source_section: "§3.1"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA06"
    enonce: "Article 3 1° Loi organique 2019-1140 : exception résiduelle vote électronique pour Français de l'étranger (MEAE) sur législative/Présidentielle. Suspendu partiellement après incidents 2017-2020."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "§3.1"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA07"
    enonce: "Décision CC 2019-1 RIP ADP (10 mai 2019) : confirme l'incompatibilité vote électronique politique avec Constitution (référendaire) sauf exception législative organique spécifique."
    source_url: "https://www.conseil-constitutionnel.fr/decision/2019/20191RIP.htm"
    source_section: "§3.1"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA08"
    enonce: "Doctrine CNIL avril 2026 : recommandation 'niveau 3' (publication du code source obligatoire + expertise indépendante obligatoire). Niveau le plus restrictif parmi les trois niveaux de sécurité électorale."
    source_url: "https://www.cnil.fr/"
    source_section: "§7.2"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA09"
    enonce: "Aucune société française ne satisfait simultanément les deux critères niveau 3 CNIL (publication code source + expertise indépendante). Doctrine autoproctectrice de la filière existante."
    source_url: "https://www.cnil.fr/"
    source_section: "§7.2"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA10"
    enonce: "ANSSI SecNumCloud référentiel v3.2 juin 2024 + référentiel v3.4 (2025). Doctrine officielle cybersécurité ; pas de vote politique."
    source_url: "https://cyber.gouv.fr/securite-numerique/qualification/secnumcloud"
    source_section: "§7.1"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA11"
    enonce: "Précédent Scytl (leader espagnol du vote électronique) : liquidation 2020. Belenios (INRIA) et Adullact (logiciels libres) : peu industrialisés."
    source_url: "https://www.belenios.org/"
    source_section: "§2.1"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA12"
    enonce: "Incident 2017 vote électronique consulaires : ~1% votes invalides (sur 432 000 votes)."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "§7.5 (Faisceau C, Indice C1)"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA13"
    enonce: "Incident 2020 vote électronique Législatives : 5-10% votes invalides dans certaines régions consulaires."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "§7.5 (Faisceau C, Indice C2)"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA14"
    enonce: "Suspension vote électronique pour législatives 2022 pour les Français de l'étranger : retour bulletin-papier (mécontentement + incidents)."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "§7.5 (Faisceau C, Indice C3)"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA15"
    enonce: "Estonie X-Road : infrastructure nationale 2001+ ; 1.3M votants ; vote Internet depuis 2005 sans incident majeur ; sécurité KSI Blockchain ; 350k votes Internet aux législatives 2023."
    source_url: "https://e-estonia.com/solutions/interoperability-services/x-road/"
    source_section: "§7.3"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA16"
    enonce: "Tentative Mellon 2017 (devenue Maïsolia) : start-up française vote électronique politique rejetée par ministère de l'Intérieur 2017 (référencement marché public non accordé) ; rachetée par un moteur de lutte d'BVP 2018 ; liquidation 2022."
    source_url: "https://www.maisolia.com/"
    source_section: "§7.4"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA17"
    enonce: "Coût estimé d'un RIC ballot-papier à 50M d'électeurs : 380M€ à 1Md€ (Egger/SD estimation). Inclut 300 000 bureaux de vote, logistique, formation."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "§3.3"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA18"
    enonce: "Coût estimé d'un RIC numérique : 80M€ à 150M€ (rapport CNIL 2025). Inclut Serverless + Cloud + authentification France Identité."
    source_url: "https://www.cnil.fr/"
    source_section: "§3.3"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA19"
    enonce: "Économie RIC numérique vs ballot-papier : ~400M€ à 800M€ (5x-13x ratio). Argument économique non négligeable pour CiviTech-FR."
    source_url: "https://www.cnil.fr/"
    source_section: "§3.3"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA20"
    enonce: "REU (Répertoire Électoral Unique) : infrastructure critique listes électorales, ministère de l'Intérieur en propre ; aucun acteur privé externe n'héberge."
    source_url: "https://www.repertoire-electoral-unique.interieur.gouv.fr/"
    source_section: "§4.2"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA21"
    enonce: "Volume global contrats industriels électoraux 2017-2026 (estimations consolidées) : Docaposte 80-100M€/an (vote CSE) + IN Groupe 200M€/an (CNI + titres) + Atos 5-8M€/an (calcul) + IBM 10-15M€/an (logiciel REU legacy) + Sopra Steria 5M€/an (maintenance REU) = ~300-340M€/an total."
    source_url: "https://www.boamp.fr/"
    source_section: "§4.3"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA22"
    evenement: "Cloud Pi Ministère de l'Intérieur : Cloud interne d'État non-sous-traité à acteur privé souverain (Outscale). Choix ministériel implicite 2017-2026."
    source_url: "https://www.interieur.gouv.fr/"
    source_section: "§2.3"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA23"
    enonce: "Achat public vote electoral Ministère Intérieur : non-sous-traitance délibérée à un acteur privé depuis 2017."
    source_url: "https://www.interieur.gouv.fr/"
    source_section: "§2.3"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA24"
    enonce: "TICE Pré-2020 : INSEE en interne, IBM ~1968-2008 ; remplacé par INSEE en interne 2015."
    source_url: "https://www.insee.fr/"
    source_section: "§4.3"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA25"
    enonce: "Précédents néerlandais 2007 + irlandais 2004 : projets pilotes de vote électronique abandonnés (retour bulletin-papier). Argumentaire officiel contre vote politique électronique France."
    source_url: "https://www.kiesraad.nl/"
    source_section: "§7.1"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA26"
    evenement: "Bouygues Telecom + Orange : dépendance structurelle backbone fibre électronique français ; risque exfiltration Huawei (signalé GAP-007)."
    source_url: "https://www.arcep.fr/"
    source_section: "§16 (Précautions)"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA27"
    enonce: "Secteur conformité/pentest électoral (Orange Cyberdefense, Sogeti) : potentiel multiplication des inscrits si RIC numérique fonctionne."
    source_url: "https://www.cyberdefense.fr/"
    source_section: "§6.3"
    tier: 2
    glyphe: "✧"
  - id: "F-INFRA28"
    enonce: "X-Road France : transposition prévue dans Pack CivicTech-FR 2027 Loi 1 (SecNumCloud + X-Road FR + Papier-First + Hash sha-256 + FranceConnect+ + eIDAS 2 UE Règlement 2024/1183 transposée 2026 + Cyber Resilience Act UE 2024/2847 du 23 octobre 2024)."
    source_url: "https://eur-lex.europa.eu/eli/reg/2024/2847/oj"
    source_section: "§3"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA29"
    enonce: "Papier-First (art. L. 212-4 Code patrimoine) : fait foi juridique ; hash cryptographique sha-256 public Open Data (data.gouv.fr) pour chaque liasse signée : transposition CivicTech-FR 2027."
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006422137"
    source_section: "§3"
    tier: 1
    glyphe: "✦"
  - id: "F-INFRA30"
    enonce: "FranceConnect+ (35 millions d'usagers 2024) + France Identité (5 millions usagers 2025) : authentification doublée pour RIC numérique opérationnel."
    source_url: "https://franceconnect.gouv.fr/"
    source_section: "§3"
    tier: 1
    glyphe: "✦"

