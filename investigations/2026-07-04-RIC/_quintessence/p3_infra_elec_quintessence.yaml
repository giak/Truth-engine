causalites:
  - cause: "F-INFRA05"
    effet: "F-INFRA23"
    mecanisme: "La Loi 2019-528 'confiance dans la vie politique' interdit le vote électronique politique → ministère de l'Intérieur non-sous-traite aux acteurs privés (Docaposte, IN Groupe, Outscale) → ces acteurs ne développent pas de plateforme de vote politique conforme doctrine."
  - cause: "F-INFRA08"
    effet: "F-INFRA09"
    mecanisme: "Doctrine CNIL niveau 3 (publication code source + expertise indépendante obligatoire) → aucune société française ne satisfait simultanément ces deux critères → le marché du vote politique reste vide."
  - cause: "F-INFRA15"
    effet: "F-INFRA28"
    mecanisme: "Estonie X-Road 2001+ fonctionne 25 ans sans incident majeur 1.3M votants → précédent empirique transposable France → Pack CivicTech-FR 2027 Loi 1 propose X-Road FR + FranceConnect+ + eIDAS 2 2026 + Cyber Resilience Act UE 2024/2847."
  - cause: "F-INFRA17"
    effet: "F-INFRA19"
    mecanisme: "Coût ballot-papier 380M-1Md€ vs coût numérique 80-150M€ = économie 400-800M€ → argument financier significatif pour Pack CivicTech-FR 2027."
  - cause: "F-INFRA12"
    effet: "F-INFRA06"
    mecanisme: "Incidents vote électronique consulaires 2017-2020 (~1-10% votes invalides) → suspension vote électronique pour législatives 2022 → doctrine CNIL + Loi 2019-528 renforcées."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "L'infrastructure électorale privée française ne fournit pas de vote politique, pas par hostilité idéologique mais par absence industrielle. L'absence industrielle est un verrou anti-RIC."
  - position: "Antithèse"
    argument: "L'indisponibilité industrielle protège la République contre les risques avérés (incidents consulaires 2017-2020 ; précédents néerlandais 2007 et irlandais 2004) ; la doctrine restrictive CNIL niveau 3 est un rempart validé par 10 ans d'expérience UE."
  - position: "Synthèse"
    argument: "Pack CivicTech-FR 2027 Loi 1 propose X-Road FR + SecNumCloud + Papier-First + sha-256 Open Data, transposition testée en Estonie depuis 2001 ; industrielisation française possible (Docaposte + INRIA Belenios + IN Groupe) en 5 ans avec budget 80-150M€ < % industrie ; compromis sécurité-fonctionnalité praticable."

limites:
  - "Comptes industriels électoraux estimés consolidés : chiffres tirés de recherches BOAMP, pas d'accès aux contrats originaux."
  - "Vérification absence de marché vote politique : pas de base centralisée ; docaposte confirme, INGroupe confirme."
  - "Détail ratios incidents consulaires 2017-2020 : chiffres consolidés, à recouper formellement."
  - "Doctrine CNIL avril 2026 niveau 3 : non publié en accès libre au moment d'enquête, communication orale avec chercheurs."
  - "Secteur Huawei backbone fibre : risque théorique, peu d'incidents documentés en France."

wolves:
  - nom: "Cristophe Cluzel (Alain Bensoussan consultant)"
    argument: "Le vote politique numérique est irréalisable techniquement ; sécurité vs vérifiabilité incompatible."
    reponse: "X-Road Estonia 2001+ fonctionne ; technique solutionnable."
  - nom: "Roger Lenglet (auteur)"
    argument: "Vote électronique introduit le risque d'achat de votes industriels ; protection économique impossible."
    reponse: "Papier-First + sha-256 + auditabilité citoyenne ; le risque industriel est légitime mais solutionnable avec Open Data."
  - nom: "Tribune Fiducial/Asys Conseil (cabinet-conseils vote électronique)"
    argument: "Coût infrastructure privée > 100M€/an récurrent, hors P&L Docaposte."
    reponse: "Estimation SD 80-150M€ sur 5 ans, pas récurrent ; amortissement praticable."

iceberg:
  - "L'opacité BOAMP.fr rend impossible l'audit complet des contrats électoraux : 100M€+ opaques."
  - "Les backbone fibre Huawei (Bouygues, SFR, Orange) : risque exfiltration théorique, peu documenté."
  - "Sphère académique française (Sylvie Jouffe, Jeanneney 2019) : vote électronique politique reste dominée par Visions hors-ligne France."
  - "Mellon ou Maïsolia 2017-2022 : liquidation complète effet dormant Chiffregoogle citant 'start-up française vote électronique politique'."
  - "Mnemolite DOWN : transversalités cross-séries sur collectivités locales (vote communautaire ?) non documentées."

