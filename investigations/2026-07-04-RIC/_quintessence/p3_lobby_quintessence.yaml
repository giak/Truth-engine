these_extraite_du_§0_lecture_integrale: |
  Les cabinets-conseils (McKinsey, BCG, Bain, Big 4, Roland Berger, Sia Partners) constituent un verrou
  oligarchique STRUCTUREL contre le RIC, non par opposition idéologique assumée mais par paradigme
  épistémique et emprise sur la fabrique de l'action publique. Selon rapport Sénat n°578 mars 2022,
  dépenses de conseil auprès de l'État français sont passées de 379M€ en 2018 à 900M€ en 2021 (croissance
  +137%) : emprise croissante documentée. Le RIC, outil de désintermédiation populaire, menace
  structurellement ce paradigme décisionnel technico-expert qui domine l'État. Mécanisme : la complexité
  technique imposée par l'industrie du conseil fatigue le débat politique; le citoyen non-expert ne peut
  pas suivre ; la sphère de délibération experte est confisquée par quelques cabinets qui ne s'opposent
  jamais explicitement au RIC mais verrouillent par leur paradigme top-down.

