    type: boucle-loups
    source: "27 loups identifiés"
    enonce: "Loups nominatifs → éditoriaux hostiles → cadrage négatif → RIC délégitimé → loups invités à recommencer (cycle auto-entretenu)"
    preuve: "Recension 2018-2025"

