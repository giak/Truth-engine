heritages:
  P0_bce: "le verrou BCE est impersonnel ; le verrou médiatique est nominatif (27 loups). C'est l'aspect miroir : verrouillage top-down contre verrouillage mid-level"
  P0_religieux: "le « devoir de prudence » des évêques catholiques est analogue à la prudence éditoriale Le Monde/Figaro/Échos, fondée sur la tradition"
  P0_morts_politiques: "les Hauts Fonctionnaires (Fabius, Villeroy, Chevènement) sont directement liés à l'oligopole médiatique : passeurs entre État et rédaction"
  P0_verrous: "le verrou P0 #4 (méthodologie impersonnelle) est complété par le verrou médiatique (cadrage). C'est double vêtement du verrouillage structurel"
  P1_coordination: "le levier européen suppose l'ouverture du débat médiatique français ; ce débat reste verrouillé"
  P2_financement: "le financement SD est orthogonal à l'oligopole médiatique (Substack ≠ Le Monde). Le levier Substack confirme la construction alternative populaire"
  P3_hfb: "les HF verrouillent par le haut ; P3 #8 montre que les éditorialistes verrouillent par le mid (l'opinion formée)"
  P3_infra_elec: "l'absence d'infrastructure électorale privée est secondaire au cadrage médiatique. Les médias bloquent l'opinion avant que l'infrastructure soit interrogée"
  P3_cedh: "le levier CEDH présuppose un débat public français ouvert aux juridictions ; le verrouillage médiatique ferme ce débat"
  P3_conv_cit: "la convention climat a été cadrée comme « tiède » ; les éditeurs ont neutralisé le mécanisme institutionnel. P3 #8 confirme la dépendance média-conventions"
  P3_lobby: "les cabinets conseil sont silencieux (P3 #5) ; les médias sont bruyants anti-RIC. Différence stratégique : Cabinet = institution marchande logique ; Média = intermédiaire opinion politique"
  P3_socio: "la majorité pro-RIC silencieuse (62-73%) ne se reflète pas dans l'éditorial ; c'est un paradoxe démocratique au cœur du verrou médiatique"

