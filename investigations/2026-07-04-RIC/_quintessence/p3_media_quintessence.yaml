enquete_titre: "Cadrage médiatique hostile au RIC (2018-2026) : 9 propriétaires Arcom + 27 loups nominatifs"
statut: "COMPLETE"
lecture_status: "Integrale - 30 faits atomiques extraits"
shadow_factor: 2.3

these_extraite_du_§0_lecture_integrale: |
  Le RIC est verrouillé médiatiquement par oligopole de 9 propriétaires contrôlés par Arcom
  (75-85% audience TV-radio-presse quotidienne nationale) et par cadrage éditorial convergent Le Monde
  / Le Figaro / Les Échos, animé par ~27 éditorialistes+intellectuels nominatifs hostiles (Schoettl,
  Rosanvallon, Schnapper, Weil, Olivier Duhamel, Reynié, Jaffré, Onfray, Bébéar, Villeroy de Galhau,
  Fabius + éditorialistes Le Monde/Figaro/Échos) avec asymétrie de pouvoir : minorité numérique mais
  surreprésentation éditoriale et institutionnelle. Trois faits documentés : (1) oligopole 9 groupes
  Vivendi/Bolloré (15 Md€), Bouygues/TF1 (5 Md€), CMA CGM/Altice BFM (3 Md€), Lagardère, Dassault
  (Figaro), LVMH (Échos), NRJ, M6/Bertelsmann, Amaury. (2) Cadrage Le Monde/Figaro/Échos 12-25
  éditoriaux/an hostiles au RIC 2018-2025, pic décembre 2018 post-GJ. (3) Convergence 80% éditorial
  hostile vs 62-73% opinion pro-RIC : inversion Ω caractéristique.

