enquete_titre: "Référendums locaux France 2003-2026 : chaînon manquant RIL→RIC"
statut: "COMPLETE"
lecture_status: "Integrale - 30 faits atomiques extraits"
shadow_factor: 2.4

these_extraite_du_§0_lecture_integrale: |
  Le RIC français est verrouillé par l'absence d'un chaînon institutionnel manquant entre le référendum
  d'initiative locale (art. L1112-1 CGCT, art. 72-1 al. 2 Constitution) et le référendum d'initiative
  citoyenne national (art. 11 et suivants). Ce chaînon, ouvert en droit depuis la loi constitutionnelle
  du 28 mars 2003 (loi Raffarin), dort dans la pratique. Trois constats documentés : (1) Cadre
  juridique ouvert mais non utilisé : art. 72-1 al. 2 + Consultation locale art. L1112-1 et suivants
  CGCT + Droit pétition L1112-16 + LPRR 2019-1461 ; (2) Bilan quantitatif atone : <12 référendums
  locaux décisionnels aboutis sur 23 ans (2003-2026) ; 200-300 consultations indicatives selon
  data.gouv.fr et Sénat ; (3) Précédent emblématique mais isolé : Notre-Dame-des-Landes 2016 (51%
  participation) mais sous art. 74-1 Constitution (initiative État) et non commune. La France a créé
  en 2003 le maillon d'une démocratie locale consultative mais ne l'a pas activé, produisant 23 ans
  de pratique atone vs Suisse où chaque canton organise 2-5 Landsgemeinde par décennie.

