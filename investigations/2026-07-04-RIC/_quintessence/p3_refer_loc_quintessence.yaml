  P0_religieux: "le « devoir de prudence » catholique correspond à la « prudence préfectorale » anti-RIL"
  P0_morts_politiques: "André Laignel (poste de Président de l'AMF) incarne la trajectoire politique « mort-anti-RIL » comme Fabius CC anti-RIC"
  P0_verrous: "le verrou RIL est impersonnel (juridique) mais nominatif en arrière-plan (préfet, AMF local, Direction collectivités locales)"
  P1_coordination: "la France pourrait apprendre de la Suisse, mais la coordination européenne ne transferre pas la culture référendaire"
  P2_financement: "le lobby RN/LFI/PNRED sont en compétition pour construire un mouvement POUR en faveur de l'activation RIL"
