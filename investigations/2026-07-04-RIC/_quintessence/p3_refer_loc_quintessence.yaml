causalites:
  - id: C-LOC01
    type: M1-préfet
    source: "CGCT L1112-5 + Audition Sénat 2018"
    enonce: "Verrou préfectoral : préfet oppose motif ordre public, est issu culture centralisatrice (P3 #1 HFB), verrouille par flou administratif"
    preuve: "Art. L1112-5 + pratiques administratives"
  - id: C-LOC02
    type: M2-inertie
    source: "Sondages AMF 2023 + Tocqueville"
    enonce: "Inertie culturelle/politique maires : RIL perçu dangereux, pas de pédagogie organisée, préfèrent concertation fermée ; réflexe jacobin centralisatrice verticalité exécutive"
    preuve: "Rapport AMF 2023"
  - id: C-LOC03
    type: M3-médias
    source: "Acrimed 2024 + IFOP 2023"
    enonce: "Verrou médiatique : référendums locaux rarement couverts presse nationale ; presse locale couvre consultations rarement analytique ; RIC absent éditoriaux donc RIL plus encore"
    preuve: "Acrimed 2024 angles morts"
  - id: C-LOC04
    type: M4-doctrine
    source: "Rapport Vandenberghe 2018 + Vacquant 2024"
    enonce: "Omission doctrinale : rapport Vandenberghe 2018 propose RIC mais ne recommande pas développement RIL ; pas de courant doctrinal pro-RIL structurant"
    preuve: "Rapport Vandenberghe 2018"
  - id: C-LOC05
    type: boucle-prefet
    source: "P3 #1 HFB + L1112-5"
    enonce: "Préfet verrouille → maire prudent → RIL ne s'organise pas → précédent inexistant → préfet peut continuer à bloquer"
    preuve: "Auto-entretenu 23 ans"
  - id: C-LOC06
    type: boucle-maire
    source: "Tocqueville + AMF 2023"
    enonce: "Culture jacobin centralisatrice → maire craint → RIL inactif → pas précédent → inertie culturelle renforcée"
    preuve: "Tocqueville héritage"
  - id: C-LOC07
    type: boucle-medias
    source: "P3 #8 MEDIA + Acrimed 2024"
    enonce: "Médias ne couvrent pas RIL → citoyens non informés → RIL non demandé → Concentration capitalistique verrouille"
    preuve: "Arcom 2024"
  - id: C-LOC08
    type: boucle-doctrine
    source: "P3 #1 + Doctrine Vacquant 2024"
    enonce: "Doctrine ne recommande pas RIL → pas enseignement étudiant → pas imprégnation institutionnelle → RIL reste inconnu"
    preuve: "Manuel Favoreu + Vacquant 2024"
  - id: C-LOC09
    type: levier-pétition
    source: "LPRR 2019"
    enonce: "Transformer droit pétition seuil 1/10e ou 1/5e en obligation scrutin : CM qui reçoit pétition seuil DOIT obligatoirement organiser RIL"
    preuve: "Levier 2 P3 #9 §9"
  - id: C-LOC10
    type: solution-500-communes
    source: "Recommandation propre enquête"
    enonce: "500 communes activant RIL/an en moyenne sur 10 ans = 5 000 RIL = 14% parc communal (cible précédent jurisprudentiel suffisant pour RIC national)"
    preuve: "Levier 3 P3 #9 §9"

