these_extraite_du_§0_lecture_integrale: |
  Le RIC révocatoire (mécanisme permettant aux citoyens de révoquer un élu en cours de mandat) est documenté
  internationalement comme arme à double tranchant : instrument anti-capture sur le pouvoir exécutif
  (Wisconsin 2011, Californie 2003, modèle anti-Maduro Vénézuela 2016) mais instrument de capture majoritaire
  entre les mains de l'opposition russo-vénézuélienne (Russia Navalny 2018 bloque, Israël recall Netanyahu
  bloque) ou instrument d'ingérence institutionnelle contre les juges anti-corruption (Bolivie 2015).
  8 cas internationaux documentés : Californie Davis/Schwarzenegger 2003, Wisconsin Walker 2011, Venezuela
  Chávez 2004 + Maduro 2016, Israël Knesset 1990-2024, Bolivie Morales 2015, Russie Navalny 2018, Espagne
  Murcia 2015. 10 biais structurels (organisationnel, financier, juge partisan, anti-opposition, déficit
  d'alternative, théâtre, thresholds bas-hauts, double légitimité, couplage M5S-péjoratif, asymétrie temporelle).
  Proposition mécanisme français anti-capture 2026-2030 à 5 conditions cumulatives : seuil 10% électeurs,
  validation CC préalable, calendrier contraignant 90 jours, alternatives obligatoires 5 candidats,
  cooldown 30 mois.

