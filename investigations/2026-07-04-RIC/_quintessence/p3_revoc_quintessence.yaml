causalites:
  - id: C-REV01
    type: M1-organisationnel
    source: "Rapport Carter Center 2004 + Iraqi 2016 + Bolivien 2015 + Russia 2018"
    enonce: "Capture-organisationnelle : Recall dépendant 100% de l'institution électorale ; validation signatures = discrétion de l'institution"
    preuve: "Vénézuela 2004 CNE controlado + Madero 2016 CNE bloque 7,5M signatures"
  - id: C-REV02
    type: M2-financier
    source: "California FPPC 2003-12-2004 + Wisconsin GAB"
    enonce: "Capture-financière : Recall campagne nécessite ~$10M+ ; automatiquement réduit aux candidats riches (Schwarzenegger celebrity/wealth)"
    preuve: "California 2003 $123M + Wisconsin 2011 $90M"
  - id: C-REV03
    type: M3-judiciaire
    source: "Russia 2018 + Bolivia 2015 + Israel 2024"
    enonce: "Capture-juge partisan : justices peuvent disqualifier Recall technical ; pattern Russia+'Bolivie+Israel'"
    preuve: "CCE Russie 2018 rejette 1,2M signatures Navalny"
  - id: C-REV04
    type: M4-antérioricité
    source: "Wisconsin Recall 2011-2012 + California 2000-2022"
    enonce: "Capture-antérioricité : Recall = arme utilisé par les deux camps (aboutissement rare, dissuasif plutôt qu'opérationnel)"
    preuve: "Wisconsin Republicans vs Democrats corporate"
  - id: C-REV05
    type: boucle-organisationnelle
    source: "Venezuela 2004 + 2016"
    enonce: "Boucle organisationnelle : El en place bloque validation signatures → opposants bloquent Recall → El renforce autoritarisme"
    preuve: "VZ 2016 Maduro bloque 7,5M signatures"
  - id: C-REV06
    type: boucle-financière
    source: "California FPPC + Wisconsin + autres"
    enonce: "Boucle financière : Recall coûteux → seuls candidats riches/peuple organisés → Recall déclassant la démocratie"
    preuve: "Schwarzenegger celeb-wealth $30M+"
  - id: C-REV07
    type: boucle-judiciaire
    source: "Russia 2018 + Bolivia 2015"
    enonce: "Boucle judiciaire : justice aux ordres bloque opposition Recall → capture système judiciaire"
    preuve: "CCE Russie rejette Navalny 1,2M"
  - id: C-REV08
    type: solution-seuil-10pct
    source: "Levier 1 P3 #13"
    enonce: "Solution seuil 10% électeurs inscrits : équilibre entre permissivité (<5%) et dictatoriale (>15%)"
    preuve: "Levier 1 P3 #13 §8.1"
  - id: C-REV09
    type: solution-CC-validation
    source: "Levier 2 P3 #13"
    enonce: "Solution validation CC préalable : recevabilité formelle + proportionnalité motife + alternative candidate"
    preuve: "Levier 2 P3 #13 §8.2"
  - id: C-REV10
    type: solution-calendrier-cooldown
    source: "Levier 3 + 5 P3 #13"
    enonce: "Solution calendrier 90 jours contraignant + cooldown 30 mois entre 2 Recall même élu"
    preuve: "Levier 3 + 5 P3 #13 §8.3-8.5"

