these_extraite_du_§0_lecture_integrale: |
  Le débat sur le RIC ne se joue pas seulement dans les institutions (CC, CE, IGF, BCE) mais dans la
  composition sociologique de l'électorat français. Trois pôles émergent : (1) Pôle 1 Pro-RIC structurel
  (62-73% des Français selon IFOP/Harris/OpinionWay 2019, reconstitution Ipsos 2024), profil majoritaire
  mais impuissant politiquement : sur-représentation CSP populaires (ouvriers/employés), 18-34 ans,
  diplômés du secondaire, ruraux+périurbains, défiants institutionnels (74% selon Cevipof vague 16
  janvier 2025) ; (2) Pôle 2 Abstentionnistes structurels (33-57% selon scrutin, pic 2024 anticipé 33%)
  profil convergent avec pro-RIC sur la défiance mais qui ne vote pas dans le système actuel. Potentiel
  mobilisation massive sur un RIC (estimations AdL/IPSOS : 50-65% des abstentionnistes voteraient à
  un RIC) ; (3) Pôle 3 RIC-sceptiques nominatifs ~5-10% intellectuels+médias+institutions mais sur-
  représentation éditoriale et institutionnelle (Schoettl, Rosanvallon, Schnapper, Weil, Jaffré, Reynié
  + éditorialistes Le Monde/Figaro + think tanks Institut Montaigne/Fondapol/Fondation Concorde).

