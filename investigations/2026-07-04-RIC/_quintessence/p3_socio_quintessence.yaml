causalites:
  - id: C-SOC01
    type: M1-demographie
    source: "INSEE RP 2021 + IPSOS 2024"
    enonce: "Démographie sociologique : pro-RIC segment large hétérogène (CSP populaires + 18-24 + ruraux + QPV + peu diplômés + déclassés) ; aucune coalition possible"
    preuve: "Estimations ⁂ CSP×territoire×diplôme"
  - id: C-SOC02
    type: M2-psychologie
    source: "Seligman 1975 + Cevipof vague 16"
    enonce: "Psychologie politique (sentiment efficacité politique) : défiance vécue = abstention (learned helplessness) ; institutionnalisation parlementarisme 1958 → déresponsabilisation peuple"
    preuve: "42% abstentionnistes déclarent « vote ne change rien »"
  - id: C-SOC03
    type: M3-mediatico
    source: "Cevipof ad hoc IPSOS 2024"
    enonce: "Cadrage médiatique (Schoettl + éditorialistes Le Monde/Figaro) : pro-RIC s'abstiennent de se coaliser car perçus comme « populistes » ; peur du populisme transmise par éditos"
    preuve: "80% éditoriaux hostiles vs 62-73% pro-RIC opinion"
  - id: C-SOC04
    type: M4-elites
    source: "Cevipof vague 16 + Acrimed 2024"
    enonce: "Réseau d'élites convergentes (syndicats CGT/FO + religieux épiscopat/FPF + médias Arcom + constitutionnalistes Schoettl) : pas coordination explicite mais convergence catégorielle anti-RIC"
    preuve: "27 loups identifiés (10 éditorialistes + 6 constitutionnalistes + 7 penseurs + 4 HF)"
  - id: C-SOC05
    type: paradoxe-elitaire
    source: "IPSOS + INSEE RP 2024"
    enonce: "Paradoxe élitaire : plus diplôme augmente, plus défiance envers RIC croît ; les « doctes » (Magister, Rosanvallon, Schoettl) sont les plus hostiles à démocratie directe"
    preuve: "Bac+5+ 45-55% pro-RIC vs Sans diplôme 70-80%"
  - id: C-SOC06
    type: convergence-Pole1-Pole2
    source: "IPSOS GJ + Cevipof vague 16"
    enonce: "Convergence structurelle Pôle 1 / Pôle 2 : abstentionnistes partagent largement profil pro-RIC mais ne votent pas dans système actuel ; potentiel mobilisation massive sur RIC"
    preuve: "50-65% des abstentionnistes voteraient à un RIC"
  - id: C-SOC07
    type: J-Economique
    source: "EJPE 2025 Magni-Berton/Varaine"
    enonce: "Ploutocratie électorale facteur 1.53x : influence politique déciles supérieurs vs inférieurs (Magni-Berton/Varaine EJPE 2025)"
    preuve: "Peer-reviewed EJPE 2025"
  - id: C-SOC08
    type: J-Medias
    source: "Arcom 2024"
    enonce: "9 propriétaires médias (Arcom) verrouillent cadrage médiatique anti-RIC ; convergence éditoriale hostile"
    preuve: "Rapport Arcom 2024 + recension éditoriaux"
  - id: C-SOC09
    type: J-religieux
    source: "Conférence épiscopale 2019 + FPF"
    enonce: "Conférence épiscopale 2019 prudente sur RIC vs référendums locaux ; FPF absence de soutien"
    preuve: "Communiqués 2019"
  - id: C-SOC10
    type: J-syndical
    source: "CGT 2019 + FO 2019-2024"
    enonce: "CGT 2019 « la demande de RIC formule critique syndicats comme intermédiaires » → hostilité implicite ; FO reluctance par concurrence directe"
    preuve: "Positions syndicales 2019-2024"

