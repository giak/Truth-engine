  P0_religieux: "le « devoir de prudence » des évêques catholiques est analogue à la prudence constitutionnelle Schoettl (P3 #7 M4)"
  P0_morts_politiques: "Fabius, ancien politique passé CC, incarne la trajectoire élitaire anti-RIC"
  P0_verrous: "le verrou P0 #4 (méthodologie impersonnelle) est complété par le verrou P3 #7 (majorité silencieuse pro-RIC). Doublement structurel"
  P1_coordination: "le levier européen (M5S, Podemos, BSW, AfD) suppose la mobilisation populaire que P3 #7 cartographie"
  P2_financement: "Solution Démocratique est un des acteurs du Pôle 1 pro-RIC ; sa visibilité pourrait croître"
  P3_hfb: "les Hauts Fonctionnaires bloquent par le haut (institutions) ; P3 #7 montre le réservoir du bas (abstentionnistes)"
  P3_infra_elec: "l'absence d'infrastructure électorale privée est un verrou additionnel au verrou sociologique"
  P3_cedh: "le levier CEDH n'existe pas ; P3 #7 confirme : le RIC ne sera pas le produit d'une contrainte internationale"
  P3_conv_cit: "la Convention citoyenne française n'a pas abouti à contraindre les élites ; P3 #7 montre pourquoi"
  P3_lobby: "les cabinets conseil sont les médiateurs entre l'élite institutionnelle et la mobilisation populaire (P3 #7 M4)"

