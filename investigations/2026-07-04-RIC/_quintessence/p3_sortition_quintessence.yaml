causalites:
  - id: C-SORT01
    type: M1-capture-expert
    source: "Sintomer 2020 + Karolinska 2022 (Irlande) + Landemore 2020"
    enonce: "Biais expert/facilitation : animateurs influencent contenu sans décider formellement ; sans pluralisme d'experts, délibéré émane d'animateurs"
    preuve: "Irlande animateurs 70% pro-choix (avortement 2018)"
  - id: C-SORT02
    type: M2-empty-democracy
    source: "Constitution irlandaise + France CCC 2020 + althingi 2013"
    enonce: "Empty democracy / capture-parlement-otage : sans ancrage jurídicaire contraignant, Parlement peut filtrer/diluer CA"
    preuve: "CCC : 32/149 reprises + 92 dilués + 25 ignorés"
  - id: C-SORT03
    type: M3-stratification
    source: "Carolan & Farrell 2024 + Observatoire participation"
    enonce: "Stratification défectueuse / biais-CSP+ : 47% sous-repr. 18-34 ans Irlande ; CSP- sous-représentation 60% tous modèles"
    preuve: "18-34 ans 47% sous-rep Irlande"
  - id: C-SORT04
    type: M4-capture-calendrier
    source: "Tous modèles documentés (P3 #12 §3.3)"
    enonce: "Synchronisation électorale / capture-calendrier : agenda électoral détermine paramètres CA (durée, thèmes, mandat-resultat)"
    preuve: "CCC 2019-2020 → agenda Macron 2022"
  - id: C-SORT05
    type: boucle-empty
    source: "Tous modèles"
    enonce: "Boucle empty democracy : Conseil n'est pas obligé d'adopter recommandations ; seulement répondre publiquement (Irlande) ou pas"
    preuve: "Ostbelgien répond public obligatoire → France CCC non"
  - id: C-SORT06
    type: boucle-consensus
    source: "Etude Niessen-Reuchamps 2024"
    enonce: "Boucle consensus : Oireachtas répondeur public obligatoire → débats citoyens raccrochent aux recommandations constitutionnellement"
    preuve: "5 référendums aboutis 2015-2018"
  - id: C-SORT07
    type: solution-constitutionnel
    source: "Levier 1 P3 #12 §8"
    enonce: "Solution : réviser art. 11 + ajouter art. 11-1 'Convention Citoyenne pour action' - Contraignant constitutionnellement"
    preuve: "Levier 1 P3 #12"
  - id: C-SORT08
    type: solution-Ostbelgien-FR
    source: "Levier 2 P3 #12 §8"
    enonce: "Solution : créer des Cités Citoyennes régionales (10 régions métropoles+rurales) à l'image Ostbelgien belge"
    preuve: "Levier 2 P3 #12"
  - id: C-SORT09
    type: solution-RIL-CA-coupling
    source: "Levier 3 P3 #12 §8"
    enonce: "Solution : si pétition L1112-16 atteint seuil, CA communale convoquée ; ferme chaînon manquant RIL → CA → referendum"
    preuve: "Levier 3 P3 #12"
  - id: C-SORT10
    type: solution-recommandation
    source: "Levier 5 P3 #11 + P3 #14"
    enonce: "Recommandation finale : Levier 5 = numérique open-source Decidim/Consul/vTaiwan anti-capture"
    preuve: "P3 #14 DECIDIM documente Decidim+Pol.is modularité"

