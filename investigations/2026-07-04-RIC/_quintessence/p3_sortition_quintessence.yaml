enquete_titre: "Tirage au sort (sortition + Citizens' Assembly) : voie complémentaire/forensique au RIC français 2026-2030"
statut: "COMPLETE"
lecture_status: "Integrale - 30 faits atomiques extraits"
shadow_factor: 2.4

these_extraite_du_§0_lecture_integrale: |
  Le RIC français (P3 #1-P3 #11) est verrouillé par 10 fronts mobilisés contre une logique partisane
  verrouillante. Le tirage au sort (sortition + Citizens' Assembly + Bürgerrat + Constitutional Assembly)
  est documenté comme alternative forensique opérationnelle dans 5 juridictions (Irlande depuis 2016,
  Ostbelgien depuis 2019, France via CCC 2019-2020 abortée, Canada 2004 aborté, Islande 2010 aborté)
  avec un bilan paradoxal : 5 référendums irlandais aboutis, 1 Conseil permanent en Ostbelgien,
  3 Conventions françaises cadrées puis démantelées, 1 Référendum BC 2005 rejetée, 1 Constitutional
  Assembly islandaise bloquée. P3 #12 documente les 10 biais structurels du sortition (expert,
  sujet, stratification, ratio, temps, médias, liasses, empty democracy, conseil vs assemblée,
  capture temporelle) et propose son couplage opérationnel au RIC français.

