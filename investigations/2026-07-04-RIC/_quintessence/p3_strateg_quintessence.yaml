    source: "Levier 1 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT13
    enonce: "Calendrier 2027 : 50 communes RIL abouti = premier précédent jurisprudentiel + 8/10 contenus Substack visibilité"
    source: "Levier 2 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT14
    evenement_p3: "Calendrier 2028 : 350 communes RIL actives + Loi-cadrage Sénat reconnaissance officielle RIL + budget dédié"
    source: "Levier 3 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT15
    evenement_p3: "Calendrier 2029 : plateforme Propositions-citoyennes lancée (Loomio+Decidim+Consul open-source) ; 50% communication politique française mentionnant au moins une fois le RIC"
    source: "Levier 4 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT16
    enonce: "Calendrier 2030 : adoption constitutionnelle RIC par voie Congrès 3/5 OU référendum présidentiel art. 11"
    source: "Levier 5 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT17
    enonce: "Cible 2027 : 50 communes avec RIL abouti + jurisprudence formalisée"
    source: "Levier 2 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT18
    enonce: "Cible 2028 : Loi-cadrage Sénat sur RIL + plateforme mobilité citoyenne déployée + 1 500 pétitions L1112-16 cumulées 2026-2030"
    source: "Levier 3 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT19
    enonce: "Cible 2030 : 500 communes RIL abouti fin 2030 = 14% parc communal (cible précédent suffisant RIC national)"
    source: "Levier 12 P3 #11 §7"
    tier: ◈
    marquage: ✧
  - id: F-STRAT20
    enonce: "Budget cumulé 2026-2030 : ~7,5M€ (1M/an en moyenne) ; détail 150k + 350k + 700k + 1M + 1,5M = 3,7M€ voies locales + autres voies 3,8M€"
    source: "Projection économique P3 #11 §4"
    tier: ◈
    marquage: ✧
  - id: F-STRAT21
    enonce: "Risque 1 : Capture M5S-like (CasaLeggio→Leadership Grillo→Capture 2018). Mitigation : structure gouvernance non-unipersonnelle + statuts anti-capture + révocabilité"
    source: "Risque 1 P3 #11 §8"
    tier: ◈
    marquage: ✧
  - id: F-STRAT22
    enonce: "Risque 2 : CNT-capture (entrisme). Mitigation : rotation coresponsable + mandat court + diversité d'apports"
    source: "Risque 2 P3 #11 §8"
    tier: ◈
    marquage: ✧
  - id: F-STRAT23
    enonce: "Risque 3 : Invalidation CC (loi votée invalidée par QPC art. 61-1 ou art. 61). Mitigation : formulation mineure additionnelle + seuils raisonnables 1% progressif + sanctions dissuasives"
    source: "Risque 3 P3 #11 §8"
    tier: ◈
    marquage: ✧
  - id: F-STRAT24
    enonce: "Risque 4 : Absence totale ('maladie de Pittsburgh'). Mitigation : Rotary décalage ; concentration engagement sur 3-4 communes jurases"
    source: "Risque 4 P3 #11 §8"
    tier: ◈
    marquage: ✧
  - id: F-STRAT25
    enonce: "Risque 5 : Impasse du Congrès 3/5. Mitigation : alternative art. 89 al. 3 ratification référendum par le peuple"
    source: "Risque 5 P3 #11 §8"
    tier: ◈
    marquage: ✧
  - id: F-STRAT26
    enonce: "Levier critique : Convaincre le Président art. 11 référentiel volontaire → soumission RIC santé/environnement/transition énergétique"
    source: "Levier critique P3 #11 §3.3"
    tier: ◈
    marquage: ✧
  - id: F-STRAT27
    enonce: "Couplage CCC + RIC français 2030 = scénario 'Réaganiste' : CA 150 citoyens + ratification parlementaire contraignante + RIC déclenchement + referendum subordonné"
    source: "Hypothèse P3 #12 §3.3 + P3 #11 §3.4"
    tier: ◈
    marquage: ✧
  - id: F-STRAT28
    enonce: "Verrou art. 89 al. 4 : 'la forme républicaine du Gouvernement ne peut faire l'objet d'une révision' ; RIC ne peut réviser forme républicaine"
    source: "Constitution 1958 art. 89 al. 4"
    tier: ◈
    marquage: ✧
  - id: F-STRAT29
    enonce: "Modèle Irlandais Oireachtas répondeur public = contraint procédural suffisant ; sans ce mécanisme, CCC français 2019 vidé de 92% propositions"
    source: "Cadre Oireachtas + P3 #4 CONV-CIT"
    tier: ◈
    marquage: ✧
  - id: F-STRAT30
    enonce: "Plateforme Propositions-citoyennes avec Loomio / Decidim / Consul open-source + ciblage émotionnel par victoires RIL locales anti-indifférence"
    source: "Levier 4-5 P3 #11 §6 + P3 #14 DECIDIM"
    tier: ◈
    marquage: ✧

