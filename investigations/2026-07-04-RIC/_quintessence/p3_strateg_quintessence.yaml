causalites:
  - id: C-STRAT01
    type: M1-juridique
    source: "Constitution 1958 art. 89"
    enonce: "Voie Juridique : art. 89 al. 1+3 (PPL+référendum) ou art. 89 al. 2 (Congrès 3/5 majorité) ou art. 11 (Référendum Président)"
    preuve: "Constitution + jurisprudence Cornudet 2009"
  - id: C-STRAT02
    type: M2-locale
    source: "P3 #9 + LPRR 2019"
    enonce: "Voie Locale : 500 communes avec RIL abouti sur 5 ans = jujurisprudence suffisante pour RIC national (cible 14% parc communal)"
    preuve: "CGCT L1112-1 + LPRR 2019-1461"
  - id: C-STRAT03
    type: M3-politique
    source: "P3 #11 + Couplage Coalition Egger+Magni-Berton"
    enonce: "Voie Politique : Coalition Pro-RIC pluripartite (Egger+Magni-Berton+CAE+constitutionnalistes libéraux) ; plateforme Loomio-Decidim-Consul open-source"
    preuve: "Sandrine Rousseau + Egger + Magni-Berton tribune 2024-2025"
  - id: C-STRAT04
    type: M4-psychologique
    source: "P3 #10 + P3 #11 §6"
    enonce: "Voie Psychologique : Anti-indifférence par victoires émotionnelles RIL + plateforme Prop-citoyen + campagnes hors-medias mainstream"
    preuve: "P3 #10 + Leviers 1-5 P3 #11 §6"
  - id: C-STRAT05
    type: boucle-capture
    source: "M5S 2014-2018 + Casaleggio"
    enonce: "Boucle capture : Leader capturant → plate opaque → désactivation → perte démocratie interne ; mitigation : structure horizontale + statuts anti-capture"
    preuve: "M5S 2014-2018 capture Casaleggio"
  - id: C-STRAT06
    type: boucle-protection-CC
    source: "Decision ADP 2019 CC"
    enonce: "Boucle protection CC : rédaction mineure additionnelle sans réécriture explicite art. 11 + seuils raisonnables 1% progressif + sanctions dissuasives réserve d'émission"
    preuve: "Décision ADP 2019 + Constitution art. 89 al. 4"
  - id: C-STRAT07
    type: boucle-Coalition-Irlande
    source: "Oireachtas Constitution irlandaise"
    enonce: "Boucle Couplage Irlande : CA → Oireachtas répondeur obligatoire public → adversaire propose projet → referendum populaire contraignant"
    preuve: "5 référendums aboutis 2015-2018"
  - id: C-STRAT08
    type: boucle-Congrès
    source: "Constitution 1958 art. 89 + Assemblée + Sénat"
    enonce: "Boucle Congrès 3/5 : majorité 555/855 dans les deux chambres + ratification populaire ou Congrès ; protection art. 89 al. 4 (intangibilité républicaine)"
    preuve: "Constitution art. 89 + Drouin/Schoettl Doctrine"
  - id: C-STRAT09
    type: solution-recommandation
    source: "Levier 1-5 P3 #11 §9"
    enonce: "Recommandation réseau constitutionnalistes pluralistes pour doctrine opérationnelle RIC + mode d'emploi technique (seuil 1-2%, quorum 40%, interdiction personnes morales, tirage au sort, contrôle a posteriori CC) + tester sur proposition pilote"
    preuve: "Leviers P3 #11"
  - id: C-STRAT10
    type: solution-public
    source: "Levier critique §3.3 P3 #11"
    enonce: "Levier critique convaincre Président art. 11 référentiel volontaire santé/environnement ; potentielb脊 favorable"
    preuve: "Constitution art. 11 al. 1"

