  - cause: "F-PNR01"
    effet: "F-PNR03"
    mecanisme: "L'arsenal répressif 450-1 + 222-14-2 + 421-2-6 + CL46 produit la séquence constatée condamnations massives Gilets Jaunes, blessures, mutilations, neutralisant l'action frontale."
  - cause: "F-PNR05"
    effet: "F-PNR04"
    mecanisme: "L'organe CCP + CS tripartite produit la déconstruction du monopole partisan sur la production législative (6 piliers FRANCS)."
  - cause: "F-PNR10"
    effet: "F-PNR05"
