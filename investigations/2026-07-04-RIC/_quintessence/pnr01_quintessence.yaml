perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le peuple peut exécuter le retour de souveraineté sur 5 ans via le pack opérationnel 8 modules."
  - position: "Antithèse"
    argument: "Le verrouillage institutionnel (CC + Sénat LR/UC + art. 89 al. 4 + boîtes noires) rend l'adoption effective peu probable (probabilité conjointe 30-40 %)."
  - position: "Synthèse"
    argument: "La discipline trans-partisane 5-10 % + Judo Rhétorique + Éloge Surface (boycott spread) produit une probabilité révisée ≥ 60 % sur 5 ans."

limites:
  - "Le Pack CivicTech-FR P3 #15 reste à vérifier tierce-partie (P3 #18)."
  - "Le Bürgerrat Ostbelgien 24-90 sortition sur 68 millions d'habitants n'a pas de précédent empirique."
  - "Le risque capture-syndicale FNSEA / Crédit Agricole / Medef dans Pacte Souveraineté 5-10 % est sous-spécifié."
  - "L'anti-capture M5S-Casaleggio n'est pas structurellement garanti par l'open-source (exemples Kubernetes CNCF / Linux Foundation)."

wolves:
  - nom: "Lobbys GAFAM (Cloud Act US)"
    argument: "L'architecture CivicTech-FR déstabilise la captation de métadonnées électorales."
    reponse: "SecNumCloud immunise juridictionnellement les données électorales françaises ; test décembre 2024 ANSSI."
  - nom: "Lobbys Sénat LR+UC majoritaire"
    argument: "Le RIC menace le monopole parlementaire de production législative."
    reponse: "La discipline de vote 5-10 % Pacte FRANCS rend ce verrou instable en cas de législatives 2027/2030."
  - nom: "Conseil Constitutionnel (anti-RIC traditionnel)"
    argument: "Le RIC introduit une instabilité de la forme républicaine (art. 89 al. 4)."
    reponse: "Le pack législatif CivicTech-FR constitutionnalise le RIC via Loi Organique art. 11 révisé sans toucher art. 89 al. 4."
  - nom: "Big Tech GAFAM (anti-X-Road FR)"
    argument: "X-Road FR isole la France du marché européen commun des données."
    reponse: "X-Road FR est interopérable avec eIDAS 2 UE (transposition 2026) et conforme RGPD 2016."

iceberg:
