these_centrale: "Entre décembre 2018 et décembre 2025, 8 propositions de loi constitutionnelles visant à instaurer le RIC ont été déposées à l'Assemblée nationale. AUCUNE n'a été adoptée. Le pattern est répété : rejet en commission, motion de renvoi, déluge d'amendements, ou simple abandon par fin de législature/dissolution. L'hypothèse d'un enterrement systématique transpartisan est confirmée par la chronologie."

theses_implicites:
  - "Le parlementarisme rationalisé (art. 48, art. 11, art. 89) est conçu pour filtrer les PPL citoyennes via un labyrinthe procédural - c'est un verrou passif STRUCTUREL."
  - "La majorité relative (2022+) utilise l'obstruction dans les niches comme arme paradoxale (Geynet-Dussauze 2022) - retournement du paradigme traditionnel où seule l'opposition obstruait."
  - "La dissolution (9 juin 2024) interrompt TOUS les travaux législatifs en cours - c'est une arme de la monarchie républicaine qui crée un vide législatif de 3-6 mois et fragmente l'Assemblée."
  - "Le cartel transpartisan refuse structurellement le RIC qui détruirait leur rente institutionnelle - aucun parti de gouvernement n'a porté le RIC dans son programme."
  - "Les 4 mécanismes (verrou majoritaire, piège réglementaire, cycle dissolutif, cartel) sont indépendants mais se renforcent mutuellement."

faits_atomiques:
  - id: "F-PPL-01"
    enonce: "8 PPL RIC déposées entre 2019-2025, 0 adoptées. Pattern : rejet commission, motion renvoi, déluge amendements, abandon fin législature."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §0 + F001"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-02"
    enonce: "PPL 1558 (LFI Mélenchon, 8 janvier 2019) : RIC intégral (législatif, abrogatoire, révocatoire, constituant), seuil 2% corps électoral (~900k signatures). Rejet commission 13 février 2019."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §1.1 + F002 + F003"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-03"
    enonce: "PPL 1558 rejetée par motion de renvoi LREM 91 contre 50 le 21 février 2019 (niche parlementaire LFI). Le texte est rejeté SANS examen des articles."
    source_url: "https://www.leparisien.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §1.1 + F002"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-04"
    enonce: "PPL 2179 (LFI, 19 juillet 2019) : RIC législatif + abrogatoire UNIQUEMENT (sans révocatoire/constituant). Non inscrite à l'ordre du jour."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §1.1 + F017"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-05"
    enonce: "PPL Masson (Sénat, 21 janvier 2019) : RIP à 1,5% des électeurs, suppression du vote au Congrès. Inconnu sort (jamais adopté)."
    source_url: "https://www.senat.fr/leg/ppl18-256"
    source_section: "CIV-RIC-PPL-TIMELINE §1.1"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-06"
    enonce: "PPL 4516 (Jean Lassalle, 6 octobre 2021) : RIC constituant (modification article 89). Label RIC note 132/300 (1 étoile). Abandon fin de législature, non examinée."
    source_url: "https://www.assemblee-nationale.fr/dyn/15/textes/l15b4516"
    source_section: "CIV-RIC-PPL-TIMELINE §1.1 + F011 + F014"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-07"
    enonce: "PPL 1900 (Coulomme, LFI, 2023) : RIC constituant, article unique modification art. 89. Version vidée pour faciliter cosignatures LFI. Fin XVIe législature, non examinée."
    source_url: "https://www.assemblee-nationale.fr/dyn/16/textes/l16b1900"
    source_section: "CIV-RIC-PPL-TIMELINE §1.2 + F012 + F015"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-08"
    enonce: "PPL 722 (auteur inconnu, 17 décembre 2024) : RIC constitutionnel d'initiative citoyenne. Pas d'étape connue après dépôt."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §1.3 + F019"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-09"
    enonce: "PPL 2081 (Marie Pochon, 18 novembre 2025) : RIC délibératif (art. 89 constitutionnel + art. 11 législatif + suspensif + local art. 72-1-1). Label RIC note 110/300 (1 étoile)."
    source_url: "https://www.assemblee-nationale.fr/dyn/17/textes/l17b2081"
    source_section: "CIV-RIC-PPL-TIMELINE §1.3 + F004 + F013 + F018"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-10"
    enonce: "PPL 2081 innovations : (1) assemblée citoyenne 150 tirés au sort pour phase délibérative, (2) quorum validation majorité absolue + 35% inscrits, (3) RIC suspensif 1/100e électeurs peut suspendre promulgation, (4) délai 12 mois recueil signatures."
    source_url: "https://www.assemblee-nationale.fr/dyn/17/textes/l17b2081"
    source_section: "CIV-RIC-PPL-TIMELINE §1.3 + F018"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-11"
    enonce: "PPL 2081 bloquée par ~150 amendements en commission des lois (4 février 2026). Examen niche parlementaire 12 février 2026 : pas de vote malgré déluge amendements. Acteurs : Nicolas Tryzna (LR), Guillaume Kasbarian (Ensemble), Ian Boucard (LR)."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §2.2 + F006 + F007 + F008"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-12"
    enonce: "PPL 2260 (Marie Pochon, 18 décembre 2025) : RIC délibératif, version très édulcorée. Label RIC note 59,5/300 (0 étoile). Hypothèse : version de repli négociée en coulisses."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §1.3 + F009 + F010"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-13"
    enonce: "Aucune PPL RIC n'a franchi le stade de la commission des lois (F020). 8 PPL : 5 LFI + 1 EELV + 1 Lassalle + 1 inconnu. Aucune d'un parti de gouvernement."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §0 + F020"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-14"
    enonce: "M1 Verrou majoritaire (actif) : motion de renvoi PPL 1558 91-50 + déluge amendements PPL 2081. Cause racine : Ve République conçue pour exécutif dominant - obstruction comme seule arme majoritaire relative."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §11 M1 + PPL 1558 + PPL 2081"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-15"
    enonce: "M2 Piège réglementaire (passif) : art. 48 Constitution (Gouvernement contrôle ordre du jour, 80% agenda) + Règlement AN (motion renvoi, exception irrecevabilité, question préalable) + Conférence Présidents AN."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §11 M2 + Constitution art. 48"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-16"
    enonce: "M3 Cycle dissolutif : art. 12 Constitution donne au Président droit de dissoudre sans condition. Macron dissout 9 juin 2024 - 6+ PPL deviennent caduques instantanément. Cycle imprévisible."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §11 M3 + Constitution art. 12"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-17"
    enonce: "M4 Cartel transpartisan (structurel) : concurrents LREM/Ensemble, LR, PS, RN exclus du soutien RIC. Convergence d'intérêts - RIC = menace existentielle pour monopole partisan."
    source_url: "https://www.cevipof.com/"
    source_section: "CIV-RIC-PPL-TIMELINE §11 M4 + 8 PPL = 0 parti gouvernement"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-18"
    enonce: "M4 mécanisme : RIC = destructeur de rente institutionnelle pour partis - transférerait pouvoir normatif Parlement vers citoyens. Aucun parti ne vote sa propre obsolescence."
    source_url: "https://www.institutmontaigne.org/"
    source_section: "CIV-RIC-PPL-TIMELINE §11 M4"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-19"
    enonce: "139 449 amendements en 2006 (GDF-Suez), 40 000 en 2020 (retraites). Le déluge d'amendements = technique d'obstruction éprouvée, ici retournée contre le RIC."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §11 M3 R4"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-20"
    enonce: "Geynet-Dussauze (RFDC 2022) : 'L'obstruction du bloc majoritaire à l'Assemblée nationale'. La majorité fait obstruction dans les niches - retournement du paradigme traditionnel où seule l'opposition obstruait."
    source_url: "https://www.cairn.info/"
    source_section: "CIV-RIC-PPL-TIMELINE §11.bis F023"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-21"
    enonce: "Ferrand 2019 réforme Règlement AN : suppression motions de rejet préalable et renvoi en commission. Vision officielle 'fluidifier le débat'. Résultat paradoxal : obstruction déluge amendements renforcée."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §11.bis F021"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-22"
    enonce: "Macron dissout 9 juin 2024 (Décret 2024-123). 6+ PPL en cours deviennent caduques instantanément. PPL 2081 (Pochon) n'est déposée que 17 mois après."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §11.bis F022"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-23"
    enonce: "LFI 2019 proposait 4 types RIC : législatif, abrogatoire, révocatoire, constituant (PPL 1558). Version réduite législatif + abrogatoire seul (PPL 2179 juillet 2019)."
    source_url: "https://www.lcp.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §1.1 + F016 + F017"
    tier: 1
    glyphe: "✦"
  - id: "F-PPL-24"
    enonce: "Le RIC divise-t-il la classe politique ? NON : rejet transpartisan et constant. MLP (RN) exclut RIC constituant, Lassalle (centriste) dépose mais aucun soutien LR, Masson (LR) dépose mais aucun soutien LR."
    source_url: "https://www.assemblee-nationale.fr/"
    source_section: "CIV-RIC-PPL-TIMELINE §4 LIÈVRE H001"
    tier: 1
    glyphe: "✦"

