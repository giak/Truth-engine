causalites:
  - cause: "F-PPL-02"
    effet: "F-PPL-03"
    mecanisme: "PPL 1558 (RIC intégral, seuil 900k signatures) déposée → commission des lois rejette 13 février 2019 → motion de renvoi LREM adoptée 91-50 (21 février 2019) → PPL rejetée SANS examen des articles."
  - cause: "F-PPL-21"
    effet: "F-PPL-20"
    mecanisme: "Réforme Ferrand 2019 (suppression motions de rejet préalable) devait fluidifier le débat → résultat paradoxal : la majorité compense par déluge amendements dans les niches (Geynet-Dussauze 2022) → verrou renforcé substantiellement."
  - cause: "F-PPL-22"
    effet: "F-PPL-11"
    mecanisme: "Dissolution Macron 9 juin 2024 + PPL 2081 déposée 17 mois après → cycle : 2 ans de travaux législatifs anéantis → reconstruction législative dans Parlement fragmenté → PPL 2081 bloquée 150 amendements."
  - cause: "F-PPL-13"
    effet: "F-PPL-24"
    mecanisme: "Les 8 PPL RIC viennent de LFI (5) + EELV (1) + Lassalle (1) + inconnu (1). Aucune d'un parti de gouvernement (LREM/Ensemble, LR, PS, RN). Convergence absence = cartel transpartisan de rejet."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le RIC est verrouillé par 4 mécanismes Parlement (M1-M2-M3-M4) qui se renforcent mutuellement : verrou actif (obstruction majoritaire) + verrou passif (art. 48) + verrou cyclique (dissolution) + verrou structurel (cartel)."
  - position: "Antithèse"
    argument: "Tous les mécanismes sont légitimes constitutionnellement. Le RIC n'est pas un droit absolu : la Constitution 1958 le filtre pour préserver la stabilité gouvernementale."
  - position: "Synthèse"
    argument: "La probabilité d'adoption d'une PPL RIC dans le cadre institutionnel 2026 est inférieure à 5%. Seul le Pack CivicTech-FR (Loi Pacte CivicTech-FR + Pacte FRANCS constitutionnalisation + LOPPSI 4 anti-surveillance) peut court-circuiter le verrou."

