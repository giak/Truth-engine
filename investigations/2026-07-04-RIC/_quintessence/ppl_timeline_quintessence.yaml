wolves:
  - nom: "Conférence des Présidents AN (Ferrand, Braun-Pivet)"
    argument: "Refus d'inscrire RIC à l'ordre du jour - légitime institutionnellement."
    reponse: "Inscription par niche parlementaire LFI/EELV est une voie, mais déluge amendements la tue en séance."
  - nom: "Cartel transpartisan (LREM, LR, PS, EELV, RN)"
    argument: "Convergence structurelle anti-RIC - protecteur de la Constitution 1958."
    reponse: "Le RIC ne touche pas art. 89 al. 4 - il constitutionnalise le pouvoir constituant du peuple sans abolir la République."
  - nom: "9 propriétaires médias (Bolloré, Bouygues, Dassault)"
    argument: "Concentration bloque débat public RIC par omission et délégitimation."
    reponse: "Le Pack CivicTech-FR crée un canal média-citoyen structurel (SecNumCloud + X-Road FR) qui bypasse le walled garden."

iceberg:
  - "Le précédent Loi de Transparence 2013 (Sapin II) : proposition crédit Impôt Recherche RIC rejeté via motion de renvoi séquence procédurale identique."
  - "L'inertie procédurale du Règlement AN n'a pas été réformée depuis 2019 - le verrou est volontairement maintenu."
  - "PPL 2081 versus PPL 2260 : Pochon elle-même proposée deux versions en 1 mois - la stratégie parlementaire est lente à s'adapter."
  - "Le Pack CivicTech-FR Loi 2 (Pacte FRANCS constitutionnalisation RIC art. 11 + 89 révisé) court-circuite ce verrou par voie législative."

