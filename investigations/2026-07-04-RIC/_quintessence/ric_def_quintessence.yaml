lecture_status: "Complete - lecture intégrale (588 lignes source)"

these_centrale: "Le RIC n'a pas été refusé pour des raisons techniques ou juridiques. Il a été refusé par un cartel de la classe politique - un consensus transpartisan de rejet fonctionnellement équivalent à un cartel - opérant comme un verrouillage systémique à trois têtes : (1) Constitution 1958 verrouillée, (2) capture oligarchique partisane, (3) dogme libéral-européen subordonnant la souveraineté nationale aux traités."

theses_implicites:
  - "La convergence d'intérêts anti-RIC n'est pas coordonnée (pas de cartel explicite) mais elle est structurelle (convergence d'intérêts entre partis, médias, oligarchie économique et institutions européennes)."
  - "L'asymétrie radicale entre le pouvoir exécutif (art. 11, 89, 49.3) et le peuple (zéro accès institutionnel) est le mécanisme central du verrouillage - tout le reste en découle."
  - "Le RIC constituant large n'est pas un ajout à la Constitution de 1958 mais une rupture avec son ADN - la Ve République a été pensée pour concentrer le pouvoir, pas pour le diffuser."
  - "Le verrou européen sur le RIC budgétaire est une hypothèse plausible mais non testée empiriquement - aucune jurisprudence CJUE ne le confirme."
  - "La Suisse, l'Uruguay, l'Italie démontrent depuis 1891, 1919, 1946 que les objections techniques au RIC sont résolues ailleurs depuis plus d'un siècle - ce qui les rend inopérantes comme argument en France."

faits_atomiques:
