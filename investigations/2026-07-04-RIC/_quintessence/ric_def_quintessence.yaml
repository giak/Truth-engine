causalites:
  - cause: "F-DEF-01"
    effet: "F-DEF-05"
    mecanisme: "L'absence d'initiative populaire directe (1958) crée la demande pour un mécanisme de substitution : le RIP (2008) est créé, mais avec un seuil prohibitif (1/5e Parlementaires + 4,7M signatures + filtre CC) qui le rend impraticable."
  - cause: "F-DEF-12"
    effet: "F-DEF-22"
    mecanisme: "La concentration médiatique (9 propriétaires, 90% audience) prive le RIC de pression citoyenne sur les parlementaires : pas de visibilité → pas de sanction électorale → 3 PPL enterrées."
  - cause: "F-DEF-14"
    effet: "F-DEF-15"
    mecanisme: "Le parlementarisme rationalisé (art. 49.3) permet le passage en force exécutif : 28 recours en 9 ans (2017-2026) documente une érosion de la fonction législative parlementaire, le Parlement lui-même n'est plus souverain."
  - cause: "F-DEF-06"
    effet: "F-DEF-28"
    mecanisme: "Les traités UE (Pacte de stabilité) verrouillent le champ budgétaire d'un RIC : le précédent grec 2015 démontre que la BCE peut maintenir l'ELA sous condition, forçant la capitulation politique."
  - cause: "F-DEF-19"
    effet: "F-DEF-23"
    mecanisme: "Le soutien populaire (65% IFOP 2019) ne se traduit pas en action législative car les think tanks français (Institut Montaigne etc.) n'ont jamais publié de rapport favorable au RIC - l'écart entre l'opinion et la doctrine constitue le verrou."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le RIC est verrouillé par un consensus transpartisan de rejet fonctionnellement équivalent à un cartel. Le verrouillage opère à 3 niveaux : constitutionnel (art. 11/89), partisan (cartel des directions), européen (traités)."
  - position: "Antithèse"
    argument: "Pas de preuve de coordination explicite entre LREM, LR, PS, EELV, PCF. La convergence est structurelle, pas conspirative. Risques réels : démagogie, capture par argent (Californie), irréversibilité des décisions (Brexit)."
  - position: "Synthèse"
    argument: "Le RIC n'est pas un outil miracle mais une conquête démocratique. La Suisse (depuis 1891), l'Uruguay (1919), l'Ostbelgien (2019) démontrent sa faisabilité opérationnelle. L'absence de précédent français s'explique par l'ADN de 1958, pas par l'impossibilité technique."

limites:
  - "Le score GATE_G de 27,6% (CIV-RIC-001) puis 43,3% (GAPS-002) reste sous le seuil APEX 85% - documentation d'un déficit structurel assumé."
  - "Aucune jurisprudence CJUE ne confirme le verrou européen sur RIC budgétaire - c'est une hypothèse plausible mais non testée (F-DEF-06 + F-DEF-28)."
  - "Pas d'étude INA quantitative du temps d'antenne RIC 2018-2024 (accès payant)."
  - "Le parallèle avec M5S italien (capture Casaleggio) n'est pas développé dans cette enquête - traité par P3 22-00."
  - "Sondages partisans (Espoir RIC 2018-2022) et indépendants (IFOP 2019, Harris 2019, OpinionWay 2019) ne convergent pas tous vers 75% - variation 62-73% selon formulation."

wolves:
  - nom: "Conseil Constitutionnel (Fabius)"
    argument: "Le RIP est conforme à la Constitution de 1958 et suffisant ; le RIC constituant menace la forme républicaine (art. 89 al. 4)."
    reponse: "Le RIP n'a jamais abouti en 17 ans (2008-2025) ; le Conseil Constitutionnel démontre sa capacité à paralyser toute initiative (CC ADP 2019)."
  - nom: "9 propriétaires médias (Bolloré/Bouygues/Dassault)"
    argument: "Le RIC menace la stabilité éditoriale et l'influence des propriétaires."
    reponse: "L'audience migre hors mass media vers CivicTech-FR open-source ; perte d'influence compensée par nouvelle légitimité citoyenne."
  - nom: "Cartel transpartisan (LREM, LR, PS, EELV, PCF)"
    argument: "Aucun parti ne vote sa propre obsolescence ; le monopole législatif partisan doit être préservé."
    reponse: "Le RIC ne supprime pas le Parlement, il le complète. Le monopole est brisé par l'addition de l'initiative citoyenne, pas par sa suppression."
  - nom: "Constitutionnalistes anti-RIC (Schoettl, Maus, de Béchillon)"
    argument: "10 objections au RIC : contournement Parlement, qualité normative insuffisante, capture par lobbies, risque irréversibilité, Brexit-like."
    reponse: "Les objections sont des problèmes résolus ailleurs (Suisse, Uruguay, Ostbelgien) ; le précédent californien est pris en compte par la Doctrine de la Terre Brûlée (interdiction personnes morales)."

iceberg:
  - "Le précédent M5S italien (capture Casaleggio) est documenté par P3 22-00 mais pas référencé ici - c'est un cas d'école de capture d'un mouvement citoyen par la machine technocratique privée."
  - "Le lobbying anti-RIC des think tanks (Institut Montaigne 7,5M€/an budget) est sous-documenté faute d'enquête ciblée sur les flux financiers."
  - "Le lien entre le verrou médiatique (9 propriétaires) et le verrou partisan (cartel) via les conseils d'administration croisés n'est pas documenté publiquement."
  - "La concentration des parrainages (Hollande 2012 publicité) crée un verrou symétrique à l'absence de RIC : le peuple ne peut ni proposer (RIC) ni valider (parrainages) les candidats - verrou double."

