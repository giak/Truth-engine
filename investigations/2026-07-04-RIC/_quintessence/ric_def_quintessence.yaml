    enonce: "Constitution 1958 ne prévoit aucun droit d'initiative populaire directe (ni législatif, ni constitutionnel). Articles 11 et 89 sont les seuls ouverts."
    source_url: "https://www.conseil-constitutionnel.fr/la-constitution/la-constitution-du-4-octobre-1958"
    source_section: "CIV-RIC-001 §0 thèse centrale + §2.3 + F002"
    tier: 1
    glyphe: "✦"
  - id: "F-DEF-02"
    enonce: "Article 11 (référendum) : prérogative exclusive du Président sur proposition du Gouvernement ou des deux assemblées. Aucun droit d'initiative populaire."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "CIV-RIC-001 F003 + §2.1"
    tier: 1
    glyphe: "✦"
  - id: "F-DEF-03"
    enonce: "Suisse : RIC constituant depuis 1891 (Constitution fédérale art. 138-139). L'initiative populaire fédérale existe depuis 130+ ans."
