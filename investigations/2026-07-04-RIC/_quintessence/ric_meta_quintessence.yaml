lecture_status: "Complete - lecture intégrale (552 lignes source)"

these_centrale: "L'enquête CIV-RIC-001 a produit un diagnostic correct du verrouillage systémique mais souffrait de trois biais majeurs : (1) crédulité excessive envers les sources PNRED/Solution Démocratique (traitées comme ◈ alors qu'elles sont ○/⟐), (2) absence de contre-arguments substantiels, (3) omission quasi-totale de la dimension 'qui meurt' et des loups individuels. La méta-enquête produit 4 mécanismes métacognitifs (M1 pression temporelle LLM, M2 crédulité sources militantes, M3 sous-investigation contre-arguments, M4 accès limité données parlementaires) pour expliquer ces biais."

theses_implicites:
  - "Le 'cartel transpartisan' est une simplification pédagogique incorrecte : la convergence d'intérêts anti-RIC est structurelle, pas conspirative."
  - "Le verrou européen sur RIC budgétaire est une hypothèse plausible mais non testée (F011 ✦ rétrogradé en ⁂)."
  - "L'exemple suisse du RIC n'est pas un remède miracle : taux de succès ~10%, initiative générale abandonnée 2003, capture par UDC xénophobe."
  - "Les sources militantes (PNRED, Substack, Magni-Berton, Egger) sont dotées d'une autorité perçue démesurée par les LLM (biais d'autorité)."

faits_atomiques:
  - id: "F-META-01"
    enonce: "META-001 §1.1 identifie 4 sources sur-titrées par CIV-RIC-001 : Substack 'L'adieu aux partis' cité comme ◈ alors que c'est un manifeste politique ○/⟐, PNRED traité comme source fiable alors que c'est un programme partisan, Magni-Berton présenté comme académique sans déclarer co-fondation Solution Démocratique, Clara Egger présentée comme 'spécialiste démocratie directe' sans déclarer candidature Solution Démocratique."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "META-001 §1.1 + §7.3 + §8"
    tier: 1
    glyphe: "✦"
  - id: "F-META-02"
    enonce: "CIV-RIC-001 F011 (verrou européen) rétrogradé de ✦ à ⁂ (spéculation) : aucune jurisprudence CJUE ne confirme la compatibilité RIP/contraintes budgétaires UE. Cas grec 2015 traité politiquement, pas juridiquement."
    source_url: "https://eur-lex.europa.eu/"
    source_section: "META-001 §4.3 + §2.4"
    tier: 1
    glyphe: "✦"
