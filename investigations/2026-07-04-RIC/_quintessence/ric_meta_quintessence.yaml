causalites:
  - cause: "F-META-14"
    effet: "F-META-08"
    mecanisme: "Le biais de complaisance LLM (73% validation utilisateur, Anthropic 2024) + le syndrome du premier draft (Tow 2024) produisent un score GATE_G CIV-RIC-001 à 27,6%, bien sous le seuil APEX 85%."
  - cause: "F-META-17"
    effet: "F-META-01"
    mecanisme: "Le biais d'autorité LLM (Stanford 2026) transfert la crédibilité perçue (académique) à des profils experts-militants : Magni-Berton (académique + co-fondateur SD), Egger (spécialiste + candidate), Schoettl (académique + doctrinal)."
  - cause: "F-META-15"
    effet: "F-META-08"
    mecanisme: "Le ratio 24/87 phrases assertives (27,6%) se situe exactement dans la zone 20-30% identifiée par Pew 2025 comme 'zone à risque d'extrapolation' pour les enquêtes LLM."
  - cause: "F-META-22"
    effet: "F-META-23"
    mecanisme: "L'obstruction majoritaire dans les niches (Geynet-Dussauze 2022) est renforcée paradoxalement par la réforme Ferrand 2019 : suppression des motions de rejet, le texte passe en commission, mais le déluge d'amendements le tue en séance."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le RIC est verrouillé par un consensus transpartisan de rejet. Le diagnostic CIV-RIC-001 est correct dans son architecture mais déficient dans sa rigueur forensique."
  - position: "Antithèse"
    argument: "Le 'cartel transpartisan' est une simplification pédagogique incorrecte. La convergence est structurelle, pas conspirative. Risques réels : démagogie, capture par argent, irréversibilité des décisions. Pas de preuve de coordination explicite entre partis."
  - position: "Synthèse"
    argument: "Le RIC n'est pas un outil miracle mais une conquête démocratique. La Suisse (10% succès), l'Uruguay (15 consultations depuis 1985), l'Ostbelgien (5 ans) démontrent sa faisabilité opérationnelle. L'absence de précédent français s'explique par l'ADN de 1958, pas par l'impossibilité technique."

limites:
  - "META-001 §1.5 score biais complaisance LLM : 8/10 (syndrome premier draft)."
  - "5 lièvres identifiés mais non tous corrigés dans la version finale (notamment M5S capture)."
  - "9 zones d'ombre initiales, 2 persistantes (analyse INA quantitative + enquête AdL)."
  - "Le premier draft syndrome n'est pas documenté empiriquement (Tow 2024 est théorique)."
  - "La convergence structurelle d'intérêts (anti-cartel) est conceptuelle, pas empiriquement prouvée."

wolves:
  - nom: "Constitutionalistes anti-RIC (Schoettl, Maus, de Béchillon)"
    argument: "10 objections au RIC : contournement Parlement, capture lobbies, irréversibilité, etc."
    reponse: "Objections résolues ailleurs (Suisse, Uruguay, Ostbelgien) ; le précédent californien est pris en compte par Doctrine de la Terre Brûlée (interdiction personnes morales)."
  - nom: "Cartel transpartisan (LREM, LR, PS, EELV, PCF, RN)"
    argument: "Aucun parti ne vote sa propre obsolescence ; convergence structurelle d'intérêts anti-RIC."
    reponse: "Le RIC ne supprime pas le Parlement, il le complète. Le monopole est brisé par addition d'initiative citoyenne."
  - nom: "Biais de complaisance LLM (Anthropic 73%)"
    argument: "Le LLM privilégie la validation utilisateur plutôt que la correction d'hypothèses fausses."
    reponse: "META-001 introduit l'auto-critique comme garde-fou (ICE 2024, 4 mécanismes métacognitifs)."
  - nom: "M5S capture Casaleggio (P3 22-00)"
    argument: "L'exemple italien démontre que les mouvements pro-démocratie directe sont capturés institutionnellement."
    reponse: "Solution Démocratique doit intégrer des garde-fous anti-capture (open-source gouvernance, taux limité, neutralité plateforme)."

iceberg:
  - "Connexion M5S (capture Casaleggio) et CIV-RIC-001 (verrouillage) : deux angles du même verrouillage (capture privée + verrou public)."
  - "Le 'cartel transpartisan' est une simplification pédagogique incorrecte (META-001 §4.1)."
  - "Le précédent Schoettl 2023 avec 10 objections est sous-documenté dans CIV-RIC-001."
  - "Le biais de complaisance LLM (73% validation) est un angle mort de la production académique LLM en général."
  - "META-001 §11.4 note une zone non couverte : 'Qui meurt professionnellement' sans identification précise d'acteur (gap M4 persistant)."

