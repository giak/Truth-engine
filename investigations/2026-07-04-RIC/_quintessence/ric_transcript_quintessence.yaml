causalites:
  - cause: "F-RT-04"
    effet: "F-RT-05"
    mecanisme: "L'instauration du RIC constituant suisse (1891) produit un taux de succès de seulement 10% : ce qui ne réduit pas sa valeur symbolique mais révèle son rendement opérationnel limité."
  - cause: "F-RT-22"
    effet: "F-RT-08"
    mecanisme: "La critique weilienne (1943) du parti comme machine à passion collective anticipe l'absorption institutionnelle : 80 ans plus tard, la Convention citoyenne climat produit 149 propositions (dont RIC climat) dont 90% ne sont pas appliquées."
  - cause: "F-RT-14"
    effet: "F-RT-01"
    mecanisme: "La publicité des parrainages (Hollande 2012) dissuade les maires ruraux, ce qui explique les 36 parrainages d'Egger sur 500 en 2022 : verrou symétrique à l'absence de RIC."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "Le RIC constituant est la seule mesure qui déplace le pouvoir du cartel partisan vers le peuple, avec un effet de dissuasion suffisant même sans usage effectif (transcript §5)."
  - position: "Antithèse"
    argument: "Les risques réels : démagogie, manipulation, capture par les lobbies, irréversibilité des décisions (cf. Schoettl 2023) ; le peuple n'est pas toujours éclairé et l'abstention massive prouve son désintérêt."
  - position: "Synthèse"
    argument: "Le RIC n'est pas un outil miracle mais une conquête démocratique. Comme le suffrage universel (1848) ou le droit de vote des femmes (1944), il faut l'instaurer même si le rendement opérationnel est modéré."

limites:
  - "Transcript §7 : aucune restriction de fond sur le RIC suisse sauf intégrité du territoire et forme républicaine (art. 89 al. 4)."
  - "Le RIC ne peut pas se constituer par RIC lui-même : il faut une révision constitutionnelle préalable qui exige une majorité 3/5 du Congrès : circularité."
  - "Le transcript ne cite aucune source empirique vérifiable sur le soutien 75% des Français au RIC constituant depuis 2010."
  - "Le parallèle avec l'Italie (M5S) est absent du transcript : c'est une omission significative documentée par P3 22-00."

wolves:
  - nom: "9 propriétaires médias français"
    argument: "Concentration bloque tout débat RIC par omission et délégitimation."
    reponse: "Le RIC crée un canal média-citoyen structurel (SecNumCloud + X-Road) qui bypasse le walled garden médiatique."
  - nom: "Sénat LR majoritaire"
    argument: "L'art. 89 al. 4 bloque tout RIC constituant plénier portant atteinte à la forme républicaine."
    reponse: "Le RIC ne touche pas à la forme républicaine (transcript §7) ; il constitutionnalise le pouvoir constituant du peuple sans abolir la République."

iceberg:
  - "Sujet immergé : la fonction de verrou du parrainage (500 maires) : non discutée publiquement alors qu'elle est le symétrique parfait de l'absence de RIC."
  - "Connexion non explicitée avec les enquêtes P0 m5s_italie et P1 coordination_europeenne."
  - "Schoettl 2023 (Club des Juristes) non cité comme contradicteur sérieux : biais de source manifeste."
  - "Le Transcript ne traite pas la dimension M5S italienne alors que c'est un cas d'école de capture du mouvement citoyen."

