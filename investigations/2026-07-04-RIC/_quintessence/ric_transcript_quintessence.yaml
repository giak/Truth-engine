these_centrale: "Le système politique français est verrouillé par conception, pas par accident : changer d'élu sans changer les règles ne change rien ; le RIC constituant est la seule mesure qui déplace le pouvoir du cartel partisan vers le peuple, avec un effet de dissuasion nucléaire suffisant même sans usage effectif."

theses_implicites:
  - "L'illusion démocratique française s'est construite dès 1789 par l'écrasement du projet Condorcet de mandat impératif par la Terreur, installant un biais de 230 ans en faveur du projet B représentatif."
  - "La concentration ploutocratique française (1,53× selon Manerton-Varen) est le produit mécanique d'un système de règles, pas d'une conspiration ; seul le RIC change la matrice de sélection des décideurs."
  - "Le RIC constituant n'est pas un outil de gestion mais une conquête démocratique au même titre que le suffrage universel (1848) ou le droit de vote des femmes (1944) : un changement de régime, pas une réforme paramétrique."
  - "Le parrainage citoyen (que la France refuse seule parmi les démocraties) est un verrou symétrique à l'absence de RIC : le peuple ne peut ni proposer ni valider les candidats, verrou complet de la compétition démocratique."

faits_atomiques:
  - id: "F-RT-01"
    enonce: "Clara Egger a obtenu 36 parrainages sur 500 requis pour la présidentielle 2022, le plus haut score d'un mouvement citoyen non structuré en parti."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "Transcript §3"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-02"
    enonce: "La France est le seul pays au monde à élire son président au suffrage universel direct sans permettre le parrainage citoyen ; les maires détiennent seuls le pouvoir de déterminer l'offre politique."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "Transcript §3"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-03"
    enonce: "Le soutien populaire au RIC constituant est stable à environ 75% depuis 2010 (transcript §9) ; ce consensus n'a jamais été traduit en action législative."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "Transcript §9"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-04"
    enonce: "Suisse : initiative populaire fédérale depuis 1891 (Constitution fédérale art. 138-139) ; Uruguay : référendum d'initiative depuis 1919 (Constitution art. 79, 304)."
    source_url: "https://www.admin.ch/"
    source_section: "Transcript §7"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-05"
    enonce: "Taux de succès des initiatives populaires suisses au niveau fédéral : environ 10% (admin.ch, ch.ch) ; preuve que le RIC n'est pas un outil miracle mais un mécanisme à faible rendement opérationnel."
    source_url: "https://www.ch.ch/"
    source_section: "Transcript §7"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-06"
    enonce: "Suisse initiative populaire générale abandonnée officiellement en 2003 par le Parlement comme inapplicable et trop complexe (ch.ch archives)."
    source_url: "https://www.ch.ch/"
    source_section: "Transcript §7"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-07"
    enonce: "Concentration ploutocratique française : les plus fortunés pèsent 1,53× plus que les pauvres (Raoul Manerton / Simon Varen 2025, European Journal of Political Economy)."
    source_url: "https://www.tandfonline.com/"
    source_section: "Transcript §1"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-08"
    enonce: "Convention citoyenne pour le climat (2019-2020) : 149 propositions dont le RIC climat, majorité rejetée ou vidée de substance ; taux de mise en œuvre global inférieur à 10%."
    source_url: "https://www.conventioncitoyennepourleclimat.fr/"
    source_section: "Transcript §1"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-09"
    enonce: "Constitution 1958 ne prévoit aucun droit d'initiative populaire directe (ni législatif, ni constitutionnel) ; seule la révision art. 89 avec majorité 3/5 Congrès est ouverte."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "Transcript §5"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-10"
    enonce: "Article 89 al. 4 Constitution : aucune révision ne peut porter atteinte à la forme républicaine du gouvernement : verrou formel ultime contre RIC constituant plénier."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "Transcript §9"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-11"
    enonce: "Le Transcript documente un cas paradigmatique de walled garden médiatique : France Culture a répondu à Clara Egger que 'la démocratie n'est pas un enjeu prioritaire dans cette campagne' 2022."
    source_url: "https://www.franceculture.fr/"
    source_section: "Transcript §4"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-12"
    enonce: "Espoir RIC 2022 → transformation en Solution Démocratique (Oswald Chandelier) en 2023 : trajectoire typique du mouvement citoyen absorbé par le cycle électoral (transcript §13)."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "Transcript §9"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-13"
    enonce: "Mandats impératifs actuellement interdits en France par la Constitution ; le transcript propose un contournement par engagement sur les biens personnels devant notaire (contrat de droit privé)."
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "Transcript §2"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-14"
    enonce: "Publicité des parrainages (introduite sous Hollande) dissuade les maires des petites communes qui craignent des représailles locales : confirme l'asymétrie d'accès entre candidats partisans et citoyens."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "Transcript §3"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-15"
    enonce: "Gilets Jaunes (2018-2019) : le passage sur BFMTV du 8 décembre 2018 a fait passer à +25 000 abonnés Facebook en une soirée pour une figure GJ, preuve de la force de feu médiatique concentrée."
    source_url: "https://www.bfmtv.com/"
    source_section: "Transcript §4"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-16"
    enonce: "Le transcript §8 documente un paradoxe empirique : dans les pays dotés du RIC constituant, les plus satisfaits du système sont ceux qui gagnent rarement les référendums : preuve d'acceptation procédurale par la minorité perdante."
    source_url: "https://www.ch.ch/"
    source_section: "Transcript §8"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-17"
    enonce: "Citation du transcript §1 : 'Le problème n'est pas un problème de joueurs, mais de règles du jeu (métaphore du Monopoly). Changer d'élu sans changer les règles ne change rien.' : cadre analytique fondateur."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "Transcript §1"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-18"
    enonce: "Le transcript §11 documente l'exemple de Gaë (citoyen) qui, terrorisé à l'idée d'appeler des maires, en appelle 40 par jour en 3 mois et obtient des parrainages chaque semaine."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "Transcript §11"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-19"
    enonce: "Politique étrangère et immigration (transcript §7) : Suisse initiative en cours pour limiter la population à 10 millions : preuve que le RIC permet l'expression de préférences populaires impopulaires sans violence."
    source_url: "https://www.admin.ch/"
    source_section: "Transcript §7"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-20"
    enonce: "Le transcript §10 cite 3 effets concrets du RIC : (1) contrôle budgétaire citoyen (Suisse vote budgets), (2) justice lisible (Suisse délais courts), (3) fin de la répression des manifestations (puisque le RIC remplace la rue)."
    source_url: "https://www.ch.ch/"
    source_section: "Transcript §10"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-21"
    enonce: "Le transcript §6 cite l'échec chilien : deux constitutions rejetées par référendum chilien, retour à la case départ. Différence entre Assemblée constituante (représentative) et RIC constituant (direct)."
    source_url: "https://www.bcn.cl/"
    source_section: "Transcript §6"
    tier: 2
    glyphe: "✧"
  - id: "F-RT-22"
    enonce: "Le transcript cite Simone Weil (1943, Note sur la suppression générale des partis politiques) pour la critique du parti comme 'machine à fabriquer de la passion collective' dont la seule fin est sa propre croissance."
    source_url: "https://www.gallimard.fr/"
    source_section: "Transcript §8"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-23"
    enonce: "Constitution du 4 octobre 1958 art. 3 : 'La souveraineté nationale appartient au peuple.' : texte utilisé par les pro-RIC eux-mêmes, retourné contre les opposants par Manerton/Varen 2025."
    source_url: "https://www.conseil-constitutionnel.fr/"
    source_section: "Transcript §1"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-24"
    enonce: "Le transcript §3 confirme que la publicité des parrainages a été introduite en 2012 (loi du 6 décembre 2012, art. 3) : 'Hollande a ajouté la publicité des parrainages ; en pratique, les maires ruraux sont dissuadés par crainte de représailles.'"
    source_url: "https://www.legifrance.gouv.fr/"
    source_section: "Transcript §3"
    tier: 1
    glyphe: "✦"
  - id: "F-RT-25"
    enonce: "L'interviewer François Boulot a publié plusieurs interviews majeures du mouvement pro-RIC : Egger, Lassalle, Magni-Berton, etc. : constitue une archive média-citoyenne structurante du mouvement."
    source_url: "https://www.solution-democratique.fr/"
    source_section: "Transcript header"
    tier: 3
    glyphe: "✧"

