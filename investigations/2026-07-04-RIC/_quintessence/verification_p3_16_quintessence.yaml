causalites:
  - cause: "F-PNR-CAS-1"
    effet: "F-PNR-CAS-8"
    mecanisme: "L'absence de vérification tierce sur les dates fictives (Cass. 5 fév. 2025) et numéros d'articles erronés (Sécurité Globale art. 11-13-15 vs 20-21-22) produit la catégorie « Erreurs factuelles par non-vérification LLM »."
  - cause: "F-PNR-CAS-3"
    effet: "F-PNR-CAS-4"
    mecanisme: "Les modèles CivicTech étrangers (Taïwan fictif loi 2016 + Section 108 NIS ; Bâle-Ville 2019 Bürgerrat inexistant) illustrent le pattern « ancrage sur un cadre séduisant sans vérification empirique »."
  - cause: "F-PNR-CAS-9"
    effet: "F-PNR-CAS-2"
    mecanisme: "Les modèles étrangers (Allemagne 20a 1994 ; Italie Loi 352/1970) corrigés par tierce vérification montrent que la précision juridique LLM requiert une consultation sources institutionnelles systématique."

perspectives_dialectiques:
  - position: "Thèse"
    argument: "La tierce vérification produit une réduction honnête du score de couverture (96 % → 72 %) et une crédibilité méthodologique accrue (88 % KERNEL §11)."
  - position: "Antithèse"
    argument: "La régression 96 % → 72 % peut être lue comme un aveu d'échec ; le pipeline LLM reste insuffisant pour la production juridique constitutionnelle française."
  - position: "Synthèse"
    argument: "L'auto-correction transparente produit un dossier plus solide qu'un auto-revendication 96 % fictionnel. La crédibilité réside dans la posture, pas dans le score."

limites:
  - "5 sources non-vérifiables publiquement (F-PNR48 DINUM budget détail forfaitaire ; F-PNR49 Pacte FRANCS budget 1,5 M€/RIL × 500 ; F-PNR66 CCP 24-90 sortition + CS tripartite)."
  - "5 faits prospectifs hors scope vérification historique (F-PNR67 + 68 + 69 + 70 CivicTech-FR budget cumulé + vote Sénat Pacte 2027 + Loi LOPPSI 4 juillet 2029 + CivicTech-FR budget cumulé T0-T+60)."
  - "Le Bürgerrat-FR extrapolé du Bürgerrat Ostbelgien (24-90 sur 68 M hab.) reste sans précédent empirique en France."
  - "L'article P3 #16 ne cite pas explicitement le résultat 96 % → 72 % antérieur ; la comparaison 88 % KERNEL §11 est seulement post-correction."

wolves:
  - nom: "Anti-Pacte CivicTech-FR (lobby GAFAM + Sénat LR+UC)"
    argument: "Le pack CivicTech-FR est fragilisé par la tierce vérification (9 réfutations sur 38)."
    reponse: "Les 11 confirmations + 11 partiels + 5 prospectifs sur 38 produisent un score 88 % KERNEL §11 ; le pack reste opérationnel après amendements C1-C12."
  - nom: "Faction Loyola sondage fictif"
    argument: "La suppression du sondage Loyola = perte d'argumentaire pro-RIC 65-72 %."
    reponse: "Loyola = Facultés jésuites, pas institut sondage ; les données IFOP 2019 / Harris 2019 / IPSOS 2024 réelles (65-72 % pro-RIC constituant) sont toujours disponibles."
  - nom: "Faction CC 2024-866 DC = PPL Bardella RIC"
    argument: "La rectification CC 2024-866 DC = Loi SREN fragilise l'argumentaire PPL Bardella RIC."
    reponse: "Aucune décision CC spécifique sur PPL Bardella RIC n'existe ; la rectification révèle l'absence de précédent constitutionnel, pas un affaiblissement."

iceberg:
  - "Le score KERNEL §11 88 % révisé est la marqueur de la différence entre auto-déclaration 96 % fictionnelle et tierce vérification réelle."
  - "Les 12 faits ❧ indéterminés (F-PNR48 + 49 + 66 + 5 prospectifs F-PNR67-70) restent hors scope vérification tierce."
  - "Le mouvement FRANCS (F-PNR31) est toujours absent du RNA greffe Paris 2025-2026 (P3 #16 §7.2)."
  - "Loyola Paris = Facultés Loyola 35 rue de Sèvres 75006 = enseignement supérieur jésuite."

