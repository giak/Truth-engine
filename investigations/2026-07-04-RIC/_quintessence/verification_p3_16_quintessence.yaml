mnemolite_status: "DOWN - non-interrogé, mode dégradé cross-séries"

these_centrale: "La tierce vérification indépendante des 38 nouveaux F-PNR33-F-PNR70 introduits dans P3 #16 LOIS-CIVICTECH-2027 aboutit à 11 ✅ confirmés (29 %), 11 ⚠️ partiels (29 %), 9 ❌ réfutés (24 %), 3 ❓ indéterminés (8 %), 5 ⁂ prospectifs (13 %) - 1 doublon = 38 uniques ; couverture P3 #16 régressée de 96 % à 72 % effective post-application 26 corrections C1-C12 ; conformité KERNEL §11 révisée à 88 %."

theses_implicites:
  - "Un dossier auto-déclaré à 96 % de couverture sans tierce vérification contient 24 % d'erreurs factuelles non détectées sur 38 F-PNR (F-PNR35 + 43 + 45 + 52 + 53 + 54 + 58 + 61 + 63)."
  - "Les fictions Loyola sondage 2026 (Loyola = Facultés jésuites, pas institut sondage) et CC 2024-866 DC = Loi SREN numérique (≠ PPL Bardella RIC) illustrent l'inertie du pipeline LLM qui s'auto-cite sans re-vérification."
  - "La posture forensique non-masquée (88 % KERNEL §11 vs 96 % P3 #16 antérieur) est ce qui distingue ce dossier d'une flagornerie narrative ; l'auto-réduction de score produit la crédibilité méthodologique réelle."

faits_atomiques:
  - id: "F-PNR-CAS-1"
    enonce: "F-PNR35 Cass. 5 février 2025 = fiction ; aucune jurisprudence datée 5 février 2025 ne confirme Cass. sur art. 222-14-2. Jurisprudence constante Cour de cassation sur l'élément moral (intention + présence équipée) sans date précise 2025."
    source_url: "https://www.courdecassation.fr/recherche-jurisprudence"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-2"
    enonce: "F-PNR43 Italie hit 25/30 = 83 % référendums aboutis = inverse de la réalité. Loi n° 352 du 22 novembre 1970 ; quorum 50 % + 1 difficile + abstention politique stratégique produit un taux de succès historique < 50 % sur les référendums abrogatifs italiens."
    source_url: "https://www.interno.gov.it/it"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-3"
    enonce: "F-PNR45 Loi CivicTech Taïwan 2016 + Section 108 NIS = double fiction. Pas de loi formellement « Government Technology Innovation and Civic Participation Act » 2016 ; Cybersecurity Management Act 2018 (資通安全管理法) sans « Section 108 » identifiable. Cadre Civic Tech taïwanais = héritage g0v 2012- + JOIN.open + Audrey Tang 2016-2024."
    source_url: "https://join.gov.tw/"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-4"
    enonce: "F-PNR52 Conseil Citoyen Bâle-Ville 2019 permanent = inexistant. Bâle-Ville organise ponctuellement des panels citoyens thématiques (climat BUE 2024, mobilité 2022) mais ce ne sont pas des Bürgerrat permanents. Bürgerrat-FR = modèle Bürgerrat Ostbelgien extrapolé, PAS Bürgerrat bâlois."
    source_url: "https://www.bs.ch/"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-5"
    enonce: "F-PNR53 Pacte Civique Italien 1999 = confusion triple. Pacte Civique italien = Servizio Civile Nazionale (service civique national volontaire) Loi n° 64 du 6 mars 2001, pas loi référendaire. Référendum d'initiative abrogative italien = Loi n° 352 du 22/11/1970 (art. 75 Constitution italienne)."
    source_url: "https://www.interno.gov.it/it"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-6"
    enonce: "F-PNR54 Bahamas 2006 Citizens'Initiative révocatoire = fiction. Aucun acte référendaire automatique « Citizens'Initiative Act 2006 » aux Bahamas. Cadre référendaire Bahamas = art. 60 Constitution Bahamas 1973 sans mécanisme automatique de révocation d'élus."
    source_url: "https://www.bahamasparliament.gov.bs/"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-7"
    enonce: "F-PNR58 Espagne LO 2/1980 referendum consultivo art. 87.3 = confusion triple. LO 2/1980 du 18 janvier 1980 = Ley Orgánica sobre Regulación de las Distintas Modalidades de Referéndum (modalités référendum). LO 2/2006 du 3 mai 2006 = Ley Orgánica de Educación (LOE, pas de rapport avec référendum). Initiative populaire espagnole = art. 87.3 Constitution espagnole 1978 (500 000 signatures)."
    source_url: "https://www.boe.es/"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-8"
    enonce: "F-PNR61 Loi Sécurité Globale 2020 CC 2021-813 DC art. 11-13-15 = numéros erronés. CC 2021-813 DC du 20 mai 2021 censure art. 20 (sociétés sécurité privée) + 21 (caméras piétons police municipale) + 22 (drones forces de l'ordre), PAS art. 11-13-15."
    source_url: "https://www.conseil-constitutionnel.fr/decision/2021/2021813DC.htm"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"
  - id: "F-PNR-CAS-9"
    enonce: "F-PNR63 Allemagne Klima-Protection 2021 révisée 20a GG = confusion historique. Art. 20a Grundgesetz = protection environnement, introduit 1994 (28. Gesetz zur Änderung des Grundgesetzes). BKSG (Bundes-Klimaschutzgesetz) adopté 12 décembre 2019 (loi initiale) ; révision 21 juin 2021 post-arrêt Karlsruhe BVerfG 1 BvR 2656/18 du 24 mars 2021 (Neubauer et autres c. Allemagne)."
    source_url: "https://www.bundesverfassungsgericht.de/SharedDocs/Entscheidungen/EN/2021/03/rs20210324_1bvr265618en.html"
    source_section: "P3 #18 §6"
    tier: 1
    glyphe: "✦"

